name: TEMP Battle BFI Other3 Expectation R2

on:
  push:
    branches:
      - sol/battle-bfi-other3-expectation-r2-20260914
    paths:
      - .github/workflows/zz-temp-battle-bfi-other3-expectation-r2.yml

permissions:
  contents: read

jobs:
  diagnose-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-bfi-other3-expectation-r2-20260914
          fetch-depth: 0
      - name: Print exact stale anchors with context only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-full-interaction.spec.mjs')
          lines = path.read_text(encoding='utf-8').splitlines()
          needle = "await expect(battle.locator('#publicPlayerStrip .publicPlayerChip')).toHaveCount(4);"
          hits = [i for i, line in enumerate(lines) if needle in line]
          print('HITS', [i + 1 for i in hits])
          if len(hits) != 2:
              raise SystemExit(f'expected 2 anchors after R2 fail-close, got {len(hits)}')
          for i in hits:
              lo = max(0, i - 12)
              hi = min(len(lines), i + 13)
              print(f'--- CONTEXT {i+1} lines {lo+1}-{hi} ---')
              for n in range(lo, hi):
                  print(f'{n+1}: {lines[n]}')
          PY
          git diff --exit-code
