name: zz-temp-road-move-pathauth-r3

on:
  push:
    branches:
      - sol/road-move-pathauth-r3-20260906

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect board input and position mutation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          patterns={
            'BOARD_LISTENER': r'ui\.board.{0,260}addEventListener|addEventListener.{0,260}ui\.board',
            'NODE_CLOSEST': r'closest\([^\)]{0,120}(?:\.node|data-pos)[^\)]*\)',
            'NODE_LISTENER': r'\b(?:b|node|btn)\.addEventListener\([^\)]{0,160}(?:click|pointer)',
            'DATASET_POS': r'dataset\.pos',
            'PLAYER_NODE_ASSIGN': r'\b[A-Za-z_$][A-Za-z0-9_$]*\.node\s*=',
            'PLAYER_NODE_OBJECT': r'\bnode\s*:\s*[A-Za-z_$][A-Za-z0-9_$\.\[\]"\'?-]*',
            'NODE_SET': r'\.node\s*=\s*[A-Za-z_$"\']',
            'ROAD_SELECT_LISTENER': r'roadSelect.{0,260}addEventListener|addEventListener.{0,260}roadSelect',
            'READY_LISTENER': r'readyPlan.{0,320}addEventListener|addEventListener.{0,320}readyPlan',
            'PLAN_FN': r'function\s+[A-Za-z_$][A-Za-z0-9_$]*(?:Plan|plan|Road|road|Node|node|Path|path)[A-Za-z0-9_$]*\s*\(',
            'PATH_CALL': r'\b[A-Za-z_$][A-Za-z0-9_$]*(?:Path|path)[A-Za-z0-9_$]*\s*\(',
          }
          for label,rx in patterns.items():
            ms=list(re.finditer(rx,text,re.I|re.S))
            print(f'\n=== {label} count={len(ms)} ===')
            for i,m in enumerate(ms[:40]):
              lo=max(0,m.start()-1300); hi=min(len(text),m.end()+2300)
              print(f'--- {label} {i+1} at {m.start()} ---')
              print(text[lo:hi].replace('\r',''))

          for token in ['pathCounts(', 'buildAdj(', 'renderBoard', 'renderBattle', 'roadSelect.value', 'battleSelect.value', 'readyPlan.disabled', 'm.players', '.node=', '.node =']:
            ps=[m.start() for m in re.finditer(re.escape(token),text,re.I)]
            print(f'\n=== TOKEN {token} count={len(ps)} ===')
            for i,pos in enumerate(ps[:30]):
              lo=max(0,pos-1500); hi=min(len(text),pos+len(token)+2600)
              print(f'--- {token} {i+1} at {pos} ---')
              print(text[lo:hi].replace('\r',''))
          PY
