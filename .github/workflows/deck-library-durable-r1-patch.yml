name: Deck library durable readback R1 patch

on:
  push:
    branches:
      - sol/deck-library-durable-r1-20260905
    paths:
      - .github/workflows/deck-library-durable-r1-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/deck-library-durable-r1-20260905
          fetch-depth: 0

      - name: Apply fail-closed Deck durability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('browser/GAMEROAD.html')
          text = html_path.read_text(encoding='utf-8')

          old_import = "const { inspectRawSave, classifyDeckProjection, prepareExplicitDeckCommit, readStorage, writePreparedSaveVerified, resetExplicitSaveKeys } = globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE;"
          new_import = "const { inspectRawSave, classifyDeckProjection, prepareExplicitDeckCommit, readStorage, writePreparedSaveVerified, resetExplicitSaveKeys, DECK_SAVE_RECOVERY_CORE } = globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE;"
          old_write = "function writeDeckLibrary(){try{localStorage.setItem(DECK_LIBRARY_KEY,JSON.stringify({schema:'gameroad.deck-slots.v1',slots:state.deckSlots.map(cloneDeckRecord)}));return true}catch(_){return false}}"
          new_write = json.loads(r'''"function writeDeckLibrary(slots=state.deckSlots){const serialized=JSON.stringify({schema:'gameroad.deck-slots.v1',slots:slots.map(cloneDeckRecord)}),prepared={schema:DECK_SAVE_RECOVERY_CORE.schema,status:'prepared',serialized},written=writePreparedSaveVerified(localStorage,DECK_LIBRARY_KEY,prepared);return written}\nfunction restoreLocalRawVerified(key,raw){try{if(raw===null)localStorage.removeItem(key);else localStorage.setItem(key,raw);return localStorage.getItem(key)===raw}catch(_){return false}}"''')
          new_commit = json.loads(r'''"function commitDeck(){const structural=deckStorageCheck(state.deckDraft);if(!structural.ok){toast(structural.error);renderCards();return false}const nextDeck=cloneDeckRecord(state.deckDraft),nextSlots=state.deckSlots.map(cloneDeckRecord);nextSlots[state.selectedDeckIndex]=cloneDeckRecord(nextDeck);const eligibility=deckEligibility(nextDeck);let stampedPrepared=null,previousSaveRaw=null;if(eligibility.usable){const nextDeckRecord={...nextDeck,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision},nextProjection={saveRevision:3,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision,deckSize:nextDeck.main.length,deckLegal:true},read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){markStorageReadFailure(read.reason);renderCards();renderSetupDeckStatus();toast('\u7aef\u672b\u3078\u30c7\u30c3\u30ad\u3092\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093');return false}const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection),prepared=prepareExplicitDeckCommit({inspection,currentClassification:classification,path:['deck'],nextDeckRecord,nextProjection,authority:SAVE_AUTHORITY});if(prepared.status!=='prepared'){saveRecoveryRuntime.write=prepared;state.storage='memory';renderCards();renderSetupDeckStatus();toast('\u7aef\u672b\u4fdd\u5b58\u3092\u4fdd\u8b77\u3057\u305f\u305f\u3081\u3001\u30c7\u30c3\u30ad\u306f\u672a\u4fdd\u5b58\u306e\u307e\u307e\u3067\u3059');return false}const currentPack=savePack();currentPack.deck=nextDeckRecord;const stampedRoot={...mergeKnownPack(prepared.nextRoot,currentPack),v:3};stampedPrepared={...prepared,serialized:JSON.stringify(stampedRoot),nextRoot:stampedRoot};const latest=readStorage(localStorage,SAVE_KEY);if(latest.status!=='read'||latest.rawValue!==read.rawValue){saveRecoveryRuntime.write={status:'failed',reason:latest.status==='read'?'SAVE_CHANGED_DURING_WRITE':latest.reason};state.storage='memory';renderCards();renderSetupDeckStatus();toast('\u7aef\u672b\u4fdd\u5b58\u304c\u5909\u308f\u3063\u305f\u305f\u3081\u3001\u30c7\u30c3\u30ad\u306f\u672a\u4fdd\u5b58\u306e\u307e\u307e\u3067\u3059');return false}previousSaveRaw=read.rawValue;const written=writePreparedSaveVerified(localStorage,SAVE_KEY,stampedPrepared);saveRecoveryRuntime.write=written;if(written.status!=='saved'){state.storage='memory';renderCards();renderSetupDeckStatus();toast('\u7aef\u672b\u3078\u30c7\u30c3\u30ad\u3092\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093');return false}}const libraryWritten=writeDeckLibrary(nextSlots);if(libraryWritten.status!=='saved'){if(stampedPrepared){const rolledBack=restoreLocalRawVerified(SAVE_KEY,previousSaveRaw);saveRecoveryRuntime.write={status:'failed',reason:rolledBack?'DECK_LIBRARY_WRITE_FAILED_ROLLED_BACK':'DECK_LIBRARY_WRITE_FAILED_ROLLBACK_FAILED',originalPreserved:rolledBack,rolledBack};state.storage=rolledBack&&previousSaveRaw!==null?'localStorage':'memory'}renderCards();renderSetupDeckStatus();toast('\u7aef\u672b\u3078\u30c7\u30c3\u30ad\u3092\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093');return false}state.deckSlots=nextSlots;state.savedDeck=cloneDeckRecord(nextDeck);state.savedDeckRule={id:DECK_RULE.id,revision:DECK_RULE.revision};if(stampedPrepared){memorySave=stampedPrepared.serialized;state.storage='localStorage';state.saveAuthorityDeck=cloneDeckRecord(nextDeck);state.saveAuthorityDeckRule={id:DECK_RULE.id,revision:DECK_RULE.revision}}clearDeckDraftSession();renderCards();renderSetupDeckStatus();if(typeof ctxSet==='function')ctxSet('DECK_SAVED',{kind:'ok',ttl:2200});toast(`\u30c7\u30c3\u30ad${selectedDeckNumber()}\u3092\u4fdd\u5b58\u3057\u307e\u3057\u305f`);return true}"''')

          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor drift: {text.count(old_import)}')
          if text.count(old_write) != 1:
              raise SystemExit(f'writeDeckLibrary anchor drift: {text.count(old_write)}')
          if 'function restoreLocalRawVerified(' in text:
              raise SystemExit('restoreLocalRawVerified already exists')

          start = text.find('function commitDeck(){')
          end = text.find('\nfunction restoreDeck(){', start)
          if start < 0 or end <= start:
              raise SystemExit('commitDeck boundary drift')
          old_commit = text[start:end]
          required_legacy = [
              'state.deckSlots[state.selectedDeckIndex]=cloneDeckRecord(nextDeck)',
              'if(!writeDeckLibrary())',
              'clearDeckDraftSession()',
              'writePreparedSaveVerified(localStorage,SAVE_KEY,stampedPrepared)',
          ]
          missing = [marker for marker in required_legacy if marker not in old_commit]
          if missing:
              raise SystemExit(f'commitDeck legacy anchors drift: {missing}')

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_write, new_write, 1)
          start = text.find('function commitDeck(){')
          end = text.find('\nfunction restoreDeck(){', start)
          text = text[:start] + new_commit + text[end:]
          html_path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          node --test tests/deck-save-recovery-core.test.mjs tests/deck-library-durable-save.test.mjs

      - name: Commit tested product delta
        shell: bash
        run: |
          git config user.name "gameroad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add browser/GAMEROAD.html
          git diff --cached --quiet && { echo "expected product diff missing"; exit 1; }
          git commit -m "fix: verify Deck library durability before saved state"
          git push origin HEAD:sol/deck-library-durable-r1-20260905
