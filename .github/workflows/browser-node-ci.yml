name: Browser Node CI

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'browser/GAMEROAD.html'
      - 'tests/browser-static-check.mjs'
      - '.github/workflows/browser-node-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'browser/GAMEROAD.html'
      - 'tests/browser-static-check.mjs'
      - '.github/workflows/browser-node-ci.yml'

permissions:
  contents: write

jobs:
  free4p-r18-terminal-round-executor:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'work/free4p-r18-terminal-round-projection' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact R18 head branch
        uses: actions/checkout@v4
        with:
          ref: work/free4p-r18-terminal-round-projection
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard patch target and RED witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "56987ad3c5f820eba08b2aadf7cc0c0b3a89d041"
          grep -Fq "Free4P omitted formalRanking cannot derive from accepted progress belonging to a different terminal round" tests/battle-replay-live-adapter.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser/battle-replay-live-adapter.mjs').read_text(encoding='utf-8')
          assert s.count('function deriveFree4pFormalRankingFromAcceptedReplay(log, winnerIds) {') == 1
          assert s.count("    if (event.publicData?.mode !== '4p') return null;\n    const progress = event.publicData?.maxLaneProgress;") == 1
          assert s.count('    const derivedRanking = deriveFree4pFormalRankingFromAcceptedReplay(session.log, normalizedWinnerIds);') == 1
          PY

      - name: Patch only terminal-round provenance binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/battle-replay-live-adapter.mjs')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('function deriveFree4pFormalRankingFromAcceptedReplay(log, winnerIds) {',
             'function deriveFree4pFormalRankingFromAcceptedReplay(log, winnerIds, terminalRound) {'),
            ("    if (event.publicData?.mode !== '4p') return null;\n    const progress = event.publicData?.maxLaneProgress;",
             "    if (event.publicData?.mode !== '4p') return null;\n    if (event.publicData?.round !== terminalRound) return null;\n    const progress = event.publicData?.maxLaneProgress;"),
            ('    const derivedRanking = deriveFree4pFormalRankingFromAcceptedReplay(session.log, normalizedWinnerIds);',
             '    const derivedRanking = deriveFree4pFormalRankingFromAcceptedReplay(session.log, normalizedWinnerIds, publicData.round);')
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'R18_PATCH_GUARD_FAILED count={s.count(old)} target={old[:80]!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Run formal replay regression lane
        run: node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs tests/partner-battle-event-log-projection.test.mjs tests/battle-replay-public-commentary-core.test.mjs

      - name: Restore executor and commit only product delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/browser-node-ci.yml
          git diff --check
          changed="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          printf '%s\n' "$changed" | sort -u
          git config user.name 'gameroad-free4p-r18-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/battle-replay-live-adapter.mjs .github/workflows/browser-node-ci.yml
          git commit -m 'FIX(FREE4P R18): bind derived ranking to terminal round'
          git push origin HEAD:work/free4p-r18-terminal-round-projection

  browser-static:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'work/free4p-r18-terminal-round-projection') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node version
        run: node --version

      - name: Run checker self-test and current Browser check
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
