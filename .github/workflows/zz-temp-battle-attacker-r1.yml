name: TEMP Battle Attacker Max Load R1
on:
  push:
    branches: [sol/battle-attacker-max-load-r1-20260907]
    paths: ['.github/workflows/zz-temp-battle-attacker-r1.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect presentation and janken mount
        run: |
          grep -n -C 18 'function setBattlePresentation' browser/GAMEROAD.html || true
          grep -n -C 14 'battleResolution' browser/GAMEROAD.html | head -n 180 || true
          grep -n -C 18 'mountBattleJanken' browser/battle-janken-slidepad-runtime-mount.mjs || true
          grep -n -C 18 'export function mount' browser/battle-janken-slidepad-runtime-mount.mjs || true
          grep -n -C 12 'resolveBattleJankenSlotCardAction' browser/battle-janken-slidepad-runtime-mount.mjs || true
          grep -n -C 12 'ordinaryHandCardIds' browser/battle-janken-slidepad-runtime-mount.mjs | head -n 180 || true
          grep -n -C 12 '__GAMEROAD_TEST__' browser/GAMEROAD.html | tail -n 220 || true
