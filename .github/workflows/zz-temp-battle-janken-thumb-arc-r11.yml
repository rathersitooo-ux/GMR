name: temp Battle Janken thumb arc R11 recovery

on:
  push:
    branches: [sol/battle-janken-thumb-arc-r11-20260912]

permissions:
  contents: write
  actions: read

concurrency:
  group: battle-janken-thumb-arc-r11
  cancel-in-progress: false

jobs:
  recover-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply reviewed current-main candidate
        shell: bash
        env:
          AUTH_BASE: e6d825e07f5791c67386d44769613ac2089e0fca
          DONOR_BASE: 9253002b4f2fa1fcf092ef7ddb2e7769acad7bb5
          DONOR_HEAD: 32d5e9a4a54ef85099211df374fa0edd5ef22d63
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUTH_BASE" HEAD
          git diff --binary "$DONOR_BASE" "$DONOR_HEAD" -- \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            tests/battle-janken-slidepad-runtime-mount.test.mjs > /tmp/thumb-arc.patch
          test -s /tmp/thumb-arc.patch
          git apply --check /tmp/thumb-arc.patch
          git apply /tmp/thumb-arc.patch
          python3 - <<'PY'
          from pathlib import Path
          for path,old,new in [
            ('browser/battle-janken-slidepad-runtime-mount.mjs','translate(-150px,4px) rotate(-15deg)','translate(-150px,-2px) rotate(-15deg)'),
            ('tests/battle-janken-slidepad-runtime-mount.test.mjs',r'translate\(-150px,4px\) rotate\(-15deg\)',r'translate\(-150px,-2px\) rotate\(-15deg\)')]:
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s:
                  if s.count(old)!=1: raise SystemExit(f'{path}: unexpected anchor count {s.count(old)}')
                  p.write_text(s.replace(old,new,1),encoding='utf-8')
              elif new not in s:
                  raise SystemExit(f'{path}: edge-fit anchor missing')
          PY
          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
      - name: Restore successful current-main visual evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10289418709'
        run: |
          set -euo pipefail
          rm -rf evidence/battle-janken-thumb-arc-r11 /tmp/r11ev /tmp/r11.zip
          mkdir -p evidence/battle-janken-thumb-arc-r11 /tmp/r11ev
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/r11.zip
          unzip -q /tmp/r11.zip -d /tmp/r11ev
          find /tmp/r11ev -type f -maxdepth 3 -print
          for f in 1280x720-expanded.png 667x375-expanded.png 390x844-expanded.png geometry.json; do
            src="$(find /tmp/r11ev -type f -name "$f" -print -quit)"
            test -n "$src" && test -s "$src"
            cp "$src" "evidence/battle-janken-thumb-arc-r11/$f"
          done
          node -e "const j=require('./evidence/battle-janken-thumb-arc-r11/geometry.json'); if(j.baseSha!=='e6d825e07f5791c67386d44769613ac2089e0fca') process.exit(2); if(j.captures.length!==3||j.captures.some(c=>c.violations.length)) process.exit(3); console.log(j.captures.map(c=>[c.name,c.violations.length]));"
      - name: Commit only reviewed product and evidence
        shell: bash
        env:
          AUTH_BASE: e6d825e07f5791c67386d44769613ac2089e0fca
          BRANCH: sol/battle-janken-thumb-arc-r11-20260912
        run: |
          set -euo pipefail
          git rm -f .github/workflows/zz-temp-battle-janken-thumb-arc-r11.yml data/preaction-authorizations/BATTLE-JANKEN-THUMB-ARC-R11-20260912T1116-SOL-Q9N4M14.json
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs \
            evidence/battle-janken-thumb-arc-r11/1280x720-expanded.png \
            evidence/battle-janken-thumb-arc-r11/667x375-expanded.png \
            evidence/battle-janken-thumb-arc-r11/390x844-expanded.png \
            evidence/battle-janken-thumb-arc-r11/geometry.json
          mapfile -t changed < <(git diff --cached --name-only "$AUTH_BASE" | sort)
          expected=(browser/battle-janken-slidepad-runtime-mount.mjs evidence/battle-janken-thumb-arc-r11/1280x720-expanded.png evidence/battle-janken-thumb-arc-r11/390x844-expanded.png evidence/battle-janken-thumb-arc-r11/667x375-expanded.png evidence/battle-janken-thumb-arc-r11/geometry.json tests/battle-janken-slidepad-runtime-mount.test.mjs)
          [ "${#changed[@]}" -eq 6 ] || { printf 'bad candidate diff count: %s\n' "${changed[*]}"; exit 1; }
          for i in 0 1 2 3 4 5; do [ "${changed[$i]}" = "${expected[$i]}" ] || { printf 'bad candidate diff: %s\n' "${changed[*]}"; exit 1; }; done
          git config user.name gameroad-actions
          git config user.email actions@users.noreply.github.com
          git commit -m 'Battle SlidePad: 右親指じゃんけん弧 R11候補と現行実画面証拠 [skip ci]'
          git push origin "HEAD:$BRANCH"
