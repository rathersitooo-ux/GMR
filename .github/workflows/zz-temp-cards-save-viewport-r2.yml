name: temp Cards mobile save viewport R2

on:
  push:
    branches:
      - sol/browser-cards-save-viewport-r2-20260920

permissions:
  contents: write

jobs:
  patch-owned-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout owned branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact mobile deck viewport repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          old = '.screen.cards .deckBoard{display:grid!important;position:fixed;left:6px;right:6px;bottom:64px;height:min(67vh,565px);z-index:94;'
          new = '.screen.cards .deckBoard{display:grid!important;position:fixed;left:6px;right:6px;bottom:64px;height:min(67vh,565px);grid-template-rows:auto auto auto minmax(0,1fr) auto;z-index:94;'
          if s.count(old) != 1:
              raise SystemExit(f'exact mobile deckBoard anchor mismatch: {s.count(old)}')
          if new in s:
              raise SystemExit('repair already present before patch')
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit('patched mobile deckBoard row contract not unique')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- browser/GAMEROAD.html

      - name: Verify bounded scope and clean transient files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f data/preaction-authorizations/BROWSER-CARDS-SAVE-VIEWPORT-R2-20260920T1516-SOL-Q2N2.json
          git rm -f .github/workflows/zz-temp-cards-save-viewport-r2.yml
          changed="$( { git diff --name-only --cached; git diff --name-only; } | sort -u )"
          printf '%s\n' "$changed"
          for path in $changed; do
            case "$path" in
              browser/GAMEROAD.html|data/preaction-authorizations/BROWSER-CARDS-SAVE-VIEWPORT-R2-20260920T1516-SOL-Q2N2.json|.github/workflows/zz-temp-cards-save-viewport-r2.yml) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
          done

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bounded-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git add -u data/preaction-authorizations .github/workflows
          git commit -m 'Cards: keep mobile deck save controls in viewport'
          git push origin HEAD:${{ github.ref_name }}
