name: R48 UI Pro Max Live Home Repair

on:
  push:
    branches:
      - work/ui-pro-max-first-slice-r1
    paths:
      - '.github/workflows/r48-ui-pro-max-executor.yml'

permissions:
  contents: write

jobs:
  repair-live-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard and replace only the R48 presentation layer
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='dde6fc9b88a00eedc8f1a0f5d97f5e0a6c8ccf20'
          EXPECTED_HTML_BLOB='12839c5844b8612576226b71b7c7d1e43f991df4'
          PARENT="$(git rev-parse HEAD^)"
          if [[ "$PARENT" != "$EXPECTED_PARENT" ]]; then
            echo "::error::Unexpected repair parent: $PARENT"
            exit 1
          fi
          ACTUAL_BLOB="$(git hash-object browser/GAMEROAD.html)"
          if [[ "$ACTUAL_BLOB" != "$EXPECTED_HTML_BLOB" ]]; then
            echo "::error::Unexpected Browser blob: $ACTUAL_BLOB"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          before = path.read_text(encoding='utf-8')
          begin = '<!-- UI_PRO_MAX_R48_BEGIN -->'
          end = '<!-- UI_PRO_MAX_R48_END -->'
          if before.count(begin) != 1 or before.count(end) != 1:
              raise SystemExit('R48 markers must be unique')
          required = [
              '.home.codexHome{', '.codexHomeCenterStage{', '.codexBattleCta{',
              '.home.codexHome .homeSlidePad{', 'data-home-target="setup"'
          ]
          for token in required:
              if token not in before:
                  raise SystemExit(f'live Home contract token missing: {token}')

          start = before.index(begin)
          finish = before.index(end, start) + len(end)
          old_block = before[start:finish]

          new_block = r'''<!-- UI_PRO_MAX_R48_BEGIN -->
          <style id="gr-ui-pro-max-r48">
          /*
            R48 live Home presentation repair.
            Source of truth remains the existing HomeMainMenuSlidePad route/state machine.
            This layer only replaces the visible shell vocabulary: no route, state, save,
            network, economy, card rule, partner identity, or formal pad-image ownership.
          */
          html.grCodexHomeActive .app{
            background:
              radial-gradient(ellipse at 18% 12%,rgba(73,171,135,.14),transparent 38%),
              linear-gradient(138deg,#04100d 0%,#08231b 56%,#030a08 100%) !important;
          }
          html.grCodexHomeActive .top{
            background:linear-gradient(180deg,rgba(3,13,10,.96),rgba(4,18,14,.62) 58%,transparent) !important;
          }
          html.grCodexHomeActive .pill{
            border-color:rgba(174,236,214,.24) !important;
            background:rgba(7,29,23,.82) !important;
            box-shadow:inset 0 1px rgba(223,255,244,.05);
          }
          .home.codexHome{
            background:
              radial-gradient(ellipse at 52% 17%,rgba(68,165,127,.18),transparent 33%),
              radial-gradient(ellipse at 78% 46%,rgba(94,205,183,.09),transparent 30%),
              linear-gradient(136deg,#061510 0%,#0a2c21 49%,#04100d 100%) !important;
            color:#f3fff9 !important;
          }
          .home.codexHome::before{
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:
              radial-gradient(circle at 7% 79%,rgba(205,173,103,.10) 0 1px,transparent 2px),
              radial-gradient(circle at 72% 22%,rgba(173,241,218,.09) 0 1px,transparent 2px),
              linear-gradient(108deg,transparent 0 64%,rgba(166,235,211,.045) 64.2% 64.6%,transparent 64.9% 100%);
            background-size:52px 52px,68px 68px,auto;
            opacity:.82;
          }
          .home.codexHome::after{
            left:18% !important;
            top:69% !important;
            width:68% !important;
            height:7% !important;
            background:linear-gradient(90deg,transparent,rgba(194,164,94,.24),rgba(133,222,191,.12),transparent) !important;
            opacity:.46 !important;
            transform:rotate(-7deg) !important;
            filter:blur(1px);
          }

          .codexHomeFogA{background:#2c8a69 !important;opacity:.14 !important}
          .codexHomeFogB{background:#47bca0 !important;opacity:.085 !important}
          .codexHomeFogC{background:#b79a58 !important;opacity:.055 !important}

          .codexRailTitle{
            color:#a8cfc0 !important;
            font-size:11px !important;
            letter-spacing:.16em;
            text-transform:uppercase;
          }
          .codexWireCard{
            border-color:rgba(180,232,213,.22) !important;
            border-radius:14px !important;
            color:#effbf6 !important;
            background:linear-gradient(145deg,rgba(15,56,45,.90),rgba(6,27,22,.88)) !important;
            box-shadow:inset 3px 0 rgba(120,211,180,.15),0 11px 28px rgba(0,0,0,.22) !important;
            backdrop-filter:blur(5px);
          }
          .codexWireCard strong{color:#f4fff9}
          .codexWireCard small{color:#a9c9bd !important}
          .codexWireCard em{color:#91b8a9 !important}
          .codexWireCard:hover{
            border-color:rgba(174,241,217,.46) !important;
            box-shadow:inset 4px 0 rgba(146,230,201,.28),0 13px 30px rgba(0,0,0,.26) !important;
          }
          .codexWireCard:focus-visible,
          .codexHomeSettings:focus-visible,
          .codexPartnerChip:focus-visible,
          .codexBattleCta:focus-visible{
            outline:3px solid #d9fff2 !important;
            outline-offset:3px !important;
            box-shadow:0 0 0 2px rgba(4,19,15,.94),0 0 0 6px rgba(157,235,208,.20) !important;
          }
          .codexSeasonCard{
            background:
              linear-gradient(125deg,rgba(174,141,69,.22),transparent 32%),
              linear-gradient(145deg,#174b3d,#09271f 70%) !important;
          }
          .codexMissionCard{
            background:
              linear-gradient(125deg,rgba(97,203,174,.14),transparent 34%),
              linear-gradient(145deg,#123f34,#08251e 72%) !important;
          }
          .codexWireBadge{
            background:#d7bd78 !important;
            color:#2c2412 !important;
            border:1px solid rgba(255,239,194,.40);
            box-shadow:0 4px 12px rgba(0,0,0,.18);
          }
          .codexHomeSettings{
            border:1px solid rgba(169,229,208,.24) !important;
            border-radius:14px !important;
            background:linear-gradient(135deg,#164f40,#0b3329) !important;
            color:#eefbf6 !important;
            box-shadow:inset 0 1px rgba(224,255,245,.06);
          }

          .codexHomeCenterStage{
            border-radius:22px !important;
            border-color:rgba(171,235,212,.28) !important;
            background:
              radial-gradient(ellipse at 50% 36%,rgba(77,163,126,.16),transparent 44%),
              linear-gradient(154deg,#0d3328 0%,#09251e 50%,#04130f 100%) !important;
            box-shadow:inset 0 1px rgba(223,255,243,.07),0 20px 58px rgba(0,0,0,.32) !important;
          }
          .codexCenterEyebrow{
            color:#85b7a5 !important;
            font-size:10px !important;
            letter-spacing:.20em;
            opacity:.72;
          }
          .codexCenterTitle{
            color:#f2dfad !important;
            letter-spacing:.015em;
            text-shadow:0 4px 18px rgba(0,0,0,.34);
          }
          .codexCenterSub{color:#b2d0c5 !important}
          .codexHomeVisualLayer{
            border-radius:18px !important;
            background:
              radial-gradient(ellipse at 50% 22%,rgba(122,210,178,.15),transparent 31%),
              linear-gradient(180deg,rgba(16,69,51,.48) 0%,rgba(8,44,33,.66) 52%,rgba(5,28,22,.92) 100%) !important;
            box-shadow:inset 0 0 0 1px rgba(166,229,207,.12),inset 0 -52px 72px rgba(0,0,0,.18) !important;
          }
          .codexHomeVisualLayer::before{
            content:"";
            position:absolute;
            left:-8%;right:-8%;bottom:-13%;height:54%;
            background:
              radial-gradient(ellipse at 18% 100%,#174934 0 34%,transparent 35%),
              radial-gradient(ellipse at 48% 100%,#1a513a 0 38%,transparent 39%),
              radial-gradient(ellipse at 82% 100%,#123d2d 0 36%,transparent 37%);
            opacity:.86;
            pointer-events:none;
          }
          .codexHomeVisualLayer::after{
            content:"";
            position:absolute;
            left:18%;right:14%;bottom:10%;height:30%;
            background:linear-gradient(105deg,transparent 0 18%,rgba(191,164,95,.12) 32%,rgba(145,220,194,.11) 54%,transparent 78%);
            clip-path:polygon(0 72%,28% 47%,54% 58%,100% 12%,100% 38%,56% 78%,24% 66%,0 100%);
            pointer-events:none;
          }
          .codexHaloOuter{background:#5cc49e !important;opacity:.10 !important}
          .codexHaloInner{background:#d1b56f !important;opacity:.065 !important}

          .codexBattleCrest{
            border:1px solid rgba(222,197,135,.26);
            border-radius:15px !important;
            background:
              linear-gradient(145deg,rgba(201,167,91,.18),transparent 38%),
              linear-gradient(155deg,#174b3b,#09271f) !important;
            color:#dcefe7 !important;
            box-shadow:inset 0 1px rgba(255,244,208,.06),0 12px 26px rgba(0,0,0,.24);
          }
          .codexBattleCrest strong{color:#f0dca6 !important;letter-spacing:.035em}
          .codexRankLabel{color:#95b7aa !important}
          .codexPartnerChip{
            border:1px solid rgba(158,225,201,.30) !important;
            background:linear-gradient(135deg,#1b6550,#0d3e31) !important;
            color:#effbf6 !important;
            box-shadow:0 8px 18px rgba(0,0,0,.20);
          }
          .codexBattleCta{
            border-color:rgba(236,209,147,.50) !important;
            background:linear-gradient(135deg,#b69249,#735a2d) !important;
            color:#fff8e8 !important;
            box-shadow:inset 0 1px rgba(255,246,213,.18),0 9px 22px rgba(0,0,0,.24);
            text-shadow:0 2px 8px rgba(0,0,0,.28);
          }
          .codexBattleCta:hover{filter:brightness(1.05)}
          .codexPartnerChip:hover{filter:brightness(1.06)}

          .codexPadArt{
            filter:drop-shadow(0 5px 8px rgba(1,10,7,.42)) !important;
          }
          .homePadChoice:hover .codexPadArt{
            filter:brightness(1.06) drop-shadow(0 5px 9px rgba(1,10,7,.46)) !important;
          }
          .homePadChoice:focus-visible .codexPadArt,
          .homePadCenter:focus-visible .codexPadArt,
          .homePadChoice.preview .codexPadArt{
            filter:brightness(1.08) drop-shadow(0 0 2px #f4fff9) drop-shadow(0 0 8px rgba(143,232,200,.88)) drop-shadow(0 5px 9px rgba(1,10,7,.46)) !important;
          }
          .codexPadBattle .codexPadFallback{background:#8a6c35 !important}
          .codexPadShop .codexPadFallback{background:#207b69 !important}
          .codexPadPartner .codexPadFallback{background:#356e57 !important}
          .codexPadDeck .codexPadFallback{background:#245c4d !important}
          .codexPadCenter .codexPadFallback{background:#f2f4e8 !important;color:#173329 !important}

          html.r10LowPerf .codexWireCard{backdrop-filter:none !important}
          html.r10LowPerf .codexHomeCenterStage,
          html.r10LowPerf .codexHomeVisualLayer{box-shadow:none !important}
          @media (prefers-reduced-motion: reduce){
            .codexWireCard,.codexHomeSettings,.codexPartnerChip,.codexBattleCta{transition:none !important}
          }
          </style>
          <!-- UI_PRO_MAX_R48_END -->'''

          after = before[:start] + new_block + before[finish:]
          if after.count(begin) != 1 or after.count(end) != 1:
              raise SystemExit('replacement markers not unique')
          # Exact boundedness proof: swapping the new block back to the old block recovers the input byte-for-byte.
          new_start = after.index(begin)
          new_finish = after.index(end, new_start) + len(end)
          recovered = after[:new_start] + old_block + after[new_finish:]
          if recovered != before:
              raise SystemExit('repair changed bytes outside R48 block')
          path.write_text(after, encoding='utf-8')
          PY

          test "$(grep -c 'UI_PRO_MAX_R48_BEGIN' browser/GAMEROAD.html)" -eq 1
          test "$(grep -c 'UI_PRO_MAX_R48_END' browser/GAMEROAD.html)" -eq 1
          grep -q '\.home\.codexHome' browser/GAMEROAD.html
          grep -q '\.codexHomeCenterStage' browser/GAMEROAD.html
          grep -q '\.codexBattleCta' browser/GAMEROAD.html
          git diff --check -- browser/GAMEROAD.html

      - name: Commit repaired live presentation and self-remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/r48-ui-pro-max-executor.yml
          git add browser/GAMEROAD.html .github/workflows/r48-ui-pro-max-executor.yml
          git diff --cached --check
          git commit -m 'R48: retarget Home visual pass to live shell'
          git push origin HEAD:work/ui-pro-max-first-slice-r1
