name: Auto Battle Live R2 Patch

on:
  push:
    branches:
      - work/auto-battle-live-r2-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auto-battle-live-r2-20260905
          fetch-depth: 0
      - name: Apply exact Auto bridge and focused test
        shell: bash
        env:
          AUTO_APPEND_B64: 
          TEST_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          target = Path('browser/ui-state-feedback-ready-plan-adapter.mjs')
          source = target.read_text(encoding='utf-8')
          marker = "const BATTLE_AUTO_VISIBLE_MODES = Object.freeze(['manual', 'left', 'right', 'max', 'min']);"
          if marker in source:
              raise SystemExit('Auto bridge marker already present; refusing duplicate append')
          append = base64.b64decode(__import__('os').environ['AUTO_APPEND_B64']).decode('utf-8')
          target.write_text(source.rstrip() + '\n' + append.lstrip(), encoding='utf-8')
          Path('tests/battle-auto-live-ready-plan-bridge.test.mjs').write_bytes(base64.b64decode(__import__('os').environ['TEST_B64']))
          PY
          node --check browser/ui-state-feedback-ready-plan-adapter.mjs
          node --test tests/battle-auto-input-core.test.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs tests/battle-auto-live-ready-plan-bridge.test.mjs
      - name: Commit tested product delta
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/ui-state-feedback-ready-plan-adapter.mjs tests/battle-auto-live-ready-plan-bridge.test.mjs
          git diff --cached --check
          git commit -m "Battle: connect Auto card selection to live human input path"
          git push origin HEAD:work/auto-battle-live-r2-20260905
