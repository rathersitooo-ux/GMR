name: Diagnose single-character transport shift

on:
  push:
    branches:
      - work/GITHUB-ROBLOX-CODE-PLACEMENT-001
    paths:
      - .github/workflows/import-roblox-baseline.yml

permissions:
  contents: read

jobs:
  diagnose-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Locate corruption and test one-character deletion around first XZ failure
        shell: bash
        env:
          EXPECTED_SIZE: "10245508"
          EXPECTED_SHA256: b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/GITHUB-ROBLOX-CODE-PLACEMENT-001"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma

          cat = b"".join(b"".join(Path(f".github/import/roblox-baseline.part{i:03d}.b64").read_bytes().split()) for i in range(10))
          print(f"transport_len={len(cat)} mod4={len(cat)%4}")
          usable = cat[: (len(cat)//4)*4]
          packed = base64.b64decode(usable, validate=True)
          print(f"usable_len={len(usable)} packed_len={len(packed)} packed_sha={hashlib.sha256(packed).hexdigest()}")

          dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
          out_len = 0
          fail_end = None
          step = 32
          for start in range(0, len(packed), step):
              chunk = packed[start:start+step]
              try:
                  out_len += len(dec.decompress(chunk))
              except lzma.LZMAError as e:
                  fail_end = start + len(chunk)
                  print(f"first_stream_error input_range={start}:{start+len(chunk)} out_len={out_len} error={e!r}")
                  break
          if fail_end is None:
              print(f"no_stream_error eof={dec.eof} out_len={out_len}")
              fail_end = len(packed)

          fail_b64 = (fail_end * 4) // 3
          lo = max(0, fail_b64 - 1536)
          hi = min(len(cat), fail_b64 + 1536)
          print(f"search_delete_window={lo}:{hi} approx_fail_b64={fail_b64}")

          best = []
          for i in range(lo, hi):
              cand = cat[:i] + cat[i+1:]
              if len(cand) % 4:
                  continue
              try:
                  cp = base64.b64decode(cand, validate=True)
              except Exception:
                  continue
              try:
                  raw = lzma.decompress(cp, format=lzma.FORMAT_XZ)
              except lzma.LZMAError:
                  continue
              size = len(raw)
              sha = hashlib.sha256(raw).hexdigest()
              print(f"DECOMPRESS_OK delete_index={i} removed={cat[i:i+1]!r} packed_len={len(cp)} raw_size={size} raw_sha={sha}")
              if size == int("10245508") and sha == "b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51":
                  print(f"EXACT_SINGLE_DELETE_RECOVERY index={i} removed={cat[i:i+1]!r}")
                  Path("/tmp/recovered-delete-index.txt").write_text(str(i))
                  raise SystemExit(0)
              best.append((size, i, sha))

          print("no exact single-delete recovery in targeted window")
          if best:
              print("decompressible_nonmatching_candidates=", sorted(best, reverse=True)[:10])
          raise SystemExit(63)
          PY
