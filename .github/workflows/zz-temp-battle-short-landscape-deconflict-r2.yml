name: TEMP Battle Short Landscape Deconflict R2

on:
  push:
    branches:
      - sol/battle-short-landscape-deconflict-r2-20260908

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/battle-short-landscape-deconflict-r2-20260908
          fetch-depth: 0

      - name: Verify PRE_ACTION and exact base
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/BATTLE-SHORT-LANDSCAPE-DECONFLICT-R2-20260908T1049-SOL-L7Q4N8.json
          git merge-base --is-ancestor bfc125842eab5a51cf327df184fa9dd040578e4b HEAD
          test "$(git rev-parse bfc125842eab5a51cf327df184fa9dd040578e4b^)" = "$(git rev-parse bfc125842eab5a51cf327df184fa9dd040578e4b^)"
          test "$(git hash-object browser/battle-janken-slidepad-runtime-mount.mjs)" = "b8b8ab7793ee89182f4c9e248e8c468055b55ffe"
          test "$(git hash-object tests/battle-janken-slidepad-runtime-mount.test.mjs)" = "7e9de27e00a682abdd12818e0e98efcb33ac4339"

      - name: Repair short-landscape pointer occlusion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          text = runtime.read_text()
          old = '[${HOST_ATTR}="1"]{width:188px;height:146px;right:58px;bottom:7px}'
          new = '[${HOST_ATTR}="1"]{width:188px;height:146px;right:7px;bottom:7px}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one short-landscape host seam, found {text.count(old)}')
          runtime.write_text(text.replace(old, new))

          test_file = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          test_text = test_file.read_text()
          old_title = "test('short-landscape Battle controls deconflict the fixed janken fan from the right utility rail', async () => {"
          new_title = "test('short-landscape Battle controls keep the compact janken fan on the non-occluding right-edge anchor', async () => {"
          if test_text.count(old_title) != 1:
              raise SystemExit(f'expected one short-landscape regression title, found {test_text.count(old_title)}')
          test_text = test_text.replace(old_title, new_title)
          old_expect = 'width:188px;height:146px;right:58px;bottom:7px'
          new_expect = 'width:188px;height:146px;right:7px;bottom:7px'
          if test_text.count(old_expect) != 1:
              raise SystemExit(f'expected one short-landscape right-offset assertion, found {test_text.count(old_expect)}')
          test_file.write_text(test_text.replace(old_expect, new_expect))
          PY
          git diff --check

      - name: Run focused Battle tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs tests/battle-playable-hand-row-roulette-runtime.test.mjs

      - name: Verify exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only bfc125842eab5a51cf327df184fa9dd040578e4b -- browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs | sort | tr '\n' ' ')"
          test "$changed" = "browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs "
          test "$(git diff --name-only bfc125842eab5a51cf327df184fa9dd040578e4b -- browser/GAMEROAD.html browser/battle-playable-hand-row-roulette-runtime.mjs browser/battle-screen-runtime-mount.mjs | wc -l)" -eq 0

      - name: Commit product and remove transient controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-battle-short-landscape-deconflict-r2.yml
          rm -f data/preaction-authorizations/BATTLE-SHORT-LANDSCAPE-DECONFLICT-R2-20260908T1049-SOL-L7Q4N8.json
          git config user.name "gameroad-runtime-bot"
          git config user.email "gameroad-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "Battle: restore short-landscape ready control"
          git push origin HEAD:sol/battle-short-landscape-deconflict-r2-20260908
