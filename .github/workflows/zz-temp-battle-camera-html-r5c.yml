name: zz-temp-battle-camera-html-r5c
on:
  push:
    branches:
      - sol/battle-camera-html-r5c-20260910
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bounded Battle camera HTML probe/patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/temp-battle-camera-html-r5c.py')
          s = p.read_text(encoding='utf-8')
          old_anchor = 'adapter_anchor = "return{eye,center,r,moveFocus:false,battleFocus:false,...profile}} function fieldProject(id,viewer)"'
          new_anchor = 'adapter_anchor = "function fieldProject(id,viewer)"'
          old_adapter = "adapter = r'''return{eye,center,r,moveFocus:false,battleFocus:false,...profile}}\nfunction grBattleCameraSource()"
          new_adapter = "adapter = r'''function grBattleCameraSource()"
          if old_anchor in s:
              s = s.replace(old_anchor, new_anchor, 1)
          elif new_anchor not in s:
              raise SystemExit('camera adapter anchor declaration not found')
          if old_adapter in s:
              s = s.replace(old_adapter, new_adapter, 1)
          elif new_adapter not in s:
              raise SystemExit('camera adapter payload start not found')
          p.write_text(s, encoding='utf-8')
          PY
          python tools/temp-battle-camera-html-r5c.py
          node --test tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs tests/battle-camera-live-integration.test.mjs
          if git diff --quiet -- tools/temp-battle-camera-html-r5c.py browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs; then
            echo "No bounded changes"
            exit 0
          fi
          git config user.name "gameroad-bounded-writer"
          git config user.email "gameroad-bounded-writer@users.noreply.github.com"
          for p in tools/temp-battle-camera-html-r5c.py browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git add -- "$p"
            fi
          done
          git diff --cached --name-only
          git diff --cached --quiet && { echo "No staged bounded changes"; exit 0; }
          git commit -m "camera R5C: bounded HTML live adapt"
          git push origin HEAD:sol/battle-camera-html-r5c-20260910
