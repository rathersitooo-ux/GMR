name: TEMP Battle Current UI Geometry Repair R6B

on:
  push:
    branches:
      - sol/battle-current-ui-geometry-repair-r6b-20260913

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify corrected PRE_ACTION witness
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./data/preaction-authorizations/BATTLE-CURRENT-UI-R2-20260913T0316-SOL-GEOMETRY-R6B.json');
          const id = 'BATTLE-CURRENT-UI-R2-20260913T0316-SOL-GEOMETRY-R6B';
          if (p.recordId !== id) throw new Error('recordId');
          if (p.authorizationBaseSha !== 'd96725f9ee3ff90986d1883cc2813872b1b9beee') throw new Error('base');
          if (p.predictionStatus !== 'PASS') throw new Error('prediction');
          if (p.rehearsalStatus !== 'PASS') throw new Error('rehearsal');
          if (!p.proceedToken.startsWith(`PROCEED|${id}|PREACTION_PROCEED_ALLOWED|MATERIAL_STANDARD|`)) throw new Error('proceedToken');
          if (p.leaseSnapshotReadbackRef !== 'CURRENT_ACTIVE_LEASES!A1316:L1316') throw new Error('lease ref');
          NODE
      - name: Replay already-tested product repair exactly
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git cherry-pick 226712388db6ded9c8f5ff7f3fd930de711d98c2
          node tests/battle-current-player-ui-runtime.test.mjs
          node tests/battle-current-player-ui-live-adapter.test.mjs
          node tests/battle-replay-live-adapter.test.mjs
          git diff --check HEAD~1 HEAD
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Clean transient authorization files
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-battle-current-ui-geometry-repair-r6b.yml data/preaction-authorizations/BATTLE-CURRENT-UI-R2-20260913T0316-SOL-GEOMETRY-R6B.json
          git commit -m 'Battle UI geometry R6B cleanup'
          git push origin HEAD:${GITHUB_REF_NAME}
