name: zz-temp-battle-janken-focus-live-r1

on:
  push:
    branches:
      - sol/battle-janken-focus-live-r1-20260910
    paths:
      - .github/workflows/zz-temp-battle-janken-focus-live-r1.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded patch
        run: python tools/temp-battle-janken-focus-live-r1.py
      - name: Syntax check
        run: node --check browser/battle-janken-slidepad-runtime-mount.mjs
      - name: Focused classified tests
        run: node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Scope check
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'browser/battle-janken-slidepad-runtime-mount.mjs',
              'tests/battle-janken-slidepad-runtime-mount.test.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected product diff: {sorted(changed)}')
          print('scope ok:', sorted(changed))
          PY
      - name: Commit product patch
        run: |
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git commit -m 'Battle: wire dedicated janken focus through existing SlidePad'
          git push
