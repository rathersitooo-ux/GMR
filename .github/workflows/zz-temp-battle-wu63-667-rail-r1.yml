name: TEMP WU63 667 Rail Repair R1

on:
  push:
    branches:
      - sol/battle-wu63-667-rail-repair-r1-20260914

permissions:
  contents: read

jobs:
  vertical-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wu63-r1 visual-evidence/wu63-r1 test-results/wu63-r1
          cat > .wu63-r1/playwright.config.mjs <<'EOF'
          import {defineConfig} from '@playwright/test';export default defineConfig({testDir:'.',testMatch:'vertical.spec.mjs',outputDir:'../test-results/wu63-r1',timeout:90000,expect:{timeout:10000},workers:1,retries:0,use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},hasTouch:true},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',timeout:120000}})
          EOF
          cat > .wu63-r1/vertical.spec.mjs <<'EOF'
          import{test,expect}from'@playwright/test';import fs from'node:fs';import path from'node:path';
          async function deck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__,pub=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id)),ids=window.__CARD_DATA__.filter(c=>pub.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id),royal=['SP_J','SP_Q','SP_K'],non=ids.filter(id=>!t.isRoyalCard(id));t.deckSetDraft([...non.slice(0,37),...royal],[]);return t.deckValidate(t.state.deckDraft,{forBattle:true}).ok?t.deckCommit():false})}
          async function boot(page){await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});await expect.poll(()=>page.evaluate(()=>typeof window.__GAMEROAD_TEST__?.deckPublic==='function'&&Array.isArray(window.__CARD_DATA__))).toBeTruthy();expect(await deck(page)).toBeTruthy();await page.locator('[data-go="setup"]:visible').first().click();const s=page.locator('section[data-screen="setup"]');await expect(s).toBeVisible();await s.locator('[data-content="road_shield"]').evaluate(el=>el.click());await s.locator('[data-mode="2p"]').evaluate(el=>el.click());await s.locator('#startMatch').evaluate(el=>el.click());await expect(page.locator('section.battle.active')).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy()}
          async function metric(page,label){return page.evaluate(label=>{const snap=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{id:e.id||null,cls:String(e.className||''),x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,display:s.display,position:s.position,overflow:s.overflow}};const vis=[...document.querySelectorAll('section.battle.active button,section.battle.active [role="button"],section.battle.active [tabindex]:not([tabindex="-1"])')].filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return !e.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&s.pointerEvents!=='none'&&r.width>0&&r.height>0});const relevant=vis.filter(e=>!e.closest('#battleDrawer'));const off=relevant.filter(e=>{const r=e.getBoundingClientRect();return r.x<0||r.y<0||r.right>667||r.bottom>375}).map(snap);const hand=document.querySelector('#hand')?.getBoundingClientRect();const overlap=hand?relevant.filter(e=>{const r=e.getBoundingClientRect();return r.x<hand.right&&r.right>hand.x&&r.y<hand.bottom&&r.bottom>hand.y}).filter(e=>!e.closest('.battleInfo')).map(snap):[];return{label,off,overlap,section:snap(document.querySelector('section.battle.active')),rail:snap(document.querySelector('.battleRail')),reservation:snap(document.querySelector('#battleAdvanceReservation')),rows:[...document.querySelectorAll('#battleAdvanceReservation .arRow')].map(snap),camera:window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode};},label)}
          test('vertical-preserving candidates',async({page})=>{await boot(page);const out=[await metric(page,'base')];const candidates=[['E_section_inset_vertical_reservation',`@media (min-width:640px) and (max-width:900px) and (max-height:430px) and (orientation:landscape){section.screen.battle.active{top:21px!important;bottom:-21px!important}.battle.active .battleRail{overflow:visible!important}.battle.active #battleAdvanceReservation{position:absolute!important;top:48px!important;right:0!important;left:auto!important;width:124px!important;height:auto!important;display:grid!important;grid-auto-flow:row!important;overflow:visible!important}.battle.active #battleAdvanceReservation .arRow{position:static!important;width:110px!important;height:30px!important;min-height:30px!important;display:grid!important}}`],['F_rail_inset_vertical_reservation',`@media (min-width:640px) and (max-width:900px) and (max-height:430px) and (orientation:landscape){.battle.active .battleRail{top:29px!important;bottom:auto!important;overflow:visible!important}.battle.active #battleAdvanceReservation{position:absolute!important;top:48px!important;right:0!important;left:auto!important;width:124px!important;height:auto!important;display:grid!important;grid-auto-flow:row!important;overflow:visible!important}.battle.active #battleAdvanceReservation .arRow{position:static!important;width:110px!important;height:30px!important;min-height:30px!important;display:grid!important}}`]];for(const[name,css]of candidates){await page.evaluate(()=>document.querySelector('#wu63Trial')?.remove());await page.addStyleTag({content:css}).then(h=>h.evaluate(e=>e.id='wu63Trial'));await page.waitForTimeout(100);out.push(await metric(page,name));await page.screenshot({path:path.resolve(`visual-evidence/wu63-r1/${name}.png`),animations:'disabled'});}fs.writeFileSync(path.resolve('visual-evidence/wu63-r1/vertical-candidates.json'),JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));});
          EOF
          npx playwright test --config=.wu63-r1/playwright.config.mjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-wu63-r1-vertical-${{github.run_id}}
          path: |
            visual-evidence/wu63-r1/
            test-results/wu63-r1/
          if-no-files-found: warn
          retention-days: 14
