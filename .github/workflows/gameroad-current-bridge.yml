name: GAMEROAD PC CURRENT Bridge

on:
  pull_request:
    paths:
      - '.github/workflows/gameroad-current-bridge.yml'
      - 'tools/gameroad-current-bridge.py'
      - 'tests/test_gameroad_current_bridge.py'
      - 'docs/gameroad-current-bridge.md'
      - '.github/workflows/gameroad-required-gate.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: gameroad-current-bridge-pc
  cancel-in-progress: false

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bridge fail-closed tests
        run: python -m unittest tests/test_gameroad_current_bridge.py -v

  pc-bridge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve local packet handoff
        id: packet
        shell: pwsh
        run: |
          $packet = $env:GAMEROAD_CURRENT_BRIDGE_PACKET
          if ([string]::IsNullOrWhiteSpace($packet)) {
            $packet = 'C:\GAMEROAD\executor-packet.json'
          }
          $exists = Test-Path -LiteralPath $packet -PathType Leaf
          "path=$packet" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.packet.outputs.exists == 'true'
        with:
          python-version: '3.12'

      - name: Install private Drive client dependencies
        if: steps.packet.outputs.exists == 'true'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet google-auth google-api-python-client

      - name: Verify machine-local owner credential is present
        if: steps.packet.outputs.exists == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GAMEROAD_GITHUB_TOKEN)) {
            throw 'GAMEROAD_GITHUB_TOKEN is missing from the Windows runner service environment.'
          }

      - name: Advance one packet through fresh CURRENT supervision
        if: steps.packet.outputs.exists == 'true'
        shell: pwsh
        env:
          BRIDGE_PACKET: ${{ steps.packet.outputs.path }}
        run: python tools/gameroad-current-bridge.py supervise --packet "$env:BRIDGE_PACKET" --repo "$env:GITHUB_REPOSITORY"
