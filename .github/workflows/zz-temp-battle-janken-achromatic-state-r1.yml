name: TEMP Battle janken achromatic interaction state R1

on:
  push:
    branches:
      - sol/battle-janken-achromatic-state-r1-20260910

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-janken-achromatic-state-r1-20260910
          fetch-depth: 0
      - name: Apply bounded achromatic presentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          runtime_path = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          test_path = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          source = runtime_path.read_text(encoding='utf-8')
          original = source

          required = [
              'rgba(255,216,74,.92)',
              'rgba(87,211,255,.18)',
              'rgba(135,105,255,.26)',
              'rgba(132,255,213,.18)',
              'brightness(1.16) saturate(1.12)',
              'filter:saturate(.2)',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'expected current presentation tokens missing: {missing}')

          source = source.replace('filter:saturate(.15)', 'filter:brightness(.68)')
          source = source.replace('filter:saturate(.2)', 'filter:brightness(.72)')
          source = source.replace("filter: 'saturate(1)'", "filter: 'brightness(1)'")
          source = source.replace("filter: 'saturate(.18)'", "filter: 'brightness(.72)'")
          source = re.sub(r'\s+saturate\([^)]*\)', '', source)

          def gray_channel(r, g, b):
              return max(0, min(255, round((0.2126 * r) + (0.7152 * g) + (0.0722 * b))))

          rgb_pattern = re.compile(r'(?P<fn>rgba?\()(?P<r>\d{1,3})\s*,\s*(?P<g>\d{1,3})\s*,\s*(?P<b>\d{1,3})(?P<tail>[^)]*\))')
          def replace_rgb(match):
              r, g, b = (int(match.group(name)) for name in ('r', 'g', 'b'))
              if r == g == b:
                  return match.group(0)
              y = gray_channel(r, g, b)
              return f"{match.group('fn')}{y},{y},{y}{match.group('tail')}"
          source = rgb_pattern.sub(replace_rgb, source)

          hex_pattern = re.compile(r'#([0-9a-fA-F]{6})\b')
          def replace_hex(match):
              value = match.group(1)
              r, g, b = int(value[0:2], 16), int(value[2:4], 16), int(value[4:6], 16)
              if r == g == b:
                  return match.group(0)
              y = gray_channel(r, g, b)
              return f'#{y:02x}{y:02x}{y:02x}'
          source = hex_pattern.sub(replace_hex, source)

          if source == original:
              raise SystemExit('achromatic patch produced no runtime change')
          runtime_path.write_text(source, encoding='utf-8')

          test_source = test_path.read_text(encoding='utf-8')
          marker = "test('non-suit janken interaction chrome keeps hard-coded state color achromatic'"
          if marker not in test_source:
              test_source += dedent(r'''

              test('non-suit janken interaction chrome keeps hard-coded state color achromatic', () => {
                const runtimeSource = readFileSync(
                  new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url),
                  'utf8',
                );
                const rgbTriplets = [...runtimeSource.matchAll(/rgba?\((\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/g)]
                  .map((match) => match.slice(1, 4).map(Number));
                assert.ok(rgbTriplets.length > 0);
                assert.deepEqual(
                  rgbTriplets.filter(([red, green, blue]) => red !== green || green !== blue),
                  [],
                  'non-suit SlidePad/state chrome must not compete with suit hue semantics',
                );

                const hexColors = [...runtimeSource.matchAll(/#([0-9a-fA-F]{6})\b/g)]
                  .map((match) => match[1].match(/../g).map((pair) => Number.parseInt(pair, 16)));
                assert.deepEqual(
                  hexColors.filter(([red, green, blue]) => red !== green || green !== blue),
                  [],
                  'hard-coded six-digit colors in the non-suit runtime stay achromatic',
                );
                assert.doesNotMatch(runtimeSource, /filter:\s*saturate\(|\s+saturate\(/);
                assert.match(runtimeSource, /\.grJankenSlidePadSlot\.rock\{transform:translate\(-162px,15px\) rotate\(-18deg\)\}/);
                assert.match(runtimeSource, /\.grJankenSlidePadSlot\.scissors\{transform:translate\(-124px,-55px\) rotate\(-8deg\)/);
                assert.match(runtimeSource, /\.grJankenSlidePadSlot\.paper\{transform:translate\(-48px,-92px\) rotate\(5deg\)/);
              });
              ''')
              test_path.write_text(test_source, encoding='utf-8')
          PY
      - name: Run focused tests
        run: node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git commit -m 'Battle: 操作状態の色を無彩色へ分離'
          git push origin HEAD:sol/battle-janken-achromatic-state-r1-20260910
