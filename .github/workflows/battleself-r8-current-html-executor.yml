name: BattleSelf R8 Current HTML Probe

on:
  push:
    branches:
      - work/battleself-r8-browser-live-mount-20260827
    paths:
      - '.github/workflows/battleself-r8-current-html-executor.yml'

permissions:
  contents: read

jobs:
  current-html-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove Battle deck producer and revision sequence from exact checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          needles = ['resolutionSeq', 'function refill(p)', 'deck.shift()', 'lastBattleResolution', 'round++', 'round +=', 'renderBattle()']
          print('BATTLESELF_PROBE_HTML_BYTES', len(text.encode('utf-8')))
          for needle in needles:
              print(f'=== NEEDLE {needle} ===')
              start = 0
              count = 0
              while True:
                  i = text.find(needle, start)
                  if i < 0: break
                  count += 1
                  a = max(0, i - 700)
                  b = min(len(text), i + len(needle) + 900)
                  snippet = text[a:b].replace('\r', '')
                  print(f'--- OCCURRENCE {count} offset={i} ---')
                  print(snippet)
                  start = i + len(needle)
              print(f'COUNT {count}')
          PY
