name: TEMP NormalMatch R6 Current-Base Recovery

on:
  push:
    branches:
      - work/normalmatch-r6-currentbase-recovery
    paths:
      - .github/workflows/zz-temp-normalmatch-r6-currentbase-recovery.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'work/normalmatch-r6-currentbase-recovery' || github.ref_name == 'work/normalmatch-r6-currentbase-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/normalmatch-r6-currentbase-recovery
      - name: Reapply exact R5 intent onto current-base branch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rathersitooo-ux/GMR/pull/330.diff -o /tmp/r5.patch
          test -s /tmp/r5.patch
          git apply --3way --index /tmp/r5.patch
          mapfile -t durable < <(git diff --cached --name-only | sort)
          printf '%s\n' "${durable[@]}"
          expected=(
            .github/workflows/gameroad-required-gate.yml
            browser/GAMEROAD.html
            browser/post-match-autoqueue-core.mjs
            tests/browser-runtime-smoke.spec.mjs
            tests/post-match-autoqueue-core.test.mjs
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          printf '%s\n' "${durable[@]}" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          node --check browser/post-match-autoqueue-core.mjs
          node --test tests/post-match-autoqueue-core.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-temp-normalmatch-r6-currentbase-recovery.yml
          git add .
          git commit -m "NORMALMATCH R6: recover autoqueue on current Result base"
          git push origin HEAD:work/normalmatch-r6-currentbase-recovery
