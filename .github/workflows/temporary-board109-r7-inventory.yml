name: TEMP BOARD109 R7 exact-current geometry inventory

on:
  push:
    branches:
      - 'work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify exact ancestry and inspect board geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "af256e64b34aa796d998aeae807c45a949a14561"
          test "$(git rev-parse HEAD~2)" = "2f115ac62bf124a1c118ebeeef6dbff1e52566e7"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "3a8d34bfadf263e0980a4b1c9ec78f75fea07646"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          path = Path('browser/GAMEROAD.html')
          raw = path.read_bytes()
          text = raw.decode('utf-8-sig')
          git_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          assert git_blob == '3a8d34bfadf263e0980a4b1c9ec78f75fea07646'

          needles = [
              'function projectionFor', 'function centerPort', 'function nodeWorld', 'function nodeXY',
              'function posType', 'function activeNodes', 'function neighbors', 'function fieldFocusNodes',
              'function nodeTopSurface', 'function nearestProjectedNode', 'function renderField3D',
              'function renderBoard', "id.startsWith('K:')", '.node.corner', 'corner'
          ]
          out = {
              'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'browser_git_blob': git_blob,
              'browser_sha256': hashlib.sha256(raw).hexdigest(),
              'browser_bytes': len(raw),
              'occurrences': {}
          }
          for needle in needles:
              hits = [m.start() for m in re.finditer(re.escape(needle), text)]
              records=[]
              limit=12 if needle!='corner' else 20
              for pos in hits[:limit]:
                  records.append({
                      'line': text.count('\n',0,pos)+1,
                      'context': text[max(0,pos-1400):min(len(text),pos+len(needle)+2200)]
                  })
              out['occurrences'][needle]={'count':len(hits),'records':records}
          Path('board109_geometry_inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'head':out['head'],'blob':git_blob,'sha256':out['browser_sha256'],'bytes':len(raw),'counts':{k:v['count'] for k,v in out['occurrences'].items()}},ensure_ascii=False,indent=2))
          for key in ['function projectionFor','function centerPort','function nodeWorld','function nodeXY','function activeNodes','function neighbors','function fieldFocusNodes','function nodeTopSurface','function nearestProjectedNode','function renderField3D','function renderBoard','.node.corner']:
              print(f'===== {key} =====')
              for rec in out['occurrences'][key]['records'][:6]:
                  print(f"--- line {rec['line']} ---")
                  print(rec['context'])
          PY
      - name: Upload geometry inventory
        uses: actions/upload-artifact@v4
        with:
          name: board109-r7-geometry-inventory
          path: board109_geometry_inventory.json
          if-no-files-found: error
