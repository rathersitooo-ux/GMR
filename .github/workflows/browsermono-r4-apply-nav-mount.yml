name: BROWSERMONO R4 apply navigation production mount

on:
  push:
    branches:
      - work/browsermono-r4-navigation-production-mount-20260818
    paths:
      - '.github/scripts/browsermono-r4-apply-nav-mount.mjs'
      - '.github/workflows/browsermono-r4-apply-nav-mount.yml'

permissions:
  contents: write

jobs:
  apply-navigation-mount:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact-base fail-closed navigation mount
        shell: bash
        run: |
          set +e
          node .github/scripts/browsermono-r4-apply-nav-mount.mjs
          code=$?
          if [ "$code" -ne 0 ]; then
            git checkout -- browser/GAMEROAD.html .github/workflows/gameroad-required-gate.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- audit/browsermono-r4-nav-mount.json
            git commit -m "BROWSERMONO R4: record failed exact-base navigation patch"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$code"
          fi
      - name: Run navigation mount unit contracts
        run: node --test tests/screen-navigation-core.test.mjs tests/screen-navigation-live-adapter.test.mjs
      - name: Run current Browser static gate
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
      - name: Commit production mount and required-gate mapping only
        shell: bash
        run: |
          set -euo pipefail
          git add -- browser/GAMEROAD.html .github/workflows/gameroad-required-gate.yml
          test "$(git diff --cached --name-only)" = $'.github/workflows/gameroad-required-gate.yml\nbrowser/GAMEROAD.html'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "BROWSERMONO R4: mount screen navigation core in production HTML"
          git push origin "HEAD:${GITHUB_REF_NAME}"
