name: HATE R2 Guarded Repair

on:
  push:
    branches:
      - work/HATE-TIMER-01-R2-BROWSER-REAL-WAIT-SEMANTIC-REPAIR
    paths:
      - .github/workflows/hate-r2-source-inspect.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard and patch current Browser HATE semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/GAMEROAD.html)" = "c0ebc14e27f4b500018b1957daa80eb50df19039"
          node <<'NODE'
          const fs=require('fs');
          const path='browser/GAMEROAD.html';
          let s=fs.readFileSync(path,'utf8');
          function range(name){
            const needle=`function ${name}(`, i=s.indexOf(needle);
            if(i<0)throw Error(`missing function ${name}`);
            if(s.indexOf(needle,i+1)>=0)throw Error(`duplicate function ${name}`);
            const open=s.indexOf('{',i);let d=0,j=open;
            for(;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'&&--d===0){j++;break}}
            if(d!==0)throw Error(`unbalanced function ${name}`);
            return{i,j,text:s.slice(i,j)};
          }
          const tick=range('tickPartnerHate');
          if(!tick.text.includes('p.hateTime=Math.min(1000,p.hateTime+sec)'))throw Error('tickPartnerHate old increment anchor changed');
          const newTick=`function tickPartnerHate(now=performance.now()){\n  const m=state.match,p=currentHuman();if(!m||!p)return;const pd=ensurePartnerRuntime(m);\n  /* HATE is real-human wait time. Non-friend Browser matches have no authoritative second-human wait signal, while friend matches are host-authoritative below. */\n  pd.session=null;pd.remainderMs=0;pd.lastTick=now;return renderPartnerRuntime()\n}`;
          s=s.slice(0,tick.i)+newTick+s.slice(tick.j);

          if(s.includes('function friendHumanIsConnected(')||s.includes('function friendHasOtherConnectedHuman(')||s.includes('function friendHasSubmittedConnectedHuman('))throw Error('HATE R2 helpers already exist');
          const fr=range('friendHateSignature');
          if(!fr.text.includes("if(m.phase==='plan'&&!m.busy&&!FR.planValues[pid])return `plan:${m.round}:${pid}`"))throw Error('friend plan anchor changed');
          const replacement=`function friendHumanIsConnected(pid){if(pid==='P1')return FR.role==='host'&&FR.roomState==='playing';return !!slotByPid(pid)?.connected}\nfunction friendHasOtherConnectedHuman(pid){return pidList().some(other=>other!==pid&&friendHumanIsConnected(other))}\nfunction friendHasSubmittedConnectedHuman(pid){return pidList().some(other=>other!==pid&&friendHumanIsConnected(other)&&!!FR.planValues[other])}\nfunction friendHateSignature(pid){const m=state.match,p=m?.players?.find(x=>x.id===pid);if(FR.role!=='host'||FR.roomState!=='playing'||!m?.friendRoom||!p?.roomHuman||p.hateExploded||!friendHumanIsConnected(pid))return null;if(m.phase==='plan'&&!m.busy&&!FR.planValues[pid]&&friendHasSubmittedConnectedHuman(pid))return \`plan:\${m.round}:\${pid}\`;if(m.phase==='target'&&!m.busy&&m.activeId===pid&&friendHasOtherConnectedHuman(pid))return \`target:\${m.round}:\${pid}\`;for(const [id,w] of FR.choiceWait)if(w.pid===pid&&friendHasOtherConnectedHuman(pid))return \`choice:\${m.round}:\${id}:\${pid}\`;if(pid==='P1'&&FR.choiceActorPid==='P1'&&m.partnerDecision?.ability&&friendHasOtherConnectedHuman(pid))return \`choice:\${m.round}:local:\${m.partnerDecision.ability.id}:P1\`;return null}`;
          s=s.slice(0,fr.i)+replacement+s.slice(fr.j);
          fs.writeFileSync(path,s);
          console.log('PATCHED_BLOB='+require('child_process').execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim());
          NODE

      - name: Browser static check
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: HATE R2 semantic model tests from patched production functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const s=fs.readFileSync('browser/GAMEROAD.html','utf8');
          function fn(name){const needle=`function ${name}(`,i=s.indexOf(needle);assert.ok(i>=0,`missing ${name}`);const open=s.indexOf('{',i);let d=0,j=open;for(;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'&&--d===0){j++;break}}return s.slice(i,j)}
          assert.equal((s.match(/remainingTime/gi)||[]).length,0,'remainingTime must stay out of Browser HATE/current HTML');
          assert.ok(fn('friendTickHate').includes('p.hateTime=Math.min(1000,before+sec)'),'1000 HATE accumulation path changed unexpectedly');
          assert.ok(fn('friendTickHate').includes('friendExplode(p)'),'HATE explosion path changed unexpectedly');
          assert.ok(!fn('tickPartnerHate').includes('p.hateTime='),'non-friend local path must not accrue HATE without real-human wait authority');

          const ctx={console,FR:null,state:null};
          ctx.slotByPid=pid=>ctx.FR.slots[pid]||null;
          ctx.pidList=()=>Number(ctx.FR.playerCount)===4?['P1','P2','P3','P4']:['P1','P2'];
          vm.createContext(ctx);
          vm.runInContext([fn('friendHumanIsConnected'),fn('friendHasOtherConnectedHuman'),fn('friendHasSubmittedConnectedHuman'),fn('friendHateSignature')].join('\n')+'\nglobalThis.__sig=friendHateSignature;',ctx);
          function setup(n=2){
            ctx.FR={role:'host',roomState:'playing',playerCount:n,slots:{},planValues:{},choiceWait:new Map(),choiceActorPid:null};
            const ids=n===4?['P1','P2','P3','P4']:['P1','P2'];
            for(const id of ids.slice(1))ctx.FR.slots[id]={connected:true};
            ctx.state={match:{friendRoom:{host:true},phase:'plan',busy:false,round:7,activeId:null,partnerDecision:null,players:ids.map(id=>({id,roomHuman:true,hateExploded:false}))}};
          }
          setup(2);
          assert.equal(ctx.__sig('P1'),null,'all-unsubmitted P1 must be shared-thinking 0');
          assert.equal(ctx.__sig('P2'),null,'all-unsubmitted P2 must be shared-thinking 0');
          ctx.FR.planValues.P1={ok:true};
          assert.equal(ctx.__sig('P2'),'plan:7:P2','after P1 submits, connected P2 must accrue while P1 waits');
          assert.equal(ctx.__sig('P1'),null,'submitted P1 must not accrue');
          ctx.FR.slots.P2.connected=false;
          assert.equal(ctx.__sig('P2'),null,'disconnect/recovery grace must not accrue to disconnected decision-maker');
          ctx.FR.planValues={P2:{ok:true}};
          assert.equal(ctx.__sig('P1'),null,'disconnected submitted peer is not an actually waiting human');

          setup(2);
          ctx.state.match.phase='target';ctx.state.match.activeId='P1';
          assert.equal(ctx.__sig('P1'),'target:7:P1','sequential target must accrue when another connected human waits');
          ctx.FR.slots.P2.connected=false;
          assert.equal(ctx.__sig('P1'),null,'target must not accrue with no other connected human waiter');
          ctx.FR.slots.P2.connected=true;ctx.state.match.activeId='P2';
          assert.equal(ctx.__sig('P2'),'target:7:P2','connected guest target decision must accrue while host waits');
          ctx.FR.slots.P2.connected=false;
          assert.equal(ctx.__sig('P2'),null,'disconnected target decision-maker must not accrue during recovery grace');

          setup(2);
          ctx.state.match.phase='resolve';ctx.FR.choiceWait.set('c1',{pid:'P2'});
          assert.equal(ctx.__sig('P2'),'choice:7:c1:P2','remote required choice must accrue while connected host waits');
          ctx.FR.slots.P2.connected=false;
          assert.equal(ctx.__sig('P2'),null,'disconnected remote choice must not accrue');

          setup(4);
          for(const id of ['P1','P2','P3','P4'])assert.equal(ctx.__sig(id),null,`4p shared-thinking must be 0 for ${id}`);
          ctx.FR.planValues.P1={ok:true};
          for(const id of ['P2','P3','P4'])assert.equal(ctx.__sig(id),`plan:7:${id}`,`4p remaining connected human must accrue for ${id}`);
          ctx.FR.slots.P2.connected=false;
          assert.equal(ctx.__sig('P2'),null,'4p disconnected decision-maker must not accrue');
          assert.equal(ctx.__sig('P3'),'plan:7:P3','4p connected remaining human still accrues while submitted host waits');

          const p={hateTime:41};const pd={session:{signature:'plan:1:P1'},remainderMs:950,lastTick:0};let rendered=0;
          const tickCtx={state:{match:{friendRoom:null}},performance:{now:()=>2000},currentHuman:()=>p,ensurePartnerRuntime:()=>pd,renderPartnerRuntime:()=>{rendered++;return true}};
          vm.createContext(tickCtx);vm.runInContext(fn('tickPartnerHate')+'\nglobalThis.__tick=tickPartnerHate;',tickCtx);tickCtx.__tick(2000);
          assert.equal(p.hateTime,41,'non-friend local HATE must remain unchanged');assert.equal(pd.session,null);assert.equal(pd.remainderMs,0);assert.equal(pd.lastTick,2000);assert.equal(rendered,1);
          console.log('HATE_R2_SEMANTIC_TESTS=PASS');
          NODE

      - name: Commit guarded production repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- browser/GAMEROAD.html | head -n 240
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html
          test -n "$(git status --porcelain browser/GAMEROAD.html)"
          git commit -m "fix: align Browser HATE with real-human wait semantics"
          git push origin HEAD:work/HATE-TIMER-01-R2-BROWSER-REAL-WAIT-SEMANTIC-REPAIR
