name: Playtest R32 bounded Result patch

on:
  push:
    branches:
      - work/playtest-r32-result-ranking-fix
    paths:
      - .github/workflows/playtest-r32-bounded-html-patch.yml

permissions:
  contents: write

jobs:
  patch-result-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/playtest-r32-result-ranking-fix
          fetch-depth: 1
      - name: Verify exact base and patch only Result layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a92cb7822069624e9557c719afbc6573e9285cf2"
          test "$(git hash-object browser/GAMEROAD.html)" = "4485af3c1aabd7fdf2001a9e2586afbf7443ff53"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          data = p.read_bytes()
          old_grid = b'grid-template-rows:auto auto 1fr;gap:10px;overflow:hidden'
          new_grid = b'grid-template-rows:auto auto auto minmax(0,1fr);gap:10px;overflow:hidden'
          old_rank = b'#resultRanking{overflow:auto}'
          new_rank = b'#resultRanking{min-height:0;overflow:auto}'
          if data.count(old_grid) != 1:
              raise SystemExit(f'old Result grid occurrence count={data.count(old_grid)}, expected 1')
          if data.count(old_rank) != 1:
              raise SystemExit(f'old resultRanking occurrence count={data.count(old_rank)}, expected 1')
          data = data.replace(old_grid, new_grid, 1).replace(old_rank, new_rank, 1)
          if data.count(new_grid) != 1 or data.count(new_rank) != 1:
              raise SystemExit('post-patch invariant failed')
          p.write_bytes(data)
          PY
          git diff --check
          test "$(git diff --name-only)" = "browser/GAMEROAD.html"
          grep -Fq 'grid-template-rows:auto auto auto minmax(0,1fr);gap:10px;overflow:hidden' browser/GAMEROAD.html
          grep -Fq '#resultRanking{min-height:0;overflow:auto}' browser/GAMEROAD.html
          {
            echo "base_head=a92cb7822069624e9557c719afbc6573e9285cf2"
            echo "base_blob=4485af3c1aabd7fdf2001a9e2586afbf7443ff53"
            echo "patched_blob=$(git hash-object browser/GAMEROAD.html)"
            git diff --stat
          } > /tmp/playtest-r32-patch-report.txt
      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html
          git commit -m "PLAYTEST R32: keep full Result ranking reachable"
          git push origin HEAD:work/playtest-r32-result-ranking-fix
