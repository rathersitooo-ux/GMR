name: TEMP Battle Attacker Max Load R1

on:
  push:
    branches:
      - sol/battle-attacker-max-load-r1-20260907
    paths:
      - 'browser/battle-attacker-load-privilege-core.mjs'
      - 'tests/battle-attacker-load-privilege-core.test.mjs'
      - '.github/workflows/zz-temp-battle-attacker-r1.yml'

permissions:
  contents: read

jobs:
  focused-node-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run attacker privilege tests against current triad resolver
        run: node --test tests/battle-attacker-load-privilege-core.test.mjs
