name: DeckSave R11 Apply

on:
  push:
    branches:
      - 'work/BROWSER-DECK-SAVE-RECOVERY-NONDESTRUCTIVE-001-R11-PRODRECOVER-20260816T2241-SOL-H8K2V7'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'BROWSER-DECK-SAVE R11: apply exact current production recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Revalidate current baseline and apply R11
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "07e9654841786d647b11b46f2efc04d871bba330" ]]
          [[ "$(git hash-object browser/GAMEROAD.html)" == "7cb88f6f9a9e92001d13de72a343abddbd595a1c" ]]
          [[ "$(git hash-object browser/deck-save-recovery-core.mjs)" == "44d2c7f50309c99eec3ff0b9c106ae13e6b5dbee" ]]
          python3 - <<'PY'
          from pathlib import Path

          html_path=Path('browser/GAMEROAD.html')
          core_path=Path('browser/deck-save-recovery-core.mjs')
          core_test_path=Path('tests/deck-save-recovery-core.test.mjs')
          full_test_path=Path('tests/browser-full-interaction.spec.mjs')

          # 1) Keep the recovery implementation single-source while making it synchronously
          # consumable by the existing classic Browser script. Repo inspection proved the
          # only current ESM consumer is this dedicated test file.
          core=core_path.read_text(encoding='utf-8')
          export_functions=[
            'inspectRawSave','classifyDeckProjection','prepareExplicitDeckCommit','readStorage',
            'writePreparedSave','writePreparedSaveVerified','resetExplicitSaveKeys'
          ]
          for name in export_functions:
            marker=f'export function {name}'
            assert core.count(marker)==1, (name, core.count(marker))
            core=core.replace(marker,f'function {name}',1)
          const_marker='export const DECK_SAVE_RECOVERY_CORE = Object.freeze({ schema: SCHEMA });'
          assert core.count(const_marker)==1, core.count(const_marker)
          core=core.replace(const_marker,'const DECK_SAVE_RECOVERY_CORE = Object.freeze({ schema: SCHEMA });',1)
          assert 'GAMEROAD_DECK_SAVE_RECOVERY_CORE' not in core
          core += '''\n\nglobalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE = Object.freeze({\n  inspectRawSave,\n  classifyDeckProjection,\n  prepareExplicitDeckCommit,\n  readStorage,\n  writePreparedSave,\n  writePreparedSaveVerified,\n  resetExplicitSaveKeys,\n  DECK_SAVE_RECOVERY_CORE,\n});\n'''
          core_path.write_text(core,encoding='utf-8')

          core_test=core_test_path.read_text(encoding='utf-8')
          old_import="""import {\n  inspectRawSave,\n  classifyDeckProjection,\n  prepareExplicitDeckCommit,\n  readStorage,\n  writePreparedSave,\n  writePreparedSaveVerified,\n  resetExplicitSaveKeys,\n  DECK_SAVE_RECOVERY_CORE,\n} from '../browser/deck-save-recovery-core.mjs';\n"""
          new_import="""await import('../browser/deck-save-recovery-core.mjs');\nconst {\n  inspectRawSave,\n  classifyDeckProjection,\n  prepareExplicitDeckCommit,\n  readStorage,\n  writePreparedSave,\n  writePreparedSaveVerified,\n  resetExplicitSaveKeys,\n  DECK_SAVE_RECOVERY_CORE,\n} = globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE;\n"""
          assert core_test.count(old_import)==1, core_test.count(old_import)
          core_test=core_test.replace(old_import,new_import,1)
          core_test_path.write_text(core_test,encoding='utf-8')

          # 2) Insert recovery core as a synchronous classic script. Do NOT make the main
          # application script type=module: R8 proved that deferred modules let later classic
          # scripts run first and crash on a null/uninitialized state.
          html=html_path.read_text(encoding='utf-8')
          marker="</script>\n<script>\n(()=>{'use strict';\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];"
          replacement="""</script>\n<script src=\"./deck-save-recovery-core.mjs\"></script>\n<script>\n(()=>{'use strict';\nconst { inspectRawSave, classifyDeckProjection, prepareExplicitDeckCommit, readStorage, writePreparedSaveVerified, resetExplicitSaveKeys } = globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE;\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];"""
          assert html.count(marker)==1, html.count(marker)
          html=html.replace(marker,replacement,1)

          def replace_one_line(prefix,new_text,required=()):
            nonlocal_holder=None
            lines=html.splitlines()
            hits=[i for i,line in enumerate(lines) if line.startswith(prefix)]
            assert len(hits)==1,(prefix,hits)
            old=lines[hits[0]]
            for token in required:
              assert token in old,(prefix,token)
            lines[hits[0]]=new_text
            return '\n'.join(lines) + ('\n' if html.endswith('\n') else '')

          adapter="""const SAVE_AUTHORITY=Object.freeze({currentSaveRevision:3,currentRuleId:'FIRST_REGULATION',currentRuleRevision:3,recognizedLegacyRules:[{ruleId:'FIRST_REGULATION',ruleRevision:1,deckSizes:[24,26,39]},{ruleId:'FIRST_REGULATION',ruleRevision:2,deckSizes:[24,26,39]}]});
const saveRecoveryRuntime={inspection:null,classification:null,write:null,reset:null};
function savePack(){normalizeAudioSettings();state.partnerProfiles=normalizePartnerProfiles(state.partnerProfiles);return{v:3,playerCharacterId:state.playerCharacterId,partner:{schema:PARTNER_PROFILE_SCHEMA,selectedId:state.selectedPartnerId,profiles:state.partnerProfiles},settings:state.settings,history:state.history.slice(0,30),progression:{battlePoints:Math.max(0,Math.floor(Number(state.progression?.battlePoints)||0))},setupMode:state.setupMode,setupContent:state.setupContent,deck:{main:[...state.savedDeck.main],ex:[...state.savedDeck.ex],ruleId:state.savedDeckRule?.id??null,ruleRevision:state.savedDeckRule?.revision??null}}}
function saveProjection(root){const d=root&&typeof root==='object'&&!Array.isArray(root)?root:{},legacyArray=Array.isArray(d.deck),deck=legacyArray?{main:d.deck,ex:[],ruleId:null,ruleRevision:null}:(d.deck&&typeof d.deck==='object'&&!Array.isArray(d.deck)?d.deck:{}),hasArrays=Array.isArray(deck.main)&&Array.isArray(deck.ex),main=hasArrays?deck.main:[],ex=hasArrays?deck.ex:[];return{saveRevision:Number.isInteger(d.v)&&d.v>=0?d.v:-1,ruleId:deck.ruleId??null,ruleRevision:deck.ruleRevision??null,deckSize:hasArrays?main.length:-1,deckLegal:hasArrays?validateDeck({main,ex}).ok:false}}
function classifySave(inspection){const classification=classifyDeckProjection({inspection,projection:saveProjection(inspection.parsed),authority:SAVE_AUTHORITY});saveRecoveryRuntime.inspection=inspection;saveRecoveryRuntime.classification=classification;return classification}
function markStorageReadFailure(reason){saveRecoveryRuntime.inspection={status:'unreadable',reason};saveRecoveryRuntime.classification={status:'blocked',reason};saveRecoveryRuntime.write={status:'failed',reason};state.storage='memory'}
function cloneObject(v){return v&&typeof v==='object'&&!Array.isArray(v)?JSON.parse(JSON.stringify(v)):{} }
function mergeKnownPack(base,pack){const next={...cloneObject(base),...pack};next.partner={...cloneObject(base?.partner),...pack.partner,profiles:{...cloneObject(base?.partner?.profiles),...cloneObject(pack.partner?.profiles)}};next.settings={...cloneObject(base?.settings),...pack.settings,audio:{...cloneObject(base?.settings?.audio),...cloneObject(pack.settings?.audio)}};next.progression={...cloneObject(base?.progression),...cloneObject(pack.progression)};next.deck={...pack.deck};return next}
function applyParsedSave(d){if(d.v<=2){const legacy=PROD_CHARS.some(c=>c.id===d.selectedCharacter)?d.selectedCharacter:'partner.naki';state.selectedPartnerId=legacy;state.playerCharacterId=legacy;state.partnerProfiles=normalizePartnerProfiles(null)}else{if(PROD_CHARS.some(c=>c.id===d.playerCharacterId))state.playerCharacterId=d.playerCharacterId;if(PROD_CHARS.some(c=>c.id===d.partner?.selectedId))state.selectedPartnerId=d.partner.selectedId;state.partnerProfiles=normalizePartnerProfiles(d.partner?.profiles)}if(d.settings)Object.assign(state.settings,d.settings);normalizeAudioSettings();if(Array.isArray(d.history))state.history=d.history.slice(0,30);state.progression={battlePoints:Math.max(0,Math.floor(Number(d.progression?.battlePoints)||0))};if(['2p','4p','2v2'].includes(d.setupMode))state.setupMode=d.setupMode;if(['road_shield','honey_hunt'].includes(d.setupContent))state.setupContent=d.setupContent;if((d.v===2||d.v===3)&&d.deck&&Array.isArray(d.deck.main)&&Array.isArray(d.deck.ex)){state.savedDeck={main:[...d.deck.main],ex:[...d.deck.ex]};state.savedDeckRule={id:typeof d.deck.ruleId==='string'?d.deck.ruleId:null,revision:Number.isInteger(d.deck.ruleRevision)?d.deck.ruleRevision:null}}state.deckDraft={main:[...state.savedDeck.main],ex:[...state.savedDeck.ex]}}
function prepareCurrentPackCommit(inspection,classification,pack){const nextProjection={saveRevision:3,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision,deckSize:pack.deck.main.length,deckLegal:validateDeck({main:pack.deck.main,ex:pack.deck.ex}).ok};const prepared=prepareExplicitDeckCommit({inspection,currentClassification:classification,path:['deck'],nextDeckRecord:pack.deck,nextProjection,authority:SAVE_AUTHORITY});if(prepared.status!=='prepared')return prepared;const nextRoot={...mergeKnownPack(prepared.nextRoot,pack),v:3};return{...prepared,nextRoot,serialized:JSON.stringify(nextRoot)}}
function save(){const pack=savePack(),read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){memorySave=JSON.stringify(pack);markStorageReadFailure(read.reason);return false}const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection);if(classification.status!=='current'){memorySave=JSON.stringify(pack);state.storage='memory';saveRecoveryRuntime.write={status:'blocked',reason:classification.reason};$('#storageStatus')&&($('#storageStatus').textContent='この起動中に保存');return false}if(state.savedDeckRule?.id!==DECK_RULE.id||state.savedDeckRule?.revision!==DECK_RULE.revision||!validateDeck(state.savedDeck).ok){state.storage='memory';saveRecoveryRuntime.write={status:'blocked',reason:'CURRENT_RUNTIME_DECK_NOT_LEGAL'};return false}const prepared=prepareCurrentPackCommit(inspection,classification,pack);if(prepared.status!=='prepared'){state.storage='memory';saveRecoveryRuntime.write=prepared;return false}const latest=readStorage(localStorage,SAVE_KEY);if(latest.status!=='read'||latest.rawValue!==read.rawValue){state.storage='memory';saveRecoveryRuntime.write={status:'failed',reason:latest.status==='read'?'SAVE_CHANGED_DURING_WRITE':latest.reason};return false}const written=writePreparedSaveVerified(localStorage,SAVE_KEY,prepared);saveRecoveryRuntime.write=written;if(written.status!=='saved'){memorySave=prepared.serialized;state.storage='memory';$('#storageStatus')&&($('#storageStatus').textContent='この起動中に保存');return false}memorySave=prepared.serialized;state.storage='localStorage';$('#saveState')&&($('#saveState').textContent='保存済み');$('#storageStatus')&&($('#storageStatus').textContent='端末保存');return true}
function load(){const read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){markStorageReadFailure(read.reason);state.deckDraft={main:[...state.savedDeck.main],ex:[...state.savedDeck.ex]};recoverDeckDraftSession();return saveRecoveryRuntime.classification}state.storage='localStorage';memorySave=read.rawValue;const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection);if((classification.status==='current'||classification.status==='recognized_legacy')&&inspection.parsed)applyParsedSave(inspection.parsed);normalizeAudioSettings();state.partnerProfiles=normalizePartnerProfiles(state.partnerProfiles);state.progression=state.progression&&typeof state.progression==='object'?state.progression:{battlePoints:0};recoverDeckDraftSession();if(classification.status!=='current')state.storage='memory';return classification}
window.__GAMEROAD_SAVE_RECOVERY__={snapshot:()=>JSON.parse(JSON.stringify(saveRecoveryRuntime)),authority:{...SAVE_AUTHORITY}};"""

          lines=html.splitlines()
          save_hits=[i for i,l in enumerate(lines) if l.startswith('function save(){')]
          load_hits=[i for i,l in enumerate(lines) if l.startswith('function load(){')]
          assert len(save_hits)==1 and len(load_hits)==1,(save_hits,load_hits)
          assert 'localStorage.setItem(SAVE_KEY,raw)' in lines[save_hits[0]]
          assert 'return save()' in lines[load_hits[0]] and 'localStorage.removeItem(SAVE_KEY)' in lines[load_hits[0]]
          first=min(save_hits[0],load_hits[0]); second=max(save_hits[0],load_hits[0])
          assert second==first+1,(first,second)
          lines[first:second+1]=adapter.splitlines()
          html='\n'.join(lines)+('\n' if html.endswith('\n') else '')

          new_commit="""function commitDeck(){const v=validateDeck(state.deckDraft);if(!v.ok){toast(v.errors[0]);renderCards();return false}const nextDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex],ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision},nextProjection={saveRevision:3,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision,deckSize:state.deckDraft.main.length,deckLegal:true},read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){markStorageReadFailure(read.reason);toast('端末保存を確認できません。札組は保存していません');renderCards();return false}const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection),prepared=prepareExplicitDeckCommit({inspection,currentClassification:classification,path:['deck'],nextDeckRecord:nextDeck,nextProjection,authority:SAVE_AUTHORITY});if(prepared.status!=='prepared'){saveRecoveryRuntime.write=prepared;state.storage='memory';toast('保存データを保護するため札組を上書きしません');renderCards();return false}const currentPack=savePack();currentPack.deck=nextDeck;const stampedRoot={...mergeKnownPack(prepared.nextRoot,currentPack),v:3},stampedPrepared={...prepared,serialized:JSON.stringify(stampedRoot),nextRoot:stampedRoot},latest=readStorage(localStorage,SAVE_KEY);if(latest.status!=='read'||latest.rawValue!==read.rawValue){saveRecoveryRuntime.write={status:'failed',reason:latest.status==='read'?'SAVE_CHANGED_DURING_WRITE':latest.reason};state.storage='memory';toast('保存状態が変わったため札組を上書きしません');renderCards();return false}const written=writePreparedSaveVerified(localStorage,SAVE_KEY,stampedPrepared);saveRecoveryRuntime.write=written;if(written.status!=='saved'){state.storage='memory';toast(written.originalPreserved===false?'保存に失敗し、元データの復元も確認できません':'保存に失敗しました。元の保存データを維持します');renderCards();return false}memorySave=stampedPrepared.serialized;state.storage='localStorage';state.savedDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex]};state.savedDeckRule={id:DECK_RULE.id,revision:DECK_RULE.revision};clearDeckDraftSession();renderCards();renderSetupDeckStatus();if(typeof ctxSet==='function')ctxSet('DECK_SAVED',{kind:'ok',ttl:2200});toast('札組を端末へ保存しました');return true}"""
          lines=html.splitlines(); hits=[i for i,l in enumerate(lines) if l.startswith('function commitDeck(){')]; assert len(hits)==1,hits
          assert "toast('札組を端末へ保存しました')" in lines[hits[0]] and 'save();' in lines[hits[0]]
          lines[hits[0]]=new_commit
          html='\n'.join(lines)+('\n' if html.endswith('\n') else '')

          reset_line="""$('#reduceMotion').onclick=()=>{state.settings.reduceMotion=!state.settings.reduceMotion;document.documentElement.style.setProperty('--motion',state.settings.reduceMotion?'0':'1');save();renderSettings()};$('#lowPerf').onclick=()=>{state.settings.lowPerf=!state.settings.lowPerf;save();renderSettings()};$('#resetSave').onclick=()=>{if(!window.confirm('端末のGAMEROAD保存を初期化します。よろしいですか？'))return false;const rr=resetExplicitSaveKeys(localStorage,[SAVE_KEY],{confirmed:true});saveRecoveryRuntime.reset=rr;if(rr.status!=='reset'){state.storage='memory';renderSettings();toast('保存の初期化に失敗しました。元の保存データを維持します');return false}memorySave=null;clearDeckDraftSession();state.history=[];state.progression={battlePoints:0};state.setupMode='2p';state.setupContent='road_shield';state.selectedPartnerId='partner.naki';state.playerCharacterId='partner.naki';state.characterSelectionRole='partner';state.partnerProfiles=normalizePartnerProfiles(null);state.settings={reduceMotion:false,lowPerf:false,audio:{...AUDIO_DEFAULTS}};state.lastPackPreview=[];state.gachaBusy=false;state.savedDeck={main:[...DEFAULT_DECK],ex:[]};state.savedDeckRule={id:null,revision:null};state.deckDraft={main:[...DEFAULT_DECK],ex:[]};state.storage='memory';audioStopMusic('reset');audioRuntime.seenEvents.clear();renderSettings();renderCards();renderSetupDeckStatus();toast('保存を初期化しました');return true};wireAudioSettings();"""
          lines=html.splitlines(); hits=[i for i,l in enumerate(lines) if l.startswith("$('#reduceMotion').onclick=")]; assert len(hits)==1,hits
          assert "localStorage.removeItem(SAVE_KEY)" in lines[hits[0]] and 'save();renderSettings()' in lines[hits[0]]
          lines[hits[0]]=reset_line
          html='\n'.join(lines)+('\n' if html.endswith('\n') else '')

          lines=html.splitlines(); hits=[i for i,l in enumerate(lines) if l.startswith("$('#saveDeck').addEventListener('click',()=>{const v=validateDeck(state.deckDraft);")]; assert len(hits)==1,hits
          assert "ctxSet('DECK_SAVED'" in lines[hits[0]]
          lines[hits[0]]="$('#saveDeck').addEventListener('click',()=>{const v=validateDeck(state.deckDraft);if(!v.ok)ctxSet('DECK_INVALID',{message:ctxSafeText(v.errors[0])});else ctxClear('DECK_')},true);"
          html='\n'.join(lines)+('\n' if html.endswith('\n') else '')

          # Postconditions against the actual production file.
          assert html.count('<script src="./deck-save-recovery-core.mjs"></script>')==1
          assert '<script type="module">' not in html[html.find('<script src="./deck-save-recovery-core.mjs"></script>'):html.find('<script src="./deck-save-recovery-core.mjs"></script>')+500]
          assert html.count('GAMEROAD_DECK_SAVE_RECOVERY_CORE')==1
          assert html.count('window.__GAMEROAD_SAVE_RECOVERY__')==1
          assert "if(!raw){state.deckDraft={main:[...state.savedDeck.main]" not in html
          assert "try{localStorage.removeItem(SAVE_KEY)}catch" not in html[html.find("function load(){"):html.find("function show(")]
          assert "commitDeck(){const v=validateDeck" in html
          html_path.write_text(html,encoding='utf-8')

          # 3) Add Browser-level non-destructive recovery evidence on the exact current test suite.
          full=full_test_path.read_text(encoding='utf-8')
          title="test('deck recovery preserves blocked raw saves, repairs legacy only on explicit legal commit, rolls back failures, and resets without reseeding'"
          assert title not in full
          addition=r'''

test('deck recovery preserves blocked raw saves, repairs legacy only on explicit legal commit, rolls back failures, and resets without reseeding', async ({ page }, testInfo) => {
  const runtime = observeRuntimeErrors(page);
  await bootCurrentBrowser(page);
  const initialRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);
  expect(initialRaw, 'missing save is not implicitly materialized on boot').toBeNull();
  const defaultDeck = await page.evaluate(() => [...window.__DEFAULT_DECK__]);
  expect(defaultDeck).toHaveLength(26);

  const reloadWithRaw = async (raw) => {
    await page.evaluate(({ key, rawValue }) => localStorage.setItem(key, rawValue), { key: STORAGE_KEY, rawValue: raw });
    await page.reload({ waitUntil: 'domcontentloaded' });
    await page.waitForTimeout(800);
    return page.evaluate((key) => ({ raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(), savedDeck: [...window.__GAMEROAD_TEST__.state.savedDeck.main], rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule }, playerCharacterId: window.__GAMEROAD_TEST__.state.playerCharacterId, selectedPartnerId: window.__GAMEROAD_TEST__.state.selectedPartnerId, setupMode: window.__GAMEROAD_TEST__.state.setupMode, setupContent: window.__GAMEROAD_TEST__.state.setupContent }), STORAGE_KEY);
  };

  const corruptRaw = '{not-json';
  let observed = await reloadWithRaw(corruptRaw);
  expect(observed.raw).toBe(corruptRaw);
  expect(observed.recovery.inspection.status).toBe('corrupt');
  expect(observed.recovery.classification.status).toBe('blocked');

  const unknownRaw = JSON.stringify({ v: 3, opaque: { keep: 7 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 99 } });
  observed = await reloadWithRaw(unknownRaw);
  expect(observed.raw).toBe(unknownRaw);
  expect(observed.recovery.classification.reason).toBe('RULE_UNKNOWN_OR_UNSUPPORTED');

  const newerRaw = JSON.stringify({ v: 4, opaque: { keep: 8 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 3 } });
  observed = await reloadWithRaw(newerRaw);
  expect(observed.raw).toBe(newerRaw);
  expect(observed.recovery.classification.reason).toBe('SAVE_REVISION_NEWER');

  const legacyRaw = JSON.stringify({ v: 2, selectedCharacter: 'partner.naki', history: [{ keep: 'legacy-history' }], settings: { reduceMotion: true }, progression: { battlePoints: 9 }, setupMode: '4p', setupContent: 'honey_hunt', deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 2 }, opaque: { keep: 9 } });
  observed = await reloadWithRaw(legacyRaw);
  expect(observed.raw).toBe(legacyRaw);
  expect(observed.recovery.classification.status).toBe('recognized_legacy');
  expect(observed.savedDeck).toHaveLength(26);
  expect(observed.rule.revision).toBe(2);
  const legal = await installLegalBattleDeck(page);
  expect(legal.committed).toBeTruthy();
  let stored = await page.evaluate((key) => JSON.parse(localStorage.getItem(key)), STORAGE_KEY);
  expect(stored.v).toBe(3);
  expect(stored.opaque.keep).toBe(9);
  expect(stored.history[0].keep).toBe('legacy-history');
  expect(stored.playerCharacterId).toBe('partner.naki');
  expect(stored.partner.selectedId).toBe('partner.naki');
  expect(stored.setupMode).toBe('4p');
  expect(stored.setupContent).toBe('honey_hunt');
  expect(stored.deck.main).toHaveLength(40);
  expect(stored.deck.ruleRevision).toBe(3);

  observed = await reloadWithRaw(JSON.stringify(stored));
  expect(observed.playerCharacterId).toBe('partner.naki');
  expect(observed.selectedPartnerId).toBe('partner.naki');
  expect(observed.setupMode).toBe('4p');
  expect(observed.setupContent).toBe('honey_hunt');

  const previousRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);
  const mismatch = await page.evaluate((key) => {
    const t = window.__GAMEROAD_TEST__, proto = Object.getPrototypeOf(localStorage), originalSetItem = proto.setItem;
    let writes = 0;
    Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value(k, v) { writes += 1; return originalSetItem.call(this, k, writes === 1 ? `${v}x` : v); } });
    let committed;
    try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value: originalSetItem }); }
    return { committed, raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
  }, STORAGE_KEY);
  expect(mismatch.committed).toBeFalsy();
  expect(mismatch.raw).toBe(previousRaw);
  expect(mismatch.recovery.write.reason).toBe('STORAGE_READBACK_MISMATCH');

  const readFailure = await page.evaluate(() => {
    const t = window.__GAMEROAD_TEST__, proto = Object.getPrototypeOf(localStorage), originalGetItem = proto.getItem;
    Object.defineProperty(proto, 'getItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-read-failure'); } });
    let committed;
    try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'getItem', { configurable: true, writable: true, value: originalGetItem }); }
    return { committed, savedCount: t.state.savedDeck.main.length, recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
  });
  expect(readFailure.committed).toBeFalsy();
  expect(readFailure.savedCount).toBe(40);
  expect(readFailure.recovery.write.reason).toBe('STORAGE_READ_FAILED');

  page.once('dialog', async (dialog) => dialog.accept());
  const removeFailureResult = await page.evaluate((key) => {
    const proto = Object.getPrototypeOf(localStorage), originalRemoveItem = proto.removeItem;
    Object.defineProperty(proto, 'removeItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-remove-failure'); } });
    try { document.querySelector('#resetSave').click(); } finally { Object.defineProperty(proto, 'removeItem', { configurable: true, writable: true, value: originalRemoveItem }); }
    return { raw: localStorage.getItem(key), savedCount: window.__GAMEROAD_TEST__.state.savedDeck.main.length, recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
  }, STORAGE_KEY);
  expect(removeFailureResult.raw).toBe(previousRaw);
  expect(removeFailureResult.savedCount).toBe(40);
  expect(removeFailureResult.recovery.reset.reason).toBe('STORAGE_REMOVE_FAILED');

  page.once('dialog', async (dialog) => dialog.accept());
  await page.evaluate(() => document.querySelector('#resetSave').click());
  await page.waitForTimeout(120);
  const afterReset = await page.evaluate((key) => ({ raw: localStorage.getItem(key), savedCount: window.__GAMEROAD_TEST__.state.savedDeck.main.length, rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule } }), STORAGE_KEY);
  expect(afterReset.raw, 'explicit reset does not resurrect the transient starter as a durable save').toBeNull();
  expect(afterReset.savedCount).toBe(26);
  expect(afterReset.rule.id).toBeNull();

  const writeFailure = await page.evaluate((key) => {
    const t = window.__GAMEROAD_TEST__;
    const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
    const standard = window.__CARD_DATA__.filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank))).map((card) => card.id);
    const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
    const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
    const main = [...nonRoyal.slice(0, 37), ...royalIds];
    const setValidation = t.deckSetDraft(main, []);
    const proto = Object.getPrototypeOf(localStorage), originalSetItem = proto.setItem;
    Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-write-failure'); } });
    let committed;
    try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value: originalSetItem }); }
    return { committed, setValidation, raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(), savedCount: t.state.savedDeck.main.length };
  }, STORAGE_KEY);
  expect(writeFailure.setValidation.ok).toBeTruthy();
  expect(writeFailure.committed).toBeFalsy();
  expect(writeFailure.raw).toBeNull();
  expect(writeFailure.savedCount).toBe(26);
  expect(writeFailure.recovery.write.status).toBe('failed');
  runtime.assertClean(testInfo);
});
