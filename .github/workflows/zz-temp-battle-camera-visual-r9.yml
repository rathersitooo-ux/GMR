name: TEMP Battle Camera Visual R9

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-20260914

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research-backed visual deconflict
        shell: bash
        run: |
          set -euo pipefail
          current_blob="$(git hash-object browser/GAMEROAD.html)"
          echo "current_html_blob=$current_blob"
          test "$current_blob" = "6095bc60cdc2d38f1d936056ae0149fd25ffa1cf"
          python - <<'PY'
          from pathlib import Path
          import re

          hp=Path('browser/GAMEROAD.html')
          s=hp.read_text(encoding='utf-8')
          style_pattern=r'<style id="gameroad-battle-camera-live-style">[\s\S]*?</style>'
          assert len(re.findall(style_pattern,s))==1
          new_style='''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn[hidden]{display:none!important}
          #cameraReturnBtn[hidden]{pointer-events:none!important}
          #cameraReturnBtn.cameraReturnControl{position:absolute;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:34;display:flex;align-items:center;justify-content:center;min-width:56px;min-height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.58);border-radius:22px;background:rgba(27,31,36,.94);color:#f5f7f8;font:800 13px/1 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.28);touch-action:manipulation;pointer-events:auto}
          #cameraReturnBtn.cameraReturnControl[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(255,255,255,.24),0 6px 18px rgba(0,0,0,.28)}
          #battleMap[data-camera-mode="MANUAL_INSPECT"] .battleRail{opacity:0;pointer-events:none!important;visibility:hidden}
          </style>'''
          s=re.sub(style_pattern,lambda _:new_style,s,count=1)
          assert s.count('id="cameraReturnBtn"')==1
          rail=re.search(r'<div class="battleRail">([\s\S]*?)</div>',s)
          assert rail and 'cameraReturnBtn' not in rail.group(1)
          assert "cameraState.mode==='MANUAL_INSPECT';returnControl.hidden=!manual" in s
          hp.write_text(s,encoding='utf-8')

          tp=Path('tests/browser-static-check.mjs')
          t=tp.read_text(encoding='utf-8')
          anchor='  errors.push(...collectHomeVisualShellErrors(html));\n'
          assert t.count(anchor)==1
          existing="  if (!/#battleMap\\[data-camera-mode=[\"']MANUAL_INSPECT[\"']\\] \\.battleRail\\{opacity:0;pointer-events:none;visibility:hidden\\}/.test(html)) errors.push('battle rail does not yield during manual camera inspect');\n"
          stronger="  if (!/#battleMap\\[data-camera-mode=[\"']MANUAL_INSPECT[\"']\\] \\.battleRail\\{opacity:0;pointer-events:none!important;visibility:hidden\\}/.test(html)) errors.push('battle rail does not yield visual and input ownership during manual camera inspect');\n"
          if existing in t:
              t=t.replace(existing,stronger,1)
          elif 'battle rail does not yield visual and input ownership during manual camera inspect' not in t:
              t=t.replace(anchor,stronger+anchor,1)
          tp.write_text(t,encoding='utf-8')
          PY
          git diff --check
      - name: Run focused camera and static checks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-camera-control-core.test.mjs tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Run 667x375 actual visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .camera-667 visual-evidence test-results
          cat > .camera-667/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir:'.',testMatch:'camera-667.spec.mjs',outputDir:'../test-results',timeout:90000,
            expect:{timeout:7000},workers:1,retries:0,
            use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},trace:'retain-on-failure'},
            webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}
          });
          EOF
          cat > .camera-667/camera-667.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const output=path.resolve('visual-evidence');
          async function installLegalBattleDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__;const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);const royalIds=['SP_J','SP_Q','SP_K'];const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));const main=[...nonRoyal.slice(0,37),...royalIds];t.deckSetDraft(main,[]);const validation=t.deckValidate(t.state.deckDraft,{forBattle:true});const committed=validation.ok?t.deckCommit():false;return{committed,validation,saved:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          function overlaps(a,b){return !!(a&&b&&a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y)}
          test('manual inspect yields low-priority UI without stealing hand or HUD space',async({page})=>{
            const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});expect(response?.ok()).toBeTruthy();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});
            const deck=await installLegalBattleDeck(page);expect(deck.committed).toBeTruthy();expect(deck.saved.ok).toBeTruthy();
            const setupControl=page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first();await expect(setupControl).toBeVisible();await setupControl.click();
            const setup=page.locator('section[data-screen="setup"]');await expect(setup).toBeVisible();await setup.locator('[data-content="road_shield"]').click();await setup.locator('[data-mode="2p"]').click();await setup.locator('#startMatch').click();
            const battle=page.locator('section[data-screen="battle"]');await expect(battle).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();
            const ret=battle.locator('#cameraReturnBtn');const rail=battle.locator('.battleRail');const hand=battle.locator('#hand');const top=battle.locator('.battleTopStatus');
            await expect(ret).toBeHidden();
            const follow=await ret.evaluate(el=>({hidden:el.hidden,display:getComputedStyle(el).display,pointer:getComputedStyle(el).pointerEvents,rects:el.getClientRects().length,aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));
            expect(follow).toEqual({hidden:true,display:'none',pointer:'none',rects:0,aria:'true',tab:-1});
            await page.screenshot({path:path.join(output,'camera-follow-667x375.png'),animations:'disabled'});
            const world=battle.locator('#battleMap');const box=await world.boundingBox();expect(box).not.toBeNull();
            await page.mouse.move(box.x+box.width*.52,box.y+box.height*.50);await page.mouse.down();await page.mouse.move(box.x+box.width*.35,box.y+box.height*.50,{steps:8});await page.mouse.up();
            await expect(ret).toBeVisible();await expect(ret).toHaveAttribute('data-camera-mode','MANUAL_INSPECT');
            const rr=await ret.boundingBox();const hr=await hand.boundingBox();const tr=await top.boundingBox();expect(rr).not.toBeNull();
            expect(rr.width).toBeGreaterThanOrEqual(44);expect(rr.height).toBeGreaterThanOrEqual(44);expect(rr.x).toBeGreaterThanOrEqual(0);expect(rr.y).toBeGreaterThanOrEqual(0);expect(rr.x+rr.width).toBeLessThanOrEqual(667);expect(rr.y+rr.height).toBeLessThanOrEqual(375);expect(overlaps(rr,hr)).toBeFalsy();expect(overlaps(rr,tr)).toBeFalsy();
            const railState=await rail.evaluate(el=>({opacity:getComputedStyle(el).opacity,pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));expect(railState).toEqual({opacity:'0',pointer:'none',visibility:'hidden'});
            const manual=await ret.evaluate(el=>({aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));expect(manual).toEqual({aria:'false',tab:0});
            const target=battle.locator('#targetBox');if(await target.count()&&await target.isVisible()){const xr=await target.boundingBox();expect(overlaps(rr,xr)).toBeFalsy();}
            fs.writeFileSync(path.join(output,'camera-manual-667-metrics.json'),JSON.stringify({returnRect:rr,handRect:hr,topRect:tr,railState},null,2));
            await page.screenshot({path:path.join(output,'camera-manual-667x375.png'),animations:'disabled'});
            await ret.click();await expect(ret).toBeHidden();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode)).toBe('FOLLOW_CONTROLLED');
            const restored=await rail.evaluate(el=>({pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));expect(restored.visibility).not.toBe('hidden');expect(restored.pointer).not.toBe('none');
            await page.screenshot({path:path.join(output,'camera-returned-667x375.png'),animations:'disabled'});
          });
          EOF
          npx playwright test --config=.camera-667/playwright.config.mjs --workers=1
      - name: Upload 667x375 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-camera-visual-r9-${{ github.run_id }}
          path: |
            visual-evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified product delta and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-battle-camera-visual-r9.yml
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/zz-temp-battle-camera-visual-r9.yml browser/GAMEROAD.html tests/browser-static-check.mjs | sort)"
          test "$changed" = "$expected"
          git commit -m 'Battle: 手動カメラ確認時に低優先UIを退避 R9'
          git push origin HEAD:sol/battle-camera-visual-r9-20260914
