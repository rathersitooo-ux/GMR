name: TEMP WU63 667 Rail Repair R1

on:
  push:
    branches:
      - sol/battle-wu63-667-rail-repair-r1-20260914

permissions:
  contents: read

jobs:
  inspect-runtime-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wu63-r1 visual-evidence/wu63-r1 test-results/wu63-r1
          cat > .wu63-r1/playwright.config.mjs <<'EOF'
          import {defineConfig} from '@playwright/test';export default defineConfig({testDir:'.',testMatch:'runtime.spec.mjs',outputDir:'../test-results/wu63-r1',timeout:90000,workers:1,use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},hasTouch:true},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',timeout:120000}})
          EOF
          cat > .wu63-r1/runtime.spec.mjs <<'EOF'
          import{test,expect}from'@playwright/test';import fs from'node:fs';import path from'node:path';
          async function deck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__,pub=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id)),ids=window.__CARD_DATA__.filter(c=>pub.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id),royal=['SP_J','SP_Q','SP_K'],non=ids.filter(id=>!t.isRoyalCard(id));t.deckSetDraft([...non.slice(0,37),...royal],[]);return t.deckValidate(t.state.deckDraft,{forBattle:true}).ok?t.deckCommit():false})}
          test('runtime styles',async({page})=>{await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});await expect(page.locator('section[data-screen="home"]')).toBeVisible();await expect.poll(()=>page.evaluate(()=>typeof window.__GAMEROAD_TEST__?.deckPublic==='function'&&Array.isArray(window.__CARD_DATA__))).toBeTruthy();expect(await deck(page)).toBeTruthy();await page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first().click();const s=page.locator('section[data-screen="setup"]');await expect(s).toBeVisible();await s.locator('[data-content="road_shield"]').evaluate(el=>el.click());await s.locator('[data-mode="2p"]').evaluate(el=>el.click());await s.locator('#startMatch').evaluate(el=>el.click());await expect(page.locator('section.battle.active')).toBeVisible();const d=await page.evaluate(()=>{const rail=document.querySelector('.battle.active .battleRail'),cs=getComputedStyle(rail),r=rail.getBoundingClientRect();return{matchesBattleDescendant:rail.matches('.battle .battleRail'),inline:rail.getAttribute('style'),computed:{top:cs.top,bottom:cs.bottom,right:cs.right,width:cs.width,height:cs.height,display:cs.display,position:cs.position,transform:cs.transform},rect:{x:r.x,y:r.y,w:r.width,h:r.height},styles:[...document.querySelectorAll('style')].map((e,i)=>({i,id:e.id||'',text:e.textContent})).filter(x=>x.text.includes('battleRail')).map(x=>({...x,text:x.text.slice(0,18000)})),links:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href)}});fs.writeFileSync(path.resolve('visual-evidence/wu63-r1/runtime-styles.json'),JSON.stringify(d,null,2));console.log(JSON.stringify({computed:d.computed,rect:d.rect,styleIds:d.styles.map(x=>x.id)},null,2));});
          EOF
          npx playwright test --config=.wu63-r1/playwright.config.mjs --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: battle-wu63-r1-runtime-styles-${{github.run_id}}
          path: visual-evidence/wu63-r1/runtime-styles.json
          retention-days: 14
