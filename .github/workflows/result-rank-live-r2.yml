name: GAMEROAD Result Rank Live R2 Diagnostic

on:
  push:
    branches:
      - work/result-rank-live-r2-20260904

permissions:
  contents: write

jobs:
  inspect-result-rank-seam:
    if: ${{ !contains(github.event.head_commit.message, 'diag: capture Result rank seam') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture exact Result rank seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('browser/GAMEROAD.html')
          manifest_path = Path('data/preaction-authorizations/RESULT-RANK-LIVE-R2-20260904T2347-SOL-Q5N8K3.json')
          text = html_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          needles = [
              'resultRanking',
              'rankLine',
              'lastResult?.ranking',
              'lastResult.ranking',
              'lastResult?.ranking?.',
          ]
          diagnostic = {
              'htmlBytes': len(text.encode('utf-8')),
              'needles': {},
          }
          all_positions = []
          for needle in needles:
              positions = []
              start = 0
              while True:
                  pos = text.find(needle, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  all_positions.append(pos)
                  start = pos + len(needle)
              diagnostic['needles'][needle] = {
                  'count': len(positions),
                  'positions': positions[:40],
              }

          # Capture bounded source windows around every unique relevant occurrence.
          windows = []
          for pos in sorted(set(all_positions))[:80]:
              lo = max(0, pos - 1800)
              hi = min(len(text), pos + 2600)
              snippet = text[lo:hi]
              windows.append({
                  'offset': pos,
                  'start': lo,
                  'end': hi,
                  'snippet': snippet,
              })
          diagnostic['windows'] = windows

          # Fail closed if there is no actual Result ranking DOM marker.
          if diagnostic['needles']['resultRanking']['count'] == 0 or diagnostic['needles']['rankLine']['count'] == 0:
              raise SystemExit('Result ranking seam not found; refusing product mutation')

          manifest['diagnostic'] = diagnostic
          manifest['persistenceState'] = 'DIAGNOSTIC_CAPTURED_NO_PRODUCT_MUTATION'
          manifest['lastConfirmedStep'] = 'Exact current giant-HTML occurrences around resultRanking/rankLine/lastResult ranking captured by branch workflow; no product mutation performed.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic readback only
        shell: bash
        run: |
          git config user.name 'gameroad-result-rank-bot'
          git config user.email 'gameroad-result-rank-bot@users.noreply.github.com'
          git add data/preaction-authorizations/RESULT-RANK-LIVE-R2-20260904T2347-SOL-Q5N8K3.json
          git diff --cached --quiet && exit 0
          git commit -m 'diag: capture Result rank seam'
          git push
