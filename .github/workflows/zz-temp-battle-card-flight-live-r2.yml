name: TEMP Battle card flight live R2

on:
  push:
    branches:
      - sol/battle-card-flight-live-r2-20260910

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-card-flight-live-r2-20260910
          fetch-depth: 0
      - name: Apply bounded SlidePad adapter patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          source = runtime_path.read_text()

          import_anchor = "} from './battle-playable-hand-row-roulette-runtime.mjs';\n"
          effect_import = "import {\n  captureBattleCardReleaseFlightEffect,\n  playBattleCardReleaseFlightEffect,\n} from './battle-card-release-flight-runtime-effect.mjs';\n"
          assert source.count(import_anchor) == 1
          assert 'battle-card-release-flight-runtime-effect.mjs' not in source
          source = source.replace(import_anchor, import_anchor + effect_import, 1)

          assert source.count('const RELEASE_FLIGHT_DURATION_MS = 560;\n') == 1
          source = source.replace('const RELEASE_FLIGHT_DURATION_MS = 560;\n', '', 1)

          start = source.index('function captureReleasedJankenCardFlight(')
          end = source.index('\nfunction animateHandAuraLaunch', start)
          old_block = source[start:end]
          assert 'sampleOffsets = [0, 0.12, 0.28, 0.46, 0.64, 0.82, 1]' in old_block
          replacement = """function captureReleasedJankenCardFlight(globalRef, battleRoot, slotNodes, selectedHand) {
            const sourceNode = slotNodes.get(selectedHand);
            const start = elementCenter(sourceNode);
            const target = launchTargetCenter(battleRoot);
            if (!sourceNode || !start || !target) return null;
            return captureBattleCardReleaseFlightEffect({
              sourceNode,
              start,
              target,
              role: spatialSlotRole(slotNodes, selectedHand),
              reducedMotion: globalRef?.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true,
              lowPerf: battleRoot?.dataset?.lowPerf === 'true',
            });
          }

          function playReleasedJankenCardFlight(host, flight) {
            return playBattleCardReleaseFlightEffect({ host, flight });
          }
          """
          source = source[:start] + replacement + source[end:]

          assert source.count('animateReleasedJankenCard(host, flight)') == 2
          source = source.replace('animateReleasedJankenCard(host, flight)', 'playReleasedJankenCardFlight(host, flight)')
          assert 'RELEASE_FLIGHT_DURATION_MS' not in source
          assert 'sampleOffsets = [0, 0.12, 0.28' not in source
          runtime_path.write_text(source)

          test_path = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          tests = test_path.read_text()
          old_focus_expect = 'assert.match(accepted, /animateReleasedJankenCard\\(host, flight\\)/);'
          new_focus_expect = 'assert.match(accepted, /playReleasedJankenCardFlight\\(host, flight\\)/);'
          assert tests.count(old_focus_expect) == 1
          tests = tests.replace(old_focus_expect, new_focus_expect, 1)

          fs_import = "import { readFileSync } from 'node:fs';\n"
          if fs_import not in tests:
            assert "import assert from 'node:assert/strict';\n" in tests
            tests = tests.replace("import assert from 'node:assert/strict';\n", "import assert from 'node:assert/strict';\n" + fs_import, 1)

          marker = "test('release-flight live adapter delegates to the canonical effect and keeps success-only triggers', () => {"
          assert marker not in tests
          tests += """

          test('release-flight live adapter delegates to the canonical effect and keeps success-only triggers', () => {
            const source = readFileSync(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
            assert.equal(source.includes("from './battle-card-release-flight-runtime-effect.mjs';"), true);
            assert.equal(source.includes('captureBattleCardReleaseFlightEffect({'), true);
            assert.equal(source.includes('return playBattleCardReleaseFlightEffect({ host, flight });'), true);
            assert.equal(source.includes('RELEASE_FLIGHT_DURATION_MS'), false);
            assert.equal(source.includes('sampleOffsets = [0, 0.12, 0.28'), false);
            assert.equal(source.includes("reducedMotion: globalRef?.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true"), true);
            assert.equal(source.includes("lowPerf: battleRoot?.dataset?.lowPerf === 'true'"), true);
            assert.equal(source.includes('if (cardId && clickExistingHandCard(root, cardId)) playReleasedJankenCardFlight(host, flight);'), true);
            assert.equal(source.includes('onAccepted: (result, readyPackage) => {'), true);
            assert.equal(source.includes('const hand = readyPackage?.jankenHand;'), true);
            assert.equal(source.includes('if (flight) playReleasedJankenCardFlight(host, flight);'), true);
          });
          """
          test_path.write_text(tests)
          PY
      - name: Run focused release-flight tests
        run: node --test tests/battle-janken-slidepad-runtime-mount.test.mjs tests/battle-card-release-flight-runtime-effect.test.mjs
      - name: Verify bounded diff and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'browser/battle-janken-slidepad-runtime-mount.mjs\ntests/battle-janken-slidepad-runtime-mount.test.mjs'
          git diff --check
          git config user.name 'gameroad-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git commit -m 'Battle: カード飛翔を既存effectへlive接続'
          git push origin HEAD:sol/battle-card-flight-live-r2-20260910
