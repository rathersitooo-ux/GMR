name: TEMP Persist selected GAMEROAD SFX

on:
  push:
    branches:
      - work/audio-selected3-persistence-20260823

permissions:
  contents: write

jobs:
  persist-selected3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/audio-selected3-persistence-20260823
          fetch-depth: 0

      - name: Fetch exact accepted SFX and verify git blob identity
        shell: bash
        run: |
          set -euo pipefail
          dest='browser/assets/audio/sfx'
          mkdir -p "$dest"

          curl -fL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/mlm-games/free-the-bugs/abcc40abf9ddbc4f499a611dc5df266382ef295e/assets/sounds/kenney_interface-sounds/Audio/click_002.ogg' \
            -o "$dest/click_002.ogg"
          curl -fL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/lohchness/gmc-game-jam-sem1-2024/main/assets/kenney_casino-audio/Audio/cardSlide6.ogg' \
            -o "$dest/cardSlide6.ogg"
          curl -fL --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/lohchness/gmc-game-jam-sem1-2024/main/assets/kenney_casino-audio/Audio/cardPlace1.ogg' \
            -o "$dest/cardPlace1.ogg"

          test "$(git hash-object "$dest/click_002.ogg")" = '4564b888c25143eaed79c384a5ce02054813a41c'
          test "$(git hash-object "$dest/cardSlide6.ogg")" = 'b0090036bd9c0d48c3f6d79fd77eaf30901b6a05'
          test "$(git hash-object "$dest/cardPlace1.ogg")" = '42bbfa8ea2daaadd237c48287388c7c931cc817e'

      - name: Commit exact binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/assets/audio/sfx/click_002.ogg \
                  browser/assets/audio/sfx/cardSlide6.ogg \
                  browser/assets/audio/sfx/cardPlace1.ogg
          if git diff --cached --quiet; then
            echo 'Selected SFX already persisted with exact bytes.'
            exit 0
          fi
          git commit -m 'Persist Human-approved GAMEROAD SFX exact blobs'
          git push origin HEAD:work/audio-selected3-persistence-20260823
