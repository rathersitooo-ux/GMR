name: temp battle four public cards r1

on:
  push:
    branches:
      - sol/battle-four-public-cards-r1-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'battle four public cards R1 product delta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-four-public-cards-r1-20260910
          fetch-depth: 0

      - name: Recover and apply bounded writer
        shell: bash
        run: |
          set -euo pipefail
          git show 1481f07c0d25599f58027ec8c4140dbe974928a9:.github/workflows/zz-temp-battle-four-public-cards-r1.yml > /tmp/source-writer.yml
          python - <<'PY'
          from pathlib import Path

          src = Path('/tmp/source-writer.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = []
          for line in src[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          text = '\n'.join(body) + '\n'
          compile(text, '/tmp/apply.py', 'exec')
          Path('/tmp/apply.py').write_text(text, encoding='utf-8')
          PY
          python /tmp/apply.py

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = 'browser/battle-screen-presentation-core.mjs'
          test "${changed[1]}" = 'browser/battle-screen-runtime-mount.mjs'
          test "${changed[2]}" = 'tests/battle-screen-presentation-core.test.mjs'
          test "${changed[3]}" = 'tests/battle-screen-runtime-mount.test.mjs'

      - name: Classified Battle screen tests
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/battle-screen-presentation-core.mjs
          node --check browser/battle-screen-runtime-mount.mjs
          node --test tests/battle-screen-presentation-core.test.mjs tests/battle-screen-runtime-mount.test.mjs
          git diff --check

      - name: Commit product delta only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-screen-presentation-core.mjs browser/battle-screen-runtime-mount.mjs tests/battle-screen-presentation-core.test.mjs tests/battle-screen-runtime-mount.test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m 'battle four public cards R1 product delta'
          git push origin HEAD:sol/battle-four-public-cards-r1-20260910
