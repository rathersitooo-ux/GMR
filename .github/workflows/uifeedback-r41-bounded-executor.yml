name: UIFeedback R42 repair executor

# R44 one-shot recovery trigger; delete this workflow before merge.
on:
  push:
    branches:
      - work/uifeedback-r42-consumer-recovery

permissions:
  contents: write

jobs:
  repair-current-reds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/uifeedback-r42-consumer-recovery
      - name: Repair temporal test contract and static checker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('tests/browser-runtime-smoke.spec.mjs')
          runtime = runtime_path.read_text(encoding='utf-8')

          old_return = '''  await page.evaluate(() => {
            window.GAMEROAD_NAV_QA.root('home');
            window.GAMEROAD_HOME_MOTION_QA.expand();
            document.querySelector('.homePadChoice[data-home-target="setup"]')?.focus();
          });
          await page.waitForTimeout(620);'''
          new_return = '''  await page.evaluate(() => {
            window.GAMEROAD_NAV_QA.root('home');
          });
          await page.waitForFunction(() => (
            window.GAMEROAD_NAV_QA.snapshot().screen === 'home'
            && window.GAMEROAD_SCREEN_TRANSITION?.getState?.().phase === 'IDLE'
          ));
          await page.evaluate(() => {
            window.GAMEROAD_HOME_MOTION_QA.expand();
            document.querySelector('.homePadChoice[data-home-target="setup"]')?.focus();
          });
          await page.waitForTimeout(80);'''
          if old_return in runtime:
              runtime = runtime.replace(old_return, new_return, 1)
          elif new_return not in runtime:
              raise SystemExit('HOME_GAMEPAD_ASYNC_RETURN_ANCHOR_FAIL')

          old_cards = '''const cards = page.locator('[data-go="cards"]:visible').first();'''
          new_cards = '''const cards = page.locator('.homePadChoice[data-home-target="cards"]:visible').first();'''
          if old_cards in runtime:
              if runtime.count(old_cards) != 1:
                  raise SystemExit(f'R42_CARDS_SELECTOR_COUNT_FAIL count={runtime.count(old_cards)}')
              runtime = runtime.replace(old_cards, new_cards, 1)
          elif new_cards not in runtime:
              raise SystemExit('R42_CARDS_SELECTOR_ANCHOR_FAIL')
          runtime_path.write_text(runtime, encoding='utf-8')

          checker_path = Path('tests/browser-static-check.mjs')
          checker = checker_path.read_text(encoding='utf-8')
          old_import = r'''/import\s*\{\s*resolveScreenNavigation\s*\}\s*from\s*["']\.\/screen-navigation-core\.mjs["']\s*;/'''
          new_import = r'''/import\s*\{[^}]*\bresolveScreenNavigation\b[^}]*\bcreateScreenTransitionRuntimeAdapter\b[^}]*\}\s*from\s*["']\.\/screen-navigation-core\.mjs["']\s*;/'''
          if old_import in checker:
              checker = checker.replace(old_import, new_import, 1)
          elif new_import not in checker:
              raise SystemExit('STATIC_IMPORT_CONTRACT_ANCHOR_FAIL')

          old_delegate = r'''/bridge\.resolve\(state\.screen\s*,\s*target\)/'''
          new_delegate = r'''/currentScreenTransitionRuntime\(\)\.navigate\(target\s*,\s*\{\s*reason\s*:\s*["']detail["']\s*\}\s*\)/'''
          if old_delegate in checker:
              checker = checker.replace(old_delegate, new_delegate, 1)
              checker = checker.replace(
                  "'navigateDetail does not delegate navigation decision to the screen navigation core'",
                  "'navigateDetail does not delegate navigation through the transition runtime'",
                  1,
              )
          elif new_delegate not in checker:
              raise SystemExit('STATIC_DELEGATION_CONTRACT_ANCHOR_FAIL')
          checker_path.write_text(checker, encoding='utf-8')
          PY

          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

          if git diff --quiet -- tests/browser-runtime-smoke.spec.mjs tests/browser-static-check.mjs; then
            echo 'NO_R42_REPAIR_DIFF'
            exit 0
          fi
          git config user.name 'gameroad-r42-repair-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/browser-runtime-smoke.spec.mjs tests/browser-static-check.mjs
          git commit -m 'UI R42: repair async QA regression and transition static contract'
          git push origin HEAD:work/uifeedback-r42-consumer-recovery
