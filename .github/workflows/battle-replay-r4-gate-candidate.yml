name: Battle Replay R4 gate candidate

on:
  push:
    branches:
      - work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact gate
        run: test "$(git hash-object .github/workflows/gameroad-required-gate.yml)" = "6e803f3ed05b857eb61607e8d0ec2589cb4af0ca"
      - name: Build candidate and test replay scope
        run: |
          mkdir -p evidence
          node tools/battle-replay-r4-gate-candidate.mjs
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs
          test -s evidence/gameroad-required-gate-r4-candidate.yml
      - name: Commit candidate and self-remove transport
        run: |
          rm .github/workflows/battle-replay-r4-gate-candidate.yml
          rm tools/battle-replay-r4-gate-candidate.mjs
          git config user.name gameroad-r4-bot
          git config user.email gameroad-r4-bot@users.noreply.github.com
          git add evidence/gameroad-required-gate-r4-candidate.yml .github/workflows/battle-replay-r4-gate-candidate.yml tools/battle-replay-r4-gate-candidate.mjs
          git commit -m "[BATTLE-REPLAY R4] materialize Required Gate candidate blob"
          git push origin HEAD:work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT
