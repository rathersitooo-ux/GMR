name: Battle Mana Rank Recovery Surgical Patch

on:
  push:
    branches:
      - fix/battle-mana-rank-recovery-r1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-mana-rank-recovery-r1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded resource repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          test_path = Path('tests/browser-static-check.mjs')
          html = html_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          runtime_pairs = [
              ('round-start function', 'function awardRoundStartHoney(m){for(const row of currentPlacementRanks(m)){const gain=Math.max(1,Number(row.rank)||1);row.player.honey=Math.max(0,Number(row.player.honey)||0)+gain;log(`${row.player.name}：${gain}位のためハニー+${gain}。`)}}', 'function recoverRoundStartManaByPlacement(m){for(const row of currentPlacementRanks(m)){const gain=Math.max(1,Number(row.rank)||1),p=row.player,max=Math.max(0,Number(p.manaMax)||10);const before=Math.max(0,Math.min(max,Number(p.manaCurrent)||0)),after=Math.min(max,before+gain);p.manaCurrent=after;log(`${p.name}：${gain}位のためマナ回復+${after-before}（${after}/${max}）。`)}}'),
              ('round-one call', 'grBattleReplayBegin(state.match);awardRoundStartHoney(state.match);initRoundRuntime(state.match)', 'grBattleReplayBegin(state.match);recoverRoundStartManaByPlacement(state.match);initRoundRuntime(state.match)'),
              ('later-round call', 'm.players.forEach(p=>p.plan=null);awardRoundStartHoney(m);initRoundRuntime(m)', 'm.players.forEach(p=>p.plan=null);recoverRoundStartManaByPlacement(m);initRoundRuntime(m)'),
          ]
          for label, old, new in runtime_pairs:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              html = html.replace(old, new, 1)

          test_pairs = [
              ("    [/function awardRoundStartHoney\\(m\\)/, 'round-start Honey income is not mounted'],", "    [/function recoverRoundStartManaByPlacement\\(m\\)/, 'round-start placement Mana recovery is not mounted'],"),
              ("    [/grBattleReplayBegin\\(state\\.match\\);awardRoundStartHoney\\(state\\.match\\);initRoundRuntime\\(state\\.match\\)/, 'round one does not award current-rank Honey before play'],", "    [/function recoverRoundStartManaByPlacement\\(m\\)\\{[\\s\\S]{0,700}p\\.manaCurrent=after;/, 'round-start placement Mana recovery does not clamp and write numeric Mana'],\n    [/grBattleReplayBegin\\(state\\.match\\);recoverRoundStartManaByPlacement\\(state\\.match\\);initRoundRuntime\\(state\\.match\\)/, 'round one does not recover current-rank Mana before play'],"),
              ("    [/m\\.players\\.forEach\\(p=>p\\.plan=null\\);awardRoundStartHoney\\(m\\);initRoundRuntime\\(m\\)/, 'later rounds do not award current-rank Honey'],", "    [/m\\.players\\.forEach\\(p=>p\\.plan=null\\);recoverRoundStartManaByPlacement\\(m\\);initRoundRuntime\\(m\\)/, 'later rounds do not recover current-rank Mana'],"),
          ]
          for old, new in test_pairs:
              count = test.count(old)
              if count != 1:
                  raise SystemExit(f'static resource contract: expected exactly 1 match, found {count}: {old[:80]}')
              test = test.replace(old, new, 1)

          anchor = "  if (/function takeManaByPower\\(/.test(html) || /\\.mana\\?*\\.length/.test(html) || /Array\\.isArray\\(me\\?*\\.mana\\)/.test(html)) {"
          guard = "  if (/function awardRoundStartHoney\\(/.test(html)) errors.push('legacy round-start Honey income remains');\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'legacy Honey guard anchor: expected exactly 1 match, found {test.count(anchor)}')
          test = test.replace(anchor, guard + anchor, 1)

          if 'awardRoundStartHoney(' in html:
              raise SystemExit('legacy round-start Honey runtime symbol remains after patch')
          if html.count('recoverRoundStartManaByPlacement(') != 3:
              raise SystemExit('rank Mana recovery runtime symbol count is not exactly three')

          html_path.write_text(html, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify static Browser contracts
        run: node tests/browser-static-check.mjs

      - name: Verify bounded diff and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'browser/GAMEROAD.html\ntests/browser-static-check.mjs'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files before transient cleanup:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git rm .github/workflows/battle-mana-rank-recovery-surgical.yml
          git diff --check

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(browser): recover mana by placement at round start'
          git push origin HEAD:fix/battle-mana-rank-recovery-r1
