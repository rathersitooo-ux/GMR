name: HATE Timer R3 Network Evidence

on:
  push:
    branches:
      - 'work/HATE_TIMER-01-R3-NETWORK-EVIDENCE'
    paths:
      - '.github/workflows/hate-timer-r3-network-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Exact production identity and transport source context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          print('COMMIT_SOURCE_BYTES',len(s.encode()))
          for marker in ['ws://127.0.0.1:8765/ws','new WebSocket','new BroadcastChannel','GAMEROAD_FRIEND_ROOM_R2','friendCreate2','friendJoinBtn']:
              print('\n===== MARKER',marker,'COUNT',s.count(marker),'=====')
              start=0
              for n in range(min(4,s.count(marker))):
                  i=s.find(marker,start)
                  if i<0: break
                  lo=max(0,i-3500); hi=min(len(s),i+5500)
                  print('INDEX',i)
                  print(s[lo:hi].replace('\r',''))
                  start=i+len(marker)
          PY
          echo "HEAD=$(git rev-parse HEAD)"
          echo "HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          echo "HTML_BYTES=$(wc -c < browser/GAMEROAD.html)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Activate friend room and inventory actual transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hate-r3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          cat >.hate-r3-probe.mjs <<'JS'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          const ws=[];
          page.on('websocket',s=>{ws.push({url:s.url(),closed:false}); console.log('WS_OPEN',s.url()); s.on('close',()=>console.log('WS_CLOSE',s.url()));});
          page.on('console',m=>{ if(/friend|room|relay|socket|network|接続|部屋/i.test(m.text())) console.log('PAGE_CONSOLE',m.type(),m.text()); });
          await page.goto('http://127.0.0.1:4173/browser/GAMEROAD.html',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(500);
          const snap=async(label)=>{
            const v=await page.evaluate(()=>{
              const o=window.GAMEROAD_FRIEND_ROOM_R2;
              const obj={};
              if(o&&typeof o==='object') for(const k of Object.keys(o)){
                let x; try{x=o[k]}catch{continue}
                if(typeof x==='function') obj[k]=Function.prototype.toString.call(x).slice(0,5000);
                else if(x&&typeof x==='object'){
                  const inner={}; for(const ik of Object.keys(x).slice(0,80)){
                    let y; try{y=x[ik]}catch{continue}
                    inner[ik]=typeof y==='function'?Function.prototype.toString.call(y).slice(0,1800):String(y).slice(0,800);
                  }
                  obj[k]=inner;
                } else obj[k]=String(x).slice(0,800);
              }
              const ids=[...document.querySelectorAll('[id]')].filter(el=>/friend|room|relay|status|code/i.test(el.id)).map(el=>({id:el.id,tag:el.tagName,visible:!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length),text:(el.textContent||'').trim().slice(0,500),value:'value'in el?String(el.value).slice(0,200):''}));
              return {object:obj,ids,href:location.href};
            });
            console.log('SNAPSHOT_'+label,JSON.stringify(v,null,2)); return v;
          };
          await snap('BOOT');
          const setup=page.locator('[data-go="setup"]:visible').first();
          if(await setup.count()){await setup.click(); await page.waitForTimeout(250);}
          const entry=page.locator('#friendRoomEntry:visible');
          console.log('FRIEND_ENTRY_VISIBLE',await entry.count());
          if(await entry.count()){await entry.click(); await page.waitForTimeout(300);}
          await snap('ROOM_UI');
          const create=page.locator('#friendCreate2:visible');
          console.log('CREATE2_VISIBLE',await create.count());
          if(await create.count()){await create.click(); await page.waitForTimeout(1200);}
          const after=await snap('AFTER_CREATE2');
          console.log('WEBSOCKETS_AFTER_CREATE',JSON.stringify(ws));
          await browser.close();
          JS
          node .hate-r3-probe.mjs
          rm -f .hate-r3-probe.mjs

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          echo "FINAL_HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          echo 'FINAL_STATUS_START'
          git status --porcelain --untracked-files=all
          echo 'FINAL_STATUS_END'
          test -z "$(git status --porcelain --untracked-files=all)"
