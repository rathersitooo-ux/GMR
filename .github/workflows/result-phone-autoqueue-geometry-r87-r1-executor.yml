name: Result Phone Autoqueue Geometry R87 Executor

on:
  push:
    branches:
      - sol/result-phone-autoqueue-geometry-r87-r1-20260905

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded portrait Result geometry repair
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          MARKER='/* RESULT_PHONE_AUTOQUEUE_GEOMETRY_R87_R1 */'
          if grep -Fq "$MARKER" browser/GAMEROAD.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Bounded Result repair is already present; no second mutation.'
            exit 0
          fi
          test "$(git rev-parse HEAD~2)" = "093220a142bea6cfb60b453b16bbfb279ccfa1db"
          test -f data/preaction-authorizations/RESULT-PHONE-AUTOQUEUE-R87-R1-20260905T2103-SOL-N6K4P2.json
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          text = p.read_text(encoding='utf-8')
          needle = '#postMatchAutoQueueStatus{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:1.3}'
          replacement = needle + '\n/* RESULT_PHONE_AUTOQUEUE_GEOMETRY_R87_R1 */\n.screen.result .resultBody{bottom:120px!important}'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one current phone autoqueue status rule, found {count}')
          if '/* RESULT_PHONE_AUTOQUEUE_GEOMETRY_R87_R1 */' in text:
              raise SystemExit('marker unexpectedly present before bounded patch')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'browser/GAMEROAD.html'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        if: steps.patch.outputs.changed == 'true'
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium and OS dependencies
        if: steps.patch.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run bounded visible four-player Result acceptance
        if: steps.patch.outputs.changed == 'true'
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1 --grep 'R19 reaches Result from visible four-player Honey Hunt and returns Home'
      - name: Commit exact bounded product patch
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-scoped-patch'
          git config user.email 'gameroad-scoped-patch@users.noreply.github.com'
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | tr -d '\r')" = 'browser/GAMEROAD.html'
          git commit -m 'Result: clear phone autoqueue action overlap'
          git push origin HEAD:sol/result-phone-autoqueue-geometry-r87-r1-20260905
