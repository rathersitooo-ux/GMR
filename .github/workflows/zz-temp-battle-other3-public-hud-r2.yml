name: temp-battle-other3-public-hud-r2

on:
  push:
    branches:
      - sol/battle-other3-public-hud-r2-20260914

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[other3-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-other3-public-hud-r2-20260914
          fetch-depth: 0
      - name: Apply exact bounded patch
        run: python3 tools/temp-battle-other3-public-hud-r2.py
      - name: Static browser contract
        run: node tests/browser-static-check.mjs
      - name: Diff guard
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "browser/GAMEROAD.html tests/browser-static-check.mjs "
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git commit -m "fix: show other players in right-top public HUD [other3-patched]"
          git push origin HEAD:sol/battle-other3-public-hud-r2-20260914
