name: TEMP NormalMatch R8 Result Geometry

on:
  push:
    branches:
      - work/normalmatch-r6-currentbase-recovery
    paths:
      - '.github/workflows/zz-temp-normalmatch-r8-result-geometry.yml'

permissions:
  contents: read

jobs:
  verify-result-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recovered product head
        uses: actions/checkout@v4
        with:
          ref: 8f8fcbe1e7c347e795647b6468c45eab8ec083f5
          fetch-depth: 0

      - name: Verify target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8f8fcbe1e7c347e795647b6468c45eab8ec083f5"
          test "$(git hash-object browser/GAMEROAD.html)" = "83ba1a68574249f66459dd785a73db29e1373a4f"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install chromium

      - name: Create exact four-player Result geometry probe
        shell: bash
        run: |
          cat > tests/zz-temp-normalmatch-r8-result-geometry.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('R8 four-player Result keeps rank4 clear of actions at 390x844', async ({ page }, testInfo) => {
            test.setTimeout(150_000);
            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'domcontentloaded' });
            expect(response, 'main HTML response').not.toBeNull();
            expect(response.ok(), `main HTML status ${response.status()}`).toBeTruthy();
            await page.waitForTimeout(600);

            const driven = await page.evaluate(async () => {
              const t = window.__GAMEROAD_TEST__;
              const cardData = window.__CARD_DATA__;
              if (!t || !Array.isArray(cardData)) throw new Error('current GAMEROAD runtime test hooks are unavailable');
              const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
              const standard = cardData
                .filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)))
                .map((card) => card.id);
              const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
              const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
              const main = [...nonRoyal.slice(0, 37), ...royalIds];
              const setValidation = t.deckSetDraft(main, []);
              const draftValidation = t.deckValidate(t.state.deckDraft, { forBattle: true });
              const committed = draftValidation.ok ? t.deckCommit() : false;
              if (!committed) return { reached: false, reason: 'LEGAL_DECK_COMMIT_FAILED', mainCount: main.length, setValidation, draftValidation };
              t.battlePresentationFast(true);
              const match = t.start('4p', 'road_shield');
              window.__V105_ABILITY_TEST__?.setAutoChoices?.(true);
              const reached = await t.autoToResult(60);
              return { reached, screen: t.state.screen, matchId: match?.id ?? null, rounds: match?.round ?? null, mainCount: main.length };
            });

            expect(driven.reached, JSON.stringify(driven)).toBeTruthy();
            expect(driven.screen).toBe('result');
            expect(driven.mainCount).toBe(40);

            const result = page.locator('section[data-screen="result"]');
            await expect(result).toBeVisible();
            const rows = result.locator('#resultRanking .rankLine');
            await expect(rows, 'four-player Result exposes four ranking rows').toHaveCount(4);
            const actions = result.locator('.resultBtns');
            const autoqueue = result.locator('#postMatchAutoQueue');
            const rematch = result.locator('#rematch');
            const home = result.locator('[data-root-go="home"]');
            await expect(actions).toBeVisible();
            await expect(autoqueue).toBeVisible();
            await expect(rematch).toBeVisible();
            await expect(rematch).toBeEnabled();
            await expect(home).toBeVisible();
            await expect(home).toBeEnabled();

            const rankingBox = await result.locator('#resultRanking').boundingBox();
            const rank4Box = await rows.nth(3).boundingBox();
            const buttonsBox = await actions.boundingBox();
            expect(rankingBox, 'ranking bounding box').not.toBeNull();
            expect(rank4Box, 'rank4 bounding box').not.toBeNull();
            expect(buttonsBox, 'Result actions bounding box').not.toBeNull();
            const rank4Bottom = rank4Box.y + rank4Box.height;
            const rankingBottom = rankingBox.y + rankingBox.height;
            const overlap = Math.max(0, rank4Bottom - buttonsBox.y);
            const evidence = {
              viewport: page.viewportSize(),
              rankingBox,
              rank4Box,
              buttonsBox,
              rankingBottom,
              rank4Bottom,
              overlap,
              matchId: driven.matchId,
              rounds: driven.rounds,
            };
            console.log(`NORMALMATCH_R8_RESULT_GEOMETRY ${JSON.stringify(evidence)}`);
            testInfo.annotations.push({ type: 'normalmatch-r8-result-geometry', description: JSON.stringify(evidence) });
            expect(overlap, `rank4/actions overlap: ${JSON.stringify(evidence)}`).toBeLessThanOrEqual(0.5);

            await testInfo.attach('normalmatch-r8-result-390x844.png', {
              body: await page.screenshot({ fullPage: true, animations: 'disabled' }),
              contentType: 'image/png',
            });
          });
          EOF

          cat > playwright.normalmatch-r8-temp.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: 'zz-temp-normalmatch-r8-result-geometry.spec.mjs',
            timeout: 150_000,
            expect: { timeout: 7_000 },
            workers: 1,
            retries: 0,
            reporter: [
              ['line'],
              ['html', { outputFolder: 'playwright-report-normalmatch-r8', open: 'never' }],
              ['json', { outputFile: 'test-results/normalmatch-r8/result-geometry.json' }],
            ],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              browserName: 'chromium',
              headless: true,
              viewport: { width: 390, height: 844 },
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
            webServer: {
              command: 'python3 -m http.server 4173 --bind 127.0.0.1',
              url: 'http://127.0.0.1:4173/browser/GAMEROAD.html',
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF

      - name: Run exact 390x844 four-player Result geometry probe
        run: npx playwright test --config=playwright.normalmatch-r8-temp.config.mjs

      - name: Upload exact geometry evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: normalmatch-r8-result-geometry-${{ github.run_id }}
          path: |
            playwright-report-normalmatch-r8/
            test-results/normalmatch-r8/
          if-no-files-found: error
          retention-days: 14
