name: TEMP Newbase Consumer R74 Authority Map

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authority-map:
    if: github.head_ref == 'work/newbase-production-consumer-r74-20260902'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Map decisive current production seams
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          def clean(s): return s.replace('\r',' ').replace('\n',' ')
          def decls(name):
              pats=[rf'\b(?:async\s+)?function\s+{re.escape(name)}\s*\(',rf'\b(?:const|let|var)\s+{re.escape(name)}\s*=']
              out=[]
              for pat in pats: out += [m.start() for m in re.finditer(pat,text)]
              return sorted(set(out))
          def refs(name): return [m.start() for m in re.finditer(rf'\b{re.escape(name)}\b', text)]
          def contexts(name,before=900,after=5000,maxrefs=4):
              ds=decls(name); ps=[('DECL',p) for p in ds[:2]]
              ps += [('REF',p) for p in refs(name)[:maxrefs] if p not in ds]
              out=[]; seen=set()
              for kind,p in ps:
                  if p in seen: continue
                  seen.add(p)
                  out.append({'kind':kind,'offset':p,'text':clean(text[max(0,p-before):min(len(text),p+after)])})
              return {'decl_offsets':ds,'ref_count':len(refs(name)),'contexts':out}

          names=[
            'createThinPhaseRunner','PHASE_GRAPH','phaseRunner','confirmTarget',
            'resolveBattle','renderBattle','legalLaneCards','removeHand','replacementBattleCard',
            'preferredRoadCandidates','normalMoveLimitForPlayer','parseRoad','currentPublicRoad',
            'publicMatchHasWinner','renderResult','onResultCurrent','safeResult','controller'
          ]
          report={'html_bytes':len(text.encode()),'targets':{n:contexts(n) for n in names}}

          # Exact member use of the centralized phase runner.
          members=[]
          for m in re.finditer(r'\bphaseRunner\s*(?:\.\s*([A-Za-z_$][\w$]*)|\[\s*["\']([^"\']+)["\']\s*\])',text):
              member=m.group(1) or m.group(2)
              members.append({'member':member,'offset':m.start(),'text':clean(text[max(0,m.start()-800):min(len(text),m.start()+2200)])})
          report['phase_runner_members']=members

          # Candidate production runtime declarations in the main late-game region.
          region_lo,region_hi=9_750_000,10_750_000
          declaration=re.compile(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(|\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=')
          semantic=('move','step','advance','walk','position','road','land','goal','result','battle','turn','dice','roll','hand','card','target','phase')
          cands=[]; seen=set()
          for m in declaration.finditer(text,region_lo,region_hi):
              n=m.group(1) or m.group(2); low=n.lower()
              if n in seen or not any(k in low for k in semantic): continue
              seen.add(n); cands.append({'name':n,'offset':m.start()})
          report['semantic_declarations']=cands[:250]

          # Only entropy sites whose bounded context itself mentions dice/roll/sugoroku movement.
          entropy=[]
          for m in re.finditer(r'Math\.random\s*\(',text):
              p=m.start()
              if not (region_lo <= p <= region_hi): continue
              s=text[max(0,p-1800):min(len(text),p+2200)]
              if re.search(r'dice|roll|サイコロ|moveLimit|movement|roadSelected',s,re.I):
                  entropy.append({'offset':p,'text':clean(s)})
          report['candidate_entropy_sites']=entropy

          # Exact transition/result invocation signatures around known phase graph block.
          for literal in ['PLAN','MOVE','TARGET','BATTLE','EVENT','RESULT','transitionConfirm','resultFn','onResult']:
              ps=[m.start() for m in re.finditer(re.escape(literal),text[10_500_000:10_620_000],re.I)]
              report.setdefault('late_runtime_literals',{})[literal]=[10_500_000+p for p in ps[:20]]

          out=Path('/tmp/newbase-r74-decisive-map.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('R74_DECISIVE_MAP_BEGIN')
          print(out.read_text(encoding='utf-8'))
          print('R74_DECISIVE_MAP_END')
          PY
