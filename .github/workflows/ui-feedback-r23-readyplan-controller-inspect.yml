name: UI Feedback R23 ReadyPlan Controller Inspect

on:
  push:
    branches:
      - work/ui-feedback-r23-readyplan-controller-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact current-base and product-byte guard
        shell: bash
        run: |
          set -euo pipefail
          expected_base='4c30486c3a39433da2b2c31a0d549cb1bda3b888'
          expected_html_blob='12839c58646f849f0ad4470695c391bfb07b1174'
          git merge-base --is-ancestor "$expected_base" HEAD
          actual_html_blob="$(git hash-object browser/GAMEROAD.html)"
          diff_names="$(git diff --name-only "$expected_base"...HEAD)"
          printf 'R23_HEAD=%s\nR23_BASE=%s\nR23_HTML_BLOB=%s\nR23_DIFF=%s\n' "$(git rev-parse HEAD)" "$expected_base" "$actual_html_blob" "$diff_names"
          test "$actual_html_blob" = "$expected_html_blob"
          test "$diff_names" = '.github/workflows/ui-feedback-r23-readyplan-controller-inspect.yml'
      - name: Bounded controller and ReadyPlan source evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          patterns = [
              'navigator.getGamepads',
              'getGamepads',
              'gamepad',
              'Gamepad',
              'buttons[0]',
              'readyPlan',
              ".click()",
              '.pressed',
          ]
          print(f'R23_SOURCE_BYTES={len(text.encode("utf-8"))}')
          for pattern in patterns:
              print(f'=== PATTERN {pattern!r} ===')
              start = 0
              found = 0
              while found < 12:
                  idx = text.find(pattern, start)
                  if idx < 0:
                      break
                  found += 1
                  left = max(0, idx - 900)
                  right = min(len(text), idx + len(pattern) + 1200)
                  snippet = text[left:right]
                  print(f'--- occurrence={found} char_index={idx} ---')
                  print(snippet)
                  start = idx + max(1, len(pattern))
              print(f'COUNT_SHOWN={found}')
