name: TEMP Battle Janken SlidePad Replay R1B
on:
  push:
    branches:
      - work/battle-janken-slidepad-live-r1b-20260902
    paths:
      - .github/workflows/zz-temp-battle-janken-slidepad-replay-r1b.yml
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/battle-janken-slidepad-live-r1b-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay exact six-file product diff and validate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/battle-janken-slidepad-live-r1-20260902
          git diff e949864e5b569fa699ff95684dd6204379e57002..c7061f9f1a4a185ddbaef97ffa9b24f5fc44b6c6 -- \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            browser/battle-replay-live-adapter.mjs \
            tests/battle-janken-slidepad-runtime-mount.test.mjs \
            tests/browser-full-interaction.spec.mjs \
            deploy/cloudflare/scripts/build.mjs \
            deploy/cloudflare/tests/build.test.mjs | git apply

          python <<'PY'
          from pathlib import Path
          p = Path('tests/browser-full-interaction.spec.mjs')
          text = p.read_text()
          needle = "  expect(jankenSnapshot?.ordinaryHandCardIds?.length).toBeGreaterThan(0);\n"
          addition = needle + "  expect(jankenSnapshot?.assignment?.selectedJankenCardIds?.length).toBeGreaterThan(0);\n"
          if 'selectedJankenCardIds?.length).toBeGreaterThan(0)' not in text:
              if needle not in text:
                  raise SystemExit('janken BFI assertion marker missing')
              text = text.replace(needle, addition, 1)
          p.write_text(text)
          PY

          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs tests/new-base-round-start-janken-slot-assignment-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

          rm -f data/preaction-authorizations/BATTLE-JANKEN-SLIDEPAD-LIVE-R1-20260902T2251-SOL-K7M4Q2.json
          rm -f .github/workflows/zz-temp-battle-janken-slidepad-replay-r1b.yml
          git config user.name gameroad-exact-patch-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'fix(battle): connect janken SlidePad to live hand'
          git push origin HEAD:work/battle-janken-slidepad-live-r1b-20260902
