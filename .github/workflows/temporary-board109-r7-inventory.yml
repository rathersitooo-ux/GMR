name: TEMP BOARD109 R7 safe scope diagnostic v7

on:
  push:
    branches:
      - work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 14
      - name: Verify exact product and add lazy runner-only bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "BOARD109_R7_SAFE_SCOPE_DIAG_V7"
          test "$(git rev-parse HEAD^)" = "ede74e2911cfdd0e90a60be9e260146356b8685f"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "0535bf3a37f9afdab3b0cddbc23e7aa610fcbc15"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('browser/GAMEROAD.html');raw=p.read_bytes()
          assert len(raw)==11816410
          assert hashlib.sha256(raw).hexdigest()=='cbdc9c679282466a430ad81e7ce391cf4d0f159b971c9946ba910eb322a1d36a'
          bom=raw.startswith(b'\xef\xbb\xbf');text=raw.decode('utf-8-sig')
          anchor='window.__V105_ABILITY_TEST__={'
          assert text.count(anchor)==1
          names=['cornerRoadIds','neighbors','reachable','shortest','renderBoard','selectEndpoint','animateResolvedPath','renderField3D','nodeWorld','nodeTopSurface','nearestProjectedNode','projectionFor','roadSelectable','normalMoveLimitForRoad','legalPlan','fieldProjection']
          pairs=[]
          for n in names:
              if n=='fieldProjection': pairs.append("fieldProjection:typeof fieldProjection!=='undefined'?()=>fieldProjection:null")
              else: pairs.append(f"{n}:typeof {n}==='function'?{n}:null")
          bridge="window.__BOARD109_R7_INTERNAL_TEST__=()=>({"+','.join(pairs)+"});\n"
          assert '__BOARD109_R7_INTERNAL_TEST__' not in text
          text=text.replace(anchor,bridge+anchor,1)
          out=text.encode('utf-8');out=(b'\xef\xbb\xbf'+out) if bom else out;p.write_bytes(out)
          print('runner_only_instrumented_sha256='+hashlib.sha256(out).hexdigest())
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Read safe scope
        shell: bash
        run: |
          mkdir -p .tmp-board109-r7/tests
          cat > .tmp-board109-r7/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({testDir:'./tests',testMatch:'diag.spec.mjs',timeout:90000,workers:1,retries:0,reporter:[['line']],use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1 --directory ..',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}});
          EOF
          cat > .tmp-board109-r7/tests/diag.spec.mjs <<'EOF'
          import {test,expect} from '@playwright/test';
          test('safe internal scope diagnostic',async({page})=>{
            const errs=[];page.on('pageerror',e=>errs.push(e.message));
            const r=await page.goto('/browser/GAMEROAD.html',{waitUntil:'domcontentloaded'});expect(r?.ok()).toBeTruthy();await page.waitForTimeout(500);
            const out=await page.evaluate(()=>{const f=window.__BOARD109_R7_INTERNAL_TEST__;if(typeof f!=='function')return{bridge:false,core:!!window.__GAMEROAD_TEST__};const q=f();return{bridge:true,core:!!window.__GAMEROAD_TEST__,available:Object.fromEntries(Object.entries(q).map(([k,v])=>[k,typeof v==='function']))}});
            console.log('BOARD109_R7_SCOPE '+JSON.stringify({...out,pageErrors:errs}));
            expect(out.bridge).toBeTruthy();
          });
          EOF
          npx playwright test --config=.tmp-board109-r7/playwright.config.mjs --workers=1
