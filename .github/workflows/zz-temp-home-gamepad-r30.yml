name: TEMP R30 Home gamepad edge product recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/uifeedback-r30-home-gamepad-edge-currentmain
          fetch-depth: 0

      - name: Guard target blobs and absorb only non-overlapping current main
        shell: bash
        env:
          EXPECTED_HTML_BLOB: ad49944a780a8e2c0bb576cf160880cdc725081c
          EXPECTED_SMOKE_BLOB: a458f4e785a38ad8b64b9a57f267f7113776d39d
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXPECTED_HTML_BLOB"
          test "$(git hash-object tests/browser-runtime-smoke.spec.mjs)" = "$EXPECTED_SMOKE_BLOB"
          test "$(git rev-parse origin/main:browser/GAMEROAD.html)" = "$EXPECTED_HTML_BLOB"
          test "$(git rev-parse origin/main:tests/browser-runtime-smoke.spec.mjs)" = "$EXPECTED_SMOKE_BLOB"
          git config user.name 'gameroad-r30-executor'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit origin/main
          echo "R30_CURRENT_MAIN_NONOVERLAP_PASS main=$CURRENT_MAIN"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install focused Browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install chromium

      - name: Apply exact product patch and canonical regression
        shell: bash
        env:
          R27_EVIDENCE_COMMIT: b752adefce25ad2a8d3f929d773e3cd4c4cb0c56
          R27_TEST_BLOB: 11ed4640f0717fce14591c8e4232215ddfaa9983
        run: |
          set -euo pipefail
          git fetch origin "$R27_EVIDENCE_COMMIT" --depth=1
          git show "$R27_EVIDENCE_COMMIT":tests/home-gamepad-temporal.spec.mjs > /tmp/r30-home-gamepad-temporal.spec.mjs
          test "$(git hash-object /tmp/r30-home-gamepad-temporal.spec.mjs)" = "$R27_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path

          html_path=Path('browser/GAMEROAD.html')
          html=html_path.read_text(encoding='utf-8')
          old="""function homeMotionGamepadPoll(){if(state.screen==='home'&&!homeMotionRuntime.busy){const pads=navigator.getGamepads?.()||[],pad=[...pads].find(Boolean);if(pad){const now=performance.now(),cool=now-homeMotionRuntime.gamepadStamp>230,ax=pad.axes?.[0]||0,ay=pad.axes?.[1]||0;if(cool){let dir='';if(ay<-.58&&Math.abs(ax)<.42)dir='up';else if(ax>.58&&Math.abs(ay)<.5)dir='right';else if(ax<-.48&&ay<-.22)dir='up-left';else if(ax<-.48&&ay>.22)dir='down-left';if(dir){homeMotionRuntime.gamepadStamp=now;homeMotionFocusDirection(dir)}else if(pad.buttons?.[0]?.pressed){homeMotionRuntime.gamepadStamp=now;const t=document.activeElement?.dataset?.homeTarget;if(t)homeMotionNavigate(t);else homeMotionToggle()}else if(pad.buttons?.[1]?.pressed){homeMotionRuntime.gamepadStamp=now;homeMotionToggle()}}}}requestAnimationFrame(homeMotionGamepadPoll)}"""
          new="""let homeMotionGamepadConfirmHeld=false,homeMotionGamepadCancelHeld=false;
          function homeMotionGamepadPoll(){const pads=navigator.getGamepads?.()||[],pad=[...pads].find(Boolean),confirmPressed=!!pad?.buttons?.[0]?.pressed,cancelPressed=!!pad?.buttons?.[1]?.pressed;if(state.screen!=='home'||!pad){homeMotionGamepadConfirmHeld=confirmPressed;homeMotionGamepadCancelHeld=cancelPressed}else if(homeMotionRuntime.busy){if(!confirmPressed)homeMotionGamepadConfirmHeld=false;if(!cancelPressed)homeMotionGamepadCancelHeld=false}else{const confirmEdge=confirmPressed&&!homeMotionGamepadConfirmHeld,cancelEdge=cancelPressed&&!homeMotionGamepadCancelHeld;homeMotionGamepadConfirmHeld=confirmPressed;homeMotionGamepadCancelHeld=cancelPressed;const now=performance.now(),cool=now-homeMotionRuntime.gamepadStamp>230,ax=pad.axes?.[0]||0,ay=pad.axes?.[1]||0;if(confirmEdge){clearTimeout(homeMotionRuntime.returnTimer);homeMotionRuntime.returnTimer=0;const t=document.activeElement?.dataset?.homeTarget;if(t)homeMotionNavigate(t);else homeMotionToggle()}else if(cancelEdge){clearTimeout(homeMotionRuntime.returnTimer);homeMotionRuntime.returnTimer=0;homeMotionToggle()}else if(cool){let dir='';if(ay<-.58&&Math.abs(ax)<.42)dir='up';else if(ax>.58&&Math.abs(ay)<.5)dir='right';else if(ax<-.48&&ay<-.22)dir='up-left';else if(ax<-.48&&ay>.22)dir='down-left';if(dir){homeMotionRuntime.gamepadStamp=now;homeMotionFocusDirection(dir)}}}requestAnimationFrame(homeMotionGamepadPoll)}"""
          count=html.count(old)
          if count!=1:
              raise SystemExit(f'R30_EXACT_SOURCE_GUARD_FAILED old_count={count}')
          html_path.write_text(html.replace(old,new,1),encoding='utf-8')

          smoke_path=Path('tests/browser-runtime-smoke.spec.mjs')
          smoke=smoke_path.read_text(encoding='utf-8')
          marker='// UI R30: Home gamepad rising-edge temporal regression (recovered from exact R27 evidence blob)'
          if marker in smoke:
              raise SystemExit('R30_SMOKE_MARKER_ALREADY_PRESENT')
          src=Path('/tmp/r30-home-gamepad-temporal.spec.mjs').read_text(encoding='utf-8')
          first,sep,body=src.partition('\n')
          if first.strip()!="import { test, expect } from '@playwright/test';" or not sep:
              raise SystemExit('R30_PINNED_TEST_IMPORT_GUARD_FAILED')
          smoke_path.write_text(smoke.rstrip()+'\n\n'+marker+'\n'+body.lstrip(),encoding='utf-8')
          print('R30_EXACT_PATCH_APPLIED')
          PY
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          html=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          smoke=Path('tests/browser-runtime-smoke.spec.mjs').read_text(encoding='utf-8')
          assert html.count('let homeMotionGamepadConfirmHeld=false,homeMotionGamepadCancelHeld=false;')==1
          assert 'confirmEdge=confirmPressed&&!homeMotionGamepadConfirmHeld' in html
          assert 'cancelEdge=cancelPressed&&!homeMotionGamepadCancelHeld' in html
          assert 'clearTimeout(homeMotionRuntime.returnTimer);homeMotionRuntime.returnTimer=0;' in html
          assert "else if(cool){let dir=''" in html
          assert '// UI R30: Home gamepad rising-edge temporal regression' in smoke
          print('R30_BOUNDED_SOURCE_ASSERTIONS_PASS')
          PY

      - name: Run exact recovered temporal regression
        run: |
          npx playwright test --config=playwright.config.mjs --workers=1 --grep 'Home gamepad confirm and cancel are edge-triggered under held input'

      - name: Run canonical Browser runtime smoke
        run: |
          npx playwright test tests/browser-runtime-smoke.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Commit durable two-file product delta and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-home-gamepad-r30.yml
          git add browser/GAMEROAD.html tests/browser-runtime-smoke.spec.mjs
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          printf 'R30_FINAL_CHANGED %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'browser/GAMEROAD.html'
          test "${changed[1]}" = 'tests/browser-runtime-smoke.spec.mjs'
          git diff --check
          git commit -m 'FIX(UI R30): edge-trigger Home gamepad confirm cancel'
          git push origin HEAD:work/uifeedback-r30-home-gamepad-edge-currentmain
          echo "R30_COMMIT=$(git rev-parse HEAD)"
          echo "R30_HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          echo "R30_SMOKE_BLOB=$(git hash-object tests/browser-runtime-smoke.spec.mjs)"
