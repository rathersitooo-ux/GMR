name: TEMP Battle Left Figure Public Audit R2

on:
  push:
    branches:
      - sol/battle-left-figure-public-audit-r2-20260913
    paths:
      - '.github/workflows/zz-temp-battle-left-figure-public-audit-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD_ID: 65c96195ca8eaf090fdb29e7253ab55499a18d9e
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact public build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          curl --fail --silent --show-error --location --header 'Accept-Encoding: identity' --retry 4 --retry-delay 2 --retry-connrefused --max-time 30 --output audit-evidence/gameroad-version.json "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED="$(node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('audit-evidence/gameroad-version.json','utf8'));process.stdout.write(String(m.build_id||''))")"
          printf 'expected=%s\nobserved=%s\n' "$EXPECTED_BUILD_ID" "$OBSERVED" | tee audit-evidence/build-binding.txt
          test "$OBSERVED" = "$EXPECTED_BUILD_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Audit normal Battle figure identity and occupancy
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-left-figure.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const BASE=process.env.GAMEROAD_PUBLIC_BASE_URL, OUT='audit-evidence';
          fs.mkdirSync(OUT,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const viewports=[['desktop-1280x720',1280,720],['short-667x375',667,375],['portrait-390x844',390,844]];
          const results=[];
          for(const [name,width,height] of viewports){
            const context=await browser.newContext({viewport:{width,height}}), page=await context.newPage();
            const response=await page.goto(`${BASE}/`,{waitUntil:'domcontentloaded',timeout:45000});
            if(!response?.ok()) throw new Error(`${name}:root:${response?.status()}`);
            await page.waitForFunction(()=>Boolean(window.__GAMEROAD_TEST__?.deckPublic&&window.__GAMEROAD_TEST__?.start),null,{timeout:30000});
            const start=await page.evaluate(()=>{
              const t=window.__GAMEROAD_TEST__;
              const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));
              const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);
              const royals=['SP_J','SP_Q','SP_K'], nonRoyal=standard.filter(id=>!t.isRoyalCard(id));
              const main=[...nonRoyal.slice(0,37),...royals];
              t.deckSetDraft(main,[]);
              const valid=t.deckValidate(t.state.deckDraft,{forBattle:true});
              if(!valid.ok||!t.deckCommit()) throw new Error(`deck:${JSON.stringify(valid)}`);
              const m=t.start('4p','road_shield');
              return {screen:t.state.screen,mode:m?.mode??null,players:m?.players?.length??0};
            });
            await page.waitForFunction(()=>{const e=document.querySelector('section[data-screen="battle"]');return !!(e&&e.getClientRects().length&&getComputedStyle(e).display!=='none')},null,{timeout:20000});
            await page.waitForTimeout(1800);
            const evidence=await page.evaluate(()=>{
              const vw=innerWidth,vh=innerHeight,area=vw*vh;
              const rect=e=>{const r=e?.getBoundingClientRect?.();return r?{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom,areaRatio:(r.width*r.height)/area}:null};
              const inspect=sel=>{const e=document.querySelector(sel);if(!e)return{selector:sel,exists:false};const s=getComputedStyle(e),r=rect(e);return{selector:sel,exists:true,hiddenAttr:e.hidden===true,ariaHidden:e.getAttribute('aria-hidden'),className:typeof e.className==='string'?e.className:'',display:s.display,visibility:s.visibility,opacity:s.opacity,rect:r,visible:!!(r&&r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0),images:[...e.querySelectorAll('img')].map(i=>({src:i.currentSrc||i.src||'',rect:rect(i)}))}};
              const battle=document.querySelector('section[data-screen="battle"]');
              const images=battle?[...battle.querySelectorAll('img')].map(i=>{const s=getComputedStyle(i),r=rect(i);return{src:i.currentSrc||i.src||'',className:i.className||'',rect:r,visible:!!(r&&r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0)}}).filter(x=>x.visible).sort((a,b)=>(b.rect?.areaRatio||0)-(a.rect?.areaRatio||0)):[];
              const largeVisibleImages=images.filter(x=>(x.rect?.areaRatio||0)>=0.08||((x.rect?.width||0)>=vw*.33&&(x.rect?.height||0)>=vh*.45));
              return{screen:window.__GAMEROAD_TEST__?.state?.screen??null,mode:window.__GAMEROAD_TEST__?.state?.match?.mode??null,viewport:{width:vw,height:vh},nodes:{controlledCharacter:inspect('#battleRuntime'),battlePhaseSurface:inspect('#battlePhaseSurface'),battlePhaseNaki:inspect('#battlePhaseNaki'),advicePartner:inspect('#partnerAdviceChatPresentation')},visibleImages:images.slice(0,20),largeVisibleImages};
            });
            const c=evidence.nodes.controlledCharacter,p=evidence.nodes.battlePhaseSurface;
            evidence.start=start;
            evidence.acceptance={normalBattleVisible:evidence.screen==='battle',fourPlayerMatch:start.mode==='4p'&&start.players===4,controlledCharacterVisible:c.visible===true,controlledCharacterNotGiant:c.visible===true&&(c.rect?.areaRatio??1)<.08,dedicatedBattlePhaseHidden:p.exists===true&&p.hiddenAttr===true&&p.visible===false,giantVisibleImageCount:evidence.largeVisibleImages.length};
            results.push({name,...evidence});
            await page.screenshot({path:`${OUT}/${name}-normal-battle.png`,fullPage:true,animations:'disabled'});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync(`${OUT}/left-figure-audit.json`,JSON.stringify({expectedBuildId:process.env.EXPECTED_BUILD_ID,results},null,2));
          console.log(JSON.stringify(results.map(r=>({name:r.name,start:r.start,acceptance:r.acceptance,nodes:r.nodes,largeVisibleImages:r.largeVisibleImages})),null,2));
          if(results.some(r=>!r.acceptance.normalBattleVisible||!r.acceptance.fourPlayerMatch||!r.acceptance.controlledCharacterVisible||!r.acceptance.dedicatedBattlePhaseHidden))process.exit(2);
          EOF
          node ./.audit-left-figure.mjs | tee audit-evidence/console-summary.txt
          rm -f .audit-left-figure.mjs
      - name: Upload audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-left-figure-public-audit-r2-${{ github.run_id }}
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 14
