name: TEMP RIG R9 Motion Artifact Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/motion-artifact-evaluator.mjs'
      - 'tests/motion-artifact-evaluator.test.mjs'
      - '.github/workflows/zz-temp-rig-r9-motion-artifact-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/rig-r9-motion-artifact-evaluator-r20'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R9 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify focused evaluator before gate mutation
        run: node --test tests/motion-artifact-evaluator.test.mjs

      - name: Apply exact Required Gate mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gameroad-required-gate.yml')
          lines = path.read_text().splitlines()

          tool_anchor = 'tools/kimodo-bvh-output-probe.mjs|\\'
          test_anchor = 'tests/kimodo-bvh-output-probe.test.mjs)'
          classifier_hits = [
              i for i in range(len(lines) - 1)
              if lines[i].strip() == tool_anchor and lines[i + 1].strip() == test_anchor
          ]
          if len(classifier_hits) != 1:
              raise SystemExit(f'R9 classifier anchor cardinality != 1: {len(classifier_hits)}')
          i = classifier_hits[0]
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          lines[i + 1:i + 2] = [
              f'{indent}tests/kimodo-bvh-output-probe.test.mjs|\\',
              f'{indent}tools/motion-artifact-evaluator.mjs|\\',
              f'{indent}tests/motion-artifact-evaluator.test.mjs)',
          ]

          command_anchor = 'run: node --test tests/partner-vtuber-public-context-core.test.mjs tests/partner-body-intent-core.test.mjs tests/kimodo-bvh-output-probe.test.mjs'
          command_hits = [i for i, line in enumerate(lines) if line.strip() == command_anchor]
          if len(command_hits) != 1:
              raise SystemExit(f'R9 test-command anchor cardinality != 1: {len(command_hits)}')
          i = command_hits[0]
          lines[i] = lines[i] + ' tests/motion-artifact-evaluator.test.mjs'

          text = '\n'.join(lines) + '\n'
          if text.count('tools/motion-artifact-evaluator.mjs') != 1:
              raise SystemExit('R9 tool classification cardinality invalid')
          if text.count('tests/motion-artifact-evaluator.test.mjs') != 2:
              raise SystemExit('R9 test classification/command cardinality invalid')
          path.write_text(text)
          PY

      - name: Re-run focused evaluator after gate mutation
        run: node --test tests/motion-artifact-evaluator.test.mjs

      - name: Verify patch scope, self-remove, and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != ".github/workflows/gameroad-required-gate.yml" ]]; then
            printf 'Unexpected pre-commit patch paths:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          rm .github/workflows/zz-temp-rig-r9-motion-artifact-patch.yml
          git config user.name 'gameroad-rig-r9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gameroad-required-gate.yml .github/workflows/zz-temp-rig-r9-motion-artifact-patch.yml
          git commit -m 'RIG R9: classify motion artifact evaluator'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
