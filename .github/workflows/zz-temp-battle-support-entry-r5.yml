name: TEMP Battle Support Entry R5 Repair

on:
  push:
    branches:
      - sol/battle-support-entry-r5-20260914

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-support-entry-r5-20260914
          fetch-depth: 0
      - name: Fence current main and repair input
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9663c1eab469f43903999699921443ad81da54ef"
          test "$(git merge-base HEAD origin/main)" = "9663c1eab469f43903999699921443ad81da54ef"
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "486b522fbb9b77d973bbe79230a213bcad97e9e5"
      - name: Apply bounded DOM repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/temp-battle-support-entry-r5.py | tee /tmp/x14-repair.txt
          node --check browser/battle-replay-live-adapter.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${changed[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          ADAPTER_BLOB="$(git hash-object browser/battle-replay-live-adapter.mjs)"
          grep -F "new_adapter_blob=${ADAPTER_BLOB}" /tmp/x14-repair.txt
          grep -F "currentBlob: '${ADAPTER_BLOB}'" deploy/cloudflare/tests/build.test.mjs
      - name: Run exact Required Gate replay suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs tests/partner-battle-event-log-projection.test.mjs tests/battle-replay-public-commentary-core.test.mjs
      - name: Verify public package provenance
        shell: bash
        run: |
          set -euo pipefail
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit durable three-file result only
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/temp-battle-support-entry-r5.py
          rm -f .github/workflows/zz-temp-battle-support-entry-r5.yml
          rm -f data/preaction-authorizations/BATTLE-SUPPORT-ENTRY-R5-20260914T2041-SOL-SE14.json
          git config user.name "gameroad-bounded-writer"
          git config user.email "gameroad-bounded-writer@users.noreply.github.com"
          git add -A
          git commit -m "Battle: 支援入口の履歴DOM回帰を修正"
          mapfile -t final < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${final[@]}"
          test "${#final[@]}" -eq 3
          test "${final[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${final[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${final[2]}" = "tests/battle-replay-live-adapter.test.mjs"
          git push origin HEAD:sol/battle-support-entry-r5-20260914
