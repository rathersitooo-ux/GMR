# activation update: same-repo pull_request synchronize is the proven executor trigger
name: TEMP R23 HATE lowPerf recovery

on:
  push:
    branches:
      - work/hate-r21-actual-mount-20260822
    paths:
      - '.github/workflows/zz-temp-hate-r21-inspector.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - '.github/workflows/zz-temp-hate-r21-inspector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind-lowperf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hate-r21-actual-mount-20260822
          fetch-depth: 0

      - name: Guard exact current scope
        shell: bash
        env:
          EXPECTED_MAIN: 15375f4da44b2b78e7d943d107e48aac0b1b7013
        run: |
          set -euo pipefail
          BRANCH_HEAD="$(git rev-parse HEAD)"
          echo "BRANCH_HEAD=$BRANCH_HEAD" >> "$GITHUB_ENV"
          git fetch origin main --depth=1
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          echo "expected-main=$EXPECTED_MAIN actual-main=$ACTUAL_MAIN"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf 'branch-delta=%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              browser/GAMEROAD.html|.github/workflows/zz-temp-hate-r21-inspector.yml) ;;
              *) echo "unexpected branch path: $path" >&2; exit 1 ;;
            esac
          done
          grep -Fq 'async function friendPresentHate1000(p)' browser/GAMEROAD.html
          OLD_COUNT="$(grep -oF 'return{reducedMotion:!!reduced,animationEnabled:true};' browser/GAMEROAD.html | wc -l | tr -d ' ')"
          echo "old-preference-count=$OLD_COUNT"
          test "$OLD_COUNT" = '1'

      - name: Bind current low-performance preference
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('browser/GAMEROAD.html'); s=p.read_text(encoding='utf-8'); old='return{reducedMotion:!!reduced,animationEnabled:true};'; new='return{reducedMotion:!!reduced,lowPerf:!!state.settings?.lowPerf,animationEnabled:true};'; assert s.count(old)==1; assert new not in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          grep -Fq 'return{reducedMotion:!!reduced,lowPerf:!!state.settings?.lowPerf,animationEnabled:true};' browser/GAMEROAD.html
          node --test tests/hate-peer-presence-core.test.mjs
          git diff --check

      - name: Persist only product delta and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-r23-executor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/zz-temp-hate-r21-inspector.yml
          git add browser/GAMEROAD.html
          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" = '2'
          git commit -m 'HATE R23: honor low-performance presentation fallback'
          git push --force-with-lease=refs/heads/work/hate-r21-actual-mount-20260822:$BRANCH_HEAD origin HEAD:work/hate-r21-actual-mount-20260822
