name: Temp Battle Shield Defense Deck R2

on:
  push:
    branches:
      - sol/battle-shield-defense-deck-r2-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorization base lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cff4d7ac2882cb097347822df246d315938b1016 HEAD
          test "$(git diff --name-only cff4d7ac2882cb097347822df246d315938b1016...HEAD | sort | tr '\n' ' ')" = ".github/workflows/zz-temp-battle-shield-defense-deck-r2.yml data/preaction-authorizations/BATTLE-SHIELD-DEFENSE-DECK-R2-20260913T0005-SOL-Q8N4V24.json "
      - name: Apply exact bounded Shield repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          static_path = Path('tests/browser-static-check.mjs')
          html = html_path.read_text(encoding='utf-8')
          static = static_path.read_text(encoding='utf-8')

          old = "const usedShield=defender.shields[m.target.shield];if(!usedShield)throw Error('shield-missing');let replenish=defender.plan.battleId;if(!defender.hand.includes(replenish)||CARDS[replenish]?.runtime_status!=='playable')replenish=await replacementBattleCard(defender,'使用シールドの同位置補充に使う札を1枚選びます。');if(!replenish)throw Error('shield-replenish-card-missing');removeHand(defender,replenish);defender.shields[m.target.shield]=replenish;const battleReveals=[];m.players.forEach(p=>{if(p.id===defender.id){battleReveals.push(makeParticipant(p,usedShield,'auto_defense'));return}});"
          new = "const usedDefenseBattle=defender.shields[m.target.shield];if(!usedDefenseBattle)throw Error('shield-defense-battle-missing');const replenishDefenseBattle=defender.deck.shift();if(!replenishDefenseBattle)throw Error('shield-defense-deck-exhausted');defender.shields[m.target.shield]=replenishDefenseBattle;const battleReveals=[];m.players.forEach(p=>{if(p.id===defender.id){battleReveals.push(makeParticipant(p,usedDefenseBattle,'auto_defense'));return}});"
          if html.count(old) != 1:
              raise SystemExit(f'legacy Shield defense anchor count={html.count(old)}; expected 1')
          html = html.replace(old, new, 1)

          replacements = {
              "log('バトルカードと使用シールドを公開。公開時能力を小さい印刷値順で解決します。');": "log('バトルカードと防御札を公開。公開時能力を小さい印刷値順で解決します。');",
              "reveal:['バトルカードを公開','シールドと予約済みのバトルカードを公開しました。']": "reveal:['バトルカードを公開','防御札と予約済みのバトルカードを公開しました。']",
              "read:['カード読取成功','公開済みのバトルカードと使用シールドを確認しました。']": "read:['カード読取成功','公開済みのバトルカードと防御札を確認しました。']",
              "バトルカードと使用シールドを公開|戦闘：": "バトルカードと防御札を公開|戦闘：",
              "['バトルカードと使用シールドを公開。公開時能力を小さい印刷値順で解決します。','バトルカードとシールドを公開。能力はカードの数字が小さい順に発動します。']": "['バトルカードと防御札を公開。公開時能力を小さい印刷値順で解決します。','バトルカードと防御札を公開。能力はカードの数字が小さい順に発動します。']",
          }
          for before, after in replacements.items():
              if html.count(before) != 1:
                  raise SystemExit(f'Shield wording anchor count={html.count(before)} expected 1: {before[:64]}')
              html = html.replace(before, after, 1)

          static_anchor = "  if (/recoverRoundStartManaByPlacement/.test(html) || /位のためマナ回復\\+/.test(html)) {\n    errors.push('superseded rank-based turn-start Mana recovery remains');\n  }"
          shield_gate = "  const shieldDefenseContracts = [\n    [/const usedDefenseBattle=defender\\.shields\\[m\\.target\\.shield\\]/, 'Shield-linked defense Battle slot is not consumed from the targeted L/C/R slot'],\n    [/const replenishDefenseBattle=defender\\.deck\\.shift\\(\\)/, 'Shield-linked defense Battle slot is not replenished from deck'],\n    [/defender\\.shields\\[m\\.target\\.shield\\]=replenishDefenseBattle/, 'targeted Shield-linked defense Battle slot is not replenished in place'],\n    [/shield-defense-deck-exhausted/, 'Shield defense deck exhaustion is not fail-closed'],\n    [/battleReveals\\.push\\(makeParticipant\\(p,usedDefenseBattle,'auto_defense'\\)\\)/, 'defender Battle reveal is not sourced from the Shield-linked defense Battle slot'],\n  ];\n  for (const [pattern, message] of shieldDefenseContracts) {\n    if (!pattern.test(html)) errors.push(message);\n  }\n  if (html.includes(\"使用シールドの同位置補充に使う札を1枚選びます。\")) errors.push('legacy hand-selected Shield replenishment remains');\n  if (html.includes('let replenish=defender.plan.battleId')) errors.push('defender planned Battle card is still reused as Shield replenishment');\n  if (html.includes('removeHand(defender,replenish)')) errors.push('Shield defense replenishment still consumes defender hand');\n"
          if static.count(static_anchor) != 1:
              raise SystemExit(f'static Mana anchor count={static.count(static_anchor)}; expected 1')
          static = static.replace(static_anchor, shield_gate + static_anchor, 1)

          html_path.write_text(html, encoding='utf-8')
          static_path.write_text(static, encoding='utf-8')
          PY
      - name: Verify focused Shield contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-static-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          html = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          assert html.count("const usedDefenseBattle=defender.shields[m.target.shield]") == 1
          assert html.count('const replenishDefenseBattle=defender.deck.shift()') == 1
          assert html.count("throw Error('shield-defense-deck-exhausted')") == 1
          assert html.count('defender.shields[m.target.shield]=replenishDefenseBattle') == 1
          assert "使用シールドの同位置補充に使う札を1枚選びます。" not in html
          assert 'let replenish=defender.plan.battleId' not in html
          assert 'removeHand(defender,replenish)' not in html
          assert "replacementBattleCard(p,'予約札が不成立です。戦闘直前の合法札を1枚選びます。')" in html
          assert "const shields=deck.splice(0,3),hand=deck.splice(0,7)" in html or "const shields=deck.splice(0,3);const hand=deck.splice(0,7);" in html
          assert 'function recoverRoundStartManaByPlacement' not in html
          assert 'バトルカードと防御札を公開。公開時能力を小さい印刷値順で解決します。' in html
          PY
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "browser/GAMEROAD.html tests/browser-static-check.mjs "
      - name: Commit product repair and clean transient files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git rm .github/workflows/zz-temp-battle-shield-defense-deck-r2.yml
          git rm data/preaction-authorizations/BATTLE-SHIELD-DEFENSE-DECK-R2-20260913T0005-SOL-Q8N4V24.json
          git commit -m 'fix(browser): decouple Shield defense card and deck-replenish slot'
          git push origin HEAD:${GITHUB_REF_NAME}
