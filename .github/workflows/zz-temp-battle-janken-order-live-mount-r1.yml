name: temp-battle-janken-order-live-mount-r1

on:
  push:
    branches:
      - sol/battle-janken-order-live-mount-r1-20260910

permissions:
  contents: read

jobs:
  diagnose-html-seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm PRE_ACTION
        run: |
          test -f data/preaction-authorizations/BATTLE-JANKEN-ORDER-LIVE-MOUNT-R1-20260910T0315-SOL-U3-Q6M4P5.json
          grep -F 'PREACTION_PROCEED_ALLOWED' data/preaction-authorizations/BATTLE-JANKEN-ORDER-LIVE-MOUNT-R1-20260910T0315-SOL-U3-Q6M4P5.json
      - name: Extract bounded GAMEROAD boot and Battle seams
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          print('HTML_BYTES', len(text.encode('utf-8')))
          print('HTML_CHARS', len(text))

          print('\n=== SCRIPT SOURCES ===')
          for m in re.finditer(r'<script\b[^>]*>', text, re.I):
              tag = m.group(0)
              src = re.search(r'\bsrc=["\']([^"\']+)', tag, re.I)
              typ = re.search(r'\btype=["\']([^"\']+)', tag, re.I)
              if src or typ:
                  print(m.start(), 'SRC=', src.group(1) if src else '', 'TYPE=', typ.group(1) if typ else '', tag[:500])
          print('\n=== MODULE-LIKE REFERENCES ===')
          refs = []
          for pat in [r'import\s*\(\s*["\']([^"\']+)', r'from\s+["\']([^"\']+\.mjs[^"\']*)', r'["\']([^"\']+\.mjs(?:\?[^"\']*)?)["\']']:
              refs += re.findall(pat, text)
          for ref in sorted(set(refs))[:500]:
              print(ref)
          print('MODULE_REF_COUNT', len(set(refs)))

          terms = [
              'publicCardPresentationBuild',
              'publicCardPresentationManifest',
              'publicCard',
              'battleMap',
              'data-screen="battle"',
              "data-screen='battle'",
              'Battle',
              'janken',
              'Janken',
              'ROCK',
              'SCISSORS',
              'PAPER',
              'じゃんけん',
              'グー',
              'チョキ',
              'パー',
              'battle-new-base',
              'battle-screen',
              'battle-janken',
              'live-runtime',
          ]
          for term in terms:
              positions = [m.start() for m in re.finditer(re.escape(term), text)]
              print(f'\n=== TERM {term!r} COUNT {len(positions)} POS {positions[:20]} ===')
              for idx, pos in enumerate(positions[:8]):
                  lo = max(0, pos - 1000)
                  hi = min(len(text), pos + len(term) + 1600)
                  print(f'--- HIT {idx+1} [{lo}:{hi}] ---')
                  print(text[lo:hi].replace('\r', ''))

          print('\n=== TAIL 18000 ===')
          print(text[-18000:].replace('\r', ''))
          PY
