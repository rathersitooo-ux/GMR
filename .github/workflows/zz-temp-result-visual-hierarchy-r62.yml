name: Result R62 bounded visual hierarchy patch

on:
  push:
    branches:
      - work/result-visual-hierarchy-r62-20260901
    paths:
      - .github/workflows/zz-temp-result-visual-hierarchy-r62.yml

permissions:
  contents: write

jobs:
  patch-result-hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/result-visual-hierarchy-r62-20260901
          fetch-depth: 3
      - name: Verify exact base and patch only live Result hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "eb38b5d92f8eea57f9cbe409a5c74fa82bf5ab76"
          test "$(git hash-object browser/GAMEROAD.html)" = "1c62a75b46c34c33fd54d64848cd6dea017a52ef"
          test -f data/preaction-authorizations/RESULT-VISUAL-HIERARCHY-R62-20260901T1427-SOL-Q4N8V2.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          data = p.read_bytes()
          marker = b'gameroad-result-visual-hierarchy-r62'
          anchor = b'</style>\n</head><body><div class="app" id="app">'
          if data.count(marker) != 0:
              raise SystemExit(f'Result R62 marker count={data.count(marker)}, expected 0')
          if data.count(anchor) != 1:
              raise SystemExit(f'head-tail anchor count={data.count(anchor)}, expected 1')
          style = b'''<style id="gameroad-result-visual-hierarchy-r62">\n/* Result R62: information first, character second, one unmistakable continuation. */\n.app:has(.result.active)>.top .brand{display:none}\n.result.active .resultBody{left:45%;right:3%;top:10%;bottom:20%;z-index:3;background:rgba(8,15,18,.94);border-color:rgba(190,240,224,.18)}\n.result.active .resultRank{z-index:4}\n.result.active .resultWorld .grtc-root{inset:42% 57% 3% 23%;overflow:hidden}\n.result.active .resultWorld .grtc-image{height:100%;max-width:100%;object-fit:contain;opacity:.82}\n.result.active .resultBtns{z-index:4}\n.result.active .resultBtns .btn:not(.primary){opacity:.62;filter:saturate(.55);transform:scale(.96)}\n.result.active .resultBtns .primary{min-width:220px;min-height:58px;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.28);transform:translateY(-2px)}\n@media (max-width:900px){\n  .result.active .resultWorld{inset:0 0 52% 0;overflow:hidden}\n  .result.active .resultWorld .grtc-root{inset:6% 2% 3% 56%;overflow:hidden}\n  .result.active .resultWorld .grtc-image{height:100%;max-width:100%;opacity:.76}\n  .result.active .resultBody{left:3%;right:3%;top:48%;bottom:12%}\n  .result.active .resultBtns .btn:not(.primary){opacity:.66;filter:saturate(.6);transform:none}\n  .result.active .resultBtns .primary{min-width:0;min-height:56px;transform:none}\n}\n</style>\n'''
          data = data.replace(anchor, b'</style>\n' + style + b'</head><body><div class="app" id="app">', 1)
          if data.count(marker) != 1:
              raise SystemExit('post-patch Result R62 marker invariant failed')
          p.write_bytes(data)
          PY
          git diff --check
          test "$(git diff --name-only)" = "browser/GAMEROAD.html"
          grep -Fq 'id="gameroad-result-visual-hierarchy-r62"' browser/GAMEROAD.html
          grep -Fq '.result.active .resultBody{left:45%;right:3%;top:10%;bottom:20%' browser/GAMEROAD.html
          grep -Fq '.result.active .resultWorld{inset:0 0 52% 0;overflow:hidden}' browser/GAMEROAD.html
          grep -Fq '.result.active .resultBtns .primary{min-width:220px;min-height:58px' browser/GAMEROAD.html
      - name: Commit bounded Result hierarchy patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html
          git commit -m "Improve Result information and continuation hierarchy"
          git push origin HEAD:work/result-visual-hierarchy-r62-20260901
