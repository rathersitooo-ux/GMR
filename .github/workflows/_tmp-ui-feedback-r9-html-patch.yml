name: TEMP UI Feedback R9 HTML Patch

on:
  push:
    branches:
      - work/ui-feedback-r9-readyplan-production-20260819

permissions:
  contents: write

concurrency:
  group: ui-feedback-r9-readyplan-production
  cancel-in-progress: false

jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE: 6d18d2f50527077027fe9847ca81a6eef603072a
      EXPECTED_HTML_BLOB: f5c42b4ceb1d89b4aee9ad2adc17fa524d90ef66
      BRANCH: work/ui-feedback-r9-readyplan-production-20260819
      HTML: browser/GAMEROAD.html
      HELPER: scripts/apply-ui-feedback-ready-plan-production-r9.mjs
      HELPER_TEST: tests/ui-feedback-ready-plan-production-r9-transform.test.mjs
      WORKFLOW: .github/workflows/_tmp-ui-feedback-r9-html-patch.yml
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Fail closed on base or HTML drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          if [[ "$base" != "$EXPECTED_BASE" ]]; then
            echo "Unexpected merge base: expected=$EXPECTED_BASE actual=$base"
            exit 1
          fi
          html_blob="$(git hash-object "$HTML")"
          if [[ "$html_blob" != "$EXPECTED_HTML_BLOB" ]]; then
            echo "Branch HTML drift: expected=$EXPECTED_HTML_BLOB actual=$html_blob"
            exit 1
          fi
          main_html_blob="$(git rev-parse origin/main:"$HTML")"
          if [[ "$main_html_blob" != "$EXPECTED_HTML_BLOB" ]]; then
            echo "Current main HTML changed after acquire: expected=$EXPECTED_HTML_BLOB actual=$main_html_blob"
            exit 1
          fi

      - name: Verify transformer and existing UI binder
        run: |
          node --test "$HELPER_TEST"
          node --test tests/ui-state-feedback-core.test.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs
          node "$HELPER" "$HTML" --check-only

      - name: Apply production mount and static regression
        run: |
          node "$HELPER" "$HTML"
          node tests/browser-static-check.mjs --self-test "$HTML"

      - name: Prove bounded final product diff
        shell: bash
        run: |
          set -euo pipefail
          rm "$HELPER" "$HELPER_TEST" "$WORKFLOW"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE")
          printf 'Final changed paths:\n%s\n' "${changed[*]}"
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$HTML" ]]; then
            echo "Final diff escaped authorized HTML-only scope"
            exit 1
          fi
          grep -Fq 'id="gameroad-ui-feedback-ready-plan-production-r9"' "$HTML"
          grep -Fq 'bindReadyPlanFeedbackControl({' "$HTML"
          grep -Fq 'globalThis.GAMEROAD_READY_PLAN_COMMIT=commitPlans;' "$HTML"
          if grep -Fq "$('#readyPlan').onclick=()=>{commitPlans().catch(e=>console.error(e))};" "$HTML"; then
            echo "Legacy readyPlan onclick still present"
            exit 1
          fi

      - name: Persist HTML-only product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "UI-FEEDBACK R9: mount ready-plan feedback binder in production"
          git push origin "HEAD:$BRANCH"
