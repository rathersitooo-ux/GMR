name: temp Battle Janken thumb arc R9

on:
  push:
    branches: [sol/battle-janken-thumb-arc-r8-20260912]

permissions:
  contents: write

concurrency:
  group: battle-janken-thumb-arc-r9
  cancel-in-progress: false

jobs:
  patch-test-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed candidate and proven edge-fit
        shell: bash
        env:
          AUTH_BASE: 87eff701a8cf33c15929d1cbcb1ac6e263ec5b50
          DONOR_BASE: 9253002b4f2fa1fcf092ef7ddb2e7769acad7bb5
          DONOR_HEAD: 32d5e9a4a54ef85099211df374fa0edd5ef22d63
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUTH_BASE" HEAD
          git diff --binary "$DONOR_BASE" "$DONOR_HEAD" -- \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            tests/battle-janken-slidepad-runtime-mount.test.mjs > /tmp/thumb-arc.patch
          test -s /tmp/thumb-arc.patch
          git apply --check /tmp/thumb-arc.patch
          git apply /tmp/thumb-arc.patch
          python3 - <<'PY'
          from pathlib import Path
          rp=Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          tp=Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          r=rp.read_text(encoding='utf-8')
          old='translate(-150px,4px) rotate(-15deg)'; new='translate(-150px,-2px) rotate(-15deg)'
          if r.count(old)!=1: raise SystemExit(f'ROCK runtime anchor={r.count(old)}')
          rp.write_text(r.replace(old,new,1),encoding='utf-8')
          t=tp.read_text(encoding='utf-8')
          old_t=r'translate\(-150px,4px\) rotate\(-15deg\)'; new_t=r'translate\(-150px,-2px\) rotate\(-15deg\)'
          if t.count(old_t)!=1: raise SystemExit(f'ROCK test anchor={t.count(old_t)}')
          tp.write_text(t.replace(old_t,new_t,1),encoding='utf-8')
          PY
      - name: Focused checks
        run: |
          set -euo pipefail
          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Capture current Battle use-site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r9-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/browser/GAMEROAD.html >/dev/null && break || sleep .25; done
          mkdir -p evidence/battle-janken-thumb-arc-r9
          git show 30940267c6d7b9e7cb3d5057709d5c09a11641b4:.github/workflows/zz-temp-battle-janken-thumb-arc-r8.yml > /tmp/r8.yml
          awk '/cat > \.r8-capture\.mjs <<.NODE./{flag=1;next} flag && /^          NODE$/{exit} flag{sub(/^          /,"");print}' /tmp/r8.yml > .r9-capture.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.r9-capture.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("evidence/battle-janken-thumb-arc-r8","evidence/battle-janken-thumb-arc-r9")
          s=s.replace("63743e7e5d3c552a199d98984fa19ad5b3759929","87eff701a8cf33c15929d1cbcb1ac6e263ec5b50")
          old="owner:id(document.elementFromPoint(x,y))"
          new="owner:id(document.elementFromPoint(x,y)?.closest?.('[data-janken-slot], .grJankenSlidePadHandle')||document.elementFromPoint(x,y))"
          if s.count(old)!=1: raise SystemExit(f'hit owner anchor={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node .r9-capture.mjs
          for f in 1280x720-expanded.png 667x375-expanded.png 390x844-expanded.png geometry.json; do test -s "evidence/battle-janken-thumb-arc-r9/$f"; done
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: battle-janken-thumb-arc-r9
          path: evidence/battle-janken-thumb-arc-r9
          if-no-files-found: error
          retention-days: 7
      - name: Commit candidate and inspectable evidence
        shell: bash
        env:
          AUTH_BASE: 87eff701a8cf33c15929d1cbcb1ac6e263ec5b50
          BRANCH: sol/battle-janken-thumb-arc-r8-20260912
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUTH_BASE" HEAD
          rm -f .r9-capture.mjs .github/workflows/zz-temp-battle-janken-thumb-arc-r8.yml data/preaction-authorizations/BATTLE-JANKEN-THUMB-ARC-R9-20260912T1002-SOL-M8Q4N12.json
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "$AUTH_BASE" | sort)
          expected=(browser/battle-janken-slidepad-runtime-mount.mjs evidence/battle-janken-thumb-arc-r9/1280x720-expanded.png evidence/battle-janken-thumb-arc-r9/390x844-expanded.png evidence/battle-janken-thumb-arc-r9/667x375-expanded.png evidence/battle-janken-thumb-arc-r9/geometry.json tests/battle-janken-slidepad-runtime-mount.test.mjs)
          [ "${#changed[@]}" -eq 6 ] || { printf 'bad candidate diff count: %s\n' "${changed[*]}"; exit 1; }
          for i in 0 1 2 3 4 5; do [ "${changed[$i]}" = "${expected[$i]}" ] || { printf 'bad candidate diff: %s\n' "${changed[*]}"; exit 1; }; done
          git config user.name gameroad-actions
          git config user.email actions@users.noreply.github.com
          git commit -m 'Battle SlidePad: 右親指じゃんけん弧 R9候補と実画面証拠 [skip ci]'
          git push origin "HEAD:$BRANCH"
