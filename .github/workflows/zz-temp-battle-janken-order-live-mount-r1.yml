name: temp-battle-janken-order-live-mount-r1

on:
  push:
    branches:
      - sol/battle-janken-order-live-mount-r1-20260910

permissions:
  contents: read

jobs:
  diagnose-html-seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm PRE_ACTION
        run: |
          test -f data/preaction-authorizations/BATTLE-JANKEN-ORDER-LIVE-MOUNT-R1-20260910T0315-SOL-U3-Q6M4P5.json
          grep -F 'PREACTION_PROCEED_ALLOWED' data/preaction-authorizations/BATTLE-JANKEN-ORDER-LIVE-MOUNT-R1-20260910T0315-SOL-U3-Q6M4P5.json
      - name: Extract bounded GAMEROAD HTML seams
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          print('HTML_BYTES', len(text.encode('utf-8')))
          print('HTML_CHARS', len(text))
          terms = [
              'mountBattleJankenSlidePadRuntime',
              'battleJankenSlidePad',
              'battle-janken-slidepad-runtime-mount',
              'battle-janken-order-live-adapter',
              'projectBattleJankenOrderSnapshot',
              'presentOrderMotion',
              'processingOrder',
              'resolvedWinners',
              'unresolvedSurvivors',
              'publicCards',
              'createBattleScreenModel',
              'mountBattleScreenRuntime',
          ]
          for term in terms:
              positions = [m.start() for m in re.finditer(re.escape(term), text)]
              print(f'\n=== TERM {term!r} COUNT {len(positions)} POS {positions[:12]} ===')
              for idx, pos in enumerate(positions[:6]):
                  lo = max(0, pos - 1100)
                  hi = min(len(text), pos + len(term) + 1500)
                  snippet = text[lo:hi].replace('\r', '')
                  print(f'--- HIT {idx+1} [{lo}:{hi}] ---')
                  print(snippet)

          print('\n=== BOUNDED JANKEN IDENTIFIER INVENTORY ===')
          ids = sorted(set(re.findall(r'\b[A-Za-z_$][A-Za-z0-9_$]{2,}\b', text)))
          picked = [x for x in ids if 'janken' in x.lower() or 'battleScreen' in x or 'publicCard' in x or 'processingOrder' in x]
          for x in picked[:300]:
              print(x)
          print('INVENTORY_COUNT', len(picked))
          PY
