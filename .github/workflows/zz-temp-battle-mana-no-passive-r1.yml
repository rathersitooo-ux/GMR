name: temp-battle-mana-no-passive-r1

on:
  push:
    branches:
      - sol/battle-mana-no-passive-recovery-r1-20260912

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-mana-no-passive-recovery-r1-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove superseded passive turn-start Mana recovery only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          start_call = 'recoverRoundStartManaByPlacement(state.match);'
          round_call = 'recoverRoundStartManaByPlacement(m);'
          helper = "function recoverRoundStartManaByPlacement(m){for(const row of currentPlacementRanks(m)){const gain=Math.max(1,Number(row.rank)||1),p=row.player,max=Math.max(0,Number(p.manaMax)||10);const before=Math.max(0,Math.min(max,Number(p.manaCurrent)||0)),after=Math.min(max,before+gain);p.manaCurrent=after;log(`${p.name}：${gain}位のためマナ回復+${after-before}（${after}/${max}）。`)}}"
          for needle, expected in ((start_call, 1), (round_call, 1), (helper, 1)):
              count = s.count(needle)
              if count != expected:
                  raise SystemExit(f'fail closed: expected {expected} occurrence of {needle[:50]!r}, got {count}')
          s = s.replace(start_call, '', 1)
          s = s.replace(round_call, '', 1)
          s = s.replace(helper, '', 1)
          if 'recoverRoundStartManaByPlacement' in s:
              raise SystemExit('fail closed: stale recovery identifier remains')
          if 'function currentPlacementRanks(m=state.match)' not in s:
              raise SystemExit('fail closed: Result ranking helper missing')
          if 'manaCurrent:7,manaMax:10' not in s:
              raise SystemExit('fail closed: numeric Mana 7/10 changed unexpectedly')
          p.write_text(s, encoding='utf-8')

          sp = Path('tests/browser-static-check.mjs')
          t = sp.read_text(encoding='utf-8')
          stale_messages = [
              'round-start placement Mana recovery is not mounted',
              'round-start placement Mana recovery does not clamp and write numeric Mana',
              'round one does not recover current-rank Mana before play',
              'later rounds do not recover current-rank Mana',
          ]
          for marker in stale_messages:
              count = t.count(marker)
              if count != 1:
                  raise SystemExit(f'fail closed: static assertion marker {marker!r} count={count}')
          lines = [line for line in t.splitlines() if not any(marker in line for marker in stale_messages)]
          t = '\n'.join(lines) + '\n'
          anchor = "  for (const [pattern, message] of correctedBattleResourceContracts) {\n    if (!pattern.test(html)) errors.push(message);\n  }\n"
          replacement = anchor + "  if (/recoverRoundStartManaByPlacement/.test(html) || /位のためマナ回復\\+/.test(html)) {\n    errors.push('superseded rank-based turn-start Mana recovery remains');\n  }\n"
          if t.count(anchor) != 1:
              raise SystemExit(f'fail closed: static contract anchor count={t.count(anchor)}')
          t = t.replace(anchor, replacement, 1)
          sp.write_text(t, encoding='utf-8')
          PY
          git diff --check
      - name: Focused Mana regression and browser static check
        run: |
          node --test tests/browser-next-round-mana-recovery-check.mjs
          node tests/browser-static-check.mjs
      - name: Finalize durable product and acceptance diff
        shell: bash
        run: |
          rm .github/workflows/zz-temp-battle-mana-no-passive-r1.yml
          rm data/preaction-authorizations/BATTLE-MANA-NO-PASSIVE-RECOVERY-R1-20260912T1649-SOL-Q8N4V16.json
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/zz-temp-battle-mana-no-passive-r1.yml' 'browser/GAMEROAD.html' 'data/preaction-authorizations/BATTLE-MANA-NO-PASSIVE-RECOVERY-R1-20260912T1649-SOL-Q8N4V16.json' 'tests/browser-static-check.mjs' | sort)"
          test "$actual" = "$expected" || { echo "unexpected staged paths"; printf '%s\n' "$actual"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Battle: turn-start passive Mana recovery to zero'
          git push origin HEAD:sol/battle-mana-no-passive-recovery-r1-20260912
