name: TEMP Camera Gate Classify R1

on:
  push:
    branches:
      - sol/battle-camera-html-r8-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply one-path classification repair
        shell: bash
        run: |
          set -euo pipefail
          PRE='2ef7015433ac185cda0a0bab0a1628aa92c5e45f'
          BASE='9c3cb56e7c50bc677f20f3223d8c103ffefa0c2e'
          test "$(git rev-parse ${PRE}^)" = "$BASE"
          git merge-base --is-ancestor "$PRE" HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gameroad-required-gate.yml')
          s=p.read_text(encoding='utf-8')
          old="              tests/browser-runtime-smoke.spec.mjs|\\\\\n              playwright.config.mjs|\\\\\n"
          new="              tests/browser-runtime-smoke.spec.mjs|\\\\\n              tests/battle-camera-live-integration.test.mjs|\\\\\n              playwright.config.mjs|\\\\\n"
          if s.count(old)!=1:
              raise SystemExit(f'expected one browser classification anchor, got {s.count(old)}')
          if 'tests/battle-camera-live-integration.test.mjs' in s:
              raise SystemExit('camera integration test already classified unexpectedly')
          s=s.replace(old,new,1)
          if s.count('tests/battle-camera-live-integration.test.mjs')!=1:
              raise SystemExit('camera test classification count mismatch')
          if 'Fail closed on unclassified executable or CI paths' not in s:
              raise SystemExit('fail-closed fallback missing')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/gameroad-required-gate.yml
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add .github/workflows/gameroad-required-gate.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/gameroad-required-gate.yml'
          git commit -m 'CI: camera integration testを既存browser gateへ分類'
      - name: Remove transient writer and authorization
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-camera-gate-classify-r1.yml
          git rm data/preaction-authorizations/GITHUB-CI-CAMERA-CLASSIFY-R1-20260913T2012-SOL.json
          git commit -m 'Cleanup camera gate classification transient files'
          git push origin HEAD:sol/battle-camera-html-r8-20260913
