name: temp RPS3 turn epoch R2

on:
  push:
    branches:
      - sol/battle-rps3-turn-epoch-r2-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: patch
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[rps3-turn-guarded]'; then exit 0; fi
          echo ' ' | base64 -d > /tmp/rps3.py
          python /tmp/rps3.py
