name: Codex Battle Replay R8 apply

on:
  push:
    branches:
      - work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-r8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-r8
          fetch-depth: 0

      - name: Verify R8 base and untouched product blobs
        shell: bash
        env:
          BASE_SHA: fcfc48cd01442e12c5a85d7fd39ef278f2b0e24f
          HTML_BLOB: cf7613d00221c643afc2f5f222e9335d6393c532
          TEST_BLOB: 7f96942263aefaa7748f1dc38d9a608b84f78694
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          printf '%s\n' \
            '.github/workflows/codex-battle-replay-r8-apply.yml' \
            'tools/codex-battle-replay-r8-apply.py' | sort > /tmp/r8-allowed-before.txt
          git diff --name-only "${BASE_SHA}" HEAD | sort > /tmp/r8-before.txt
          diff -u /tmp/r8-allowed-before.txt /tmp/r8-before.txt
          test "$(git hash-object browser/GAMEROAD.html)" = "${HTML_BLOB}"
          test "$(git hash-object tests/battle-replay-live-adapter.test.mjs)" = "${TEST_BLOB}"
          python3 -m py_compile tools/codex-battle-replay-r8-apply.py

      - name: Patch canonical accepted-event replay into production Browser
        run: |
          set -euo pipefail
          python3 tools/codex-battle-replay-r8-apply.py
          git diff --check -- browser/GAMEROAD.html tests/battle-replay-live-adapter.test.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Replay unit and production-mount tests
        run: node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs

      - name: Run Browser static check
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Run Browser runtime smoke
        run: npx playwright test --config=playwright.config.mjs --workers=1

      - name: Run Browser full interaction evidence
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1

      - name: Commit only reviewed product files and self-remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules playwright-report test-results tools/__pycache__
          git diff --check -- browser/GAMEROAD.html tests/battle-replay-live-adapter.test.mjs
          git rm .github/workflows/codex-battle-replay-r8-apply.yml tools/codex-battle-replay-r8-apply.py
          git add browser/GAMEROAD.html tests/battle-replay-live-adapter.test.mjs
          git diff --cached --name-only | sort > /tmp/r8-staged.txt
          printf '%s\n' \
            '.github/workflows/codex-battle-replay-r8-apply.yml' \
            'browser/GAMEROAD.html' \
            'tests/battle-replay-live-adapter.test.mjs' \
            'tools/codex-battle-replay-r8-apply.py' | sort > /tmp/r8-expected.txt
          diff -u /tmp/r8-expected.txt /tmp/r8-staged.txt
          if [[ -n "$(git status --porcelain --untracked-files=all | grep -vE '^D  \.github/workflows/codex-battle-replay-r8-apply\.yml$|^M  browser/GAMEROAD\.html$|^M  tests/battle-replay-live-adapter\.test\.mjs$|^D  tools/codex-battle-replay-r8-apply\.py$' || true)" ]]; then
            echo 'Unexpected working tree changes remain:'
            git status --short
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'BATTLE REPLAY R8: mount accepted-event replay on production Result'
          git push origin HEAD:work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-r8
