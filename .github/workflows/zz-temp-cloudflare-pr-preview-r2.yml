name: GAMEROAD Shared Preview Match Start Runtime Diagnostic R8

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Extract snapshot runtime references and module tags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('browser/GAMEROAD.html','utf8');
          const needles=['GAMEROAD_CREATE_DECK_MATCH_START_SNAPSHOT','MATCH_START_SNAPSHOT_RUNTIME_UNAVAILABLE','createDeckMatchStartSnapshot','match-start','deck-match'];
          for(const needle of needles){
            let at=0,count=0;
            while((at=s.indexOf(needle,at))>=0){
              count++;
              const a=Math.max(0,at-2200), b=Math.min(s.length,at+needle.length+3200);
              console.log(`\n===== ${needle} occurrence ${count} @${at} =====\n${s.slice(a,b)}`);
              at+=needle.length;
            }
            console.log(`COUNT ${needle}=${count}`);
          }
          const tags=[...s.matchAll(/<script\b[^>]*?(?:src=["'][^"']+["'][^>]*)?>/gi)].map(m=>m[0]);
          console.log('\n===== SCRIPT_TAGS =====');
          for(const tag of tags) if(/\.mjs|module|snapshot|deck|battle/i.test(tag)) console.log(tag);
          NODE
