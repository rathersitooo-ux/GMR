name: TEMP R30 Home gamepad edge recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/uifeedback-r30-home-gamepad-edge-currentmain
          fetch-depth: 0
      - name: Guard current main and exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = d8bc961cff3ffd1484486a513cf3571bfb94695d
          test "$(git hash-object browser/GAMEROAD.html)" = ad49944a780a8e2c0bb576cf160880cdc725081c
          test "$(git hash-object tests/browser-runtime-smoke.spec.mjs)" = a458f4e785a38ad8b64b9a57f267f7113776d39d
          test "$(git merge-base HEAD origin/main)" = d8bc961cff3ffd1484486a513cf3571bfb94695d
          echo R30_GUARD_PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install chromium
      - name: Patch exact Home polling function and fold pinned temporal regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin b752adefce25ad2a8d3f929d773e3cd4c4cb0c56 --depth=1
          git show b752adefce25ad2a8d3f929d773e3cd4c4cb0c56:tests/home-gamepad-temporal.spec.mjs > /tmp/r30-temporal.spec.mjs
          test "$(git hash-object /tmp/r30-temporal.spec.mjs)" = 11ed4640f0717fce14591c8e4232215ddfaa9983
          python3 - <<'PY'
          from pathlib import Path
          hp=Path('browser/GAMEROAD.html'); s=hp.read_text(encoding='utf-8')
          start='function homeMotionGamepadPoll(){'; tail='requestAnimationFrame(homeMotionGamepadPoll)}'
          assert s.count(start)==1
          a=s.index(start); b=s.index(tail,a)+len(tail)
          old=s[a:b]
          assert old.count('pad.buttons?.[0]?.pressed')==1 and old.count('pad.buttons?.[1]?.pressed')==1
          new="""let homeMotionGamepadConfirmHeld=false,homeMotionGamepadCancelHeld=false;
          function homeMotionGamepadPoll(){const pads=navigator.getGamepads?.()||[],pad=[...pads].find(Boolean),confirmPressed=!!pad?.buttons?.[0]?.pressed,cancelPressed=!!pad?.buttons?.[1]?.pressed,confirmEdge=confirmPressed&&!homeMotionGamepadConfirmHeld,cancelEdge=cancelPressed&&!homeMotionGamepadCancelHeld;homeMotionGamepadConfirmHeld=confirmPressed;homeMotionGamepadCancelHeld=cancelPressed;if(state.screen==='home'&&!homeMotionRuntime.busy&&pad){const now=performance.now(),cool=now-homeMotionRuntime.gamepadStamp>230,ax=pad.axes?.[0]||0,ay=pad.axes?.[1]||0;if(confirmEdge){const t=document.activeElement?.dataset?.homeTarget;if(t)homeMotionNavigate(t);else homeMotionToggle()}else if(cancelEdge){homeMotionToggle()}else if(cool){let dir='';if(ay<-.58&&Math.abs(ax)<.42)dir='up';else if(ax>.58&&Math.abs(ay)<.5)dir='right';else if(ax<-.48&&ay<-.22)dir='up-left';else if(ax<-.48&&ay>.22)dir='down-left';if(dir){homeMotionRuntime.gamepadStamp=now;homeMotionFocusDirection(dir)}}}requestAnimationFrame(homeMotionGamepadPoll)}"""
          hp.write_text(s[:a]+new+s[b:],encoding='utf-8')
          sp=Path('tests/browser-runtime-smoke.spec.mjs'); smoke=sp.read_text(encoding='utf-8')
          marker='// UI R30: Home gamepad rising-edge temporal regression'
          assert marker not in smoke
          src=Path('/tmp/r30-temporal.spec.mjs').read_text(encoding='utf-8')
          first,sep,body=src.partition('\n'); assert sep and first.strip()=="import { test, expect } from '@playwright/test';"
          sp.write_text(smoke.rstrip()+'\n\n'+marker+'\n'+body.lstrip(),encoding='utf-8')
          print('R30_PATCH_APPLIED',len(old),len(new))
          PY
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'browser/GAMEROAD.html tests/browser-runtime-smoke.spec.mjs '
      - name: Run focused temporal regression
        run: npx playwright test --config=playwright.config.mjs --workers=1 --grep 'Home gamepad confirm and cancel are edge-triggered under held input'
      - name: Commit product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-r30-executor
          git config user.email actions@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-runtime-smoke.spec.mjs
          git commit -m 'FIX(UI R30): edge-trigger Home gamepad confirm cancel'
          git push origin HEAD:work/uifeedback-r30-home-gamepad-edge-currentmain
          echo "R30_PRODUCT_COMMIT=$(git rev-parse HEAD)"
