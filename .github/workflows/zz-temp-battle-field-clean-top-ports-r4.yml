name: Temp Battle Clean Top Ports R4 Recovery
on:
  push:
    branches:
      - sol/battle-field-clean-top-ports-r4-20260915
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover-product-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-field-clean-top-ports-r4-20260915
          fetch-depth: 0
      - name: Verify exact base and first-commit authorization witness
        shell: bash
        run: |
          set -euo pipefail
          BASE=061c899df9df59d3b798034f097dbe9951946c6d
          AUTH=076e892cd51860df048269966ca43bb3e28b3165
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-parse "$AUTH^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$AUTH")" = "data/preaction-authorizations/BATTLE-CLEAN-TOP-PORTS-R3-20260915T1348-SOL-FIELD.json"
          node -e "const m=require('./data/preaction-authorizations/BATTLE-CLEAN-TOP-PORTS-R3-20260915T1348-SOL-FIELD.json'); if(JSON.stringify([...m.scope].sort())!==JSON.stringify([...m.leaseScope].sort())) process.exit(1); if(m.leaseSnapshotReadbackRef!=='CURRENT_ACTIVE_LEASES!A1488:L1488') process.exit(2)"
      - name: Apply exact verified R3 product diff onto clean main history
        shell: bash
        run: |
          set -euo pipefail
          BASE=061c899df9df59d3b798034f097dbe9951946c6d
          SOURCE=5a3b956a459d24253b75aee3505c3d321c1d0232
          git fetch origin sol/battle-field-clean-top-ports-r3-20260915 --quiet
          test "$(git rev-parse origin/sol/battle-field-clean-top-ports-r3-20260915)" = "$SOURCE"
          git diff "$BASE" "$SOURCE" -- browser/GAMEROAD.html tests/browser-static-check.mjs > /tmp/product.patch
          test -s /tmp/product.patch
          git apply --check /tmp/product.patch
          git apply /tmp/product.patch
      - name: Verify product topology and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-static-check.mjs
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          a=s.index('const SYMMETRIC_FIELD_PORTS=Object.freeze({')
          b=s.index('const SYMMETRIC_FIELD_START_ID=',a)
          ports=s[a:b]
          pairs=re.findall(r"'(P[1-4]:[LCR])':'(F:U:\d+)'",ports)
          expected=[
            ('P1:L','F:U:0'),('P1:C','F:U:1'),('P1:R','F:U:2'),
            ('P2:L','F:U:3'),('P2:C','F:U:4'),('P2:R','F:U:5'),
            ('P3:L','F:U:7'),('P3:C','F:U:8'),('P3:R','F:U:9'),
            ('P4:L','F:U:10'),('P4:C','F:U:11'),('P4:R','F:U:12'),
          ]
          assert pairs == expected, (pairs, expected)
          assert len({v for _,v in pairs}) == 12
          assert 'F:U:6' not in {v for _,v in pairs}
          assert "'F:L:" not in ports and "'F:R:" not in ports
          assert not re.search(r'SYMMETRIC_FIELD_(?:GATE_NODE|GATE_CELL|GATE_STOP)',s)
          assert "gateRole:'BOUNDARY_EDGE_ONLY'" in s
          assert "const SYMMETRIC_FIELD_GOAL_VISUAL_COLUMNS=9" in s
          assert "function symmetricFieldActive(){const id=currentBattleFieldId();return id===BATTLE_FIELD_SYMMETRIC_GATE_ID||id===BATTLE_FIELD_GARDEN3D_ID}" in s
          e0=s.index('const SYMMETRIC_FIELD_EDGES=Object.freeze([')
          e1=s.index('const SYMMETRIC_FIELD_TOP_PORT_IDS=',e0)
          edges=s[e0:e1]
          for i in range(12): assert f"['F:U:{i}','F:U:{i+1}']" in edges
          banned=[
            "['F:U:1','F:L:0']","['F:U:0','F:L:1']","['F:L:0','F:L:2']","['F:L:1','F:L:3']",
            "['F:U:11','F:R:0']","['F:U:12','F:R:1']","['F:R:0','F:R:2']","['F:R:1','F:R:3']",
          ]
          assert not any(x in edges for x in banned)
          print('BATTLE_CLEAN_TOP_PORTS_R4_PRODUCT_ACCEPTANCE_PASS')
          PY
      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-sol
          git config user.email gameroad-sol@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git commit -m "Battle: add clean connected new field and Garden3D"
      - name: Cleanup authorization transport and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git rm data/preaction-authorizations/BATTLE-CLEAN-TOP-PORTS-R3-20260915T1348-SOL-FIELD.json
          git rm .github/workflows/zz-temp-battle-field-clean-top-ports-r4.yml
          git commit -m "chore: close clean top-port recovery lane"
          test "$(git diff --name-only 061c899df9df59d3b798034f097dbe9951946c6d...HEAD | sort)" = $'browser/GAMEROAD.html\ntests/browser-static-check.mjs'
          git push origin HEAD:sol/battle-field-clean-top-ports-r4-20260915
