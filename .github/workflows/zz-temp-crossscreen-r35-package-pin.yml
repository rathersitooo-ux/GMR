name: TEMP Crossscreen R35 Package Pin

on:
  push:
    branches:
      - work/crossscreen-r35-infinite-conveyor-environment

permissions:
  contents: write

jobs:
  refresh-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crossscreen-r35-infinite-conveyor-environment
          fetch-depth: 0
      - name: Refresh exact Battle Conveyor package provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/battle-conveyor-presentation-core.mjs)" = "068f1b4998bff455e5f312668f777c1619948622"
          test "$(git hash-object tests/battle-conveyor-presentation-core.test.mjs)" = "0f17b24c9eb1fc1f9f602f3b4e8653ba8a0740f3"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "bc942e83e9c4659b5be4c0a89899e35b371d2328"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/tests/build.test.mjs')
          s = p.read_text()
          old = "currentBlob: '70a6a7e354ad96d4297acab3ba2d9c4caa584af2',"
          new = "currentBlob: '068f1b4998bff455e5f312668f777c1619948622',"
          if s.count(old) != 1:
              raise SystemExit('BATTLE_CONVEYOR_PACKAGE_PIN_PREIMAGE_MISMATCH')
          p.write_text(s.replace(old, new, 1))
          PY
          node tests/battle-conveyor-presentation-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
          rm .github/workflows/zz-temp-crossscreen-r35-package-pin.yml
          git config user.name "gameroad-r35-executor"
          git config user.email "actions@users.noreply.github.com"
          git add deploy/cloudflare/tests/build.test.mjs .github/workflows/zz-temp-crossscreen-r35-package-pin.yml
          git commit -m "CROSSSCREEN R35: refresh conveyor package provenance"
          git push origin HEAD:work/crossscreen-r35-infinite-conveyor-environment
