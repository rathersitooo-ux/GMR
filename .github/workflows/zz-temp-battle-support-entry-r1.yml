name: temp-battle-support-entry-r1

on:
  push:
    branches:
      - sol/battle-support-entry-r1-20260914

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'temporary Battle support entry patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-support-entry-r1-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded support-entry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('browser/battle-replay-live-adapter.mjs')
          text = path.read_text()

          constants_anchor = "const PARTNER_BATTLE_LOG_DEFAULT_RECENT_ROWS = 2;\n"
          constants_insert = constants_anchor + "const BATTLE_SUPPORT_ENTRY_ATTR = 'data-battle-support-entry';\nconst BATTLE_SUPPORT_ITEM_ATTR = 'data-battle-support-item';\n"
          assert text.count(constants_anchor) == 1, text.count(constants_anchor)
          assert 'BATTLE_SUPPORT_ENTRY_ATTR' not in text
          text = text.replace(constants_anchor, constants_insert, 1)

          function_anchor = "function ensurePartnerBattleEventLogHost(environment = {}) {\n"
          helper = """function ensureLiveBattleSupportEntryRoot(documentRef, shell) {
            if (!shell || typeof documentRef?.createElement !== 'function') return null;
            let root = typeof shell.querySelector === 'function'
              ? shell.querySelector(`[${BATTLE_SUPPORT_ENTRY_ATTR}]`)
              : null;
            if (!root) {
              root = documentRef.createElement('nav');
              if (!root || typeof root.setAttribute !== 'function' || typeof shell.appendChild !== 'function') return null;
              root.setAttribute(BATTLE_SUPPORT_ENTRY_ATTR, '');
              root.setAttribute('aria-label', '対戦サポート');
              shell.appendChild(root);
            }
            return root;
          }

          export function registerLiveBattleSupportSurface({
            key,
            label,
            target,
            document = browserGlobal('document'),
            hostId = 'battleLog'
          } = {}) {
            if (!nonEmptyString(key) || !nonEmptyString(label) || !target) return false;
            const shell = document?.getElementById?.(hostId);
            if (!shell || typeof document?.createElement !== 'function') return false;
            const root = ensureLiveBattleSupportEntryRoot(document, shell);
            if (!root || typeof root.appendChild !== 'function') return false;
            const children = root.children ? Array.from(root.children) : [];
            let control = children.find(
              child => child?.getAttribute?.(BATTLE_SUPPORT_ITEM_ATTR) === key
            ) || null;
            if (!control) {
              control = document.createElement('button');
              if (!control || typeof control.setAttribute !== 'function') return false;
              control.setAttribute('type', 'button');
              control.setAttribute(BATTLE_SUPPORT_ITEM_ATTR, key);
              root.appendChild(control);
            }
            control.textContent = label;
            control.onclick = () => {
              target.scrollIntoView?.({ block: 'nearest' });
              target.focus?.({ preventScroll: true });
            };
            return true;
          }

          """
          assert text.count(function_anchor) == 1, text.count(function_anchor)
          text = text.replace(function_anchor, helper + function_anchor, 1)

          history_anchor = """    shell.appendChild(host);
            }
            return host;
          }
          """
          history_replacement = """    shell.appendChild(host);
            }
            registerLiveBattleSupportSurface({
              key: 'history',
              label: '履歴',
              target: host,
              document: documentRef
            });
            return host;
          }
          """
          assert text.count(history_anchor) == 1, text.count(history_anchor)
          text = text.replace(history_anchor, history_replacement, 1)

          deck_anchor = """  root.replaceChildren?.(title, known, unknown);
            return true;
          }
          """
          deck_replacement = """  root.replaceChildren?.(title, known, unknown);
            registerLiveBattleSupportSurface({
              key: 'deck',
              label: '山札',
              target: root,
              document,
              hostId
            });
            return true;
          }
          """
          assert text.count(deck_anchor) == 1, text.count(deck_anchor)
          text = text.replace(deck_anchor, deck_replacement, 1)

          path.write_text(text)
          PY

          cat > tests/battle-support-entry.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            createPartnerBattleEventLogPresentationBridge,
            registerLiveBattleSupportSurface,
            renderLiveBattleRemainingDeckPresentation
          } from '../browser/battle-replay-live-adapter.mjs';

          function fakeBattleLogDocument({ includeShell = true } = {}) {
            function node(tagName = 'div') {
              const attributes = new Map();
              const listeners = new Map();
              return {
                tagName: String(tagName).toUpperCase(),
                dataset: {},
                style: {},
                children: [],
                textContent: '',
                hidden: false,
                scrollCalls: 0,
                focusCalls: 0,
                onclick: null,
                setAttribute(name, value) { attributes.set(name, String(value)); },
                getAttribute(name) { return attributes.has(name) ? attributes.get(name) : null; },
                addEventListener(type, listener) { listeners.set(type, listener); },
                appendChild(child) { this.children.push(child); return child; },
                replaceChildren(...children) { this.children = [...children]; },
                querySelector(selector) {
                  if (!selector.startsWith('[') || !selector.endsWith(']')) return null;
                  const attribute = selector.slice(1, -1);
                  return this.children.find(child => child.getAttribute?.(attribute) !== null) || null;
                },
                click() {
                  this.onclick?.({ currentTarget: this });
                  listeners.get('click')?.({ currentTarget: this });
                },
                scrollIntoView() { this.scrollCalls += 1; },
                focus() { this.focusCalls += 1; }
              };
            }
            const shell = includeShell ? node('section') : null;
            return {
              document: {
                createElement: tag => node(tag),
                getElementById: id => id === 'battleLog' ? shell : null
              },
              shell
            };
          }

          function supportItems(shell) {
            const root = shell?.querySelector?.('[data-battle-support-entry]');
            return root ? root.children.map(child => child.getAttribute('data-battle-support-item')) : [];
          }

          test('support registration fails closed without a real host or target', () => {
            const { document } = fakeBattleLogDocument({ includeShell: false });
            assert.equal(registerLiveBattleSupportSurface({
              key: 'graveyard', label: '墓地', target: null, document
            }), false);
            assert.equal(document.getElementById('battleLog'), null);
          });

          test('support registration reuses one existing entry and targets only the real surface', () => {
            const { document, shell } = fakeBattleLogDocument();
            const target = document.createElement('section');
            shell.appendChild(target);
            assert.equal(registerLiveBattleSupportSurface({ key: 'deck', label: '山札', target, document }), true);
            assert.equal(registerLiveBattleSupportSurface({ key: 'deck', label: '山札', target, document }), true);

            const root = shell.querySelector('[data-battle-support-entry]');
            assert.ok(root);
            assert.equal(root.getAttribute('aria-label'), '対戦サポート');
            assert.deepEqual(supportItems(shell), ['deck']);
            assert.equal(root.children[0].textContent, '山札');
            root.children[0].click();
            assert.equal(target.scrollCalls, 1);
            assert.equal(target.focusCalls, 1);
          });

          test('actual history host registers the history support entry without duplication', () => {
            const { document, shell } = fakeBattleLogDocument();
            const bridge = createPartnerBattleEventLogPresentationBridge({ document });
            assert.equal(bridge.begin('M1'), true);
            assert.equal(bridge.begin('M1'), true);
            assert.ok(shell.querySelector('[data-partner-battle-event-log]'));
            assert.deepEqual(supportItems(shell), ['history']);
          });

          test('history and owner-safe deck share one support entry while graveyard stays absent until its live surface exists', () => {
            const { document, shell } = fakeBattleLogDocument();
            const bridge = createPartnerBattleEventLogPresentationBridge({ document });
            assert.equal(bridge.begin('M2'), true);
            assert.equal(renderLiveBattleRemainingDeckPresentation({
              ok: true,
              status: 'ready',
              total: 4,
              unknownCount: 4,
              revision: 1,
              knownCardCounts: []
            }, { document }), true);

            assert.ok(shell.querySelector('[data-battle-remaining-deck]'));
            assert.deepEqual(supportItems(shell), ['history', 'deck']);
            assert.equal(supportItems(shell).includes('graveyard'), false);
            assert.equal(shell.children.filter(child => child.getAttribute?.('data-battle-support-entry') !== null).length, 1);
          });
          EOF

          node --test tests/battle-support-entry.test.mjs
          node --test tests/battle-replay-live-adapter.test.mjs
          git diff --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          expected = ['browser/battle-replay-live-adapter.mjs', 'tests/battle-support-entry.test.mjs']
          assert sorted(changed) == sorted(expected), changed
          PY
      - name: Commit bounded product delta
        shell: bash
        run: |
          git config user.name 'gameroad-bot'
          git config user.email 'gameroad-bot@users.noreply.github.com'
          git add browser/battle-replay-live-adapter.mjs tests/battle-support-entry.test.mjs
          git commit -m 'Battle: 既存サポート面を一つの入口へ統合'
          git push origin HEAD:sol/battle-support-entry-r1-20260914
