name: GAMEROAD Codex Shared Preview Diagnostic R2

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762
  PREVIEW_ALIAS_URL: https://codex-shared.gameroad-browser-r5.pages.dev

jobs:
  diagnose:
    name: Diagnose shared-root runtime/path behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /gameroad-version.json /browser/GAMEROAD.html; do
            code="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' --output "$RUNNER_TEMP/route-body" --write-out '%{http_code}' "$PREVIEW_ALIAS_URL$path" || true)"
            bytes="$(wc -c < "$RUNNER_TEMP/route-body" 2>/dev/null || echo 0)"
            echo "ROUTE path=$path code=$code bytes=$bytes"
          done

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Trace root runtime before and after start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-diagnostic
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const baseUrl = process.env.PREVIEW_ALIAS_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 667, height: 375 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          const consoleMessages = [];
          const pageErrors = [];
          const responses = [];
          page.on('console', (m) => consoleMessages.push({ type: m.type(), text: m.text() }));
          page.on('pageerror', (e) => pageErrors.push(String(e?.message ?? e)));
          page.on('response', (r) => {
            if (r.status() >= 400) responses.push({ status: r.status(), url: r.url() });
          });

          const response = await page.goto(`${baseUrl}/`, { waitUntil: 'commit', timeout: 30_000 });
          await page.waitForFunction(() => Boolean(window.__GAMEROAD_TEST__) && Array.isArray(window.__CARD_DATA__), null, { timeout: 180_000 });
          await page.waitForTimeout(1000);

          const inspect = async (label) => ({
            label,
            ...(await page.evaluate(() => {
              const t = window.__GAMEROAD_TEST__;
              return {
                href: location.href,
                pathname: location.pathname,
                baseURI: document.baseURI,
                readyState: document.readyState,
                activeScreen: document.querySelector('.screen.active')?.dataset?.screen ?? null,
                homeVisible: Boolean(document.querySelector('section[data-screen="home"]')?.getClientRects().length),
                setupVisible: Boolean(document.querySelector('section[data-screen="setup"]')?.getClientRects().length),
                battleVisible: Boolean(document.querySelector('section[data-screen="battle"]')?.getClientRects().length),
                stateScreen: t?.state?.screen ?? null,
                matchMode: t?.state?.match?.mode ?? null,
                playerCount: t?.state?.match?.players?.length ?? 0,
                testKeys: t ? Object.keys(t).sort() : [],
                startSource: typeof t?.start === 'function' ? String(t.start).slice(0, 2000) : null,
                moduleScripts: [...document.querySelectorAll('script[type="module"]')].map((s) => s.src || '<inline>'),
                scripts: [...document.scripts].map((s) => s.src || '<inline>').slice(-30),
              };
            }))
          });

          const snapshots = [];
          snapshots.push(await inspect('boot'));

          const deckSetup = await page.evaluate(() => {
            const t = window.__GAMEROAD_TEST__;
            const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
            const standard = window.__CARD_DATA__
              .filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)))
              .map((card) => card.id);
            const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
            const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
            const main = [...nonRoyal.slice(0, 37), ...royalIds];
            const setValidation = t.deckSetDraft(main, []);
            const draftValidation = t.deckValidate(t.state.deckDraft, { forBattle: true });
            const committed = draftValidation.ok ? t.deckCommit() : false;
            const savedValidation = t.deckValidate(t.state.savedDeck, { forBattle: true });
            return { count: main.length, setValidation, draftValidation, committed, savedValidation };
          });
          snapshots.push(await inspect('deck-committed'));

          const startResult = await page.evaluate(() => {
            const t = window.__GAMEROAD_TEST__;
            let startReturn = null;
            let startError = null;
            try { startReturn = t.start('4p', 'road_shield'); } catch (e) { startError = String(e?.stack ?? e); }
            return { startReturn, startError };
          });
          snapshots.push(await inspect('immediately-after-start'));
          await page.waitForTimeout(2000);
          snapshots.push(await inspect('two-seconds-after-start'));

          const autoRoundResult = await page.evaluate(() => {
            const t = window.__GAMEROAD_TEST__;
            let autoRoundType = null;
            let autoRoundError = null;
            try {
              const p = t.autoRound();
              autoRoundType = Object.prototype.toString.call(p);
              window.__CODEX_DIAG_ROUND_PROMISE__ = p;
            } catch (e) { autoRoundError = String(e?.stack ?? e); }
            return { autoRoundType, autoRoundError };
          });
          await page.waitForTimeout(3000);
          snapshots.push(await inspect('three-seconds-after-autoRound'));

          await page.screenshot({ path: 'preview-diagnostic/root-after-start.png', animations: 'disabled', fullPage: false });
          const browserRouteStatus = await context.request.get(`${baseUrl}/browser/GAMEROAD.html`).then((r) => ({ status: r.status(), ok: r.ok(), url: r.url() })).catch((e) => ({ error: String(e) }));
          const receipt = {
            schema: 'gameroad.codex-shared-preview-diagnostic.v2',
            target_sha: process.env.TARGET_SHA,
            shared_url: baseUrl,
            navigationStatus: response?.status() ?? null,
            browserRouteStatus,
            deckSetup,
            startResult,
            autoRoundResult,
            snapshots,
            consoleMessages,
            pageErrors,
            httpErrors: responses,
          };
          fs.writeFileSync('preview-diagnostic/diagnostic.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log('DIAGNOSTIC_JSON_START');
          console.log(JSON.stringify(receipt));
          console.log('DIAGNOSTIC_JSON_END');
          await browser.close();
          NODE

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameroad-codex-shared-preview-diagnostic
          path: preview-diagnostic/
          if-no-files-found: warn
          retention-days: 7
