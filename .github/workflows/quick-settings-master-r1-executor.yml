name: Quick Settings Master Volume R1

on:
  push:
    branches:
      - sol/quick-settings-master-r1-20260906

permissions:
  contents: write

env:
  BASE_SHA: 77777f15cc263a33ff9bb8ec1de7e896c979223b
  ACQUIRE_KEY: UI-QS-MASTER-R1-20260906T0548-SOL-N6P3K8
  MANIFEST: data/preaction-authorizations/UI-QS-MASTER-R1-20260906T0548-SOL-N6P3K8.json
  WORKFLOW_FILE: .github/workflows/quick-settings-master-r1-executor.yml

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/quick-settings-master-r1-20260906
          fetch-depth: 0

      - name: Verify PRE_ACTION fence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 -c "import json,os,pathlib; m=json.loads(pathlib.Path(os.environ['MANIFEST']).read_text()); assert m['schemaVersion']=='gameroad-preaction-v3'; assert m['recordId']==os.environ['ACQUIRE_KEY']; assert m['taskId']=='UI-STATE-FEEDBACK-RUNTIME-001'; assert m['workUnitKey']=='QUICK_SETTINGS_MASTER_VOLUME_R1'; assert m['authorizationBaseSha']==os.environ['BASE_SHA']; assert m['leaseAuthority']=='CURRENT_ACTIVE_LEASES'; assert m['leaseState']=='ACTIVE'; assert str(m['proceedToken']).startswith('PROCEED|'+os.environ['ACQUIRE_KEY']+'|')"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          mapfile -t expected < <(printf '%s\n' "$MANIFEST" "$WORKFLOW_FILE" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"

      - name: Patch derived master-volume proxy
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/qs-master-patch.py
          python3 /tmp/qs-master-patch.py

      - name: Run focused Quick Settings regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/home-boot-presentation.test.mjs

      - name: Commit only product and test delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$MANIFEST" "$WORKFLOW_FILE"
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          mapfile -t expected < <(printf '%s\n' browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs "$MANIFEST" "$WORKFLOW_FILE" | sort)
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"
          test "${changed[2]}" = "${expected[2]}"
          test "${changed[3]}" = "${expected[3]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs "$MANIFEST" "$WORKFLOW_FILE"
          git commit -m '[qs-master-result] add derived Quick Settings master volume'
          git push origin HEAD:sol/quick-settings-master-r1-20260906
