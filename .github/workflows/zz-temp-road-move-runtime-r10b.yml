name: TEMP Road Move Bidirectional Live R10B
on:
  push:
    branches: [sol/road-move-bidirectional-live-r10b-20260908]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-bidirectional-live-r10b-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build R10B candidate from existing Road donor
        shell: bash
        run: |
          set -euo pipefail
          BASE='2b1b12d842ad07cc193a58e6e721b6b8908dd488'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-parse "$BASE:browser/GAMEROAD.html")" = '35f9203e2be95ba07b44c875e26bfe2047a3cee5'
          git fetch origin sol/road-move-bidirectional-live-r5-20260906 sol/road-move-bidirectional-live-r6-20260906
          git show origin/sol/road-move-bidirectional-live-r5-20260906:tools/zz-temp-road-move-runtime-r5.py > /tmp/r10b-base.py
          git show origin/sol/road-move-bidirectional-live-r6-20260906:tools/zz-temp-road-move-runtime-r6.py > /tmp/r10b-post.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/r10b-base.py'); s=p.read_text()
          s=s.replace("BASE = '0be3a466b55cbd0af23244bc9fc90b2f5f6640fd'", "BASE = '2b1b12d842ad07cc193a58e6e721b6b8908dd488'")
          s=re.sub(r"ALLOWED_PRE = \{.*?\}\n", "ALLOWED_PRE = {\n    'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R10B-20260908T0136-SOL-Q7M4N8.json',\n    '.github/workflows/zz-temp-road-move-runtime-r10b.yml',\n}\n", s, count=1, flags=re.S)
          s=s.replace('road-move-bidirectional-live-r5.spec.mjs','road-move-bidirectional-live-r10b.spec.mjs').replace('ROAD-MOVE-BIDIRECTIONAL-R5','ROAD-MOVE-BIDIRECTIONAL-R10B').replace('gameroad-road-move-bidirectional-r5','gameroad-road-move-bidirectional-r10b').replace('R5 source contract','R10B source contract')
          p.write_text(s)
          p=Path('/tmp/r10b-post.py'); s=p.read_text().replace('road-move-bidirectional-live-r6.spec.mjs','road-move-bidirectional-live-r10b.spec.mjs'); p.write_text(s)
          PY
          python3 /tmp/r10b-base.py
          python3 /tmp/r10b-post.py
          git diff --check
          node --test tests/road-move-compatibility-core.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Write one-viewport diagnostic config
        run: |
          cat > .road-r10b-playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({testDir:'./tests',testMatch:'road-move-bidirectional-live-r10b.spec.mjs',timeout:45000,expect:{timeout:8000},workers:1,retries:0,reporter:[['line']],use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:844,height:390},trace:'off',screenshot:'off',video:'off'},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}});
          EOF
      - name: Source contract
        run: npx playwright test --config=.road-r10b-playwright.config.mjs --grep 'R10B source contract'
      - name: Move-first
        run: npx playwright test --config=.road-r10b-playwright.config.mjs --grep 'move-first exposes'
      - name: Card-first and undo
        run: npx playwright test --config=.road-r10b-playwright.config.mjs --grep 'card-first still moves'
      - name: Candidate switch stays Road-side
        run: npx playwright test --config=.road-r10b-playwright.config.mjs --grep 'compatible Road card taps'
      - name: Elastic Focus
        run: npx playwright test --config=.road-r10b-playwright.config.mjs --grep 'Elastic Focus yields'
