name: FULLREG R17 CardPRES Test Patch Transport

on:
  push:
    branches:
      - work/BROWSER-FULLREG-R17-CARDPRES-20260818
    paths:
      - .github/workflows/fullreg-r17-cardpres-patch.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reset target to acquired main and apply bounded FULLREG CardPRES observation patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout 7f0a897bdbbe096ae85b2c125697418a8ca3a557 -- tests/browser-full-interaction.spec.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-full-interaction.spec.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  let abilityConfirms = 0;\n\n  while (Date.now() < deadline) {\n    if (await result.isVisible().catch(() => false)) break;\n\n    if (await satisfyVisibleAbilityChoice(page)) {",
                  "  let abilityConfirms = 0;\n  let cardPresentationFallbacks = 0;\n  let lastCardPresentationEvent = null;\n\n  while (Date.now() < deadline) {\n    if (await result.isVisible().catch(() => false)) break;\n\n    const cardPresentation = battle.locator('#battleResolution[data-card-presentation=\"fallback\"]:visible');\n    if ((await cardPresentation.count()) > 0) {\n      const eventId = await cardPresentation.first().getAttribute('data-card-presentation-event');\n      if (eventId && eventId !== lastCardPresentationEvent) {\n        lastCardPresentationEvent = eventId;\n        cardPresentationFallbacks += 1;\n        await attachStateScreenshot(page, testInfo, `${evidencePrefix}-card-presentation-fallback-${cardPresentationFallbacks}`);\n      }\n    }\n\n    if (await satisfyVisibleAbilityChoice(page)) {"
              ),
              (
                  "  expect(presentationAdvances, 'at least one visible Battle result advance was used').toBeGreaterThan(0);\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';",
                  "  expect(presentationAdvances, 'at least one visible Battle result advance was used').toBeGreaterThan(0);\n  expect(cardPresentationFallbacks, 'accepted/public Battle resolution mounts the current CardPRES fallback on the visible production resolution surface').toBeGreaterThan(0);\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';"
              ),
              (
                  "    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, result=${roundsText}`,",
                  "    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, cardPresentationFallbacks=${cardPresentationFallbacks}, result=${roundsText}` ,"
              ),
              (
                  "  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, roundsText };",
                  "  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, cardPresentationFallbacks, roundsText };"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify bounded test delta and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 7f0a897bdbbe096ae85b2c125697418a8ca3a557 -- tests/browser-full-interaction.spec.mjs)" = "tests/browser-full-interaction.spec.mjs"
          grep -F "cardPresentationFallbacks" tests/browser-full-interaction.spec.mjs >/dev/null
          grep -F "data-card-presentation=\"fallback\"" tests/browser-full-interaction.spec.mjs >/dev/null
          node --check tests/browser-full-interaction.spec.mjs

      - name: Self-remove transport and commit exact final tree delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fullreg-r17-cardpres-patch.yml
          git config user.name "gameroad-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          changed_vs_main="$(git diff --cached --name-only 7f0a897bdbbe096ae85b2c125697418a8ca3a557 | sort)"
          test "$changed_vs_main" = "tests/browser-full-interaction.spec.mjs"
          git commit -m "FULLREG R17: observe CardPRES fallback in visible result path"
          git push origin HEAD:${GITHUB_REF_NAME}
