name: zz-temp-battle-central-world-layout-r2

on:
  push:
    branches:
      - sol/battle-central-world-layout-r2-20260914

permissions:
  contents: write

jobs:
  bounded-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact central-world presentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/new-base-flanora-board-surface-runtime.mjs')
          test_path = Path('tests/new-base-flanora-board-surface-runtime.test.mjs')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              '[data-new-base-flanora-board-surface="1"]{position:relative;display:grid;grid-template-rows:minmax(0,1fr) minmax(72px,28%);gap:clamp(5px,1vh,10px);width:100%;height:100%;min-width:0;min-height:0;box-sizing:border-box;padding:clamp(5px,1vw,10px);isolation:isolate;overflow:hidden}',
              '[data-new-base-flanora-board-surface="1"]{position:relative;display:grid;grid-template-rows:minmax(0,1fr) minmax(64px,22%);gap:clamp(4px,.8vh,8px);width:100%;height:100%;min-width:0;min-height:0;box-sizing:border-box;padding:clamp(4px,.7vw,8px);isolation:isolate;overflow:hidden}',
              'root-density',
          )
          runtime = replace_once(
              runtime,
              '[data-new-base-flanora-board-surface="1"] .grFlanoraUpper{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(12,minmax(0,1fr));gap:clamp(2px,.35vh,4px);min-width:0;min-height:0;align-items:stretch}',
              '[data-new-base-flanora-board-surface="1"] .grFlanoraUpper{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));column-gap:clamp(10px,1.4vw,18px);row-gap:clamp(3px,.5vh,6px);min-width:0;min-height:0;align-items:stretch}',
              'upper-2x2-groups',
          )
          runtime = replace_once(
              runtime,
              '@media(max-height:420px){[data-new-base-flanora-board-surface="1"]{grid-template-rows:minmax(0,1fr) minmax(58px,26%);gap:3px;padding:4px}[data-new-base-flanora-board-surface="1"] .grFlanoraUpper{gap:1px}[data-new-base-flanora-board-surface="1"] .grFlanoraLane{grid-template-columns:26px minmax(0,1fr) 30px;gap:3px}[data-new-base-flanora-board-surface="1"] .grFlanoraGoal{width:20px;height:20px;font-size:6px}[data-new-base-flanora-board-surface="1"] .grFlanoraShield{width:28px;min-height:16px;font-size:7px}[data-new-base-flanora-board-surface="1"] .grFlanoraClearing{gap:2px}}',
              '@media(max-height:420px){[data-new-base-flanora-board-surface="1"]{grid-template-rows:minmax(0,1fr) minmax(52px,20%);gap:3px;padding:3px}[data-new-base-flanora-board-surface="1"] .grFlanoraUpper{column-gap:8px;row-gap:2px}[data-new-base-flanora-board-surface="1"] .grFlanoraLane{grid-template-columns:24px minmax(0,1fr) 28px;gap:2px}[data-new-base-flanora-board-surface="1"] .grFlanoraGoal{width:19px;height:19px;font-size:6px}[data-new-base-flanora-board-surface="1"] .grFlanoraShield{width:27px;min-height:15px;font-size:7px}[data-new-base-flanora-board-surface="1"] .grFlanoraClearing{gap:2px;padding:1px}}',
              'short-landscape-density',
          )
          runtime = replace_once(
              runtime,
              '@media(max-width:540px) and (orientation:portrait){[data-new-base-flanora-board-surface="1"]{grid-template-rows:minmax(0,1fr) minmax(110px,30%)}[data-new-base-flanora-board-surface="1"] .grFlanoraLane{grid-template-columns:28px minmax(0,1fr) 34px;gap:3px}[data-new-base-flanora-board-surface="1"] .grFlanoraGoal{width:24px;height:24px;font-size:7px}[data-new-base-flanora-board-surface="1"] .grFlanoraShield{width:32px}}',
              '@media(max-width:540px) and (orientation:portrait){[data-new-base-flanora-board-surface="1"]{grid-template-rows:minmax(0,1fr) minmax(110px,30%)}[data-new-base-flanora-board-surface="1"] .grFlanoraUpper{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(12,minmax(0,1fr));column-gap:0;row-gap:clamp(2px,.35vh,4px)}[data-new-base-flanora-board-surface="1"] .grFlanoraLane{grid-column:1!important;grid-row:auto!important;grid-template-columns:28px minmax(0,1fr) 34px;gap:3px}[data-new-base-flanora-board-surface="1"] .grFlanoraGoal{width:24px;height:24px;font-size:7px}[data-new-base-flanora-board-surface="1"] .grFlanoraShield{width:32px}}',
              'portrait-fallback',
          )
          runtime = replace_once(
              runtime,
              "  setAttr(root, 'data-progression-direction', 'right-to-left');\n  setAttr(root, 'aria-label', 'GOAL左端、ROAD開始側右端。右から左のGOALへ進む12レーン盤面');",
              "  setAttr(root, 'data-progression-direction', 'right-to-left');\n  setAttr(root, 'data-central-world-layout', 'participant-groups-2x2');\n  setAttr(root, 'aria-label', '4人×各3レーン。GOAL左端、ROAD開始側右端。右から左のGOALへ進む12レーン盤面');",
              'root-layout-contract',
          )
          runtime = replace_once(
              runtime,
              "    setAttr(laneNode, 'data-lane-label', lane.laneLabel);\n    laneNode.style.gridRow = String(lane.relativeColumn + 1);",
              "    setAttr(laneNode, 'data-lane-label', lane.laneLabel);\n    const participantSlot = model.participantIds.indexOf(lane.participantId);\n    if (participantSlot < 0) throw new TypeError('FLANORA_LANE_PARTICIPANT_REQUIRED');\n    const participantGroupColumn = (participantSlot % 2) + 1;\n    const participantGroupRow = Math.floor(participantSlot / 2) + 1;\n    setAttr(laneNode, 'data-participant-slot', participantSlot);\n    setAttr(laneNode, 'data-participant-group-column', participantGroupColumn);\n    setAttr(laneNode, 'data-participant-group-row', participantGroupRow);\n    laneNode.style.gridColumn = String(participantGroupColumn);\n    laneNode.style.gridRow = String(((participantGroupRow - 1) * 3) + lane.laneIndex + 1);",
              'lane-participant-group-placement',
          )
          runtime_path.write_text(runtime)

          test = test_path.read_text()
          test = replace_once(
              test,
              "  assert.equal(runtime.root.dataset.progressionDirection, 'right-to-left');\n  assert.match(runtime.root.getAttribute('aria-label'), /GOAL左端.*ROAD開始側右端.*右から左/);",
              "  assert.equal(runtime.root.dataset.progressionDirection, 'right-to-left');\n  assert.equal(runtime.root.dataset.centralWorldLayout, 'participant-groups-2x2');\n  assert.match(runtime.root.getAttribute('aria-label'), /4人×各3レーン.*GOAL左端.*ROAD開始側右端.*右から左/);",
              'test-root-layout-contract',
          )
          test = replace_once(
              test,
              "  assert.equal(runtime.upper.children.length, 12);\n  assert.equal(runtime.upper.children[0].style.gridRow, '1');\n  assert.equal(runtime.upper.children[11].style.gridRow, '12');\n  assert.deepEqual(runtime.upper.children[0].children.map((node) => node.className), ['grFlanoraGoal','grFlanoraRoad','grFlanoraShield']);\n  const styleText = documentLike.head.children[0].textContent;\n  assert.match(styleText, /\\.grFlanoraUpper\\{[^}]*grid-template-rows:repeat\\(12,minmax\\(0,1fr\\)\\)/);",
              "  assert.equal(runtime.upper.children.length, 12);\n  assert.deepEqual(\n    runtime.upper.children.map((node) => [node.dataset.participantSlot, node.style.gridColumn, node.style.gridRow]),\n    [\n      ['0','1','1'], ['0','1','2'], ['0','1','3'],\n      ['1','2','1'], ['1','2','2'], ['1','2','3'],\n      ['2','1','4'], ['2','1','5'], ['2','1','6'],\n      ['3','2','4'], ['3','2','5'], ['3','2','6'],\n    ],\n  );\n  assert.deepEqual(runtime.upper.children[0].children.map((node) => node.className), ['grFlanoraGoal','grFlanoraRoad','grFlanoraShield']);\n  const styleText = documentLike.head.children[0].textContent;\n  assert.match(styleText, /grid-template-rows:minmax\\(0,1fr\\) minmax\\(64px,22%\\)/);\n  assert.match(styleText, /\\.grFlanoraUpper\\{[^}]*grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\);grid-template-rows:repeat\\(6,minmax\\(0,1fr\\)\\)/);\n  assert.match(styleText, /@media\\(max-height:420px\\).*minmax\\(52px,20%\\)/);\n  assert.match(styleText, /@media\\(max-width:540px\\) and \\(orientation:portrait\\).*\\.grFlanoraUpper\\{grid-template-columns:minmax\\(0,1fr\\);grid-template-rows:repeat\\(12,minmax\\(0,1fr\\)\\)/);\n  assert.match(styleText, /@media\\(max-width:540px\\) and \\(orientation:portrait\\).*\\.grFlanoraLane\\{grid-column:1!important;grid-row:auto!important/);",
              'test-density-and-grouping',
          )
          test_path.write_text(test)
          PY
      - name: Focused central-world test
        run: node --test tests/new-base-flanora-board-surface-runtime.test.mjs
      - name: Diff guard and finalize bounded product tree
        shell: bash
        run: |
          git diff --check
          git status --short
          rm .github/workflows/zz-temp-battle-central-world-layout-r2.yml
          rm data/preaction-authorizations/BATTLE-CENTRAL-WORLD-LAYOUT-R2-20260914T0129-SOL-TA16.json
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(battle): expand and organize central world lanes"
          mapfile -t final_paths < <(git diff --name-only origin/main...HEAD | sort)
          printf 'FINAL_PATH=%s\n' "${final_paths[@]}"
          expected=("browser/new-base-flanora-board-surface-runtime.mjs" "tests/new-base-flanora-board-surface-runtime.test.mjs")
          if [ "${#final_paths[@]}" -ne 2 ] || [ "${final_paths[0]}" != "${expected[0]}" ] || [ "${final_paths[1]}" != "${expected[1]}" ]; then
            echo "Unexpected final durable diff" >&2
            exit 1
          fi
          git push origin HEAD:sol/battle-central-world-layout-r2-20260914
