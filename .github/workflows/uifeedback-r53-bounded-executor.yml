name: UIFEEDBACK R53 Bounded Executor

on:
  push:
    branches:
      - work/uifeedback-r53-readyplan-material-visible-20260825-1644

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/uifeedback-r53-readyplan-material-visible-20260825-1644

      - name: Verify authorized base and patch exact consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "562b6cf535aa74ec4d791483ed2c8abfa0ff7905"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          adapter = Path('browser/ui-state-feedback-ready-plan-adapter.mjs')
          source = adapter.read_text()
          old_import = """import {\n  createUIFeedbackState,\n  applyUIFeedbackEvent,\n  consumeUIIntent,\n  projectUIFeedback,\n} from './ui-state-feedback-core.mjs';\n"""
          new_import = """import {\n  createUIFeedbackState,\n  applyUIFeedbackEvent,\n  consumeUIIntent,\n  projectUIFeedback,\n  MATERIAL_FEEDBACK_MATERIALS,\n  MATERIAL_FEEDBACK_PHASES,\n  projectMaterialFeedback,\n  materialFeedbackCssVars,\n} from './ui-state-feedback-core.mjs';\n"""
          assert source.count(old_import) == 1
          source = source.replace(old_import, new_import)

          anchor = "const INTERACTION_EVENTS = new Set(['POINTER_DOWN', 'POINTER_MOVE', 'POINTER_UP', 'TICK', 'SECONDARY', 'KEY_ACTIVATE']);\n"
          addition = r'''
const READY_PLAN_MATERIAL = MATERIAL_FEEDBACK_MATERIALS.GUMMY;
const MATERIAL_CANCEL_REASONS = new Set([
  'pointer_left_target',
  'pointer_release_outside',
  'pointer_cancelled',
  'pointer_capture_lost',
  'control_blur',
]);

function clamp01(value) {
  return Math.min(1, Math.max(0, Number(value)));
}

function materialPhaseForFeedback(feedback) {
  if (feedback.feedback === 'pressed') return MATERIAL_FEEDBACK_PHASES.PRESSED;
  if (feedback.feedback === 'detail') return MATERIAL_FEEDBACK_PHASES.HOLD;
  if (feedback.feedback === 'pending') return MATERIAL_FEEDBACK_PHASES.COMMITTED;
  if (feedback.feedback === 'confirmed') return MATERIAL_FEEDBACK_PHASES.SETTLED;
  if (feedback.feedback === 'failed') return MATERIAL_FEEDBACK_PHASES.CANCELLED;
  if (feedback.feedback === 'disabled') return MATERIAL_FEEDBACK_PHASES.DISABLED;
  if (feedback.feedback === 'focus') return MATERIAL_FEEDBACK_PHASES.FOCUSED;
  if (MATERIAL_CANCEL_REASONS.has(feedback.reason)) return MATERIAL_FEEDBACK_PHASES.CANCELLED;
  return MATERIAL_FEEDBACK_PHASES.NORMAL;
}

function materialContactForEvent(target, event) {
  if (typeof target.getBoundingClientRect !== 'function') return Object.freeze({x:.5,y:.5});
  const rect = target.getBoundingClientRect();
  const width = Number.isFinite(rect?.width) && rect.width > 0 ? rect.width : Number(rect?.right) - Number(rect?.left);
  const height = Number.isFinite(rect?.height) && rect.height > 0 ? rect.height : Number(rect?.bottom) - Number(rect?.top);
  if (!(width > 0) || !(height > 0)) return Object.freeze({x:.5,y:.5});
  return Object.freeze({
    x: clamp01((pointerCoordinate(event, 'clientX') - Number(rect.left)) / width),
    y: clamp01((pointerCoordinate(event, 'clientY') - Number(rect.top)) / height),
  });
}

function createReadyPlanMaterialPainter(target) {
  const style = target?.style;
  const dataset = target?.dataset;
  if (!style || typeof style.setProperty !== 'function' || !dataset) {
    return Object.freeze({apply:()=>null,destroy:()=>false});
  }

  const paintKeys = ['filter','boxShadow','outlineColor','outlineStyle','outlineWidth','transitionProperty','transitionDuration','transitionTimingFunction'];
  const baselinePaint = Object.fromEntries(paintKeys.map((key)=>[key, style[key] ?? '']));
  const baselineDataset = {
    phase: dataset.gmrMaterialPhase,
    material: dataset.gmrMaterial,
  };
  const baselineVars = new Map();
  let revision = 0;
  let settleHandle = null;

  const restorePaint = () => {
    for (const key of paintKeys) style[key] = baselinePaint[key];
  };
  const restoreDataset = () => {
    if (baselineDataset.phase === undefined) delete dataset.gmrMaterialPhase;
    else dataset.gmrMaterialPhase = baselineDataset.phase;
    if (baselineDataset.material === undefined) delete dataset.gmrMaterial;
    else dataset.gmrMaterial = baselineDataset.material;
  };
  const restoreVars = () => {
    for (const [name, value] of baselineVars) {
      if (value) style.setProperty(name, value);
      else style.removeProperty(name);
    }
  };
  const cancelSettle = () => {
    if (settleHandle === null) return;
    clearTimeout(settleHandle);
    settleHandle = null;
  };
  const applyProjection = (projection) => {
    const vars = materialFeedbackCssVars(projection);
    for (const [name, value] of Object.entries(vars)) {
      if (!baselineVars.has(name)) baselineVars.set(name, style.getPropertyValue(name));
      style.setProperty(name, value);
    }
    dataset.gmrMaterialPhase = projection.phase;
    dataset.gmrMaterial = projection.material;

    if (projection.phase === MATERIAL_FEEDBACK_PHASES.NORMAL || projection.phase === MATERIAL_FEEDBACK_PHASES.DISABLED) {
      restorePaint();
      return;
    }

    const compression = projection.surface.shadowCompression;
    const rim = projection.surface.rimTension;
    const refraction = projection.surface.refraction;
    const brightness = Math.max(.82, 1 - compression * .12 + refraction * .025);
    const saturation = Math.max(.72, 1 - compression * .18 + refraction * .04);
    const contrast = 1 + rim * .12;
    const inset = Math.max(1, Math.round(1 + compression * 5));
    const rimAlpha = Math.min(.72, .08 + rim * .5 + refraction * .12);
    style.filter = `brightness(${brightness.toFixed(3)}) saturate(${saturation.toFixed(3)}) contrast(${contrast.toFixed(3)})`;
    style.boxShadow = `inset 0 ${inset}px ${Math.max(2, inset + 2)}px rgba(0,0,0,${Math.min(.46,.1 + compression * .34).toFixed(3)}), 0 0 ${Math.max(2, Math.round(2 + rim * 8))}px rgba(255,255,255,${rimAlpha.toFixed(3)})`;
    style.outlineStyle = 'solid';
    style.outlineWidth = '1px';
    style.outlineColor = `rgba(255,255,255,${rimAlpha.toFixed(3)})`;
    style.transitionProperty = 'filter, box-shadow, outline-color';
    style.transitionDuration = `${projection.motion.durationMs}ms`;
    style.transitionTimingFunction = projection.motion.easing;
  };

  const apply = (feedback, contact={x:.5,y:.5}) => {
    cancelSettle();
    const ownRevision = ++revision;
    const phase = materialPhaseForFeedback(feedback);
    const reducedMotion = feedback.motion === 'none';
    const lowPerf = feedback.motion === 'reduced';
    const projection = projectMaterialFeedback({
      material: READY_PLAN_MATERIAL,
      phase,
      localX: contact.x,
      localY: contact.y,
      reducedMotion,
      lowPerf,
    });
    applyProjection(projection);

    if (phase === MATERIAL_FEEDBACK_PHASES.CANCELLED || phase === MATERIAL_FEEDBACK_PHASES.SETTLED) {
      const settleAfterMs = reducedMotion ? 90 : Math.max(90, projection.motion.durationMs);
      settleHandle = setTimeout(() => {
        if (revision !== ownRevision) return;
        const normal = projectMaterialFeedback({
          material: READY_PLAN_MATERIAL,
          phase: MATERIAL_FEEDBACK_PHASES.NORMAL,
          localX: contact.x,
          localY: contact.y,
          reducedMotion,
          lowPerf,
        });
        applyProjection(normal);
        settleHandle = null;
      }, settleAfterMs);
      settleHandle?.unref?.();
    }
    return projection;
  };

  const destroy = () => {
    cancelSettle();
    revision += 1;
    restorePaint();
    restoreVars();
    restoreDataset();
    return true;
  };

  return Object.freeze({apply,destroy});
}
'''
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + addition)

          old_publish = """  const publish = (out) => {\n    render(out.feedback, out);\n    return out;\n  };\n"""
          new_publish = """  const materialPainter = createReadyPlanMaterialPainter(target);\n  let materialContact = Object.freeze({x:.5,y:.5});\n  const publish = (out) => {\n    render(out.feedback, out);\n    materialPainter.apply(out.feedback, materialContact);\n    return out;\n  };\n"""
          assert source.count(old_publish) == 1
          source = source.replace(old_publish, new_publish)

          old_down = """    const pointerId = pointerIdOf(event);\n    capturePointerIfSupported(target, pointerId);\n    activePointerId = pointerId;\n    dispatch({\n"""
          new_down = """    const pointerId = pointerIdOf(event);\n    capturePointerIfSupported(target, pointerId);\n    activePointerId = pointerId;\n    materialContact = materialContactForEvent(target, event);\n    dispatch({\n"""
          assert source.count(old_down) == 1
          source = source.replace(old_down, new_down)

          old_move = """    if (destroyed || !matchesActivePointer(event)) return;\n    const out = dispatch({\n      type: 'POINTER_MOVE',\n"""
          new_move = """    if (destroyed || !matchesActivePointer(event)) return;\n    materialContact = materialContactForEvent(target, event);\n    const out = dispatch({\n      type: 'POINTER_MOVE',\n"""
          assert source.count(old_move) == 1
          source = source.replace(old_move, new_move)

          old_up = """    const pointerId = activePointerId;\n    activePointerId = null;\n    stopTick();\n    try {\n      dispatch({type: 'POINTER_UP', operationTokenFactory});\n"""
          new_up = """    const pointerId = activePointerId;\n    materialContact = materialContactForEvent(target, event);\n    activePointerId = null;\n    stopTick();\n    try {\n      dispatch({type: 'POINTER_UP', operationTokenFactory});\n"""
          assert source.count(old_up) == 1
          source = source.replace(old_up, new_up)

          old_initial = """  for (const [type, handler] of listeners) target.addEventListener(type, handler);\n  render(adapter.getFeedback(), null);\n"""
          new_initial = """  for (const [type, handler] of listeners) target.addEventListener(type, handler);\n  const initialFeedback = adapter.getFeedback();\n  render(initialFeedback, null);\n  materialPainter.apply(initialFeedback, materialContact);\n"""
          assert source.count(old_initial) == 1
          source = source.replace(old_initial, new_initial)

          old_destroy = """    releasePointerCaptureIfHeld(target, pointerId);\n    for (const [type, handler] of listeners) target.removeEventListener(type, handler);\n    return true;\n"""
          new_destroy = """    releasePointerCaptureIfHeld(target, pointerId);\n    for (const [type, handler] of listeners) target.removeEventListener(type, handler);\n    materialPainter.destroy();\n    return true;\n"""
          assert source.count(old_destroy) == 1
          source = source.replace(old_destroy, new_destroy)
          adapter.write_text(source)

          test_path = Path('tests/ui-state-feedback-ready-plan-adapter.test.mjs')
          tests = test_path.read_text()
          fake_anchor = "class FakeTarget {\n  constructor(){\n    this.listeners=new Map();\n    this.capturedPointers=new Set();\n    this.rect={left:-10000,top:-10000,right:10000,bottom:10000};\n  }\n"
          fake_replacement = """class FakeStyle {\n  constructor(){ this.custom=new Map(); }\n  setProperty(name,value){ this.custom.set(name,String(value)); }\n  getPropertyValue(name){ return this.custom.get(name) || ''; }\n  removeProperty(name){ const old=this.getPropertyValue(name); this.custom.delete(name); return old; }\n}\n\nclass FakeTarget {\n  constructor(){\n    this.listeners=new Map();\n    this.capturedPointers=new Set();\n    this.rect={left:-10000,top:-10000,right:10000,bottom:10000};\n    this.dataset={};\n    this.style=new FakeStyle();\n  }\n"""
          assert tests.count(fake_anchor) == 1
          tests = tests.replace(fake_anchor, fake_replacement)

          old_make = """function makeBinding({holdMs=500}={}){\n  const target=new FakeTarget();\n  const calls=[];\n  const renders=[];\n  const timers=[];\n  let nowMs=0;\n  let tokenCounter=0;\n  const adapter=createReadyPlanFeedbackAdapter({\n    config:{...cfg,holdMs},\n    commit:(command)=>{calls.push(command); return `sent:${command.operationToken}`;},\n  });\n"""
          new_make = """function makeBinding({holdMs=500,reducedMotion=false,lowPerf=false}={}){\n  const target=new FakeTarget();\n  const calls=[];\n  const renders=[];\n  const timers=[];\n  let nowMs=0;\n  let tokenCounter=0;\n  const adapter=createReadyPlanFeedbackAdapter({\n    config:{...cfg,holdMs},\n    commit:(command)=>{calls.push(command); return `sent:${command.operationToken}`;},\n    reducedMotion,\n    lowPerf,\n  });\n"""
          assert tests.count(old_make) == 1
          tests = tests.replace(old_make, new_make)

          tests += r'''

test('binding projects visible paint-only material feedback without changing target geometry',()=>{
  const h=makeBinding();
  h.target.rect={left:0,top:0,right:100,bottom:50};
  const geometryBefore={...h.target.rect};
  h.target.emit('pointerdown',{pointerId:21,button:0,clientX:75,clientY:25});
  assert.equal(h.target.dataset.gmrMaterialPhase,'pressed');
  assert.equal(h.target.dataset.gmrMaterial,'gummy');
  assert.match(h.target.style.filter,/brightness\(/);
  assert.match(h.target.style.boxShadow,/inset/);
  assert.equal(h.target.style.transform ?? '','');
  assert.equal(h.target.style.getPropertyValue('--mf-contact-x'),'75%');
  assert.deepEqual(h.target.rect,geometryBefore);
  assert.equal(h.calls.length,0);
});

test('material phase follows hold cancel commit and ack while semantic commit remains exactly once',()=>{
  const h=makeBinding({holdMs:100});
  h.target.rect={left:0,top:0,right:100,bottom:50};
  h.target.emit('pointerdown',{pointerId:22,button:0,clientX:25,clientY:20});
  h.setNow(100);
  h.timers[0].fn();
  assert.equal(h.target.dataset.gmrMaterialPhase,'hold');
  h.target.emit('pointerup',{pointerId:22,button:0,clientX:25,clientY:20});
  assert.equal(h.calls.length,0,'long hold must still suppress short commit');

  h.target.emit('pointerdown',{pointerId:23,button:0,clientX:30,clientY:20});
  h.target.emit('pointercancel',{pointerId:23,clientX:30,clientY:20});
  assert.equal(h.target.dataset.gmrMaterialPhase,'cancelled');
  assert.equal(h.calls.length,0);

  h.target.emit('pointerdown',{pointerId:24,button:0,clientX:50,clientY:20});
  h.target.emit('pointerup',{pointerId:24,button:0,clientX:50,clientY:20});
  assert.equal(h.target.dataset.gmrMaterialPhase,'committed');
  assert.equal(h.calls.length,1);
  h.binding.acknowledge({operationToken:'bind-1',accepted:true,reason:'server_ack'});
  assert.equal(h.target.dataset.gmrMaterialPhase,'settled');
  assert.equal(h.calls.length,1);
});

test('reduced motion removes transition motion but keeps a visible pressed material cue',()=>{
  const h=makeBinding({reducedMotion:true});
  h.target.rect={left:0,top:0,right:100,bottom:50};
  h.target.emit('pointerdown',{pointerId:25,button:0,clientX:50,clientY:25});
  assert.equal(h.target.dataset.gmrMaterialPhase,'pressed');
  assert.equal(h.target.style.transitionDuration,'0ms');
  assert.match(h.target.style.filter,/brightness\(/);
  assert.notEqual(h.target.style.boxShadow,'');
});

test('low performance material projection drops refraction while preserving pressed paint cue',()=>{
  const h=makeBinding({lowPerf:true});
  h.target.rect={left:0,top:0,right:100,bottom:50};
  h.target.emit('pointerdown',{pointerId:26,button:0,clientX:50,clientY:25});
  assert.equal(h.target.dataset.gmrMaterialPhase,'pressed');
  assert.equal(h.target.style.getPropertyValue('--mf-refraction'),'0');
  assert.match(h.target.style.filter,/brightness\(/);
});

test('destroy restores pre-existing inline paint and removes material ownership markers',()=>{
  const target=new FakeTarget();
  target.style.filter='contrast(1.1)';
  target.style.boxShadow='0 1px 2px black';
  const calls=[];
  const adapter=createReadyPlanFeedbackAdapter({config:cfg,commit:(c)=>calls.push(c)});
  const binding=bindReadyPlanFeedbackControl({target,adapter,operationTokenFactory:()=> 'restore-1'});
  target.emit('pointerdown',{pointerId:27,button:0,clientX:0,clientY:0});
  assert.notEqual(target.style.filter,'contrast(1.1)');
  binding.destroy();
  assert.equal(target.style.filter,'contrast(1.1)');
  assert.equal(target.style.boxShadow,'0 1px 2px black');
  assert.equal(target.dataset.gmrMaterialPhase,undefined);
  assert.equal(target.dataset.gmrMaterial,undefined);
});
'''
          test_path.write_text(tests)

          new_blob = subprocess.check_output(['git','hash-object',str(adapter)], text=True).strip()
          build_test = Path('deploy/cloudflare/tests/build.test.mjs')
          build = build_test.read_text()
          old = "currentBlob: '39ea233efb0d8a8f56fa2fd4b6de7e7de3fa8f15'"
          new = f"currentBlob: '{new_blob}'"
          assert build.count(old) == 1
          build_test.write_text(build.replace(old,new))
          print(f'R53_ADAPTER_BLOB={new_blob}')
          PY

      - name: Test semantic and public package closure
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ui-state-feedback-ready-plan-adapter.test.mjs
          node --test tests/ui-state-feedback-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check

      - name: Remove temporary authorization and executor then push exact durable diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/preaction-authorizations/UIFEEDBACK-R53-READYPLAN-MATERIAL-VISIBLE-20260825T1644-SOL.json
          rm -f .github/workflows/uifeedback-r53-bounded-executor.yml
          git add browser/ui-state-feedback-ready-plan-adapter.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs deploy/cloudflare/tests/build.test.mjs data/preaction-authorizations/UIFEEDBACK-R53-READYPLAN-MATERIAL-VISIBLE-20260825T1644-SOL.json .github/workflows/uifeedback-r53-bounded-executor.yml
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' browser/ui-state-feedback-ready-plan-adapter.mjs deploy/cloudflare/tests/build.test.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "UIFEEDBACK R53: project material feedback in ReadyPlan consumer"
          git push origin HEAD:work/uifeedback-r53-readyplan-material-visible-20260825-1644
