name: GAMEROAD Result Rank Live R3

on:
  push:
    branches:
      - work/result-rank-live-r3-20260904

permissions:
  contents: write

jobs:
  guarded-result-rank-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact guarded live Result patch
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_MESSAGE" == "Result: connect corrected rank presentation live R3" ]]; then
            echo "Product readback commit; patch already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          MANIFEST = Path('data/preaction-authorizations/RESULT-RANK-LIVE-R3-20260904T2357-SOL-Q6N4K8.json')
          targets = {
            Path('browser/GAMEROAD.html'): 'f83770987dd65767efc5b0bc67f8895105aaf0e2',
            Path('tests/browser-full-interaction.spec.mjs'): '03555350e0b284cc146509b8f3c6a7d3b34968cc',
            Path('tests/browser-static-check.mjs'): '945d611a1012020e3bff88f3bdbe7dd0af1c6d57',
            Path('deploy/cloudflare/scripts/build.mjs'): 'd65d17e2b43f826e6a81c5899eb66ff06defd17f',
            Path('deploy/cloudflare/tests/build.test.mjs'): '1bc6091a8052ae24a262059c3387032735f52da9',
          }

          def git_blob(data: bytes) -> str:
            return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          for path, expected in targets.items():
            actual = git_blob(path.read_bytes())
            if actual != expected:
              raise SystemExit(f'PREPATCH_BLOB_MISMATCH {path}: expected={expected} actual={actual}')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'GUARD_{label}_COUNT={count}; refusing mutation')
            return text.replace(old, new, 1)

          html_path = Path('browser/GAMEROAD.html')
          html = html_path.read_text(encoding='utf-8')

          old_css = ".rankLine{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid var(--line);font-weight:900}"
          new_css = old_css + ".resultOutcome{font:inherit}.rankLine[data-rank-color-role=\"platinum\"] .resultOutcome,#resultGrade[data-rank-color-role=\"platinum\"],#resultHeadline[data-rank-color-role=\"platinum\"]{color:#e5e4e2}.rankLine[data-rank-color-role=\"gold\"] .resultOutcome,#resultGrade[data-rank-color-role=\"gold\"],#resultHeadline[data-rank-color-role=\"gold\"]{color:var(--gold)}.rankLine[data-rank-color-role=\"silver\"] .resultOutcome,#resultGrade[data-rank-color-role=\"silver\"],#resultHeadline[data-rank-color-role=\"silver\"]{color:#c0c0c0}"
          html = replace_once(html, old_css, new_css, 'RESULT_CSS')

          old_render = "async function renderResult(){const r=state.match?.lastResult;if(!r)return;const m=state.match,ordered=[...r.ranking].sort((a,b)=>a.rank-b.rank),me=ordered.find(x=>x.player.human),mode=({'2p':'二人','4p':'四人','2v2':'二対二'})[m.mode]||m.mode,content=m.contentId==='honey_hunt'?'ハニーハント':'ロード・シールド';$('#resultGrade').textContent=r.grade;$('#resultHeadline').textContent=r.headline;$('#resultSummary').textContent=`${m.round}巡で決着。 ${content}`;$('#resultLeadText')&&($('#resultLeadText').textContent=r.grade===1?'一位で決着':'最終順位');$('#resultLeadSub')&&($('#resultLeadSub').textContent=`${content} / ${mode}`);$('#resultMode')&&($('#resultMode').textContent=mode);$('#resultRounds')&&($('#resultRounds').textContent=`${m.round}巡`);$('#resultLane')&&($('#resultLane').textContent=`${me?.depth??0}枚`);renderResultBattlePoints(r);const box=$('#resultRanking');box.innerHTML='';ordered.forEach(x=>{const d=document.createElement('div');d.className='rankLine';d.innerHTML=`<b>${x.rank}位 ${x.player.human?'あなた':x.player.name}</b><span>最長列 ${x.depth}枚</span>`;box.appendChild(d)});await grBattleReplayRenderResult(m);resultMount=await mountChar('.resultWorld',state.playerCharacterId,r.grade===1?'joy':'defeated')}"
          new_render = "async function renderResult(){const r=state.match?.lastResult;if(!r)return;const m=state.match,ordered=[...r.ranking].sort((a,b)=>a.rank-b.rank),me=ordered.find(x=>x.player.human),mode=({'2p':'二人','4p':'四人','2v2':'二対二'})[m.mode]||m.mode,content=m.contentId==='honey_hunt'?'ハニーハント':'ロード・シールド';const {projectResultRankPresentation}=await import('./result-presentation-core.mjs'),userPresentation=projectResultRankPresentation(me?.rank);if(!userPresentation?.ok)return;const gradeEl=$('#resultGrade'),headlineEl=$('#resultHeadline');gradeEl.textContent=userPresentation.visibleLabel;headlineEl.textContent=userPresentation.visibleLabel;gradeEl.dataset.formalRank=String(userPresentation.formalRank);headlineEl.dataset.formalRank=String(userPresentation.formalRank);if(userPresentation.rankColorRole){gradeEl.dataset.rankColorRole=userPresentation.rankColorRole;headlineEl.dataset.rankColorRole=userPresentation.rankColorRole}else{delete gradeEl.dataset.rankColorRole;delete headlineEl.dataset.rankColorRole}$('#resultSummary').textContent=`${m.round}巡で決着。 ${content}`;$('#resultLeadText')&&($('#resultLeadText').textContent=r.grade===1?'一位で決着':'最終順位');$('#resultLeadSub')&&($('#resultLeadSub').textContent=`${content} / ${mode}`);$('#resultMode')&&($('#resultMode').textContent=mode);$('#resultRounds')&&($('#resultRounds').textContent=`${m.round}巡`);$('#resultLane')&&($('#resultLane').textContent=`${me?.depth??0}枚`);renderResultBattlePoints(r);const box=$('#resultRanking');box.innerHTML='';ordered.forEach(x=>{const presentation=projectResultRankPresentation(x.rank);if(!presentation?.ok)return;const d=document.createElement('div');d.className='rankLine';d.dataset.formalRank=String(presentation.formalRank);if(presentation.rankColorRole)d.dataset.rankColorRole=presentation.rankColorRole;d.innerHTML=`<b><span class=\"resultOutcome\">${presentation.visibleLabel}</span> ${x.player.human?'あなた':x.player.name}</b><span>最長列 ${x.depth}枚</span>`;box.appendChild(d)});await grBattleReplayRenderResult(m);resultMount=await mountChar('.resultWorld',state.playerCharacterId,r.grade===1?'joy':'defeated')}"
          html = replace_once(html, old_render, new_render, 'RENDER_RESULT')
          html_path.write_text(html, encoding='utf-8')

          static_path = Path('tests/browser-static-check.mjs')
          static = static_path.read_text(encoding='utf-8')
          static_anchor = "  const saasunaForbiddenLossTokens = [\n"
          static_contract = "  const resultRankPresentationContracts = [\n    [/import\\(['\"]\\.\\/result-presentation-core\\.mjs['\"]\\)/, 'Result rank presentation core is not mounted in live Result'],\n    [/projectResultRankPresentation\\(me\\?\\.rank\\)/, 'human Result rank does not project authoritative formal rank'],\n    [/d\\.dataset\\.formalRank=String\\(presentation\\.formalRank\\)/, 'Result ranking rows do not mirror projected formal rank'],\n    [/d\\.dataset\\.rankColorRole=presentation\\.rankColorRole/, 'Result ranking rows do not project rank color role'],\n    [/class=\\\"resultOutcome\\\"/, 'Result ranking rows do not expose corrected outcome label'],\n  ];\n  for (const [pattern, message] of resultRankPresentationContracts) {\n    if (!pattern.test(html)) errors.push(message);\n  }\n  if (/d\\.innerHTML=`<b>\\$\\{x\\.rank\\}位 /.test(html)) {\n    errors.push('legacy visible per-row numeric rank wording remains in live Result');\n  }\n\n"
          static = replace_once(static, static_anchor, static_contract + static_anchor, 'STATIC_RESULT_CONTRACT')
          static_path.write_text(static, encoding='utf-8')

          bfi_path = Path('tests/browser-full-interaction.spec.mjs')
          bfi = bfi_path.read_text(encoding='utf-8')
          helper_anchor = "async function numericText(locator) {\n  return Number.parseInt((await locator.textContent()) ?? '', 10);\n}\n"
          helper = helper_anchor + "\nasync function assertVisibleResultRankPresentation(result) {\n  const rows = await result.locator('#resultRanking .rankLine').evaluateAll((nodes) => nodes.map((node) => ({\n    formalRank: Number(node.dataset.formalRank),\n    rankColorRole: node.dataset.rankColorRole || null,\n    visibleLabel: node.querySelector('.resultOutcome')?.textContent?.trim() ?? '',\n  })));\n  expect(rows.length, 'Result exposes at least one projected formal-rank row').toBeGreaterThan(0);\n  const expected = new Map([[1, ['1位', null]], [2, ['勝利', 'platinum']], [3, ['勝利', 'gold']], [4, ['勝利', 'silver']]]);\n  for (const row of rows) {\n    expect(expected.has(row.formalRank), `formal Result rank ${row.formalRank}`).toBeTruthy();\n    expect(row.visibleLabel, `visible label for rank ${row.formalRank}`).toBe(expected.get(row.formalRank)[0]);\n    expect(row.rankColorRole, `color role for rank ${row.formalRank}`).toBe(expected.get(row.formalRank)[1]);\n  }\n  const primary = result.locator('#resultGrade');\n  const primaryRank = Number(await primary.getAttribute('data-formal-rank'));\n  expect(expected.has(primaryRank), 'primary Result formal rank').toBeTruthy();\n  await expect(primary).toHaveText(expected.get(primaryRank)[0]);\n  expect(await primary.getAttribute('data-rank-color-role'), `primary color role for rank ${primaryRank}`).toBe(expected.get(primaryRank)[1]);\n  const visibleText = await result.innerText();\n  for (const forbidden of ['敗北', '敗者', '負け', '最下位']) expect(visibleText).not.toContain(forbidden);\n}\n"
          bfi = replace_once(bfi, helper_anchor, helper, 'BFI_HELPER')
          bfi = replace_once(bfi, "  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(2);\n", "  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(2);\n  await assertVisibleResultRankPresentation(result);\n", 'BFI_2P_RESULT')
          bfi = replace_once(bfi, "  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n", "  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n  await assertVisibleResultRankPresentation(result);\n", 'BFI_4P_RESULT')
          bfi_path.write_text(bfi, encoding='utf-8')

          build_path = Path('deploy/cloudflare/scripts/build.mjs')
          build = build_path.read_text(encoding='utf-8')
          build_anchor = "  { option: 'navigationCoreSource', expected: 'expectedNavigationCoreBlob', source: 'browser/screen-navigation-core.mjs', output: 'screen-navigation-core.mjs', artifact: 'screen_navigation_core', label: 'Screen navigation core', sourceFlag: '--navigation-core-source', expectedFlag: '--expected-navigation-core-blob' },\n"
          build_entry = build_anchor + "  { option: 'resultPresentationCoreSource', expected: 'expectedResultPresentationCoreBlob', source: 'browser/result-presentation-core.mjs', output: 'result-presentation-core.mjs', artifact: 'result_presentation_core', label: 'Result presentation core', sourceFlag: '--result-presentation-core-source', expectedFlag: '--expected-result-presentation-core-blob' },\n"
          build = replace_once(build, build_anchor, build_entry, 'BUILD_RESULT_SEED')
          build_path.write_text(build, encoding='utf-8')

          build_test_path = Path('deploy/cloudflare/tests/build.test.mjs')
          build_test = build_test_path.read_text(encoding='utf-8')
          test_anchor = "  { file: 'screen-navigation-core.mjs', source: 'browser/screen-navigation-core.mjs', sourceArg: 'navigationCoreSource', expectedArg: 'expectedNavigationCoreBlob', artifact: 'screen_navigation_core', fixture: 'export function resolveScreenNavigation(){ return { ok: true }; }\\n', currentBlob: 'd9b7bd0bcd882514336cbe3d029792a0dda84267' },\n"
          test_entry = test_anchor + "  { file: 'result-presentation-core.mjs', source: 'browser/result-presentation-core.mjs', sourceArg: 'resultPresentationCoreSource', expectedArg: 'expectedResultPresentationCoreBlob', artifact: 'result_presentation_core', fixture: 'export function projectResultRankPresentation(){ return { ok: true, formalRank: 1, visibleLabel: \\\'1位\\\', rankColorRole: null }; }\\n', currentBlob: '2fd53a38dcafbf87b22e6b9a2699a4a74aefefee' },\n"
          build_test = replace_once(build_test, test_anchor, test_entry, 'BUILD_TEST_RESULT_SEED')
          build_test_path.write_text(build_test, encoding='utf-8')

          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          manifest['patchDecision'] = {
            'gold': 'reuse existing var(--gold)',
            'platinum': '#e5e4e2 local Result metal color; no global token added',
            'silver': '#c0c0c0 local Result metal color; no global token added',
            'colorOnlyAvoidance': 'visible label remains 1位 or 勝利; formal rank and role are mirrored as data attributes for deterministic verification',
            'rankAuthority': 'state.match.lastResult.ranking[].rank only',
            'gameplayMutation': False,
          }
          manifest['persistenceState'] = 'PRODUCT_PATCH_APPLIED_PENDING_TESTS'
          manifest['lastConfirmedStep'] = 'Guarded exact patch applied in workspace to live Result, package registry, static check and 2P/4P BFI assertions; tests not yet credited until following steps pass.'
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run focused Result and package tests
        shell: bash
        run: |
          node --test tests/result-presentation-core.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit tested product patch
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_MESSAGE" == "Result: connect corrected rank presentation live R3" ]]; then
            echo "Readback run only; no repeated commit."
            exit 0
          fi
          git config user.name 'gameroad-result-rank-bot'
          git config user.email 'gameroad-result-rank-bot@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs tests/browser-static-check.mjs deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs data/preaction-authorizations/RESULT-RANK-LIVE-R3-20260904T2357-SOL-Q6N4K8.json
          git diff --cached --quiet && exit 0
          git commit -m 'Result: connect corrected rank presentation live R3'
          git push
