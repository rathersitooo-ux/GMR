name: Home targeted call-graph audit

on:
  push:
    branches:
      - work/BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001
    paths:
      - '.github/scripts/home-audit-split.mjs'
      - '.github/workflows/home-audit-split.yml'

permissions:
  contents: write

jobs:
  audit-home-call-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Generate targeted Home call-graph audit
        run: node .github/scripts/home-audit-split.mjs

      - name: Commit targeted audit files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/home-current-js-context.txt audit/home-current-css-context.txt audit/home-current-dependencies.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "[BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001] record current Home call graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
