name: Pipelex Current Evidence R1

on:
  push:
    branches:
      - experiment/pipelex-current-evidence-r1
    paths:
      - experiments/pipelex/**
      - .github/workflows/pipelex-current-evidence-r1.yml
  pull_request:
    branches:
      - main
    paths:
      - experiments/pipelex/**
      - .github/workflows/pipelex-current-evidence-r1.yml

permissions:
  contents: read

jobs:
  validate-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact Pipelex upstream revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Pipelex/pipelex.git@42139f7588cd5ad594296a45f9e89caff6cbc639"
          pipelex --version
          pipelex-agent --version

      - name: Validate positive bundle
        run: |
          pipelex-agent validate bundle experiments/pipelex/current-evidence-packet.mthds --format json | tee experiments/pipelex/positive-validation.json

      - name: Prove negative fixture fails closed
        shell: bash
        run: |
          set +e
          pipelex-agent validate bundle experiments/pipelex/negative-missing-main.mthds --format json > experiments/pipelex/negative-validation.json 2>&1
          code=$?
          set -e
          cat experiments/pipelex/negative-validation.json
          if [ "$code" -eq 0 ]; then
            echo "ERROR: intentionally broken bundle unexpectedly validated"
            exit 1
          fi
          echo "negative_fixture_exit=$code" | tee experiments/pipelex/negative-result.txt

      - name: Execute positive bundle in dry-run mode
        run: |
          pipelex-agent run bundle experiments/pipelex/current-evidence-packet.mthds \
            --inputs experiments/pipelex/inputs.json \
            --dry-run \
            --format json \
            --with-memory \
            > experiments/pipelex/dry-run-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('experiments/pipelex/dry-run-output.json')
          data = json.loads(path.read_text())
          if not isinstance(data, dict):
              raise SystemExit('dry-run output is not a JSON object')
          print('dry_run_json_keys=', sorted(data.keys()))
          print(json.dumps(data, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelex-current-evidence-r1
          path: |
            experiments/pipelex/positive-validation.json
            experiments/pipelex/negative-validation.json
            experiments/pipelex/negative-result.txt
            experiments/pipelex/dry-run-output.json
          if-no-files-found: warn
