name: temp-partner-idle-readable-r2

on:
  push:
    branches:
      - sol/partner-idle-readable-r2-20260910

permissions:
  contents: write

jobs:
  replay-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/partner-idle-readable-r2-20260910
          fetch-depth: 0
      - name: Verify unchanged target base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/partner-dialogue-source-registry.mjs)" = "3d81ad837db549a65fa5a72fa99741c6034943ab"
          test "$(git hash-object browser/partner-advice-runtime-mount.mjs)" = "395613e3162d07b5d21f0d07b2c63c0add5e8927"
          test "$(git hash-object tests/partner-dialogue-source-registry.test.mjs)" = "a2d84af83773eb4bde83e0a1912b5c076ff16016"
          test "$(git hash-object tests/partner-advice-runtime-mount.test.mjs)" = "985212f63c82bf4b5d21f0d07b2c63c0add5e8927" || true
          test "$(git hash-object tests/partner-advice-runtime-mount.test.mjs)" = "985212f63c82bf4b5a17a0cec8dee3deddaf93ad"
      - name: Fetch and verify proven R1 donor blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sol/partner-idle-readable-r1-20260910:refs/remotes/origin/partner-idle-readable-r1
          test "$(git show origin/partner-idle-readable-r1:browser/partner-dialogue-source-registry.mjs | git hash-object --stdin)" = "e1a38fb2d6a3d112476951fcc6afcfc718d7a6ec"
          test "$(git show origin/partner-idle-readable-r1:browser/partner-advice-runtime-mount.mjs | git hash-object --stdin)" = "363cefd1f4ac20fe352060cb834a34bb949d59fe"
          test "$(git show origin/partner-idle-readable-r1:tests/partner-dialogue-source-registry.test.mjs | git hash-object --stdin)" = "bad0b2a60c6048dbd0e75c67802039de255b41f3"
          test "$(git show origin/partner-idle-readable-r1:tests/partner-advice-runtime-mount.test.mjs | git hash-object --stdin)" = "b828663680dd16d0e8e50adc22272e126931209e"
      - name: Replay exact proven files
        shell: bash
        run: |
          set -euo pipefail
          git show origin/partner-idle-readable-r1:browser/partner-dialogue-source-registry.mjs > browser/partner-dialogue-source-registry.mjs
          git show origin/partner-idle-readable-r1:browser/partner-advice-runtime-mount.mjs > browser/partner-advice-runtime-mount.mjs
          git show origin/partner-idle-readable-r1:tests/partner-dialogue-source-registry.test.mjs > tests/partner-dialogue-source-registry.test.mjs
          git show origin/partner-idle-readable-r1:tests/partner-advice-runtime-mount.test.mjs > tests/partner-advice-runtime-mount.test.mjs
          test "$(git hash-object browser/partner-dialogue-source-registry.mjs)" = "e1a38fb2d6a3d112476951fcc6afcfc718d7a6ec"
          test "$(git hash-object browser/partner-advice-runtime-mount.mjs)" = "363cefd1f4ac20fe352060cb834a34bb949d59fe"
          test "$(git hash-object tests/partner-dialogue-source-registry.test.mjs)" = "bad0b2a60c6048dbd0e75c67802039de255b41f3"
          test "$(git hash-object tests/partner-advice-runtime-mount.test.mjs)" = "b828663680dd16d0e8e50adc22272e126931209e"
      - name: Run focused classified tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-dialogue-source-registry.test.mjs tests/partner-advice-runtime-mount.test.mjs
      - name: Commit product and remove transient authorization files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-partner-idle-readable-r2.yml
          rm data/preaction-authorizations/PARTNER-IDLE-READABLE-R2-20260910T0349-SOL-P7N4Q2.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/partner-dialogue-source-registry.mjs browser/partner-advice-runtime-mount.mjs tests/partner-dialogue-source-registry.test.mjs tests/partner-advice-runtime-mount.test.mjs .github/workflows/zz-temp-partner-idle-readable-r2.yml data/preaction-authorizations/PARTNER-IDLE-READABLE-R2-20260910T0349-SOL-P7N4Q2.json
          git diff --cached --check
          git commit -m "Add approved idle partner readable content"
          git push origin HEAD:sol/partner-idle-readable-r2-20260910
