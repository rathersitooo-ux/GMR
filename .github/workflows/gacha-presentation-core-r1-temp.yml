name: Gacha Presentation Core R1 Temp

on:
  push:
    branches:
      - work/GACHA-MOVIE-INTERACTION-VSLICE-001-R1-ISOLATED-CORE

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Gacha presentation core tests
        run: node --test tests/gacha-presentation-core.test.mjs
