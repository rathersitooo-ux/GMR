              """test('Battle recent public history stays compact, expands inline, deduplicates, reconnects, and rejects stale match data', () => {
  const fake = fakeBattleLogDocument();
  const bridge = createPartnerBattleEventLogPresentationBridge({
    document: fake.document,
    partnerBattleLogRecentRows: 2
  });
  let session = createLiveReplaySession(
    { matchId: 'M-HISTORY', versions },
    { presentationBridge: null, partnerBattleEventLogBridge: bridge }
  );
  for (let serial = 1; serial <= 3; serial += 1) {
    session = appendAcceptedBattleResolution(
      session,
      resolution(serial),
      { presentationBridge: null, partnerBattleEventLogBridge: bridge }
    );
  }

  const host = fake.shell.querySelector('[data-partner-battle-event-log]');
  const toggle = fake.shell.querySelector('[data-partner-battle-event-log-toggle]');
  assert.ok(host);
  assert.ok(toggle);
  assert.equal(host.children.length, 3);
  assert.deepEqual(host.children.map(row => row.hidden), [true, false, false]);
  assert.equal(host.dataset.partnerBattleEventLogRecentRows, '2');
  assert.equal(host.dataset.partnerBattleEventLogExpanded, 'false');
  assert.equal(toggle.hidden, false);
  assert.equal(toggle.getAttribute('aria-expanded'), 'false');
  assert.match(host.children[0].textContent, /対象C列/);
  assert.match(host.children[0].textContent, /公開カード C1\(6\) \/ C2\(4\)/);

  toggle.click();
  assert.deepEqual(host.children.map(row => row.hidden), [false, false, false]);
  assert.equal(host.dataset.partnerBattleEventLogExpanded, 'true');
  assert.equal(toggle.getAttribute('aria-expanded'), 'true');

  const before = host.children.map(row => row.textContent);
  const duplicate = bridge.acceptSession(session);
  assert.equal(duplicate.ok, true);
  assert.equal(duplicate.consumed, true);
  assert.equal(host.children.length, 3);
  assert.deepEqual(host.children.map(row => row.textContent), before);

  assert.equal(bridge.begin('M-HISTORY'), true);
  assert.equal(host.children.length, 0);
  const reconnect = bridge.acceptSession(session);
  assert.equal(reconnect.ok, true);
  assert.equal(reconnect.eventCount, 3);
  assert.deepEqual(host.children.map(row => row.hidden), [true, false, false]);

  assert.equal(bridge.begin('M-NEXT'), true);
  assert.equal(host.children.length, 0);
  assert.equal(toggle.hidden, true);
  assert.equal(toggle.getAttribute('aria-expanded'), 'false');
  const stale = bridge.acceptSession(session);
  assert.deepEqual(stale, {
    ok: false,
    consumed: false,
    reason: 'PARTNER_BATTLE_LOG_MATCH_STALE'
  });
  assert.equal(host.children.length, 0);
});

