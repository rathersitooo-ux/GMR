name: TEMP Road Move R30 Evidence

on:
  push:
    branches:
      - sol/road-move-bidirectional-r30-20260912
    paths:
      - 'tests/road-move-bidirectional-live-r27.spec.mjs'
      - '.github/workflows/zz-temp-road-move-r30.yml'
      - 'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R30-20260912T1001-SOL-Q7N4V8.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-bidirectional-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Build bounded Road-only Playwright config
        shell: bash
        run: |
          cat > .road-r30-playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: ['road-move-bidirectional-live-r27.spec.mjs'],
            timeout: 90_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: 'test-results/road-r30',
            reporter: [['line']],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              browserName: 'chromium',
              headless: true,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
            projects: [
              { name: 'desktop-1280x720', use: { viewport: { width: 1280, height: 720 } } },
              { name: 'phone-390x844', use: { viewport: { width: 390, height: 844 } } },
              { name: 'landscape-844x390', use: { viewport: { width: 844, height: 390 } } },
            ],
            webServer: {
              command: 'python3 -m http.server 4173 --bind 127.0.0.1',
              cwd: new URL('.', import.meta.url).pathname,
              url: 'http://127.0.0.1:4173/browser/GAMEROAD.html',
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF

      - name: Run Road bidirectional regression
        shell: bash
        run: |
          set -uo pipefail
          npx playwright test --config=.road-r30-playwright.config.mjs 2>&1 | tee road-move-r30.log
          exit ${PIPESTATUS[0]}

      - name: Upload Road evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-move-r30-${{ github.run_id }}
          path: |
            road-move-r30.log
            test-results
          if-no-files-found: warn
