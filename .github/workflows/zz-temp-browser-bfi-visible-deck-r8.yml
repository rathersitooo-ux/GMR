name: temp Browser public R19 visible-deck evidence R8

on:
  push:
    branches: [sol/bfi-public-visible-deck-r8-evidence-20260912]
    paths:
      - '.github/workflows/zz-temp-browser-bfi-visible-deck-r8.yml'

permissions:
  contents: write

concurrency:
  group: browser-public-r19-visible-deck-r8
  cancel-in-progress: true

jobs:
  public-r19:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_PUBLIC_BUILD_ID: 79c1644bc864ea41e6725c84d68d10893afd4925
      MERGED_TEST_SHA: beac6ebef7a62c5f49d3550001f09d2a5d1ef6cd
    steps:
      - name: Checkout merged test source
        uses: actions/checkout@v4
        with:
          ref: sol/bfi-public-visible-deck-r8-evidence-20260912
          fetch-depth: 0

      - name: Verify product bytes unchanged by test-only merge
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "${EXPECTED_PUBLIC_BUILD_ID}" "${MERGED_TEST_SHA}")
          printf '79c->beac changed paths:\n%s\n' "${CHANGED[*]}"
          [[ "${#CHANGED[@]}" -eq 1 ]]
          [[ "${CHANGED[0]}" == 'tests/browser-full-interaction.spec.mjs' ]]

      - name: Bind canonical public origin to unchanged deployed product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output public-origin-metadata/gameroad-version.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED="$(node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('public-origin-metadata/gameroad-version.json','utf8'));process.stdout.write(String(m.build_id||''));")"
          echo "Observed public build=${OBSERVED}"
          [[ "${OBSERVED}" == "${EXPECTED_PUBLIC_BUILD_ID}" ]]
          printf 'source_test_sha=%s\npublic_product_sha=%s\npublic_origin=%s\n' \
            "${MERGED_TEST_SHA}" "${OBSERVED}" "${GAMEROAD_PUBLIC_BASE_URL}" \
            > public-origin-metadata/binding.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare public-origin R19 runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r38-public
          SOURCE='tests/browser-full-interaction.spec.mjs'
          TARGET='.r38-public/browser-full-interaction.spec.mjs'
          sed "s#'/browser/GAMEROAD.html'#'/'#g" "$SOURCE" > "$TARGET"
          if grep -Fq "'/browser/GAMEROAD.html'" "$TARGET"; then
            echo '::error::Temporary public-origin spec still contains local Browser entry path'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.r38-public/browser-full-interaction.spec.mjs').read_text(encoding='utf-8')
          start=s.index('// FULLREG R19 visible four-player Honey Hunt route')
          end=s.index("  const setupGo = visibleOperationGo(page, 'setup');", start)
          pre=s[start:end]
          assert '__GAMEROAD_TEST__' not in pre
          assert 'saveBattleDeckThroughVisibleCards' in pre
          print('R19 public precondition uses visible Cards path')
          PY
          cat > .r38-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';

          const publicProjects = (baseConfig.projects ?? [])
            .filter((project) => !project.grep)
            .map((project) => ({ name: project.name, use: project.use }));

          export default defineConfig({
            testDir: '.',
            testMatch: 'browser-full-interaction.spec.mjs',
            grep: /R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout: 240_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/public-origin-r8',
            reporter: [
              ['line'],
              ['html', { outputFolder: '../playwright-report-public-origin-r8', open: 'never' }],
              ['json', { outputFile: '../test-results/public-origin-r8/report.json' }],
            ],
            use: {
              ...baseConfig.use,
              baseURL: process.env.GAMEROAD_PUBLIC_BASE_URL,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
            projects: publicProjects,
          });
          EOF

      - name: Run visible four-player Honey Hunt on public origin
        run: npx playwright test --config=.r38-public/playwright.config.mjs --workers=1

      - name: Upload public-origin R19 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-public-r19-visible-deck-r8-${{ github.run_id }}
          path: |
            public-origin-metadata/
            playwright-report-public-origin-r8/
            test-results/public-origin-r8/
          if-no-files-found: error
          retention-days: 14

      - name: Remove transient evidence workflow from branch
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bfi-r8-evidence-bot'
          git config user.email 'gameroad-bfi-r8-evidence-bot@users.noreply.github.com'
          git rm .github/workflows/zz-temp-browser-bfi-visible-deck-r8.yml
          git commit -m 'chore: cleanup public R19 R8 evidence workflow'
          git push origin HEAD:sol/bfi-public-visible-deck-r8-evidence-20260912
