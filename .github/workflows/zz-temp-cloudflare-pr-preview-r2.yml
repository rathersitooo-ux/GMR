name: GAMEROAD Shared Preview Match Start Module Delivery R10

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762
  PREVIEW_ALIAS_URL: https://codex-shared.gameroad-browser-r5.pages.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact module delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          for path in deck-save-ack-core.mjs deck-save-recovery-core.mjs screen-navigation-core.mjs; do
            body="$RUNNER_TEMP/$path"
            headers="$RUNNER_TEMP/$path.headers"
            code="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' -D "$headers" -o "$body" -w '%{http_code}' "$PREVIEW_ALIAS_URL/$path")"
            echo "===== $path status=$code ====="
            tr -d '\r' < "$headers" | grep -Ei '^(content-type|content-length|cache-control|etag|cf-cache-status):' || true
            test "$code" = 200
            cmp --silent "browser/$path" "$body" || { echo "::error::$path byte mismatch"; exit 1; }
            echo "$path exact-byte PASS"
          done
