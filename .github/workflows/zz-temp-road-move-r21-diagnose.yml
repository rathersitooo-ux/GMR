name: TEMP Road Move R21 Diagnose

on:
  push:
    branches:
      - sol/road-move-bidirectional-head-r21-20260909

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-bidirectional-head-r21-20260909
          fetch-depth: 0
      - name: Inspect short-landscape hand collision styles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 5d2e1d5c596e5400a727264d3b3eee1517b8d9c0:browser/GAMEROAD.html)" = "d7ae9d0532df7e66ebbf29f1e7eecb3f352d346d"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser/GAMEROAD.html').read_text()
          for needle in ['grPlayableHandCandidate','first10Focus','.first10Focus','playableHand','.handCard{','@media(max-height:470px) and (orientation:landscape)']:
            print(f'=== {needle} count={s.count(needle)} ===')
            start=0
            for n in range(min(s.count(needle),16)):
              i=s.find(needle,start)
              if i<0: break
              print(f'--- {n+1} @ {i} ---')
              print(s[max(0,i-700):min(len(s),i+1500)])
              start=i+len(needle)
          PY
