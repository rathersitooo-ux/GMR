name: TEMP R3 normal-match guarded patch

on:
  push:
    branches:
      - work/normalmatch-r3-public-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/normalmatch-r3-public-transport
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard branch base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 21e4faca44f7f427b47f09a7fd8b3a2d7989943c HEAD

      - name: Apply exact R3 transport patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exact anchor once, found {count}')
              return text.replace(old, new, 1)

          core_path = 'deploy/cloudflare/relay/src/relay-core.mjs'
          core = read(core_path)
          if 'MATCH_QUEUE_SCHEMA' in core:
              raise SystemExit('relay-core already contains MATCH_QUEUE_SCHEMA')
          queue_core = r'''

          export const MATCH_QUEUE_SCHEMA = 'gameroad.normalmatch.queue.v1';
          export const MATCH_TICKET_WAITING = 'WAITING';
          export const MATCH_TICKET_MATCHED = 'MATCHED';
          export const MATCH_TICKET_CANCELLED = 'CANCELLED';
          export const MATCH_SIZE = 4;
          export const MAX_WAITING_TICKETS = 128;

          const MATCH_ID_RE = /^[A-Za-z0-9._:-]{1,160}$/;
          const MATCH_KEY_RE = /^[A-Za-z0-9._:-]{8,192}$/;
          const MATCH_TOKEN_RE = /^[A-Za-z0-9_-]{24,256}$/;

          export function emptyMatchQueue() {
            return {
              schema: MATCH_QUEUE_SCHEMA,
              nextSequence: 1,
              tickets: {},
              idempotency: {},
              matches: {},
            };
          }

          export function validMatchClientId(value) { return MATCH_ID_RE.test(String(value || '')); }
          export function validMatchIdempotencyKey(value) { return MATCH_KEY_RE.test(String(value || '')); }
          export function validMatchTicketId(value) { return MATCH_ID_RE.test(String(value || '')); }
          export function validMatchId(value) { return MATCH_ID_RE.test(String(value || '')); }
          export function validMatchSecret(value) { return MATCH_TOKEN_RE.test(String(value || '')); }

          export function normalizeMatchQueue(raw) {
            const src = raw && typeof raw === 'object' ? raw : {};
            const out = emptyMatchQueue();
            out.nextSequence = Number.isSafeInteger(src.nextSequence) && src.nextSequence > 0 ? src.nextSequence : 1;

            for (const [ticketId, ticket] of Object.entries(src.tickets || {})) {
              if (!validMatchTicketId(ticketId) || !ticket || typeof ticket !== 'object') continue;
              const status = [MATCH_TICKET_WAITING, MATCH_TICKET_MATCHED, MATCH_TICKET_CANCELLED].includes(ticket.status)
                ? ticket.status
                : '';
              if (!status || !validMatchClientId(ticket.clientId) || !validMatchSecret(ticket.secret)) continue;
              const sequence = Number.isSafeInteger(ticket.sequence) && ticket.sequence > 0 ? ticket.sequence : 0;
              const matchId = status === MATCH_TICKET_MATCHED && validMatchId(ticket.matchId) ? ticket.matchId : '';
              out.tickets[ticketId] = {
                clientId: ticket.clientId,
                secret: ticket.secret,
                status,
                sequence,
                matchId,
              };
            }

            for (const [key, ticketId] of Object.entries(src.idempotency || {})) {
              if (validMatchIdempotencyKey(key) && validMatchTicketId(ticketId) && out.tickets[ticketId]) {
                out.idempotency[key] = ticketId;
              }
            }

            for (const [matchId, match] of Object.entries(src.matches || {})) {
              if (!validMatchId(matchId) || !match || typeof match !== 'object' || !Array.isArray(match.ticketIds)) continue;
              const ticketIds = match.ticketIds.filter(
                (ticketId) => validMatchTicketId(ticketId) && out.tickets[ticketId]?.matchId === matchId,
              );
              if (ticketIds.length === MATCH_SIZE) out.matches[matchId] = { ticketIds };
            }
            return out;
          }

          function rejectMatch(reason, queue) {
            return { ok: false, reason, queue };
          }

          function publicMatchTicket(ticketId, ticket) {
            return {
              ticketId,
              clientId: ticket.clientId,
              status: ticket.status,
              matchId: ticket.matchId || '',
            };
          }

          function waitingMatchTicketIds(queue) {
            return Object.entries(queue.tickets)
              .filter(([, ticket]) => ticket.status === MATCH_TICKET_WAITING)
              .sort((a, b) => a[1].sequence - b[1].sequence || a[0].localeCompare(b[0]))
              .map(([ticketId]) => ticketId);
          }

          function clientAlreadyWaiting(queue, clientId) {
            return Object.values(queue.tickets).some(
              (ticket) => ticket.clientId === clientId && ticket.status === MATCH_TICKET_WAITING,
            );
          }

          function maybeFormMatch(queue, generatedMatchId) {
            const waiting = waitingMatchTicketIds(queue);
            if (waiting.length < MATCH_SIZE) return { queue, matchId: '' };
            if (!validMatchId(generatedMatchId)) throw new TypeError('generated_match_id_invalid');
            if (queue.matches[generatedMatchId]) throw new TypeError('generated_match_id_collision');
            const selected = waiting.slice(0, MATCH_SIZE);
            for (const ticketId of selected) {
              queue.tickets[ticketId] = {
                ...queue.tickets[ticketId],
                status: MATCH_TICKET_MATCHED,
                matchId: generatedMatchId,
              };
            }
            queue.matches[generatedMatchId] = { ticketIds: selected };
            return { queue, matchId: generatedMatchId };
          }

          export function createMatchTicket(queueInput, input, generated) {
            const queue = normalizeMatchQueue(queueInput);
            const clientId = String(input?.clientId || '');
            const idempotencyKey = String(input?.idempotencyKey || '');
            if (!validMatchClientId(clientId)) return rejectMatch('match_client_invalid', queue);
            if (!validMatchIdempotencyKey(idempotencyKey)) return rejectMatch('match_idempotency_invalid', queue);

            const priorTicketId = queue.idempotency[idempotencyKey];
            if (priorTicketId) {
              const prior = queue.tickets[priorTicketId];
              if (!prior || prior.clientId !== clientId) return rejectMatch('match_idempotency_conflict', queue);
              return {
                ok: true,
                queue,
                idempotent: true,
                ticket: publicMatchTicket(priorTicketId, prior),
                secret: prior.secret,
                formedMatchId: '',
              };
            }

            if (clientAlreadyWaiting(queue, clientId)) return rejectMatch('match_client_already_waiting', queue);
            if (waitingMatchTicketIds(queue).length >= MAX_WAITING_TICKETS) return rejectMatch('match_queue_full', queue);

            const ticketId = String(generated?.ticketId || '');
            const secret = String(generated?.secret || '');
            if (!validMatchTicketId(ticketId)) throw new TypeError('generated_ticket_id_invalid');
            if (!validMatchSecret(secret)) throw new TypeError('generated_ticket_secret_invalid');
            if (queue.tickets[ticketId]) throw new TypeError('generated_ticket_id_collision');

            queue.tickets[ticketId] = {
              clientId,
              secret,
              status: MATCH_TICKET_WAITING,
              sequence: queue.nextSequence++,
              matchId: '',
            };
            queue.idempotency[idempotencyKey] = ticketId;
            const matched = maybeFormMatch(queue, String(generated?.matchId || ''));
            const ticket = matched.queue.tickets[ticketId];
            return {
              ok: true,
              queue: matched.queue,
              idempotent: false,
              ticket: publicMatchTicket(ticketId, ticket),
              secret,
              formedMatchId: matched.matchId,
            };
          }

          function authorizeMatchTicket(queue, input) {
            const ticketId = String(input?.ticketId || '');
            const secret = String(input?.secret || '');
            if (!validMatchTicketId(ticketId) || !validMatchSecret(secret)) {
              return { ok: false, reason: 'match_ticket_auth_invalid' };
            }
            const ticket = queue.tickets[ticketId];
            if (!ticket || ticket.secret !== secret) return { ok: false, reason: 'match_ticket_auth_invalid' };
            return { ok: true, ticketId, ticket };
          }

          export function matchTicketStatus(queueInput, input) {
            const queue = normalizeMatchQueue(queueInput);
            const auth = authorizeMatchTicket(queue, input);
            if (!auth.ok) return rejectMatch(auth.reason, queue);
            const match = auth.ticket.matchId ? queue.matches[auth.ticket.matchId] || null : null;
            return {
              ok: true,
              queue,
              ticket: publicMatchTicket(auth.ticketId, auth.ticket),
              match: match ? { matchId: auth.ticket.matchId, ticketIds: [...match.ticketIds] } : null,
            };
          }

          export function cancelMatchTicket(queueInput, input) {
            const queue = normalizeMatchQueue(queueInput);
            const auth = authorizeMatchTicket(queue, input);
            if (!auth.ok) return rejectMatch(auth.reason, queue);
            if (auth.ticket.status === MATCH_TICKET_MATCHED) {
              return {
                ok: true,
                queue,
                cancelled: false,
                terminal: MATCH_TICKET_MATCHED,
                ticket: publicMatchTicket(auth.ticketId, auth.ticket),
              };
            }
            if (auth.ticket.status === MATCH_TICKET_CANCELLED) {
              return {
                ok: true,
                queue,
                cancelled: true,
                terminal: MATCH_TICKET_CANCELLED,
                ticket: publicMatchTicket(auth.ticketId, auth.ticket),
              };
            }
            queue.tickets[auth.ticketId] = {
              ...auth.ticket,
              status: MATCH_TICKET_CANCELLED,
              matchId: '',
            };
            return {
              ok: true,
              queue,
              cancelled: true,
              terminal: MATCH_TICKET_CANCELLED,
              ticket: publicMatchTicket(auth.ticketId, queue.tickets[auth.ticketId]),
            };
          }
          '''
          core = core.rstrip() + '\n' + queue_core.strip() + '\n'
          write(core_path, core)

          worker_path = 'deploy/cloudflare/relay/src/relay-worker.mjs'
          worker = read(worker_path)
          if 'export class GAMEROADMatchQueue' in worker:
              raise SystemExit('relay-worker already contains GAMEROADMatchQueue')
          import_anchor = "} from './relay-core.mjs';\n\nconst ROOM_KEY = 'room.v1';"
          import_replacement = """} from './relay-core.mjs';
          import {
            cancelMatchTicket,
            createMatchTicket,
            matchTicketStatus,
            normalizeMatchQueue,
          } from './relay-core.mjs';

          const ROOM_KEY = 'room.v1';
          const MATCH_QUEUE_KEY = 'match-queue.v1';"""
          worker = replace_once(worker, import_anchor, import_replacement, 'relay-worker import')
          worker_class = r'''

          function matchJson(body, status = 200) {
            return new Response(JSON.stringify(body), {
              status,
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'Cache-Control': 'no-store',
              },
            });
          }

          function matchErrorStatus(reason) {
            if (reason === 'match_ticket_auth_invalid') return 403;
            if (reason === 'match_queue_full') return 429;
            if (reason === 'match_client_already_waiting' || reason === 'match_idempotency_conflict') return 409;
            return 400;
          }

          async function readMatchJson(request) {
            const contentLength = Number(request.headers.get('content-length') || 0);
            if (Number.isFinite(contentLength) && contentLength > 4096) throw new Error('match_request_too_large');
            const text = await request.text();
            if (text.length > 4096) throw new Error('match_request_too_large');
            return JSON.parse(text || '{}');
          }

          function randomMatchSecret() {
            const bytes = new Uint8Array(32);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
          }

          function publicMatchSession(status) {
            if (!status.match) return null;
            const slot = status.match.ticketIds.indexOf(status.ticket.ticketId);
            if (slot < 0) return null;
            return {
              sessionId: status.match.matchId,
              matchId: status.match.matchId,
              slot,
              size: status.match.ticketIds.length,
            };
          }

          export class GAMEROADMatchQueue extends DurableObject {
            constructor(ctx, env) {
              super(ctx, env);
              this.ctx = ctx;
            }

            async fetch(request) {
              if (request.method !== 'POST') return matchJson({ ok: false, reason: 'match_method_invalid' }, 405);
              const url = new URL(request.url);
              const op = url.searchParams.get('matchOp') || '';
              let body;
              try {
                body = await readMatchJson(request);
              } catch {
                return matchJson({ ok: false, reason: 'match_request_invalid' }, 400);
              }

              const stored = normalizeMatchQueue(await this.ctx.storage.get(MATCH_QUEUE_KEY));
              if (op === 'create') {
                const result = createMatchTicket(stored, body, {
                  ticketId: `t-${crypto.randomUUID()}`,
                  secret: randomMatchSecret(),
                  matchId: `m-${crypto.randomUUID()}`,
                });
                if (!result.ok) return matchJson({ ok: false, reason: result.reason }, matchErrorStatus(result.reason));
                await this.ctx.storage.put(MATCH_QUEUE_KEY, result.queue);
                return matchJson({
                  ok: true,
                  idempotent: result.idempotent,
                  ticket: result.ticket,
                  secret: result.secret,
                  formedMatchId: result.formedMatchId,
                });
              }

              if (op === 'status') {
                const result = matchTicketStatus(stored, body);
                if (!result.ok) return matchJson({ ok: false, reason: result.reason }, matchErrorStatus(result.reason));
                return matchJson({ ok: true, ticket: result.ticket, session: publicMatchSession(result) });
              }

              if (op === 'cancel') {
                const result = cancelMatchTicket(stored, body);
                if (!result.ok) return matchJson({ ok: false, reason: result.reason }, matchErrorStatus(result.reason));
                await this.ctx.storage.put(MATCH_QUEUE_KEY, result.queue);
                return matchJson({
                  ok: true,
                  cancelled: result.cancelled,
                  terminal: result.terminal,
                  ticket: result.ticket,
                });
              }

              return matchJson({ ok: false, reason: 'match_op_invalid' }, 404);
            }
          }
          '''
          worker = replace_once(worker, '\nexport default {\n', worker_class + '\n\nexport default {\n', 'relay-worker default')
          write(worker_path, worker)

          relay_cfg_path = 'deploy/cloudflare/relay/wrangler.toml'
          relay_cfg = read(relay_cfg_path)
          if '[exports.GAMEROADMatchQueue]' in relay_cfg:
              raise SystemExit('relay wrangler already contains GAMEROADMatchQueue')
          relay_cfg = relay_cfg.rstrip() + "\n\n[exports.GAMEROADMatchQueue]\ntype = \"durable-object\"\nstorage = \"sqlite\"\n"
          write(relay_cfg_path, relay_cfg)

          pages_cfg_path = 'deploy/cloudflare/wrangler.pages.toml'
          pages_cfg = read(pages_cfg_path)
          if 'GAMEROAD_MATCH_QUEUES' in pages_cfg:
              raise SystemExit('pages wrangler already contains GAMEROAD_MATCH_QUEUES')
          pages_cfg = pages_cfg.rstrip() + "\n\n[[durable_objects.bindings]]\nname = \"GAMEROAD_MATCH_QUEUES\"\nclass_name = \"GAMEROADMatchQueue\"\nscript_name = \"gameroad-friend-relay-r5\"\n"
          write(pages_cfg_path, pages_cfg)

          ws_path = 'deploy/cloudflare/functions/ws.js'
          current_ws = read(ws_path)
          expected_ws = """export async function onRequest(context) {
            const request = context.request;
            if (request.headers.get('Upgrade')?.toLowerCase() !== 'websocket') {
              return new Response('WebSocket upgrade required', { status: 426, headers: { Upgrade: 'websocket' } });
            }
            const url = new URL(request.url);
            const channel = url.searchParams.get('channel') || '';
            if (!channel || channel.length > 192) return new Response('Invalid channel', { status: 400 });
            const id = context.env.GAMEROAD_ROOMS.idFromName(channel);
            return context.env.GAMEROAD_ROOMS.get(id).fetch(request);
          }
          """.replace('          ', '')
          if current_ws != expected_ws:
              raise SystemExit('ws.js exact baseline mismatch; refusing broad replacement')
          next_ws = r'''export async function onRequest(context) {
            const request = context.request;
            const url = new URL(request.url);
            const isWebSocket = request.headers.get('Upgrade')?.toLowerCase() === 'websocket';

            if (!isWebSocket && request.method === 'POST') {
              const matchOp = url.searchParams.get('matchOp') || '';
              if (matchOp === 'create' || matchOp === 'status' || matchOp === 'cancel') {
                const queue = url.searchParams.get('queue') || '';
                if (!/^[A-Za-z0-9._:-]{8,160}$/.test(queue)) {
                  return new Response('Invalid normal-match queue', { status: 400 });
                }
                if (!context.env.GAMEROAD_MATCH_QUEUES) {
                  return new Response('Normal-match transport unavailable', { status: 503 });
                }
                const id = context.env.GAMEROAD_MATCH_QUEUES.idFromName(`gameroad.normal.${queue}`);
                return context.env.GAMEROAD_MATCH_QUEUES.get(id).fetch(request);
              }
            }

            if (!isWebSocket) {
              return new Response('WebSocket upgrade required', { status: 426, headers: { Upgrade: 'websocket' } });
            }
            const channel = url.searchParams.get('channel') || '';
            if (!channel || channel.length > 192) return new Response('Invalid channel', { status: 400 });
            const id = context.env.GAMEROAD_ROOMS.idFromName(channel);
            return context.env.GAMEROAD_ROOMS.get(id).fetch(request);
          }
          '''.replace('          ', '')
          write(ws_path, next_ws)

          test_path = 'deploy/cloudflare/tests/relay-core.test.mjs'
          tests = read(test_path)
          if "normal-match queue create is idempotent" in tests:
              raise SystemExit('relay-core.test already contains R3 normal-match tests')
          import_anchor = "  shouldPreserveRoomAfterHostClose,\n} from '../relay/src/relay-core.mjs';"
          import_replacement = """  shouldPreserveRoomAfterHostClose,
            MATCH_TICKET_CANCELLED,
            MATCH_TICKET_MATCHED,
            MATCH_TICKET_WAITING,
            cancelMatchTicket,
            createMatchTicket,
            emptyMatchQueue,
            matchTicketStatus,
            normalizeMatchQueue,
          } from '../relay/src/relay-core.mjs';""".replace('          ', '')
          tests = replace_once(tests, import_anchor, import_replacement, 'relay-core.test import')

          unit_tests = r'''

          const matchSecret = (n) => `secret_${String(n).padStart(20, '0')}`;
          const generatedMatchIds = (n, matchId = '') => ({
            ticketId: `ticket-${n}`,
            secret: matchSecret(n),
            matchId,
          });
          const createMatch = (queue, n, key = `idem-key-${String(n).padStart(8, '0')}`, matchId = '') =>
            createMatchTicket(queue, { clientId: `client-${n}`, idempotencyKey: key }, generatedMatchIds(n, matchId));

          test('normal-match queue create is idempotent and does not duplicate membership', () => {
            const first = createMatch(emptyMatchQueue(), 1);
            assert.equal(first.ok, true);
            assert.equal(first.ticket.status, MATCH_TICKET_WAITING);
            const retry = createMatchTicket(
              first.queue,
              { clientId: 'client-1', idempotencyKey: 'idem-key-00000001' },
              generatedMatchIds(99),
            );
            assert.equal(retry.ok, true);
            assert.equal(retry.idempotent, true);
            assert.equal(retry.ticket.ticketId, 'ticket-1');
            assert.equal(Object.keys(retry.queue.tickets).length, 1);
          });

          test('normal-match queue prevents one client from occupying two waiting slots', () => {
            const first = createMatch(emptyMatchQueue(), 1);
            const duplicate = createMatchTicket(
              first.queue,
              { clientId: 'client-1', idempotencyKey: 'idem-key-different' },
              generatedMatchIds(2),
            );
            assert.equal(duplicate.ok, false);
            assert.equal(duplicate.reason, 'match_client_already_waiting');
          });

          test('normal-match queue atomically matches the four oldest waiting tickets', () => {
            let queue = emptyMatchQueue();
            for (let i = 1; i <= 3; i += 1) queue = createMatch(queue, i).queue;
            const fourth = createMatch(queue, 4, 'idem-key-00000004', 'match-1');
            assert.equal(fourth.formedMatchId, 'match-1');
            assert.equal(fourth.ticket.status, MATCH_TICKET_MATCHED);
            assert.deepEqual(fourth.queue.matches['match-1'].ticketIds, ['ticket-1', 'ticket-2', 'ticket-3', 'ticket-4']);
          });

          test('normal-match status requires the exact bearer secret and returns matched authority', () => {
            let queue = emptyMatchQueue();
            for (let i = 1; i <= 4; i += 1) {
              queue = createMatch(queue, i, `idem-key-${String(i).padStart(8, '0')}`, i === 4 ? 'match-1' : '').queue;
            }
            assert.equal(matchTicketStatus(queue, { ticketId: 'ticket-1', secret: matchSecret(99) }).ok, false);
            const status = matchTicketStatus(queue, { ticketId: 'ticket-1', secret: matchSecret(1) });
            assert.equal(status.ok, true);
            assert.equal(status.ticket.status, MATCH_TICKET_MATCHED);
            assert.equal(status.match.matchId, 'match-1');
            assert.equal(status.match.ticketIds.length, 4);
          });

          test('normal-match cancellation is terminal for the same idempotency key and fresh key creates fresh ticket', () => {
            const first = createMatch(emptyMatchQueue(), 1);
            const cancelled = cancelMatchTicket(first.queue, { ticketId: 'ticket-1', secret: matchSecret(1) });
            assert.equal(cancelled.terminal, MATCH_TICKET_CANCELLED);
            const retry = createMatchTicket(
              cancelled.queue,
              { clientId: 'client-1', idempotencyKey: 'idem-key-00000001' },
              generatedMatchIds(2),
            );
            assert.equal(retry.ticket.ticketId, 'ticket-1');
            assert.equal(retry.ticket.status, MATCH_TICKET_CANCELLED);
            const fresh = createMatchTicket(
              cancelled.queue,
              { clientId: 'client-1', idempotencyKey: 'idem-key-fresh0001' },
              generatedMatchIds(2),
            );
            assert.equal(fresh.ok, true);
            assert.equal(fresh.ticket.ticketId, 'ticket-2');
            assert.equal(fresh.ticket.status, MATCH_TICKET_WAITING);
          });

          test('normal-match cancel-vs-match race returns actual MATCHED terminal state when matching wins first', () => {
            let queue = emptyMatchQueue();
            for (let i = 1; i <= 4; i += 1) {
              queue = createMatch(queue, i, `idem-key-${String(i).padStart(8, '0')}`, i === 4 ? 'match-race' : '').queue;
            }
            const cancel = cancelMatchTicket(queue, { ticketId: 'ticket-1', secret: matchSecret(1) });
            assert.equal(cancel.ok, true);
            assert.equal(cancel.cancelled, false);
            assert.equal(cancel.terminal, MATCH_TICKET_MATCHED);
          });

          test('normal-match cancel before fourth join removes ticket from the match candidate set', () => {
            let queue = emptyMatchQueue();
            for (let i = 1; i <= 3; i += 1) queue = createMatch(queue, i).queue;
            queue = cancelMatchTicket(queue, { ticketId: 'ticket-2', secret: matchSecret(2) }).queue;
            queue = createMatch(queue, 4).queue;
            const fifth = createMatch(queue, 5, 'idem-key-00000005', 'match-after-cancel');
            assert.deepEqual(fifth.queue.matches['match-after-cancel'].ticketIds, ['ticket-1', 'ticket-3', 'ticket-4', 'ticket-5']);
            assert.equal(fifth.queue.tickets['ticket-2'].status, MATCH_TICKET_CANCELLED);
          });

          test('normal-match durable normalization preserves valid state and strips malformed entries', () => {
            const queue = normalizeMatchQueue({
              nextSequence: 7,
              tickets: {
                'ticket-1': { clientId: 'client-1', secret: matchSecret(1), status: MATCH_TICKET_WAITING, sequence: 3, matchId: '' },
                'bad id': { clientId: '!', secret: 'short', status: 'BOGUS', sequence: 0 },
              },
              idempotency: { 'idem-key-00000001': 'ticket-1', bad: 'missing' },
              matches: {},
            });
            assert.equal(queue.nextSequence, 7);
            assert.deepEqual(Object.keys(queue.tickets), ['ticket-1']);
            assert.deepEqual(queue.idempotency, { 'idem-key-00000001': 'ticket-1' });
          });
          '''.replace('          ', '')
          tests = replace_once(tests, 'function probeRoomCode(seed) {', unit_tests + '\n\nfunction probeRoomCode(seed) {', 'relay-core unit insertion')

          live_test = r'''

          async function publicMatchRequest(pagesUrl, queue, matchOp, body) {
            const url = new URL('/ws', pagesUrl);
            url.searchParams.set('matchOp', matchOp);
            url.searchParams.set('queue', queue);
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            let payload = null;
            try { payload = await response.json(); } catch {}
            return { status: response.status, payload };
          }

          test('live public Pages normal-match HTTP creates, matches, authenticates and cancels truthfully', { skip: !process.env.GAMEROAD_PUBLIC_WS_PROBE_URL }, async () => {
            const pagesUrl = process.env.GAMEROAD_PUBLIC_WS_PROBE_URL;
            const runIdentity = `${process.env.GITHUB_RUN_ID || 'probe'}:${process.env.GITHUB_RUN_ATTEMPT || '1'}:${process.env.GITHUB_SHA || ''}`;
            const queue = `normal-${probeRoomCode(`match:${runIdentity}`)}`;
            const peers = [];
            for (let i = 1; i <= 4; i += 1) {
              const created = await publicMatchRequest(pagesUrl, queue, 'create', {
                clientId: `public-client-${i}-${probeRoomCode(`${runIdentity}:${i}`)}`,
                idempotencyKey: `public-idem-${i}-${probeRoomCode(`idem:${runIdentity}:${i}`)}`,
              });
              assert.equal(created.status, 200);
              assert.equal(created.payload?.ok, true);
              assert.ok(created.payload?.ticket?.ticketId);
              assert.ok(created.payload?.secret);
              peers.push(created.payload);
              if (i === 1) {
                const duplicate = await publicMatchRequest(pagesUrl, queue, 'create', {
                  clientId: `public-client-${i}-${probeRoomCode(`${runIdentity}:${i}`)}`,
                  idempotencyKey: `public-idem-${i}-${probeRoomCode(`idem:${runIdentity}:${i}`)}`,
                });
                assert.equal(duplicate.status, 200);
                assert.equal(duplicate.payload.ticket.ticketId, created.payload.ticket.ticketId);
                assert.equal(duplicate.payload.secret, created.payload.secret);
                assert.equal(duplicate.payload.idempotent, true);
              }
            }

            const sessions = [];
            for (const peer of peers) {
              const status = await publicMatchRequest(pagesUrl, queue, 'status', {
                ticketId: peer.ticket.ticketId,
                secret: peer.secret,
              });
              assert.equal(status.status, 200);
              assert.equal(status.payload?.ticket?.status, 'MATCHED');
              assert.ok(status.payload?.session?.sessionId);
              sessions.push(status.payload.session);
            }
            assert.equal(new Set(sessions.map((session) => session.sessionId)).size, 1);
            assert.deepEqual([...sessions.map((session) => session.slot)].sort((a, b) => a - b), [0, 1, 2, 3]);

            const badSecret = await publicMatchRequest(pagesUrl, queue, 'status', {
              ticketId: peers[0].ticket.ticketId,
              secret: `${peers[0].secret}bad`,
            });
            assert.equal(badSecret.status, 403);
            assert.equal(badSecret.payload?.ok, false);

            const cancelQueue = `cancel-${probeRoomCode(`cancel:${runIdentity}`)}`;
            const first = await publicMatchRequest(pagesUrl, cancelQueue, 'create', {
              clientId: `cancel-client-${probeRoomCode(runIdentity)}`,
              idempotencyKey: `cancel-idem-${probeRoomCode(runIdentity)}`,
            });
            assert.equal(first.status, 200);
            const cancelled = await publicMatchRequest(pagesUrl, cancelQueue, 'cancel', {
              ticketId: first.payload.ticket.ticketId,
              secret: first.payload.secret,
            });
            assert.equal(cancelled.status, 200);
            assert.equal(cancelled.payload?.terminal, 'CANCELLED');
            const cancelledRetry = await publicMatchRequest(pagesUrl, cancelQueue, 'create', {
              clientId: `cancel-client-${probeRoomCode(runIdentity)}`,
              idempotencyKey: `cancel-idem-${probeRoomCode(runIdentity)}`,
            });
            assert.equal(cancelledRetry.payload?.ticket?.ticketId, first.payload.ticket.ticketId);
            assert.equal(cancelledRetry.payload?.ticket?.status, 'CANCELLED');
            const fresh = await publicMatchRequest(pagesUrl, cancelQueue, 'create', {
              clientId: `cancel-client-${probeRoomCode(runIdentity)}`,
              idempotencyKey: `cancel-fresh-${probeRoomCode(runIdentity)}`,
            });
            assert.equal(fresh.status, 200);
            assert.notEqual(fresh.payload?.ticket?.ticketId, first.payload.ticket.ticketId);
            assert.equal(fresh.payload?.ticket?.status, 'WAITING');
          });
          '''.replace('          ', '')
          live_anchor = "test('live public Pages friend-room WebSocket routes and reconnects', { skip: !process.env.GAMEROAD_PUBLIC_WS_PROBE_URL }, async () => {"
          tests = replace_once(tests, live_anchor, live_test + '\n\n' + live_anchor, 'relay-core live insertion')
          write(test_path, tests)
          PY

      - name: Run bounded R3 tests and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --test deploy/cloudflare/tests/relay-core.test.mjs
          node --check deploy/cloudflare/relay/src/relay-core.mjs
          node --check deploy/cloudflare/relay/src/relay-worker.mjs
          node --check deploy/cloudflare/functions/ws.js
          git diff --check

      - name: Verify exact changed-path allowlist and remove executor
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(deploy/cloudflare/relay/src/relay-core\.mjs|deploy/cloudflare/relay/src/relay-worker\.mjs|deploy/cloudflare/relay/wrangler\.toml|deploy/cloudflare/functions/ws\.js|deploy/cloudflare/wrangler\.pages\.toml|deploy/cloudflare/tests/relay-core\.test\.mjs|\.github/workflows/zz-temp-normalmatch-r3-patch\.yml)$'
          bad="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$bad"
            exit 1
          fi
          git rm .github/workflows/zz-temp-normalmatch-r3-patch.yml
          bad="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            echo "Unexpected changed paths after executor removal:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit durable R3 patch and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/cloudflare/relay/src/relay-core.mjs \
                  deploy/cloudflare/relay/src/relay-worker.mjs \
                  deploy/cloudflare/relay/wrangler.toml \
                  deploy/cloudflare/functions/ws.js \
                  deploy/cloudflare/wrangler.pages.toml \
                  deploy/cloudflare/tests/relay-core.test.mjs \
                  .github/workflows/zz-temp-normalmatch-r3-patch.yml
          git commit -m 'R3: implement server-authoritative normal-match transport'
          git push origin HEAD:work/normalmatch-r3-public-transport
