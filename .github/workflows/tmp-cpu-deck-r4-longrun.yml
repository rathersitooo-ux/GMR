name: Temporary CPU Deck R4 Long-Run

on:
  push:
    branches:
      - work/BROWSER-CPU-DECK-RESERVATION-CONSISTENCY-001-R3-LONGRUN-20260816T2316-SOL-Q7N4V2
    paths:
      - .github/workflows/tmp-cpu-deck-r4-longrun.yml

permissions:
  contents: read

jobs:
  cpu-longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium
      - name: Write temporary legal-deck variant probe
        run: |
          cat > playwright.cpu-deck-r4.tmp.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: 'cpu-deck-r4.tmp.spec.mjs',
            timeout: 120000,
            fullyParallel: true,
            workers: 8,
            use: { baseURL: 'http://127.0.0.1:4173', headless: true },
            webServer: { command: 'python3 -m http.server 4173 --directory browser', url: 'http://127.0.0.1:4173/GAMEROAD.html', reuseExistingServer: false, timeout: 30000 },
            projects: [{ name: 'chromium', use: { browserName: 'chromium' } }]
          });
          EOF
          cat > tests/cpu-deck-r4.tmp.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          function seededShuffle(values, seed) {
            const a = [...values];
            let s = seed >>> 0;
            const rand = () => {
              s = (s + 0x6D2B79F5) >>> 0;
              let t = s;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
            for (let i = a.length - 1; i > 0; i -= 1) {
              const j = Math.floor(rand() * (i + 1));
              [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
          }

          async function prepare(page, gameSeed, deckSeed) {
            await page.addInitScript((seedValue) => {
              let state = seedValue >>> 0;
              Math.random = () => {
                state = (state + 0x6D2B79F5) >>> 0;
                let t = state;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }, gameSeed);
            await page.goto('/GAMEROAD.html');
            await page.waitForFunction(() => !!window.__GAMEROAD_TEST__ && Array.isArray(window.__CARD_DATA__));
            const pools = await page.evaluate(() => {
              const api = window.__GAMEROAD_TEST__;
              const publicMain = new Set(api.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
              const standard = window.__CARD_DATA__.filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)));
              return {
                nonRoyal: standard.filter((card) => !api.isRoyalCard(card.id)).map((card) => card.id),
                J: standard.filter((card) => String(card.rank) === 'J').map((card) => card.id),
                Q: standard.filter((card) => String(card.rank) === 'Q').map((card) => card.id),
                K: standard.filter((card) => String(card.rank) === 'K').map((card) => card.id)
              };
            });
            const nonRoyal = seededShuffle(pools.nonRoyal, deckSeed).slice(0, 37);
            const j = pools.J[deckSeed % pools.J.length];
            const q = pools.Q[Math.floor(deckSeed / 4) % pools.Q.length];
            const k = pools.K[Math.floor(deckSeed / 16) % pools.K.length];
            const ids = [...nonRoyal, j, q, k];
            const prep = await page.evaluate((ids) => {
              const api = window.__GAMEROAD_TEST__;
              const draft = api.deckSetDraft(ids, []);
              const validation = api.deckValidate(api.state.deckDraft, { forBattle: true });
              const committed = draft.ok && validation.ok ? api.deckCommit() : false;
              const saved = api.deckSaved().main;
              return { draft, validation, committed: !!committed, savedLength: saved.length, savedIds: [...saved] };
            }, ids);
            expect(prep.draft.ok, JSON.stringify(prep)).toBe(true);
            expect(prep.validation.ok, JSON.stringify(prep)).toBe(true);
            expect(prep.committed, JSON.stringify(prep)).toBe(true);
            expect(prep.savedLength).toBe(40);
            return prep.savedIds;
          }

          async function run(page, savedIds) {
            return page.evaluate(async (savedIds) => {
              const api = window.__GAMEROAD_TEST__;
              const m = api.start('4p', 'honey_hunt');
              if (!m) return { startFailed: true };
              api.battlePresentationFast(true);
              api.state.settings.reduceMotion = true;
              api.state.settings.lowPerf = true;
              const sourceMatch = m.players.every((p) => p.sourceDeckSize === savedIds.length && p.sourceDeckIds.length === savedIds.length && p.sourceDeckIds.every((id, i) => id === savedIds[i]));
              const cpuSourceMatch = m.players.filter((p) => !p.human).every((p) => p.sourceDeckSize === savedIds.length && p.sourceDeckIds.length === savedIds.length && p.sourceDeckIds.every((id, i) => id === savedIds[i]));
              const conservationAtStart = api.cardConservation();
              let error = null;
              let result = false;
              try { result = await api.autoToResult(260); } catch (e) { error = String(e?.message || e); }
              return { sourceMatch, cpuSourceMatch, conservationAtStart, conservationAtResult: api.cardConservation(), error, result, rounds: api.state.match?.round ?? null, savedLength: api.deckSaved().main.length };
            }, savedIds);
          }

          for (let caseNo = 0; caseNo < 64; caseNo += 1) {
            test(`legal variant ${caseNo}`, async ({ page }) => {
              const gameSeed = 20001 + caseNo;
              const deckSeed = 30001 + caseNo;
              const savedIds = await prepare(page, gameSeed, deckSeed);
              const result = await run(page, savedIds);
              const record = { caseNo, gameSeed, deckSeed, savedIds, ...result };
              console.log('CPUDECK_R4_VARIANT ' + JSON.stringify(record));
              expect(result.startFailed, JSON.stringify(record)).not.toBe(true);
              expect(result.sourceMatch, JSON.stringify(record)).toBe(true);
              expect(result.cpuSourceMatch, JSON.stringify(record)).toBe(true);
              expect(result.conservationAtStart, JSON.stringify(record)).toBe(true);
              expect(result.conservationAtResult, JSON.stringify(record)).toBe(true);
              expect(result.error, JSON.stringify(record)).toBeNull();
              expect(result.result, JSON.stringify(record)).toBe(true);
              expect(result.savedLength, JSON.stringify(record)).toBe(40);
            });
          }
          EOF
      - name: Run 64 deterministic legal deck variants
        run: npx playwright test --config=playwright.cpu-deck-r4.tmp.config.mjs --reporter=line
      - name: Remove runner-local probe files
        if: always()
        run: rm -f playwright.cpu-deck-r4.tmp.config.mjs tests/cpu-deck-r4.tmp.spec.mjs
