        await attachStateScreenshot(page, testInfo, `${evidencePrefix}-card-presentation-fallback-${cardPresentationFallbacks}`);
"""
          assert browser.count(old_capture) == 1
          browser = browser.replace(old_capture, new_capture, 1)

          old_expect = """  expect(cardPresentationFallbacks, 'accepted/public Battle resolution mounts the current CardPRES fallback on the visible production resolution surface').toBeGreaterThan(0);
"""
          new_expect = old_expect + "  expect(conveyorEnvironmentFrames, 'accepted/public Battle resolution advances the finite production conveyor environment').toBeGreaterThan(0);\n"
          assert browser.count(old_expect) == 1
          browser = browser.replace(old_expect, new_expect, 1)

          old_annotation = """    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, cardPresentationFallbacks=${cardPresentationFallbacks}, result=${roundsText}` ,
