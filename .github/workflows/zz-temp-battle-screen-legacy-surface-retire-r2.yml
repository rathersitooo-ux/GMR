name: temp battle screen legacy surface retire r2

on:
  push:
    branches:
      - sol/battle-screen-legacy-surface-retire-r2-20260913

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-screen-legacy-surface-retire-r2-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact bounded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-screen-runtime-mount.mjs')
          test_path = Path('tests/battle-screen-runtime-mount.test.mjs')
          runtime = runtime_path.read_text(encoding='utf-8')
          lines = runtime.splitlines(keepends=True)

          def one(prefix):
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'expected exactly one anchor for {prefix!r}, got {len(hits)}')
              return hits[0]

          shell_i = one('[${SHELL_ATTR}="1"] #battlePhaseSurface{position:absolute;inset:0;z-index:3;overflow:hidden;background:')
          before_i = one('[${SHELL_ATTR}="1"] #battlePhaseSurface::before{content:"";position:absolute;')
          after_i = one('[${SHELL_ATTR}="1"] #battlePhaseSurface::after{content:"";position:absolute;')

          lines[shell_i] = '[${SHELL_ATTR}="1"] #battlePhaseSurface{position:static!important;inset:auto!important;z-index:auto!important;overflow:visible!important;background:none!important;pointer-events:none!important;display:contents}\n[${SHELL_ATTR}="1"] #battlePhaseSurface[hidden]{display:none!important}\n'
          lines[before_i] = '[${SHELL_ATTR}="1"] #battlePhaseSurface::before,[${SHELL_ATTR}="1"] #battlePhaseSurface::after{content:none!important;display:none!important}\n'
          lines[after_i] = ''
          patched_runtime = ''.join(lines)

          if '#battlePhaseSurface{position:absolute;inset:0;z-index:3;overflow:hidden;background:' in patched_runtime:
              raise SystemExit('legacy fullscreen battlePhaseSurface signature remains')
          if '#battlePhaseSurface::before{content:"";position:absolute;' in patched_runtime:
              raise SystemExit('legacy phase pseudo background remains')
          runtime_path.write_text(patched_runtime, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          anchor = "assert.ok(runtimeStyle.textContent.includes('background:transparent;color:inherit;font-family:inherit;pointer-events:none'));\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor count={test.count(anchor)}')
          addition = (
              "assert.ok(runtimeStyle.textContent.includes('#battlePhaseSurface{position:static!important;inset:auto!important;z-index:auto!important;overflow:visible!important;background:none!important;pointer-events:none!important;display:contents}'));\n"
              "assert.ok(runtimeStyle.textContent.includes('#battlePhaseSurface[hidden]{display:none!important}'));\n"
              "assert.ok(runtimeStyle.textContent.includes('[data-gr-battle-screen=\"1\"] #battlePhaseSurface::before,[data-gr-battle-screen=\"1\"] #battlePhaseSurface::after{content:none!important;display:none!important}'));\n"
              "assert.equal(runtimeStyle.textContent.includes('#battlePhaseSurface{position:absolute;inset:0;z-index:3;overflow:hidden;background:'), false);\n"
              "assert.equal(runtimeStyle.textContent.includes('#battlePhaseSurface::before{content:\"\";position:absolute;'), false);\n"
          )
          test = test.replace(anchor, anchor + addition)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Focused verification
        run: |
          node --check browser/battle-screen-runtime-mount.mjs
          node --test tests/battle-screen-runtime-mount.test.mjs
      - name: Final scope fence and commit
        shell: bash
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'browser/battle-screen-runtime-mount.mjs',
              'tests/battle-screen-runtime-mount.test.mjs',
              '.github/workflows/zz-temp-battle-screen-legacy-surface-retire-r2.yml',
              'data/preaction-authorizations/BATTLE-SCREEN-LEGACY-SURFACE-RETIRE-R2-20260913T0348-SOL.json',
          }
          out = subprocess.check_output(['git','status','--porcelain=v1'], text=True)
          seen = {line[3:] for line in out.splitlines() if line.strip()}
          extra = seen - allowed
          if extra:
              raise SystemExit(f'out-of-scope paths: {sorted(extra)}')
          PY
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
          git rm .github/workflows/zz-temp-battle-screen-legacy-surface-retire-r2.yml
          git rm data/preaction-authorizations/BATTLE-SCREEN-LEGACY-SURFACE-RETIRE-R2-20260913T0348-SOL.json
          git config user.name "gameroad-bounded-writer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Battle: retire legacy fullscreen phase surface"
          git push origin HEAD:sol/battle-screen-legacy-surface-retire-r2-20260913
