name: temp Setup short-landscape R2 patch
on:
  push:
    branches:
      - work/setup-shortland-cta-r2-20260905
    paths:
      - .github/workflows/temp-setup-shortland-r2-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/setup-shortland-cta-r2-20260905
          fetch-depth: 0
      - name: Move existing field picker into unused short-landscape left area
        shell: python
        run: |
          from pathlib import Path
          p = Path('browser/slidepad-slot-roll-core.mjs')
          s = p.read_text()
          old = '@media(orientation:landscape) and (max-height:420px) and (max-width:900px){#${FIELD_HOST_ID}{margin:4px 0 5px;padding:5px 7px;border-radius:10px}#${FIELD_HOST_ID} .grFieldHead{margin-bottom:4px}#${FIELD_HOST_ID} .grFieldChoices{padding-bottom:2px}#${FIELD_HOST_ID} .grFieldChoice{min-height:46px}#${FIELD_HOST_ID} .grFieldPreview{height:18px}#${FIELD_HOST_ID} .grFieldText{padding:3px 5px 4px}#${FIELD_HOST_ID} .grFieldRole{display:none}}'
          new = '@media(orientation:landscape) and (max-height:420px) and (max-width:900px){#${FIELD_HOST_ID}{position:fixed;left:16px;top:58px;width:calc(46vw - 24px);max-width:290px;box-sizing:border-box;z-index:4;margin:0;padding:6px 7px;border-radius:10px}#${FIELD_HOST_ID} .grFieldHead{margin-bottom:5px}#${FIELD_HOST_ID} .grFieldChoices{grid-auto-columns:minmax(92px,1fr);padding-bottom:2px}#${FIELD_HOST_ID} .grFieldChoice{min-height:50px}#${FIELD_HOST_ID} .grFieldPreview{height:20px}#${FIELD_HOST_ID} .grFieldText{padding:3px 5px 4px}#${FIELD_HOST_ID} .grFieldRole{display:none}}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exact short-landscape rule once, got {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Verify bounded delta
        run: |
          git diff --check
          git diff -- browser/slidepad-slot-roll-core.mjs
          test "$(git diff --name-only | tr -d '\r')" = "browser/slidepad-slot-roll-core.mjs"
      - name: Commit product repair and remove executor
        run: |
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git add browser/slidepad-slot-roll-core.mjs
          git rm .github/workflows/temp-setup-shortland-r2-patch.yml
          git commit -m "Setup: use short-landscape empty side for field picker"
          git push origin HEAD:work/setup-shortland-cta-r2-20260905
