name: TEMP Battle Home Refresh R1

on:
  push:
    branches:
      - sol/battle-final-qa-home-refresh-r1-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Install temporary Home refresh patch executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-final-qa-home-refresh-r1-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact scoped patch
        run: python3 tools/temp-battle-home-refresh-r1.py
      - name: Verify only authorized product files changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' browser/home-boot-runtime-base-r3.mjs tests/home-boot-presentation.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: Run focused Home tests
        run: node --test tests/home-boot-presentation.test.mjs tests/home-boot-runtime-base-r3.test.mjs
      - name: Verify syntax
        run: node --check browser/home-boot-runtime-base-r3.mjs
      - name: Commit scoped product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/home-boot-runtime-base-r3.mjs tests/home-boot-presentation.test.mjs
          git commit -m 'Home: stop redundant observed attribute refresh writes'
          git push origin HEAD:sol/battle-final-qa-home-refresh-r1-20260909
