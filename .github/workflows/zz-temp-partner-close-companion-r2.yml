name: TEMP Partner close-companion R2

on:
  push:
    branches:
      - sol/saasuna-close-companion-r2-20260908

permissions:
  contents: write

jobs:
  patch-test-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/saasuna-close-companion-r2-20260908
      - name: Fail closed on exact authorized history and source blobs
        shell: bash
        run: |
          set -euo pipefail
          BASE='5e2730ce6ce772769fd02efeaaa3da6b61157320'
          MANIFEST='data/preaction-authorizations/PARTNER-CLOSE-COMPANION-R2-20260908T1125-SOL-N7Q4M8.json'
          test "$(git rev-parse HEAD~2)" = "$BASE"
          test "$(git diff --name-only HEAD~2..HEAD^ | tr -d '\r')" = "$MANIFEST"
          test "$(git diff --name-only HEAD^..HEAD | tr -d '\r')" = '.github/workflows/zz-temp-partner-close-companion-r2.yml'
          test "$(git hash-object browser/partner-conversation-core.mjs)" = '7ec1af5ffa9f8255a4b64eb5ecc2905d999a59a8'
          test "$(git hash-object tests/partner-conversation-core.test.mjs)" = '9ec21f59e8945eb8c13d8d15321ec19d8bb51360'
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = 'df3e214fdedc336d004734d0eab55db6e2653e65'
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = '70c2663cbf874dad8acdb4bf68c2d545e41b1308'
          ! grep -q 'CLOSE_COMPANION_GUIDANCE' browser/partner-conversation-core.mjs
      - name: Apply approved donor, focused assertion, and package provenance pin
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin b149a7a4fdbce923399d6b0998aeb6ce2aaecdd0
          git show b149a7a4fdbce923399d6b0998aeb6ce2aaecdd0:browser/partner-conversation-core.mjs > /tmp/partner-conversation-core.mjs
          test "$(git hash-object /tmp/partner-conversation-core.mjs)" = 'eddb0df3ef047c2abb0c1100760400af55893f17'
          cp /tmp/partner-conversation-core.mjs browser/partner-conversation-core.mjs
          python3 - <<'PY'
          from pathlib import Path
          test_path = Path('tests/partner-conversation-core.test.mjs')
          s = test_path.read_text()
          marker = "provider request carries close-companion fictional exaggeration guidance without fabricated-history license"
          if marker in s:
              raise SystemExit('focused test already present')
          addition = r'''

          test('provider request carries close-companion fictional exaggeration guidance without fabricated-history license', async () => {
            let seen = null;
            const output = await runSaasunaConversationTurn(base(), {
              provider: {
                async sendMessage(request) {
                  seen = request;
                  return {
                    kind: 'utterance_candidate',
                    partnerId: request.partnerId,
                    dialogueVersion: request.dialogueVersion,
                    sourceId: request.sourceId,
                    text: '了解。',
                  };
                },
              },
            });
            assert.equal(output.ok, true);
            assert.ok(Array.isArray(seen?.personaGuidance));
            const guidance = seen.personaGuidance.join('\n');
            assert.match(guidance, /距離の近い相棒/);
            assert.match(guidance, /都合の良い彼女|ラノベ/);
            assert.match(guidance, /利用者の心理/);
            assert.match(guidance, /こじつけ/);
            assert.match(guidance, /固定台詞/);
          });
          '''
          test_path.write_text(s.rstrip() + addition + '\n')

          build_path = Path('deploy/cloudflare/scripts/build.mjs')
          b = build_path.read_text()
          old = '7ec1af5ffa9f8255a4b64eb5ecc2905d999a59a8'
          new = 'eddb0df3ef047c2abb0c1100760400af55893f17'
          if b.count(old) != 1:
              raise SystemExit(f'expected exactly one old Partner core package pin, found {b.count(old)}')
          build_path.write_text(b.replace(old, new))
          PY
          test "$(git hash-object browser/partner-conversation-core.mjs)" = 'eddb0df3ef047c2abb0c1100760400af55893f17'
          grep -q 'CLOSE_COMPANION_GUIDANCE' browser/partner-conversation-core.mjs
          grep -q 'eddb0df3ef047c2abb0c1100760400af55893f17' deploy/cloudflare/scripts/build.mjs
      - name: Focused conversation and public-package tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/partner-conversation-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
      - name: Commit only validated product/package delta and self-clean transient files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-partner-close-companion-r2.yml
          rm data/preaction-authorizations/PARTNER-CLOSE-COMPANION-R2-20260908T1125-SOL-N7Q4M8.json
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf 'validated changed paths:\n%s\n' "${changed[*]}"
          for p in "${changed[@]}"; do
            case "$p" in
              browser/partner-conversation-core.mjs|tests/partner-conversation-core.test.mjs|deploy/cloudflare/scripts/build.mjs|.github/workflows/zz-temp-partner-close-companion-r2.yml|data/preaction-authorizations/PARTNER-CLOSE-COMPANION-R2-20260908T1125-SOL-N7Q4M8.json) ;;
              *) echo "unexpected changed path: $p" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Partner: サースナーを距離の近い相棒として会話させる'
          git push origin HEAD:sol/saasuna-close-companion-r2-20260908
