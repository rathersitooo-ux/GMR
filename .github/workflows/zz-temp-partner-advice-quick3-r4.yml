name: TEMP Partner Advice Quick3 Direct Writer R4

on:
  push:
    branches:
      - sol/partner-advice-quick3-r1-20260913
    paths:
      - .github/workflows/zz-temp-partner-advice-quick3-r4.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/partner-advice-quick3-r1-20260913
          fetch-depth: 0
      - name: Patch clean product branch from bounded R2 program
        shell: bash
        run: |
          set -euo pipefail
          git show origin/sol/partner-advice-quick3-r1-20260913:.github/workflows/zz-temp-partner-advice-quick3-r2.yml > /tmp/quick3-r2.yml
          git checkout -B quick3-r4 origin/sol/partner-advice-quick3-r4-20260914
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/quick3-r2.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          replacements = []

          old_projection = "source = replace_once(source, projection_old, projection_new, 'quick3-projection')"
          new_projection = '''projection_start_token = "    const projection = projectPartnerAdviceChatPresentation({"
          projection_end_token = "    const tutorialStatus = tutorialReplay.refresh();"
          projection_start = source.find(projection_start_token)
          projection_end = source.find(projection_end_token, projection_start)
          if projection_start < 0 or projection_end < 0 or source.find(projection_start_token, projection_start + 1) >= 0:
              raise RuntimeError('quick3-projection: unique structural interval not found')
          source = source[:projection_start] + projection_new + source[projection_end:]'''
          replacements.append((old_projection, new_projection, 'projection'))

          old_events = "source = replace_once(source, tutorial_choices_anchor, events + tutorial_choices_anchor, 'quick3-events')"
          new_events = '''first_tutorial_choices = source.find(tutorial_choices_anchor)
          second_tutorial_choices = source.find(tutorial_choices_anchor, first_tutorial_choices + len(tutorial_choices_anchor)) if first_tutorial_choices >= 0 else -1
          third_tutorial_choices = source.find(tutorial_choices_anchor, second_tutorial_choices + len(tutorial_choices_anchor)) if second_tutorial_choices >= 0 else -1
          if first_tutorial_choices < 0 or second_tutorial_choices < 0 or third_tutorial_choices >= 0:
              raise RuntimeError('quick3-events: expected exactly two tutorialChoices anchors')
          source = source[:second_tutorial_choices] + events + source[second_tutorial_choices:]'''
          replacements.append((old_events, new_events, 'events'))

          old_switch = "source = replace_once(source, role_switch_old, role_switch_new, 'quick3-partner-switch-clear')"
          new_switch = '''switch_start_token = "    switchButton.addEventListener('click', () => {"
          switch_end_token = "    });"
          switch_start = source.find(switch_start_token)
          switch_end = source.find(switch_end_token, switch_start)
          if switch_start < 0 or switch_end < 0 or source.find(switch_start_token, switch_start + 1) >= 0:
              raise RuntimeError('quick3-partner-switch-clear: unique switch handler not found')
          switch_segment = source[switch_start:switch_end]
          switch_needle = "      lastCharacterReaction = null;\\n"
          if switch_segment.count(switch_needle) != 1:
              raise RuntimeError('quick3-partner-switch-clear: reaction-clear anchor not unique in switch handler')
          switch_segment = switch_segment.replace(switch_needle, switch_needle + "      quickRoutes.clear();\\n", 1)
          source = source[:switch_start] + switch_segment + source[switch_end:]'''
          replacements.append((old_switch, new_switch, 'switch'))

          old_delegate = "source = replace_once(source, delegate_receipt_old, delegate_receipt_new, 'quick3-delegate-clear')"
          new_delegate = '''commit_token = "      const receipt = quickReply.commit(replyId);\\n"
          commit_pos = source.find(commit_token)
          if commit_pos < 0 or source.find(commit_token, commit_pos + 1) >= 0:
              raise RuntimeError('quick3-delegate-clear: unique commit anchor not found')
          receipt_needle = "      lastReceipt = receipt;\\n"
          receipt_pos = source.find(receipt_needle, commit_pos)
          if receipt_pos < 0:
              raise RuntimeError('quick3-delegate-clear: receipt assignment not found after commit')
          next_commit = source.find(commit_token, commit_pos + 1)
          if next_commit >= 0 and receipt_pos > next_commit:
              raise RuntimeError('quick3-delegate-clear: receipt assignment escaped commit handler')
          source = source[:receipt_pos] + "      quickRoutes.clear();\\n" + source[receipt_pos:]'''
          replacements.append((old_delegate, new_delegate, 'delegate'))

          for old, new, label in replacements:
              if script.count(old) != 1:
                  raise RuntimeError(f'R2 {label} patch statement count={script.count(old)}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<quick3-r4-product-patch>', 'exec'), {})
          PY
      - name: Verify against exact main baseline and build package
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/partner-advice-runtime-mount.mjs
          git worktree add --detach /tmp/quick3-main origin/main
          set +e
          (cd /tmp/quick3-main && node --test tests/partner-advice-runtime-mount.test.mjs) > /tmp/main-partner.tap 2>&1
          main_rc=$?
          node --test tests/partner-advice-runtime-mount.test.mjs > /tmp/quick3-partner.tap 2>&1
          quick_rc=$?
          set -e
          cat /tmp/main-partner.tap
          cat /tmp/quick3-partner.tap
          python - <<'PY'
          from pathlib import Path
          import re

          def failures(path):
              text = Path(path).read_text()
              return [m.group(1).strip() for m in re.finditer(r'^\s*not ok \d+ - (.+?)\s*$', text, re.M)]

          expected = [
              'eligible Tutorial experience is a natural Saasuna conversation and adapts only after a known game is chosen',
              'contextual help keeps canonical text before a profile is ready and uses the selected-game bridge afterward',
          ]
          main_fail = failures('/tmp/main-partner.tap')
          quick_fail = failures('/tmp/quick3-partner.tap')
          if main_fail != expected:
              raise SystemExit(f'UNEXPECTED_MAIN_BASELINE_FAILURES={main_fail!r}')
          if quick_fail != expected:
              raise SystemExit(f'QUICK3_REGRESSION_FAILURES={quick_fail!r}')
          quick_text = Path('/tmp/quick3-partner.tap').read_text()
          required_passes = [
              'Partner Advice quick3 exposes exactly three fixed route families with Idea enabled by default',
              'Partner Advice composite route speaks registered parts in order and drops stale public-state continuation',
              'default Situation route summarizes existing viewer-safe log rows and public lane values only',
              'Idea OFF suppresses only Idea while Casual and Situation remain independent and no gameplay authority is owned',
              'quick3 UI keeps delegation separate and does not create a permanent fourth 3-options route',
          ]
          for name in required_passes:
              if not re.search(r'^\s*ok \d+ - ' + re.escape(name) + r'\s*$', quick_text, re.M):
                  raise SystemExit(f'MISSING_QUICK3_PASS={name}')
          print('BASELINE_EQUIVALENT_FAILURE_SET=PASS')
          print('QUICK3_FOCUSED_5_OF_5=PASS')
          PY
          [[ "$main_rc" -ne 0 ]]
          [[ "$quick_rc" -ne 0 ]]
          node --test deploy/cloudflare/tests/build.test.mjs
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(browser/partner-advice-runtime-mount.mjs deploy/cloudflare/tests/build.test.mjs tests/partner-advice-runtime-mount.test.mjs)
          [[ "${#changed[@]}" -eq 3 ]]
          [[ "${changed[*]}" == "${expected[*]}" ]]
          ! grep -R "zz-temp-partner-advice-quick3-r4" -n browser tests deploy/cloudflare/tests
      - name: Commit only product files to clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-sol"
          git config user.email "gameroad-sol@users.noreply.github.com"
          git add browser/partner-advice-runtime-mount.mjs tests/partner-advice-runtime-mount.test.mjs deploy/cloudflare/tests/build.test.mjs
          git diff --cached --quiet && { echo 'No product delta'; exit 1; }
          git commit -m "Partner: 既定クイック3入口を実装"
          git push origin HEAD:refs/heads/sol/partner-advice-quick3-r4-20260914
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
