name: TEMP Battle final QA R6B donor import

on:
  push:
    branches:
      - sol/battle-final-qa-r6b-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'rathersitooo-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R6B
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import W46 donor and remove false Battle precondition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pull/1413/head:r6b-donor
          git checkout r6b-donor -- .github/workflows/browser-full-interaction.yml
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/browser-full-interaction.yml')
          s = p.read_text(encoding='utf-8')

          bad = "            expect(await page.locator('section[data-screen=\"battle\"]' ).count(), 'Battle screen exists').toBeGreaterThan(0);\n"
          # Donor has no space before ). Keep both exact spellings fail-closed.
          exact = "            expect(await page.locator('section[data-screen=\"battle\"]').count(), 'Battle screen exists').toBeGreaterThan(0);\n"
          count = s.count(exact)
          if count != 1:
              raise SystemExit(f'expected exactly one premature Battle assertion, found {count}')
          s = s.replace(exact, '', 1)

          donor_manifest = "          OBSERVED_BUILD_ID=\"$(MANIFEST=\"$MANIFEST\" node -e \"const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));\" < \"$MANIFEST\")\""
          current_manifest = "          OBSERVED_BUILD_ID=\"$(MANIFEST=\"$MANIFEST\" node -e \"const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));\")\""
          if donor_manifest not in s:
              raise SystemExit('donor manifest-binding line missing')
          s = s.replace(donor_manifest, current_manifest, 1)

          required = [
              'enterVisibleBasicBattle',
              'desktop-1280x720',
              'phone-390x844',
              'short-landscape-667x375',
              'Run WorkUnit46 Battle final acceptance locally',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'W46 donor contract missing: {missing}')
          if 'Battle screen exists' in s:
              raise SystemExit('premature Battle assertion still present')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/zz-temp-battle-final-qa-r6b.yml
          git rm data/preaction-authorizations/BATTLE-FINAL-QA-R6B-20260909T1725-SOL-Q8M4N9.json
          git config user.name rathersitooo-ux
          git config user.email rathersitooo@gmail.com
          git add .github/workflows/browser-full-interaction.yml
          git diff --cached --name-only
          git commit -m "test: make Battle acceptance follow visible player path"
          git push origin HEAD:sol/battle-final-qa-r6b-20260909
