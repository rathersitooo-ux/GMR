name: BOARD-FACILITY R25 exact-base production mount executor

on:
  push:
    branches:
      - 'work/board-facility-r25-production-mount-20260819'
    paths:
      - '.github/workflows/board-facility-r25-executor.yml'

permissions:
  contents: write

jobs:
  exact-base-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: work/board-facility-r25-production-mount-20260819
          fetch-depth: 0

      - name: Verify exact main parent and patch bounded HTML slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9099b3b1ed0a485bb7109756237d52552d89109c"
          test "$(git hash-object browser/GAMEROAD.html)" = "b7ec934042afefccced34cc7bc477311a8e6df6e"
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          text = p.read_text(encoding='utf-8')
          marker = 'gameroad-board-facility-runtime-production-r25'
          if marker in text or 'gameroad-board-facility-classic-r25' in text:
              raise SystemExit('BOARD_FACILITY_R25_ALREADY_MOUNTED')
          anchor = '\n</body></html>'
          if text.count(anchor) != 1:
              raise SystemExit(f'BOARD_FACILITY_R25_ANCHOR_COUNT:{text.count(anchor)}')
          block = '''

<script src="./board-facility-state-core.classic.js" id="gameroad-board-facility-classic-r25"></script>
<script type="module" id="gameroad-board-facility-runtime-production-r25">
import { mountBoardFacilityRuntime } from "./board-facility-runtime-mount.mjs";
mountBoardFacilityRuntime(globalThis).catch((error) => {
  console.error("BOARD_FACILITY_RUNTIME_MOUNT_FAILED", error);
});
</script>'''
          p.write_text(text.replace(anchor, block + anchor, 1), encoding='utf-8')
          PY
          test "$(grep -c 'gameroad-board-facility-runtime-production-r25' browser/GAMEROAD.html)" = "1"
          test "$(grep -c 'gameroad-board-facility-classic-r25' browser/GAMEROAD.html)" = "1"
          git diff --check -- browser/GAMEROAD.html

      - name: Commit product delta and self-remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-r25-executor"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/board-facility-r25-executor.yml
          git add browser/GAMEROAD.html
          git diff --cached --name-only | sort > /tmp/paths
          printf '%s\n' '.github/workflows/board-facility-r25-executor.yml' 'browser/GAMEROAD.html' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/paths
          git commit -m "BOARD-FACILITY R25: mount runtime in production Browser"
          git push origin HEAD:work/board-facility-r25-production-mount-20260819
