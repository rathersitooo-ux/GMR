name: TEMP Battle Hand3 SlidePad focus-test repair R1
on:
  push:
    branches:
      - sol/battle-hand3-slidepad-current-r1-20260910
permissions:
  contents: write
jobs:
  repair-test-finalize:
    if: github.event.head_commit.message == 'TEMP repair Hand3 SlidePad focus test R1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-hand3-slidepad-current-r1-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair stale Focus assertion only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "assert.match(source, /context = await dedicatedFocus\\.readContext\\(Object\\.freeze\\(\\{[\\s\\S]*roundId: model\\.roundId,[\\s\\S]*assignment: model\\.assignment/);"
          new = "assert.match(source, /const callerAssignment = model\\.assignment\\?\\.assignmentMode[\\s\\S]*CURRENT_HAND3_POLICY[\\s\\S]*\\? model\\.assignment[\\s\\S]*: null[\\s\\S]*context = await dedicatedFocus\\.readContext\\(Object\\.freeze\\(\\{[\\s\\S]*roundId: model\\.roundId,[\\s\\S]*assignment: callerAssignment/);"
          if text.count(old) != 1:
              raise SystemExit(f'stale Focus assertion anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Focused current-Hand3 and SlidePad tests
        run: |
          node --test \
            tests/battle-janken-slidepad-runtime-mount.test.mjs \
            tests/new-base-hand3-uniform-assignment-policy.test.mjs \
            tests/new-base-round-start-janken-slot-assignment-core.test.mjs
      - name: Verify bounded product diff
        run: |
          git diff --name-only aed6367624c6e92e39946e5a02541ada75fd0b60...HEAD | sort
          test "$(git diff --name-only aed6367624c6e92e39946e5a02541ada75fd0b60...HEAD | grep -Ev '^(browser/battle-janken-slidepad-runtime-mount.mjs|tests/battle-janken-slidepad-runtime-mount.test.mjs|data/preaction-authorizations/BATTLE-HAND3-SLIDEPAD-CURRENT-R1-20260910T0355-SOL-Q7M4N20.json|.github/workflows/zz-temp-battle-hand3-slidepad-current-r1.yml)$' | wc -l)" -eq 0
      - name: Finalize product-only branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bounded-writer
          git config user.email gameroad-bounded-writer@users.noreply.github.com
          git add tests/battle-janken-slidepad-runtime-mount.test.mjs
          git rm .github/workflows/zz-temp-battle-hand3-slidepad-current-r1.yml
          git rm data/preaction-authorizations/BATTLE-HAND3-SLIDEPAD-CURRENT-R1-20260910T0355-SOL-Q7M4N20.json
          git diff --cached --check
          git commit -m 'Battle: current Hand3割当のSlidePad試験を現行化'
          git push origin HEAD:sol/battle-hand3-slidepad-current-r1-20260910
