name: TEMP Battle shared package R1

on:
  push:
    branches:
      - sol/battle-shared-package-train-r1-20260910

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authorized branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9761e10273edf2800940579d8252fb237c81f226)" = "9761e10273edf2800940579d8252fb237c81f226"
          test -f data/preaction-authorizations/BATTLE-PACKAGE-TRAIN-R1-20260910T0319-SOL-PKG-Q8N4M6.json
          test -f tools/temp-battle-shared-package-r1.py
          test -f .github/workflows/zz-temp-battle-shared-package-r1.yml
      - name: Patch only missing recursive package dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp-battle-shared-package-r1.py | tee /tmp/package-writer.txt
          grep -q '^ADDED_COUNT=' /tmp/package-writer.txt
          changed="$(git diff --name-only)"
          test "$changed" = "deploy/cloudflare/scripts/build.mjs"
          git diff --check
      - name: Verify package and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/cloudflare/scripts/build.mjs
          for f in \
            deploy/cloudflare/tests/build.test.mjs \
            tests/battle-camera-live-runtime.test.mjs \
            tests/battle-recovery-live-adapter.test.mjs \
            tests/battle-recovery-runtime-surface.test.mjs \
            tests/battle-janken-focus-runtime-surface.test.mjs \
            tests/battle-critical-resource-hud-runtime.test.mjs \
            tests/new-base-progression-lane-presentation-core.test.mjs; do
            test -f "$f"
          done
          node --test \
            deploy/cloudflare/tests/build.test.mjs \
            tests/battle-camera-live-runtime.test.mjs \
            tests/battle-recovery-live-adapter.test.mjs \
            tests/battle-recovery-runtime-surface.test.mjs \
            tests/battle-janken-focus-runtime-surface.test.mjs \
            tests/battle-critical-resource-hud-runtime.test.mjs \
            tests/new-base-progression-lane-presentation-core.test.mjs
      - name: Commit product and clean transient authorization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-package-bot"
          git config user.email "gameroad-package-bot@users.noreply.github.com"
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m "chore(deploy): package merged Battle runtime dependencies"
          git rm \
            .github/workflows/zz-temp-battle-shared-package-r1.yml \
            tools/temp-battle-shared-package-r1.py \
            data/preaction-authorizations/BATTLE-PACKAGE-TRAIN-R1-20260910T0319-SOL-PKG-Q8N4M6.json
          git commit -m "chore: clean shared package train transients"
          test -z "$(git status --porcelain)"
          git diff --check 9761e10273edf2800940579d8252fb237c81f226..HEAD
          git push origin HEAD:sol/battle-shared-package-train-r1-20260910
