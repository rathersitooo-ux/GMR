name: TEMP Result Shortland Rank R1

on:
  push:
    branches:
      - work/result-shortland-rank-r1-20260901

permissions:
  contents: write

concurrency:
  group: temp-result-shortland-rank-r1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and patch Result short landscape
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/result-shortland-rank-r1-20260901"
          git merge-base --is-ancestor b59c4659b1f999b5afc385c648ba38b4c3fc501e HEAD
          test -f data/preaction-authorizations/RESULT-SHORTLAND-RANK-R1-20260901T1457-SOL-H6Q2M8.json
          grep -Fq '".github/workflows/zz-temp-result-shortland-rank-r1.yml"' data/preaction-authorizations/RESULT-SHORTLAND-RANK-R1-20260901T1457-SOL-H6Q2M8.json
          python3 -c "from pathlib import Path; p=Path('browser/GAMEROAD.html'); s=p.read_text(encoding='utf-8'); old='@media (max-height:500px) and (orientation:landscape){\\n  .result.active #resultRanking{gap:2px}\\n  .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:2px 6px}\\n}'; new='@media (max-height:500px) and (orientation:landscape){\\n  .result.active .resultPoints{margin:0}\\n  .result.active #resultRanking{gap:2px}\\n  .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:2px 6px}\\n}'; assert (new in s and s.count(new)==1) or s.count(old)==1; p.write_text(s if new in s else s.replace(old,new,1),encoding='utf-8')"
          if ! git diff --quiet -- browser/GAMEROAD.html; then
            test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "e3b13b6a770be20ee038bd0e829fc39730e2fac3"
            git diff --check -- browser/GAMEROAD.html
          fi
      - name: Browser static check
        run: node tests/browser-static-check.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify existing R19 Result path
        run: npx playwright test tests/browser-full-interaction.spec.mjs --config=playwright.full-interaction.config.mjs --workers=1 --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home"
      - name: Commit verified product patch if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- browser/GAMEROAD.html; then
            echo 'No product commit needed on verification rerun.'
            exit 0
          fi
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --cached --name-only)" = "browser/GAMEROAD.html"
          git commit -m 'fix(result): fit ranking in short landscape'
          git push origin HEAD:work/result-shortland-rank-r1-20260901
