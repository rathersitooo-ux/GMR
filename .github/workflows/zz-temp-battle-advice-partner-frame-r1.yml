name: TEMP Battle Advice Partner Frame R1

on:
  push:
    branches:
      - sol/battle-advice-partner-frame-r1-20260913
    paths:
      - .github/workflows/zz-temp-battle-advice-partner-frame-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-advice-partner-frame-r1-20260913

      - name: Verify authorized base and manifest-first history
        shell: bash
        run: |
          set -euo pipefail
          BASE=42d76ff5145207964329a67f0048cf9849220dba
          MANIFEST=data/preaction-authorizations/BATTLE-ADVICE-PARTNER-FRAME-R1-20260913T1848-SOL.json
          test "$(git rev-parse "$BASE")" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE"..HEAD | head -n1)"
          test -n "$FIRST"
          test "$(git diff-tree --no-commit-id --name-only -r "$FIRST")" = "$MANIFEST"

      - name: Apply bounded Advice Partner framing repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          if text.count('<style id="gameroad-r8-user-attached-mana-partner">') != 1:
              raise SystemExit('unexpected R8 partner style block count')

          replacements = [
              (
                  '#battleAdvicePartnerStage{position:absolute;left:-6%;bottom:var(--r8-dock-bottom,72px);z-index:7;width:clamp(190px,24vw,300px);height:min(46vh,330px);display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;pointer-events:none;isolation:isolate}',
                  '#battleAdvicePartnerStage{position:absolute;left:-2%;bottom:var(--r8-dock-bottom,72px);z-index:7;width:clamp(140px,16vw,220px);height:min(34vh,245px);display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;pointer-events:none;isolation:isolate}'
              ),
              (
                  '#battleAdvicePartnerStage .grtc-image{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:left bottom;transform:scale(1.08);transform-origin:36% 100%;filter:drop-shadow(0 16px 20px rgba(0,0,0,.36));pointer-events:none}',
                  '#battleAdvicePartnerStage .grtc-image{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:left top;clip-path:inset(0 0 40% 0);transform:scale(1.12);transform-origin:36% 0%;filter:drop-shadow(0 16px 20px rgba(0,0,0,.36));pointer-events:none}'
              ),
              (
                  '#battleAdvicePartnerStage{left:-3%;bottom:-4px;width:150px;height:210px}',
                  '#battleAdvicePartnerStage{left:-1%;bottom:44px;width:118px;height:168px}'
              ),
              (
                  '#battleAdvicePartnerStage .grtc-image{transform:scale(1.05);transform-origin:38% 100%}',
                  '#battleAdvicePartnerStage .grtc-image{transform:scale(1.12);transform-origin:36% 0%}'
              ),
              (
                  '#battleAdvicePartnerStage{left:-4%;bottom:145px;width:126px;height:205px}',
                  '#battleAdvicePartnerStage{left:-1%;bottom:145px;width:118px;height:180px}'
              ),
              (
                  '#battleAdvicePartnerStage .grtc-image{transform:scale(1.06);transform-origin:36% 100%}',
                  '#battleAdvicePartnerStage .grtc-image{transform:scale(1.12);transform-origin:36% 0%}'
              ),
              (
                  '#battleAdvicePartnerStage{left:-5%;bottom:132px;width:112px;height:180px}',
                  '#battleAdvicePartnerStage{left:-1%;bottom:132px;width:108px;height:164px}'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one CSS anchor, got {count}: {old[:96]}')
              text = text.replace(old, new, 1)

          old = '#battleAdvicePartnerStage .grtc-image{transform:scale(1.05);transform-origin:36% 100%}'
          new = '#battleAdvicePartnerStage .grtc-image{transform:scale(1.12);transform-origin:36% 0%}'
          if text.count(old) != 1:
              raise SystemExit('expected one 360px partner image transform anchor')
          text = text.replace(old, new, 1)

          required = [
              'clip-path:inset(0 0 40% 0)',
              'width:clamp(140px,16vw,220px);height:min(34vh,245px)',
              '#battleAdvicePartnerStage{left:-1%;bottom:44px;width:118px;height:168px}',
              '#battleAdvicePartnerStage{left:-1%;bottom:145px;width:118px;height:180px}',
              '#battleAdvicePartnerStage{left:-1%;bottom:132px;width:108px;height:164px}',
              "const id=st?.selectedPartnerId||null",
              "playerCharacterId:st?.playerCharacterId||null",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing postcondition: {token}')

          forbidden = [
              'width:clamp(190px,24vw,300px);height:min(46vh,330px)',
              '#battleAdvicePartnerStage{left:-3%;bottom:-4px;width:150px;height:210px}',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'stale full-body framing remains: {token}')

          path.write_text(text, encoding='utf-8')

      - name: Run recognized static gate and diff check
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-static-check.mjs
          git diff --check
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(['git', 'diff', '--', 'browser/GAMEROAD.html'], text=True)
          if 'battleAdvicePartnerStage' not in diff:
              raise SystemExit('partner framing diff marker missing')
          PY

      - name: Commit product repair and cleanup transient authorization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-battle-advice-partner-frame-r1.yml
          rm data/preaction-authorizations/BATTLE-ADVICE-PARTNER-FRAME-R1-20260913T1848-SOL.json
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/GAMEROAD.html .github/workflows/zz-temp-battle-advice-partner-frame-r1.yml data/preaction-authorizations/BATTLE-ADVICE-PARTNER-FRAME-R1-20260913T1848-SOL.json
          git commit -m 'Battle UI: 通常相方を上半身クロップへ戻す R1'
          git push origin HEAD:sol/battle-advice-partner-frame-r1-20260913
