          new_annotation = """    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, cardPresentationFallbacks=${cardPresentationFallbacks}, conveyorEnvironmentFrames=${conveyorEnvironmentFrames}, result=${roundsText}` ,
"""
          assert browser.count(old_annotation) == 1
          browser = browser.replace(old_annotation, new_annotation, 1)

          old_return = """  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, cardPresentationFallbacks, roundsText };
"""
          new_return = """  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, cardPresentationFallbacks, conveyorEnvironmentFrames, roundsText };
