name: zz-temp-battle-camera-live-r3
on:
  push:
    branches:
      - sol/battle-camera-live-r3-20260909
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Battle camera seams compactly
        shell: python
        run: |
          from pathlib import Path
          import json, re
          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          needles = [
            'fieldCameraState','setFieldCamera','renderField3D','project3','nodeWorld(',
            'battleMap','pointerdown','pointermove','pointerup','wheel','touchstart','touchmove',
            'updateBattleAvatar','renderBoardPlayers','battleViewport','battleField','battleBoard',
            'phaseSurface','prefers-reduced-motion','reduceMotion','reducedMotion'
          ]
          out = {'htmlBytes': len(text), 'needles': {}}
          for needle in needles:
              starts=[]; pos=0
              while len(starts)<5:
                  idx=text.find(needle,pos)
                  if idx<0: break
                  starts.append(idx); pos=idx+len(needle)
              out['needles'][needle] = {
                'count': text.count(needle),
                'hits': [re.sub(r'\\s+',' ',text[max(0,i-420):min(len(text),i+len(needle)+620)]) for i in starts]
              }
          # Common numeric/state literals only when directly adjacent to camera terms.
          candidates=[]
          for m in re.finditer(r'(?i).{0,160}(?:fieldCameraState|setFieldCamera|camera).{0,260}', text):
              s=re.sub(r'\\s+',' ',m.group(0))
              if any(ch.isdigit() for ch in s): candidates.append(s)
              if len(candidates)>=20: break
          out['cameraNumericContexts']=candidates
          print('CAMERA_PROBE_JSON='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
