name: TEMP PublicHost R38 Package Repair

on:
  push:
    branches: [work/publichost-r38-postmatch-sidecar-package]
    paths: ['.github/workflows/zz-temp-publichost-r38-package-repair.yml']

permissions:
  contents: write

jobs:
  verified-package-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: work/publichost-r38-postmatch-sidecar-package
          fetch-depth: 2

      - name: Recheck exact current inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "a4924b2b5ee42093d8c7e50cf49921d9c91478db"
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "b80bd8b40c516486da65755f369ddb03ad376881"
          test "$(git hash-object browser/post-match-autoqueue-core.mjs)" = "c527c034119c27808993a0aede1ca04a77c68d98"
          test "$(git hash-object browser/GAMEROAD.html)" = "83ba1a68574249f66459dd785a73db29e1373a4f"

      - name: Apply minimal package closure and generic fail-closed dependency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/scripts/build.mjs')
          text = p.read_text(encoding='utf-8')

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'fail closed: expected one anchor, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          rep(
              "const defaultNavigationCoreSource = path.join(repoRoot, 'browser/screen-navigation-core.mjs');\n",
              "const defaultNavigationCoreSource = path.join(repoRoot, 'browser/screen-navigation-core.mjs');\nconst defaultPostMatchAutoqueueCoreSource = path.join(repoRoot, 'browser/post-match-autoqueue-core.mjs');\n",
          )

          helper = r'''
          export async function assertBrowserRuntimeDependencyCompleteness(browserInput, dist) {
            const html = Buffer.isBuffer(browserInput) ? browserInput.toString('utf8') : String(browserInput ?? '');
            const refs = new Set();
            const patterns = [
              /\bimport\s*\(\s*(['"])(\.\/[^'"?#]+\.(?:mjs|js))(?:[?#][^'"]*)?\1\s*\)/g,
              /<script\b[^>]*\bsrc\s*=\s*(['"])(\.\/[^'"?#]+\.(?:mjs|js))(?:[?#][^'"]*)?\1[^>]*>/gi,
            ];
            for (const pattern of patterns) {
              for (const match of html.matchAll(pattern)) refs.add(match[2]);
            }
            for (const ref of refs) {
              const output = ref.slice(2);
              if (!output || output.includes('/') || output.includes('\\') || output === '.' || output === '..') {
                throw new Error(`Unsupported Browser runtime dependency path in public package: ${ref}`);
              }
              try {
                await readFile(path.join(dist, output));
              } catch (error) {
                if (error?.code === 'ENOENT') {
                  throw new Error(`Public package missing Browser runtime dependency: ${ref}`);
                }
                throw error;
              }
            }
            return [...refs].sort();
          }

          '''
          rep('export async function buildPackage({\n', helper + 'export async function buildPackage({\n')
          rep(
              '  navigationCoreSource = defaultNavigationCoreSource,\n',
              '  navigationCoreSource = defaultNavigationCoreSource,\n  postMatchAutoqueueCoreSource = defaultPostMatchAutoqueueCoreSource,\n',
          )
          rep(
              "  expectedNavigationCoreBlob = '',\n",
              "  expectedNavigationCoreBlob = '',\n  expectedPostMatchAutoqueueCoreBlob = '',\n",
          )
          rep(
              '  const navigationCoreInput = await readFile(navigationCoreSource);\n',
              '  const navigationCoreInput = await readFile(navigationCoreSource);\n  const postMatchAutoqueueCoreInput = await readFile(postMatchAutoqueueCoreSource);\n',
          )
          rep(
              '  const navigationCoreBlob = gitBlobSha1(navigationCoreInput);\n',
              '  const navigationCoreBlob = gitBlobSha1(navigationCoreInput);\n  const postMatchAutoqueueCoreBlob = gitBlobSha1(postMatchAutoqueueCoreInput);\n',
          )
          rep(
              "  if (expectedReplayAdapterBlob && replayAdapterBlob !== expectedReplayAdapterBlob) {\n",
              "  if (expectedPostMatchAutoqueueCoreBlob && postMatchAutoqueueCoreBlob !== expectedPostMatchAutoqueueCoreBlob) {\n    throw new Error(`Post-match autoqueue core blob mismatch: expected=${expectedPostMatchAutoqueueCoreBlob} actual=${postMatchAutoqueueCoreBlob}`);\n  }\n  if (expectedReplayAdapterBlob && replayAdapterBlob !== expectedReplayAdapterBlob) {\n",
          )
          rep(
              "  const replayAdapterOutputPath = path.join(dist, 'battle-replay-live-adapter.mjs');\n",
              "  const postMatchAutoqueueCoreOutputPath = path.join(dist, 'post-match-autoqueue-core.mjs');\n  await writeFile(postMatchAutoqueueCoreOutputPath, postMatchAutoqueueCoreInput);\n  const postMatchAutoqueueCoreRoundTrip = await readFile(postMatchAutoqueueCoreOutputPath);\n  if (!postMatchAutoqueueCoreInput.equals(postMatchAutoqueueCoreRoundTrip)) {\n    throw new Error('dist/post-match-autoqueue-core.mjs is not byte-identical to Browser dependency source');\n  }\n\n  const replayAdapterOutputPath = path.join(dist, 'battle-replay-live-adapter.mjs');\n",
          )
          rep(
              '  for (const [outputName, sourceInput] of [\n',
              '  await assertBrowserRuntimeDependencyCompleteness(input, dist);\n\n  for (const [outputName, sourceInput] of [\n',
          )
          rep(
              "      battle_replay_live_adapter: provenance(\n",
              "      post_match_autoqueue_core: provenance(\n        'browser/post-match-autoqueue-core.mjs',\n        'post-match-autoqueue-core.mjs',\n        postMatchAutoqueueCoreInput,\n        postMatchAutoqueueCoreBlob,\n      ),\n      battle_replay_live_adapter: provenance(\n",
          )
          rep(
              "    else if (a === '--replay-adapter-source') out.replayAdapterSource = path.resolve(argv[++i]);\n",
              "    else if (a === '--post-match-autoqueue-core-source') out.postMatchAutoqueueCoreSource = path.resolve(argv[++i]);\n    else if (a === '--replay-adapter-source') out.replayAdapterSource = path.resolve(argv[++i]);\n",
          )
          rep(
              "    else if (a === '--expected-replay-adapter-blob') out.expectedReplayAdapterBlob = argv[++i] || '';\n",
              "    else if (a === '--expected-post-match-autoqueue-core-blob') out.expectedPostMatchAutoqueueCoreBlob = argv[++i] || '';\n    else if (a === '--expected-replay-adapter-blob') out.expectedReplayAdapterBlob = argv[++i] || '';\n",
          )
          p.write_text(text, encoding='utf-8')
          PY
          node --check deploy/cloudflare/scripts/build.mjs

      - name: Prove missing-sidecar sensitivity and repaired package
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdtemp, rm } from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import { assertBrowserRuntimeDependencyCompleteness } from './deploy/cloudflare/scripts/build.mjs';
          const dir = await mkdtemp(path.join(os.tmpdir(), 'gameroad-r38-sensitivity-'));
          try {
            let red = false;
            try {
              await assertBrowserRuntimeDependencyCompleteness(Buffer.from("<script type='module'>import('./known-missing-sidecar.mjs')</script>"), dir);
            } catch (error) {
              red = /missing Browser runtime dependency/.test(String(error?.message));
            }
            if (!red) throw new Error('known-bad missing-sidecar fixture did not fail closed');
            console.log('R38_KNOWN_BAD_MISSING_SIDECAR_RED=PASS');
          } finally {
            await rm(dir, { recursive: true, force: true });
          }
          NODE

          node --test deploy/cloudflare/tests/build.test.mjs deploy/cloudflare/tests/version-manifest.test.mjs
          BROWSER_BLOB="$(git hash-object browser/GAMEROAD.html)"
          POSTMATCH_BLOB="$(git hash-object browser/post-match-autoqueue-core.mjs)"
          node deploy/cloudflare/scripts/build.mjs \
            --expected-blob "$BROWSER_BLOB" \
            --expected-post-match-autoqueue-core-blob "$POSTMATCH_BLOB" \
            --source-commit "$(git rev-parse HEAD)" \
            --published-at '2026-08-24T03:23:00Z' \
            > /tmp/r38-manifest.json
          cmp --silent browser/post-match-autoqueue-core.mjs deploy/cloudflare/dist/post-match-autoqueue-core.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('deploy/cloudflare/dist/manifest.json', 'utf8'));
          const artifact = manifest.artifacts?.post_match_autoqueue_core;
          if (!artifact || artifact.output !== 'post-match-autoqueue-core.mjs') throw new Error('post-match artifact missing from public package manifest');
          if (artifact.source !== 'browser/post-match-autoqueue-core.mjs') throw new Error('post-match artifact provenance source mismatch');
          console.log('R38_REPAIRED_PACKAGE_GREEN=PASS');
          NODE

      - name: Remove temporary executor and commit durable repair only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-publichost-r38-package-repair.yml
          git checkout -- deploy/cloudflare/dist || true
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          expected={'.github/workflows/zz-temp-publichost-r38-package-repair.yml','deploy/cloudflare/scripts/build.mjs'}
          if paths != expected:
              raise SystemExit(f'fail closed: unexpected durable scope {sorted(paths)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m 'PublicHost R38: close Browser runtime sidecar package gap'
          git push origin HEAD:work/publichost-r38-postmatch-sidecar-package
