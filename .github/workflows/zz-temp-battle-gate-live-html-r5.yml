name: zz-temp-battle-gate-live-html-r5
on:
  push:
    branches:
      - sol/battle-gate-live-html-r5-20260914
    paths:
      - .github/workflows/zz-temp-battle-gate-live-html-r5.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-gate-live-html-r5-20260914
      - name: Inspect exact neighborhoods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('browser/GAMEROAD.html').read_text().splitlines()
          for a,b,label in [(1138,1166,'BOARD_MARKUP'),(1290,1335,'EARLY_MODULES'),(1768,1787,'RENDER_BOARD'),(4310,4360,'BATTLE_MODULES_A'),(4415,4465,'BATTLE_MODULES_B')]:
            print(f'=== {label} L{a}-L{b} ===')
            for n in range(a,b+1):
              if 1<=n<=len(lines): print(f'{n:05d}: {lines[n-1]}')
          PY
      - name: Static baseline
        run: node tests/browser-static-check.mjs
