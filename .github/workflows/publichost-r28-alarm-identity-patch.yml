name: PublicHost R28 bounded alarm identity patch
on:
  push:
    branches:
      - work/publichost-r28-alarm-attempt-identity
    paths:
      - .github/workflows/publichost-r28-alarm-identity-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publichost-r28-alarm-attempt-identity
          fetch-depth: 1
      - name: Patch exact single alarm identity occurrence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-public-deploy.yml')
          s = p.read_text()
          braces = '{{'
          close = '}}'
          expr_run = '$' + braces + ' github.run_id ' + close
          expr_attempt = '$' + braces + ' github.run_attempt ' + close
          old = 'GAMEROAD_ALARM_PROBE_RUN_KEY: ' + expr_run
          new = old + '-' + expr_attempt
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'old run-key occurrence count={count}, expected 1')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/cloudflare-public-deploy.yml"
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cloudflare-public-deploy.yml
          git commit -m "PUBLICHOST R28: make alarm probe identity unique per attempt"
          git push origin HEAD:work/publichost-r28-alarm-attempt-identity
