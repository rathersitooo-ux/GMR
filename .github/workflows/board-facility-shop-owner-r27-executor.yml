name: Board Facility Shop Owner R27 Executor

on:
  push:
    branches:
      - sol/board-facility-shop-owner-r27-20260906

permissions:
  contents: write

jobs:
  repair-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/board-facility-shop-owner-r27-20260906
          fetch-depth: 0
      - name: Validate executor transport
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/BOARD-FACILITY-SHOP-OWNER-R27-20260906T0550-SOL-K7M4Q2.json
          echo R27_EXECUTOR_READY
