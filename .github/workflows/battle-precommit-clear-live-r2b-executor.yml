name: Battle Precommit Clear Live R2B Executor

on:
  push:
    branches:
      - sol/battle-precommit-clear-live-r2b-20260905
    paths:
      - .github/workflows/battle-precommit-clear-live-r2b-executor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clean reconstruction base and donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 4cee72bd0e7f34574fade91e73491b66ae177d8f)" = "4cee72bd0e7f34574fade91e73491b66ae177d8f"
          git cat-file -e 999ca758243ad9706f03db14856c1aff238abcfc^{commit}
      - name: Apply only validated donor product paths with three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git show --format= --binary 999ca758243ad9706f03db14856c1aff238abcfc -- \
            browser/GAMEROAD.html \
            deploy/cloudflare/scripts/build.mjs \
            tests/browser-full-interaction.spec.mjs > /tmp/battle-precommit-clear-r2-donor.patch
          test -s /tmp/battle-precommit-clear-r2-donor.patch
          git apply --3way --index /tmp/battle-precommit-clear-r2-donor.patch
          grep -Fq 'GAMEROAD_BATTLE_PRECOMMIT_CLEAR_LIVE_R2' browser/GAMEROAD.html
          grep -Fq "browser/battle-precommit-clear-core.mjs" deploy/cloudflare/scripts/build.mjs
          grep -Fq 'R2 visible precommit one-operation clear preserves route undo and fails closed against commit race' tests/browser-full-interaction.spec.mjs
          grep -Fq 'Result autoqueue status remains visibly readable' tests/browser-full-interaction.spec.mjs
      - name: Run focused core and public package tests
        run: |
          node --test tests/battle-precommit-clear-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Verify exact staged product paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(browser/GAMEROAD.html deploy/cloudflare/scripts/build.mjs tests/browser-full-interaction.spec.mjs)
          if [[ "${staged[*]}" != "${expected[*]}" ]]; then
            printf 'staged=%s\n' "${staged[*]}"
            exit 1
          fi
      - name: Cleanup transient authorization and executor then commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git rm .github/workflows/battle-precommit-clear-live-r2b-executor.yml
          git rm data/preaction-authorizations/BATTLE-PRECOMMIT-CLEAR-LIVE-R2-20260905T2010-SOL-Q7M4P2.json
          git diff --cached --check
          git commit -m 'Battle: connect precommit selection clear to live consumer'
          git push origin HEAD:sol/battle-precommit-clear-live-r2b-20260905
