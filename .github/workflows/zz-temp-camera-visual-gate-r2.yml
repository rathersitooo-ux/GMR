name: TEMP Camera Visual Gate R2

on:
  push:
    branches:
      - sol/battle-camera-html-r8-20260913

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair camera return presentation contract
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='676b8daa58510c68311b14635e576ce7a6c315e0'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path

          html_path=Path('browser/GAMEROAD.html')
          s=html_path.read_text(encoding='utf-8')

          old='<button class="railBtn" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る">自分</button>'
          new='<button class="railBtn" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る" hidden>自分</button>'
          if s.count(old)!=1:
              raise SystemExit(f'camera button anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          old_style='#battleMap[data-camera-live="1"]{touch-action:none}\n#cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}'
          new_style='#battleMap[data-camera-live="1"]{touch-action:none}\n#cameraReturnBtn{display:none;pointer-events:none}\n#cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{display:flex;pointer-events:auto;box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}'
          if s.count(old_style)!=1:
              raise SystemExit(f'camera style anchor count={s.count(old_style)}')
          s=s.replace(old_style,new_style,1)

          old_guard="if(!world||!returnControl)return;\n  world.dataset.cameraLive='1';"
          new_guard="if(!world||!returnControl)return;\n  returnControl.hidden=true;\n  world.dataset.cameraLive='1';"
          if s.count(old_guard)!=1:
              raise SystemExit(f'camera guard anchor count={s.count(old_guard)}')
          s=s.replace(old_guard,new_guard,1)

          old_destroy="function destroy(){runtime?.destroy?.();runtime=null;key='';delete world.dataset.cameraMode;delete returnControl.dataset.cameraMode}"
          new_destroy="function destroy(){runtime?.destroy?.();runtime=null;key='';returnControl.hidden=true;delete world.dataset.cameraMode;delete returnControl.dataset.cameraMode}"
          if s.count(old_destroy)!=1:
              raise SystemExit(f'camera destroy anchor count={s.count(old_destroy)}')
          s=s.replace(old_destroy,new_destroy,1)

          old_apply="applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode}});key=nextKey}else runtime.syncControlledPoint(source.controlledWorldPoint);const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;return cameraState}"
          new_apply="applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;returnControl.hidden=cameraState.mode!=='MANUAL_INSPECT'}});key=nextKey}else runtime.syncControlledPoint(source.controlledWorldPoint);const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;returnControl.hidden=cameraState.mode!=='MANUAL_INSPECT';return cameraState}"
          if s.count(old_apply)!=1:
              raise SystemExit(f'camera apply anchor count={s.count(old_apply)}')
          s=s.replace(old_apply,new_apply,1)

          html_path.write_text(s,encoding='utf-8')
          PY

          cat > tests/battle-camera-live-integration.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';
          const html=fs.readFileSync(new URL('../browser/GAMEROAD.html',import.meta.url),'utf8');
          test('existing camera runtime is mounted into current Battle field without a second engine',()=>{
            assert.match(html,/id="gameroad-battle-camera-live"/);
            assert.match(html,/import \{ mountBattleCameraLiveRuntime \} from '\.\/battle-camera-live-runtime\.mjs'/);
            assert.match(html,/function grBattleCameraSource\(\)/);
            assert.match(html,/controlledWorldPoint:\{x:w\.x,y:w\.z\}/);
            assert.match(html,/if\(grBattleCameraView\)\{/);
            assert.match(html,/followDistance=profile\.kind==='portrait'\?12:profile\.kind==='short-landscape'\?9\.5:11/);
            assert.doesNotMatch(html,/new THREE|THREE\.|new .*CameraController/);
          });
          test('manual camera keeps DOM and WebGL projection on the same pitch',()=>{
            assert.match(html,/pitch=Number\.isFinite\(c\.pitchRad\)\?c\.pitchRad:Math\.PI\/4/);
            assert.match(html,/uniform vec2 uPitch/);
            assert.match(html,/gl\.uniform2f\(gl\.getUniformLocation\(fieldProgram,'uPitch'\),Math\.cos\(pitch\),Math\.sin\(pitch\)\)/);
            assert.match(html,/angle:\{min:28,max:62\}/);
          });
          test('camera return has zero FOLLOW footprint and becomes reachable only in manual inspect',()=>{
            assert.match(html,/id="cameraReturnBtn"[^>]+hidden>自分<\/button>/);
            assert.match(html,/#cameraReturnBtn\{display:none;pointer-events:none\}/);
            assert.match(html,/#cameraReturnBtn\[data-camera-mode="MANUAL_INSPECT"\]\{display:flex;pointer-events:auto;/);
            assert.match(html,/returnControl\.hidden=cameraState\.mode!=='MANUAL_INSPECT'/);
            assert.match(html,/isScreenUiTarget\(target\)/);
            assert.match(html,/target\.closest\('button,select,input,textarea,a,\[role="button"\]'\)/);
            assert.match(html,/returnControlElement:returnControl/);
          });
          test('camera follows authoritative controlled position but owns no gameplay state',()=>{
            assert.match(html,/if\(p\?\.human\)window\.__GAMEROAD_BATTLE_CAMERA_LIVE__\?\.syncFromGame\?\.\(\)/);
            assert.match(html,/authority:\{gameplay:false,movement:false,target:false,legality:false,stateWrite:false\}/);
            assert.match(html,/MANUAL_INSPECT/);
            assert.match(html,/syncControlledPoint\(source\.controlledWorldPoint\)/);
            const start=html.indexOf('function grBattleCameraSource()');
            const end=html.indexOf('function fieldProject',start);
            assert.ok(start>=0&&end>start);
            const adapter=html.slice(start,end);
            assert.doesNotMatch(adapter,/(?:state\.match\.target|me\.position|me\.plan\.path)\s*=/);
          });
          EOF

          node --test tests/battle-camera-live-integration.test.mjs
          node tests/browser-static-check.mjs
          git diff --check

          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs
          git commit -m 'Battle: camera returnをinspect時だけ表示'

          for f in \
            .github/workflows/zz-temp-camera-gate-classify-r1.yml \
            data/preaction-authorizations/GITHUB-CI-CAMERA-CLASSIFY-R1-20260913T2012-SOL.json \
            .github/workflows/zz-temp-camera-visual-gate-r2.yml
          do
            if [ -e "$f" ]; then git rm "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Cleanup camera repair transient files'
          fi
          git push origin HEAD:sol/battle-camera-html-r8-20260913
