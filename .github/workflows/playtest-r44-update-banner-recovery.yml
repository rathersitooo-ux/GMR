name: PLAYTEST R45 update banner product recovery

on:
  push:
    branches:
      - work/visual-r34-result-update-banner
    paths:
      - .github/workflows/playtest-r44-update-banner-recovery.yml

concurrency:
  group: playtest-r45-update-banner-product-recovery
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXACT_BASE: 0378baff64c79ad20ec151ff1b9b900ca32b9bd9
  EXACT_HTML_BLOB: 477325641fa328ecd55cdc15a11a5d0ea90759f1
  EXACT_TEST_BLOB: 5386451be827ac75554f8f99c7d0d4586a5a07c2

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-r34-result-update-banner
          fetch-depth: 0
      - name: Exact current base bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'R45_STAGE=exact-anchor-patch' >> "$GITHUB_ENV"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_BASE"
          git checkout origin/main -- browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXACT_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXACT_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8-sig')
          pairs = [
            (
              "update:{status:'idle',pending:null,lastCheck:0,deferred:false,error:null}",
              "update:{status:'idle',baselineId:null,pending:null,lastCheck:0,deferred:false,error:null}"
            ),
            (
              "R.update.status='ok';R.update.error=null;if(j.build_id!==BUILD_ID){R.update.pending={buildId:j.build_id,publishedAt:j.published_at||null,source:url.href};renderUpdateBanner();return true}R.update.pending=null;R.update.deferred=false;renderUpdateBanner();return false",
              "R.update.status='ok';R.update.error=null;const nextId=j.build_id;if(!R.update.baselineId){R.update.baselineId=nextId;R.update.pending=null;R.update.deferred=false;renderUpdateBanner();return false}if(R.update.pending&&nextId===R.update.pending.buildId){renderUpdateBanner();return true}if(nextId===R.update.baselineId){renderUpdateBanner();return !!R.update.pending}R.update.pending={buildId:nextId,publishedAt:j.published_at||null,source:url.href};renderUpdateBanner();return true"
            ),
            (
              "const pending=R.update.pending,screen=typeof state!=='undefined'?state.screen:'home';bar.dataset.screen=screen||'';bar.classList.toggle('on',!!pending);if(!pending)return;",
              "const pending=R.update.pending,screen=typeof state!=='undefined'?state.screen:'home',visible=!!pending&&screen==='home';bar.dataset.screen=screen||'';bar.classList.toggle('on',visible);bar.setAttribute('aria-hidden',String(!visible));if(!visible)return;"
            )
          ]
          for old, new in pairs:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'R45 anchor count={count}: {old[:90]}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/browser-full-interaction.spec.mjs')
          x = t.read_text(encoding='utf-8')
          marker = '// UPDATE-MANIFEST-BASELINE-HOME-ONLY-REGRESSION R45'
          if marker in x:
            raise SystemExit('R45 regression marker already exists')
          x += dedent(r'''
          
          // UPDATE-MANIFEST-BASELINE-HOME-ONLY-REGRESSION R45
          test('update manifest baseline is session-local and pending banner is Home-only', async ({ page, browser }, testInfo) => {
            const runtime=observeRuntimeErrors(page);
            let build='r45-base';
            await page.route('**/browser/gameroad-version.json*',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({build_id:build})}));
            await bootCurrentBrowser(page);
            await page.waitForFunction(()=>!!window.GAMEROAD_PARTNER_COMMENT);
            const banner=page.locator('#gameroadUpdateBanner');
            await page.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.checkUpdate());
            await expect(banner).toBeHidden();
            await expect(banner).toHaveAttribute('aria-hidden','true');
            await expect.poll(()=>page.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.snapshot().update.pending)).toBe(null);

            build='r45-next';
            await page.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.checkUpdate());
            await expect(banner).toBeVisible();
            await expect(banner).toHaveAttribute('aria-hidden','false');

            const setupGo=visibleHomeControl(page,'setup');
            await setupGo.click();
            const setup=page.locator('section[data-screen="setup"]');
            await expect(setup).toBeVisible();
            await expect(banner).toBeHidden();
            await expect(banner).toHaveAttribute('aria-hidden','true');
            const honey=setup.locator('[data-content="honey_hunt"]');
            await honey.click();
            await expect(honey).toHaveClass(/on/);
            await testInfo.attach('setup-pending-update-hidden.png',{body:await page.screenshot({fullPage:false}),contentType:'image/png'});

            build='r45-next2';
            await page.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.checkUpdate());
            await expect(banner).toBeHidden();
            await expect(banner).toHaveAttribute('aria-hidden','true');
            await expect.poll(()=>page.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.snapshot().update.pending?.buildId||null)).toBe('r45-next2');

            const back=setup.locator('[data-back]:visible').first();
            await back.click();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible();
            await expect(banner).toBeVisible();
            await expect(banner).toHaveAttribute('aria-hidden','false');

            const fresh=await browser.newContext({viewport:testInfo.project.use.viewport});
            const q=await fresh.newPage();
            await q.route('**/browser/gameroad-version.json*',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({build_id:build})}));
            await q.goto(page.url(),{waitUntil:'domcontentloaded'});
            await q.waitForFunction(()=>!!window.GAMEROAD_PARTNER_COMMENT);
            await q.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.checkUpdate());
            await expect(q.locator('#gameroadUpdateBanner')).toBeHidden();
            await expect(q.locator('#gameroadUpdateBanner')).toHaveAttribute('aria-hidden','true');
            await expect.poll(()=>q.evaluate(()=>window.GAMEROAD_PARTNER_COMMENT.snapshot().update.pending)).toBe(null);
            await fresh.close();
            runtime.assertClean(testInfo);
          });
          ''')
          t.write_text(x, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        shell: bash
        run: |
          set -euo pipefail
          echo 'R45_STAGE=browser-install' >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Run three viewport same-state update regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'R45_STAGE=three-viewport-regression' >> "$GITHUB_ENV"
          npx playwright test --config=playwright.full-interaction.config.mjs --workers=1 --grep "update manifest baseline is session-local and pending banner is Home-only" --project=desktop-1280x720 --project=phone-390x844 --project=short-landscape-667x375
      - name: Preserve same-state visual evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-r45-update-banner-same-state
          path: test-results
          if-no-files-found: error
          retention-days: 14
      - name: Persist verified product and existing-lane test only
        shell: bash
        run: |
          set -euo pipefail
          echo 'R45_STAGE=persist' >> "$GITHUB_ENV"
          git rm -f --ignore-unmatch .github/workflows/playtest-r44-update-banner-recovery.yml .github/workflows/playtest-visual-r34-bounded-patch.yml .tmp-deck-selection-diagnostic.txt .tmp-update-banner-source.txt .tmp-deck-selection-eval.txt .tmp-r43-executor-result.txt .tmp-r44-executor-result.txt .tmp-r44b-executor-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git diff --cached --check
          git commit -m "PLAYTEST R45: make update prompt session-aware and Home-only"
          git push origin HEAD:work/visual-r34-result-update-banner
      - name: Persist exact failure stage without product mutation
        if: failure()
        shell: bash
        run: |
          set -u
          git reset --hard "$GITHUB_SHA"
          printf 'R45 bounded executor failed\nstage=%s\nworkflow_sha=%s\nbase=%s\ntime_utc=%s\n' "${R45_STAGE:-unknown}" "$GITHUB_SHA" "$EXACT_BASE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .tmp-r44-executor-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-r44-executor-result.txt
          git commit -m "PLAYTEST R45: persist bounded executor failure stage" || true
          git push origin HEAD:work/visual-r34-result-update-banner || true
