name: Diagnose Roblox baseline transport

on:
  push:
    branches:
      - work/GITHUB-ROBLOX-CODE-PLACEMENT-001
    paths:
      - .github/workflows/import-roblox-baseline.yml

permissions:
  contents: read

jobs:
  diagnose-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Inspect transport bytes without modifying game files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/GITHUB-ROBLOX-CODE-PLACEMENT-001"
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import string

          allowed = set((string.ascii_letters + string.digits + "+/=").encode())
          normalized_parts = []
          for i in range(10):
              p = Path(f".github/import/roblox-baseline.part{i:03d}.b64")
              raw = p.read_bytes()
              norm = b"".join(raw.split())
              bad = [(j, b) for j, b in enumerate(norm) if b not in allowed]
              pads = [j for j, b in enumerate(norm) if b == ord("=")]
              print(
                  f"{p.name}: raw_len={len(raw)} norm_len={len(norm)} mod4={len(norm)%4} "
                  f"bad_count={len(bad)} bad_head={bad[:8]} pads={pads[:8]} "
                  f"first16={norm[:16]!r} last16={norm[-16:]!r}"
              )
              normalized_parts.append(norm)

          cat = b"".join(normalized_parts)
          bad = [(j, b) for j, b in enumerate(cat) if b not in allowed]
          pads = [j for j, b in enumerate(cat) if b == ord("=")]
          print(
              f"concat: len={len(cat)} mod4={len(cat)%4} bad_count={len(bad)} "
              f"bad_head={bad[:20]} pads_head={pads[:20]} pads_tail={pads[-20:]} "
              f"first16={cat[:16]!r} last32={cat[-32:]!r} sha256={hashlib.sha256(cat).hexdigest()}"
          )
          try:
              packed = base64.b64decode(cat, validate=True)
          except Exception as e:
              print(f"strict_decode_error={type(e).__name__}: {e}")
              raise SystemExit(42)
          print(f"strict_decode_ok packed_len={len(packed)} packed_sha256={hashlib.sha256(packed).hexdigest()} first8={packed[:8]!r}")
          PY
