name: temp Partner costume player path R2
on:
  push:
    branches:
      - sol/partner-costume-player-path-r2-20260911
    paths:
      - .github/workflows/zz-temp-partner-costume-player-path-r2.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/partner-costume-player-path-r2-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded costume player-path patch
        shell: python
        run: |
          from pathlib import Path
          htmlp=Path("browser/GAMEROAD.html")
          html=htmlp.read_text(encoding="utf-8")
          anchor="window.__GAMEROAD_SAVE_RECOVERY__={snapshot:()=>JSON.parse(JSON.stringify(saveRecoveryRuntime)),authority:{...SAVE_AUTHORITY}};"
          assert anchor in html
          bridge="""window.__GAMEROAD_SAVE_RECOVERY__={snapshot:()=>JSON.parse(JSON.stringify(saveRecoveryRuntime)),authority:{...SAVE_AUTHORITY}};
          window.GAMEROAD_PARTNER_COSTUME_MAIN_SAVE=Object.freeze({
            getSelectedPartnerId:()=>state.selectedPartnerId,
            getPartnerProfiles:()=>safeClone(state.partnerProfiles),
            persistPartnerEquipment:async({partnerId,equipment})=>{
              if(partnerId!==state.selectedPartnerId)throw new Error('PARTNER_COSTUME_SELECTED_PARTNER_MISMATCH');
              const current=state.partnerProfiles[partnerId]||emptyPartnerProfile();
              state.partnerProfiles={...state.partnerProfiles,[partnerId]:{...current,equipment:{shoes:equipment?.shoes??null,coordinate:equipment?.coordinate??null,accessory:equipment?.accessory??null}}};
              if(!save())throw new Error('PARTNER_COSTUME_SAVE_FAILED');
              return safeClone(state.partnerProfiles[partnerId].equipment);
            },
          });"""
          html=html.replace(anchor,bridge,1)
          htmlp.write_text(html,encoding="utf-8")

          p=Path("browser/partner-tea-runtime-mount.mjs")
          s=p.read_text(encoding="utf-8")
          s=s.replace("import { mountPartnerShellRuntime } from './partner-shell-runtime-mount.mjs';","import { mountPartnerShellRuntime } from './partner-shell-runtime-mount.mjs';\nimport { createPartnerCostumeMainSaveProfileAdapter } from './partner-costume-main-save-profile-adapter.mjs';",1)
          s=s.replace("const PARTNER_HUB_ALLOWED_ACTION_SET = new Set(['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'BACK_HUB']);","const PARTNER_HUB_ALLOWED_ACTION_SET = new Set(['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'OPEN_COSTUME', 'BACK_HUB']);",1)
          mark="function mountPartnerConversationHubOnSurface(surface) {"
          assert mark in s
          helper="""export function currentPartnerCostumeServices(global = globalThis) {
            const bridge = global?.GAMEROAD_PARTNER_COSTUME_MAIN_SAVE;
            const catalog = global?.GAMEROAD_PARTNER_COSTUME_CATALOG;
            const ownedSource = global?.GAMEROAD_PARTNER_COSTUME_OWNED_ITEM_IDS_BY_PARTNER;
            if (!bridge || typeof bridge.getSelectedPartnerId !== 'function'
              || typeof bridge.getPartnerProfiles !== 'function'
              || typeof bridge.persistPartnerEquipment !== 'function'
              || !catalog || typeof catalog !== 'object' || Array.isArray(catalog)
              || (!ownedSource || (typeof ownedSource !== 'object' && typeof ownedSource !== 'function'))) return null;
            const readOwned = () => typeof ownedSource === 'function' ? ownedSource() : ownedSource;
            const adapter = createPartnerCostumeMainSaveProfileAdapter({
              getSelectedPartnerId: bridge.getSelectedPartnerId,
              getPartnerProfiles: bridge.getPartnerProfiles,
              getOwnedItemIdsByPartner: readOwned,
              persistPartnerEquipment: bridge.persistPartnerEquipment,
            });
            return Object.freeze({
              catalog,
              loadAuthoritativeSnapshot: adapter.loadAuthoritativeSnapshot,
              saveAuthoritativeSelection: adapter.saveAuthoritativeSelection,
              createSaveRequestId: () => `partner-costume:${Date.now()}:${Math.random().toString(36).slice(2)}`,
            });
          }

          function mountPartnerConversationHubOnSurface(surface) {"""
          s=s.replace(mark,helper,1)
          old="  const shell = mountPartnerShellRuntime({\n    root: shellRoot,"
          assert old in s
          s=s.replace(old,"  const costume = currentPartnerCostumeServices(globalThis);\n  const shell = mountPartnerShellRuntime({\n    root: shellRoot,\n    costume,",1)
          p.write_text(s,encoding="utf-8")

          p=Path("deploy/cloudflare/scripts/build.mjs")
          s=p.read_text(encoding="utf-8")
          if "partner-costume-main-save-profile-adapter.mjs" not in s:
            a="  { source: 'browser/partner-costume-browser-session-runtime.mjs', output: 'partner-costume-browser-session-runtime.mjs', artifact: 'partner_costume_browser_session_runtime', label: 'Partner costume browser session runtime' },"
            assert a in s
            s=s.replace(a,a+"\n  { source: 'browser/partner-costume-main-save-profile-adapter.mjs', output: 'partner-costume-main-save-profile-adapter.mjs', artifact: 'partner_costume_main_save_profile_adapter', label: 'Partner costume main-save profile adapter' },",1)
          p.write_text(s,encoding="utf-8")

          p=Path("tests/partner-tea-runtime-mount.test.mjs")
          s=p.read_text(encoding="utf-8")
          s=s.replace("  createPartnerConversationHubInput,","  createPartnerConversationHubInput,\n  currentPartnerCostumeServices,",1)
          s=s.replace("assert.deepEqual(plan.allowedActions, ['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'BACK_HUB']);","assert.deepEqual(plan.allowedActions, ['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'OPEN_COSTUME', 'BACK_HUB']);",1)
          s=s.replace("test('Partner Hub dispatcher exposes only detail, conversation and return-to-hub actions', () => {","test('Partner Hub dispatcher exposes detail, conversation, costume gate and return-to-hub actions', () => {",1)
          s=s.replace("assert.deepEqual(PARTNER_CONVERSATION_HUB_ALLOWED_ACTIONS, ['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'BACK_HUB']);","assert.deepEqual(PARTNER_CONVERSATION_HUB_ALLOWED_ACTIONS, ['OPEN_ACTIVE_DETAIL', 'OPEN_CONVERSATION', 'OPEN_COSTUME', 'BACK_HUB']);",1)
          s=s.replace("for (const action of ['OPEN_LIST', 'OPEN_COSTUME', 'OPEN_FORMATION', 'OPEN_STRATEGY', 'OPEN_DIALOGUE_FEEDBACK', 'OPEN_TEA']) {","for (const action of ['OPEN_LIST', 'OPEN_FORMATION', 'OPEN_STRATEGY', 'OPEN_DIALOGUE_FEEDBACK', 'OPEN_TEA']) {",1)
          if "costume services fail closed without explicit catalog and owned authority" not in s:
            s += """\n\ntest('costume services fail closed without explicit catalog and owned authority', () => {
            assert.equal(currentPartnerCostumeServices({}), null);
            assert.equal(partnerConversationHubCanDispatch('OPEN_COSTUME'), true);
          });

          test('costume services reuse the main-save bridge instead of a second store', async () => {
            let profiles={p1:{equipment:{shoes:null,coordinate:null,accessory:null}}};
            const services=currentPartnerCostumeServices({
              GAMEROAD_PARTNER_COSTUME_MAIN_SAVE:{
                getSelectedPartnerId:()=> 'p1',
                getPartnerProfiles:()=> profiles,
                persistPartnerEquipment:async({partnerId,equipment})=>{profiles={...profiles,[partnerId]:{equipment}};},
              },
              GAMEROAD_PARTNER_COSTUME_CATALOG:{c1:{id:'c1',category:'coord',label:'衣装1'}},
              GAMEROAD_PARTNER_COSTUME_OWNED_ITEM_IDS_BY_PARTNER:{p1:['c1']},
            });
            assert.ok(services);
            const before=await services.loadAuthoritativeSnapshot();
            assert.deepEqual(before.partners.p1.ownedItemIds,['c1']);
            const after=await services.saveAuthoritativeSelection({partnerId:'p1',selection:{shoes:null,coord:'c1',accessory:null},requestId:'r1'});
            assert.equal(after.partners.p1.savedSelection.coord,'c1');
          });
          """
          p.write_text(s,encoding="utf-8")
      - name: Focused tests
        run: |
          node --test tests/partner-costume-core.test.mjs tests/partner-costume-browser-session-runtime.test.mjs tests/partner-costume-main-save-profile-adapter.test.mjs tests/partner-costume-screen-runtime-mount.test.mjs tests/partner-shell-runtime-mount.test.mjs tests/partner-tea-runtime-mount.test.mjs
          node deploy/cloudflare/tests/build.test.mjs
      - name: Verify bounded diff
        run: |
          git diff --check
          git status --short
          git diff --name-only HEAD | sort
      - name: Commit product candidate
        run: |
          git config user.name "gameroad-bounded-writer"
          git config user.email "actions@users.noreply.github.com"
          git add browser/GAMEROAD.html browser/partner-tea-runtime-mount.mjs tests/partner-tea-runtime-mount.test.mjs deploy/cloudflare/scripts/build.mjs
          git commit -m "Partner: connect costume to actual player save path"
          git push origin HEAD:sol/partner-costume-player-path-r2-20260911
