name: UIFeedback R45 HomeCards 2.5D patcher

on:
  push:
    branches:
      - work/uifeedback-r45-homecards-2p5d-vslice

permissions:
  contents: write

jobs:
  mount-presentation-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/uifeedback-r45-homecards-2p5d-vslice
      - name: Mount bounded Home-Cards presentation module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- GAMEROAD_UI_R45_HOMECARDS_2P5D -->'
          mount = marker + '\n<script type="module" src="./home-cards-2p5d-presentation.mjs"></script>\n'
          if marker not in html:
              if html.count('</body>') != 1:
                  raise SystemExit(f'R45_BODY_ANCHOR_COUNT_FAIL count={html.count("</body>")}')
              html = html.replace('</body>', mount + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          elif html.count(marker) != 1:
              raise SystemExit(f'R45_MOUNT_MARKER_COUNT_FAIL count={html.count(marker)}')
          PY

          node --check browser/home-cards-2p5d-presentation.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

          if git diff --quiet -- browser/GAMEROAD.html; then
            echo 'NO_R45_HTML_DIFF'
            exit 0
          fi
          git config user.name 'gameroad-r45-bounded-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git commit -m 'UI R45: mount Home-Cards hybrid 2.5D presentation'
          git push origin HEAD:work/uifeedback-r45-homecards-2p5d-vslice
