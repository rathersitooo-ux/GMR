name: TEMP Minor Gacha Public R1

on:
  push:
    branches:
      - sol/minor-gacha-public-r1-20260912

permissions:
  contents: read

jobs:
  public-gacha-visible-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind exact observed public build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            --output /tmp/gameroad-version.json \
            "$GAMEROAD_PUBLIC_BASE_URL/gameroad-version.json"
          BUILD_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/gameroad-version.json','utf8'));if(!x.build_id)process.exit(2);process.stdout.write(String(x.build_id))")"
          echo "OBSERVED_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Observed public build_id=$BUILD_ID"
      - name: Install bounded Playwright runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Play visible public Gacha path
        run: node tools/temp-minor-gacha-public-r1.mjs
      - name: Upload Gacha visible-play evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minor-gacha-public-${{ github.run_id }}
          path: gacha-visible-play-evidence/
          if-no-files-found: error
          retention-days: 14
