name: TEMP Result Ineligible Autoqueue R1

on:
  push:
    branches:
      - work/result-ineligible-autoqueue-r1-20260901
    paths:
      - .github/workflows/zz-temp-result-ineligible-autoqueue-r1.yml

permissions:
  contents: write

concurrency:
  group: temp-result-ineligible-autoqueue-r1
  cancel-in-progress: false

jobs:
  exact-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/result-ineligible-autoqueue-r1-20260901
          fetch-depth: 0
      - name: Guard exact authority and finalize Result autoqueue presentation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "work/result-ineligible-autoqueue-r1-20260901"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor eb38b5d92f8eea57f9cbe409a5c74fa82bf5ab76 HEAD
          test -f data/preaction-authorizations/RESULT-AUTOQUEUE-INELIGIBLE-R1-20260901T1429-SOL-P7N4Q2.json
          grep -Fq '".github/workflows/zz-temp-result-ineligible-autoqueue-r1.yml"' data/preaction-authorizations/RESULT-AUTOQUEUE-INELIGIBLE-R1-20260901T1429-SOL-P7N4Q2.json
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "20a550d875cc5de67d4587eaa17750c97d4d828a"
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          old = """      if (toggle) {
        toggle.checked = view.enabled;
        toggle.disabled = view.status === STATUS.INELIGIBLE;
      }"""
          new = """      if (toggle) {
        toggle.checked = view.status !== STATUS.INELIGIBLE && view.enabled;
        toggle.disabled = view.status === STATUS.INELIGIBLE;
      }"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'anchor cardinality mismatch: {count}')
          s = s.replace(old, new, 1)
          if s.count(new) != 1 or old in s:
              raise SystemExit('replacement readback mismatch')
          p.write_text(s, encoding='utf-8')
          PY
          node --test tests/post-match-autoqueue-core.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check -- browser/GAMEROAD.html
          git diff --exit-code -- browser/post-match-autoqueue-core.mjs
      - name: Commit product delta and remove transient helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-exact-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/zz-temp-result-ineligible-autoqueue-r1.yml
          git add browser/GAMEROAD.html
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/zz-temp-result-ineligible-autoqueue-r1.yml' 'browser/GAMEROAD.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'fix(result): hide unavailable autoqueue state'
          git push origin HEAD:work/result-ineligible-autoqueue-r1-20260901
