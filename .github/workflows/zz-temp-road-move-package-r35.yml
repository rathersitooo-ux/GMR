name: temp-road-move-package-r35

on:
  push:
    branches:
      - sol/road-move-package-r35-20260912

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-package-r35-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Insert existing Road compatibility core into public artifact list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/scripts/build.mjs')
          s = p.read_text(encoding='utf-8')
          needle = "  { source: 'browser/battle-new-base-live-consumer-adapter.mjs', output: 'battle-new-base-live-consumer-adapter.mjs', artifact: 'battle_new_base_live_consumer_adapter', label: 'Battle New Base live consumer adapter' },"
          entry = "  { source: 'browser/road-move-compatibility-core.mjs', output: 'road-move-compatibility-core.mjs', artifact: 'road_move_compatibility_core', label: 'Road move compatibility core' },"
          if entry in s or 'road-move-compatibility-core.mjs' in s:
              raise SystemExit('road artifact already present; fail closed')
          if s.count(needle) != 1:
              raise SystemExit(f'anchor count != 1: {s.count(needle)}')
          p.write_text(s.replace(needle, needle + '\n' + entry, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- deploy/cloudflare/scripts/build.mjs | awk '{print $1":"$2}')" = "1:0"
      - name: Focused Road and Cloudflare package tests
        run: node --test tests/road-move-compatibility-core.test.mjs deploy/cloudflare/tests/build.test.mjs
      - name: Finalize durable build-only diff
        shell: bash
        run: |
          rm .github/workflows/zz-temp-road-move-package-r35.yml
          rm data/preaction-authorizations/ROAD-MOVE-PACKAGE-R35-20260912T1712-SOL-Q7N4V13.json
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/zz-temp-road-move-package-r35.yml data/preaction-authorizations/ROAD-MOVE-PACKAGE-R35-20260912T1712-SOL-Q7N4V13.json deploy/cloudflare/scripts/build.mjs "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Battle: package existing Road compatibility core'
          git push origin HEAD:sol/road-move-package-r35-20260912
