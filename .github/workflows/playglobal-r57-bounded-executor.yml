name: PLAYGLOBAL R57 bounded executor

on:
  push:
    branches:
      - work/playglobal-r57-three-visible-consumers-samebuild-20260825-1646
    paths:
      - .github/workflows/playglobal-r57-bounded-executor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/playglobal-r57-three-visible-consumers-samebuild-20260825-1646
          fetch-depth: 0
      - name: Guard current R57 preimages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "a0dc0848831d9e0739e3b920d200f6711675ac08"
          grep -q 'GAMEROAD PARTNER ADVICE OBJECT PROJECTION R24' browser/GAMEROAD.html
          ! grep -q 'GAMEROAD BOARD109 VISIBLE EXPLANATION R57' browser/GAMEROAD.html
          grep -q 'battle-partner-advice-object-projection-visible' tests/browser-full-interaction.spec.mjs
          ! grep -q 'battle-board109-visible-r57' tests/browser-full-interaction.spec.mjs
      - name: Apply bounded R57 patch and focused checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zz-temp-playglobal-r57-patch.py
          node --check deploy/cloudflare/scripts/build.mjs
          node --test tests/battle-board-visual-explanation-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs deploy/cloudflare/scripts/build.mjs
          git diff --cached --quiet && { echo 'no product delta'; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'R57: mount Partner and BOARD109 on one package-complete Battle build'
          git push origin HEAD:work/playglobal-r57-three-visible-consumers-samebuild-20260825-1646
