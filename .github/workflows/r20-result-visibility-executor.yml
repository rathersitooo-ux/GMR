name: R20 Result Visibility Fresh-Main Repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - '.github/workflows/r20-result-visibility-executor.yml'
  push:
    branches:
      - work/free4p-r20-result-visibility-recovery
    paths:
      - '.github/workflows/r20-result-visibility-executor.yml'

permissions:
  contents: write

env:
  EXPECTED_MAIN: 4c30486c3a39433da2b2c31a0d549cb1bda3b888
  EXPECTED_HTML_BLOB: 12839c58646f849f0ad4470695c391bfb07b1174
  EXPECTED_TEST_BLOB: b515aeb3c27b70181e88198cff40d602eb0b1510

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/free4p-r20-result-visibility-recovery
          fetch-depth: 0

      - name: Guard exact fresh-main target inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXPECTED_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXPECTED_TEST_BLOB"

      - name: Apply bounded Result visibility repair and geometry regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          html = html_path.read_text(encoding='utf-8')
          style_id = 'gameroad-r20-result-ranking-visibility-r1'
          if style_id in html:
              raise SystemExit('R20 Result visibility style already exists')
          if html.count('</head>') != 1:
              raise SystemExit(f'unexpected </head> count: {html.count("</head>")}')

          css = r'''<style id="gameroad-r20-result-ranking-visibility-r1">
          /* R20: presentation-only. Keep all four final Free4P ranks readable in
             the initial Result viewport; ranking/order/outcome/actions remain unchanged. */
          .result.active #resultRanking{
            display:grid;
            grid-template-rows:repeat(4,minmax(0,1fr));
            gap:5px;
            overflow:hidden;
          }
          .result.active #resultRanking .rankLine{
            min-height:0;
            margin-bottom:0;
          }
          @media (max-height:500px) and (orientation:landscape){
            .result.active #resultRanking{gap:2px}
            .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:2px 6px}
          }
          @media (max-width:540px) and (orientation:portrait){
            .result.active #resultRanking{gap:2px}
            .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:3px 7px}
            .result.active .resultBtns{grid-template-columns:repeat(3,minmax(0,1fr))}
          }
          </style>
          '''
          html_path.write_text(html.replace('</head>', css + '</head>', 1), encoding='utf-8')

          test_path = Path('tests/browser-full-interaction.spec.mjs')
          test_src = test_path.read_text(encoding='utf-8')
          anchor = "await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);"
          if test_src.count(anchor) != 1:
              raise SystemExit(f'unexpected R19 four-row anchor count: {test_src.count(anchor)}')
          marker = 'R20 result ranking viewport must have geometry'
          if marker in test_src:
              raise SystemExit('R20 Result geometry regression already exists')
          regression = r'''
            const rankingViewport = await result.locator('#resultRanking').boundingBox();
            expect(rankingViewport, 'R20 result ranking viewport must have geometry').not.toBeNull();
            const rankingRows = await result.locator('#resultRanking .rankLine').evaluateAll((rows) => rows.map((row) => {
              const rect = row.getBoundingClientRect();
              return { top: rect.top, bottom: rect.bottom, height: rect.height };
            }));
            expect(rankingRows).toHaveLength(4);
            for (const [index, row] of rankingRows.entries()) {
              expect(row.height, `R20 rank row ${index + 1} must have positive visible height`).toBeGreaterThan(0);
              expect(row.top, `R20 rank row ${index + 1} must start inside ranking viewport`).toBeGreaterThanOrEqual(rankingViewport.y - 1);
              expect(row.bottom, `R20 rank row ${index + 1} must end inside ranking viewport`).toBeLessThanOrEqual(rankingViewport.y + rankingViewport.height + 1);
            }
            const resultButtonsBox = await result.locator('.resultBtns').boundingBox();
            expect(resultButtonsBox, 'R20 result actions must have geometry').not.toBeNull();
            expect(rankingRows.at(-1).bottom, 'R20 fourth rank row must not be covered by Result actions').toBeLessThanOrEqual(resultButtonsBox.y + 1);
          '''
          test_path.write_text(test_src.replace(anchor, anchor + regression, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run focused visible four-player Result regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/browser-full-interaction.spec.mjs --config=playwright.full-interaction.config.mjs --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home" --workers=1 --reporter=line

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-result-visibility-candidate-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**

      - name: Commit only durable product and direct regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-r20-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          test "$(git diff --cached --name-only | sort)" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'
          git diff --cached --check
          git commit -m 'R20: keep all four Free4P Result ranks visible'
          git push origin HEAD:work/free4p-r20-result-visibility-recovery
