name: TEMP X9 Battle Load Chain Live R2

on:
  push:
    branches:
      - sol/battle-load-chain-live-r2-20260914
    paths:
      - tools/temp-battle-load-chain-live-r2.py

permissions:
  contents: write

jobs:
  bounded-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-load-chain-live-r2-20260914
          fetch-depth: 0
      - name: Apply exact bounded patch
        run: python3 tools/temp-battle-load-chain-live-r2.py
      - name: Syntax and focused regression
        run: |
          node --check browser/battle-screen-runtime-mount.mjs
          node --check tests/battle-screen-runtime-mount.test.mjs
          node --test tests/battle-screen-runtime-mount.test.mjs
          git diff --check
      - name: Scope fence
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=$'browser/battle-screen-runtime-mount.mjs\ntests/battle-screen-runtime-mount.test.mjs'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
      - name: Commit bounded product
        shell: bash
        run: |
          git config user.name gameroad-bounded-writer
          git config user.email actions@users.noreply.github.com
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
          git commit -m "fix(battle): connect accepted LOAD identity to played chain"
          git push origin HEAD:sol/battle-load-chain-live-r2-20260914
