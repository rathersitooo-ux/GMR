name: TEMP Result Shortland Rank R2

on:
  push:
    branches:
      - work/result-shortland-rank-r2-20260901

permissions:
  contents: write

concurrency:
  group: temp-result-shortland-rank-r2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and patch Result short landscape
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/result-shortland-rank-r2-20260901"
          git merge-base --is-ancestor 4d89cf0e487b2202d82bffe2e1042a7bffa6fdfa HEAD
          test -f data/preaction-authorizations/RESULT-SHORTLAND-RANK-R2-20260901T1927-SOL-H6Q2M8.json
          grep -Fq '"leaseSnapshotReadbackRef": "CURRENT_ACTIVE_LEASES!A5:L5"' data/preaction-authorizations/RESULT-SHORTLAND-RANK-R2-20260901T1927-SOL-H6Q2M8.json
          grep -Fq '".github/workflows/zz-temp-result-shortland-rank-r2.yml"' data/preaction-authorizations/RESULT-SHORTLAND-RANK-R2-20260901T1927-SOL-H6Q2M8.json
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "e3b13b6a770be20ee038bd0e829fc39730e2fac3" || grep -Fq 'gameroad-result-shortland-rank-r2' browser/GAMEROAD.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text(encoding='utf-8')
          patch='''\n/* Result R2: R62 mobile stacking is portrait-only at short-landscape height.\n   Reuse the existing compact side-by-side Result composition so four ranks retain space. */\n@media (max-height:470px) and (orientation:landscape){\n  .result.active .resultWorld{inset:0 55% 0 0}\n  .result.active .resultBody{left:48%;right:2%;top:9%;bottom:18%;padding:7px 9px;gap:4px}\n}\n'''
          tag='gameroad-result-shortland-rank-r2'
          if tag not in s:
              marker='<style id="gameroad-result-visual-hierarchy-r62">'
              assert s.count(marker)==1
              start=s.index(marker)
              end=s.index('</style>', start)
              insertion='\n<style id="'+tag+'">'+patch+'</style>'
              s=s[:end+8]+insertion+s[end+8:]
              p.write_text(s,encoding='utf-8')
          assert s.count(tag)==1
          PY
          git diff --check -- browser/GAMEROAD.html
      - name: Browser static check
        run: node tests/browser-static-check.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify existing R19 Result path
        run: npx playwright test tests/browser-full-interaction.spec.mjs --config=playwright.full-interaction.config.mjs --workers=1 --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home"
      - name: Commit verified product patch if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- browser/GAMEROAD.html; then
            echo 'No product commit needed on verification rerun.'
            exit 0
          fi
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --cached --name-only)" = "browser/GAMEROAD.html"
          git commit -m 'fix(result): restore short-landscape ranking space'
          git push origin HEAD:work/result-shortland-rank-r2-20260901
