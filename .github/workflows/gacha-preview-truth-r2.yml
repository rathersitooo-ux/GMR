name: Gacha Preview Truth Public R2

on:
  push:
    branches:
      - sol/gacha-preview-truth-r2-20260907
    paths:
      - '.github/workflows/gacha-preview-truth-r2.yml'
      - 'data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R2-20260907T0059-SOL-K8N4Q7.json'

permissions:
  contents: write

jobs:
  reuse-and-package:
    if: ${{ github.ref == 'refs/heads/sol/gacha-preview-truth-r2-20260907' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/gacha-preview-truth-r2-20260907
          fetch-depth: 0

      - name: Verify current authorization and donor compatibility
        shell: bash
        run: |
          set -euo pipefail
          BASE=e12a0191656f066c4a66577269c8c26096d2e7ce
          DONOR_BRANCH=sol/gacha-preview-truth-r1-20260906
          DONOR_BASE=f27a3ab8e1a8ea4e6a4db2faf657ae2a6b4c6136
          AUTH=data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R2-20260907T0059-SOL-K8N4Q7.json
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test -f "$AUTH"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R2-20260907T0059-SOL-K8N4Q7.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['authorizationBaseSha']=='e12a0191656f066c4a66577269c8c26096d2e7ce'
          assert d['leaseState']=='ACTIVE'
          assert d['predictionStatus']=='PASS'
          assert d['reuseDisposition']=='ADAPT'
          assert 'deploy/cloudflare/tests/build.test.mjs' in d['scope']
          assert d['proceedToken'].startswith('PROCEED|GACHA-PREVIEW-TRUTH-R2-20260907T0059-SOL-K8N4Q7|')
          PY
          git fetch origin "$DONOR_BRANCH":refs/remotes/origin/gacha-preview-r1
          cmp <(git show "$BASE":browser/screen-navigation-core.mjs) <(git show "$DONOR_BASE":browser/screen-navigation-core.mjs)
          git show origin/gacha-preview-r1:browser/gacha-preview-disclosure-runtime.mjs >/dev/null
          git show origin/gacha-preview-r1:tests/gacha-preview-disclosure-runtime.test.mjs >/dev/null

      - name: Reuse tested preview disclosure and close package dependency
        shell: bash
        run: |
          set -euo pipefail
          DONOR=origin/gacha-preview-r1
          git show "$DONOR":browser/gacha-preview-disclosure-runtime.mjs > browser/gacha-preview-disclosure-runtime.mjs
          git show "$DONOR":browser/screen-navigation-core.mjs > browser/screen-navigation-core.mjs
          git show "$DONOR":tests/gacha-preview-disclosure-runtime.test.mjs > tests/gacha-preview-disclosure-runtime.test.mjs
          python - <<'PY'
          from pathlib import Path
          build=Path('deploy/cloudflare/scripts/build.mjs')
          text=build.read_text(encoding='utf-8')
          anchor="  { option: 'navigationCoreSource', expected: 'expectedNavigationCoreBlob', source: 'browser/screen-navigation-core.mjs', output: 'screen-navigation-core.mjs', artifact: 'screen_navigation_core', label: 'Screen navigation core', sourceFlag: '--navigation-core-source', expectedFlag: '--expected-navigation-core-blob' },\n"
          line="  { source: 'browser/gacha-preview-disclosure-runtime.mjs', output: 'gacha-preview-disclosure-runtime.mjs', artifact: 'gacha_preview_disclosure_runtime', label: 'Gacha preview disclosure runtime' },\n"
          if line not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'package anchor mismatch: {text.count(anchor)}')
              text=text.replace(anchor, anchor+line)
              build.write_text(text, encoding='utf-8')

          test=Path('deploy/cloudflare/tests/build.test.mjs')
          text=test.read_text(encoding='utf-8')
          old="{ file: 'screen-navigation-core.mjs', source: 'browser/screen-navigation-core.mjs', sourceArg: 'navigationCoreSource', expectedArg: 'expectedNavigationCoreBlob', artifact: 'screen_navigation_core', fixture: 'export function resolveScreenNavigation(){ return { ok: true }; }\\n', currentBlob: 'b6bfc5d4001916796e87d901986493adb5ae809c' }"
          new="{ file: 'screen-navigation-core.mjs', source: 'browser/screen-navigation-core.mjs', sourceArg: 'navigationCoreSource', expectedArg: 'expectedNavigationCoreBlob', artifact: 'screen_navigation_core', fixture: 'export function resolveScreenNavigation(){ return { ok: true }; }\\n', currentBlob: '4df91bfe80057afa9d63e59f3eb123438f52b9cf' }"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'provenance anchor mismatch: {text.count(old)}')
              text=text.replace(old, new)
              test.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- browser/gacha-preview-disclosure-runtime.mjs browser/screen-navigation-core.mjs tests/gacha-preview-disclosure-runtime.test.mjs deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs

      - name: Run focused and package tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/gacha-preview-disclosure-runtime.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

      - name: Commit clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gacha-preview-truth-r2.yml data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R2-20260907T0059-SOL-K8N4Q7.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add browser/gacha-preview-disclosure-runtime.mjs browser/screen-navigation-core.mjs tests/gacha-preview-disclosure-runtime.test.mjs deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m 'Gacha: ship preview-only disclosure dependency'
          git push origin HEAD:sol/gacha-preview-truth-r2-20260907
