name: TEMP Battle Camera HTML R8

on:
  push:
    branches:
      - sol/battle-camera-html-r8-20260913

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal current-anchor camera seam
        shell: bash
        run: |
          set -euo pipefail
          BASE='65c96195ca8eaf090fdb29e7253ab55499a18d9e'
          PRE='42275925971468964c669003b92f35be66f6f9c7'
          test "$(git rev-parse ${PRE}^)" = "$BASE"
          git merge-base --is-ancestor "$PRE" HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {n}')
              s=s.replace(old,new,1)

          one(
            "let fieldGL=null,fieldProgram=null,fieldProjection=new Map(),fieldMVP=null,fieldCameraState=null,fieldViewSize={w:1,h:1},routeDrag=null,fieldResizeQueued=false,fieldLastStats={mode:'none',vertices:0,grassTufts:0,lowPerf:false};",
            "let fieldGL=null,fieldProgram=null,fieldProjection=new Map(),fieldMVP=null,fieldCameraState=null,grBattleCameraView=null,grBattleCameraRenderQueued=false,fieldViewSize={w:1,h:1},routeDrag=null,fieldResizeQueued=false,fieldLastStats={mode:'none',vertices:0,grassTufts:0,lowPerf:false};",
            'camera-state')

          one(
            "function project3(w){const c=fieldCameraState;if(!c)return null;const eye=c.eye,rx=w.x-eye[0],ry=(w.y||0)-eye[1],rz=w.z-eye[2],q=Math.SQRT1_2,cx=rx,cy=q*ry-q*rz,cz=-q*ry-q*rz;if(cz<=.08)return null;const t=Math.tan(Math.PI/10.2),nx=cx/(cz*t*c.aspect),ny=cy/(cz*t);return{x:(nx*.5+.5)*100,y:(c.yBase-ny*c.yGain)*100}}",
            "function project3(w){const c=fieldCameraState;if(!c)return null;const eye=c.eye,rx=w.x-eye[0],ry=(w.y||0)-eye[1],rz=w.z-eye[2],pitch=Number.isFinite(c.pitchRad)?c.pitchRad:Math.PI/4,cp=Math.cos(pitch),sp=Math.sin(pitch),cx=rx,cy=cp*ry-sp*rz,cz=-sp*ry-cp*rz;if(cz<=.08)return null;const t=Math.tan(Math.PI/10.2),nx=cx/(cz*t*c.aspect),ny=cy/(cz*t);return{x:(nx*.5+.5)*100,y:(c.yBase-ny*c.yGain)*100}}",
            'js-pitch')

          one(
            "function fieldCamera(viewer){const profile=fieldViewportProfile(),battleFocus=fieldBattleFocusNodes(),moveFocus=fieldMoveFocusNodes(),focus=battleFocus?.length?battleFocus:moveFocus;",
            "function fieldCamera(viewer){const profile=fieldViewportProfile();if(grBattleCameraView){const angle=Math.max(28,Math.min(62,Number(grBattleCameraView.angle)||45)),pitchRad=angle*Math.PI/180,followDistance=profile.kind==='portrait'?12:profile.kind==='short-landscape'?9.5:11,zoom=Math.max(.5,Math.min(1.25,Number(grBattleCameraView.zoom)||1)),distance=followDistance/zoom,cx=Number(grBattleCameraView.center?.x)||0,cz=Number(grBattleCameraView.center?.y)||0,eye=[cx,distance*Math.sin(pitchRad),cz+distance*Math.cos(pitchRad)],center=[cx,0,cz];return{eye,center,r:distance,moveFocus:false,battleFocus:false,pitchRad,cameraMode:String(grBattleCameraView.mode||'FOLLOW_CONTROLLED'),...profile}}const battleFocus=fieldBattleFocusNodes(),moveFocus=fieldMoveFocusNodes(),focus=battleFocus?.length?battleFocus:moveFocus;",
            'camera-manual-branch')

          adapter="""function grBattleCameraSource(){const m=state.match;if(!m||state.screen!=='battle'||!Array.isArray(m.players)||!m.players[0])return null;const me=m.players[0],w=nodeWorld(me.position,me),map=$('#battleMap'),mw=Math.max(1,map?.clientWidth||innerWidth),mh=Math.max(1,map?.clientHeight||innerHeight);return{matchId:String(m.id||''),controlledCharacterId:`${me.id}:${String(me.character||state.playerCharacterId||'controlled')}`,controlledWorldPoint:{x:w.x,y:w.z},followZoom:1,followAngle:45,limits:{x:{min:-13,max:13},y:{min:-13,max:13},zoom:{min:.5,max:1.25},angle:{min:28,max:62}},reducedMotion:!!state.settings.reduceMotion,lowPerformance:!!state.settings.lowPerf,gestureCalibration:{panWorldUnitsPerPixelX:-26/mw,panWorldUnitsPerPixelY:-26/mh,wheelZoomRate:.0015,angleDegreesPerWheelDelta:.08,angleDegreesPerPixel:.18,dragThresholdPx:5}}}\nfunction grRefreshBattleCameraProjection(){if(state.screen!=='battle'||!state.match)return;renderField3D();const me=state.match.players[0],moveLimit=normalMoveLimitForRoad(me.plan?.roadId),reach=state.match.phase==='plan'&&me.plan?.roadId&&moveLimit>0?reachable(me,moveLimit):new Map();renderRangeSurfaces(reach,moveLimit,me);$$('#board .node').forEach(e=>{const xy=nodeXY(e.dataset.pos,me);e.style.left=xy[0]+'%';e.style.top=xy[1]+'%'});renderBoardPlayers();renderRouteLine();const visual=(state.match.phase==='plan'&&me.plan?.path?.length)?me.plan.path.at(-1):me.position,xy=nodeXY(visual,me),actor=$('#battleRuntime');if(actor){actor.style.left=xy[0]+'%';actor.style.top=xy[1]+'%'}layoutBoardPlayerTokens()}\nfunction grBattleCameraApplyView(cameraState){if(!cameraState||!cameraState.center)return;grBattleCameraView={mode:String(cameraState.mode||'FOLLOW_CONTROLLED'),center:{x:Number(cameraState.center.x)||0,y:Number(cameraState.center.y)||0},zoom:Number(cameraState.zoom)||1,angle:Number(cameraState.angle)||45};if(grBattleCameraRenderQueued)return;grBattleCameraRenderQueued=true;requestAnimationFrame(()=>{grBattleCameraRenderQueued=false;grRefreshBattleCameraProjection()})}\nwindow.__GAMEROAD_BATTLE_CAMERA_FIELD_ADAPTER__=Object.freeze({readSource:grBattleCameraSource,applyView:grBattleCameraApplyView,snapshot:()=>({view:grBattleCameraView?{...grBattleCameraView,center:{...grBattleCameraView.center}}:null,field:fieldCameraState?{eye:[...fieldCameraState.eye],center:[...fieldCameraState.center],pitchRad:fieldCameraState.pitchRad??Math.PI/4,cameraMode:fieldCameraState.cameraMode||null}:null,authority:{gameplay:false,movement:false,target:false,legality:false,stateWrite:false}})});\n"""
          one("function fieldProject(id,viewer){",adapter+"function fieldProject(id,viewer){",'field-adapter')

          one("uniform vec3 uEye;uniform vec3 uLight;uniform vec4 uView;varying vec3 vColor;", "uniform vec3 uEye;uniform vec3 uLight;uniform vec4 uView;uniform vec2 uPitch;varying vec3 vColor;", 'shader-uniform')
          one("float q=.70710678;float cx=r.x;float cy=q*r.y-q*r.z;float cz=max(.08,-q*r.y-q*r.z);", "float cp=uPitch.x;float sp=uPitch.y;float cx=r.x;float cy=cp*r.y-sp*r.z;float cz=max(.08,-sp*r.y-cp*r.z);", 'shader-pitch')
          one("gl.uniform4f(gl.getUniformLocation(fieldProgram,'uView'),Math.tan(Math.PI/10.2),cam.aspect,cam.yBase,cam.yGain);gl.drawArrays", "gl.uniform4f(gl.getUniformLocation(fieldProgram,'uView'),Math.tan(Math.PI/10.2),cam.aspect,cam.yBase,cam.yGain);const pitch=Number.isFinite(cam.pitchRad)?cam.pitchRad:Math.PI/4;gl.uniform2f(gl.getUniformLocation(fieldProgram,'uPitch'),Math.cos(pitch),Math.sin(pitch));gl.drawArrays", 'shader-pitch-value')

          one("show('battle');setupBattleDetails();renderBattle();return state.match}", "show('battle');setupBattleDetails();renderBattle();window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.syncFromGame?.();return state.match}", 'start-sync')
          one("function grControlledCharacter4pEvent(p,type,detail={}){const emit=window.__GAMEROAD_CONTROLLED_CHARACTER_4P_EVENT__;", "function grControlledCharacter4pEvent(p,type,detail={}){if(p?.human)window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.syncFromGame?.();const emit=window.__GAMEROAD_CONTROLLED_CHARACTER_4P_EVENT__;", 'movement-sync')

          oldrail='<div class="battleRail"><button class="railBtn" id="detailsBtn" aria-label="対戦情報">情報</button><button class="railBtn" id="dangerBtn" aria-label="移動可能範囲">範囲</button><button class="railBtn warn" id="leaveMatch">退出</button></div>'
          newrail='<div class="battleRail"><button class="railBtn" id="detailsBtn" aria-label="対戦情報">情報</button><button class="railBtn" id="dangerBtn" aria-label="移動可能範囲">範囲</button><button class="railBtn" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る">自分</button><button class="railBtn warn" id="leaveMatch">退出</button></div>'
          one(oldrail,newrail,'return-button')

          mount=r'''\n<style id="gameroad-battle-camera-live-style">\n#battleMap[data-camera-live="1"]{touch-action:none}\n#cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}\n</style>\n<script type="module" id="gameroad-battle-camera-live">\nimport { mountBattleCameraLiveRuntime } from './battle-camera-live-runtime.mjs';\n(() => {\n  const adapter=globalThis.__GAMEROAD_BATTLE_CAMERA_FIELD_ADAPTER__;\n  if(!adapter||typeof adapter.readSource!=='function'||typeof adapter.applyView!=='function')return;\n  let runtime=null,key='';\n  const world=document.querySelector('#battleMap'),returnControl=document.querySelector('#cameraReturnBtn');\n  if(!world||!returnControl)return;\n  world.dataset.cameraLive='1';\n  function isScreenUiTarget(target){if(!(target instanceof Element))return true;if(target===world||target.id==='fieldCanvas'||target.id==='board'||target.id==='boardPlayers'||target.id==='routeSvg'||target.id==='rangeSurfaceLayer'||target.id==='routeLine')return false;if(target.closest('#fieldCanvas,#routeSvg')&&!target.closest('button,select,input,textarea,a,[role="button"]'))return false;return true}\n  function destroy(){runtime?.destroy?.();runtime=null;key='';delete world.dataset.cameraMode;delete returnControl.dataset.cameraMode}\n  function syncFromGame(){const source=adapter.readSource();if(!source){destroy();return null}const nextKey=`${source.matchId}|${source.controlledCharacterId}`;if(!runtime||key!==nextKey){destroy();runtime=mountBattleCameraLiveRuntime({worldElement:world,returnControlElement:returnControl,controlledCharacterId:source.controlledCharacterId,controlledWorldPoint:source.controlledWorldPoint,followZoom:source.followZoom,followAngle:source.followAngle,limits:source.limits,reducedMotion:source.reducedMotion,lowPerformance:source.lowPerformance,gestureCalibration:source.gestureCalibration,isScreenUiTarget,applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode}});key=nextKey}else runtime.syncControlledPoint(source.controlledWorldPoint);const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;return cameraState}\n  const api=Object.freeze({syncFromGame,returnToControlled:()=>runtime?.returnToControlled?.()||null,snapshot:()=>({mounted:!!runtime,key,state:runtime?.getState?.()||null,field:adapter.snapshot?.()||null})});\n  globalThis.__GAMEROAD_BATTLE_CAMERA_LIVE__=api;\n  syncFromGame();\n  const battle=document.querySelector('section[data-screen="battle"]');\n  if(battle)new MutationObserver(()=>{if(battle.classList.contains('active'))syncFromGame()}).observe(battle,{attributes:true,attributeFilter:['class','hidden','aria-hidden']});\n})();\n</script>\n'''
          mount=mount.replace(r'\n','\n')
          if s.count('</body>')!=1: raise SystemExit('body close anchor not unique')
          s=s.replace('</body>',mount+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

          cat > tests/battle-camera-live-integration.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';
          const html=fs.readFileSync(new URL('../browser/GAMEROAD.html',import.meta.url),'utf8');
          test('existing camera runtime is mounted into current Battle field without a second engine',()=>{
            assert.match(html,/id="gameroad-battle-camera-live"/);
            assert.match(html,/import \{ mountBattleCameraLiveRuntime \} from '\.\/battle-camera-live-runtime\.mjs'/);
            assert.match(html,/function grBattleCameraSource\(\)/);
            assert.match(html,/controlledWorldPoint:\{x:w\.x,y:w\.z\}/);
            assert.match(html,/if\(grBattleCameraView\)\{/);
            assert.match(html,/followDistance=profile\.kind==='portrait'\?12:profile\.kind==='short-landscape'\?9\.5:11/);
            assert.doesNotMatch(html,/new THREE|THREE\.|new .*CameraController/);
          });
          test('manual camera keeps DOM and WebGL projection on the same pitch',()=>{
            assert.match(html,/pitch=Number\.isFinite\(c\.pitchRad\)\?c\.pitchRad:Math\.PI\/4/);
            assert.match(html,/uniform vec2 uPitch/);
            assert.match(html,/gl\.uniform2f\(gl\.getUniformLocation\(fieldProgram,'uPitch'\),Math\.cos\(pitch\),Math\.sin\(pitch\)\)/);
            assert.match(html,/angle:\{min:28,max:62\}/);
          });
          test('camera has one-action return and ignores screen-space UI gestures',()=>{
            assert.match(html,/id="cameraReturnBtn"[^>]+操作キャラへカメラを戻す/);
            assert.match(html,/isScreenUiTarget\(target\)/);
            assert.match(html,/target\.closest\('button,select,input,textarea,a,\[role="button"\]'\)/);
            assert.match(html,/returnControlElement:returnControl/);
          });
          test('camera follows authoritative controlled position but owns no gameplay state',()=>{
            assert.match(html,/if\(p\?\.human\)window\.__GAMEROAD_BATTLE_CAMERA_LIVE__\?\.syncFromGame\?\.\(\)/);
            assert.match(html,/authority:\{gameplay:false,movement:false,target:false,legality:false,stateWrite:false\}/);
            assert.match(html,/MANUAL_INSPECT/);
            assert.match(html,/syncControlledPoint\(source\.controlledWorldPoint\)/);
            const start=html.indexOf('function grBattleCameraSource()');
            const end=html.indexOf('function fieldProject',start);
            assert.ok(start>=0&&end>start);
            const adapter=html.slice(start,end);
            assert.doesNotMatch(adapter,/(?:state\.match\.target|me\.position|me\.plan\.path)\s*=/);
          });
          EOF

          git add browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs
          python - <<'PY'
          import subprocess
          expected={'browser/GAMEROAD.html','tests/battle-camera-live-integration.test.mjs'}
          got=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).split())
          if got!=expected: raise SystemExit(f'unexpected product delta: {sorted(got)}')
          PY
          node --check browser/battle-camera-input-router.mjs
          node --check browser/battle-camera-live-runtime.mjs
          node --test tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs tests/battle-camera-live-integration.test.mjs
          node tests/browser-static-check.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --cached --check

      - name: Commit tested camera mount
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git commit -m 'Battle: 既存自由カメラを実画面へ最小接続 R8'

      - name: Cleanup transient authorization and workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-battle-camera-html-r8.yml
          git rm data/preaction-authorizations/BATTLE-CAMERA-HTML-R8-20260913T1953-SOL.json
          git commit -m 'Cleanup Battle camera HTML R8 transient files'
          git push origin HEAD:sol/battle-camera-html-r8-20260913
