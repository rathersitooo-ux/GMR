name: TEMP Setup Short Landscape CTA Evidence R1

on:
  push:
    branches:
      - sol/setup-short-landscape-cta-r1-20260905
    paths:
      - '.github/workflows/temp-setup-short-landscape-cta-r1.yml'

permissions:
  contents: read

jobs:
  exact-head-browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm product patch is present on this exact head
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'grid-template-columns:minmax(0,1fr) minmax(168px,.9fr)' browser/home-shell-presentation-core.mjs
          grep -Fq '#gameroadBattleFieldSelection .grFieldChoice{min-height:44px!important}' browser/home-shell-presentation-core.mjs
          node --check browser/home-shell-presentation-core.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run existing three-viewport full interaction evidence
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1
      - name: Upload exact-head evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: setup-short-landscape-cta-${{ github.run_id }}
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
          if-no-files-found: error
          retention-days: 14
