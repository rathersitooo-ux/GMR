name: LobbyDeck R4 bounded match-start patch

on:
  push:
    branches:
      - work/lobbydeck-r4-bounded-matchstart
    paths:
      - .github/workflows/lobbydeck-r4-bounded-html-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lobbydeck-r4-bounded-matchstart
          fetch-depth: 8
      - name: Guard base, prove RED, patch exact consumer, prove GREEN
        shell: bash
        run: |
          set -euo pipefail
          BASE=800cbffd2fd513d488df1d78dc6f72c17a300a0d
          HTML_BLOB=f73eef258ae88cea34bb14685e6f31a28ecbc2b8
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git hash-object browser/GAMEROAD.html)" = "$HTML_BLOB"

          if node --test tests/lobby-deck-match-start-mount.test.mjs >/tmp/lobbydeck-baseline.log 2>&1; then
            echo 'Baseline detector unexpectedly GREEN before product mount'
            cat /tmp/lobbydeck-baseline.log
            exit 1
          fi
          grep -Fq 'GAMEROAD_LOBBYDECK_R4_MATCHSTART_SNAPSHOT' /tmp/lobbydeck-baseline.log
          echo 'EXPECTED_BASELINE_RED_OK'

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')

          anchor = '<script src="./deck-save-recovery-core.mjs"></script>'
          if text.count(anchor) != 1:
              raise SystemExit(f'anchor count != 1: {text.count(anchor)}')
          marker = 'GAMEROAD_LOBBYDECK_R4_MATCHSTART_SNAPSHOT'
          if marker in text:
              raise SystemExit('product marker already present on guarded preimage')
          mount = '''<!-- GAMEROAD_LOBBYDECK_R4_MATCHSTART_SNAPSHOT -->
          <script type="module" id="gameroad-lobbydeck-r4-matchstart-snapshot">
          import { createDeckMatchStartSnapshot } from "./deck-save-ack-core.mjs";
          const existingDeckMatchStartSnapshot=globalThis.GAMEROAD_CREATE_DECK_MATCH_START_SNAPSHOT;
          if(existingDeckMatchStartSnapshot&&existingDeckMatchStartSnapshot!==createDeckMatchStartSnapshot)throw new Error("GAMEROAD_DECK_MATCH_START_SNAPSHOT_CONFLICT");
          if(!existingDeckMatchStartSnapshot)Object.defineProperty(globalThis,"GAMEROAD_CREATE_DECK_MATCH_START_SNAPSHOT",{value:createDeckMatchStartSnapshot,enumerable:false,configurable:false,writable:false});
          </script>'''
          text = text.replace(anchor, anchor + '\n' + mount, 1)

          pat = re.compile(r'function startMatch\(\)\{.*?return state\.match\}', re.S)
          hits = list(pat.finditer(text))
          if len(hits) != 1:
              raise SystemExit(f'startMatch count != 1: {len(hits)}')
          fn = hits[0].group(0)

          old_gate = "const valid=validateDeck(state.savedDeck,{forBattle:true});if(!valid.ok){toast('札組を修正: '+valid.errors[0]);show('setup');renderSetupDeckStatus();return null}"
          if fn.count(old_gate) != 1:
              raise SystemExit(f'old deck gate count != 1: {fn.count(old_gate)}')
          new_gate = "const snapshotFactory=globalThis.GAMEROAD_CREATE_DECK_MATCH_START_SNAPSHOT;let snapshot;try{if(typeof snapshotFactory!=='function')throw new Error('MATCH_START_SNAPSHOT_RUNTIME_UNAVAILABLE');snapshot=snapshotFactory({savedDeck:state.savedDeck,savedDeckRule:state.savedDeckRule,setupMode:state.setupMode,setupContent:state.setupContent,playerCharacterId:state.playerCharacterId,selectedPartnerId:state.selectedPartnerId},{validateDeck})}catch(e){const message=String(e?.message||e),prefix='MATCH_START_DECK_INVALID:';toast(message.startsWith(prefix)?'札組を修正: '+message.slice(prefix.length):'対戦開始状態を確認できません');show('setup');renderSetupDeckStatus();return null}"
          fn = fn.replace(old_gate, new_gate, 1)

          replacements = [
              ("const n=playerCount(state.setupMode),ps=[],diagnosticCpuDeck=[...state.savedDeck.main];for(let i=0;i<n;i++)ps.push(makePlayer(i,i===0,i===0?state.savedDeck.main:diagnosticCpuDeck));if(state.setupMode==='2v2')", "const n=playerCount(snapshot.setup.mode),ps=[],diagnosticCpuDeck=[...snapshot.deck.main];for(let i=0;i<n;i++)ps.push(makePlayer(i,i===0,i===0?[...snapshot.deck.main]:diagnosticCpuDeck));if(snapshot.setup.mode==='2v2')"),
              ("mode:state.setupMode,contentId:state.setupContent", "mode:snapshot.setup.mode,contentId:snapshot.setup.content"),
              ("busy:false,honey:", "busy:false,deckStartSnapshot:snapshot,honey:"),
              ("playerDeckRule:{id:DECK_RULE.id,revision:DECK_RULE.revision,mainCount:state.savedDeck.main.length,exCount:state.savedDeck.ex.length}", "playerDeckRule:{id:snapshot.deck.ruleId,revision:snapshot.deck.ruleRevision,mainCount:snapshot.deck.main.length,exCount:snapshot.deck.ex.length}"),
              ("log(state.setupContent==='honey_hunt'?", "log(snapshot.setup.content==='honey_hunt'?"),
          ]
          for old, new in replacements:
              if fn.count(old) != 1:
                  raise SystemExit(f'expected unique startMatch fragment missing: {old[:100]!r} count={fn.count(old)}')
              fn = fn.replace(old, new, 1)

          if 'validateDeck(state.savedDeck' in fn or 'makePlayer(i,i===0,i===0?state.savedDeck.main' in fn:
              raise SystemExit('mutable savedDeck consumer remained in startMatch')
          if fn.count('snapshot.deck.main') < 3 or 'deckStartSnapshot:snapshot' not in fn:
              raise SystemExit('snapshot consumer projection incomplete')

          text = text[:hits[0].start()] + fn + text[hits[0].end():]
          path.write_text(text, encoding='utf-8')

          # Emit bounded parser inputs; do not parse the whole HTML as JavaScript.
          Path('/tmp/lobbydeck-startmatch.mjs').write_text(fn + '\n', encoding='utf-8')
          module_hit = re.search(r'<script type="module" id="gameroad-lobbydeck-r4-matchstart-snapshot">(.*?)</script>', text, re.S)
          if not module_hit:
              raise SystemExit('module mount not found after patch')
          Path('/tmp/lobbydeck-mount.mjs').write_text(module_hit.group(1).strip() + '\n', encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "browser/GAMEROAD.html "
          node --check /tmp/lobbydeck-startmatch.mjs
          node --check /tmp/lobbydeck-mount.mjs
          node --check browser/deck-save-ack-core.mjs
          node --test tests/lobby-deck-match-start-mount.test.mjs tests/deck-save-ack-core.test.mjs tests/deck-save-recovery-core.test.mjs
          echo 'PRODUCT_PATCH_GREEN_OK'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git commit -m 'Browser: mount immutable selected deck at match start'
          git push origin HEAD:work/lobbydeck-r4-bounded-matchstart
