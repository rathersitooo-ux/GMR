name: TEMP Newbase Consumer R74 Authority Map

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authority-map:
    if: github.head_ref == 'work/newbase-production-consumer-r74-20260902'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Map oversized GAMEROAD runtime seams
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          declaration = re.compile(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(|\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=')
          keywords = ('dice','roll','move','movement','battle','janken','rps','rock','scissor','paper','road','goal','turn','result','hand','card','mana','slot','winner','phase','attack','target')
          identifiers = []
          for m in declaration.finditer(text):
              name = m.group(1) or m.group(2)
              low = name.lower()
              if any(k in low for k in keywords):
                  identifiers.append({'name': name, 'offset': m.start()})
          seen = set()
          identifiers = [x for x in identifiers if not (x['name'] in seen or seen.add(x['name']))]

          exact_terms = [
              'runNewBaseTurnWithRuntime', 'new-base-turn-runtime-binding', 'triad-resolver',
              'currentTurn', 'turnIndex', 'nextTurn', 'startTurn', 'endTurn',
              'rollDice', 'dice', 'janken', 'battle', 'road', 'goal', 'result',
              'first valid', 'firstValid', 'selectedJanken', 'ordinaryHandCardIds'
          ]
          snippets = {}
          for term in exact_terms:
              positions = [m.start() for m in re.finditer(re.escape(term), text, flags=re.I)][:6]
              rows = []
              for pos in positions:
                  lo = max(0, pos - 350)
                  hi = min(len(text), pos + len(term) + 650)
                  s = text[lo:hi].replace('\r',' ').replace('\n',' ')
                  rows.append(s)
              snippets[term] = rows

          module_refs = sorted(set(re.findall(r"(?:import\s*\(|src\s*=\s*)['\"](\./[^'\"]+\.(?:mjs|js))", text)))
          report = {
              'html_bytes': len(text.encode('utf-8')),
              'html_chars': len(text),
              'candidate_identifiers': identifiers[:300],
              'candidate_identifier_count': len(identifiers),
              'module_refs': module_refs,
              'snippets': snippets,
          }
          out = Path('/tmp/newbase-r74-authority-map.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('R74_AUTHORITY_MAP_BEGIN')
          print(out.read_text(encoding='utf-8'))
          print('R74_AUTHORITY_MAP_END')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('## R74 authority map\n')
              f.write(f"HTML bytes: {report['html_bytes']}  \\n")
              f.write(f"Candidate identifiers: {report['candidate_identifier_count']}  \\n")
              f.write('Top candidates: ' + ', '.join(x['name'] for x in report['candidate_identifiers'][:80]) + '\n')
          PY
