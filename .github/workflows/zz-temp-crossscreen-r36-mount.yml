        const segmentIds = await conveyorSegments.evaluateAll(nodes => nodes.map(node => node.getAttribute('data-battle-conveyor-segment')));
        expect(new Set(segmentIds).size, 'visual segment identities remain stable and unique').toBe(8);
        conveyorEnvironmentFrames += 1;
