name: zz-temp-battle-camera-live-r4
on:
  push:
    branches:
      - sol/battle-camera-live-r4-20260909
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bounded camera seam probe or patcher
        shell: bash
        run: |
          set -euo pipefail
          python tools/temp-battle-camera-live-r4.py
          if git diff --quiet -- tools/temp-battle-camera-live-r4.py browser/GAMEROAD.html deploy/cloudflare/scripts/build.mjs tests/battle-camera-live-integration.test.mjs; then
            echo "No bounded changes"
            exit 0
          fi
          git config user.name "gameroad-bounded-writer"
          git config user.email "gameroad-bounded-writer@users.noreply.github.com"
          git add tools/temp-battle-camera-live-r4.py browser/GAMEROAD.html deploy/cloudflare/scripts/build.mjs tests/battle-camera-live-integration.test.mjs 2>/dev/null || true
          git diff --cached --name-only
          git commit -m "camera R4: bounded seam probe or live adapt"
          git push origin HEAD:sol/battle-camera-live-r4-20260909
