name: Character Remove R12 Current Inventory

on:
  push:
    branches:
      - work/CHARACTER-REMOVE-R12-FIRSTPLAY-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact current Browser identity
        shell: bash
        run: |
          set -euo pipefail
          test -f browser/GAMEROAD.html
          test "$(git hash-object browser/GAMEROAD.html)" = "ef6c6a8712f8d1cf45774716da74b9cf1a87100a"
          wc -c browser/GAMEROAD.html
      - name: Build bounded current character inventory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const path='browser/GAMEROAD.html'; const text=fs.readFileSync(path,'utf8'); const bytes=fs.readFileSync(path);
          const needles={
            rem:['レム','partner.creator.rem','4834621143'],
            celica:['セリカ','partner.creator.celica','1405809866'],
            paimon:['パイモン','partner.creator.paimon','8117753787'],
            sinon:['シノン','partner.creator.sinon','166894654'],
            miku:['初音ミク','partner.creator.miku','6669297625'],
            fields:['PROD_CHARS','selectedChar','partnerId','characterId','advicePartner']
          };
          function all(needle){let out=[],p=0;while((p=text.indexOf(needle,p))>=0){out.push(p);p+=Math.max(1,needle.length);if(out.length>=300)break;}return out;}
          function ctx(needle,r=450){return all(needle).map(i=>({index:i,context:text.slice(Math.max(0,i-r),Math.min(text.length,i+needle.length+r)).replace(/\s+/g,' ')}));}
          const inventory={source:{path,bytes:bytes.length,gitBlob:process.env.BLOB||'',sha256:crypto.createHash('sha256').update(bytes).digest('hex')},groups:{}};
          for(const [g,ns] of Object.entries(needles)){inventory.groups[g]={};for(const n of ns)inventory.groups[g][n]={count:all(n).length,hits:ctx(n)}}
          function slice(start,end,max=50000){const a=text.indexOf(start);if(a<0)return {error:'start-not-found',startNeedle:start};const z=end?text.indexOf(end,a+start.length):-1;const b=z>=0?Math.min(text.length,z+end.length):Math.min(text.length,a+max);return {start:a,end:b,text:text.slice(a,b)};}
          inventory.slices={
            roster:slice('const PROD_CHARS=[','const AUDIO_DEFAULTS',30000),
            save:slice('function savePack()','function renderHome()',60000),
            characters:slice('function renderCharacters()','function makePlayer',50000),
            makePlayer:slice('function makePlayer','function grDeckIdentityDigest',30000)
          };
          fs.writeFileSync('charremove-r12-current-inventory.json',JSON.stringify(inventory,null,2));
          const summary={source:inventory.source,counts:{}};
          for(const [g,obj] of Object.entries(inventory.groups)){summary.counts[g]={};for(const [n,v] of Object.entries(obj))summary.counts[g][n]=v.count;}
          console.log('CHARREMOVE_R12_CURRENT_BEGIN'); console.log(JSON.stringify(summary,null,2)); console.log('CHARREMOVE_R12_CURRENT_END');
          NODE
        env:
          BLOB: ef6c6a8712f8d1cf45774716da74b9cf1a87100a
      - name: Upload current inventory
        uses: actions/upload-artifact@v4
        with:
          name: charremove-r12-current-inventory
          path: charremove-r12-current-inventory.json
          if-no-files-found: error
