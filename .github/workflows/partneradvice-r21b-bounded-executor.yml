name: TEMP PartnerAdvice R21B bounded executor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/partneradvice-r21b-visible-battle-mount
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fresh-base PRE_ACTION authorization
        shell: bash
        run: |
          set -euo pipefail
          BASE=f57173b295a6487b15d6b2c037fafe598026f324
          FIRST=$(git rev-list --reverse "${BASE}..HEAD" | head -n1)
          test -n "$FIRST"
          test "$(git rev-parse "${FIRST}^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$FIRST" | wc -l)" -eq 1
          git diff-tree --no-commit-id --name-only -r "$FIRST" | grep -Fx 'data/preaction-authorizations/VWORK-PARTNERADVICE-R21B-VISIBLE-BATTLE-PREACTION-20260825T0120.json'
          node - <<'NODE'
          const fs=require('fs');
          const p='data/preaction-authorizations/VWORK-PARTNERADVICE-R21B-VISIBLE-BATTLE-PREACTION-20260825T0120.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.authorizationBaseSha!=='f57173b295a6487b15d6b2c037fafe598026f324') throw Error('stale authorization base');
          if(!String(m.proceedToken||'').startsWith('PROCEED|VWORK-PARTNERADVICE-R21B-VISIBLE-BATTLE-PREACTION-20260825T0120|PREACTION_PROCEED_ALLOWED|MATERIAL_NOVEL|')) throw Error('invalid proceed token');
          for(const path of ['browser/GAMEROAD.html','tests/browser-full-interaction.spec.mjs']) if(!m.scope.includes(path)) throw Error('scope missing '+path);
          NODE
      - name: Apply exact bounded Partner recommendation mount
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path=Path('browser/GAMEROAD.html')
          html=html_path.read_text()
          marker='gameroad-partner-advice-object-projection-r21b'
          if marker in html:
              raise SystemExit('R21B marker already present; refusing duplicate mount')
          required=['partnerAdviceBtn','__GAMEROAD_HATE_PARTNER_TEST__','adviceEnvelope','dangerBtn','showRange','battleMap']
          for token in required:
              if token not in html:
                  raise SystemExit(f'missing current Battle anchor: {token}')
          if html.count('</body>') != 1:
              raise SystemExit(f'unexpected </body> count={html.count("</body>")}')

          mount = r'''
<!-- GAMEROAD PARTNER ADVICE OBJECT PROJECTION R21B -->
<style id="gameroad-partner-advice-object-projection-r21b-style">
  [data-partner-advice-role="partner-recommendation"]{position:relative!important;outline:3px dashed rgba(255,238,157,.96)!important;outline-offset:3px;box-shadow:0 0 0 1px rgba(8,18,15,.92),0 0 18px rgba(255,229,132,.42)!important;z-index:18!important}
  [data-partner-advice-role="partner-recommendation"]::after{content:attr(data-partner-advice-glyph);position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);min-width:max-content;padding:3px 6px;border:1px dashed rgba(255,242,180,.95);border-radius:999px;background:rgba(5,20,17,.96);color:#fff4bb;font:900 8px/1.15 system-ui,sans-serif;letter-spacing:.03em;white-space:nowrap;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.48)}
  .boardPlayerToken[data-partner-advice-role="partner-recommendation"]::after{bottom:auto;top:calc(100% + 4px)}
  @media(max-width:540px) and (orientation:portrait){[data-partner-advice-role="partner-recommendation"]::after{font-size:7px;padding:2px 4px}}
  @media(prefers-reduced-motion:reduce){[data-partner-advice-role="partner-recommendation"]{animation:none!important;transition:none!important}[data-partner-advice-role="partner-recommendation"]::after{animation:none!important;transition:none!important}}
</style>
<script id="gameroad-partner-advice-object-projection-r21b">
(()=>{
'use strict';
const ROLE='partner-recommendation';
const SELECTOR='[data-partner-advice-role="'+ROLE+'"]';
let modulePromise=null;
let scheduled=false;
const moduleApi=()=>modulePromise||(modulePromise=import('./partner-advice-runtime-mount.mjs').catch(error=>{console.warn('partner-advice-board-r21b-import',error);return null}));
const api=()=>window.__GAMEROAD_HATE_PARTNER_TEST__||null;
function baseAria(el){if(!el.dataset.partnerAdviceBaseAriaCaptured){el.dataset.partnerAdviceBaseAriaCaptured='1';el.dataset.partnerAdviceBaseAria=el.getAttribute('aria-label')||''}return el.dataset.partnerAdviceBaseAria||''}
function clear(){document.querySelectorAll(SELECTOR).forEach(el=>{el.removeAttribute('data-partner-advice-role');el.removeAttribute('data-partner-advice-kind');el.removeAttribute('data-partner-advice-candidate');el.removeAttribute('data-partner-advice-glyph');if(el.dataset.partnerAdviceBaseAriaCaptured){const old=el.dataset.partnerAdviceBaseAria||'';if(old)el.setAttribute('aria-label',old);else el.removeAttribute('aria-label');delete el.dataset.partnerAdviceBaseAria;delete el.dataset.partnerAdviceBaseAriaCaptured}})}
function exactId(value){const id=String(value??'').trim();return id&&id.length<=160?id:null}
function listHasPublic(list,id){return Array.isArray(list)&&list.some(row=>exactId(row?.candidateId)===id&&row?.publicScope===true)}
function visibleElement(kind,id){if(kind==='road'||kind==='battle')return document.querySelector('#hand .handCard[data-card-id="'+CSS.escape(id)+'"]');if(kind==='target')return document.querySelector('#boardPlayers .boardPlayerToken[data-player="'+CSS.escape(id)+'"]');return null}
function glyph(kind){return kind==='road'?'★ 相棒推奨・ロード':kind==='battle'?'★ 相棒推奨・バトル':'★ 相棒推奨・攻撃先'}
function mark(el,kind,id){if(!el)return;const old=baseAria(el),label=glyph(kind);el.dataset.partnerAdviceRole=ROLE;el.dataset.partnerAdviceKind=kind;el.dataset.partnerAdviceCandidate=id;el.dataset.partnerAdviceGlyph=label;el.setAttribute('aria-label',(old?old+' / ':'')+label)}
function adapted(candidate,alternatives,evidence){const id=exactId(candidate?.candidateId);if(!id||candidate?.publicScope!==true||!listHasPublic(evidence,id))return null;const next=(Array.isArray(alternatives)?alternatives:[]).map(x=>exactId(x?.candidateId)).find(x=>x&&x!==id&&listHasPublic(evidence,x))||null;return{ok:true,containsPrivate:false,selected:{candidateId:id},next,source:'live-partner-advice-envelope'}}
function current(env){try{return api()?.validateAdviceEnvelope?.(env)?.ok===true}catch{return false}}
async function projectOne(mod,env,kind,candidate,alternatives,evidence){const input=adapted(candidate,alternatives,evidence);if(!input)return null;const id=input.selected.candidateId;const result=mod.projectPartnerAdviceBoardEmphasis({adviceResult:input,isCurrent:()=>current(env),resolveTarget:candidateId=>visibleElement(kind,candidateId)?{targetId:kind+':'+candidateId}:null});if(result?.active===true&&result.presentationRole===ROLE&&result.autoExecute===false){mark(visibleElement(kind,id),kind,id);return result}return result||null}
function snapshot(){const markers=[...document.querySelectorAll(SELECTOR)].map(el=>({kind:el.dataset.partnerAdviceKind||null,candidateId:el.dataset.partnerAdviceCandidate||null,glyph:el.dataset.partnerAdviceGlyph||null,aria:el.getAttribute('aria-label')||'',outlineStyle:getComputedStyle(el).outlineStyle}));return Object.freeze({activeCount:markers.length,markers,rangeVisible:document.getElementById('battleMap')?.classList.contains('showRange')||false})}
async function render(explicitEnvelope){clear();const env=explicitEnvelope===undefined?api()?.adviceEnvelope?.():explicitEnvelope;if(!env||env.status!=='ready'||!current(env))return snapshot();const mod=await moduleApi();if(!mod?.projectPartnerAdviceBoardEmphasis)return snapshot();if(env.kind==='plan'){await projectOne(mod,env,'road',env.recommendation?.road,env.alternatives?.road,env.publicEvidence?.roadCandidates);await projectOne(mod,env,'battle',env.recommendation?.battle,env.alternatives?.battle,env.publicEvidence?.battleCandidates)}else if(env.kind==='target'){await projectOne(mod,env,'target',env.recommendation,env.alternatives,env.publicEvidence?.targetCandidates)}return snapshot()}
function schedule(){if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;render().catch(error=>{clear();console.warn('partner-advice-board-r21b-render',error)})})}
function install(){document.addEventListener('click',event=>{if(event.target?.closest?.('[data-screen="battle"],#partnerAdviceBtn'))schedule()});document.addEventListener('change',event=>{if(event.target?.closest?.('[data-screen="battle"]'))schedule()});const observed=['phaseTitle','hand','boardPlayers','targetBox','partnerDecisionStatus'];for(const id of observed){const el=document.getElementById(id);if(!el)continue;new MutationObserver(schedule).observe(el,{childList:true,subtree:id==='phaseTitle'||id==='partnerDecisionStatus',characterData:id==='phaseTitle'||id==='partnerDecisionStatus',attributes:id==='targetBox',attributeFilter:id==='targetBox'?['class']:undefined})}const battle=document.querySelector('section[data-screen="battle"]');if(battle)new MutationObserver(schedule).observe(battle,{attributes:true,attributeFilter:['class','hidden','aria-hidden']});schedule()}
window.__GAMEROAD_PARTNER_ADVICE_BOARD_R21B__=Object.freeze({render,clear,snapshot});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();
</script>
'''
          html=html.replace('</body>',mount+'\n</body>',1)
          html_path.write_text(html)

          test_path=Path('tests/browser-full-interaction.spec.mjs')
          test=test_path.read_text()
          old="""  await battle.locator('#partnerAdviceBtn').click();
  const advice = await page.evaluate(() => window.__GAMEROAD_HATE_PARTNER_TEST__?.adviceEnvelope?.() ?? null);
  expect(advice).not.toBeNull();
  expect(advice.kind).toBe('plan');
  expect(advice.status).toBe('ready');
  await attachStateScreenshot(page, testInfo, 'battle-partner-advice-visible');"""
          if test.count(old)!=1:
              raise SystemExit(f'unexpected advice test anchor count={test.count(old)}')
          new=old+"""

  await expect.poll(async () => battle.locator('[data-partner-advice-role=\"partner-recommendation\"]').count()).toBe(2);
  const adviceProjection = await page.evaluate(() => window.__GAMEROAD_PARTNER_ADVICE_BOARD_R21B__?.snapshot?.() ?? null);
  expect(adviceProjection).not.toBeNull();
  expect(adviceProjection.activeCount).toBe(2);
  expect(adviceProjection.rangeVisible, 'Partner recommendation does not replace the general range/threat surface').toBe(true);
  expect(adviceProjection.markers.map((marker) => marker.kind).sort()).toEqual(['battle', 'road']);
  for (const marker of adviceProjection.markers) {
    expect(marker.glyph, 'recommendation has a non-color text/glyph channel').toContain('相棒推奨');
    expect(marker.aria, 'recommendation is exposed semantically, not by color alone').toContain('相棒推奨');
    expect(marker.outlineStyle, 'recommendation uses a distinct outline shape').toBe('dashed');
  }
  await page.emulateMedia({ reducedMotion: 'reduce' });
  await expect(battle.locator('[data-partner-advice-role=\"partner-recommendation\"]')).toHaveCount(2);
  const reducedProjection = await page.evaluate(() => window.__GAMEROAD_PARTNER_ADVICE_BOARD_R21B__?.snapshot?.() ?? null);
  expect(reducedProjection?.activeCount, 'Reduced Motion keeps recommendation meaning').toBe(2);
  const staleProjection = await page.evaluate(async () => {
    const stale = window.__GAMEROAD_PARTNER_ADVICE_STALE__?.() ?? { status: 'blocked', kind: 'stale', error: 'STALE_STATE' };
    return window.__GAMEROAD_PARTNER_ADVICE_BOARD_R21B__?.render?.(stale) ?? null;
  });
  expect(staleProjection?.activeCount, 'stale/blocked advice clears visible recommendation').toBe(0);
  await expect(battle.locator('[data-partner-advice-role=\"partner-recommendation\"]')).toHaveCount(0);
  await page.emulateMedia({ reducedMotion: 'no-preference' });
  await battle.locator('#partnerAdviceBtn').click();
  await expect.poll(async () => battle.locator('[data-partner-advice-role=\"partner-recommendation\"]').count()).toBe(2);
  await attachStateScreenshot(page, testInfo, 'battle-partner-advice-board-projection-visible');"""
          test=test.replace(old,new,1)
          test_path.write_text(test)
          PY
          git diff --check
          git diff --name-only
          git diff -- browser/GAMEROAD.html | grep -F 'GAMEROAD PARTNER ADVICE OBJECT PROJECTION R21B'
          git diff -- tests/browser-full-interaction.spec.mjs | grep -F 'Partner recommendation does not replace the general range/threat surface'
      - name: Run focused Partner projection core tests
        run: node --test tests/partner-advice-runtime-mount.test.mjs
      - name: Commit bounded product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git diff --cached --name-only | diff -u <(printf '%s\n' browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs) -
          git commit -m 'PARTNERADVICE R21B: project advice onto current Battle objects'
          git push origin HEAD:work/partneradvice-r21b-visible-battle-mount
