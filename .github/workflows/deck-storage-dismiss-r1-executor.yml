name: Deck Storage outside-dismiss R1 executor

on:
  push:
    branches:
      - sol/deck-storage-dismiss-r1-20260906

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/deck-storage-dismiss-r1-20260906
          fetch-depth: 0

      - name: Patch current outside-dismiss path and focused regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/deck-storage-corner-runtime.mjs')
          runtime = runtime_path.read_text()
          before = "\n".join([
              "  const onOutsidePointerDown = (event) => {",
              "    if (!panel || panel.contains?.(event?.target) || button.contains?.(event?.target)) return;",
              "    close();",
              "  };",
          ])
          after = "\n".join([
              "  const onOutsidePointerDown = (event) => {",
              "    if (!panel || panel.contains?.(event?.target) || button.contains?.(event?.target)) return;",
              "    event?.preventDefault?.();",
              "    event?.stopPropagation?.();",
              "    close();",
              "  };",
          ])
          if runtime.count(before) != 1:
              raise SystemExit(f'expected exactly one outside-dismiss handler, found {runtime.count(before)}')
          runtime_path.write_text(runtime.replace(before, after, 1))

          test_path = Path('tests/deck-storage-corner-runtime.test.mjs')
          tests = test_path.read_text()
          marker = "Storage outside-dismiss consumes the dismissing pointer so Cards underlay cannot click through"
          if marker not in tests:
              tests += r'''

          test('Storage outside-dismiss consumes the dismissing pointer so Cards underlay cannot click through', () => {
            const { controller } = fixture();
            const { document } = discoveryDocument();
            const mounted = mountDeckStorageCorner({ controller, buttonHost: fakeElement(), document });

            mounted.open();
            assert.equal(controller.view().open, true);
            const outside = {
              target: fakeElement(),
              prevented: false,
              stopped: false,
              preventDefault() { this.prevented = true; },
              stopPropagation() { this.stopped = true; },
            };
            document.emit('pointerdown', outside);
            assert.equal(controller.view().open, false);
            assert.equal(outside.prevented, true);
            assert.equal(outside.stopped, true);

            mounted.open();
            const storageWindow = document.body.children[0].children[0];
            const inside = {
              target: storageWindow,
              prevented: false,
              stopped: false,
              preventDefault() { this.prevented = true; },
              stopPropagation() { this.stopped = true; },
            };
            document.emit('pointerdown', inside);
            assert.equal(controller.view().open, true);
            assert.equal(inside.prevented, false);
            assert.equal(inside.stopped, false);
            mounted.dispose();
          });
          '''
              test_path.write_text(tests)
          PY

      - name: Focused Node regression
        run: node --test tests/deck-storage-corner-runtime.test.mjs

      - name: Commit product and focused test
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/deck-storage-corner-runtime.mjs tests/deck-storage-corner-runtime.test.mjs
          git diff --cached --check
          git commit -m 'Deck Storage: consume outside-dismiss pointer'

      - name: Cleanup transient authorization and executor
        shell: bash
        run: |
          rm -f data/preaction-authorizations/UI-DECK-STORAGE-DISMISS-R1-20260906T0548-SOL-P4K7M2.json
          rm -f .github/workflows/deck-storage-dismiss-r1-executor.yml
          git add -u
          git diff --cached --check
          git commit -m 'Cleanup Deck Storage transient execution artifacts'
          git push origin HEAD:sol/deck-storage-dismiss-r1-20260906
