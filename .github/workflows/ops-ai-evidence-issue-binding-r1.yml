name: OPS AI Evidence Issue Binding R1

on:
  push:
    branches:
      - work/ops-ai-evidence-issue-binding-r1-20260829

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard authorization and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/VWORK-OPS-AI-EVIDENCE-ISSUE-BINDING-R1-20260829T1659.json
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          def append_b64(path, payload):
              p = Path(path)
              p.write_text(p.read_text() + base64.b64decode(payload).decode('utf-8'))

          replace_once(
              'tools/jit-evidence-compiler.mjs',
              """    freshness: item.freshness,\n  };\n  return `${JIT_EVIDENCE_CONTEXT_MARKER}\\n${JSON.stringify(metadata)}\\n${JIT_EVIDENCE_CONTEXT_END_MARKER}\\n${item.text}`;\n""",
              """    freshness: item.freshness,\n  };\n  if (Array.isArray(item.issueBindings) && item.issueBindings.length > 0) {\n    metadata.issueBindings = [...item.issueBindings];\n  }\n  return `${JIT_EVIDENCE_CONTEXT_MARKER}\\n${JSON.stringify(metadata)}\\n${JIT_EVIDENCE_CONTEXT_END_MARKER}\\n${item.text}`;\n""",
          )
          replace_once(
              'tools/jit-evidence-compiler.mjs',
              """  const relationsByIssue = new Map();\n  for (const relation of normalized.relations) {\n    if (!relationsByIssue.has(relation.fromIssue)) relationsByIssue.set(relation.fromIssue, []);\n    relationsByIssue.get(relation.fromIssue).push(relation);\n  }\n\n  const selected = [];\n""",
              """  const relationsByIssue = new Map();\n  for (const relation of normalized.relations) {\n    if (!relationsByIssue.has(relation.fromIssue)) relationsByIssue.set(relation.fromIssue, []);\n    relationsByIssue.get(relation.fromIssue).push(relation);\n  }\n\n  const issueBindingsByEvidence = new Map();\n  for (const relation of normalized.relations) {\n    if (!relation.material || !issueState.get(relation.fromIssue)?.material) continue;\n    if (!issueBindingsByEvidence.has(relation.toEvidence)) issueBindingsByEvidence.set(relation.toEvidence, new Set());\n    issueBindingsByEvidence.get(relation.toEvidence).add(relation.fromIssue);\n  }\n  for (const item of normalized.evidence) {\n    item.issueBindings = [...(issueBindingsByEvidence.get(item.id) ?? [])].sort();\n  }\n\n  const selected = [];\n""",
          )

          replace_once(
              'tools/sol-reasoning-protocol.mjs',
              """  'authorityClass', 'version', 'provenance', 'freshness',\n]);\n""",
              """  'authorityClass', 'version', 'provenance', 'freshness', 'issueBindings',\n]);\n""",
          )
          replace_once(
              'tools/sol-reasoning-protocol.mjs',
              """    freshness: cleanString(metadata.freshness ?? '', `context_${index}_metadata_freshness`, { max: 240, optional: true }),\n  };\n""",
              """    freshness: cleanString(metadata.freshness ?? '', `context_${index}_metadata_freshness`, { max: 240, optional: true }),\n    issueBindings: cleanStringList(metadata.issueBindings ?? [], `context_${index}_metadata_issueBindings`, { maxItems: 64 }),\n  };\n""",
          )
          replace_once(
              'tools/sol-reasoning-protocol.mjs',
              """function normalizeClaim(raw, index, knownEvidence) {\n""",
              """function commonIssueBindings(refs, knownEvidence) {\n  if (refs.length === 0) return [];\n  const bindingLists = refs.map((ref) => knownEvidence.get(ref)?.metadata?.issueBindings ?? []);\n  if (bindingLists.some((bindings) => bindings.length === 0)) return [];\n  const [first, ...rest] = bindingLists;\n  return first.filter((issueId) => rest.every((bindings) => bindings.includes(issueId)));\n}\n\nfunction normalizeClaim(raw, index, knownEvidence) {\n""",
          )
          replace_once(
              'tools/sol-reasoning-protocol.mjs',
              """  if (claim.kind === CLAIM_KIND.ROOT_CAUSE && claim.status === CLAIM_STATUS.ESTABLISHED) {\n    if (!evidenceTypes.has('actual')) throw new Error(`claim_${index}_root_cause_actual_required`);\n    if (claim.counterEvidenceRefs.length === 0) throw new Error(`claim_${index}_root_cause_counter_required`);\n    if (claim.discriminatingTestRefs.length === 0) throw new Error(`claim_${index}_root_cause_discriminating_test_required`);\n  }\n""",
              """  if (claim.kind === CLAIM_KIND.ROOT_CAUSE && claim.status === CLAIM_STATUS.ESTABLISHED) {\n    if (!evidenceTypes.has('actual')) throw new Error(`claim_${index}_root_cause_actual_required`);\n    if (claim.counterEvidenceRefs.length === 0) throw new Error(`claim_${index}_root_cause_counter_required`);\n    if (claim.discriminatingTestRefs.length === 0) throw new Error(`claim_${index}_root_cause_discriminating_test_required`);\n    const actualRefs = claim.evidenceRefs.filter((ref) => knownEvidence.get(ref)?.trustedClass === 'actual');\n    const causalRefs = [...new Set([\n      ...actualRefs,\n      ...claim.counterEvidenceRefs,\n      ...claim.discriminatingTestRefs,\n    ])];\n    if (causalRefs.some((ref) => (knownEvidence.get(ref)?.metadata?.issueBindings ?? []).length === 0)) {\n      throw new Error(`claim_${index}_root_cause_issue_binding_required`);\n    }\n    if (commonIssueBindings(causalRefs, knownEvidence).length === 0) {\n      throw new Error(`claim_${index}_root_cause_issue_binding_mismatch`);\n    }\n  }\n""",
          )

          replace_once(
              'tools/luna-sol-integration-core.mjs',
              """function localEvidenceMode(routeDecision) {\n""",
              """function declaredLocalEvidenceRefs(localEvidence) {\n  const refs = new Set(localEvidence?.decisionBasisRefs ?? []);\n  for (const claim of localEvidence?.claims ?? []) {\n    for (const key of ['evidenceRefs', 'counterEvidenceRefs', 'discriminatingTestRefs']) {\n      for (const ref of claim?.[key] ?? []) refs.add(ref);\n    }\n  }\n  return refs;\n}\n\nfunction promoteDeclaredContextRefs(context, localEvidence) {\n  const declaredRefs = declaredLocalEvidenceRefs(localEvidence);\n  return (context ?? []).map((item) => (\n    item && typeof item === 'object' && !Array.isArray(item) && declaredRefs.has(item.id)\n      ? { ...item, required: true }\n      : item\n  ));\n}\n\nfunction localEvidenceMode(routeDecision) {\n""",
          )
          replace_once(
              'tools/luna-sol-integration-core.mjs',
              """function validateLocalMutationEvidence(input, queuePacket, routeDecision) {\n  const frozen = freezeEvidence(queuePacket, input.context ?? [], input.maxWireBytes ?? 3000);\n  if (!frozen.ok) return { ok: false, reason: `local_evidence_packet_${frozen.reason}`, metrics: frozen.metrics ?? null };\n  if (!input.localEvidence || typeof input.localEvidence !== 'object' || Array.isArray(input.localEvidence)) {\n    return { ok: false, reason: 'local_evidence_required', metrics: frozen.metrics, fingerprint: frozen.fingerprint };\n  }\n  const checked = validateEvidenceClaims({\n    mode: localEvidenceMode(routeDecision),\n    disposition: 'PLAN',\n    filesToChange: queuePacket.exactMutableResources,\n    claims: input.localEvidence.claims ?? [],\n    selectedCauseClaimId: input.localEvidence.selectedCauseClaimId ?? '',\n    decisionBasisRefs: input.localEvidence.decisionBasisRefs ?? [],\n  }, frozen.context);\n""",
              """function validateLocalMutationEvidence(input, queuePacket, routeDecision) {\n  const localEvidence = input.localEvidence && typeof input.localEvidence === 'object' && !Array.isArray(input.localEvidence)\n    ? input.localEvidence\n    : null;\n  const frozenContext = localEvidence\n    ? promoteDeclaredContextRefs(input.context ?? [], localEvidence)\n    : (input.context ?? []);\n  const frozen = freezeEvidence(queuePacket, frozenContext, input.maxWireBytes ?? 3000);\n  if (!frozen.ok) return { ok: false, reason: `local_evidence_packet_${frozen.reason}`, metrics: frozen.metrics ?? null };\n  if (!localEvidence) {\n    return { ok: false, reason: 'local_evidence_required', metrics: frozen.metrics, fingerprint: frozen.fingerprint };\n  }\n  const checked = validateEvidenceClaims({\n    mode: localEvidenceMode(routeDecision),\n    disposition: 'PLAN',\n    filesToChange: queuePacket.exactMutableResources,\n    claims: localEvidence.claims ?? [],\n    selectedCauseClaimId: localEvidence.selectedCauseClaimId ?? '',\n    decisionBasisRefs: localEvidence.decisionBasisRefs ?? [],\n  }, frozen.context);\n""",
          )

          replace_once(
              'tests/sol-reasoning-protocol.test.mjs',
              "function canonicalEvidence({ id, state, role, text, required = false, priority = 0, tier = 'HOT', claimMode = 'CURRENT' }) {",
              "function canonicalEvidence({ id, state, role, text, required = false, priority = 0, tier = 'HOT', claimMode = 'CURRENT', issueBindings = [] }) {",
          )
          replace_once(
              'tests/sol-reasoning-protocol.test.mjs',
              """      freshness: 'CURRENT_TEST_FIXTURE',\n      text,\n""",
              """      freshness: 'CURRENT_TEST_FIXTURE',\n      issueBindings,\n      text,\n""",
          )
          replace_once(
              'tests/sol-reasoning-protocol.test.mjs',
              """    canonicalEvidence({ id: 'actual:observed', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DIRECT_ACTUAL', text: 'Observed behavior is X.', required: true }),\n    canonicalEvidence({ id: 'test:focused', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DISCRIMINATING_TEST', text: 'Focused discriminator shows X changes when factor A changes.', priority: 10 }),\n    canonicalEvidence({ id: 'counter:failed', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'COUNTEREVIDENCE', text: 'Alternative explanation B remains counterevidence unless discriminated.', priority: 10 }),\n""",
              """    canonicalEvidence({ id: 'actual:observed', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DIRECT_ACTUAL', text: 'Observed behavior is X.', required: true, issueBindings: ['issue:target'] }),\n    canonicalEvidence({ id: 'test:focused', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DISCRIMINATING_TEST', text: 'Focused discriminator shows X changes when factor A changes.', priority: 10, required: true, issueBindings: ['issue:target'] }),\n    canonicalEvidence({ id: 'counter:failed', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'COUNTEREVIDENCE', text: 'Alternative explanation B remains counterevidence unless discriminated.', priority: 10, required: true, issueBindings: ['issue:target'] }),\n""",
          )

          replace_once(
              'tests/luna-sol-integration-core.test.mjs',
              "function canonicalEvidence({ id, state, role, text, required = false, priority = 0 }) {",
              "function canonicalEvidence({ id, state, role, text, required = false, priority = 0, issueBindings = [] }) {",
          )
          replace_once(
              'tests/luna-sol-integration-core.test.mjs',
              """      freshness: 'CURRENT_TEST_FIXTURE',\n      text,\n""",
              """      freshness: 'CURRENT_TEST_FIXTURE',\n      issueBindings,\n      text,\n""",
          )
          replace_once(
              'tests/luna-sol-integration-core.test.mjs',
              """    canonicalEvidence({ id: 'actual:state', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DIRECT_ACTUAL', text: 'Current actual directly exhibits the target condition.', required: true }),\n    canonicalEvidence({ id: 'test:discriminator', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DISCRIMINATING_TEST', text: 'A/B discriminator isolates factor X.', priority: 10 }),\n    canonicalEvidence({ id: 'counter:alternative', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'COUNTEREVIDENCE', text: 'Alternative Y is explicit counterevidence.', priority: 10 }),\n""",
              """    canonicalEvidence({ id: 'actual:state', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DIRECT_ACTUAL', text: 'Current actual directly exhibits the target condition.', required: true, issueBindings: ['issue:target'] }),\n    canonicalEvidence({ id: 'test:discriminator', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'DISCRIMINATING_TEST', text: 'A/B discriminator isolates factor X.', priority: 10, issueBindings: ['issue:target'] }),\n    canonicalEvidence({ id: 'counter:alternative', state: 'CURRENT_EXECUTION_EVIDENCE', role: 'COUNTEREVIDENCE', text: 'Alternative Y is explicit counterevidence.', priority: 10, issueBindings: ['issue:target'] }),\n""",
          )

          append_b64('tests/jit-evidence-compiler.test.mjs', '')
          append_b64('tests/sol-reasoning-protocol.test.mjs', '')
          append_b64('tests/luna-sol-integration-core.test.mjs', '')
          PY
      - name: Focused tests
        run: >-
          node --test
          tests/jit-evidence-compiler.test.mjs
          tests/sol-reasoning-protocol.test.mjs
          tests/luna-sol-integration-core.test.mjs
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' tests/jit-evidence-compiler.test.mjs tests/luna-sol-integration-core.test.mjs tests/sol-reasoning-protocol.test.mjs tools/jit-evidence-compiler.mjs tools/luna-sol-integration-core.mjs tools/sol-reasoning-protocol.mjs | sort)"
          test "$changed" = "$expected"
      - name: Commit verified material patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/jit-evidence-compiler.mjs tools/sol-reasoning-protocol.mjs tools/luna-sol-integration-core.mjs tests/jit-evidence-compiler.test.mjs tests/sol-reasoning-protocol.test.mjs tests/luna-sol-integration-core.test.mjs
          git commit -m "fix: bind causal evidence to material issue"
          git push origin HEAD:work/ops-ai-evidence-issue-binding-r1-20260829
