name: Gacha Preview Truthfulness R1C

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/gacha-preview-truthfulness-r1c.yml'
      - 'data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R1C-20260906T0055-SOL-N4K8P2.json'
      - 'browser/GAMEROAD.html'
      - 'tests/browser-full-interaction.spec.mjs'

permissions:
  contents: write

jobs:
  bounded-patch-focus-test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sol/gacha-preview-truthfulness-r1c-20260906' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify corrected PRE_ACTION fence
        shell: bash
        run: |
          set -euo pipefail
          BASE=e878972e2bdb3df294a48b0aab11b0259a8a00a8
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          node tools/preaction-authorization-validator.mjs --base "$BASE" --head HEAD || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/preaction-authorizations/GACHA-PREVIEW-TRUTH-R1C-20260906T0055-SOL-N4K8P2.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['authorizationBaseSha']=='e878972e2bdb3df294a48b0aab11b0259a8a00a8'
          assert d['leaseState']=='ACTIVE'
          assert d['leaseSnapshotReadbackRef']=='CURRENT_ACTIVE_LEASES!A489:L489'
          assert d['proceedToken'].startswith('PROCEED|GACHA-PREVIEW-TRUTH-R1C-20260906T0055-SOL-N4K8P2|')
          PY

      - name: Apply bounded truthfulness patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          test_path = Path('tests/browser-full-interaction.spec.mjs')
          html = html_path.read_text(encoding='utf-8')
          spec = test_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count == 0 and new in text:
                  return text, False
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} old occurrence(s), found {count}')
              return text.replace(old, new), True

          changed = False
          replacements = [
              ('<div class="gachaResultsHead"><b>開封結果</b></div>', '<div class="gachaResultsHead"><b>演出プレビュー結果</b></div>', 'results heading'),
              ('<div class="k">PACK RESULT</div><h3 id="gachaFocusName">', '<div class="k">PACK PREVIEW</div><h3 id="gachaFocusName">', 'focus heading'),
              ('<div class="safeNote">所持追加：なし</div><div class="packActions"><button class="btn primary" id="openPack">7枚を開封</button>', '<div class="safeNote">演出プレビュー：所持・保存は変わりません</div><div class="packActions"><button class="btn primary" id="openPack">7枚をプレビュー</button>', 'idle disclosure and CTA'),
              ("if(publicNote)publicNote.textContent='所持追加：なし';", "if(publicNote)publicNote.textContent='演出プレビュー：所持・保存は変わりません';", 'runtime disclosure'),
              ("d.setAttribute('aria-label',c.ticket?`結果${i+1} 特別券`:`結果${i+1} ${c.display_name} 詳細を開く`);", "d.setAttribute('aria-label',c.ticket?`プレビュー${i+1} 特別券`:`プレビュー${i+1} ${c.display_name} 詳細を開く`);", 'result accessible labels'),
              ('<small>提供結果</small>', '<small>プレビュー（未取得）</small>', 'ticket disclosure'),
          ]
          for old, new, label in replacements:
              html, did_change = replace_exact(html, old, new, label)
              changed = changed or did_change

          anchor_idle = '''  const gacha = page.locator('section[data-screen="gacha"]');
            await expect(gacha).toBeVisible();
            await attachStateScreenshot(page, testInfo, 'gacha-idle-visible');'''
          replacement_idle = '''  const gacha = page.locator('section[data-screen="gacha"]');
            await expect(gacha).toBeVisible();
            await expect(gacha.locator('.gachaControls .safeNote')).toHaveText('演出プレビュー：所持・保存は変わりません');
            await expect(gacha.locator('#openPack')).toHaveText('7枚をプレビュー');
            await attachStateScreenshot(page, testInfo, 'gacha-idle-visible');'''
          spec, did_change = replace_exact(spec, anchor_idle, replacement_idle, 'BFI idle truthfulness')
          changed = changed or did_change

          anchor_results = '''  await expect(gacha.locator('#gachaResultsView')).not.toHaveClass(/hidden/);
            await expect(gacha.locator('#packResults .packCard')).toHaveCount(7);
            await attachStateScreenshot(page, testInfo, 'gacha-seven-results-visible');'''
          replacement_results = '''  await expect(gacha.locator('#gachaResultsView')).not.toHaveClass(/hidden/);
            await expect(gacha.locator('.gachaResultsHead')).toContainText('演出プレビュー結果');
            await expect(gacha.locator('#packResults .packCard')).toHaveCount(7);
            const previewAriaLabels = await gacha.locator('#packResults .packCard').evaluateAll((nodes) => nodes.map((node) => node.getAttribute('aria-label') || ''));
            expect(previewAriaLabels.every((label) => label.startsWith('プレビュー'))).toBe(true);
            await attachStateScreenshot(page, testInfo, 'gacha-seven-results-visible');'''
          spec, did_change = replace_exact(spec, anchor_results, replacement_results, 'BFI result truthfulness')
          changed = changed or did_change

          html_path.write_text(html, encoding='utf-8')
          test_path.write_text(spec, encoding='utf-8')
          print('bounded_patch_changed=' + ('true' if changed else 'false'))
          PY
          git diff --check
          grep -Fq '演出プレビュー：所持・保存は変わりません' browser/GAMEROAD.html
          grep -Fq '7枚をプレビュー' browser/GAMEROAD.html
          grep -Fq '演出プレビュー結果' browser/GAMEROAD.html
          grep -Fq 'PACK PREVIEW' browser/GAMEROAD.html
          grep -Fq 'プレビュー（未取得）' browser/GAMEROAD.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run focused real Gacha consumer path
        shell: bash
        run: |
          set -euo pipefail
          cat > .r1c-gacha-preview.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('local Gacha is visibly a non-owning preview before and after reveal', async ({ page }) => {
            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'domcontentloaded' });
            expect(response?.ok()).toBeTruthy();
            await page.waitForTimeout(900);
            let gachaGo = page.locator('[data-home-target="gacha"]:visible, [data-go="gacha"]:visible').first();
            if ((await gachaGo.count()) === 0) {
              const shopGo = page.locator('[data-home-target="shop"]:visible, [data-go="shop"]:visible').first();
              await expect(shopGo).toBeVisible();
              await shopGo.click();
              await expect(page.locator('section[data-screen="shop"]')).toBeVisible();
              gachaGo = page.locator('section[data-screen="shop"] [data-go="gacha"]:visible').first();
            }
            await expect(gachaGo).toBeVisible();
            await gachaGo.click();
            const gacha = page.locator('section[data-screen="gacha"]');
            await expect(gacha).toBeVisible();
            await expect(gacha.locator('.gachaControls .safeNote')).toHaveText('演出プレビュー：所持・保存は変わりません');
            await expect(gacha.locator('#openPack')).toHaveText('7枚をプレビュー');
            await gacha.locator('#openPack').click();
            const skip = gacha.locator('#skipPack:visible');
            if (await skip.isVisible({ timeout: 2500 }).catch(() => false)) await skip.click();
            await expect(gacha.locator('#gachaResultsView')).not.toHaveClass(/hidden/, { timeout: 15000 });
            await expect(gacha.locator('.gachaResultsHead')).toContainText('演出プレビュー結果');
            await expect(gacha.locator('#packResults .packCard')).toHaveCount(7);
            const labels = await gacha.locator('#packResults .packCard').evaluateAll(nodes => nodes.map(n => n.getAttribute('aria-label') || ''));
            expect(labels).toHaveLength(7);
            expect(labels.every(label => label.startsWith('プレビュー'))).toBe(true);
          });
          EOF
          cat > .r1c-playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: '.',
            testMatch: '.r1c-gacha-preview.spec.mjs',
            timeout: 30_000,
            expect: { timeout: 7_000 },
            workers: 1,
            retries: 0,
            use: { baseURL: 'http://127.0.0.1:4173', browserName: 'chromium', headless: true, viewport: { width: 390, height: 844 } },
            webServer: { command: 'python3 -m http.server 4173 --bind 127.0.0.1', url: 'http://127.0.0.1:4173/browser/GAMEROAD.html', reuseExistingServer: false, timeout: 120_000 },
          });
          EOF
          npx playwright test --config=.r1c-playwright.config.mjs --workers=1
          rm -f .r1c-gacha-preview.spec.mjs .r1c-playwright.config.mjs

      - name: Commit exact product and regression patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs; then
            echo 'No product diff to commit; exact patch is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git commit -m 'Gacha: label local opening as non-owning preview'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
