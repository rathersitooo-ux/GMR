name: TEMP Battle Grass Terrain R2

on:
  push:
    branches:
      - sol/battle-grass-terrain-r2-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace grassland terrain presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('browser/battle-screen-runtime-mount.mjs')
          text = path.read_text(encoding='utf-8')

          old = '''[${SHELL_ATTR}="1"] #battlePhaseSurface{position:absolute;inset:0;z-index:3;overflow:hidden;background:radial-gradient(ellipse at 75% 33%,rgba(220,246,217,.24),transparent 29%),radial-gradient(ellipse at 18% 78%,rgba(96,145,87,.38),transparent 31%),linear-gradient(180deg,rgba(111,178,166,.30) 0%,rgba(62,126,104,.22) 43%,rgba(22,69,54,.58) 100%)}
[${SHELL_ATTR}="1"] #battlePhaseSurface::before{content:"";position:absolute;z-index:-2;left:-7%;right:-6%;top:41%;bottom:-31%;clip-path:polygon(0 31%,12% 19%,23% 26%,36% 10%,48% 24%,61% 8%,74% 25%,88% 14%,100% 29%,100% 100%,0 100%);background:linear-gradient(180deg,rgba(69,124,83,.78),rgba(42,96,64,.92) 42%,rgba(22,62,47,.98));border-top:1px solid rgba(214,250,211,.16);transform:perspective(560px) rotateX(5deg);transform-origin:50% 0}
[${SHELL_ATTR}="1"] #battlePhaseSurface::after{content:"";position:absolute;z-index:-1;left:4%;width:42%;bottom:5%;height:29%;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(159,197,119,.30),rgba(49,101,67,.20) 55%,transparent 70%);border-top:1px solid rgba(225,255,214,.10);transform:perspective(380px) rotateX(62deg);transform-origin:50% 100%}'''

          new = '''[${SHELL_ATTR}="1"] #battlePhaseSurface{position:absolute;inset:0;z-index:3;overflow:hidden;background:radial-gradient(ellipse at 16% 17%,rgba(238,249,221,.27),transparent 35%),radial-gradient(ellipse at 79% 25%,rgba(176,211,176,.13),transparent 34%),linear-gradient(180deg,rgba(130,188,178,.42) 0%,rgba(111,168,129,.32) 35%,rgba(69,130,84,.42) 59%,rgba(31,79,56,.69) 100%)}
[${SHELL_ATTR}="1"] #battlePhaseSurface::before{content:"";position:absolute;z-index:-2;left:-9%;right:-8%;top:36%;bottom:-29%;clip-path:polygon(0 45%,9% 39%,18% 35%,28% 38%,39% 31%,49% 26%,60% 30%,71% 25%,81% 29%,91% 24%,100% 30%,100% 100%,0 100%);background:radial-gradient(ellipse at 19% 27%,rgba(150,190,111,.31),transparent 31%),radial-gradient(ellipse at 68% 24%,rgba(129,174,101,.20),transparent 30%),linear-gradient(180deg,rgba(113,162,92,.73),rgba(65,119,72,.89) 48%,rgba(31,77,55,.98));border-top:1px solid rgba(232,251,216,.18);transform:perspective(700px) rotateX(4deg);transform-origin:50% 0}
[${SHELL_ATTR}="1"] #battlePhaseSurface::after{content:"";position:absolute;z-index:-1;left:-13%;right:35%;bottom:-16%;height:55%;border-radius:52% 48% 0 0 / 46% 43% 0 0;background:radial-gradient(ellipse at 42% 8%,rgba(187,214,132,.29),transparent 40%),linear-gradient(180deg,rgba(95,149,78,.45),rgba(46,103,65,.65) 63%,rgba(25,69,51,.77));border-top:1px solid rgba(235,253,216,.12);transform:perspective(520px) rotateX(58deg);transform-origin:50% 100%}'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one grassland block, found {count}')
          updated = text.replace(old, new)
          if updated == text:
              raise SystemExit('grassland replacement produced no change')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Focused Battle runtime test
        run: node --test tests/battle-screen-runtime-mount.test.mjs
      - name: Commit verified terrain change
        shell: bash
        run: |
          git config user.name "gameroad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add browser/battle-screen-runtime-mount.mjs
          git diff --cached --check
          git commit -m "Battle: 草原背景の地形レイヤーを改善"
          git push origin HEAD:${{ github.ref_name }}
