name: TEMP Battle BFI Other3 Expectation R3

on:
  push:
    branches:
      - sol/battle-bfi-other3-expectation-r3-20260914
    paths:
      - .github/workflows/zz-temp-battle-bfi-other3-expectation-r3.yml

permissions:
  contents: write

jobs:
  repair-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_PRODUCT_BUILD_ID: 280e248def71a08679e3a262db0164b09ca43986
    steps:
      - name: Checkout authorized R3 branch
        uses: actions/checkout@v4
        with:
          ref: sol/battle-bfi-other3-expectation-r3-20260914
          fetch-depth: 0

      - name: Verify PRE_ACTION is first branch commit and patch exact three stale peer-strip assertions
        shell: bash
        run: |
          set -euo pipefail
          BASE="${EXPECTED_PRODUCT_BUILD_ID}"
          PREACTION='data/preaction-authorizations/BATTLE-BFI-OTHER3-EXPECTATION-R3-20260914T1653-SOL-RO43.json'
          TEST='tests/browser-full-interaction.spec.mjs'
          test -f "$PREACTION"
          test "$(git rev-list --reverse "${BASE}..HEAD" | head -n1)" = "$(git log --format=%H -- "$PREACTION" | tail -n1)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/browser-full-interaction.spec.mjs')
          text = p.read_text(encoding='utf-8')
          old = "await expect(battle.locator('#publicPlayerStrip .publicPlayerChip')).toHaveCount(4);"
          new = "await expect(battle.locator('#publicPlayerStrip .publicPlayerChip')).toHaveCount(3);"
          old_count = text.count(old)
          new_before = text.count(new)
          if old_count != 3:
              raise SystemExit(f'expected exactly 3 stale peer-strip count(4) assertions, got {old_count}')
          if new_before != 0:
              raise SystemExit(f'expected 0 current peer-strip count(3) assertions before patch, got {new_before}')
          board4_before = text.count("await expect(battle.locator('#boardPlayers .boardPlayerToken')).toHaveCount(4);")
          patched = text.replace(old, new)
          if patched.count(old) != 0 or patched.count(new) != 3:
              raise SystemExit('post-patch peer-strip count fence failed')
          board4_after = patched.count("await expect(battle.locator('#boardPlayers .boardPlayerToken')).toHaveCount(4);")
          if board4_after != board4_before:
              raise SystemExit('world boardPlayerToken four-player expectation changed unexpectedly')
          p.write_text(patched, encoding='utf-8')
          print(f'patched peer-strip assertions: {old_count}; world board4 assertions preserved: {board4_after}')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "$TEST"
          minus_count="$(git diff -- "$TEST" | grep '^-' | grep -cF "#publicPlayerStrip .publicPlayerChip')).toHaveCount(4);" || true)"
          plus_count="$(git diff -- "$TEST" | grep '^+' | grep -cF "#publicPlayerStrip .publicPlayerChip')).toHaveCount(3);" || true)"
          test "$minus_count" -eq 3
          test "$plus_count" -eq 3

      - name: Commit only bounded test-harness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bounded-writer'
          git config user.email 'gameroad-bounded-writer@users.noreply.github.com'
          git add tests/browser-full-interaction.spec.mjs
          test "$(git diff --cached --name-only)" = 'tests/browser-full-interaction.spec.mjs'
          git commit -m 'test: public peer strip expects viewer-excluded other three'
          git push origin HEAD:sol/battle-bfi-other3-expectation-r3-20260914

      - name: Bind canonical public origin to exact current product build
        id: public_manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          MANIFEST='public-origin-metadata/gameroad-version.json'
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output "$MANIFEST" \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED_BUILD_ID="$(MANIFEST="$MANIFEST" node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          echo "observed_build_id=${OBSERVED_BUILD_ID}" >> "$GITHUB_OUTPUT"
          test "$OBSERVED_BUILD_ID" = "$EXPECTED_PRODUCT_BUILD_ID"
          printf 'harness_branch=%s\nharness_sha=%s\nexpected_product_build_id=%s\nobserved_product_build_id=%s\npublic_origin=%s\n' \
            "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$EXPECTED_PRODUCT_BUILD_ID" "$OBSERVED_BUILD_ID" "$GAMEROAD_PUBLIC_BASE_URL" \
            > public-origin-metadata/binding.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Prepare exact-public R19 runner from patched existing test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r3-public
          SOURCE='tests/browser-full-interaction.spec.mjs'
          TARGET='.r3-public/browser-full-interaction.spec.mjs'
          BEFORE="$(grep -oF "'/browser/GAMEROAD.html'" "$SOURCE" | wc -l | tr -d ' ')"
          test "$BEFORE" -ge 1
          sed "s#'/browser/GAMEROAD.html'#'/'#g" "$SOURCE" > "$TARGET"
          ! grep -Fq "'/browser/GAMEROAD.html'" "$TARGET"
          cat > .r3-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';

          const publicProjects = (baseConfig.projects ?? [])
            .filter((project) => !project.grep)
            .map((project) => ({ name: project.name, use: project.use }));

          export default defineConfig({
            testDir: '.',
            testMatch: 'browser-full-interaction.spec.mjs',
            grep: /R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout: 240_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/a-r3-public-origin',
            reporter: [
              ['line'],
              ['html', { outputFolder: '../playwright-report-a-r3-public-origin', open: 'never' }],
              ['json', { outputFile: '../test-results/a-r3-public-origin/public-origin-report.json' }],
            ],
            use: {
              ...baseConfig.use,
              baseURL: process.env.GAMEROAD_PUBLIC_BASE_URL,
              trace: 'on',
              screenshot: 'on',
              video: 'off',
            },
            projects: publicProjects,
          });
          EOF

      - name: Run R19 exact-current product across existing viewports
        id: r19
        shell: bash
        run: |
          set +e
          npx playwright test --config=.r3-public/playwright.config.mjs --workers=1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record evidence binding and harness result
        if: always()
        shell: bash
        env:
          OBSERVED_BUILD_ID: ${{ steps.public_manifest.outputs.observed_build_id }}
          R19_EXIT_CODE: ${{ steps.r19.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          printf 'run_id=%s\nharness_source_sha=%s\nproduct_build_id=%s\nobserved_build_id=%s\npublic_origin=%s\nr19_exit_code=%s\nproduct_mutation=0\n' \
            "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$EXPECTED_PRODUCT_BUILD_ID" "${OBSERVED_BUILD_ID:-}" "$GAMEROAD_PUBLIC_BASE_URL" "${R19_EXIT_CODE:-unset}" \
            > public-origin-metadata/run-binding.txt

      - name: Upload exact-current interaction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-a-current-actual-r3-${{ github.run_id }}
          path: |
            playwright-report-a-r3-public-origin/
            test-results/a-r3-public-origin/
            public-origin-metadata/
          if-no-files-found: error
          retention-days: 14
