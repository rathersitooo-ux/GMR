name: REQCHECK R7 Board Facility Gate Mapper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-required-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/reqcheck-r7-board-mount-map-20260819
          fetch-depth: 0

      - name: Patch exact board-facility mapping anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gameroad-required-gate.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          classic_insert = 0
          test_path_insert = 0
          test_cmd_patch = 0

          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]

              if stripped == 'browser/board-facility-state-core.classic.js|\\':
                  out.append(line)
                  out.append(indent + 'browser/board-facility-runtime-mount.mjs|\\')
                  classic_insert += 1
                  continue

              if stripped == 'tests/board-facility-classic-adapter.test.mjs)':
                  out.append(indent + 'tests/board-facility-classic-adapter.test.mjs|\\')
                  out.append(indent + 'tests/board-facility-runtime-mount.test.mjs)')
                  test_path_insert += 1
                  continue

              old_test = 'run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs'
              if stripped == old_test:
                  out.append(line + ' tests/board-facility-runtime-mount.test.mjs')
                  test_cmd_patch += 1
                  continue

              out.append(line)

          counts = (classic_insert, test_path_insert, test_cmd_patch)
          if counts != (1, 1, 1):
              raise SystemExit(f'board mapping anchor counts={counts}; expected (1, 1, 1)')

          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Run board-facility focused tests
        run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs

      - name: Validate bounded diff and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows/gameroad-required-gate.yml
          test "$(git diff --numstat -- .github/workflows/gameroad-required-gate.yml | wc -l)" -eq 1
          grep -F 'browser/board-facility-runtime-mount.mjs' .github/workflows/gameroad-required-gate.yml
          grep -F 'tests/board-facility-runtime-mount.test.mjs' .github/workflows/gameroad-required-gate.yml
          git rm .github/workflows/reqcheck-r7-board-mount-map-temp.yml
          git status --short

      - name: Commit exact workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gameroad-required-gate.yml
          git commit -m 'REQCHECK R7: classify board runtime mount'
          git push origin HEAD:work/reqcheck-r7-board-mount-map-20260819
