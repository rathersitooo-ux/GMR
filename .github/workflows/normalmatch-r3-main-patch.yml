name: TEMP R3 Normal Match Product Patch

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/normalmatch-r3-public-transport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact acquired R3 branch
        uses: actions/checkout@v4
        with:
          ref: work/normalmatch-r3-public-transport
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact branch executor source and extract guarded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a9753ce8982c7b9ab0be132702bb7c90fb9c452b'
          test "$(git hash-object .github/workflows/zz-temp-normalmatch-r3-patch.yml)" = '6c8b1184b75677cad1962cb906c02eb9fe323cf7'
          git fetch origin main
          git merge-base --is-ancestor 21e4faca44f7f427b47f09a7fd8b3a2d7989943c HEAD
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/zz-temp-normalmatch-r3-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run bounded R3 tests and syntax checks"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('R3_PATCH_EXTRACT_MARKER_MISMATCH')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          patch = '\n'.join(lines) + '\n'
          Path('/tmp/r3_patch.py').write_text(patch, encoding='utf-8')
          print(f'R3_PATCH_EXTRACTED bytes={len(patch.encode())}')
          PY
          python3 /tmp/r3_patch.py

      - name: Run bounded current R3 tests and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --test deploy/cloudflare/tests/relay-core.test.mjs
          node --check deploy/cloudflare/relay/src/relay-core.mjs
          node --check deploy/cloudflare/relay/src/relay-worker.mjs
          node --check deploy/cloudflare/functions/ws.js
          git diff --check

      - name: Verify allowlist and remove ineffective branch executor
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(deploy/cloudflare/relay/src/relay-core\.mjs|deploy/cloudflare/relay/src/relay-worker\.mjs|deploy/cloudflare/relay/wrangler\.toml|deploy/cloudflare/functions/ws\.js|deploy/cloudflare/wrangler\.pages\.toml|deploy/cloudflare/tests/relay-core\.test\.mjs|\.github/workflows/zz-temp-normalmatch-r3-patch\.yml)$'
          bad="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            echo "Unexpected R3 changed paths:"
            printf '%s\n' "$bad"
            exit 1
          fi
          git rm .github/workflows/zz-temp-normalmatch-r3-patch.yml
          bad="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [[ -n "$bad" ]]; then
            echo "Unexpected R3 paths after executor removal:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit exact durable R3 branch delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-r3-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/cloudflare/relay/src/relay-core.mjs \
                  deploy/cloudflare/relay/src/relay-worker.mjs \
                  deploy/cloudflare/relay/wrangler.toml \
                  deploy/cloudflare/functions/ws.js \
                  deploy/cloudflare/wrangler.pages.toml \
                  deploy/cloudflare/tests/relay-core.test.mjs
          git add -u .github/workflows/zz-temp-normalmatch-r3-patch.yml
          git diff --cached --check
          git commit -m 'R3: implement server-authoritative normal-match transport'
          git push origin HEAD:work/normalmatch-r3-public-transport
