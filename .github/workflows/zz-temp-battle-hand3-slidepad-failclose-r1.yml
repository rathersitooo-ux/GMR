name: TEMP Battle Hand3 SlidePad fail-close R1
on:
  push:
    branches:
      - sol/battle-hand3-slidepad-current-r1-20260910
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'TEMP run Hand3 SlidePad fail-close R1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-hand3-slidepad-current-r1-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current Hand3 fail-close projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          test_path = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          source = runtime_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          old = '''    const canonical = canonicalRoundId(roundText);
    if (assignment?.roundId && assignment.roundId !== canonical) assignment = null;
    model = buildBattleJankenSlidePadModel({
      roundId: roundText,
      hand,
      currentSnapshot: assignment,
      pickDuplicateIndex: (request) => entropyIndex(globalRef, request),
    });
    assignment = model.assignment;'''
          new = '''    const canonical = canonicalRoundId(roundText);
    if (assignment?.roundId && assignment.roundId !== canonical) assignment = null;
    const currentPolicyConnected = dedicatedFocus !== null;
    const currentAssignmentReady = assignment?.assignmentMode
      === NEW_BASE_ROUND_START_JANKEN_ASSIGNMENT_MODE.CURRENT_HAND3_POLICY;
    if (currentPolicyConnected && !currentAssignmentReady) {
      assignment = null;
      model = deepFreeze({
        schema: BATTLE_JANKEN_SLIDEPAD_RUNTIME_SCHEMA,
        roundId: canonical,
        assignment: null,
        ordinaryHandCardIds: Object.freeze(hand.map((card) => card.id)),
        slots: Object.freeze(SLOT_ORDER.map((jankenHand) => Object.freeze({
          jankenHand,
          ...SLOT_VIEW[jankenHand],
          cardId: null,
          cardLabel: null,
          occupied: false,
          selectable: false,
        }))),
      });
    } else {
      model = buildBattleJankenSlidePadModel({
        roundId: roundText,
        hand,
        currentSnapshot: assignment,
        pickDuplicateIndex: (request) => entropyIndex(globalRef, request),
      });
      assignment = model.assignment;
    }'''
          if source.count(old) != 1:
              raise SystemExit(f'render anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old_test = '''  assert.match(runtimeSource, /focusAssignmentSyncPending = true;[\\s\\S]*readDedicatedFocusContext\\(\\)\\.finally/);
});'''
          new_test = '''  assert.match(runtimeSource, /focusAssignmentSyncPending = true;[\\s\\S]*readDedicatedFocusContext\\(\\)\\.finally/);
  assert.match(runtimeSource, /const currentPolicyConnected = dedicatedFocus !== null/);
  assert.match(runtimeSource, /currentPolicyConnected && !currentAssignmentReady[\\s\\S]*assignment: null[\\s\\S]*selectable: false/,
    'current authority path stays disabled until the immutable current Hand3 snapshot arrives');
});'''
          if tests.count(old_test) != 1:
              raise SystemExit(f'focus test anchor count={tests.count(old_test)}')
          tests = tests.replace(old_test, new_test, 1)

          runtime_path.write_text(source, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          node --test \
            tests/battle-janken-slidepad-runtime-mount.test.mjs \
            tests/new-base-hand3-uniform-assignment-policy.test.mjs \
            tests/new-base-round-start-janken-slot-assignment-core.test.mjs

          mapfile -t changed < <(git diff --name-only)
          printf 'Working diff: %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'browser/battle-janken-slidepad-runtime-mount.mjs'
          test "${changed[1]}" = 'tests/battle-janken-slidepad-runtime-mount.test.mjs'

          git config user.name gameroad-bounded-writer
          git config user.email gameroad-bounded-writer@users.noreply.github.com
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git rm .github/workflows/zz-temp-battle-hand3-slidepad-failclose-r1.yml
          git diff --cached --check
          git commit -m 'Battle: Hand3 SlidePadをcurrent割当待ちでfail-close'
          git push origin HEAD:sol/battle-hand3-slidepad-current-r1-20260910
