name: TEMP Board109 R13 package closure

on:
  push:
    branches:
      - sol/board109-visual-live-r12-20260906

permissions:
  contents: write

jobs:
  package-and-prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/board109-visual-live-r12-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch only known public package omission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build_path = Path('deploy/cloudflare/scripts/build.mjs')
          text = build_path.read_text()
          if 'battleBoardVisualExplanationRuntimeMountSource' in text:
              raise SystemExit('runtime mount package spec already exists; fail closed')
          core = "  { option: 'battleBoardVisualExplanationSource', expected: 'expectedBattleBoardVisualExplanationBlob', source: 'browser/battle-board-visual-explanation-core.mjs', output: 'battle-board-visual-explanation-core.mjs', artifact: 'battle_board_visual_explanation_core', label: 'Battle board visual explanation core', sourceFlag: '--battle-board-visual-explanation-source', expectedFlag: '--expected-battle-board-visual-explanation-blob' },"
          runtime = "  { option: 'battleBoardVisualExplanationRuntimeMountSource', expected: 'expectedBattleBoardVisualExplanationRuntimeMountBlob', source: 'browser/battle-board-visual-explanation-runtime-mount.mjs', output: 'battle-board-visual-explanation-runtime-mount.mjs', artifact: 'battle_board_visual_explanation_runtime_mount', label: 'Battle board visual explanation runtime mount', sourceFlag: '--battle-board-visual-explanation-runtime-mount-source', expectedFlag: '--expected-battle-board-visual-explanation-runtime-mount-blob' },"
          if text.count(core) != 1:
              raise SystemExit('expected Board109 core package anchor count != 1')
          build_path.write_text(text.replace(core, core + '\n' + runtime, 1))

          test_path = Path('deploy/cloudflare/tests/build.test.mjs')
          text = test_path.read_text()
          old_naki = "currentBlob: 'f56dc4f8a75ba9bb909a1daef6882e8b7404d373'"
          new_naki = "currentBlob: '01df2262bfe894638ebaa16d7f4834acc550d552'"
          if text.count(old_naki) != 1:
              raise SystemExit('expected old Naki package blob pin count != 1')
          text = text.replace(old_naki, new_naki, 1)
          naki_dep = "  { file: 'battle-board-naki-4p-visual-binding.mjs', source: 'browser/battle-board-naki-4p-visual-binding.mjs', sourceArg: 'naki4pBoardVisualBindingSource', expectedArg: 'expectedNaki4pBoardVisualBindingBlob', artifact: 'battle_board_naki_4p_visual_binding', fixture: \"export const NAKI_4P_BOARD_VISUAL_BINDING = Object.freeze({});\\n\", currentBlob: '01df2262bfe894638ebaa16d7f4834acc550d552' },"
          runtime_dep = "  { file: 'battle-board-visual-explanation-runtime-mount.mjs', source: 'browser/battle-board-visual-explanation-runtime-mount.mjs', sourceArg: 'battleBoardVisualExplanationRuntimeMountSource', expectedArg: 'expectedBattleBoardVisualExplanationRuntimeMountBlob', artifact: 'battle_board_visual_explanation_runtime_mount', fixture: \"import './battle-board-visual-explanation-core.mjs';\\nimport './partner-advice-runtime-mount.mjs';\\nexport const BATTLE_BOARD_VISUAL_EXPLANATION_RUNTIME = Object.freeze({});\\n\", currentBlob: '641b5d6d19919b32d542c601d7255c8009a55013' },"
          if text.count(naki_dep) != 1:
              raise SystemExit('expected updated Naki dependency anchor count != 1')
          text = text.replace(naki_dep, naki_dep + '\n' + runtime_dep, 1)
          stale = "['expectedNaki4pBoardVisualBindingBlob', /Naki 4P actual-board visual binding blob mismatch/]"
          stale_runtime = "['expectedBattleBoardVisualExplanationRuntimeMountBlob', /Battle board visual explanation runtime mount blob mismatch/]"
          if text.count(stale) != 1:
              raise SystemExit('expected stale-case Naki anchor count != 1')
          text = text.replace(stale, stale + ', ' + stale_runtime, 1)
          test_path.write_text(text)
          PY
      - name: Focused Board109 runtime and package tests
        run: |
          node --test tests/battle-board-naki-4p-visual-binding.test.mjs
          node --test tests/battle-board-visual-explanation-runtime-mount.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Diff guard
        run: |
          git diff --exit-code -- browser/GAMEROAD.html || { echo 'GAMEROAD.html changed unexpectedly'; exit 1; }
          git status --short
          changed="$(git diff --name-only | sort)"
          expected=$'deploy/cloudflare/scripts/build.mjs\ndeploy/cloudflare/tests/build.test.mjs'
          test "$changed" = "$expected"
      - name: Commit package closure and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'gameroad-bot'
          git config user.email 'gameroad-bot@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs
          git rm .github/workflows/zz-temp-board109-r13.yml
          git commit -m 'Board109: package visual explanation runtime'
          git push origin HEAD:sol/board109-visual-live-r12-20260906
