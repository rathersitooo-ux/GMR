name: PLAYTEST R44B update banner product recovery

on:
  push:
    branches:
      - work/visual-r34-result-update-banner
    paths:
      - .github/workflows/playtest-r44b-update-banner-recovery.yml

permissions:
  contents: write

env:
  EXACT_BASE: aa77a5799da2de6bea9d28640df46e4328c2046e
  EXACT_HTML_BLOB: 477325641fa328ecd55cdc15a11a5d0ea90759f1
  EXACT_TEST_BLOB: 5386451be827ac75554f8f99c7d0d4586a5a07c2

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-r34-result-update-banner
          fetch-depth: 0

      - name: Exact-base bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'R44B_STAGE=exact-bounded-patch' >> "$GITHUB_ENV"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_BASE"
          git checkout origin/main -- browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXACT_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXACT_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path

          html = Path('browser/GAMEROAD.html')
          data = html.read_text(encoding='utf-8-sig')

          replacements = [
            (
              "R.update = { ...R.update, BUILD_ID:GM.config.BUILD_ID, updatePending:null };",
              "R.update = { ...R.update, BUILD_ID:GM.config.BUILD_ID, updateBaselineId:null, updatePending:null };"
            ),
            (
              "if(!nextId || nextId === this.BUILD_ID){ this.updatePending = null; this.renderUpdateBanner(); return; }",
              "if(!nextId) return;\n    if(!this.updateBaselineId){ this.updateBaselineId = nextId; this.updatePending = null; this.renderUpdateBanner(); return; }\n    if(nextId === this.updateBaselineId){ this.updatePending = null; this.renderUpdateBanner(); return; }"
            ),
            (
              "const has=!!this.updatePending;",
              "const has=!!this.updatePending&&GM.state.screen==='home';"
            )
          ]
          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count={count}, expected 1: {old[:80]}')
              data = data.replace(old, new, 1)
          html.write_text(data, encoding='utf-8')

          spec = Path('tests/browser-full-interaction.spec.mjs')
          s = spec.read_text(encoding='utf-8')
          marker = '// UPDATE-MANIFEST-BASELINE-HOME-ONLY-REGRESSION R1'
          if marker in s:
              raise SystemExit('update regression marker already exists')
          s += r'''

// UPDATE-MANIFEST-BASELINE-HOME-ONLY-REGRESSION R1
test('update manifest baseline is session-local and pending banner is Home-only', async ({ page, browser }, testInfo) => {
  const runtime = observeRuntimeErrors(page);
  let manifest = { build_id: 'r44-baseline-a', published_at: '2026-08-21T00:00:00Z', reload_hint: '' };
  await page.route('**/browser/gameroad-version.json', async (route) => {
    await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(manifest) });
  });
  await bootCurrentBrowser(page);
  const banner = page.locator('#gameroadUpdateBanner');
  await expect(banner).toBeHidden();
  await expect(banner).toHaveAttribute('aria-hidden', 'true');
  await page.evaluate(() => window.__GAMEROAD_TEST__.update());
  await expect(banner).toBeHidden();

  manifest = { build_id: 'r44-release-b', published_at: '2026-08-21T00:01:00Z', reload_hint: 'reload' };
  await page.evaluate(() => window.__GAMEROAD_TEST__.update());
  await expect(banner).toBeVisible();
  await expect(banner).toHaveAttribute('aria-hidden', 'false');

  const setupGo = visibleHomeControl(page, 'setup');
  await expect(setupGo).toBeVisible();
  await setupGo.click();
  const setup = page.locator('section[data-screen="setup"]');
  await expect(setup).toBeVisible();
  await expect(banner).toBeHidden();
  await expect(banner).toHaveAttribute('aria-hidden', 'true');
  await expect(banner).toHaveCSS('display', 'none');

  const honey = setup.locator('[data-content="honey_hunt"]');
  await expect(honey).toBeVisible();
  await honey.click();
  await expect(honey).toHaveClass(/on/);

  manifest = { build_id: 'r44-release-c', published_at: '2026-08-21T00:02:00Z', reload_hint: 'reload' };
  await page.evaluate(() => window.__GAMEROAD_TEST__.update());
  await expect(banner).toBeHidden();

  const back = setup.locator('[data-back]:visible').first();
  await expect(back).toBeVisible();
  await back.click();
  await expect(page.locator('section[data-screen="home"]')).toBeVisible();
  await expect(banner).toBeVisible();

  const currentUrl = page.url();
  const freshContext = await browser.newContext({ viewport: testInfo.project.use.viewport });
  const freshPage = await freshContext.newPage();
  await freshPage.route('**/browser/gameroad-version.json', async (route) => {
    await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(manifest) });
  });
  await freshPage.goto(currentUrl, { waitUntil: 'domcontentloaded' });
  await freshPage.waitForTimeout(1_000);
  const freshBanner = freshPage.locator('#gameroadUpdateBanner');
  await expect(freshBanner).toBeHidden();
  await expect(freshBanner).toHaveAttribute('aria-hidden', 'true');
  await freshContext.close();
  await attachStateScreenshot(page, testInfo, 'update-pending-home-only-visible');
  runtime.assertClean(testInfo);
});
'''
          spec.write_text(s, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          echo 'R44B_STAGE=playwright-install' >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Three viewport update regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'R44B_STAGE=three-viewport-regression' >> "$GITHUB_ENV"
          npx playwright test --config=playwright.full-interaction.config.mjs --workers=1 --grep "update manifest baseline is session-local and pending banner is Home-only" --project=desktop-1280x720 --project=phone-390x844 --project=short-landscape-667x375

      - name: Persist verified product test only
        shell: bash
        run: |
          set -euo pipefail
          echo 'R44B_STAGE=persist' >> "$GITHUB_ENV"
          git rm -f --ignore-unmatch .github/workflows/playtest-r44-update-banner-recovery.yml .github/workflows/playtest-r44b-update-banner-recovery.yml .github/workflows/playtest-visual-r34-bounded-patch.yml .tmp-deck-selection-diagnostic.txt .tmp-update-banner-source.txt .tmp-deck-selection-eval.txt .tmp-r43-executor-result.txt .tmp-r44-executor-result.txt .tmp-r44b-executor-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git diff --cached --check
          git commit -m "PLAYTEST R44: make update prompt session-aware and Home-only"
          git push origin HEAD:work/visual-r34-result-update-banner

      - name: Persist exact failure stage
        if: failure()
        shell: bash
        run: |
          set -u
          git reset --hard "$GITHUB_SHA"
          printf 'R44B bounded executor failed\nstage=%s\nworkflow_sha=%s\nbase=%s\ntime_utc=%s\n' "${R44B_STAGE:-unknown}" "$GITHUB_SHA" "$EXACT_BASE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .tmp-r44b-executor-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-r44b-executor-result.txt
          git commit -m "PLAYTEST R44B: persist bounded executor failure stage" || true
          git push origin HEAD:work/visual-r34-result-update-banner || true
