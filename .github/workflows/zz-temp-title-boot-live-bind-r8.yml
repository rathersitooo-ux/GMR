name: TEMP Title Boot Live Bind R8

on:
  push:
    branches:
      - sol/title-boot-live-bind-r8-20260911

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/title-boot-live-bind-r8-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact existing-seam wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const homePath = 'browser/home-cards-2p5d-presentation.mjs';
          let home = fs.readFileSync(homePath, 'utf8');
          const homeAnchor = "import './home-boot-runtime-mount.mjs';";
          if ((home.match(/import '\.\/home-boot-runtime-mount\.mjs';/g) || []).length !== 1) throw new Error('home boot import anchor count != 1');
          if (home.includes("import './title-boot-runtime-mount.mjs';")) throw new Error('title runtime already imported');
          home = home.replace(homeAnchor, `${homeAnchor}\nimport './title-boot-runtime-mount.mjs';`);
          fs.writeFileSync(homePath, home);

          const buildPath = 'deploy/cloudflare/scripts/build.mjs';
          let build = fs.readFileSync(buildPath, 'utf8');
          const lines = build.split('\n');
          const hits = lines.map((line, index) => line.includes("source: 'browser/home-boot-runtime-mount.mjs'") ? index : -1).filter(index => index >= 0);
          if (hits.length !== 1) throw new Error(`home boot artifact anchor count != 1: ${hits.length}`);
          for (const source of ['browser/title-boot-router-core.mjs','browser/boot-loading-presentation-core.mjs','browser/title-boot-runtime-mount.mjs']) {
            if (build.includes(`source: '${source}'`)) throw new Error(`${source} already packaged`);
          }
          const insertAt = hits[0] + 1;
          lines.splice(insertAt, 0,
            "  { source: 'browser/title-boot-router-core.mjs', output: 'title-boot-router-core.mjs', artifact: 'title_boot_router_core', label: 'Title boot router core' },",
            "  { source: 'browser/boot-loading-presentation-core.mjs', output: 'boot-loading-presentation-core.mjs', artifact: 'boot_loading_presentation_core', label: 'Boot loading presentation core' },",
            "  { source: 'browser/title-boot-runtime-mount.mjs', output: 'title-boot-runtime-mount.mjs', artifact: 'title_boot_runtime_mount', label: 'Title boot runtime mount' },"
          );
          fs.writeFileSync(buildPath, lines.join('\n'));
          NODE
      - name: Focused checks
        run: |
          node --test tests/title-boot-runtime-mount.test.mjs
          node --test tests/home-cards-2p5d-runtime.spec.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit proven product change and remove transient executor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/home-cards-2p5d-presentation.mjs deploy/cloudflare/scripts/build.mjs
          git rm -f .github/workflows/zz-temp-title-boot-live-bind-r8.yml
          git rm -f data/preaction-authorizations/TITLE-BOOT-LIVE-BIND-R8-20260911T1337-SOL-Q8N4V7.json
          git commit -m 'Title: 既存の起動画面を公開導線へ接続'
          git push origin HEAD:sol/title-boot-live-bind-r8-20260911
