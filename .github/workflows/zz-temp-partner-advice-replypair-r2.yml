name: TEMP Partner advice reply pair R2

on:
  push:
    branches:
      - sol/partner-advice-replypair-r2-20260915
    paths:
      - .github/workflows/zz-temp-partner-advice-replypair-r2.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/partner-advice-replypair-r2-20260915
          fetch-depth: 0
      - name: Apply bounded exact-anchor patch
        run: python tools/temp-partner-advice-replypair-r2.py
      - name: Syntax check
        run: node --check browser/partner-advice-runtime-mount.mjs
      - name: Focused Partner tests
        run: node --test tests/partner-dialogue-source-registry.test.mjs tests/partner-advice-runtime-mount.test.mjs
      - name: Public package test
        run: node --test deploy/cloudflare/tests/build.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Remove transient authorization and patch machinery
        run: |
          rm -f tools/temp-partner-advice-replypair-r2.py
          rm -f .github/workflows/zz-temp-partner-advice-replypair-r2.yml
          rm -f data/preaction-authorizations/PARTNER-ADVICE-REPLYPAIR-R2-20260915T2120-SOL-SU13D.json
      - name: Commit bounded durable diff
        run: |
          git config user.name "gameroad-bounded-writer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Partner: mount separate two-choice advice reply"
          git push origin HEAD:sol/partner-advice-replypair-r2-20260915
