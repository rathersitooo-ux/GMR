name: TEMP WU63 667 Rail Repair R1

on:
  push:
    branches:
      - sol/battle-wu63-667-rail-repair-r1-20260914

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact short-landscape rail source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence/wu63-r1
          python3 - <<'PY'
          from pathlib import Path
          src=Path('browser/GAMEROAD.html').read_text()
          needles=['.battleRail','#battleAdvanceReservation','.arRow','@media(max-height','@media (max-height','max-height:430px','max-height: 430px','translateY(-21','top:-21','top: -21']
          chunks=[]
          seen=set()
          for needle in needles:
              start=0
              while True:
                  i=src.find(needle,start)
                  if i<0: break
                  key=(max(0,i-1400),min(len(src),i+3000))
                  if key not in seen:
                      seen.add(key)
                      chunks.append(f'===== {needle} @ {i} =====\n'+src[key[0]:key[1]])
                  start=i+len(needle)
          Path('visual-evidence/wu63-r1/source-context.txt').write_text('\n\n'.join(chunks))
          print('contexts',len(chunks))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battle-wu63-r1-source-${{ github.run_id }}
          path: visual-evidence/wu63-r1/source-context.txt
          retention-days: 14
