name: TEMP Battle screen status resource HUD R1

on:
  push:
    branches:
      - sol/battle-screen-status-hud-r1-20260910

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-screen-status-hud-r1-20260910
          fetch-depth: 0
      - name: Verify authorization lineage
        run: |
          test -f data/preaction-authorizations/BATTLE-SCREEN-STATUS-HUD-R1-20260910T0328-SOL-Q7N4P8.json
          git merge-base --is-ancestor 5106845bd21cd0e9836e5562394cd09157775efa HEAD
      - name: Apply bounded screen status/resource patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-screen-runtime-mount.mjs')
          test_path = Path('tests/battle-screen-runtime-mount.test.mjs')
          runtime = runtime_path.read_text()
          tests = test_path.read_text()

          marker = "resourceHudAuthority: 'CALLER_ONLY_EXISTING_RESOURCE_HUD'"
          if marker not in runtime:
              def replace_once(text, old, new, label):
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
                  return text.replace(old, new, 1)

              runtime = replace_once(
                  runtime,
                  "import { auditBattleScreenModel } from './battle-screen-presentation-core.mjs';\n",
                  "import { auditBattleScreenModel } from './battle-screen-presentation-core.mjs';\nimport { mountBattleCriticalResourceHud } from './battle-critical-resource-hud-runtime.mjs';\n",
                  'runtime import'
              )
              runtime = replace_once(
                  runtime,
                  "const CURRENT_ACTION_PHASE_LABELS = Object.freeze({\n  partner_cutin: '相棒',",
                  "const CURRENT_ACTION_PHASE_LABELS = Object.freeze({\n  plan: '選択',\n  partner_cutin: '相棒',",
                  'plan phase label'
              )
              runtime = replace_once(
                  runtime,
                  '[${SHELL_ATTR}="1"] [${CURRENT_ACTION_ATTR}]{position:absolute;',
                  '[${CURRENT_ACTION_ATTR}]{position:absolute;',
                  'current action global overlay style'
              )
              runtime = replace_once(
                  runtime,
                  '  return { root, settingsButton, scoreValue, chain, loadValue, hateValue, turnValue };',
                  '  return { root, right, settingsButton, scoreValue, chain, loadValue, hateValue, turnValue };',
                  'hud right host export'
              )
              runtime = replace_once(
                  runtime,
                  "  const hud = createHud(document, shell);\n  let lastHudSnapshot = writeHud(document, hud, options.hud);",
                  "  const hud = createHud(document, shell);\n  let lastHudSnapshot = writeHud(document, hud, options.hud);\n  const resourceHud = mountBattleCriticalResourceHud(global, { host: hud.right, snapshot: options.hud ?? {} });",
                  'resource hud mount'
              )
              runtime = replace_once(
                  runtime,
                  "  const currentActionCue = createCurrentActionCue(document);\n  visualHost.appendChild(currentActionCue);",
                  "  const currentActionCue = createCurrentActionCue(document);\n  const currentActionHost = adoptingExistingPhase && validRoot(root) ? root : shell;\n  currentActionHost.appendChild(currentActionCue);",
                  'current action host'
              )
              runtime = replace_once(
                  runtime,
                  "    lastHudSnapshot = writeHud(document, hud, snapshot);\n    return lastHudSnapshot;",
                  "    lastHudSnapshot = writeHud(document, hud, snapshot);\n    resourceHud.sync(snapshot);\n    return lastHudSnapshot;",
                  'resource hud sync'
              )
              runtime = replace_once(
                  runtime,
                  '    writeCurrentActionCue(currentActionCue, battle ? model : null);',
                  '    writeCurrentActionCue(currentActionCue, resultExit ? null : model);',
                  'plan current action render'
              )
              runtime = replace_once(
                  runtime,
                  "    if (grid?.parentNode && typeof grid.parentNode.removeChild === 'function') grid.parentNode.removeChild(grid);\n    if (hud.root?.parentNode && typeof hud.root.parentNode.removeChild === 'function') hud.root.parentNode.removeChild(hud.root);",
                  "    if (grid?.parentNode && typeof grid.parentNode.removeChild === 'function') grid.parentNode.removeChild(grid);\n    resourceHud.destroy();\n    if (hud.root?.parentNode && typeof hud.root.parentNode.removeChild === 'function') hud.root.parentNode.removeChild(hud.root);",
                  'resource hud destroy'
              )
              runtime = replace_once(
                  runtime,
                  "    hud,\n    grid,",
                  "    hud,\n    resourceHud,\n    grid,",
                  'resource hud runtime exposure'
              )
              runtime = replace_once(
                  runtime,
                  "  currentActionAuthority: 'ACCEPTED_PUBLIC_MODEL_ONLY',\n  hudAuthority: 'CALLER_ONLY_FAIL_CLOSED_PLACEHOLDERS',",
                  "  currentActionAuthority: 'ACCEPTED_PUBLIC_MODEL_ONLY',\n  planCurrentActionPolicy: 'GENERIC_SELECTION_LABEL_ONLY_NO_LEGAL_ACTION_INFERENCE',\n  hudAuthority: 'CALLER_ONLY_FAIL_CLOSED_PLACEHOLDERS',\n  resourceHudAuthority: 'CALLER_ONLY_EXISTING_RESOURCE_HUD',",
                  'runtime metadata'
              )

              tests = replace_once(
                  tests,
                  "assert.equal(runtime.hud.chain.children.length, 0);\nassert.ok(runtime.currentActionCue);",
                  "assert.equal(runtime.hud.chain.children.length, 0);\nassert.ok(runtime.resourceHud);\nassert.equal(runtime.resourceHud.resourceAuthority, 'CALLER_ONLY');\nassert.equal(runtime.resourceHud.gameStateWrite, false);\nassert.equal(runtime.resourceHud.honeyCell.children[1].textContent, '—');\nassert.equal(runtime.resourceHud.chipCell.children[1].textContent, '—');\nassert.ok(runtime.currentActionCue);",
                  'initial resource assertions'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(runtime.hud.root.hidden, true);\nassert.equal(runtime.currentActionCue.hidden, true);\nassert.equal(runtime.currentActionCue.textContent, '');\nassert.equal(runtime.currentActionCue.dataset.boardReturnDestination, undefined);",
                  "assert.equal(runtime.hud.root.hidden, true);\nassert.equal(runtime.currentActionCue.hidden, false);\nassert.equal(runtime.currentActionCue.textContent, '今：選択');\nassert.equal(runtime.currentActionCue.dataset.phase, 'plan');\nassert.equal(runtime.currentActionCue.dataset.boardReturnDestination, undefined);",
                  'plan cue assertions'
              )
              tests = replace_once(
                  tests,
                  "  loadJanken: 'rock',\n  playedCards: [",
                  "  loadJanken: 'rock',\n  honey: 3,\n  chipCount: 2,\n  honeyDelta: 1,\n  honeyDeltaSource: 'rank_number',\n  playedCards: [",
                  'attack resource snapshot'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(runtime.hud.loadValue.dataset.resolved, 'true');\nassert.equal(runtime.hud.root.dataset.playedCardCount, '3');",
                  "assert.equal(runtime.hud.loadValue.dataset.resolved, 'true');\nassert.equal(runtime.resourceHud.honeyCell.children[1].textContent, '3');\nassert.equal(runtime.resourceHud.chipCell.children[1].textContent, '2');\nassert.equal(runtime.resourceHud.honeyCell.dataset.resolved, 'true');\nassert.equal(runtime.resourceHud.chipCell.dataset.resolved, 'true');\nassert.equal(runtime.resourceHud.honeyCell.children[2].textContent, '+1・rank_number');\nassert.equal(runtime.resourceHud.honeyCell.children[2].hidden, false);\nassert.equal(runtime.hud.root.dataset.playedCardCount, '3');",
                  'resolved resource assertions'
              )
              tests = replace_once(
                  tests,
                  "runtime.renderHud({ score: '', hate: null, turn: undefined, loadJanken: 'heart' });\nassert.equal(runtime.hud.scoreValue.textContent, 'X');",
                  "runtime.renderHud({ score: '', hate: null, turn: undefined, loadJanken: 'heart', honey: -1, chipCount: '2' });\nassert.equal(runtime.hud.scoreValue.textContent, 'X');",
                  'unresolved resource input'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(runtime.hud.loadValue.textContent.includes('♥'), false);",
                  "assert.equal(runtime.hud.loadValue.textContent.includes('♥'), false);\nassert.equal(runtime.resourceHud.honeyCell.children[1].textContent, '—');\nassert.equal(runtime.resourceHud.chipCell.children[1].textContent, '—');\nassert.equal(runtime.resourceHud.honeyCell.dataset.resolved, 'false');\nassert.equal(runtime.resourceHud.chipCell.dataset.resolved, 'false');",
                  'unresolved resource assertions'
              )
              tests = replace_once(
                  tests,
                  "const currentActionCue = runtime.currentActionCue;\nassert.equal(runtime.destroy(), true);",
                  "const currentActionCue = runtime.currentActionCue;\nconst resourceHudRoot = runtime.resourceHud.root;\nassert.equal(runtime.destroy(), true);",
                  'resource destroy capture'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(currentActionCue.parentNode, null);\nassert.equal(root.children.includes(runtime.shell), false);",
                  "assert.equal(currentActionCue.parentNode, null);\nassert.equal(resourceHudRoot.parentNode, null);\nassert.equal(root.children.includes(runtime.shell), false);",
                  'resource destroy assertion'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(adopted.hud.root.parentNode, adopted.shell);\nassert.equal(adopted.currentActionCue.parentNode, adopted.shell);",
                  "assert.equal(adopted.hud.root.parentNode, adopted.shell);\nassert.equal(adopted.currentActionCue.parentNode, existingShell);",
                  'adopted current action host assertion'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(adopted.fieldLandmark.getAttribute('data-battle-field-landmark'), 'FIELD-09');\nadopted.render(attack, { score: 'S', hate: 'H', turn: 'T', loadJanken: 'paper' });",
                  "assert.equal(adopted.fieldLandmark.getAttribute('data-battle-field-landmark'), 'FIELD-09');\nadopted.render(idle);\nassert.equal(existingPhase.hidden, true);\nassert.equal(adopted.currentActionCue.hidden, false);\nassert.equal(adopted.currentActionCue.textContent, '今：選択');\nassert.equal(adopted.currentActionCue.dataset.phase, 'plan');\nadopted.render(attack, { score: 'S', hate: 'H', turn: 'T', loadJanken: 'paper', honey: 0, chipCount: 0 });",
                  'adopted plan cue and zero resources'
              )
              tests = replace_once(
                  tests,
                  "assert.equal(adopted.hud.loadValue.textContent, 'パー');\nassert.equal(adopted.currentActionCue.textContent, '今：攻撃 A-1 → B-2');",
                  "assert.equal(adopted.hud.loadValue.textContent, 'パー');\nassert.equal(adopted.resourceHud.honeyCell.children[1].textContent, '0');\nassert.equal(adopted.resourceHud.chipCell.children[1].textContent, '0');\nassert.equal(adopted.currentActionCue.textContent, '今：攻撃 A-1 → B-2');",
                  'adopted zero resource assertions'
              )

              runtime_path.write_text(runtime)
              test_path.write_text(tests)
          PY
      - name: Verify scope and tests
        run: |
          node --check browser/battle-screen-runtime-mount.mjs
          node --test tests/battle-screen-runtime-mount.test.mjs
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'browser/battle-screen-runtime-mount.mjs\ntests/battle-screen-runtime-mount.test.mjs' || { echo 'unexpected scope'; exit 1; }
      - name: Commit product delta
        run: |
          if git diff --quiet; then
            echo 'No product delta to commit.'
            exit 0
          fi
          git config user.name 'gameroad-bounded-writer'
          git config user.email 'gameroad-bounded-writer@users.noreply.github.com'
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
          git commit -m 'Battle: 今することと戦闘資源をscreenへ接続'
          git push origin HEAD:sol/battle-screen-status-hud-r1-20260910
