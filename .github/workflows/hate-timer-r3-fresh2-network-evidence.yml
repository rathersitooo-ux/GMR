name: HATE Timer R3 Fresh2 Network Evidence

on:
  push:
    branches:
      - 'work/HATE_TIMER-01-R3-NETWORK-EVIDENCE-FRESH2'
    paths:
      - '.github/workflows/hate-timer-r3-fresh2-network-evidence.yml'

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact saved deck initialization and persistence path
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          print('HTML_BYTES',len(s.encode('utf-8')))
          markers=['const state=','let state=','var state=','savedDeck:','function save(','function load(','localStorage','DEFAULT_DECK','DECK_RULE','publicDeckCard','commitDeck','deckDraft:']
          for marker in markers:
              print(f'\n===== MARKER {marker} COUNT {s.count(marker)} =====')
              start=0
              for _ in range(min(5,s.count(marker))):
                  i=s.find(marker,start)
                  if i<0: break
                  print('INDEX',i)
                  print(s[max(0,i-1800):min(len(s),i+6000)].replace('\r',''))
                  start=i+len(marker)
          PY
      - name: No mutation
        run: test -z "$(git status --porcelain --untracked-files=all)"
