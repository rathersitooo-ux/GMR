name: Roblox R5 Drive fetch probe

on:
  push:
    branches:
      - 'work/GITHUB-ROBLOX-CODE-PLACEMENT-001'
    paths:
      - '.github/workflows/roblox-r5-blob-diagnostics.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Drive raw without changing sharing
        shell: bash
        run: |
          set -u
          EXPECT_SIZE=10245508
          EXPECT_SHA=b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51
          ID=1YUO7GvwPBaVu6Umgp7IJcKrzDfjOBZ5C
          urls=(
            "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${ID}&confirm=t"
          )
          for i in 0 1; do
            rm -f /tmp/gameroad.raw
            echo "PROBE_URL_INDEX $i"
            if curl -L --fail --silent --show-error --max-time 90 "${urls[$i]}" -o /tmp/gameroad.raw; then
              size=$(stat -c%s /tmp/gameroad.raw)
              sha=$(sha256sum /tmp/gameroad.raw | awk '{print $1}')
              prefix=$(head -c 16 /tmp/gameroad.raw | od -An -tx1 | tr -d ' \n')
              echo "FETCH_RESULT index=$i size=$size sha256=$sha prefix_hex=$prefix"
              if [ "$size" = "$EXPECT_SIZE" ] && [ "$sha" = "$EXPECT_SHA" ]; then
                echo "DIRECT_DRIVE_FETCH_EXACT_MATCH"
                exit 0
              fi
            else
              echo "FETCH_FAILED index=$i"
            fi
          done
          echo "DIRECT_DRIVE_FETCH_NO_EXACT_MATCH"
          exit 1
