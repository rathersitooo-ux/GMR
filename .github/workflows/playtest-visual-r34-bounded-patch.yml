name: PLAYTEST VISUAL R34 bounded Result and update repair
# R39 retrigger 2026-08-21T15:45+09:00 after formal reacquire/readback; executor body unchanged

on:
  push:
    branches:
      - work/visual-r34-result-update-banner
    paths:
      - .github/workflows/playtest-visual-r34-bounded-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/playtest-visual-r34-bounded-patch.yml

permissions:
  contents: write

env:
  EXACT_BASE: aa77a5799da2de6bea9d28640df46e4328c2046e
  EXACT_HTML_BLOB: 477325641fa328ecd55cdc15a11a5d0ea90759f1
  EXACT_TEST_BLOB: 5386451be827ac75554f8f99c7d0d4586a5a07c2

jobs:
  patch-test-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-r34-result-update-banner
          fetch-depth: 0

      - name: Verify exact base and patch only owned Browser/Test targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_BASE"
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXACT_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXACT_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path

          html = Path('browser/GAMEROAD.html')
          data = html.read_text(encoding='utf-8-sig')

          old_css = ".result.active .resultBtns{left:3%;right:3%;bottom:2%;display:grid;grid-template-columns:1fr 1.5fr}.result.active .resultBtns .btn, .result.active .resultBtns .primary{min-width:0;min-height:52px}"
          new_css = ".result.active .resultBtns{left:3%;right:3%;bottom:2%;display:grid;grid-template-columns:1fr 1fr 1.5fr}.result.active .resultBtns .btn, .result.active .resultBtns .primary{min-width:0;min-height:52px}"
          if data.count(old_css) != 1:
              raise SystemExit(f'portrait Result action-grid anchor count={data.count(old_css)}, expected 1')
          data = data.replace(old_css, new_css, 1)

          old_update = "if(j.build_id!==BUILD_ID){R.update.pending={buildId:j.build_id,publishedAt:j.published_at||null,source:url.href};renderUpdateBanner();return true}R.update.pending=null;R.update.deferred=false;renderUpdateBanner();return false"
          new_update = "if(!R.update.currentBuildId){R.update.currentBuildId=j.build_id;R.update.pending=null;R.update.deferred=false;renderUpdateBanner();return false}if(j.build_id!==R.update.currentBuildId){R.update.pending={buildId:j.build_id,publishedAt:j.published_at||null,source:url.href};renderUpdateBanner();return true}R.update.pending=null;R.update.deferred=false;renderUpdateBanner();return false"
          if data.count(old_update) != 1:
              raise SystemExit(f'update identity anchor count={data.count(old_update)}, expected 1')
          data = data.replace(old_update, new_update, 1)
          html.write_text(data, encoding='utf-8')

          spec = Path('tests/browser-full-interaction.spec.mjs')
          s = spec.read_text(encoding='utf-8')
          old_result = """  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';\n"""
          new_result = """  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n  const ranking = result.locator('#resultRanking');\n  const rankRows = ranking.locator('.rankLine');\n  const actionLayout = await page.evaluate(() => {\n    const host = document.querySelector('#resultRanking');\n    const buttons = [...document.querySelectorAll('.screen.result .resultBtns .btn')].filter((node) => {\n      const style = getComputedStyle(node);\n      return style.display !== 'none' && style.visibility !== 'hidden';\n    });\n    const rect = (node) => { const r = node.getBoundingClientRect(); return { left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height, id:node.id || node.textContent?.trim() || '' }; };\n    const hostRect = host ? rect(host) : null;\n    const buttonRects = buttons.map(rect);\n    const hostButtonOverlaps = !hostRect ? [] : buttonRects.filter((button) => hostRect.left < button.right - 1 && hostRect.right > button.left + 1 && hostRect.top < button.bottom - 1 && hostRect.bottom > button.top + 1);\n    const rematch = buttonRects.find((button) => button.id === 'rematch');\n    const aux = buttonRects.filter((button) => button.id !== 'rematch');\n    return { hostRect, buttonRects, hostButtonOverlaps, rematchWidth:rematch?.width ?? 0, auxMaxWidth:Math.max(0, ...aux.map((button) => button.width)) };\n  });\n  expect(actionLayout.buttonRects, 'Result exposes Home, Partner Log and Rematch as visible actions').toHaveLength(3);\n  expect(actionLayout.hostRect?.height ?? 0, `Result ranking keeps at least one complete-row viewport: ${JSON.stringify(actionLayout)}`).toBeGreaterThanOrEqual(36);\n  expect(actionLayout.hostButtonOverlaps, `Result actions must not cover the ranking viewport: ${JSON.stringify(actionLayout)}`).toEqual([]);\n  expect(actionLayout.buttonRects.every((button) => button.height >= 44), `Result action touch heights remain >=44px: ${JSON.stringify(actionLayout.buttonRects)}`).toBeTruthy();\n  expect(actionLayout.rematchWidth, 'Rematch remains visually primary by width').toBeGreaterThan(actionLayout.auxMaxWidth);\n  const readableRows = [];\n  for (let i = 0; i < 4; i += 1) {\n    const row = rankRows.nth(i);\n    await row.scrollIntoViewIfNeeded();\n    const readable = await page.evaluate((index) => {\n      const host = document.querySelector('#resultRanking');\n      const row = host?.querySelectorAll('.rankLine')?.[index];\n      const buttons = [...document.querySelectorAll('.screen.result .resultBtns .btn')].filter((node) => {\n        const style = getComputedStyle(node);\n        return style.display !== 'none' && style.visibility !== 'hidden';\n      });\n      if (!host || !row) return { fullRowInsideHost:false, buttonOverlaps:['missing'] };\n      const h = host.getBoundingClientRect(), r = row.getBoundingClientRect();\n      const buttonOverlaps = buttons.filter((button) => {\n        const b = button.getBoundingClientRect();\n        return r.left < b.right - 1 && r.right > b.left + 1 && r.top < b.bottom - 1 && r.bottom > b.top + 1;\n      }).map((button) => button.id || button.textContent?.trim() || 'button');\n      return { fullRowInsideHost:r.top >= h.top - 1 && r.bottom <= h.bottom + 1 && r.top >= 0 && r.bottom <= innerHeight, buttonOverlaps, host:{top:h.top,bottom:h.bottom,height:h.height}, row:{top:r.top,bottom:r.bottom,height:r.height} };\n    }, i);\n    readableRows.push(readable);\n    expect(readable.fullRowInsideHost, `ranking row ${i + 1} must become fully readable inside the Result scroller: ${JSON.stringify(readable)}`).toBeTruthy();\n    expect(readable.buttonOverlaps, `ranking row ${i + 1} must not be covered by Result actions: ${JSON.stringify(readable)}`).toEqual([]);\n  }\n  testInfo.annotations.push({ type: 'r34-result-ranking-action-non-overlap', description: JSON.stringify({ actionLayout, readableRows }) });\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';\n"""
          if s.count(old_result) != 1:
              raise SystemExit(f'R19 Result assertion anchor count={s.count(old_result)}, expected 1')
          s = s.replace(old_result, new_result, 1)

          marker = "// PLAYTEST VISUAL R34 current-manifest baseline regression"
          if marker in s:
              raise SystemExit('R34 baseline regression marker already exists unexpectedly')
          s += r'''

// PLAYTEST VISUAL R34 current-manifest baseline regression
test('R34 first valid version manifest establishes the loaded-session baseline without blocking current controls', async ({ page }, testInfo) => {
  const runtime = observeRuntimeErrors(page);
  let manifestRequests = 0;
  const firstObservedBuild = '1111111111111111111111111111111111111111';
  await page.route('**/gameroad-version.json*', async (route) => {
    manifestRequests += 1;
    await route.fulfill({
      status: 200,
      contentType: 'application/json',
      headers: { 'cache-control': 'no-store' },
      body: JSON.stringify({ schema:'GAMEROAD_BROWSER_VERSION_V1', channel:'current', build_id:firstObservedBuild, published_at:'2026-08-21T04:00:00Z', reload_policy:'never-force-during-match' }),
    });
  });

  await bootCurrentBrowser(page);
  await expect.poll(() => manifestRequests, { message: 'startup performs the current version-manifest check' }).toBeGreaterThan(0);
  const banner = page.locator('#gameroadUpdateBanner');
  await expect(banner, 'the first valid manifest describes the release loaded for this session and must not be announced as newer').not.toHaveClass(/on/);
  const update = await page.evaluate(() => window.GAMEROAD_PARTNER_COMMENT?.snapshot?.().update ?? null);
  expect(update).not.toBeNull();
  expect(update.pending).toBeNull();

  const setup = visibleOperationGo(page, 'setup');
  await expect(setup, 'current-build update state does not block the visible Setup control').toBeVisible();
  await setup.click();
  const setupScreen = page.locator('section[data-screen="setup"]');
  await expect(setupScreen).toBeVisible();
  const honey = setupScreen.locator('[data-content="honey_hunt"]');
  await expect(honey).toBeVisible();
  await honey.click();
  await expect(banner).not.toHaveClass(/on/);
  await attachStateScreenshot(page, testInfo, 'r34-current-manifest-no-false-update-banner');
  runtime.assertClean(testInfo);
});
'''
          spec.write_text(s, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - run: npx playwright install --with-deps chromium

      - name: Run current visual/use-state regressions across all three formal viewports
        run: >-
          npx playwright test --config=playwright.full-interaction.config.mjs --workers=1
          --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home|R34 first valid version manifest establishes the loaded-session baseline without blocking current controls"
          --project=desktop-1280x720 --project=phone-390x844 --project=short-landscape-667x375

      - name: Upload same-state R34 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playtest-visual-r34-${{ github.run_id }}
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
          if-no-files-found: error
          retention-days: 14

      - name: Persist only product/test repair and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/playtest-visual-r34-bounded-patch.yml
          git diff --check
          test "$(git diff --name-only HEAD)" = $'.github/workflows/playtest-visual-r34-bounded-patch.yml\nbrowser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git commit -m "PLAYTEST VISUAL R34: clear Result actions and update banner"
          git push origin HEAD:work/visual-r34-result-update-banner
