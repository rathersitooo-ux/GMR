name: TEMP Battle Support Entry R5

on:
  push:
    branches:
      - sol/battle-support-entry-r5-20260914

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-support-entry-r5-20260914
          fetch-depth: 0
      - name: Fence exact base and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9663c1eab469f43903999699921443ad81da54ef"
          test "$(git merge-base HEAD origin/main)" = "9663c1eab469f43903999699921443ad81da54ef"
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "4047d561436345de7d0382129d35b9de00a805de"
      - name: Apply exact bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/temp-battle-support-entry-r5.py
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "486b522fbb9b77d973bbe79230a213bcad97e9e5"
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/battle-replay-live-adapter.test.mjs deploy/cloudflare/tests/build.test.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${changed[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${changed[2]}" = "tests/battle-replay-live-adapter.test.mjs"
      - name: Commit only durable product and classified tests
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/temp-battle-support-entry-r5.py
          rm -f .github/workflows/zz-temp-battle-support-entry-r5.yml
          rm -f data/preaction-authorizations/BATTLE-SUPPORT-ENTRY-R5-20260914T2041-SOL-SE14.json
          git config user.name "gameroad-bounded-writer"
          git config user.email "gameroad-bounded-writer@users.noreply.github.com"
          git add -A
          git commit -m "Battle: 履歴と山札を既存サポート入口へ統合"
          mapfile -t final < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${final[@]}"
          test "${#final[@]}" -eq 3
          test "${final[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${final[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${final[2]}" = "tests/battle-replay-live-adapter.test.mjs"
          git push origin HEAD:sol/battle-support-entry-r5-20260914
