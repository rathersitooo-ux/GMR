name: Home Codex CSS audit

on:
  push:
    branches:
      - work/BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001
    paths:
      - '.github/scripts/home-codex-css-audit.mjs'
      - '.github/workflows/home-codex-css-audit.yml'

permissions:
  contents: write

jobs:
  audit-home-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Extract current Codex Home CSS
        run: node .github/scripts/home-codex-css-audit.mjs
      - name: Commit CSS audit report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/home-codex-css-audit.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "[BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001] record current Codex Home CSS audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
