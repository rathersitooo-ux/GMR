name: Records Recent Match Live R2 Inspect

on:
  push:
    branches:
      - sol/records-recent-match-live-r2-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact inspection authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e878972e2bdb3df294a48b0aab11b0259a8a00a8)" = "e878972e2bdb3df294a48b0aab11b0259a8a00a8"
          test -f data/preaction-authorizations/RECORDS-RECENT-MATCH-LIVE-R2-20260905T2312-SOL-R5K8P2.json
          test "$(git diff --name-only e878972e2bdb3df294a48b0aab11b0259a8a00a8...HEAD | sort | tr '\n' ' ')" = ".github/workflows/records-recent-match-live-r2-inspect.yml data/preaction-authorizations/RECORDS-RECENT-MATCH-LIVE-R2-20260905T2312-SOL-R5K8P2.json "
      - name: Capture current Records/history seams
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/records-r2-inspection.txt"
          {
            echo '=== BASE ==='
            git rev-parse e878972e2bdb3df294a48b0aab11b0259a8a00a8
            echo '=== INSPECTION DIFF ==='
            git diff --name-only e878972e2bdb3df294a48b0aab11b0259a8a00a8...HEAD
            echo '=== RECORDS DOM / NAVIGATION ==='
            grep -n -C 14 -E 'Records|records|対戦履歴|履歴' browser/GAMEROAD.html | head -n 900 || true
            echo '=== HISTORY PRODUCER ==='
            grep -n -C 24 -E 'state\.history|history\.(unshift|push|slice)|history[[:space:]]*:' browser/GAMEROAD.html | head -n 1100 || true
            echo '=== END MATCH ==='
            grep -n -C 40 -E 'function[[:space:]]+endMatch|endMatch[[:space:]]*=|endMatch\(' browser/GAMEROAD.html | head -n 1400 || true
            echo '=== SAVE LOAD ==='
            grep -n -C 22 -E 'saveState|loadState|localStorage|JSON\.stringify|JSON\.parse' browser/GAMEROAD.html | head -n 1000 || true
            echo '=== DECK CANDIDATES ==='
            grep -n -C 20 -E 'selectedDeck|activeDeck|currentDeck|deckId|deckName|deck[[:space:]]*:' browser/GAMEROAD.html | head -n 1200 || true
            echo '=== PACKAGING ==='
            grep -n -C 14 -E 'browser/|copyFile|copyFileSync|source-only|sourceOnly|\.mjs' deploy/cloudflare/scripts/build.mjs | head -n 1000 || true
            echo '=== EXISTING RECORD/HISTORY FILES ==='
            find browser tests -maxdepth 2 -type f \( -iname '*record*' -o -iname '*history*' \) | sort || true
          } > "$OUT"
          wc -l "$OUT"
      - name: Upload bounded inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: records-r2-inspection
          path: ${{ runner.temp }}/records-r2-inspection.txt
          if-no-files-found: error
          retention-days: 1
