name: TEMP P5X cross-screen piece motion R1

on:
  push:
    branches:
      - sol/p5x-crossscreen-piece-motion-r1-20260910

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message != 'P5X cross-screen: add Profile and Partner piece motion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sol/p5x-crossscreen-piece-motion-r1-20260910
          fetch-depth: 0

      - name: Apply bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('browser/screen-navigation-core.mjs')
          text = core.read_text(encoding='utf-8')
          old = """export const SCREEN_MOTION_PIECE_SELECTORS = Object.freeze({
            cards: Object.freeze(['.cardsGrid > .collection', '.cardsGrid > .deckBoard']),
            characters: Object.freeze(['.charLayout > .charStage', '.charLayout > .charRoster']),
            setup: Object.freeze(['.setupHero', '.setupBox']),
            shop: Object.freeze(['.shopGrid > .shopCard']),
            gacha: Object.freeze(['.gachaLayout > .gachaStage', '.gachaLayout > .gachaControls'])
          });"""
          new = """export const SCREEN_MOTION_PIECE_SELECTORS = Object.freeze({
            cards: Object.freeze(['.cardsGrid > .collection', '.cardsGrid > .deckBoard']),
            characters: Object.freeze(['.charLayout > .charStage', '.charLayout > .charRoster']),
            partner: Object.freeze([
              '.partner-shell-runtime > .partner-shell-title',
              '.partner-shell-runtime > .partner-shell-active',
              '.partner-shell-runtime > .partner-shell-idle-readable',
              '.partner-shell-runtime > .partner-shell-menu',
              '.partner-shell-runtime > .partner-shell-roster',
              '.partner-shell-runtime > .partner-shell-detail',
              '.partner-shell-runtime > .partner-shell-formation',
              '.partner-shell-runtime > .partner-shell-strategy',
              '.partner-shell-runtime > .partner-dialogue-feedback',
              '.partner-shell-runtime > .partner-costume-shell-host',
              '.partner-shell-runtime > .partner-shell-navigation'
            ]),
            setup: Object.freeze(['.setupHero', '.setupBox']),
            profile: Object.freeze([
              '.profileStats > .profileIdentitySummary',
              '.profileStats > .profileRecordsNote',
              '.profileStats > .profileActions'
            ]),
            shop: Object.freeze(['.shopGrid > .shopCard']),
            gacha: Object.freeze(['.gachaLayout > .gachaStage', '.gachaLayout > .gachaControls'])
          });"""
          if new not in text:
              if old not in text:
                  raise SystemExit('selector block no longer matches authorized current base')
              core.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('tests/screen-navigation-core.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          marker = "P5X cross-screen source uses existing Profile and Partner piece motion"
          if marker not in tests:
              tests += """

          test('P5X cross-screen source uses existing Profile and Partner piece motion without broad Battle takeover', async () => {
            const {SCREEN_MOTION_PIECE_SELECTORS} = await import('../browser/screen-navigation-core.mjs');
            assert.deepEqual(SCREEN_MOTION_PIECE_SELECTORS.profile, [
              '.profileStats > .profileIdentitySummary',
              '.profileStats > .profileRecordsNote',
              '.profileStats > .profileActions'
            ]);
            assert.deepEqual(SCREEN_MOTION_PIECE_SELECTORS.partner, [
              '.partner-shell-runtime > .partner-shell-title',
              '.partner-shell-runtime > .partner-shell-active',
              '.partner-shell-runtime > .partner-shell-idle-readable',
              '.partner-shell-runtime > .partner-shell-menu',
              '.partner-shell-runtime > .partner-shell-roster',
              '.partner-shell-runtime > .partner-shell-detail',
              '.partner-shell-runtime > .partner-shell-formation',
              '.partner-shell-runtime > .partner-shell-strategy',
              '.partner-shell-runtime > .partner-dialogue-feedback',
              '.partner-shell-runtime > .partner-costume-shell-host',
              '.partner-shell-runtime > .partner-shell-navigation'
            ]);
            assert.equal(SCREEN_MOTION_PIECE_SELECTORS.battle, undefined);
          });
          """
              test_file.write_text(tests, encoding='utf-8')
          PY

      - name: Run existing screen-navigation tests
        run: node --test tests/screen-navigation-core.test.mjs

      - name: Commit product-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bot'
          git config user.email 'gameroad-bot@users.noreply.github.com'
          git add browser/screen-navigation-core.mjs tests/screen-navigation-core.test.mjs
          if git diff --cached --quiet; then
            echo 'No product patch required.'
            exit 0
          fi
          git commit -m 'P5X cross-screen: add Profile and Partner piece motion'
          git push origin HEAD:sol/p5x-crossscreen-piece-motion-r1-20260910
