name: TEMP Battle Recent Causal Detail R2

on:
  push:
    branches:
      - sol/battle-recent-causal-detail-r1-20260914
    paths:
      - .github/workflows/zz-temp-battle-recent-causal-detail-r2.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-recent-causal-detail-r1-20260914
          fetch-depth: 0
      - name: Apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/temp-battle-recent-causal-detail-r2.py
      - name: Run focused replay log regression
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/partner-battle-event-log-projection.test.mjs
      - name: Commit bounded product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/battle-replay-live-adapter.mjs tests/partner-battle-event-log-projection.test.mjs
          git diff --cached --check
          git commit -m "Battle: 直近公開履歴を因果順に表示"
          git push origin HEAD:sol/battle-recent-causal-detail-r1-20260914
