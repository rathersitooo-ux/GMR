name: temp battle card focus r2

on:
  push:
    branches:
      - sol/battle-card-focus-r2-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'battle card focus R2 product delta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-card-focus-r2-20260910
          fetch-depth: 0

      - name: Apply validated R1 product delta onto fresh main lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sol/battle-card-focus-r1-20260909
          git diff --binary 3176d910db54f09ae5b93821e71a05653f3be3a2..origin/sol/battle-card-focus-r1-20260909 -- \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            tests/battle-card-focus-presentation.test.mjs > /tmp/card-focus-r1.patch
          test -s /tmp/card-focus-r1.patch
          git apply --3way /tmp/card-focus-r1.patch
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'browser/battle-janken-slidepad-runtime-mount.mjs'
          test "${changed[1]}" = 'tests/battle-card-focus-presentation.test.mjs'

      - name: Focused and current runtime tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-card-focus-presentation.test.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --check

      - name: Commit product delta only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-card-focus-presentation.test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m 'battle card focus R2 product delta'
          git push origin HEAD:sol/battle-card-focus-r2-20260910
