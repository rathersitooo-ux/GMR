name: TEMP Tutorial visible conversation R3 patch

on:
  push:
    branches:
      - sol/tutorial-visible-conversation-r3-20260908
    paths:
      - .github/workflows/zz-temp-tutorial-visible-conversation-r3.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Disambiguate exact event-binding target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/zz-temp-tutorial-visible-conversation-r3.py')
          text = p.read_text(encoding='utf-8')
          old = "replace_once(partner, \"  const switchButton = root.querySelector('.partnerAdvicePartnerSwitch');\\n\", event_bind + \"  const switchButton = root.querySelector('.partnerAdvicePartnerSwitch');\\n\", 'bind Tutorial conversation choices')"
          new = "replace_once(partner, \"  const switchButton = root.querySelector('.partnerAdvicePartnerSwitch');\\n  if (switchButton && switchButton.dataset.partnerAdviceRoleBound !== 'true') {\\n\", event_bind + \"  const switchButton = root.querySelector('.partnerAdvicePartnerSwitch');\\n  if (switchButton && switchButton.dataset.partnerAdviceRoleBound !== 'true') {\\n\", 'bind Tutorial conversation choices')"
          if text.count(old) != 1:
              raise SystemExit(f'event-binding patch script target count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply exact patch
        run: python tools/zz-temp-tutorial-visible-conversation-r3.py
      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/partner-advice-runtime-mount.mjs
          node --check browser/tutorial-experience-profile-core.mjs
          node --test tests/tutorial-experience-profile-core.test.mjs
          node --test tests/partner-advice-runtime-mount.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
          grep -n "tutorial-experience-profile-core" browser/partner-advice-runtime-mount.mjs deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs
          grep -n "tutorial-experience-conversation\|tutorialChoiceId" browser/partner-advice-runtime-mount.mjs
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-tutorial-r3'
          git config user.email 'gameroad-tutorial-r3@users.noreply.github.com'
          git add browser/partner-advice-runtime-mount.mjs tests/partner-advice-runtime-mount.test.mjs deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs
          git diff --cached --quiet && { echo 'No product diff'; exit 1; }
          git commit -m 'Tutorial: mount natural Saasuna experience conversation'
          git push origin HEAD:sol/tutorial-visible-conversation-r3-20260908
