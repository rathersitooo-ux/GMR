name: zz-temp Cards gesture first-success hint R2

on:
  push:
    branches:
      - sol/cards-gesture-first-success-hint-r2-20260907

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Cards discovery patch
        run: python3 tools/zz-temp-cards-gesture-hint-r2.py
      - name: Focused regression
        run: node --test tests/cards-deck-swipe-discovery.test.mjs tests/cards-deck-presentation.test.mjs
      - name: Commit bounded product delta and remove transient controls
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-temp-cards-gesture-hint-r2.yml
          git rm tools/zz-temp-cards-gesture-hint-r2.py
          git rm data/preaction-authorizations/CARDS-GESTURE-HINT-R2-20260907T0052-SOL-N6Q4V8.json
          git add browser/cards-deck-presentation.mjs tests/cards-deck-swipe-discovery.test.mjs
          git commit -m 'feat(cards): teach swipe directions until first success'
          git push origin HEAD:sol/cards-gesture-first-success-hint-r2-20260907
