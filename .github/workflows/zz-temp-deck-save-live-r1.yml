name: TEMP Deck Save Live R1 Diagnostics

on:
  push:
    branches:
      - sol/deck-verified-save-live-r1-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Deck save use-sites without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lines = Path('browser/GAMEROAD.html').read_text(encoding='utf-8').splitlines()
          print(f'GAMEROAD.html lines={len(lines)}')
          for line_no in [1390,1391,1415,1416,1417,1506,1507,1547]:
              s = lines[line_no-1]
              print(f'=== LINE {line_no} len={len(s)} ===')
              for start in range(0, len(s), 700):
                  print(f'{line_no}:{start}-{min(start+700,len(s))}: {s[start:start+700]}')

          module = Path('browser/cards-deck-presentation.mjs').read_text(encoding='utf-8')
          print('=== CARDS PRESENTATION SAVE/DECK EXPORT CONTEXT ===')
          for i, line in enumerate(module.splitlines(), 1):
              if any(term in line.lower() for term in ['createexistingdeckauthoritybridge', 'readlivedeck', 'savedeck', 'save', 'storage']):
                  print(f'{i}: {line[:1200]}')
          PY
