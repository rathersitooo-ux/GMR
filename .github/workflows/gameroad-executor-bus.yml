name: GAMEROAD Executor Bus

on:
  pull_request:
    paths:
      - '.github/workflows/gameroad-executor-bus.yml'
      - 'tools/executor-bus-packet.mjs'
      - 'tests/executor-bus-packet.test.mjs'
      - 'tools/free-autopilot-worker.mjs'
      - 'tests/free-autopilot-worker.test.mjs'
      - 'docs/executor-bus.md'
      - 'docs/free-autopilot.md'
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: executor-bus-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  self-test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run executor bus packet tests
        run: node --test tests/executor-bus-packet.test.mjs
      - name: Run free local coder guard tests
        run: node --test tests/free-autopilot-worker.test.mjs
      - name: Verify provider-backed receipt lookups
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            if (commit.data.sha !== headSha) {
              core.setFailed(`commit readback mismatch: expected ${headSha}, got ${commit.data.sha}`);
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.data.number !== prNumber) {
              core.setFailed(`pull request readback mismatch: expected ${prNumber}, got ${pr.data.number}`);
              return;
            }

            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (Number(run.data.id) !== Number(runId)) {
              core.setFailed(`workflow run readback mismatch: expected ${runId}, got ${run.data.id}`);
              return;
            }

            let missingRejected = false;
            try {
              await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: '0000000000000000000000000000000000000000',
              });
            } catch (error) {
              if (error.status === 404 || error.status === 422) missingRejected = true;
              else throw error;
            }
            if (!missingRejected) {
              core.setFailed('provider unexpectedly accepted a known-missing commit reference');
            }

  queue-packet:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[EXECUTOR]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist event body without shell interpolation
        uses: actions/github-script@v7
        env:
          BODY_FILE: ${{ runner.temp }}/executor-queue-body.txt
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(process.env.BODY_FILE, context.payload.issue.body || '', 'utf8');
      - name: Validate and normalize queue packet
        id: queue_validate
        continue-on-error: true
        env:
          BODY_FILE: ${{ runner.temp }}/executor-queue-body.txt
          PACKET_FILE: ${{ runner.temp }}/executor-queue.json
          STATUS_FILE: ${{ runner.temp }}/executor-queue-status.json
        run: >-
          node tools/executor-bus-packet.mjs queue
          --body-file "$BODY_FILE"
          --out "$PACKET_FILE"
          --status "$STATUS_FILE"
      - name: Upload queue validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-bus-queue-status-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/executor-queue-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload accepted queue packet
        if: steps.queue_validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: executor-bus-queue-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/executor-queue.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish queue transport status
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS_FILE: ${{ runner.temp }}/executor-queue-status.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gameroad-executor-bus:queue -->';
            const status = JSON.parse(fs.readFileSync(process.env.STATUS_FILE, 'utf8'));
            const state = status.ok ? 'BUS_PACKET_ACCEPTED' : 'BUS_PACKET_REJECTED';
            const body = `${marker}\n${state}: ${status.reason}\n\nTransport acceptance only. This does not authorize mutation or prove product/game success. HEAD must still verify current authority, owner/lease, actual output, and acceptance evidence.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail rejected queue event
        if: steps.queue_validate.outcome != 'success'
        run: exit 1

  free-local-coder:
    needs: queue-packet
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[EXECUTOR]') &&
      contains(github.event.issue.body, 'FREE_LOCAL_CODER') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    env:
      BODY_FILE: ${{ runner.temp }}/executor-free-body.txt
      PACKET_FILE: ${{ runner.temp }}/executor-free-packet.json
      PROMPT_FILE: ${{ runner.temp }}/executor-free-prompt.txt
      MODEL_OUTPUT_FILE: ${{ runner.temp }}/executor-free-model-output.txt
      DIFF_FILE: ${{ runner.temp }}/executor-free-candidate.diff
      MODEL_FILE: ${{ runner.temp }}/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      LLAMA_ARCHIVE: ${{ runner.temp }}/llama-b10951-bin-ubuntu-x64.tar.gz
      LLAMA_DIR: ${{ runner.temp }}/llama-b10951
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/38f6bab61d341b23a6c00226f32c0d6148bf9f43/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true
      MODEL_SHA256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10951/llama-b10951-bin-ubuntu-x64.tar.gz
      LLAMA_SHA256: cb0e453d8d88b62a8962c5b13e46c117315f7740017f2636bcf0de20c6253f7a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist owner-authored queue body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(process.env.BODY_FILE, context.payload.issue.body || '', 'utf8');
      - name: Validate bounded FREE_LOCAL_CODER packet
        id: free_prepare
        run: >-
          node tools/free-autopilot-worker.mjs prepare
          --body-file "$BODY_FILE"
          --packet-out "$PACKET_FILE"
          --prompt-out "$PROMPT_FILE"
      - name: Verify packet base is the current default branch head
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repo.data.default_branch,
            });
            if (branch.data.commit.sha !== packet.baseRef) {
              core.setFailed(`FREE_AUTOPILOT_BASE_MOVED expected=${packet.baseRef} actual=${branch.data.commit.sha}`);
            }
      - name: Rebuild prompt from exact packet base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.PACKET_FILE,'utf8'));process.stdout.write(p.baseRef)")"
          git checkout --detach "$BASE_SHA"
          node tools/free-autopilot-worker.mjs prepare \
            --body-file "$BODY_FILE" \
            --packet-out "$PACKET_FILE" \
            --prompt-out "$PROMPT_FILE"
      - name: Download and verify pinned zero-cash inference runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$LLAMA_URL" -o "$LLAMA_ARCHIVE"
          echo "$LLAMA_SHA256  $LLAMA_ARCHIVE" | sha256sum -c -
          mkdir -p "$LLAMA_DIR"
          tar -xzf "$LLAMA_ARCHIVE" -C "$LLAMA_DIR"
          LLAMA_CLI="$(find "$LLAMA_DIR" -type f -name llama-cli -print -quit)"
          test -n "$LLAMA_CLI"
          chmod +x "$LLAMA_CLI"
          printf '%s\n' "$LLAMA_CLI" > "$RUNNER_TEMP/llama-cli-path.txt"
      - name: Download and verify pinned Qwen coder model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL_FILE"
          echo "$MODEL_SHA256  $MODEL_FILE" | sha256sum -c -
      - name: Run local CPU inference with no paid fallback
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_CLI="$(cat "$RUNNER_TEMP/llama-cli-path.txt")"
          export LD_LIBRARY_PATH="$(dirname "$LLAMA_CLI"):${LD_LIBRARY_PATH:-}"
          timeout 720 "$LLAMA_CLI" \
            -m "$MODEL_FILE" \
            -f "$PROMPT_FILE" \
            -n 2048 \
            -c 8192 \
            -t 4 \
            --temp 0.1 \
            --seed 42 \
            > "$MODEL_OUTPUT_FILE"
      - name: Validate and apply model candidate diff
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-autopilot-worker.mjs validate \
            --packet-file "$PACKET_FILE" \
            --model-output-file "$MODEL_OUTPUT_FILE" \
            --diff-out "$DIFF_FILE"
          git apply --check "$DIFF_FILE"
          git apply "$DIFF_FILE"
      - name: Run every focused test declared mutable by the packet
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
          const tests = packet.exactMutableResources.filter((p) => p.startsWith('tests/') && p.endsWith('.test.mjs'));
          if (!tests.length) process.exit(2);
          for (const testPath of tests) {
            if (!fs.existsSync(testPath)) {
              console.error(`focused test missing after patch: ${testPath}`);
              process.exit(1);
            }
            const run = spawnSync(process.execPath, ['--test', testPath], { stdio: 'inherit' });
            if (run.status !== 0) process.exit(run.status ?? 1);
          }
          NODE
      - name: Fail closed if main advanced during inference
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.PACKET_FILE,'utf8'));process.stdout.write(p.baseRef)")"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "$DEFAULT_BRANCH"
          ACTUAL_SHA="$(git rev-parse FETCH_HEAD)"
          test "$BASE_SHA" = "$ACTUAL_SHA" || { echo "FREE_AUTOPILOT_BASE_MOVED expected=$BASE_SHA actual=$ACTUAL_SHA"; exit 1; }
      - name: Commit and push bounded candidate branch
        id: candidate_publish
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BRANCH="work/free-auto-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
          const allowed = new Set(packet.exactMutableResources);
          const changed = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          if (!changed.length) throw new Error('candidate_has_no_staged_paths');
          for (const path of changed) {
            if (!allowed.has(path)) throw new Error(`staged_path_out_of_scope:${path}`);
          }
          NODE
          git config user.name "gameroad-free-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK_UNIT="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.PACKET_FILE,'utf8'));process.stdout.write(p.workUnitKey)")"
          git commit -m "Free autopilot candidate: $WORK_UNIT"
          git push origin "HEAD:$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open draft candidate PR
        id: candidate_pr
        uses: actions/github-script@v7
        env:
          PACKET_FILE: ${{ env.PACKET_FILE }}
          CANDIDATE_BRANCH: ${{ steps.candidate_publish.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate_publish.outputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[FREE AUTO] ${packet.workUnitKey}`,
              head: process.env.CANDIDATE_BRANCH,
              base: context.payload.repository.default_branch,
              draft: true,
              body: [
                'Zero-cash FREE_LOCAL_CODER candidate generated by the existing GAMEROAD Executor Bus.',
                '',
                `Task: ${packet.taskId}`,
                `WorkUnit: ${packet.workUnitKey}`,
                `AcquireKey: ${packet.acquireKey}`,
                `Packet base: ${packet.baseRef}`,
                `Candidate commit: ${process.env.CANDIDATE_SHA}`,
                '',
                'Focused packet tests passed before push. This draft is not a product/game success claim and must not be merged without fresh CURRENT adoption.',
                'This PR is created with GITHUB_TOKEN; recursive pull_request workflow dispatch is intentionally not relied on.',
              ].join('\n'),
            });
            core.setOutput('number', String(pr.data.number));
            core.setOutput('url', pr.data.html_url);
      - name: Return candidate to the originating Executor issue
        if: success()
        uses: actions/github-script@v7
        env:
          PACKET_FILE: ${{ env.PACKET_FILE }}
          CANDIDATE_SHA: ${{ steps.candidate_publish.outputs.commit_sha }}
          PR_NUMBER: ${{ steps.candidate_pr.outputs.number }}
          PR_URL: ${{ steps.candidate_pr.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
            const result = {
              schemaVersion: 'gameroad-executor-bus-v1',
              kind: 'result',
              taskId: packet.taskId,
              workUnitKey: packet.workUnitKey,
              acquireKey: packet.acquireKey,
              status: 'RETURNED',
              evidence: [`focused-tests:PASS`, `workflow-run:${context.runId}`],
              unresolved: ['Fresh CURRENT authority/adoption is still required before merge or success claim.'],
              producedRefs: [`commit:${process.env.CANDIDATE_SHA}`, `pr:${process.env.PR_NUMBER}`, `workflow-run:${context.runId}`],
              nextAction: 'HEAD fresh CURRENT adoption and exact provider readback',
            };
            const body = `<!-- gameroad-free-autopilot:origin-run -->\nFREE_AUTOPILOT_CANDIDATE_RETURNED\n\n\`\`\`executor-result\n${JSON.stringify(result, null, 2)}\n\`\`\`\n\nDraft PR: ${process.env.PR_URL}\nThe origin run validated the bounded patch and focused tests. Recursive workflow dispatch from GITHUB_TOKEN is not treated as evidence.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Persist fail-closed worker result
        if: failure() && steps.free_prepare.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PACKET_FILE: ${{ env.PACKET_FILE }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.PACKET_FILE)) return;
            const packet = JSON.parse(fs.readFileSync(process.env.PACKET_FILE, 'utf8'));
            const result = {
              schemaVersion: 'gameroad-executor-bus-v1',
              kind: 'result',
              taskId: packet.taskId,
              workUnitKey: packet.workUnitKey,
              acquireKey: packet.acquireKey,
              status: 'FAILED',
              evidence: [`workflow-run:${context.runId}`],
              unresolved: ['Free local candidate did not reach tested draft-PR return. No paid fallback was attempted.'],
              producedRefs: [`workflow-run:${context.runId}`],
              nextAction: 'Inspect the origin workflow run and requeue only after the blocking condition is resolved.',
            };
            const body = `<!-- gameroad-free-autopilot:origin-run-failed -->\nFREE_AUTOPILOT_FAILED_CLOSED\n\n\`\`\`executor-result\n${JSON.stringify(result, null, 2)}\n\`\`\`\n\nNo paid fallback was attempted.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  result-packet:
    if: github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[EXECUTOR]') && contains(github.event.comment.body, '```executor-result')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist queue and result bodies without shell interpolation
        uses: actions/github-script@v7
        env:
          QUEUE_BODY_FILE: ${{ runner.temp }}/executor-queue-body.txt
          RESULT_BODY_FILE: ${{ runner.temp }}/executor-result-body.txt
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(process.env.QUEUE_BODY_FILE, context.payload.issue.body || '', 'utf8');
            fs.writeFileSync(process.env.RESULT_BODY_FILE, context.payload.comment.body || '', 'utf8');
      - name: Validate result against queue identity
        id: result_validate
        continue-on-error: true
        env:
          QUEUE_BODY_FILE: ${{ runner.temp }}/executor-queue-body.txt
          RESULT_BODY_FILE: ${{ runner.temp }}/executor-result-body.txt
          RESULT_FILE: ${{ runner.temp }}/executor-result.json
          STATUS_FILE: ${{ runner.temp }}/executor-result-status.json
        run: >-
          node tools/executor-bus-packet.mjs result
          --queue-body-file "$QUEUE_BODY_FILE"
          --result-body-file "$RESULT_BODY_FILE"
          --out "$RESULT_FILE"
          --status "$STATUS_FILE"
      - name: Verify returned references against provider state
        id: result_verify
        if: steps.result_validate.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/executor-result.json
          VERIFICATION_FILE: ${{ runner.temp }}/executor-result-verification.json
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
            const refs = Array.isArray(result.producedRefs) ? result.producedRefs : [];
            const verifiedRefs = [];
            const pendingExternalRefs = [];
            const invalidRefs = [];
            const lookupErrors = [];

            async function verifyRef(ref) {
              let match = ref.match(/^commit:([0-9a-fA-F]{40})$/);
              if (match) {
                try {
                  const response = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: match[1] });
                  verifiedRefs.push({ ref, kind: 'commit', actual: { sha: response.data.sha, url: response.data.html_url } });
                } catch (error) {
                  if (error.status === 404 || error.status === 422) invalidRefs.push(ref);
                  else lookupErrors.push({ ref, status: error.status || null, message: error.message });
                }
                return;
              }
              if (ref.startsWith('commit:')) { invalidRefs.push(ref); return; }

              match = ref.match(/^pr:([1-9][0-9]*)$/);
              if (match) {
                try {
                  const response = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(match[1]) });
                  verifiedRefs.push({ ref, kind: 'pull_request', actual: { number: response.data.number, state: response.data.state, merged: Boolean(response.data.merged), headSha: response.data.head.sha, baseSha: response.data.base.sha, url: response.data.html_url } });
                } catch (error) {
                  if (error.status === 404 || error.status === 422) invalidRefs.push(ref);
                  else lookupErrors.push({ ref, status: error.status || null, message: error.message });
                }
                return;
              }
              if (ref.startsWith('pr:')) { invalidRefs.push(ref); return; }

              match = ref.match(/^workflow-run:([1-9][0-9]*)$/);
              if (match) {
                try {
                  const response = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: Number(match[1]) });
                  verifiedRefs.push({ ref, kind: 'workflow_run', actual: { id: response.data.id, status: response.data.status, conclusion: response.data.conclusion, headSha: response.data.head_sha, url: response.data.html_url } });
                } catch (error) {
                  if (error.status === 404 || error.status === 422) invalidRefs.push(ref);
                  else lookupErrors.push({ ref, status: error.status || null, message: error.message });
                }
                return;
              }
              if (ref.startsWith('workflow-run:')) { invalidRefs.push(ref); return; }
              pendingExternalRefs.push(ref);
            }

            for (const ref of refs) await verifyRef(ref);

            let verificationStatus = 'NO_PROVIDER_REF_PRESENT';
            if (lookupErrors.length) verificationStatus = 'PROVIDER_LOOKUP_ERROR';
            else if (invalidRefs.length) verificationStatus = 'INVALID_PROVIDER_REF';
            else if (verifiedRefs.length && pendingExternalRefs.length) verificationStatus = 'PARTIALLY_VERIFIED';
            else if (verifiedRefs.length) verificationStatus = 'VERIFIED_PROVIDER_REFS';
            else if (pendingExternalRefs.length) verificationStatus = 'ACTUAL_RESULT_UNVERIFIED_EXTERNAL';

            const providerCheckOk = invalidRefs.length === 0 && lookupErrors.length === 0;
            const receipt = {
              schemaVersion: 'gameroad-executor-result-verification-v1',
              resultStatus: result.status,
              providerCheckOk,
              verificationStatus,
              verifiedRefs,
              pendingExternalRefs,
              invalidRefs,
              lookupErrors,
              note: 'Provider verification proves only the existence/current provider state of supported references. It does not by itself prove product or game success.',
            };
            fs.writeFileSync(process.env.VERIFICATION_FILE, JSON.stringify(receipt, null, 2) + '\n', 'utf8');
            core.setOutput('verification_status', verificationStatus);
            core.setOutput('provider_check_ok', providerCheckOk ? 'true' : 'false');
            if (!providerCheckOk) core.setFailed(`returned reference verification failed: ${verificationStatus}`);
      - name: Upload result validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-bus-result-status-${{ github.event.issue.number }}-${{ github.event.comment.id }}
          path: ${{ runner.temp }}/executor-result-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload result packet and provider verification
        if: steps.result_validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: executor-bus-result-${{ github.event.issue.number }}-${{ github.event.comment.id }}
          path: |
            ${{ runner.temp }}/executor-result.json
            ${{ runner.temp }}/executor-result-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish result transport status
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS_FILE: ${{ runner.temp }}/executor-result-status.json
          VERIFICATION_FILE: ${{ runner.temp }}/executor-result-verification.json
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync(process.env.STATUS_FILE, 'utf8'));
            let verification = null;
            if (fs.existsSync(process.env.VERIFICATION_FILE)) verification = JSON.parse(fs.readFileSync(process.env.VERIFICATION_FILE, 'utf8'));
            const providerCheckOk = !verification || verification.providerCheckOk === true;
            const state = status.ok && providerCheckOk ? 'BUS_RESULT_ACCEPTED' : 'BUS_RESULT_REJECTED';
            const verificationStatus = verification ? verification.verificationStatus : 'NOT_RUN';
            const marker = `<!-- gameroad-executor-bus:result:${context.payload.comment.id} -->`;
            const body = `${marker}\n${state}: ${status.reason}\nACTUAL_REFERENCE_VERIFICATION: ${verificationStatus}\n\nTransport acceptance is separate from actual-result verification. Supported GitHub references are provider-read above; external-only references remain unverified until HEAD performs a fresh external read. Neither state alone proves product/game success.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Fail rejected result event
        if: steps.result_validate.outcome != 'success' || steps.result_verify.outcome == 'failure'
        run: exit 1
