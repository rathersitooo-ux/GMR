name: Reference Clip Capture R2 Browser Recording

on:
  push:
    branches:
      - research/refclip-capture-20260827-r1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser recorder
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Record public embedded playback
        shell: bash
        run: |
          mkdir -p captured screenshots metadata
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const refs = [
            ['A0','MakeS_PV','4Bw5i-7WmqQ'],
            ['A0','MakeS_short','cjgf0l0vw_E'],
            ['A2','AzurLane_Home','6kG8ZoN_-_Q'],
            ['A1','LoveAndDeepspace_Home','bpxF_JKdOgE'],
          ];
          const browser = await chromium.launch({headless:true, args:['--autoplay-policy=no-user-gesture-required']});
          const log = [];
          for (const [role,label,id] of refs) {
            const context = await browser.newContext({
              viewport:{width:1280,height:720},
              recordVideo:{dir:'captured_tmp', size:{width:1280,height:720}},
              locale:'en-US',
            });
            const page = await context.newPage();
            const url = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=1&rel=0&playsinline=1`;
            let status = null;
            let error = null;
            try {
              const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              status = response?.status() ?? null;
              await page.waitForTimeout(3500);
              await page.mouse.click(640,360).catch(()=>{});
              await page.keyboard.press('Space').catch(()=>{});
              await page.waitForTimeout(4500);
              await page.screenshot({path:`screenshots/${label}_08s.png`});
              await page.waitForTimeout(8000);
              await page.screenshot({path:`screenshots/${label}_16s.png`});
            } catch (e) {
              error = String(e);
              await page.screenshot({path:`screenshots/${label}_error.png`}).catch(()=>{});
            }
            const bodyText = await page.locator('body').innerText().catch(()=> '');
            const video = page.video();
            await page.close().catch(()=>{});
            await context.close();
            let videoPath = null;
            if (video) {
              try {
                videoPath = await video.path();
                if (videoPath && fs.existsSync(videoPath)) {
                  const dest = path.resolve(`captured/${label}.webm`);
                  fs.renameSync(videoPath,dest);
                  videoPath = dest;
                }
              } catch (e) { error = `${error ?? ''} video:${e}`; }
            }
            log.push({role,label,id,url,http_status:status,error,body_text:bodyText.slice(0,1000),video_path:videoPath});
          }
          await browser.close();
          fs.writeFileSync('metadata/capture.json',JSON.stringify(log,null,2));
          EOF
          node capture.mjs
          find captured screenshots metadata -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort | tee metadata/files.txt

      - name: Validate recordings contain temporal change
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, glob, os
          out=[]
          for f in sorted(glob.glob('captured/*.webm')):
              p=subprocess.run(['python','-c','pass'])
              out.append({'file':f,'bytes':os.path.getsize(f)})
          open('metadata/recordings.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Upload browser recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameroad-reference-screen-recordings-r2
          path: |
            captured/
            screenshots/
            metadata/
          if-no-files-found: error
          retention-days: 3
