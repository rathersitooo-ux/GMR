name: TEMP UI Feedback R9 Wrapper Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: ui-feedback-r9-wrapper-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: work/ui-feedback-r9-readyplan-production-20260819
      HTML: browser/GAMEROAD.html
      EXPECTED_BRANCH_HTML: aaa0dc7f34ddcf47dae015a25d8cebb6bb3e92f5
      EXPECTED_MAIN_HTML: f5c42b4ceb1d89b4aee9ad2adc17fa524d90ef66
      WORKFLOW: .github/workflows/_tmp-ui-feedback-r9-diagnose.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Fail closed on current HTML ownership drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          branch_blob="$(git hash-object "$HTML")"
          main_blob="$(git rev-parse origin/main:"$HTML")"
          test "$branch_blob" = "$EXPECTED_BRANCH_HTML"
          test "$main_blob" = "$EXPECTED_MAIN_HTML"
      - name: Repair dynamic delegation through existing wrappers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'browser/GAMEROAD.html';
          let s = fs.readFileSync(path, 'utf8');
          const stale = 'globalThis.GAMEROAD_READY_PLAN_COMMIT=commitPlans;';
          const fixed = 'globalThis.GAMEROAD_READY_PLAN_COMMIT=(...args)=>commitPlans(...args);';
          const count = s.split(stale).length - 1;
          if (count !== 1) throw new Error(`expected exactly one stale delegate, got ${count}`);
          if ((s.split(fixed).length - 1) !== 0) throw new Error('fixed delegate already present');
          const first10Wrapper = 'const __grFirst10CommitPlans=commitPlans;\ncommitPlans=async function(){';
          const contextWrapper = 'const __ctxBaseCommitPlans=commitPlans;commitPlans=async function(){';
          if (!s.includes(first10Wrapper)) throw new Error('FIRST10 commit wrapper missing');
          if (!s.includes(contextWrapper)) throw new Error('context commit wrapper missing');
          s = s.replace(stale, fixed);
          if ((s.split(fixed).length - 1) !== 1) throw new Error('dynamic delegate postcondition failed');
          fs.writeFileSync(path, s);
          NODE
          node tests/browser-static-check.mjs --self-test "$HTML"
      - name: Persist repaired HTML-only product delta
        shell: bash
        run: |
          set -euo pipefail
          rm "$WORKFLOW"
          base="$(git merge-base HEAD origin/main)"
          mapfile -t changed < <(git diff --name-only "$base")
          printf 'Final changed paths:\n%s\n' "${changed[*]}"
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$HTML" ]]; then
            echo 'Final diff escaped HTML-only scope'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'UI-FEEDBACK R9: preserve existing ready-plan wrapper chain'
          git push origin "HEAD:$BRANCH"
