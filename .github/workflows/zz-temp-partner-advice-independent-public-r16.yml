name: TEMP Advice Partner independent public acceptance R16

on:
  push:
    branches:
      - sol/partner-advice-independent-public-r16-20260912

permissions:
  contents: read

jobs:
  trace-current-save:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Trace selectedPartnerId and existing save/load seams
        shell: bash
        run: |
          set -euo pipefail
          echo '=== selectedPartnerId occurrences ==='
          grep -n -C 10 'selectedPartnerId' browser/GAMEROAD.html | head -n 260 || true
          echo '=== characterSelectionRole occurrences ==='
          grep -n -C 8 'characterSelectionRole' browser/GAMEROAD.html | head -n 180 || true
          echo '=== core localStorage seams ==='
          grep -n -C 12 -E 'gameroad\.browser\.v10\.core\.1|localStorage\.(setItem|getItem)|function save\b|const save\b|save\(\)' browser/GAMEROAD.html | head -n 360 || true
          echo '=== partner/advice save-related modules ==='
          git grep -n -E 'selectedPartnerId|advicePartnerId|cycleAdvicePartner|save\(' -- browser '*.mjs' ':!browser/GAMEROAD.html' | head -n 260 || true
