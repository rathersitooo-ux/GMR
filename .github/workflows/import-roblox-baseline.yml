name: Diagnose Roblox transport partial XZ output

on:
  push:
    branches:
      - work/GITHUB-ROBLOX-CODE-PLACEMENT-001
    paths:
      - .github/workflows/import-roblox-baseline.yml

permissions:
  contents: read

jobs:
  diagnose-xz-output:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Measure partial XZ output against exact Drive identity
        shell: bash
        env:
          EXPECTED_SIZE: "10245508"
          EXPECTED_SHA256: b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/GITHUB-ROBLOX-CODE-PLACEMENT-001"
          python - <<'PY'
          from pathlib import Path
          import base64
          cat = b"".join(b"".join(Path(f".github/import/roblox-baseline.part{i:03d}.b64").read_bytes().split()) for i in range(10))
          usable = cat[: (len(cat) // 4) * 4]
          Path("/tmp/roblox-prefix.xz").write_bytes(base64.b64decode(usable, validate=True))
          print(f"transport_len={len(cat)} usable_base64_len={len(usable)} dropped_tail={cat[len(usable):]!r}")
          PY

          set +e
          xz --decompress --stdout /tmp/roblox-prefix.xz > /tmp/GAMEROAD.partial.rbxlx 2>/tmp/xz.err
          xz_rc=$?
          set -e
          cat /tmp/xz.err || true
          raw_size="$(wc -c < /tmp/GAMEROAD.partial.rbxlx | tr -d ' ')"
          raw_sha="$(sha256sum /tmp/GAMEROAD.partial.rbxlx | awk '{print $1}')"
          echo "xz_rc=$xz_rc raw_size=$raw_size raw_sha256=$raw_sha"
          if [ "$raw_size" = "$EXPECTED_SIZE" ] && [ "$raw_sha" = "$EXPECTED_SHA256" ]; then
            echo "RAW_PAYLOAD_EXACT_MATCH_DESPITE_TRUNCATED_XZ_TAIL"
            exit 0
          fi
          echo "RAW_PAYLOAD_NOT_EXACT" >&2
          exit 44
