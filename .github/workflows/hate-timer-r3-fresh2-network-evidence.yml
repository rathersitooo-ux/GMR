name: HATE Timer R3 Fresh2 Network Evidence

on:
  push:
    branches:
      - 'work/HATE_TIMER-01-R3-NETWORK-EVIDENCE-FRESH2'
    paths:
      - '.github/workflows/hate-timer-r3-fresh2-network-evidence.yml'

permissions:
  contents: read

jobs:
  actual-ws-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Exact production identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          echo "HTML_BYTES=$(wc -c < browser/GAMEROAD.html)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install diagnostic runtime only
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0 ws@8.18.3
          npx playwright install --with-deps chromium

      - name: Actual WebSocket disconnect evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hate-r3-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          cat >.hate-r3-actual-ws.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { WebSocketServer, WebSocket } from 'ws';
          import { writeFile } from 'node:fs/promises';

          const WIRE='gameroad.wsrelay.v1';
          const rooms=new Map();
          const relayEvents=[];
          const wss=new WebSocketServer({port:8765,path:'/ws'});
          wss.on('connection',(socket,req)=>{
            const u=new URL(req.url,'ws://127.0.0.1:8765');
            const meta={socket,channel:u.searchParams.get('channel')||'',role:u.searchParams.get('role')||'',clientId:u.searchParams.get('clientId')||''};
            if(!rooms.has(meta.channel))rooms.set(meta.channel,new Set());
            rooms.get(meta.channel).add(meta);
            relayEvents.push({event:'open',channel:meta.channel,role:meta.role,clientId:meta.clientId,at:Date.now()});
            socket.on('message',buf=>{
              let frame;try{frame=JSON.parse(String(buf))}catch{return}
              if(frame?.wire!==WIRE||frame?.op!=='data')return;
              relayEvents.push({event:'data',channel:meta.channel,role:meta.role,type:String(frame.payload?.type||''),seq:Number(frame.payload?.seq)||0,at:Date.now()});
              for(const peer of rooms.get(meta.channel)||[]){
                if(peer===meta||peer.socket.readyState!==WebSocket.OPEN)continue;
                peer.socket.send(JSON.stringify(frame));
              }
            });
            socket.on('close',()=>{
              rooms.get(meta.channel)?.delete(meta);
              relayEvents.push({event:'close',channel:meta.channel,role:meta.role,clientId:meta.clientId,at:Date.now()});
            });
          });
          await new Promise(r=>wss.once('listening',r));

          const browser=await chromium.launch({headless:true});
          const hostContext=await browser.newContext();
          const guestContext=await browser.newContext();
          const host=await hostContext.newPage();
          const guest=await guestContext.newPage();
          const relay='ws://127.0.0.1:8765/ws';
          const app='http://127.0.0.1:4173/browser/GAMEROAD.html?grrelay=ws&grws='+encodeURIComponent(relay);
          const status=p=>p.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.status());
          const wait=async(fn,label,ms=7000)=>{
            const start=Date.now();let last;
            while(Date.now()-start<ms){last=await fn();if(last)return last;await new Promise(r=>setTimeout(r,80));}
            throw new Error('timeout:'+label+':'+JSON.stringify(last));
          };
          const installLegalDeck=page=>page.evaluate(()=>{
            const T=window.__GAMEROAD_TEST__;
            const publicMain=new Set(T.deckPublic().filter(x=>x.slot==='main').map(x=>x.id));
            const cards=window.__CARD_DATA__.filter(c=>publicMain.has(c.id));
            const cname=c=>String(c.canonical_name||c.base_card_name||c.display_name||c.id);
            const seen=new Set(),chosen=[];
            const add=c=>{
              if(!c||seen.has(cname(c)))return false;
              const r=String(c.rank||'');
              if(['J','Q','K'].includes(r)&&chosen.some(x=>String(x.rank||'')===r))return false;
              seen.add(cname(c));chosen.push(c);return true;
            };
            for(let v=1;v<=7;v++){
              const c=cards.find(x=>String(x.ability_type||'')==='Vanilla'&&Number(x.power)===v&&!seen.has(cname(x)));
              if(!add(c))throw new Error('missing-trump-'+v);
            }
            for(const r of ['J','Q','K']){
              const c=cards.find(x=>String(x.rank||'')===r&&!seen.has(cname(x)));
              if(!add(c))throw new Error('missing-royal-'+r);
            }
            for(const c of cards){
              if(chosen.length>=40)break;
              if(['J','Q','K'].includes(String(c.rank||'')))continue;
              add(c);
            }
            if(chosen.length!==40)throw new Error('unable-to-build-40:'+chosen.length);
            const ids=chosen.map(c=>c.id);
            const draft=T.deckSetDraft(ids,[]);
            if(!draft.ok)throw new Error('draft-invalid:'+JSON.stringify(draft.errors));
            if(!T.deckCommit())throw new Error('deck-commit-failed');
            const saved=T.deckSaved(),valid=T.deckValidate(saved,{forBattle:true});
            if(!valid.ok)throw new Error('saved-invalid:'+JSON.stringify(valid.errors));
            return{main:saved.main.length,ex:saved.ex.length,stats:valid.stats,rule:T.deckRule()};
          });

          await host.goto(app,{waitUntil:'domcontentloaded'});
          await guest.goto(app,{waitUntil:'domcontentloaded'});
          console.log('HOST_DECK',JSON.stringify(await installLegalDeck(host)));
          console.log('GUEST_DECK',JSON.stringify(await installLegalDeck(guest)));

          const code=await host.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.create(2));
          await guest.evaluate(c=>window.GAMEROAD_FRIEND_ROOM_R2.join(c),code);
          await wait(async()=>{const s=await status(guest);return s.pid==='P2'&&s.roomState==='lobby'?s:false},'guest-accepted');
          await wait(async()=>{const s=await status(host);return s.participants?.find(x=>x.pid==='P2')?.connected?s:false},'guest-connected');
          if(!(await guest.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.ready())))throw new Error('guest-ready-false');
          await wait(async()=>{const s=await status(host);return s.participants?.find(x=>x.pid==='P2')?.ready?s:false},'guest-ready-reflected');
          if(!(await host.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.ready())))throw new Error('host-ready-false');
          await wait(async()=>{const s=await status(host);return s.ready&&s.participants?.find(x=>x.pid==='P2')?.ready?s:false},'all-ready');
          const started=await host.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.start());
          console.log('HOST_START_RESULT',started);
          if(!started)throw new Error('host-start-failed-with-valid-deck');
          await wait(async()=>{const s=await status(guest);return s.roomState==='playing'?s:false},'guest-playing');

          const setup=await host.evaluate(()=>{
            const api=window.GAMEROAD_FRIEND_ROOM_R2;
            const hands=api.qaSetNoEffectHands();
            const opts=s=>[...s.options].map(o=>o.value);
            const all=[...document.querySelectorAll('select')];
            const candidates=all.filter(s=>hands.P1.some(id=>opts(s).includes(id)));
            let road=candidates.find(s=>/road|ロード/i.test([s.id,s.name,s.getAttribute('aria-label')||''].join(' ')))||candidates[0];
            let battle=candidates.find(s=>s!==road&&/battle|バトル/i.test([s.id,s.name,s.getAttribute('aria-label')||''].join(' ')))||candidates.find(s=>s!==road);
            if(!road||!battle)return{ok:false,reason:'card-selects-not-found',hands,candidates:candidates.map(s=>({id:s.id,name:s.name,values:opts(s)}))};
            road.value=hands.P1[0];road.dispatchEvent(new Event('change',{bubbles:true}));
            battle.value=hands.P1[1];battle.dispatchEvent(new Event('change',{bubbles:true}));
            return{ok:true,hands,road:road.id,battle:battle.id,plans:api.qaPlans()};
          });
          console.log('PLAN_SETUP',JSON.stringify(setup));
          if(!setup.ok)throw new Error(setup.reason);
          const submitted=await host.evaluate(()=>window.GAMEROAD_FRIEND_ROOM_R2.submitPlan());
          console.log('HOST_PLAN_SUBMITTED',submitted);
          if(!submitted)throw new Error('host-plan-submit-failed');

          const waiting=await wait(async()=>{
            const s=await status(host),v=s.hateAuthority?.values?.P2;
            return String(v?.signature||'').startsWith('plan:')?s:false;
          },'p2-wait-signature');
          console.log('WAITING_STATE',JSON.stringify({p1:waiting.hateAuthority?.values?.P1,p2:waiting.hateAuthority?.values?.P2,participants:waiting.participants}));
          const connectedTick=await wait(async()=>{
            const s=await status(host),h=Number(s.hateAuthority?.values?.P2?.hateTime)||0;
            return h>=1?{s,h}:false;
          },'p2-connected-hate',4500);
          const beforeDrop=connectedTick.h;
          const before=await status(host);
          console.log('BEFORE_DROP',JSON.stringify({hate:beforeDrop,p2:before.participants?.find(x=>x.pid==='P2'),sig:before.hateAuthority?.values?.P2?.signature}));

          const channel='gameroad.friend.r2.'+code;
          const guestMeta=[...(rooms.get(channel)||[])].find(x=>x.role==='guest');
          if(!guestMeta)throw new Error('guest-ws-not-found');
          guestMeta.socket.terminate();
          await wait(async()=>relayEvents.some(e=>e.event==='close'&&e.channel===channel&&e.role==='guest'),'relay-close');
          await new Promise(r=>setTimeout(r,1450));
          const during=await status(host);
          const dropHate=Number(during.hateAuthority?.values?.P2?.hateTime)||0;
          const disconnectedRecorded=during.participants?.find(x=>x.pid==='P2')?.connected===false;
          const gapAccrual=dropHate-beforeDrop;
          console.log('DURING_DROP',JSON.stringify({beforeDrop,dropHate,gapAccrual,disconnectedRecorded,p2:during.participants?.find(x=>x.pid==='P2'),sig:during.hateAuthority?.values?.P2?.signature}));

          const result={semanticPass:disconnectedRecorded&&gapAccrual===0,disconnectedRecorded,gapAccrual,beforeDrop,dropHate,publicWssVerified:false,testRelayOnly:true,actualWebSocketFrames:true,productionHtmlMutated:false,htmlBlob:'3a8d34bfadf263e0980a4b1c9ec78f75fea07646'};
          console.log('HATE_R3_ACTUAL_WS_RESULT',JSON.stringify(result));
          console.log('RELAY_EVENTS',JSON.stringify(relayEvents));
          await writeFile('/tmp/hate-r3-result.json',JSON.stringify(result));
          await browser.close();
          await new Promise(r=>wss.close(r));
          JS
          node .hate-r3-actual-ws.mjs | tee /tmp/hate-r3-actual-ws.log
          rm -f .hate-r3-actual-ws.mjs

      - name: Production mutation guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules .hate-r3-actual-ws.mjs
          echo "FINAL_HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Assert disconnect-gap semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/hate-r3-result.json
          cat /tmp/hate-r3-result.json
          node -e "const r=require('/tmp/hate-r3-result.json');if(!r.semanticPass){console.error('SEMANTIC_FAIL: unexpected WS disconnect must be recorded disconnected and accrue zero HATE');process.exit(1)}"
