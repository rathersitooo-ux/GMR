name: temp postmatch autoqueue mobile truthful status R10B
on:
  push:
    branches:
      - sol/postmatch-autoqueue-mobile-status-r10b-20260905
    paths:
      - .github/workflows/postmatch-autoqueue-mobile-r10b-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/postmatch-autoqueue-mobile-status-r10b-20260905
          fetch-depth: 0
      - name: Restore visible mobile autoqueue truth and acceptance
        shell: python
        run: |
          from pathlib import Path

          p = Path('browser/GAMEROAD.html')
          s = p.read_text()
          old = '''@media (max-width:480px) and (max-height:900px){
          .screen.result .resultBtns{grid-template-columns:repeat(4,minmax(0,1fr))}
          #postMatchAutoQueue{grid-column:auto;min-width:0;gap:3px;flex-wrap:nowrap;padding:5px 4px;font-size:9px;justify-content:center}
          #postMatchAutoQueue label{gap:3px;white-space:nowrap;font-size:0}
          #postMatchAutoQueue label::after{content:"連戦";font-size:9px}
          #postMatchAutoQueue input{width:16px;height:16px;flex:0 0 auto}
          #postMatchAutoQueueStatus{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
          }'''
          new = '''@media (max-width:480px) and (max-height:900px){
          .screen.result .resultBtns{grid-template-columns:repeat(4,minmax(0,1fr))}
          #postMatchAutoQueue{grid-column:1/-1;min-width:0;gap:6px;flex-wrap:nowrap;padding:5px 6px;font-size:9px;justify-content:flex-start}
          #postMatchAutoQueue label{gap:3px;white-space:nowrap;font-size:0;flex:0 0 auto}
          #postMatchAutoQueue label::after{content:"連戦";font-size:9px}
          #postMatchAutoQueue input{width:16px;height:16px;flex:0 0 auto}
          #postMatchAutoQueueStatus{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:1.3}
          }'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exact mobile autoqueue CSS once, got {s.count(old)}')
          p.write_text(s.replace(old, new))

          t = Path('tests/browser-full-interaction.spec.mjs')
          ts = t.read_text()
          marker = 'Result autoqueue status must expose truthful state text'
          if marker in ts:
              raise SystemExit('focused autoqueue visual acceptance already present')
          i = '  '
          anchor = i + "expect(rankingRows.at(-1).bottom, 'R20 fourth rank row must not be covered by Result actions').toBeLessThanOrEqual(resultButtonsBox.y + 1);\n\n"
          if ts.count(anchor) != 1:
              raise SystemExit(f'expected R20 Result geometry anchor once, got {ts.count(anchor)}')
          addition = (
              i + "const autoQueue = result.locator('#postMatchAutoQueue');\n"
              + i + "const autoQueueStatus = result.locator('#postMatchAutoQueueStatus');\n"
              + i + "await expect(autoQueue, 'Result autoqueue control remains visible').toBeVisible();\n"
              + i + "await expect(autoQueueStatus, 'Result autoqueue status remains visibly readable').toBeVisible();\n"
              + i + "const autoQueueStatusBox = await autoQueueStatus.boundingBox();\n"
              + i + "expect(autoQueueStatusBox, 'Result autoqueue status must have geometry').not.toBeNull();\n"
              + i + "expect(autoQueueStatusBox.width, 'Result autoqueue status must not collapse to an accessibility-only pixel').toBeGreaterThan(24);\n"
              + i + "expect(autoQueueStatusBox.height, 'Result autoqueue status must have readable height').toBeGreaterThan(8);\n"
              + i + "expect(((await autoQueueStatus.textContent()) ?? '').trim().length, 'Result autoqueue status must expose truthful state text').toBeGreaterThan(0);\n\n"
          )
          t.write_text(ts.replace(anchor, anchor + addition))
      - name: Verify exact bounded delta
        run: |
          set -euo pipefail
          node --check tests/browser-full-interaction.spec.mjs
          python - <<'PY'
          from pathlib import Path
          h = Path('browser/GAMEROAD.html').read_text()
          t = Path('tests/browser-full-interaction.spec.mjs').read_text()
          assert '#postMatchAutoQueue{grid-column:1/-1;min-width:0;gap:6px' in h
          assert '#postMatchAutoQueueStatus{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:1.3}' in h
          assert 'accessibility-only pixel' in t
          assert 'Result autoqueue status must expose truthful state text' in t
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs "
      - name: Commit product repair and remove executor
        run: |
          set -euo pipefail
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git rm .github/workflows/postmatch-autoqueue-mobile-r10b-patch.yml
          git commit -m "Result: keep mobile autoqueue status visible"
          git push origin HEAD:sol/postmatch-autoqueue-mobile-status-r10b-20260905
