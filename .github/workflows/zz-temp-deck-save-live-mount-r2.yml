name: TEMP Deck Save Live Mount R2
on:
  push:
    branches:
      - sol/deck-save-live-mount-r2-20260908
permissions:
  contents: write
jobs:
  mount-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/deck-save-live-mount-r2-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mount existing verified save guard and persistent regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          live = Path('browser/cards-deck-presentation.mjs')
          source = live.read_text()
          mount = "import './deck-save-recovery-core.mjs';"
          anchor = "export * from './cards-deck-presentation-core.mjs';\n\n"
          if mount not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('LIVE_ENTRY_ANCHOR_NOT_EXACT')
              source = source.replace(anchor, mount + "\n" + anchor, 1)
              live.write_text(source)
          if source.count(mount) != 1:
              raise SystemExit('LIVE_SAVE_GUARD_IMPORT_NOT_UNIQUE')

          test_file = Path('tests/deck-save-recovery-core.test.mjs')
          tests = test_file.read_text()
          marker = "live Cards/Deck presentation imports the existing verified deck-save guard"
          if marker not in tests:
              tests += r'''

          test('live Cards/Deck presentation imports the existing verified deck-save guard', async () => {
            const { readFile } = await import('node:fs/promises');
            const source = await readFile(new URL('../browser/cards-deck-presentation.mjs', import.meta.url), 'utf8');
            const mount = "import './deck-save-recovery-core.mjs';";
            assert.equal(source.split(mount).length - 1, 1);
            assert.match(source, /^import '\.\/deck-save-recovery-core\.mjs';$/m);
          });
          '''
              test_file.write_text(tests)
          if test_file.read_text().count(marker) != 1:
              raise SystemExit('LIVE_MOUNT_REGRESSION_NOT_UNIQUE')
          PY
          git diff --check
      - name: Run focused Deck save and Cards presentation regression
        run: |
          node --test tests/deck-save-recovery-core.test.mjs tests/cards-deck-presentation.test.mjs
      - name: Commit product delta only after focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          git add browser/cards-deck-presentation.mjs tests/deck-save-recovery-core.test.mjs
          if git diff --cached --quiet; then
            echo 'No product delta to commit.'
            exit 0
          fi
          git config user.name 'gameroad-deck-save-mount'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Deck: mount verified save guard in live Cards entry'
          git push origin HEAD:sol/deck-save-live-mount-r2-20260908
