name: Battle Replay R4 gate patch v2

on:
  push:
    branches:
      - work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact gate
        run: test "$(git hash-object .github/workflows/gameroad-required-gate.yml)" = "6e803f3ed05b857eb61607e8d0ec2589cb4af0ca"
      - name: Patch gate
        run: node tools/battle-replay-r4-patch-gate.mjs
      - name: Run replay tests
        run: node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs
      - name: Check adapter syntax
        run: node --check browser/battle-replay-live-adapter.mjs
      - name: Commit patch and remove temporary transport
        run: |
          rm .github/workflows/battle-replay-r4-gate-patch-v2.yml
          rm tools/battle-replay-r4-patch-gate.mjs
          git config user.name gameroad-r4-bot
          git config user.email gameroad-r4-bot@users.noreply.github.com
          git add .github/workflows/gameroad-required-gate.yml .github/workflows/battle-replay-r4-gate-patch-v2.yml tools/battle-replay-r4-patch-gate.mjs
          git commit -m "[BATTLE-REPLAY R4] classify live adapter in Required Gate"
          git push origin HEAD:work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT
