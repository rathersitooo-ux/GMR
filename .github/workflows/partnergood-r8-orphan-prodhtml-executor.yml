name: PARTNER-GOODMOVE R8 orphan production mount executor

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'work/partnergood-r8-orphan-prodhtml-20260819' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current base and replay proven production mount
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9065041e2f67e264791fb57d12257b2dcead7104 HEAD
          test "$(git diff --name-only 9065041e2f67e264791fb57d12257b2dcead7104...HEAD | sort | tr '\n' ' ')" = ".github/workflows/partnergood-r8-orphan-prodhtml-executor.yml "
          actual_blob="$(git hash-object browser/GAMEROAD.html)"
          test "$actual_blob" = "4485af3c1aabd7fdf2001a9e2586afbf7443ff53"
          test "$(git hash-object browser/partner-advice-runtime-mount.mjs)" = "5e82bdb28fc43f0851a5be27e0b7bade8d32ad53"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text(encoding='utf-8-sig')
          marker='/* PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R8 production mount */'
          assert marker not in s
          old="function replayFor(candidates,rule=currentPartnerRule()){if(!rule)return{ok:false,error:'PARTNER_RULE_NOT_SELECTED'};return partnerReplay({rule,candidates})}"
          assert s.count(old)==1, s.count(old)
          new="""/* PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R8 production mount */
          const __grPartnerAdviceRuntimeMount={control:null,bridge:null,pendingVersions:null,pendingManifest:null,pendingStateProvider:null,error:null};
          function __grPartnerAdviceValidVersions(v){return !!v&&typeof v==='object'&&!Array.isArray(v)&&['rulesVersion','cardVersion','stateVersion'].every(k=>typeof v[k]==='string'&&v[k]&&v[k].trim()===v[k]&&v[k].length<=96)}
          window.__GAMEROAD_PARTNER_ADVICE_RUNTIME__=Object.freeze({
            setVersions(v){if(!__grPartnerAdviceValidVersions(v))return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setVersions(v);__grPartnerAdviceRuntimeMount.pendingVersions={...v};return true},
            setManifest(v){if(!v||typeof v!=='object'||Array.isArray(v))return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setManifest(v);__grPartnerAdviceRuntimeMount.pendingManifest=v;return true},
            clearManifest(){__grPartnerAdviceRuntimeMount.pendingManifest=null;if(__grPartnerAdviceRuntimeMount.control)__grPartnerAdviceRuntimeMount.control.clearManifest()},
            setRuntimeStateProvider(fn){if(fn!==null&&typeof fn!=='function')return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setRuntimeStateProvider(fn);__grPartnerAdviceRuntimeMount.pendingStateProvider=fn;return true},
            status(){const status=__grPartnerAdviceRuntimeMount.control?__grPartnerAdviceRuntimeMount.control.status():{versionReady:!!__grPartnerAdviceRuntimeMount.pendingVersions,manifestReady:!!__grPartnerAdviceRuntimeMount.pendingManifest,runtimeStateReady:typeof __grPartnerAdviceRuntimeMount.pendingStateProvider==='function',mode:'loading-fallback'};return Object.freeze({...status,moduleReady:!!__grPartnerAdviceRuntimeMount.bridge,error:__grPartnerAdviceRuntimeMount.error})}
          });
          import('./partner-advice-runtime-mount.mjs').then(({createPartnerAdviceReplayBridge,createPartnerAdviceRuntimeControl})=>{
            const control=createPartnerAdviceRuntimeControl();
            if(__grPartnerAdviceRuntimeMount.pendingVersions)control.setVersions(__grPartnerAdviceRuntimeMount.pendingVersions);
            if(__grPartnerAdviceRuntimeMount.pendingManifest)control.setManifest(__grPartnerAdviceRuntimeMount.pendingManifest);
            if(__grPartnerAdviceRuntimeMount.pendingStateProvider)control.setRuntimeStateProvider(__grPartnerAdviceRuntimeMount.pendingStateProvider);
            __grPartnerAdviceRuntimeMount.control=control;
            __grPartnerAdviceRuntimeMount.bridge=createPartnerAdviceReplayBridge({legacyReplay:partnerReplay,getVersions:control.getVersions,getManifest:control.getManifest,getRuntimeState:control.getRuntimeState});
          }).catch(error=>{__grPartnerAdviceRuntimeMount.error=String(error?.message||error||'PARTNER_RUNTIME_IMPORT_FAILED')});
          function replayFor(candidates,rule=currentPartnerRule()){if(!rule)return{ok:false,error:'PARTNER_RULE_NOT_SELECTED'};const bridge=__grPartnerAdviceRuntimeMount.bridge;return typeof bridge==='function'?bridge(candidates,rule):partnerReplay({rule,candidates})}"""
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(grep -c 'PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R8 production mount' browser/GAMEROAD.html)" = "1"
          test "$(grep -c 'const bridge=__grPartnerAdviceRuntimeMount.bridge' browser/GAMEROAD.html)" = "1"
      - name: Focused runtime safety tests
        run: node --test tests/partner-advice-runtime-mount.test.mjs tests/partner-legal-action-adapter.test.mjs
      - name: Commit product and prove helper is absent from final diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-r8-executor"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/partnergood-r8-orphan-prodhtml-executor.yml
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/partnergood-r8-orphan-prodhtml-executor.yml browser/GAMEROAD.html "
          git commit -m "PARTNER-GOODMOVE R8: mount approved advice runtime in production HTML"
          test "$(git diff --name-only 9065041e2f67e264791fb57d12257b2dcead7104...HEAD | sort | tr '\n' ' ')" = "browser/GAMEROAD.html "
          git push origin HEAD:work/partnergood-r8-orphan-prodhtml-20260819
