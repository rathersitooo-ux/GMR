name: TEMP Home Quick Set R2

on:
  push:
    branches:
      - sol/home-quickset-gummy-hide-cancel-r2-20260908
    paths:
      - '.github/workflows/zz-temp-home-quickset-r2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/home-quickset-gummy-hide-cancel-r2-20260908
          fetch-depth: 0
      - name: Apply bounded Home Quick Set R2 patch
        run: |
          set -euo pipefail
          python3 tools/zz-temp-home-quickset-r2.py
          sed -i 's/data\.homeQuickSetActive/dataset.homeQuickSetActive/' tests/home-boot-presentation.test.mjs
      - name: Run focused Home tests
        run: node --test tests/home-boot-presentation.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove transient authorization and patch transport
        run: |
          set -euo pipefail
          rm data/preaction-authorizations/HOME-QUICKSET-R2-20260908T1523-SOL-P7N4V2.json
          rm tools/zz-temp-home-quickset-r2.py
          rm .github/workflows/zz-temp-home-quickset-r2.yml
      - name: Commit bounded product diff
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bounded-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Home: 押下中は通常グミを隠し明示取消を表示'
          git push origin HEAD:sol/home-quickset-gummy-hide-cancel-r2-20260908
