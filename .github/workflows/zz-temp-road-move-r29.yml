name: TEMP Road Move R29 Evidence

on:
  push:
    branches:
      - sol/road-move-bidirectional-r29-20260911
    paths:
      - 'tests/road-move-bidirectional-live-r27.spec.mjs'
      - '.github/workflows/zz-temp-road-move-r29.yml'
      - 'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R29-20260911T1224-SOL-Q7N4V6.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-current-home-seam-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract current Home to Setup/Battle anchors
        shell: bash
        run: |
          set -euo pipefail
          echo '=== data-home-target / data-go setup|battle ==='
          grep -nE 'data-(home-target|go)="(setup|battle)"' browser/GAMEROAD.html | head -80 || true
          echo '=== setup/battle navigation literals ==='
          grep -nE "(showScreen|goScreen|navigate|data-go|data-home-target).{0,100}(setup|battle)|(setup|battle).{0,100}(showScreen|goScreen|navigate|data-go|data-home-target)" browser/GAMEROAD.html | head -120 || true
          echo '=== home primary labels nearby ==='
          grep -nE 'ホーム|バトル|設定|ショップ|デッキ|パートナー' browser/GAMEROAD.html | head -120 || true
