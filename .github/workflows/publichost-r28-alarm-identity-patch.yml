name: PublicHost R28 bounded alarm identity patch
on:
  push:
    branches:
      - work/publichost-r28-alarm-attempt-identity
    paths:
      - .github/workflows/publichost-r28-alarm-identity-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publichost-r28-alarm-attempt-identity
      - name: Replace alarm identity with attempt-scoped identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-public-deploy.yml')
          s = p.read_text()
          marker = '$' + chr(123) + chr(123)
          close = chr(125) + chr(125)
          old = 'GAMEROAD_ALARM_PROBE_RUN_KEY: ' + marker + ' github.run_id ' + close
          new = old + '-' + marker + ' github.run_attempt ' + close
          if s.count(old) != 1:
              raise SystemExit('expected exactly one run-id-only alarm probe identity')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = ".github/workflows/cloudflare-public-deploy.yml"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cloudflare-public-deploy.yml
          git commit -m "PUBLICHOST R28: make alarm probe identity unique per attempt"
          git push origin HEAD:work/publichost-r28-alarm-attempt-identity
