name: TEMP Browser BFI Home Legacy R5

on:
  push:
    branches:
      - sol/browser-bfi-home-legacy-r5-20260911

permissions:
  contents: write

jobs:
  surgical-home-source-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen authorization and current-main overlap
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='ea1df495fa3e9b13a97ad8b3aaa2f793a0f85ca0'
          PREACTION='cfc37035bcf87334f77a26f899f992772c3be6f8'
          EXPECTED_HTML_BLOB='7332302ae385d3492755c65381928896decdac56'
          test "$(git rev-parse HEAD^)" = "$PREACTION"
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXPECTED_HTML_BLOB"
          git fetch origin main
          git merge-base --is-ancestor "$AUTH_BASE" origin/main
          test "$(git rev-parse "$AUTH_BASE:browser/GAMEROAD.html")" = "$EXPECTED_HTML_BLOB"
          test "$(git rev-parse "origin/main:browser/GAMEROAD.html")" = "$EXPECTED_HTML_BLOB"
      - name: Remove retired initial Home producers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          text = p.read_text(encoding='utf-8')
          visual = '''  <div class="codexHomeVisualLayer" data-formal-background="missing">\n    <div class="codexHalo codexHaloOuter" aria-hidden="true"></div>\n    <div class="codexHalo codexHaloInner" aria-hidden="true"></div>\n  </div>\n'''
          partner = '''  <button type="button" class="codexPartnerChip quickItem quickItemBtn" data-go="characters" aria-label="パートナー画面へ">\n    <span class="codexPartnerBadge">AP</span>\n    <span class="codexPartnerText"><strong data-partner-name>パートナー</strong><small>ルーム</small></span>\n    <span class="codexPartnerChevron">›</span>\n  </button>\n'''
          battle = '''  <button type="button" class="codexBattleCta" data-go="setup">バトルへ →</button>\n'''
          old_qa = "home:{primary:this.rect('.codexBattleCta'),character:null,live:this.rect('.codexHomeCenterStage')}"
          new_qa = "home:{primary:this.rect('.homePadChoice[data-home-target=\"setup\"]'),character:null,live:this.rect('.codexHomeCenterStage')}"
          for label, needle in [('visual', visual), ('partner', partner), ('battle', battle), ('qa', old_qa)]:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{label} exact-count mismatch: {count}')
          text = text.replace(visual, '', 1)
          text = text.replace(partner, '', 1)
          text = text.replace(battle, '', 1)
          text = text.replace(old_qa, new_qa, 1)
          if 'class="codexHomeVisualLayer"' in text or 'class="codexPartnerChip ' in text or 'class="codexBattleCta"' in text:
              raise SystemExit('retired initial Home producer remains')
          if 'data-home-target="setup"' not in text:
              raise SystemExit('canonical Home setup target missing')
          if new_qa not in text:
              raise SystemExit('canonical Home QA selector missing')
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Run existing focused regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/home-boot-runtime-prune-static.test.mjs
          node --test tests/home-boot-runtime-r3-regression.test.mjs
          node tests/browser-static-check.mjs
      - name: Commit product-only final tree
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='ea1df495fa3e9b13a97ad8b3aaa2f793a0f85ca0'
          git rm .github/workflows/zz-temp-browser-bfi-home-legacy-r5.yml
          git rm data/preaction-authorizations/BROWSER-BFI-HOME-LEGACY-R5-20260911T1840-SOL-H6K2N10.json
          mapfile -t changed < <(git diff --name-only "$AUTH_BASE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'browser/GAMEROAD.html'
          git config user.name 'gameroad-bounded-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git commit -m 'fix: remove retired Home producers from initial source'
          git push origin HEAD:sol/browser-bfi-home-legacy-r5-20260911
