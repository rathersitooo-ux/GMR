name: GAMEROAD Cloudflare Package Change Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'browser/**'
      - 'deploy/cloudflare/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: gameroad-cloudflare-package-change-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch canonical public deploy when package inputs changed
    runs-on: ubuntu-latest
    steps:
      - name: Detect package-affecting changes and dispatch canonical deploy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const before = context.payload.before;
            const after = context.sha;

            if (!before || /^0+$/.test(before)) {
              core.setFailed(`Missing usable push base SHA: ${before || '<empty>'}`);
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: before,
              head: after,
              per_page: 100,
            });
            if (comparison.data.files?.length === 100) {
              core.setFailed('Changed-file comparison reached 100 files; refusing to guess deployment scope.');
              return;
            }
            const changed = new Set((comparison.data.files || []).map((file) => file.filename));

            const canonicalDirectTriggers = new Set([
              '.github/workflows/cloudflare-public-deploy.yml',
              'deploy/cloudflare/relay/wrangler.toml',
              'deploy/cloudflare/release-comms-source.json',
            ]);
            if ([...changed].some((file) => canonicalDirectTriggers.has(file))) {
              core.info('Canonical public deploy is already triggered directly by this push; no duplicate dispatch.');
              return;
            }

            const buildFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'deploy/cloudflare/scripts/build.mjs',
              ref: after,
            });
            if (Array.isArray(buildFile.data) || buildFile.data.type !== 'file' || !buildFile.data.content) {
              core.setFailed('Could not read canonical Cloudflare package builder from pushed commit.');
              return;
            }
            const buildSource = Buffer.from(buildFile.data.content, 'base64').toString('utf8');
            const packageInputs = new Set();
            const browserInputPattern = /path\.join\(repoRoot,\s*['"](browser\/[^'"]+)['"]\)/g;
            for (const match of buildSource.matchAll(browserInputPattern)) {
              packageInputs.add(match[1]);
            }
            if (!packageInputs.has('browser/GAMEROAD.html')) {
              core.setFailed('Canonical package builder did not expose browser/GAMEROAD.html as a source input.');
              return;
            }

            const deployRuntimeChanged = [...changed].some((file) =>
              file.startsWith('deploy/cloudflare/scripts/') ||
              file.startsWith('deploy/cloudflare/tests/') ||
              file.startsWith('deploy/cloudflare/functions/') ||
              file.startsWith('deploy/cloudflare/relay/src/') ||
              file === 'deploy/cloudflare/wrangler.pages.toml'
            );
            const browserPackageChanged = [...changed].some((file) => packageInputs.has(file));

            if (!deployRuntimeChanged && !browserPackageChanged) {
              core.info('Push touched Browser/Cloudflare files but no canonical public-package input; dispatch not required.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'cloudflare-public-deploy.yml',
              ref: 'main',
            });
            core.info(`Dispatched canonical public deploy for ${after}.`);
            core.info(`Package inputs observed: ${[...packageInputs].sort().join(', ')}`);
