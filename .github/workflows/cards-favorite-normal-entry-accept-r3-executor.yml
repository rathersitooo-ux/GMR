name: Cards Favorites Normal Entry Acceptance R3

on:
  push:
    branches:
      - sol/cards-favorite-normal-entry-accept-r3-20260905

permissions:
  contents: write

env:
  BASE_SHA: e878972e2bdb3df294a48b0aab11b0259a8a00a8
  ACQUIRE_KEY: CARDS-FAVORITE-NORMAL-ACCEPT-R3-20260905T2251-SOL-V7K4P2
  MANIFEST: data/preaction-authorizations/CARDS-FAVORITE-NORMAL-ACCEPT-R3-20260905T2251-SOL-V7K4P2.json
  WORKFLOW_FILE: .github/workflows/cards-favorite-normal-entry-accept-r3-executor.yml

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/cards-favorite-normal-entry-accept-r3-20260905
          fetch-depth: 0

      - name: Verify PRE_ACTION fence and bounded branch state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 'gameroad-preaction-v3',
              'recordId': os.environ['ACQUIRE_KEY'],
              'taskId': 'BROWSER-PLAYGLOBAL-VISUAL-SHELL-REVIEW-001',
              'workUnitKey': 'CARDS_FAVORITE_FINDABILITY_R1',
              'acquireKey': os.environ['ACQUIRE_KEY'],
              'predictionStatus': 'PASS',
              'authorizationBaseSha': os.environ['BASE_SHA'],
              'leaseAuthority': 'CURRENT_ACTIVE_LEASES',
              'leaseState': 'ACTIVE',
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'PRE_ACTION mismatch {key}: {manifest.get(key)!r} != {value!r}')
          if not str(manifest.get('proceedToken', '')).startswith(f"PROCEED|{os.environ['ACQUIRE_KEY']}|"):
              raise SystemExit('PRE_ACTION proceed token mismatch')
          PY
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            "$WORKFLOW_FILE"
            "$MANIFEST"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Patch existing Cards visible interaction with favorite persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-full-interaction.spec.mjs')
          text = path.read_text(encoding='utf-8')
          start_marker = "  const search = cards.locator('#cardSearch');\n"
          end_marker = "  await search.fill('');\n"
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected one Cards search start marker, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end_start = text.find(end_marker, start)
          if end_start < 0:
              raise SystemExit('Cards search cleanup marker not found after Cards detail start')
          end = end_start + len(end_marker)
          current = text[start:end]
          if 'card-favorite-persisted-after-reload' in current:
              raise SystemExit('Favorites normal-entry acceptance is already present')

          new_lines = [
              "  const search = cards.locator('#cardSearch');",
              "  await search.fill('スペードA');",
              "  const result = cards.locator('#collectionGrid button.slot.live.cardFace:visible').first();",
              "  await expect(result).toBeVisible();",
              "  const favoriteCardId = await result.getAttribute('data-id');",
              "  expect(favoriteCardId, 'visible searched card has a stable card id').toBeTruthy();",
              "  await result.click();",
              "  await expect(cards.locator('.cardPreview')).toBeVisible();",
              "  await expect(cards.locator('#previewName')).toContainText('スペードA');",
              "  const favoriteAction = cards.locator('[data-role=\"cards-favorite-action\"]');",
              "  await expect(favoriteAction, 'card detail exposes the adopted favorite action').toBeVisible();",
              "  await expect(favoriteAction).toHaveAttribute('aria-pressed', 'false');",
              "  await favoriteAction.click();",
              "  await expect(favoriteAction).toHaveAttribute('aria-pressed', 'true');",
              "  await attachStateScreenshot(page, testInfo, 'card-detail-favorite-selected');",
              "  await cards.locator('#r4PreviewClose').click();",
              "",
              "  const favoriteFilter = cards.locator('[data-role=\"cards-deck-findability\"] [data-filter=\"favorite\"]');",
              "  await expect(favoriteFilter, 'Cards exposes the adopted favorite-only filter').toBeVisible();",
              "  await favoriteFilter.click();",
              "  await expect(favoriteFilter).toHaveAttribute('aria-pressed', 'true');",
              "  const visibleFavoriteBeforeReload = cards.locator(`#collectionGrid [data-id=\"${favoriteCardId}\"]:visible`).first();",
              "  await expect(visibleFavoriteBeforeReload, 'newly favorited card is immediately findable through favorite-only filter').toBeVisible();",
              "  await attachStateScreenshot(page, testInfo, 'card-favorite-filter-visible-before-reload');",
              "",
              "  await page.reload({ waitUntil: 'domcontentloaded' });",
              "  await page.waitForTimeout(1_000);",
              "  await expect(page.locator('section[data-screen=\"home\"]')).toBeVisible();",
              "  const cardsGoAfterFavoriteReload = visibleOperationGo(page, 'cards');",
              "  await expect(cardsGoAfterFavoriteReload).toBeVisible();",
              "  await cardsGoAfterFavoriteReload.click();",
              "  await expect(cards).toBeVisible();",
              "",
              "  const favoriteFilterAfterReload = cards.locator('[data-role=\"cards-deck-findability\"] [data-filter=\"favorite\"]');",
              "  await expect(favoriteFilterAfterReload).toBeVisible();",
              "  if ((await favoriteFilterAfterReload.getAttribute('aria-pressed')) !== 'true') await favoriteFilterAfterReload.click();",
              "  await expect(favoriteFilterAfterReload).toHaveAttribute('aria-pressed', 'true');",
              "  const persistedFavorite = cards.locator(`#collectionGrid [data-id=\"${favoriteCardId}\"]:visible`).first();",
              "  await expect(persistedFavorite, 'favorited card remains visible after reload under favorite-only filter').toBeVisible();",
              "  await persistedFavorite.click();",
              "  await expect(cards.locator('.cardPreview')).toBeVisible();",
              "  await expect(favoriteAction, 'reloaded card detail remembers favorite state').toBeVisible();",
              "  await expect(favoriteAction).toHaveAttribute('aria-pressed', 'true');",
              "  await attachStateScreenshot(page, testInfo, 'card-favorite-persisted-after-reload');",
              "",
              "  await favoriteAction.click();",
              "  await expect(favoriteAction).toHaveAttribute('aria-pressed', 'false');",
              "  await cards.locator('#r4PreviewClose').click();",
              "  if ((await favoriteFilterAfterReload.getAttribute('aria-pressed')) === 'true') await favoriteFilterAfterReload.click();",
              "  await expect(favoriteFilterAfterReload).toHaveAttribute('aria-pressed', 'false');",
              "  await search.fill('');",
          ]
          replacement = "\n".join(new_lines) + "\n"
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check
          grep -Fq "card-favorite-filter-visible-before-reload" tests/browser-full-interaction.spec.mjs
          grep -Fq "card-favorite-persisted-after-reload" tests/browser-full-interaction.spec.mjs

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run focused existing Cards visible interaction test
        run: npx playwright test --config=playwright.full-interaction.config.mjs --grep "covers Cards search" --workers=1

      - name: Commit bounded acceptance guard and remove transient authorization files
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_FILE"
          rm -f "$MANIFEST"
          git diff --check
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          printf 'pre-commit branch diff after transient removals pending working tree:\n%s\n' "${changed[*]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-full-interaction.spec.mjs "$WORKFLOW_FILE" "$MANIFEST"
          git commit -m 'test(cards): prove Favorites survive normal-entry reload'
          git push origin HEAD:sol/cards-favorite-normal-entry-accept-r3-20260905
