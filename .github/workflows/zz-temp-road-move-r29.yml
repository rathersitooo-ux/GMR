name: TEMP Road Move R29 Evidence

on:
  push:
    branches:
      - sol/road-move-bidirectional-r29-20260911
    paths:
      - 'tests/road-move-bidirectional-live-r27.spec.mjs'
      - '.github/workflows/zz-temp-road-move-r29.yml'
      - 'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R29-20260911T1224-SOL-Q7N4V6.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-current-home-seam-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact current Home Battle entry markup
        shell: bash
        run: |
          set -euo pipefail
          echo '=== home action markup 6250-6365 ==='
          nl -ba browser/GAMEROAD.html | sed -n '6250,6365p'
          echo '=== goSetup occurrences with context ==='
          grep -n -B8 -A12 'goSetup' browser/GAMEROAD.html | head -120 || true
          echo '=== visible Battle-labelled controls with context ==='
          grep -n -B5 -A8 -E '>[^<]*(バトル|対戦)[^<]*<' browser/GAMEROAD.html | head -180 || true
