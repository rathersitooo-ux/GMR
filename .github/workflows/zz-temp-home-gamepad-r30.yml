name: TEMP R30 Home gamepad source diagnosis

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/uifeedback-r30-home-gamepad-edge-currentmain
          fetch-depth: 0
      - name: Guard exact current main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = d8bc961cff3ffd1484486a513cf3571bfb94695d
          test "$(git hash-object browser/GAMEROAD.html)" = ad49944a780a8e2c0bb576cf160880cdc725081c
          test "$(git merge-base HEAD origin/main)" = d8bc961cff3ffd1484486a513cf3571bfb94695d
          echo R30_DIAG_GUARD_PASS
      - name: Print bounded Home motion source neighborhoods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          needles=[
            'function homeMotionToggle',
            'homeMotionRuntime=',
            'GAMEROAD_HOME_MOTION_QA',
            'function homeMotionGamepadPoll',
            'homePadCenter',
          ]
          for needle in needles:
            hits=[]; pos=0
            while True:
              i=s.find(needle,pos)
              if i<0: break
              hits.append(i); pos=i+1
            print(f'R30_SOURCE_NEEDLE {needle!r} hits={hits}')
            for n,i in enumerate(hits[:3],1):
              a=max(0,i-900); b=min(len(s),i+1800)
              chunk=s[a:b].replace('\r','')
              print(f'R30_SOURCE_BEGIN needle={needle!r} occurrence={n} index={i}')
              print(chunk)
              print('R30_SOURCE_END')
          PY
