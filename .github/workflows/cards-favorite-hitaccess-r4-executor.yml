name: Cards Favorite Hit Access R4

on:
  push:
    branches:
      - sol/cards-favorite-hitaccess-r4-20260906

permissions:
  contents: write

env:
  BASE_SHA: 5a94373bdb5c1a754c79dbf729d9a4a629af576e
  ACQUIRE_KEY: CARDS-FAVORITE-HITACCESS-R4-20260906T0306-SOL-J7N4K2
  MANIFEST: data/preaction-authorizations/CARDS-FAVORITE-HITACCESS-R4-20260906T0306-SOL-J7N4K2.json
  WORKFLOW_FILE: .github/workflows/cards-favorite-hitaccess-r4-executor.yml
  PROBE_B64: 

jobs:
  phone-geometry-probe:
    if: ${{ !contains(github.event.head_commit.message, '[r4-diag-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/cards-favorite-hitaccess-r4-20260906
          fetch-depth: 0

      - name: Verify PRE_ACTION fence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 'gameroad-preaction-v3',
              'recordId': os.environ['ACQUIRE_KEY'],
              'taskId': 'BROWSER-PLAYGLOBAL-VISUAL-SHELL-REVIEW-001',
              'workUnitKey': 'CARDS-FAVORITE-HITACCESS-LIVE-R4',
              'authorizationBaseSha': os.environ['BASE_SHA'],
              'leaseAuthority': 'CURRENT_ACTIVE_LEASES',
              'leaseState': 'ACTIVE',
          }
          for key, value in expected.items():
              if m.get(key) != value:
                  raise SystemExit(f'PRE_ACTION mismatch {key}: {m.get(key)!r} != {value!r}')
          token = str(m.get('proceedToken', ''))
          if not token.startswith(f"PROCEED|{os.environ['ACQUIRE_KEY']}|"):
              raise SystemExit('PRE_ACTION proceed token mismatch')
          PY
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          mapfile -t expected < <(printf '%s\n' "$MANIFEST" "$WORKFLOW_FILE" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"

      - name: Patch candidate and append phone probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          product = Path('browser/cards-deck-presentation.mjs')
          text = product.read_text(encoding='utf-8')
          old = '[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}[data-role="cards-deck-findability"] input{min-height:44px;min-width:min(240px,58vw);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,18,30,.72);color:inherit;font:inherit}[data-role="cards-deck-findability"] button{min-height:44px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:700 13px/1 system-ui}'
          new = '[data-role="cards-deck-findability"]{position:relative;z-index:2;pointer-events:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}#collectionGrid{position:relative;z-index:1;isolation:isolate}[data-role="cards-deck-findability"] input{pointer-events:auto;min-height:44px;min-width:min(240px,58vw);padding:8px 12px;border-radius:12px;border:1px solid rgba(10,18,30,.72);background:rgba(10,18,30,.72);color:inherit;font:inherit}[data-role="cards-deck-findability"] button{pointer-events:auto;min-height:44px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:700 13px/1 system-ui}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one findability style seam, found {text.count(old)}')
          product.write_text(text.replace(old, new, 1), encoding='utf-8')
          test_path = Path('tests/home-cards-2p5d-runtime.spec.mjs')
          current = test_path.read_text(encoding='utf-8')
          probe = base64.b64decode(os.environ['PROBE_B64']).decode('utf-8')
          if 'R4 phone hit geometry probe' in current:
              raise SystemExit('probe already present')
          test_path.write_text(current.rstrip() + '\n\n' + probe, encoding='utf-8')
          PY
          git diff --check

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run phone probe and persist output
        shell: bash
        run: |
          set +e
          npx playwright test tests/home-cards-2p5d-runtime.spec.mjs --config=playwright.config.mjs --grep "R4 phone hit geometry probe" --workers=1 2>&1 | tee /tmp/r4-geometry.log
          status=${PIPESTATUS[0]}
          set -e
          git reset --hard HEAD
          R4_STATUS="$status" python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          log = Path('/tmp/r4-geometry.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'R4_GEOMETRY=(\{.*\})', log)
          manifest = Path(os.environ['MANIFEST'])
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['diagnosticGeometryCapturedAtJst'] = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST')
          data['diagnosticGeometryRunId'] = os.environ.get('GITHUB_RUN_ID', '')
          data['diagnosticGeometryExitStatus'] = int(os.environ['R4_STATUS'])
          data['diagnosticGeometry'] = json.loads(match.group(1)) if match else None
          data['diagnosticGeometryLogTail'] = log[-12000:]
          data['leaseSnapshotReadbackAtJst'] = '2026-09-06 04:24 JST'
          data['leaseUntilJst'] = '2026-09-06 05:30 JST'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m '[r4-diag-result] capture existing-suite phone geometry'
          git push origin HEAD:sol/cards-favorite-hitaccess-r4-20260906
          exit "$status"
