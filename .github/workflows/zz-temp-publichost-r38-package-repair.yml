name: TEMP PublicHost R38 Package Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/zz-temp-publichost-r38-package-repair.yml
      - tools/zz-temp-publichost-r38-patch.py

permissions:
  contents: write

jobs:
  verified-package-repair:
    if: github.event.pull_request.head.ref == 'work/publichost-r38-postmatch-sidecar-package' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: work/publichost-r38-postmatch-sidecar-package
          fetch-depth: 2

      - name: Recheck exact current inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "a4924b2b5ee42093d8c7e50cf49921d9c91478db"
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "b80bd8b40c516486da65755f369ddb03ad376881"
          test "$(git hash-object browser/post-match-autoqueue-core.mjs)" = "c527c034119c27808993a0aede1ca04a77c68d98"
          test "$(git hash-object browser/GAMEROAD.html)" = "83ba1a68574249f66459dd785a73db29e1373a4f"

      - name: Apply durable package repair candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zz-temp-publichost-r38-patch.py
          node --check deploy/cloudflare/scripts/build.mjs

      - name: Prove known-bad RED and repaired/nearby GREEN
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdtemp, rm } from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import { assertBrowserRuntimeDependencyCompleteness } from './deploy/cloudflare/scripts/build.mjs';
          const dir = await mkdtemp(path.join(os.tmpdir(), 'gameroad-r38-sensitivity-'));
          try {
            let red = false;
            try {
              await assertBrowserRuntimeDependencyCompleteness(Buffer.from("<script type='module'>import('./known-missing-sidecar.mjs')</script>"), dir);
            } catch (error) {
              red = /missing Browser runtime dependency/.test(String(error?.message));
            }
            if (!red) throw new Error('known-bad missing-sidecar fixture did not fail closed');
            console.log('R38_KNOWN_BAD_MISSING_SIDECAR_RED=PASS');
          } finally {
            await rm(dir, { recursive: true, force: true });
          }
          NODE
          node --test deploy/cloudflare/tests/build.test.mjs deploy/cloudflare/tests/version-manifest.test.mjs
          BROWSER_BLOB="$(git hash-object browser/GAMEROAD.html)"
          POSTMATCH_BLOB="$(git hash-object browser/post-match-autoqueue-core.mjs)"
          node deploy/cloudflare/scripts/build.mjs \
            --expected-blob "$BROWSER_BLOB" \
            --expected-post-match-autoqueue-core-blob "$POSTMATCH_BLOB" \
            --source-commit "$(git rev-parse HEAD)" \
            --published-at '2026-08-24T03:28:00Z' \
            > /tmp/r38-manifest.json
          cmp --silent browser/post-match-autoqueue-core.mjs deploy/cloudflare/dist/post-match-autoqueue-core.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('deploy/cloudflare/dist/manifest.json', 'utf8'));
          const artifact = manifest.artifacts?.post_match_autoqueue_core;
          if (!artifact || artifact.output !== 'post-match-autoqueue-core.mjs') throw new Error('post-match artifact missing from package manifest');
          if (artifact.source !== 'browser/post-match-autoqueue-core.mjs') throw new Error('post-match provenance mismatch');
          console.log('R38_REPAIRED_PACKAGE_GREEN=PASS');
          NODE

      - name: Remove temporary executor and commit only durable repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- deploy/cloudflare/dist || true
          git clean -fd deploy/cloudflare/dist || true
          git rm .github/workflows/zz-temp-publichost-r38-package-repair.yml tools/zz-temp-publichost-r38-patch.py
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          expected={'.github/workflows/zz-temp-publichost-r38-package-repair.yml','tools/zz-temp-publichost-r38-patch.py','deploy/cloudflare/scripts/build.mjs'}
          if paths != expected:
              raise SystemExit(f'fail closed: unexpected durable scope {sorted(paths)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m 'PublicHost R38: close Browser runtime sidecar package gap'
          git push origin HEAD:work/publichost-r38-postmatch-sidecar-package
