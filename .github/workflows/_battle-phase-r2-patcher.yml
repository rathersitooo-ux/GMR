name: Battle Phase R2 Main Sync

on:
  push:
    branches:
      - work/BROWSER-BATTLE-PHASE-PRESENTATION-INTEGRATION-001-R2
    paths:
      - .github/workflows/_battle-phase-r2-patcher.yml

permissions:
  contents: write

jobs:
  sync-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/BROWSER-BATTLE-PHASE-PRESENTATION-INTEGRATION-001-R2
          fetch-depth: 0

      - name: Merge latest main without losing current R2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          grep -Fq 'BROWSER-BATTLE-PHASE-PRESENTATION-INTEGRATION-001-R2-DEDICATED-SURFACE' browser/GAMEROAD.html
          grep -Fq "mountChar('#battlePhaseNaki','partner.naki','dot_break_entry')" browser/GAMEROAD.html
          git push origin HEAD:work/BROWSER-BATTLE-PHASE-PRESENTATION-INTEGRATION-001-R2
