name: DeckSave R11 Production Integration Executor

on:
  push:
    branches:
      - work/deck-save-r11-production-integration-20260816t2259-sol-h8k2v7

permissions:
  contents: write

jobs:
  integrate-current-production:
    if: github.ref_name == 'work/deck-save-r11-production-integration-20260816t2259-sol-h8k2v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact current production preimage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d59b6ef410db1381e3e95f6d11f0f16631f99d28 HEAD
          [[ "$(git hash-object browser/GAMEROAD.html)" == "7cb88f6f9a9e92001d13de72a343abddbd595a1c" ]]
          [[ "$(git hash-object browser/deck-save-recovery-core.mjs)" == "44d2c7f50309c99eec3ff0b9c106ae13e6b5dbee" ]]
          [[ "$(git hash-object tests/deck-save-recovery-core.test.mjs)" == "1dff2b3605a906a82fb338ac7da46a0f9168cbb2" ]]
          [[ "$(git hash-object tests/browser-full-interaction.spec.mjs)" == "5be9e5d2b4711dbecd1117b0ff50f41af3d92158" ]]
          mapfile -t core_refs < <(git grep -n "deck-save-recovery-core.mjs" -- ':!.github/workflows/deck-save-r11-production-integration.yml' || true)
          printf '%s\n' "${core_refs[@]}"
          [[ "${#core_refs[@]}" -eq 1 ]]
          [[ "${core_refs[0]}" == tests/deck-save-recovery-core.test.mjs:* ]]

      - name: Apply R11 classic single-source non-destructive integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hp = Path('browser/GAMEROAD.html')
          cp = Path('browser/deck-save-recovery-core.mjs')
          ctp = Path('tests/deck-save-recovery-core.test.mjs')
          ftp = Path('tests/browser-full-interaction.spec.mjs')
          h = hp.read_text(encoding='utf-8')
          c = cp.read_text(encoding='utf-8')
          ct = ctp.read_text(encoding='utf-8')
          ft = ftp.read_text(encoding='utf-8')

          def replace_regex_once(text, pattern, replacement, label):
              matches = list(re.finditer(pattern, text, re.MULTILINE))
              assert len(matches) == 1, f'{label} preimage count={len(matches)}'
              return re.sub(pattern, lambda _m: replacement, text, count=1, flags=re.MULTILINE)

          script_pattern = r"</script>\n<script>\n\(\(\)=>\{'use strict';\nconst \$=\(s,r=document\)=>r\.querySelector\(s\), \$\$=\(s,r=document\)=>\[\.\.\.r\.querySelectorAll\(s\)\];\nconst CARDS="
          script_replacement = """</script>
          <script src="./deck-save-recovery-core.mjs"></script>
          <script>
          const { inspectRawSave, classifyDeckProjection, prepareExplicitDeckCommit, readStorage, writePreparedSaveVerified, resetExplicitSaveKeys } = window.GAMEROAD_DECK_SAVE_RECOVERY_CORE;
          (()=>{'use strict';
          const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
          const CARDS="""
          h = replace_regex_once(h, script_pattern, script_replacement, 'classic-app-anchor')

          save_replacement = """function save(){const pack=savePack(),read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){memorySave=JSON.stringify(pack);state.storage='memory';saveRecoveryRuntime.write={status:'failed',reason:read.reason};return false}const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection),deckOk=validateDeck(state.savedDeck).ok&&state.savedDeckRule?.id===DECK_RULE.id&&state.savedDeckRule?.revision===DECK_RULE.revision;if(classification.status!=='current'||!deckOk){state.storage='localStorage';saveRecoveryRuntime.write={status:'blocked',reason:classification.reason};return false}const ok=verifiedRawWrite(JSON.stringify(mergeKnownPack(inspection.parsed,pack)),read.rawValue);if(ok){$('#saveState').textContent='保存済み';$('#storageStatus')&&($('#storageStatus').textContent='端末保存')}return ok}"""
          load_replacement = """function load(){let read=readStorage(localStorage,SAVE_KEY),raw=null;if(read.status==='read'){state.storage='localStorage';raw=read.rawValue;memorySave=raw}else{state.storage='memory';raw=memorySave}const inspection=inspectRawSave(raw),classification=classifySave(inspection);if((classification.status==='current'||classification.status==='recognized_legacy')&&inspection.parsed)applyParsedSave(inspection.parsed);state.settings.audio=normalizeAudioSettings(state.settings.audio);state.partnerProfiles=normalizePartnerProfiles(state.partnerProfiles);state.progression=state.progression&&typeof state.progression==='object'?state.progression:{battlePoints:0};recoverDeckDraftSession();return classification}"""

          h = replace_regex_once(h, r"^function save\(\)\{[^\n]*\}$", save_replacement, 'save-function')
          h = replace_regex_once(h, r"^function load\(\)\{[^\n]*\}$", load_replacement, 'load-function')

          save_support = """const SAVE_AUTHORITY=Object.freeze({currentSaveRevision:3,currentRuleId:'FIRST_REGULATION',currentRuleRevision:3,recognizedLegacyRules:[{ruleId:'FIRST_REGULATION',ruleRevision:1,deckSizes:[24,26,39]},{ruleId:'FIRST_REGULATION',ruleRevision:2,deckSizes:[24,26,39]}]});
          const saveRecoveryRuntime={inspection:null,classification:null,write:null,reset:null};
          function savePack(){normalizeAudioSettings();state.partnerProfiles=normalizePartnerProfiles(state.partnerProfiles);return{v:3,playerCharacterId:state.playerCharacterId,partner:{schema:PARTNER_PROFILE_SCHEMA,selectedId:state.selectedPartnerId,profiles:state.partnerProfiles},settings:state.settings,history:state.history.slice(0,30),progression:{battlePoints:Math.max(0,Math.floor(Number(state.progression?.battlePoints)||0))},setupMode:state.setupMode,setupContent:state.setupContent,deck:{main:[...state.savedDeck.main],ex:[...state.savedDeck.ex],ruleId:state.savedDeckRule?.id??null,ruleRevision:state.savedDeckRule?.revision??null}}}
          function saveProjection(root){const d=root&&typeof root==='object'&&!Array.isArray(root)?root:{},legacyArray=Array.isArray(d.deck),deck=legacyArray?{main:d.deck,ex:[],ruleId:null,ruleRevision:null}:(d.deck&&typeof d.deck==='object'&&!Array.isArray(d.deck)?d.deck:{}),hasArrays=Array.isArray(deck.main)&&Array.isArray(deck.ex),main=hasArrays?deck.main:[],ex=hasArrays?deck.ex:[];return{saveRevision:Number.isInteger(d.v)&&d.v>=0?d.v:-1,ruleId:deck.ruleId??null,ruleRevision:deck.ruleRevision??null,deckSize:hasArrays?main.length:-1,deckLegal:hasArrays?validateDeck({main,ex}).ok:false}}
          function classifySave(inspection){const classification=classifyDeckProjection({inspection,projection:saveProjection(inspection.parsed),authority:SAVE_AUTHORITY});saveRecoveryRuntime.inspection=inspection;saveRecoveryRuntime.classification=classification;return classification}
          function cloneObject(v){return v&&typeof v==='object'&&!Array.isArray(v)?JSON.parse(JSON.stringify(v)):{} }
          function applyParsedSave(d){if(d.v<=2){const legacy=PROD_CHARS.some(c=>c.id===d.selectedCharacter)?d.selectedCharacter:'partner.naki';state.selectedPartnerId=legacy;state.playerCharacterId=legacy;state.partnerProfiles=normalizePartnerProfiles(null)}else{if(PROD_CHARS.some(c=>c.id===d.playerCharacterId))state.playerCharacterId=d.playerCharacterId;if(PROD_CHARS.some(c=>c.id===d.partner?.selectedId))state.selectedPartnerId=d.partner.selectedId;state.partnerProfiles=normalizePartnerProfiles(d.partner?.profiles)}if(d.settings)Object.assign(state.settings,d.settings);normalizeAudioSettings();if(Array.isArray(d.history))state.history=d.history.slice(0,30);state.progression={battlePoints:Math.max(0,Math.floor(Number(d.progression?.battlePoints)||0))};if(['2p','4p','2v2'].includes(d.setupMode))state.setupMode=d.setupMode;if(['road_shield','honey_hunt'].includes(d.setupContent))state.setupContent=d.setupContent;if((d.v===2||d.v===3)&&d.deck&&Array.isArray(d.deck.main)&&Array.isArray(d.deck.ex)){state.savedDeck={main:[...d.deck.main],ex:[...d.deck.ex]};state.savedDeckRule={id:typeof d.deck.ruleId==='string'?d.deck.ruleId:null,revision:Number.isInteger(d.deck.ruleRevision)?d.deck.ruleRevision:null}}state.deckDraft={main:[...state.savedDeck.main],ex:[...state.savedDeck.ex]}}
          function verifiedRawWrite(nextRaw,previousRaw){let writeFailed=false,readbackFailed=false,readback=null;try{localStorage.setItem(SAVE_KEY,nextRaw)}catch(e){writeFailed=true}try{readback=localStorage.getItem(SAVE_KEY)}catch(e){readbackFailed=true}if(!writeFailed&&!readbackFailed&&readback===nextRaw){memorySave=nextRaw;state.storage='localStorage';saveRecoveryRuntime.write={status:'saved',reason:'ADAPTER_WRITE_READBACK_OK'};return true}try{if(previousRaw===null)localStorage.removeItem(SAVE_KEY);else localStorage.setItem(SAVE_KEY,previousRaw);const restored=localStorage.getItem(SAVE_KEY);if(restored!==previousRaw)throw new Error('rollback-mismatch')}catch(e){saveRecoveryRuntime.write={status:'failed',reason:'ADAPTER_ROLLBACK_FAILED'};state.storage='memory';return false}saveRecoveryRuntime.write={status:'failed',reason:writeFailed?'ADAPTER_WRITE_FAILED':readbackFailed?'ADAPTER_READBACK_FAILED':'ADAPTER_READBACK_MISMATCH'};state.storage='memory';return false}
          function mergeKnownPack(base,pack){const next={...cloneObject(base),...pack};next.partner={...cloneObject(base?.partner),...pack.partner,profiles:{...cloneObject(base?.partner?.profiles),...cloneObject(pack.partner?.profiles)}};next.settings={...cloneObject(base?.settings),...pack.settings,audio:{...cloneObject(base?.settings?.audio),...cloneObject(pack.settings?.audio)}};next.progression={...cloneObject(base?.progression),...cloneObject(pack.progression)};next.deck={...pack.deck};return next}
          window.__GAMEROAD_SAVE_RECOVERY__={snapshot:()=>JSON.parse(JSON.stringify(saveRecoveryRuntime)),authority:{...SAVE_AUTHORITY}};
          """
          marker = save_replacement + "\n" + load_replacement
          assert h.count(marker) == 1, 'save/load adjacency changed after replacement'
          h = h.replace(marker, save_support + save_replacement + "\n" + load_replacement, 1)

          commit_replacement = """function commitDeck(){const v=validateDeck(state.deckDraft);if(!v.ok){toast(v.errors[0]);renderCards();return false}const nextDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex],ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision},nextProjection={saveRevision:3,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision,deckSize:state.deckDraft.main.length,deckLegal:true},read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){state.storage='memory';saveRecoveryRuntime.write={status:'failed',reason:read.reason};toast('端末保存を確認できません。札組は保存していません');renderCards();return false}let inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection);if(inspection.status==='missing'){const seed=savePack();seed.deck=nextDeck;inspection=inspectRawSave(JSON.stringify(seed));classification=classifyDeckProjection({inspection,projection:nextProjection,authority:SAVE_AUTHORITY})}const prepared=prepareExplicitDeckCommit({inspection,currentClassification:classification,path:['deck'],nextDeckRecord:nextDeck,nextProjection,authority:SAVE_AUTHORITY});if(prepared.status!=='prepared'){saveRecoveryRuntime.write=prepared;toast('保存データを保護するため札組を上書きしません');renderCards();return false}const currentPack=savePack();currentPack.deck=nextDeck;const stampedRoot={...mergeKnownPack(prepared.nextRoot,currentPack),v:3},stampedPrepared={...prepared,serialized:JSON.stringify(stampedRoot),nextRoot:stampedRoot};const written=writePreparedSaveVerified(localStorage,SAVE_KEY,stampedPrepared,{previousRawValue:read.rawValue});saveRecoveryRuntime.write=written;if(written.status!=='saved'){state.storage='memory';toast('保存に失敗しました。元の保存データを維持します');renderCards();return false}memorySave=stampedPrepared.serialized;state.storage='localStorage';state.savedDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex]};state.savedDeckRule={id:DECK_RULE.id,revision:DECK_RULE.revision};clearDeckDraftSession();renderCards();renderSetupDeckStatus();if(typeof ctxSet==='function')ctxSet('DECK_SAVED',{kind:'ok',ttl:2200});toast('札組を端末へ保存しました');return true}"""
          h = replace_regex_once(h, r"^function commitDeck\(\)\{[^\n]*\}$", commit_replacement, 'commitDeck-function')

          reset_replacement = """$('#resetSave').onclick=()=>{if(!window.confirm('端末のGAMEROAD保存を初期化します。よろしいですか？'))return false;const rr=resetExplicitSaveKeys(localStorage,[SAVE_KEY],{confirmed:true});saveRecoveryRuntime.reset=rr;if(rr.status!=='reset'){state.storage='memory';renderSettings();toast('保存の初期化に失敗しました。元の保存データを維持します');return false}memorySave=null;clearDeckDraftSession();state.history=[];state.progression={battlePoints:0};state.setupMode='2p';state.setupContent='road_shield';state.selectedPartnerId='partner.naki';state.playerCharacterId='partner.naki';state.characterSelectionRole='partner';state.partnerProfiles=normalizePartnerProfiles(null);state.settings={reduceMotion:false,lowPerf:false,audio:{...AUDIO_DEFAULTS}};state.lastPackPreview=[];state.gachaBusy=false;state.savedDeck={main:[...DEFAULT_DECK],ex:[]};state.savedDeckRule={id:null,revision:null};state.deckDraft={main:[...DEFAULT_DECK],ex:[]};state.storage='localStorage';audioStopMusic('reset');audioRuntime.seenEvents.clear();renderSettings();renderCards();renderSetupDeckStatus();toast('保存を初期化しました');return true};wireAudioSettings();"""
          h = replace_regex_once(h, r"\$\('#resetSave'\)\.onclick=\(\)=>\{[^\n]*?\};wireAudioSettings\(\);", reset_replacement, 'resetSave-handler')

          listener_replacement = """$('#saveDeck').addEventListener('click',()=>{const v=validateDeck(state.deckDraft);if(!v.ok)ctxSet('DECK_INVALID',{message:ctxSafeText(v.errors[0])});else ctxClear('DECK_')},true);"""
          h = replace_regex_once(h, r"^\$\('#saveDeck'\)\.addEventListener\('click',\(\)=>\{[^\n]*\},true\);$", listener_replacement, 'saveDeck-context-listener')

          export_functions = [
              'inspectRawSave', 'classifyDeckProjection', 'prepareExplicitDeckCommit',
              'readStorage', 'writePreparedSave', 'writePreparedSaveVerified', 'resetExplicitSaveKeys',
          ]
          for name in export_functions:
              marker = f'export function {name}'
              assert c.count(marker) == 1, f'{marker} count={c.count(marker)}'
              c = c.replace(marker, f'function {name}', 1)
          const_marker = 'export const DECK_SAVE_RECOVERY_CORE = Object.freeze({ schema: SCHEMA });'
          assert c.count(const_marker) == 1, f'core const marker count={c.count(const_marker)}'
          c = c.replace(const_marker, 'const DECK_SAVE_RECOVERY_CORE = Object.freeze({ schema: SCHEMA });', 1)
          assert 'globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE' not in c
          c += """

          globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE = Object.freeze({
            inspectRawSave,
            classifyDeckProjection,
            prepareExplicitDeckCommit,
            readStorage,
            writePreparedSave,
            writePreparedSaveVerified,
            resetExplicitSaveKeys,
            DECK_SAVE_RECOVERY_CORE,
          });
          """

          old_import = """import {
            inspectRawSave,
            classifyDeckProjection,
            prepareExplicitDeckCommit,
            readStorage,
            writePreparedSave,
            writePreparedSaveVerified,
            resetExplicitSaveKeys,
            DECK_SAVE_RECOVERY_CORE,
          } from '../browser/deck-save-recovery-core.mjs';
          """
          new_import = """await import('../browser/deck-save-recovery-core.mjs');
          const {
            inspectRawSave,
            classifyDeckProjection,
            prepareExplicitDeckCommit,
            readStorage,
            writePreparedSave,
            writePreparedSaveVerified,
            resetExplicitSaveKeys,
            DECK_SAVE_RECOVERY_CORE,
          } = globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE;
          """
          assert ct.count(old_import) == 1, f'core test import count={ct.count(old_import)}'
          ct = ct.replace(old_import, new_import, 1)

          test_title = "deck recovery adapter preserves blocked raw saves, legacy repair, storage failures, and reset boundaries"
          assert test_title not in ft, 'production recovery regression already exists unexpectedly'
          regression = r'''
          test('deck recovery adapter preserves blocked raw saves, legacy repair, storage failures, and reset boundaries', async ({ page }, testInfo) => {
            const runtime = observeRuntimeErrors(page);
            await bootCurrentBrowser(page);
            const initialRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);
            expect(initialRaw, 'missing save is not implicitly materialized on boot').toBeNull();
            const defaultDeck = await page.evaluate(() => [...window.__DEFAULT_DECK__]);
            expect(defaultDeck).toHaveLength(26);

            const reloadWithRaw = async (raw) => {
              await page.evaluate(({ key, rawValue }) => localStorage.setItem(key, rawValue), { key: STORAGE_KEY, rawValue: raw });
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(800);
              return page.evaluate((key) => ({ raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(), savedDeck: [...window.__GAMEROAD_TEST__.state.savedDeck.main], rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule }, playerCharacterId: window.__GAMEROAD_TEST__.state.playerCharacterId, selectedPartnerId: window.__GAMEROAD_TEST__.state.selectedPartnerId, setupMode: window.__GAMEROAD_TEST__.state.setupMode, setupContent: window.__GAMEROAD_TEST__.state.setupContent }), STORAGE_KEY);
            };

            const corruptRaw = '{not-json';
            let observed = await reloadWithRaw(corruptRaw);
            expect(observed.raw).toBe(corruptRaw);
            expect(observed.recovery.inspection.status).toBe('corrupt');
            expect(observed.recovery.classification.status).toBe('blocked');

            const unknownRaw = JSON.stringify({ v: 3, opaque: { keep: 7 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 99 } });
            observed = await reloadWithRaw(unknownRaw);
            expect(observed.raw).toBe(unknownRaw);
            expect(observed.recovery.classification.reason).toBe('RULE_UNKNOWN_OR_UNSUPPORTED');

            const newerRaw = JSON.stringify({ v: 4, opaque: { keep: 8 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 3 } });
            observed = await reloadWithRaw(newerRaw);
            expect(observed.raw).toBe(newerRaw);
            expect(observed.recovery.classification.reason).toBe('SAVE_REVISION_NEWER');

            const legacyRaw = JSON.stringify({ v: 2, selectedCharacter: 'partner.naki', history: [{ keep: 'legacy-history' }], settings: { reduceMotion: true }, progression: { battlePoints: 9 }, setupMode: '4p', setupContent: 'honey_hunt', deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 2 }, opaque: { keep: 9 } });
            observed = await reloadWithRaw(legacyRaw);
            expect(observed.raw).toBe(legacyRaw);
            expect(observed.recovery.classification.status).toBe('recognized_legacy');
            expect(observed.savedDeck).toHaveLength(26);
            expect(observed.rule.revision).toBe(2);
            let legal = await installLegalBattleDeck(page);
            expect(legal.committed).toBeTruthy();
            let stored = await page.evaluate((key) => JSON.parse(localStorage.getItem(key)), STORAGE_KEY);
            expect(stored.v).toBe(3);
            expect(stored.opaque.keep).toBe(9);
            expect(stored.history[0].keep).toBe('legacy-history');
            expect(stored.playerCharacterId).toBe('partner.naki');
            expect(stored.partner.selectedId).toBe('partner.naki');
            expect(stored.setupMode).toBe('4p');
            expect(stored.setupContent).toBe('honey_hunt');
            observed = await reloadWithRaw(JSON.stringify(stored));
            expect(observed.playerCharacterId).toBe('partner.naki');
            expect(observed.selectedPartnerId).toBe('partner.naki');
            expect(observed.setupMode).toBe('4p');
            expect(observed.setupContent).toBe('honey_hunt');
            expect(stored.deck.main).toHaveLength(40);
            expect(stored.deck.ruleRevision).toBe(3);

            const previousRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);
            const mismatch = await page.evaluate((key) => {
              const t = window.__GAMEROAD_TEST__, proto = Object.getPrototypeOf(localStorage), originalSetItem = proto.setItem;
              let writes = 0;
              Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value(k, v) { writes += 1; return originalSetItem.call(this, k, writes === 1 ? `${v}x` : v); } });
              let committed;
              try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value: originalSetItem }); }
              return { committed, raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
            }, STORAGE_KEY);
            expect(mismatch.committed).toBeFalsy();
            expect(mismatch.raw).toBe(previousRaw);
            expect(mismatch.recovery.write.reason).toBe('STORAGE_READBACK_MISMATCH');

            const readFailure = await page.evaluate(() => {
              const t = window.__GAMEROAD_TEST__, proto = Object.getPrototypeOf(localStorage), originalGetItem = proto.getItem;
              Object.defineProperty(proto, 'getItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-read-failure'); } });
              let committed;
              try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'getItem', { configurable: true, writable: true, value: originalGetItem }); }
              return { committed, savedCount: t.state.savedDeck.main.length, recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
            });
            expect(readFailure.committed).toBeFalsy();
            expect(readFailure.savedCount).toBe(40);
            expect(readFailure.recovery.write.reason).toBe('STORAGE_READ_FAILED');

            page.once('dialog', async (dialog) => dialog.accept());
            const removeFailure = page.evaluate(() => {
              const proto = Object.getPrototypeOf(localStorage), originalRemoveItem = proto.removeItem;
              Object.defineProperty(proto, 'removeItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-remove-failure'); } });
              document.querySelector('#resetSave').click();
              Object.defineProperty(proto, 'removeItem', { configurable: true, writable: true, value: originalRemoveItem });
              return { raw: localStorage.getItem('gameroad.browser.v10.core.1'), savedCount: window.__GAMEROAD_TEST__.state.savedDeck.main.length, recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot() };
            });
            const removeFailureResult = await removeFailure;
            expect(removeFailureResult.raw).toBe(previousRaw);
            expect(removeFailureResult.savedCount).toBe(40);
            expect(removeFailureResult.recovery.reset.reason).toBe('STORAGE_REMOVE_FAILED');

            page.once('dialog', async (dialog) => dialog.accept());
            await page.evaluate(() => document.querySelector('#resetSave').click());
            await page.waitForTimeout(120);
            const afterReset = await page.evaluate((key) => ({ raw: localStorage.getItem(key), savedCount: window.__GAMEROAD_TEST__.state.savedDeck.main.length, rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule } }), STORAGE_KEY);
            expect(afterReset.raw, 'explicit reset does not resurrect default26 as a durable save').toBeNull();
            expect(afterReset.savedCount).toBe(26);
            expect(afterReset.rule.id).toBeNull();

            const writeFailure = await page.evaluate((key) => {
              const t = window.__GAMEROAD_TEST__;
              const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
              const standard = window.__CARD_DATA__.filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank))).map((card) => card.id);
              const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
              const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
              const main = [...nonRoyal.slice(0, 37), ...royalIds];
              const setValidation = t.deckSetDraft(main, []);
              const proto = Object.getPrototypeOf(localStorage), originalSetItem = proto.setItem;
              Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-write-failure'); } });
              let committed;
              try { committed = t.deckCommit(); } finally { Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value: originalSetItem }); }
              return { committed, setValidation, raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(), savedCount: t.state.savedDeck.main.length };
            }, STORAGE_KEY);
            expect(writeFailure.setValidation.ok).toBeTruthy();
            expect(writeFailure.committed).toBeFalsy();
            expect(writeFailure.raw).toBeNull();
            expect(writeFailure.savedCount).toBe(26);
            expect(writeFailure.recovery.write.status).toBe('failed');
            runtime.assertClean(testInfo);
          });
          '''
          ft = ft.rstrip() + '\n\n' + regression.strip() + '\n'

          assert h.count('window.GAMEROAD_DECK_SAVE_RECOVERY_CORE') == 1
          assert h.count("window.__GAMEROAD_SAVE_RECOVERY__") == 1
          assert h.count("function commitDeck()") == 1
          assert "localStorage.removeItem(SAVE_KEY)}catch" not in h
          assert c.count('globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE') == 1
          assert 'export function ' not in c and 'export const ' not in c
          assert ct.count('globalThis.GAMEROAD_DECK_SAVE_RECOVERY_CORE') == 1
          assert ft.count(test_title) == 1

          hp.write_text(h, encoding='utf-8')
          cp.write_text(c, encoding='utf-8')
          ctp.write_text(ct, encoding='utf-8')
          ftp.write_text(ft, encoding='utf-8')
          PY

          node --check browser/deck-save-recovery-core.mjs
          node --check tests/deck-save-recovery-core.test.mjs
          node --check tests/browser-full-interaction.spec.mjs
          node --test tests/deck-save-recovery-core.test.mjs
          git diff --check

      - name: Self-clean executor and publish exact task diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-decksave-r11-integrator'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/deck-save-r11-production-integration.yml
          git add browser/GAMEROAD.html browser/deck-save-recovery-core.mjs tests/deck-save-recovery-core.test.mjs tests/browser-full-interaction.spec.mjs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/deck-save-r11-production-integration.yml browser/GAMEROAD.html browser/deck-save-recovery-core.mjs tests/browser-full-interaction.spec.mjs tests/deck-save-recovery-core.test.mjs)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${#staged[@]}" -eq 5 ]]
          [[ "$(printf '%s\n' "${staged[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]]
          git commit -m 'DeckSave R11: integrate non-destructive production save recovery'
          git push origin HEAD:${{ github.ref_name }}
