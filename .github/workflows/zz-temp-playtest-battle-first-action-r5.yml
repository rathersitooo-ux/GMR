name: TEMP Battle first action R5 surgical writer

on:
  push:
    branches:
      - sol/playtest-battle-first-action-r2-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/playtest-battle-first-action-r2-20260911

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "acbf678690f2fe40a6435c23353c3c5eb970cdaa" ]] || { echo "unexpected workflow parent"; exit 1; }
          [[ "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" == "bc4c4eee7e5575b00f8282627630aa130dc88b3b" ]] || { echo "unexpected build.test baseline"; exit 1; }
          python - <<'PY'
          from pathlib import Path

          runtime = Path('browser/battle-board-visual-explanation-runtime-mount.mjs')
          text = runtime.read_text(encoding='utf-8')
          old = "      button.textContent = collapsed ? '助言' : '閉じる';"
          new = "      const nextText = collapsed ? '助言' : '閉じる';\n      if (button.textContent !== nextText) button.textContent = nextText;"
          if text.count(old) != 1:
              raise SystemExit(f'unexpected runtime anchor count: {text.count(old)}')
          runtime.write_text(text.replace(old, new), encoding='utf-8')

          build_test = Path('deploy/cloudflare/tests/build.test.mjs')
          text = build_test.read_text(encoding='utf-8')
          old_blob = '6f1efcf4050f74b3a95aec4dcbcc1bc16eb68e71'
          new_blob = '1db5a282379a34d288bb20d5ce71396197718196'
          if text.count(old_blob) != 1:
              raise SystemExit(f'unexpected provenance pin count: {text.count(old_blob)}')
          build_test.write_text(text.replace(old_blob, new_blob), encoding='utf-8')
          PY
          [[ "$(git hash-object browser/battle-board-visual-explanation-runtime-mount.mjs)" == "1db5a282379a34d288bb20d5ce71396197718196" ]] || { echo "runtime blob mismatch"; exit 1; }
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(browser/battle-board-visual-explanation-runtime-mount.mjs deploy/cloudflare/tests/build.test.mjs)
          [[ "${changed[*]}" == "${expected[*]}" ]] || { printf 'unexpected working diff: %s\n' "${changed[*]}"; exit 1; }

      - name: Run existing focused and package tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-board-visual-explanation-runtime-mount.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

      - name: Commit product and clean transient authorization transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bounded-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/battle-board-visual-explanation-runtime-mount.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m 'Battle: 助言Observer自己再発火と公開pinを同期'
          git rm .github/workflows/zz-temp-playtest-battle-first-action-r5.yml
          git rm data/preaction-authorizations/PLAYTEST-BATTLE-FIRST-ACTION-R5-20260911T2151-SOL-Q7M4N11-PREACTION.json
          git commit -m 'PRE_ACTION: 一時writerと許可ファイルを削除'
          git push origin HEAD:sol/playtest-battle-first-action-r2-20260911
