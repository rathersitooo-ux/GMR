name: TEMP Road Move R29 Evidence

on:
  push:
    branches:
      - sol/road-move-bidirectional-r29-20260911
    paths:
      - 'tests/road-move-bidirectional-live-r27.spec.mjs'
      - '.github/workflows/zz-temp-road-move-r29.yml'
      - 'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R29-20260911T1224-SOL-Q7N4V6.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-bidirectional-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare commit-wait Road runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r29-road
          sed "s/waitUntil: 'domcontentloaded'/waitUntil: 'commit'/" \
            tests/road-move-bidirectional-live-r27.spec.mjs \
            > .r29-road/road.spec.mjs
          cat > .r29-road/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: '.',
            testMatch: 'road.spec.mjs',
            timeout: 90_000,
            expect: { timeout: 8_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/road-r29',
            reporter: [
              ['line'],
              ['json', { outputFile: '../test-results/road-r29/report.json' }],
            ],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              browserName: 'chromium',
              headless: true,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
            projects: [{
              name: 'road-844x390',
              use: { viewport: { width: 844, height: 390 } },
            }],
            webServer: {
              command: 'python3 -m http.server 4173 --bind 127.0.0.1',
              cwd: new URL('../', import.meta.url).pathname,
              url: 'http://127.0.0.1:4173/browser/GAMEROAD.html',
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF

      - name: Run Road bidirectional regression
        run: npx playwright test --config=.r29-road/playwright.config.mjs --workers=1

      - name: Upload Road evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: road-move-r29-${{ github.run_id }}
          path: |
            test-results/road-r29/
          if-no-files-found: warn
          retention-days: 7
