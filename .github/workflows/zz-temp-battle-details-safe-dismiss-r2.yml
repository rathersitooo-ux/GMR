              raise SystemExit(f'expected exactly one adapter provenance pin, got {build.count(old)}')
          build = build.replace(old, f"currentBlob: '{new_adapter_blob}'")
          build_path.write_text(build)
          print(f'NEW_ADAPTER_BLOB={new_adapter_blob}')
          PY
          node --test tests/battle-replay-live-adapter.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          rm -f .github/workflows/zz-temp-battle-details-safe-dismiss-r2.yml
          rm -f data/preaction-authorizations/BATTLE-DETAILS-DISMISS-R2-20260908T0924-SOL-S7N4Q9.json
          git add browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs deploy/cloudflare/tests/build.test.mjs .github/workflows/zz-temp-battle-details-safe-dismiss-r2.yml data/preaction-authorizations/BATTLE-DETAILS-DISMISS-R2-20260908T0924-SOL-S7N4Q9.json
          git config user.name 'gameroad-north-star-bot'
          git config user.email 'gameroad-north-star-bot@users.noreply.github.com'
          git commit -m 'Battle: dismiss details drawer safely'
