name: Battle field landmark R83 R2 executor

on:
  push:
    branches:
      - sol/battle-field-landmark-r83-r2-20260905
    paths:
      - .github/workflows/battle-field-landmark-r83-r2-executor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-field-landmark-r83-r2-20260905
          fetch-depth: 0
      - name: Verify authorization base ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor da22d175f7292f7b8a441ab3bf834989d64bc746 HEAD
          test "$(git show da22d175f7292f7b8a441ab3bf834989d64bc746:browser/battle-screen-runtime-mount.mjs | git hash-object --stdin)" = "0825354203468eb6955ff20d2d2f1acc2c55de76"
      - name: Apply bounded presentation-only landmark patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-screen-runtime-mount.mjs')
          test_path = Path('tests/battle-screen-runtime-mount.test.mjs')
          runtime = runtime_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          runtime = replace_once(
              runtime,
              "const PROGRESS_GUIDE_ATTR = 'data-battle-progress-guide';\n",
              "const PROGRESS_GUIDE_ATTR = 'data-battle-progress-guide';\nconst FIELD_LANDMARK_ATTR = 'data-battle-field-landmark';\nconst BATTLE_FIELD_IDS = Object.freeze(['FIELD-01', 'FIELD-02', 'FIELD-03', 'FIELD-04', 'FIELD-05', 'FIELD-08', 'FIELD-09']);\n",
              'runtime constants',
          )

          landmark_css = r'''[${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}]{position:absolute;z-index:1;left:2%;bottom:5%;width:min(28vw,250px);height:min(34vh,220px);pointer-events:none;opacity:.22;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22))}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}]::before,[${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}]::after{content:"";position:absolute;display:block;box-sizing:border-box}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-01"]::before{left:5%;bottom:0;width:76%;height:64%;background:rgba(35,67,48,.82);clip-path:polygon(0 100%,8% 46%,28% 38%,39% 16%,58% 27%,69% 5%,100% 22%,100% 100%)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-01"]::after{left:53%;top:4%;width:13%;height:82%;border-radius:45% 45% 18% 18%;background:linear-gradient(180deg,rgba(225,244,239,.84),rgba(124,193,187,.64) 50%,rgba(225,244,239,.22));transform:skewX(-5deg)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-02"]::before{left:35%;top:27%;width:31%;aspect-ratio:1;border-radius:50%;background:rgba(220,190,202,.72);box-shadow:-34px 0 0 rgba(220,190,202,.52),34px 0 0 rgba(220,190,202,.52),0 -31px 0 rgba(220,190,202,.52),0 31px 0 rgba(220,190,202,.52)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-02"]::after{left:49%;top:54%;width:5%;height:43%;border-radius:999px;background:rgba(70,108,66,.78);transform:rotate(7deg);transform-origin:50% 0}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-03"]::before{left:14%;bottom:2%;width:70%;height:90%;background:rgba(185,218,226,.74);clip-path:polygon(9% 100%,28% 42%,41% 69%,54% 0,68% 61%,82% 31%,100% 100%)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-03"]::after{left:34%;bottom:2%;width:28%;height:67%;border:2px solid rgba(235,249,249,.68);clip-path:polygon(50% 0,100% 100%,0 100%);transform:rotate(-8deg)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-04"]::before{left:41%;top:28%;width:24%;height:29%;border-radius:45% 45% 36% 36%;border:2px solid rgba(239,190,101,.76);background:radial-gradient(circle,rgba(255,205,98,.74),rgba(181,109,50,.28) 66%,transparent 70%);box-shadow:0 0 25px rgba(255,176,64,.28)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-04"]::after{left:52%;top:0;width:2px;height:31%;background:rgba(112,91,62,.78);box-shadow:0 62px 0 rgba(112,91,62,.45)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-05"]::before{left:8%;bottom:25%;width:84%;height:14%;border-radius:5px;background:repeating-linear-gradient(90deg,rgba(104,79,54,.82) 0 11px,rgba(180,151,105,.55) 11px 14px);transform:rotate(-4deg)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-05"]::after{left:7%;top:24%;width:86%;height:44%;border-top:4px solid rgba(141,112,74,.72);border-radius:50% 50% 0 0;transform:rotate(-4deg)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-08"]::before{left:8%;bottom:30%;width:84%;height:15%;border-radius:999px;background:rgba(107,83,58,.78);transform:rotate(13deg);box-shadow:0 18px 0 rgba(81,68,54,.58)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-08"]::after{left:16%;bottom:31%;width:72%;height:12%;border-radius:999px;background:rgba(139,111,74,.64);transform:rotate(-12deg)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-09"]::before{left:2%;bottom:0;width:96%;height:66%;background:rgba(225,235,232,.72);clip-path:polygon(0 100%,0 62%,17% 48%,31% 59%,49% 27%,62% 48%,77% 21%,100% 51%,100% 100%)}
          [${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}="FIELD-09"]::after{left:48%;top:28%;width:28%;height:57%;border-left:4px solid rgba(96,111,100,.68);border-bottom:4px solid rgba(96,111,100,.58);transform:skewX(-24deg) rotate(-8deg);transform-origin:0 100%;box-shadow:-18px 9px 0 -15px rgba(96,111,100,.65)}
          @media(max-width:540px) and (orientation:portrait){[${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}]{left:2px;top:82px;bottom:auto;width:72px;height:90px;opacity:.13}}
          @media(max-height:420px) and (orientation:landscape){[${SHELL_ATTR}="1"] [${FIELD_LANDMARK_ATTR}]{left:4px;bottom:4px;width:120px;height:76px;opacity:.16}}
          '''
          runtime = replace_once(
              runtime,
              '[${SHELL_ATTR}="1"] [${GRID_ATTR}]{position:absolute',
              landmark_css + '[${SHELL_ATTR}="1"] [${GRID_ATTR}]{position:absolute',
              'runtime landmark css',
          )

          landmark_functions = r'''function readBattleFieldId(...nodes) {
            for (const start of nodes) {
              let node = start;
              while (node) {
                const candidate = typeof node.dataset?.battleFieldId === 'string' ? node.dataset.battleFieldId.trim() : '';
                if (BATTLE_FIELD_IDS.includes(candidate)) return candidate;
                node = node.parentNode ?? null;
              }
            }
            return '';
          }

          function createFieldLandmark(document) {
            const landmark = createNode(document, 'div', 'grBattleFieldLandmark');
            landmark.setAttribute?.(FIELD_LANDMARK_ATTR, '');
            landmark.setAttribute?.('aria-hidden', 'true');
            landmark.dataset.presentationOnly = 'true';
            landmark.dataset.authority = 'existing-field-selection-id-only';
            landmark.hidden = true;
            return landmark;
          }

          function syncFieldLandmark(landmark, ...sources) {
            const fieldId = readBattleFieldId(...sources);
            landmark.hidden = !fieldId;
            landmark.setAttribute?.(FIELD_LANDMARK_ATTR, fieldId);
            setData(landmark, 'fieldId', fieldId || null);
            return fieldId || null;
          }

          '''
          runtime = replace_once(runtime, 'function createProgressGuide(document) {', landmark_functions + 'function createProgressGuide(document) {', 'runtime functions')

          runtime = replace_once(
              runtime,
              "  if (phaseAnchor.created) phaseSurface.hidden = true;\n\n  const progressGuide = createProgressGuide(document);\n  phaseSurface.appendChild(progressGuide);",
              "  if (phaseAnchor.created) phaseSurface.hidden = true;\n\n  const fieldLandmark = createFieldLandmark(document);\n  phaseSurface.appendChild(fieldLandmark);\n  syncFieldLandmark(fieldLandmark, phaseSurface, shell, root);\n\n  const progressGuide = createProgressGuide(document);\n  phaseSurface.appendChild(progressGuide);",
              'runtime mount landmark',
          )
          runtime = replace_once(
              runtime,
              "    if (planSlot) planSlot.hidden = battle || resultExit;\n\n    for (let index = 0; index < lanes.length; index += 1) {",
              "    if (planSlot) planSlot.hidden = battle || resultExit;\n    syncFieldLandmark(fieldLandmark, phaseSurface, shell, root);\n\n    for (let index = 0; index < lanes.length; index += 1) {",
              'runtime render landmark sync',
          )
          runtime = replace_once(
              runtime,
              "    if (progressGuide?.parentNode && typeof progressGuide.parentNode.removeChild === 'function') progressGuide.parentNode.removeChild(progressGuide);",
              "    if (fieldLandmark?.parentNode && typeof fieldLandmark.parentNode.removeChild === 'function') fieldLandmark.parentNode.removeChild(fieldLandmark);\n    if (progressGuide?.parentNode && typeof progressGuide.parentNode.removeChild === 'function') progressGuide.parentNode.removeChild(progressGuide);",
              'runtime destroy landmark',
          )
          runtime = replace_once(
              runtime,
              "    resolutionSurface,\n    progressGuide,\n    hud,",
              "    resolutionSurface,\n    fieldLandmark,\n    progressGuide,\n    hud,",
              'runtime expose landmark',
          )

          tests = replace_once(
              tests,
              "assert.equal(runtime.progressGuide.parentNode, runtime.phaseSurface);\nassert.deepEqual(runtime.progressGuide.children.map(node => node.textContent), ['GOAL', '', 'ROAD']);",
              "assert.equal(runtime.progressGuide.parentNode, runtime.phaseSurface);\nassert.deepEqual(runtime.progressGuide.children.map(node => node.textContent), ['GOAL', '', 'ROAD']);\nassert.ok(runtime.fieldLandmark);\nassert.equal(runtime.fieldLandmark.parentNode, runtime.phaseSurface);\nassert.equal(runtime.fieldLandmark.hidden, true);\nassert.equal(runtime.fieldLandmark.getAttribute('data-battle-field-landmark'), '');\nassert.equal(runtime.fieldLandmark.dataset.presentationOnly, 'true');\nassert.equal(runtime.fieldLandmark.dataset.authority, 'existing-field-selection-id-only');",
              'test initial landmark contract',
          )
          tests = replace_once(
              tests,
              "assert.ok(runtimeStyle.textContent.includes('.grBattleProgressArrow::before{content:\"▲\"'));\nassert.equal(runtimeStyle.textContent.includes('10000'), false);",
              "assert.ok(runtimeStyle.textContent.includes('.grBattleProgressArrow::before{content:\"▲\"'));\nfor (const fieldId of ['FIELD-01', 'FIELD-02', 'FIELD-03', 'FIELD-04', 'FIELD-05', 'FIELD-08', 'FIELD-09']) {\n  assert.ok(runtimeStyle.textContent.includes(`[data-battle-field-landmark=\\\"${fieldId}\\\"]`));\n}\nassert.ok(runtimeStyle.textContent.includes('clip-path:polygon'));\nassert.ok(runtimeStyle.textContent.includes('repeating-linear-gradient'));\nassert.ok(runtimeStyle.textContent.includes('@media(max-width:540px) and (orientation:portrait){[data-gr-battle-screen=\\\"1\\\"] [data-battle-field-landmark]'));\nassert.ok(runtimeStyle.textContent.includes('@media(max-height:420px) and (orientation:landscape){[data-gr-battle-screen=\\\"1\\\"] [data-battle-field-landmark]'));\nassert.equal(runtimeStyle.textContent.includes('10000'), false);",
              'test landmark css contract',
          )
          tests = replace_once(
              tests,
              "assert.deepEqual(\n  runtime.hud.chain.children.filter(node => node.className === 'grBattleHudChainArrow').map(node => node.textContent),\n  ['▷', '▷']\n);",
              "assert.deepEqual(\n  runtime.hud.chain.children.filter(node => node.className === 'grBattleHudChainArrow').map(node => node.textContent),\n  ['▷', '▷']\n);\n\nfor (const fieldId of ['FIELD-01', 'FIELD-02', 'FIELD-03', 'FIELD-04', 'FIELD-05', 'FIELD-08', 'FIELD-09']) {\n  root.dataset.battleFieldId = fieldId;\n  runtime.render(attack);\n  assert.equal(runtime.fieldLandmark.hidden, false);\n  assert.equal(runtime.fieldLandmark.getAttribute('data-battle-field-landmark'), fieldId);\n  assert.equal(runtime.fieldLandmark.dataset.fieldId, fieldId);\n}\nroot.dataset.battleFieldId = 'FIELD-UNKNOWN';\nruntime.render(attack);\nassert.equal(runtime.fieldLandmark.hidden, true);\nassert.equal(runtime.fieldLandmark.getAttribute('data-battle-field-landmark'), '');\nroot.dataset.battleFieldId = 'FIELD-01';\nruntime.render(attack);\nassert.equal(runtime.fieldLandmark.hidden, false);",
              'test field id projection',
          )
          tests = replace_once(
              tests,
              "const progressGuide = runtime.progressGuide;\nassert.equal(runtime.destroy(), true);",
              "const progressGuide = runtime.progressGuide;\nconst fieldLandmark = runtime.fieldLandmark;\nassert.equal(runtime.destroy(), true);",
              'test destroy capture',
          )
          tests = replace_once(
              tests,
              "assert.equal(progressGuide.parentNode, null);\nassert.equal(root.children.includes(runtime.shell), false);",
              "assert.equal(progressGuide.parentNode, null);\nassert.equal(fieldLandmark.parentNode, null);\nassert.equal(root.children.includes(runtime.shell), false);",
              'test destroy landmark',
          )
          tests = replace_once(
              tests,
              "existingPhase.id = 'battlePhaseSurface';\nexistingShell.appendChild(existingPhase);",
              "existingPhase.id = 'battlePhaseSurface';\nexistingShell.dataset.battleFieldId = 'FIELD-09';\nexistingShell.appendChild(existingPhase);",
              'test adopted field setup',
          )
          tests = replace_once(
              tests,
              "assert.equal(adopted.progressGuide.parentNode, existingPhase);\nassert.equal(adopted.progressGuide.dataset.presentationOnly, 'true');",
              "assert.equal(adopted.progressGuide.parentNode, existingPhase);\nassert.equal(adopted.progressGuide.dataset.presentationOnly, 'true');\nassert.equal(adopted.fieldLandmark.parentNode, existingPhase);\nassert.equal(adopted.fieldLandmark.hidden, false);\nassert.equal(adopted.fieldLandmark.getAttribute('data-battle-field-landmark'), 'FIELD-09');",
              'test adopted landmark projection',
          )
          tests = replace_once(
              tests,
              "const adoptedProgressGuide = adopted.progressGuide;\nassert.equal(adopted.destroy(), true);",
              "const adoptedProgressGuide = adopted.progressGuide;\nconst adoptedFieldLandmark = adopted.fieldLandmark;\nassert.equal(adopted.destroy(), true);",
              'test adopted destroy capture',
          )
          tests = replace_once(
              tests,
              "assert.equal(adoptedProgressGuide.parentNode, null);",
              "assert.equal(adoptedProgressGuide.parentNode, null);\nassert.equal(adoptedFieldLandmark.parentNode, null);",
              'test adopted destroy landmark',
          )

          runtime_path.write_text(runtime)
          test_path.write_text(tests)
          PY
          node tests/battle-screen-runtime-mount.test.mjs
          git diff --check
      - name: Commit bounded product delta and remove executor
        run: |
          set -euo pipefail
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git rm .github/workflows/battle-field-landmark-r83-r2-executor.yml
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
          git diff --cached --name-only
          git commit -m "Battle: distinguish selected fields with landmark silhouettes"
          git push origin HEAD:sol/battle-field-landmark-r83-r2-20260905
