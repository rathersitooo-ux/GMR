name: TEMP Battle causal return R8

on:
  push:
    branches:
      - sol/battle-resolution-board-return-r8-20260912

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-resolution-board-return-r8-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact current inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "75f4f47c60eb2c478e8314dd1dd1b6e1955571ee"
          test "$(git hash-object browser/battle-screen-runtime-mount.mjs)" = "8b8a9f497f1bf684ca20a5ba8a2ca2de448f0c6b"
          test "$(git hash-object tests/battle-screen-runtime-mount.test.mjs)" = "7da6e03b36aaf5bcb84a3f3a5fbc958ec433f55b"
          test -f data/preaction-authorizations/BATTLE-RESOLUTION-BOARD-RETURN-R8-20260912T1932-SOL-Q8N4V19.json
      - name: Apply exact presentation-only patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-screen-runtime-mount.mjs')
          test_path = Path('tests/battle-screen-runtime-mount.test.mjs')
          runtime = runtime_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, got {count}')
              return text.replace(old, new, 1)

          settle_old = "\n".join([
              "  } else if (phase === 'settle' && model?.boardReturn) {",
              "    const target = targets[0] || participantLabelById(model, model.boardReturn.opponentId);",
              "    detail = [target, `Shield ${model.boardReturn.shieldLane}`].filter(Boolean).join(' / ');",
              "  }",
          ])
          settle_new = "\n".join([
              "  } else if (phase === 'settle' && model?.boardReturn) {",
              "    const target = targets[0] || participantLabelById(model, model.boardReturn.opponentId);",
              "    const causal = model?.causalReturn;",
              "    const handKey = typeof causal?.sourceCard?.jankenHand === 'string'",
              "      ? causal.sourceCard.jankenHand.trim().toLowerCase()",
              "      : '';",
              "    const hand = LOAD_JANKEN_LABELS[handKey] ?? causal?.sourceCard?.jankenHand ?? '';",
              "    const sourceCard = typeof causal?.sourceCard?.cardId === 'string' ? causal.sourceCard.cardId.trim() : '';",
              "    const destination = [target, `Shield ${model.boardReturn.shieldLane}`].filter(Boolean).join(' / ');",
              "    detail = sourceCard ? `${sourceCard}${hand ? `（${hand}）` : ''} → 解決 → ${destination}` : destination;",
              "  }",
          ])
          runtime = replace_once(runtime, settle_old, settle_new, 'settle cue')

          cue_data_old = "\n".join([
              "  setData(cue, 'boardReturnDestination', model?.boardReturn?.destinationKey ?? null);",
              "  return text;",
          ])
          cue_data_new = "\n".join([
              "  setData(cue, 'boardReturnDestination', model?.boardReturn?.destinationKey ?? null);",
              "  setData(cue, 'causalTraceKey', model?.causalReturn?.traceKey ?? null);",
              "  setData(cue, 'causalCardId', model?.causalReturn?.sourceCard?.cardId ?? null);",
              "  setData(cue, 'causalJanken', model?.causalReturn?.sourceCard?.jankenHand ?? null);",
              "  return text;",
          ])
          runtime = replace_once(runtime, cue_data_old, cue_data_new, 'cue causal datasets')

          style_anchor = '[${CURRENT_ACTION_ATTR}]{position:absolute;z-index:8;top:clamp(206px,34vh,264px);left:50%;transform:translateX(-50%);max-width:min(42vw,420px);padding:5px 10px;border:1px solid rgba(245,248,225,.48);border-radius:999px;background:rgba(4,28,24,.80);box-shadow:0 6px 18px rgba(0,0,0,.24);pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f8fbeb;text-shadow:0 2px 8px rgba(0,0,0,.72);font-size:clamp(11px,1vw,14px);font-weight:900;letter-spacing:.05em}'
          style_new = style_anchor + '\n[${CURRENT_ACTION_ATTR}][data-phase="settle"]{max-width:min(76vw,620px)}'
          runtime = replace_once(runtime, style_anchor, style_new, 'settle cue width')

          render_anchor = "\n".join([
              "  function render(model, hudSnapshot = null) {",
              "    if (destroyed) throw new Error('BATTLE_SCREEN_RUNTIME_DESTROYED');",
          ])
          clear_lines = "\n".join([
              "  function render(model, hudSnapshot = null) {",
              "    if (destroyed) throw new Error('BATTLE_SCREEN_RUNTIME_DESTROYED');",
              "",
              "    // Rejected/stale input must not leave the previous accepted return highlighted.",
              "    writeCurrentActionCue(currentActionCue, null);",
              "    setData(shell, 'boardReturnDestination', null);",
              "    setData(phaseSurface, 'battleBoardReturnDestination', null);",
              "    setData(resolutionSurface, 'battleBoardReturnDestination', null);",
              "    setData(resolutionSurface, 'battleBoardReturnShieldRef', null);",
              "    for (const view of lanes) {",
              "      setData(view.shieldRail, 'boardReturnParticipant', null);",
              "      for (const link of view.shieldRail.children ?? []) {",
              "        const slot = link.getAttribute?.(SHIELD_SLOT_ATTR) || link.dataset.roadLane;",
              "        setData(link, 'boardReturnTarget', null);",
              "        setData(link, 'boardReturnEventId', null);",
              "        setData(link, 'boardReturnDestination', null);",
              "        link.setAttribute?.('aria-label', `Shield ${slot} → ROAD ${slot}`);",
              "      }",
              "    }",
          ])
          runtime = replace_once(runtime, render_anchor, clear_lines, 'render fail-close')

          old_text = '今：盤面反映 B-1 / Shield R'
          new_text = '今：盤面反映 C1（グー） → 解決 → B-1 / Shield R'
          if tests.count(old_text) != 3:
              raise SystemExit(f'settle text assertions: expected 3, got {tests.count(old_text)}')
          tests = tests.replace(old_text, new_text)

          settle_dataset_old = "\n".join([
              "assert.equal(runtime.currentActionCue.dataset.boardReturnDestination, 'P3:R');",
              "assert.equal(runtime.shell.dataset.boardReturnDestination, 'P3:R');",
          ])
          settle_dataset_new = "\n".join([
              "assert.equal(runtime.currentActionCue.dataset.boardReturnDestination, 'P3:R');",
              "assert.equal(runtime.currentActionCue.dataset.causalTraceKey, 'settle-1:P3:R');",
              "assert.equal(runtime.currentActionCue.dataset.causalCardId, 'C1');",
              "assert.equal(runtime.currentActionCue.dataset.causalJanken, 'ROCK');",
              "assert.equal(runtime.shell.dataset.boardReturnDestination, 'P3:R');",
          ])
          tests = replace_once(tests, settle_dataset_old, settle_dataset_new, 'settle causal datasets')

          reduced_anchor = "\n".join([
              "assert.equal(runtime.currentActionCue.textContent, '今：盤面反映 C1（グー） → 解決 → B-1 / Shield R');",
              "",
              "runtime.render(attack);",
          ])
          reduced_insert = "\n".join([
              "assert.equal(runtime.currentActionCue.textContent, '今：盤面反映 C1（グー） → 解決 → B-1 / Shield R');",
              "",
              "const lowPerfSettle = createBattleScreenModel({ participants, plan: settlePlan, returnIntent: 'MATCH_PLAN', lowPerf: true });",
              "runtime.render(lowPerfSettle);",
              "assert.equal(runtime.shell.dataset.motion, 'static_only');",
              "assert.equal(runtime.currentActionCue.textContent, '今：盤面反映 C1（グー） → 解決 → B-1 / Shield R');",
              "assert.equal(runtime.currentActionCue.dataset.causalCardId, 'C1');",
              "",
              "const malformedReturn = { ...settle, boardReturn: { ...settle.boardReturn, shieldLane: 'X' } };",
              "assert.throws(() => runtime.render(malformedReturn), /BATTLE_SCREEN_MODEL_REJECTED/);",
              "assert.equal(runtime.currentActionCue.hidden, true);",
              "assert.equal(runtime.currentActionCue.dataset.causalCardId, undefined);",
              "assert.equal(runtime.shell.dataset.boardReturnDestination, undefined);",
              "assert.equal(runtime.shieldRails[2].dataset.boardReturnParticipant, undefined);",
              "assert.equal(runtime.shieldRails.flatMap(rail => rail.children).some(node => node.dataset.boardReturnTarget === 'true'), false);",
              "assert.equal(p3ShieldSlots[2].getAttribute('aria-label'), 'Shield R → ROAD R');",
              "",
              "runtime.render(attack);",
          ])
          tests = replace_once(tests, reduced_anchor, reduced_insert, 'reduced/lowperf/rejected regression')

          attack_clear_old = "\n".join([
              "assert.equal(runtime.currentActionCue.dataset.boardReturnDestination, undefined);",
              "assert.equal(runtime.shieldRails[2].dataset.boardReturnParticipant, undefined);",
          ])
          attack_clear_new = "\n".join([
              "assert.equal(runtime.currentActionCue.dataset.boardReturnDestination, undefined);",
              "assert.equal(runtime.currentActionCue.dataset.causalTraceKey, undefined);",
              "assert.equal(runtime.currentActionCue.dataset.causalCardId, undefined);",
              "assert.equal(runtime.currentActionCue.dataset.causalJanken, undefined);",
              "assert.equal(runtime.shieldRails[2].dataset.boardReturnParticipant, undefined);",
          ])
          tests = replace_once(tests, attack_clear_old, attack_clear_new, 'attack causal clear')

          runtime_path.write_text(runtime)
          test_path.write_text(tests)
          PY
          git diff --check
          git diff -- browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
      - name: Run focused causal-return tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-resolution-board-return-presentation-core.test.mjs tests/battle-resolution-action-order-adapter.test.mjs tests/battle-screen-runtime-mount.test.mjs
          node --check browser/battle-screen-runtime-mount.mjs
      - name: Commit bounded product delta and remove transients
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-battle-resolution-causal-return-r8.yml
          rm -f data/preaction-authorizations/BATTLE-RESOLUTION-BOARD-RETURN-R8-20260912T1932-SOL-Q8N4V19.json
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs .github/workflows/zz-temp-battle-resolution-causal-return-r8.yml data/preaction-authorizations/BATTLE-RESOLUTION-BOARD-RETURN-R8-20260912T1932-SOL-Q8N4V19.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Battle: 解決結果の原因からShield帰着まで表示'
          git push origin HEAD:sol/battle-resolution-board-return-r8-20260912
