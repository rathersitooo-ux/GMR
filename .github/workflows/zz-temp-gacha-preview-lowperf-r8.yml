name: Temp Gacha Preview LowPerf R8

on:
  push:
    branches:
      - sol/gacha-preview-lowperf-r8-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/gacha-preview-lowperf-r8-20260912
          fetch-depth: 0
      - name: Apply exact bounded LowPerf adaptation
        shell: python
        run: |
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          old = "if(state.settings.reduceMotion){revealPack();return}playStage(GACHA_VIDEO_A01,()=>{"
          new = "if(state.settings.reduceMotion||state.settings.lowPerf){revealPack();return}playStage(GACHA_VIDEO_A01,()=>{"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old Gacha guard, found {s.count(old)}')
          if new in s:
              raise SystemExit('new Gacha LowPerf guard already present before patch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          after = p.read_text(encoding='utf-8')
          assert after.count(new) == 1
          assert old not in after
          for invariant in [
              '演出プレビュー：所持・保存は変わりません',
              "$('#skipPack').onclick=()=>{const v=$('#gachaVideo');v.pause();revealPack()};",
              'state.lastPackPreview=buildPackPreview()',
              "if(state.settings.reduceMotion||state.settings.lowPerf){revealPack();return}",
          ]:
              if invariant not in after:
                  raise SystemExit(f'missing invariant: {invariant}')
      - name: Focused Gacha presentation regression
        run: |
          node --test tests/gacha-presentation-core.test.mjs
          node tests/browser-static-check.mjs
      - name: Commit product patch and clean transients
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git commit -m 'Gacha: 低性能表示では開封動画を省略'
          rm -f .github/workflows/zz-temp-gacha-preview-lowperf-r8.yml
          rm -f data/preaction-authorizations/GACHA-PREVIEW-LOWPERF-R8-20260912T1916-SOL-K7N4Q4.json
          git add -A
          git commit -m 'Cleanup transient Gacha LowPerf writer'
          git push origin HEAD:sol/gacha-preview-lowperf-r8-20260912
