name: TEMP Partner Goodmove R5 Required Gate patch

on:
  push:
    branches:
      - work/partner-goodmove-r5-currentbase-runtime-mount-20260819

permissions:
  contents: write

jobs:
  patch-required-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/partner-goodmove-r5-currentbase-runtime-mount-20260819

      - name: Apply fail-closed exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/gameroad-required-gate.yml')
          text = path.read_text()
          blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if blob != '986c29780345760f26bc6497a71a6c9b1b749efb':
              raise SystemExit(f'Required Gate blob moved: {blob}')

          classifier_old = """              browser/partner-legal-action-adapter.mjs|\\
              tests/partner-legal-action-adapter.test.mjs)
                ai_optimal=true
"""
          classifier_new = """              browser/partner-legal-action-adapter.mjs|\\
              browser/partner-advice-runtime-mount.mjs|\\
              tests/partner-legal-action-adapter.test.mjs|\\
              tests/partner-advice-runtime-mount.test.mjs)
                ai_optimal=true
"""
          command_old = """      - name: Run Partner legal action adapter tests
        if: steps.classify.outputs.ai_optimal == 'true'
        run: node --test tests/partner-legal-action-adapter.test.mjs
"""
          command_new = """      - name: Run Partner legal action adapter tests
        if: steps.classify.outputs.ai_optimal == 'true'
        run: node --test tests/partner-legal-action-adapter.test.mjs tests/partner-advice-runtime-mount.test.mjs
"""

          if text.count(classifier_old) != 1:
              raise SystemExit(f'classifier anchor count={text.count(classifier_old)}')
          if text.count(command_old) != 1:
              raise SystemExit(f'command anchor count={text.count(command_old)}')
          if 'browser/partner-advice-runtime-mount.mjs' in text or 'tests/partner-advice-runtime-mount.test.mjs' in text:
              raise SystemExit('new Partner runtime paths already present before patch')

          text = text.replace(classifier_old, classifier_new, 1).replace(command_old, command_new, 1)
          if text.count('browser/partner-advice-runtime-mount.mjs') != 1:
              raise SystemExit('runtime module classifier post-count != 1')
          if text.count('tests/partner-advice-runtime-mount.test.mjs') != 2:
              raise SystemExit('runtime test post-count != 2')
          path.write_text(text)
          PY

      - name: Commit bounded patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-exact-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-partnergood-r5-required-gate-patch.yml
          git add .github/workflows/gameroad-required-gate.yml
          changed="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/_tmp-partnergood-r5-required-gate-patch.yml\n.github/workflows/gameroad-required-gate.yml'
          if [[ "${changed}" != "${expected}" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "${changed}"
            exit 1
          fi
          git commit -m "PARTNER-GOODMOVE R5: classify runtime bridge in Required Gate"
          git push origin HEAD:work/partner-goodmove-r5-currentbase-runtime-mount-20260819
