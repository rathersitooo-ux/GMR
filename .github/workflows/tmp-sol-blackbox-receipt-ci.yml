name: Temporary Sol Blackbox Receipt CI

on:
  push:
    branches:
      - work/ops-ai-sol-blackbox-receipt-r1-20260828

permissions:
  contents: read

jobs:
  focused-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runner and bridge
        run: >-
          node --check tools/luna-sol-codex-browser-bridge.mjs
          && node --check tools/luna-sol-codex-browser-bridge-runner.mjs
      - name: Run focused Luna/Sol bridge regression
        run: >-
          node --test
          tests/luna-sol-codex-browser-bridge.test.mjs
          tests/luna-sol-integration-core.test.mjs
          tests/luna-sol-router-core.test.mjs
          tests/chatgpt-browser-transport-core.test.mjs
          tests/sol-reasoning-protocol.test.mjs
          tests/executor-bus-packet-compressor.test.mjs
