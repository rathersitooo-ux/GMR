name: Rank Match Waiting Browser Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'browser/home-boot-runtime-base-r3.mjs'
      - 'browser/assets/visual/rank-match/**'
      - 'tests/home-boot-runtime-base-r3.test.mjs'
      - 'tests/rank-match-waiting.browser.spec.mjs'
      - '.github/workflows/rank-match-waiting-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-waiting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run rank waiting evidence
        run: npx playwright test tests/rank-match-waiting.browser.spec.mjs --config=playwright.rank-match.config.mjs --workers=1

      - name: Upload rank waiting evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rank-waiting-browser-${{ github.run_id }}
          path: |
            playwright-report-rank-waiting/
            test-results/rank-waiting/
          if-no-files-found: error
          retention-days: 14
