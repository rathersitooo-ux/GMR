name: TEMP Battle Camera Visual R9

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current source and fetch validated donor
        shell: bash
        run: |
          set -euo pipefail
          current_blob="$(git hash-object browser/GAMEROAD.html)"
          echo "current_html_blob=$current_blob"
          test "$current_blob" = "5f06efc5b69b198ac56cb3a502f94f97d8a61880"
          git fetch --force origin refs/heads/sol/battle-camera-html-r8-20260913:refs/remotes/origin/sol/battle-camera-html-r8-20260913
          git show origin/sol/battle-camera-html-r8-20260913:browser/GAMEROAD.html > /tmp/camera-donor.html
          grep -Fq 'id="cameraReturnBtn"' /tmp/camera-donor.html
          grep -Fq '__GAMEROAD_BATTLE_CAMERA_FIELD_ADAPTER__' /tmp/camera-donor.html
      - name: Apply inspect-only return presentation and static regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('browser/GAMEROAD.html')
          s = Path('/tmp/camera-donor.html').read_text(encoding='utf-8')

          button_pattern = r'<button[^>]*\bid="cameraReturnBtn"[^>]*>[\s\S]*?</button>'
          buttons = re.findall(button_pattern, s)
          assert len(buttons) == 1, f'camera return button count={len(buttons)}'
          s = re.sub(button_pattern, '', s, count=1)

          rail_pattern = r'(<div class="battleRail">[\s\S]*?</div>)'
          rails = re.findall(rail_pattern, s)
          assert len(rails) == 1, f'battleRail count={len(rails)}'
          independent = '<button type="button" class="cameraReturnControl" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る" hidden aria-hidden="true" tabindex="-1">自分</button>'
          s = re.sub(rail_pattern, lambda m: m.group(1) + independent, s, count=1)

          style_pattern = r'<style id="gameroad-battle-camera-live-style">[\s\S]*?</style>'
          assert len(re.findall(style_pattern, s)) == 1
          new_style = '''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn[hidden]{display:none!important}
          #cameraReturnBtn.cameraReturnControl{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px));z-index:34;min-width:52px;min-height:44px;padding:0 14px;border:1px solid rgba(210,238,244,.62);border-radius:999px;background:rgba(17,49,58,.88);color:#fff;font:700 13px/1 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.26);touch-action:manipulation}
          #cameraReturnBtn.cameraReturnControl[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}
          </style>'''
          s = re.sub(style_pattern, lambda _: new_style, s, count=1)

          destroy_token = 'delete returnControl.dataset.cameraMode'
          assert s.count(destroy_token) == 1, f'destroy token count={s.count(destroy_token)}'
          s = s.replace(
              destroy_token,
              "returnControl.hidden=true;returnControl.setAttribute('aria-hidden','true');returnControl.tabIndex=-1;delete returnControl.dataset.cameraMode",
              1,
          )

          mode_token = 'returnControl.dataset.cameraMode=cameraState.mode'
          assert s.count(mode_token) == 2, f'mode token count={s.count(mode_token)}'
          mode_projection = "returnControl.dataset.cameraMode=cameraState.mode;const manual=cameraState.mode==='MANUAL_INSPECT';returnControl.hidden=!manual;returnControl.setAttribute('aria-hidden',manual?'false':'true');returnControl.tabIndex=manual?0:-1"
          s = s.replace(mode_token, mode_projection)

          rail = re.search(r'<div class="battleRail">([\s\S]*?)</div>', s)
          assert rail and 'cameraReturnBtn' not in rail.group(1), 'camera return leaked into persistent battleRail'
          assert s.count('id="cameraReturnBtn"') == 1
          assert 'hidden aria-hidden="true" tabindex="-1"' in s
          html_path.write_text(s, encoding='utf-8')

          test_path = Path('tests/browser-static-check.mjs')
          t = test_path.read_text(encoding='utf-8')
          test_anchor = '  errors.push(...collectHomeVisualShellErrors(html));\n'
          assert t.count(test_anchor) == 1, f'static insertion anchor count={t.count(test_anchor)}'
          camera_checks = r'''  const cameraReturnIds = html.match(/id=["']cameraReturnBtn["']/g) ?? [];
          if (cameraReturnIds.length !== 1) errors.push(`camera return control count is ${cameraReturnIds.length}, expected 1`);
          const battleRailMatch = html.match(/<div class=["']battleRail["']>([\s\S]*?)<\/div>/i);
          if (battleRailMatch?.[1]?.includes('cameraReturnBtn')) errors.push('camera return control is inside persistent battle rail');
          if (!/<button[^>]*class=["']cameraReturnControl["'][^>]*id=["']cameraReturnBtn["'][^>]*hidden[^>]*aria-hidden=["']true["'][^>]*tabindex=["']-1["']/i.test(html)) {
            errors.push('camera return control is not default-hidden/non-focusable outside the rail');
          }
          if (!/#cameraReturnBtn\[hidden\]\{display:none!important\}/.test(html)) errors.push('camera return hidden state does not guarantee zero footprint');
          if ((html.match(/cameraState\.mode==='MANUAL_INSPECT';returnControl\.hidden=!manual/g) ?? []).length < 2) errors.push('camera return visibility is not bound to MANUAL_INSPECT at both camera projection points');
          if (!/__GAMEROAD_BATTLE_CAMERA_FIELD_ADAPTER__/.test(html) || !/mountBattleCameraLiveRuntime/.test(html)) errors.push('camera live adapter/runtime mount is missing');
          if (!/authority:\{gameplay:false,movement:false,target:false,legality:false,stateWrite:false\}/.test(html)) errors.push('camera field adapter lost gameplay-write firewall');
          '''
          t = t.replace(test_anchor, camera_checks + test_anchor)
          test_path.write_text(t, encoding='utf-8')
          PY
          git diff --check
      - name: Run camera and Browser static checks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-camera-control-core.test.mjs tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
      - name: Commit clean product delta and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-battle-camera-visual-r9.yml
          git rm data/preaction-authorizations/BATTLE-CAMERA-VISUAL-R9-20260914T0052-SOL.json
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/zz-temp-battle-camera-visual-r9.yml browser/GAMEROAD.html data/preaction-authorizations/BATTLE-CAMERA-VISUAL-R9-20260914T0052-SOL.json tests/browser-static-check.mjs | sort)"
          test "$changed" = "$expected"
          git commit -m 'Battle: カメラ復帰を確認中だけ表示 R9'
          git push origin HEAD:sol/battle-camera-visual-r9-20260914
