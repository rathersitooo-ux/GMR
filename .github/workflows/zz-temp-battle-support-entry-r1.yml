name: temp-battle-support-entry-r1

on:
  push:
    branches: [sol/battle-support-entry-r1-20260914]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'temporary Battle support entry patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-support-entry-r1-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch, test, and scope-check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/battle-replay-live-adapter.mjs')
          s = p.read_text()

          a = "const PARTNER_BATTLE_LOG_DEFAULT_RECENT_ROWS = 2;\n"
          assert s.count(a) == 1 and 'BATTLE_SUPPORT_ENTRY_ATTR' not in s
          s = s.replace(a, a + "const BATTLE_SUPPORT_ENTRY_ATTR = 'data-battle-support-entry';\nconst BATTLE_SUPPORT_ITEM_ATTR = 'data-battle-support-item';\n", 1)

          a = "function ensurePartnerBattleEventLogHost(environment = {}) {\n"
          helper = """function ensureLiveBattleSupportEntryRoot(documentRef, shell) {
            if (!shell || typeof documentRef?.createElement !== 'function') return null;
            let root = typeof shell.querySelector === 'function' ? shell.querySelector(`[${BATTLE_SUPPORT_ENTRY_ATTR}]`) : null;
            if (!root) {
              root = documentRef.createElement('nav');
              if (!root || typeof root.setAttribute !== 'function' || typeof shell.appendChild !== 'function') return null;
              root.setAttribute(BATTLE_SUPPORT_ENTRY_ATTR, '');
              root.setAttribute('aria-label', '対戦サポート');
              shell.appendChild(root);
            }
            return root;
          }

          export function registerLiveBattleSupportSurface({ key, label, target, document = browserGlobal('document'), hostId = 'battleLog' } = {}) {
            if (!nonEmptyString(key) || !nonEmptyString(label) || !target) return false;
            const shell = document?.getElementById?.(hostId);
            if (!shell || typeof document?.createElement !== 'function') return false;
            const root = ensureLiveBattleSupportEntryRoot(document, shell);
            if (!root || typeof root.appendChild !== 'function') return false;
            const children = root.children ? Array.from(root.children) : [];
            let control = children.find(child => child?.getAttribute?.(BATTLE_SUPPORT_ITEM_ATTR) === key) || null;
            if (!control) {
              control = document.createElement('button');
              if (!control || typeof control.setAttribute !== 'function') return false;
              control.setAttribute('type', 'button');
              control.setAttribute(BATTLE_SUPPORT_ITEM_ATTR, key);
              root.appendChild(control);
            }
            control.textContent = label;
            control.onclick = () => {
              target.scrollIntoView?.({ block: 'nearest' });
              target.focus?.({ preventScroll: true });
            };
            return true;
          }

          """
          assert s.count(a) == 1
          s = s.replace(a, helper + a, 1)

          a = """    shell.appendChild(host);
            }
            return host;
          }
          """
          b = """    shell.appendChild(host);
            }
            registerLiveBattleSupportSurface({ key: 'history', label: '履歴', target: host, document: documentRef });
            return host;
          }
          """
          assert s.count(a) == 1
          s = s.replace(a, b, 1)

          a = """  root.replaceChildren?.(title, known, unknown);
            return true;
          }
          """
          b = """  root.replaceChildren?.(title, known, unknown);
            registerLiveBattleSupportSurface({ key: 'deck', label: '山札', target: root, document, hostId });
            return true;
          }
          """
          assert s.count(a) == 1
          s = s.replace(a, b, 1)
          p.write_text(s)
          PY

          cat > tests/battle-support-entry.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { createPartnerBattleEventLogPresentationBridge, registerLiveBattleSupportSurface, renderLiveBattleRemainingDeckPresentation } from '../browser/battle-replay-live-adapter.mjs';

          function fakeBattleLogDocument({ shell = true } = {}) {
            function node(tag = 'div') {
              const attrs = new Map(), listeners = new Map();
              return {
                tagName: tag.toUpperCase(), dataset: {}, style: {}, children: [], textContent: '', hidden: false, scrollCalls: 0, focusCalls: 0, onclick: null,
                setAttribute(k, v) { attrs.set(k, String(v)); }, getAttribute(k) { return attrs.has(k) ? attrs.get(k) : null; },
                addEventListener(k, fn) { listeners.set(k, fn); }, appendChild(c) { this.children.push(c); return c; }, replaceChildren(...c) { this.children = c; },
                querySelector(q) { if (!q.startsWith('[') || !q.endsWith(']')) return null; const k = q.slice(1, -1); return this.children.find(c => c.getAttribute?.(k) !== null) || null; },
                click() { this.onclick?.({ currentTarget: this }); listeners.get('click')?.({ currentTarget: this }); },
                scrollIntoView() { this.scrollCalls++; }, focus() { this.focusCalls++; }
              };
            }
            const root = shell ? node('section') : null;
            return { document: { createElement: node, getElementById: id => id === 'battleLog' ? root : null }, shell: root };
          }
          const items = shell => shell?.querySelector?.('[data-battle-support-entry]')?.children.map(c => c.getAttribute('data-battle-support-item')) || [];

          test('support entry is idempotent and never invents a missing target', () => {
            const missing = fakeBattleLogDocument({ shell: false });
            assert.equal(registerLiveBattleSupportSurface({ key: 'graveyard', label: '墓地', target: null, document: missing.document }), false);
            const { document, shell } = fakeBattleLogDocument();
            const target = document.createElement('section'); shell.appendChild(target);
            assert.equal(registerLiveBattleSupportSurface({ key: 'deck', label: '山札', target, document }), true);
            assert.equal(registerLiveBattleSupportSurface({ key: 'deck', label: '山札', target, document }), true);
            assert.deepEqual(items(shell), ['deck']);
            shell.querySelector('[data-battle-support-entry]').children[0].click();
            assert.equal(target.scrollCalls, 1); assert.equal(target.focusCalls, 1);
          });

          test('actual history and owner-safe deck share the same support entry; graveyard remains absent', () => {
            const { document, shell } = fakeBattleLogDocument();
            const bridge = createPartnerBattleEventLogPresentationBridge({ document });
            assert.equal(bridge.begin('M1'), true); assert.equal(bridge.begin('M1'), true);
            assert.equal(renderLiveBattleRemainingDeckPresentation({ ok: true, status: 'ready', total: 4, unknownCount: 4, revision: 1, knownCardCounts: [] }, { document }), true);
            assert.ok(shell.querySelector('[data-partner-battle-event-log]'));
            assert.ok(shell.querySelector('[data-battle-remaining-deck]'));
            assert.deepEqual(items(shell), ['history', 'deck']);
            assert.equal(items(shell).includes('graveyard'), false);
            assert.equal(shell.children.filter(c => c.getAttribute?.('data-battle-support-entry') !== null).length, 1);
          });
          EOF

          git add browser/battle-replay-live-adapter.mjs tests/battle-support-entry.test.mjs
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert sorted(changed) == sorted(['browser/battle-replay-live-adapter.mjs', 'tests/battle-support-entry.test.mjs']), changed
          PY
          node --test tests/battle-support-entry.test.mjs
          node --test tests/battle-replay-live-adapter.test.mjs
          git diff --cached --check
      - name: Commit bounded product delta
        shell: bash
        run: |
          git config user.name 'gameroad-bot'
          git config user.email 'gameroad-bot@users.noreply.github.com'
          git commit -m 'Battle: 既存サポート面を一つの入口へ統合'
          git push origin HEAD:sol/battle-support-entry-r1-20260914
