name: Reference Clip Capture R3 Alternate Host

on:
  push:
    branches:
      - research/refclip-capture-20260827-r1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --upgrade yt-dlp
          ffmpeg -version | head -n 1
          yt-dlp --version

      - name: Acquire role-matched public gameplay clips
        shell: bash
        run: |
          set -u
          mkdir -p clips metadata
          cat > metadata/sources.tsv <<'EOF'
          role	label	url	note
          R_TOUCH_ACKNOWLEDGE	MakeS_touch_hand	https://www.bilibili.com/video/BV1Kt411V7xm/	actual phone screen recording; repeated hand touch
          R_IDLE_PRESENCE	AzurLane_home_loop	https://www.bilibili.com/video/BV1cRgp6cEyd/	2026 home-screen loop/L2D real-use footage
          R_TOUCH_ACKNOWLEDGE	AzurLane_interaction	https://www.bilibili.com/video/BV1hV41197w8/	L2D interaction state demonstration
          R_CHARACTER_VARIATION	BanGDream_special_motion	https://www.bilibili.com/video/BV1CW4LzKE9m/	official Chinese account special Live2D motion
          EOF
          : > metadata/acquire.log
          while IFS=$'\t' read -r role label url note; do
            [ "$role" = "role" ] && continue
            echo "=== $role $label $url ===" | tee -a metadata/acquire.log
            yt-dlp \
              --no-playlist \
              --ignore-errors \
              --download-sections "*0-90" \
              --force-keyframes-at-cuts \
              --write-info-json \
              -f "bv*[height<=480]+ba/b[height<=480]/best[height<=480]/best" \
              --merge-output-format mp4 \
              -o "clips/${label}.%(ext)s" \
              "$url" 2>&1 | tee -a metadata/acquire.log || true
          done < metadata/sources.tsv
          find clips -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee metadata/files.txt

      - name: Probe and hash actual media
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          : > metadata/probe.txt
          : > metadata/sha256.txt
          for f in clips/*.mp4 clips/*.webm clips/*.mkv clips/*.m4s; do
            echo "=== $f ===" >> metadata/probe.txt
            ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "$f" >> metadata/probe.txt 2>&1 || true
            sha256sum "$f" >> metadata/sha256.txt
          done
          cat metadata/probe.txt
          cat metadata/sha256.txt

      - name: Upload acquired reference media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameroad-reference-real-media-r3
          path: |
            clips/
            metadata/
          if-no-files-found: error
          retention-days: 3
