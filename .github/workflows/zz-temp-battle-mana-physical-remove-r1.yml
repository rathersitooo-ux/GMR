name: TEMP Battle physical Mana removal R1
on:
  push:
    branches:
      - sol/battle-mana-physical-remove-r1-20260912
    paths:
      - '.github/workflows/zz-temp-battle-mana-physical-remove-r1.yml'

permissions:
  contents: write

jobs:
  surgical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-mana-physical-remove-r1-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove physical Mana cards and bind numeric Mana
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          static_path = Path('tests/browser-static-check.mjs')
          c = html_path.read_text()

          def require(old, label):
              if old not in c:
                  raise SystemExit(f'missing expected HTML seam: {label}')

          # Physical Mana extraction + player state.
          start = c.index('function takeManaByPower(deck,v)')
          end = c.index('/* PARTNER-DECK-PRESERVATION-CROSSMEDIA-001 R1', start)
          new_make_player = """function makePlayer(i,human,deckIds=null){const source=[...(deckIds||DEFAULT_DECK)];let deck=shuffle(source);const shields=deck.splice(0,3);const hand=deck.splice(0,7);return{id:'P'+(i+1),name:human?'あなた':'PLAYER '+(i+1),human,character:normalizedPlayablePlayerCharacterId(state.playerCharacterId),deck,hand,shields:{L:shields[0],C:shields[1],R:shields[2]},manaCurrent:7,manaMax:10,honey:0,chip:[],lanes:{L:[],C:[],R:[]},royalUsed:{J:0,Q:0,K:0},position:'C:0:0',plan:null,rank:null,team:null,nextCostReduction:0,battleBlockedRound:0,sourceDeckIds:[...source],sourceDeckSize:source.length}}
          """
          c = c[:start] + new_make_player + c[end:]

          # Canonical numeric state replaces awake + mana-card-array reads.
          for old, new in [
              ('p.mana.length', 'p.manaMax'),
              ('me.mana.length', 'me.manaMax'),
              ('me?.mana?.length', 'me?.manaMax'),
              ('p.mana?.length', 'p.manaMax'),
              ('p.awake', 'p.manaCurrent'),
              ('me.awake', 'me.manaCurrent'),
              ('me?.awake', 'me?.manaCurrent'),
              ('...Object.values(p.shields),...p.mana,...p.chip', '...Object.values(p.shields),...p.chip'),
              ('<span id="manaMeter">マナ 0/7</span>', '<span id="manaMeter">マナ 7/10</span>'),
              ('<span class="manaOrbRack" id="manaOrbRack" aria-label="マナ玉"></span>', ''),
              ('show-all-seven-real-mana-slots', 'numeric-mana-current-max-no-physical-slots'),
              ('display-live-awake-over-live-mana-length', 'display-live-numeric-current-over-max'),
              ('seven live mana-orb slots with awake/sleep state', 'numeric Mana current/max without physical Mana card identity'),
              ('mana-awake-count-from-live-state', 'numeric-mana-current-max-from-live-state'),
          ]:
              c = c.replace(old, new)

          # Friend projection must no longer serialize fake physical Mana identities.
          old_friend = "position:p.position,awake:Number(p.manaCurrent)||0,honey:Number(p.honey)||0,mana:Array.from({length:p.manaMax||0},(_,i)=>'M'+i),chip:"
          new_friend = "position:p.position,manaCurrent:Number(p.manaCurrent)||0,manaMax:Number(p.manaMax)||10,honey:Number(p.honey)||0,chip:"
          require(old_friend, 'friend physical Mana projection')
          c = c.replace(old_friend, new_friend, 1)

          # Old Battle HUD orb rack becomes number-only.
          r10_start = c.index("const total=Array.isArray(me.mana)?me.manaMax:0,")
          r10_end = c.index("const ex=document.getElementById('dockEx')", r10_start)
          r10_numeric = "const total=Math.max(1,Number(me.manaMax)||10),current=Math.max(0,Math.min(total,Number(me.manaCurrent)||0)),ml=document.getElementById('dockManaLabel');if(ml)ml.textContent='マナ '+current+'/'+total;\n  "
          c = c[:r10_start] + r10_numeric + c[r10_end:]

          # R8 card/suit Mana ring becomes number-only; keep the existing dial shell.
          old_slots_markup = "<img class=\"r8DialImage\" alt=\"\" aria-hidden=\"true\"><div class=\"r8ManaSlots\" aria-hidden=\"true\"></div><div class=\"r8ManaNumber\" id=\"r8ManaNumber\"></div>"
          c = c.replace(old_slots_markup, "<img class=\"r8DialImage\" alt=\"\" aria-hidden=\"true\"><div class=\"r8ManaNumber\" id=\"r8ManaNumber\"></div>", 1)
          suit_start = c.index('function suitOf(id)')
          suit_end = c.index('function updateDockOffsets(map)', suit_start)
          c = c[:suit_start] + c[suit_end:]
          rm_start = c.index('function renderMana(me,host){')
          rm_end = c.index('async function syncPartner(st,host)', rm_start)
          r8_numeric = "function renderMana(me,host){const total=Math.max(1,Number(me?.manaMax)||10),current=Math.max(0,Math.min(total,Number(me?.manaCurrent)||0));const num=host.querySelector('#r8ManaNumber');num.innerHTML=String(current)+'<span class=\"r8SlashTotal\">/'+String(total)+'</span>';host.setAttribute('aria-label','マナ '+current+'/'+total)}\n"
          c = c[:rm_start] + r8_numeric + c[rm_end:]

          # Keep old QA method names for callers, but their source of truth is numeric.
          c = c.replace("total:me?.manaMax??null,awake:me?.manaCurrent??null,text:", "total:me?.manaMax??null,current:me?.manaCurrent??null,text:")
          c = c.replace("mana:{total:me?.manaMax??null,awake:me?.manaCurrent??null,orbs:document.querySelectorAll('#manaOrbRack .manaOrb').length,awakeOrbs:document.querySelectorAll('#manaOrbRack .manaOrb.awake').length}", "mana:{total:me?.manaMax??null,current:me?.manaCurrent??null,orbs:0,awakeOrbs:0}")
          c = c.replace("枚起こした。", "回復した。")

          forbidden = [
              'function takeManaByPower',
              'p.mana.length',
              'me.mana.length',
              'me?.mana?.length',
              'p.mana?.length',
              '...p.mana',
              'Array.isArray(me.mana)',
              'Array.isArray(me?.mana)',
              'me.mana[i]',
              'デッキから置いたトランプカード',
              'show-all-seven-real-mana-slots',
              '<span class="manaOrbRack" id="manaOrbRack"',
          ]
          residual = [x for x in forbidden if x in c]
          if residual:
              raise SystemExit('physical Mana residuals: ' + ', '.join(residual))
          if 'manaCurrent:7,manaMax:10,honey:0,chip:[]' not in c:
              raise SystemExit('numeric Mana initializer missing')
          if "function renderPhase()" not in c or "マナ ${me.manaCurrent}/${me.manaMax}" not in c:
              raise SystemExit('numeric renderPhase projection missing')

          html_path.write_text(c)

          s = static_path.read_text()
          old = "[/mana,awake:0,honey:0,chip:/, 'player-owned Honey balance is not initialized'],"
          new = "[/manaCurrent:7,manaMax:10,honey:0,chip:/, 'numeric Mana 7/10 and player-owned Honey balance are not initialized'],"
          if old not in s:
              raise SystemExit('static-check initializer seam missing')
          s = s.replace(old, new, 1)

          old = "[/position:p\\.position,awake:Number\\(p\\.awake\\)\\|\\|0,honey:Number\\(p\\.honey\\)\\|\\|0,mana:/, 'friend projection drops player-owned Honey'],"
          new = "[/position:p\\.position,manaCurrent:Number\\(p\\.manaCurrent\\)\\|\\|0,manaMax:Number\\(p\\.manaMax\\)\\|\\|10,honey:Number\\(p\\.honey\\)\\|\\|0,chip:/, 'friend projection drops numeric Mana or player-owned Honey'],"
          if old not in s:
              raise SystemExit('static-check friend projection seam missing')
          s = s.replace(old, new, 1)

          marker = "  if (/p\\.awake\\s*=\\s*Math\\.min"
          insert = """  if (/function takeManaByPower\\(/.test(html) || /\\.mana\\?*\\.length/.test(html) || /Array\\.isArray\\(me\\?*\\.mana\\)/.test(html)) {
            errors.push('physical Mana card zone or length-derived Mana remains');
          }
          if (/デッキから置いたトランプカード|show-all-seven-real-mana-slots/.test(html)) {
            errors.push('physical Mana card identity remains player-facing');
          }
          """
          if marker not in s:
              raise SystemExit('static-check insertion marker missing')
          s = s.replace(marker, insert + marker, 1)
          static_path.write_text(s)
          PY

          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

          python3 - <<'PY'
          from pathlib import Path
          c = Path('browser/GAMEROAD.html').read_text()
          print('takeManaByPower', c.count('function takeManaByPower'))
          print('numericInitializer', c.count('manaCurrent:7,manaMax:10'))
          print('physicalManaArrayRefs', sum(c.count(x) for x in ['p.mana.length','me.mana.length','me?.mana?.length','p.mana?.length','Array.isArray(me.mana)','Array.isArray(me?.mana)']))
          print('physicalManaCopy', c.count('デッキから置いたトランプカード'))
          PY

      - name: Commit surgical product diff
        shell: bash
        run: |
          git config user.name "gameroad-sol"
          git config user.email "gameroad-sol@users.noreply.github.com"
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Battle: remove physical Mana cards from live runtime"
          git push origin HEAD:sol/battle-mana-physical-remove-r1-20260912
