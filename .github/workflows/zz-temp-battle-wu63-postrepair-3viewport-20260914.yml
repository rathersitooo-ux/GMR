name: TEMP WU63 Post-Repair 3-Viewport Evidence

on:
  push:
    branches:
      - sol/battle-wu63-postrepair-3viewport-20260914

permissions:
  contents: read

jobs:
  viewport-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact product base and zero product delta
        shell: bash
        run: |
          set -euo pipefail
          BASE="d3993fa124b9cf1d9f44f2dac1e784c5deea2f44"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/zz-temp-battle-wu63-postrepair-3viewport-20260914.yml'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Run WU63 post-repair acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wu63-post visual-evidence/wu63-post test-results/wu63-post
          cat > .wu63-post/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir:'.',testMatch:'camera-wu63-post.spec.mjs',outputDir:'../test-results/wu63-post',timeout:90000,
            expect:{timeout:7000},workers:1,retries:0,
            reporter:[['line'],['json',{outputFile:'../test-results/wu63-post/report.json'}]],
            use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,trace:'retain-on-failure'},
            projects:[
              {name:'short-landscape-667x375',use:{viewport:{width:667,height:375},hasTouch:true}},
              {name:'desktop-1280x720',use:{viewport:{width:1280,height:720}}},
              {name:'phone-touch-390x844',use:{viewport:{width:390,height:844},isMobile:true,hasTouch:true}},
            ],
            webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}
          });
          EOF
          cat > .wu63-post/camera-wu63-post.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const output=path.resolve('visual-evidence/wu63-post');
          async function installLegalBattleDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__;const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);const royalIds=['SP_J','SP_Q','SP_K'];const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));const main=[...nonRoyal.slice(0,37),...royalIds];t.deckSetDraft(main,[]);const validation=t.deckValidate(t.state.deckDraft,{forBattle:true});const committed=validation.ok?t.deckCommit():false;return{committed,validation,saved:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          function overlaps(a,b){return !!(a&&b&&a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y)}
          function outside(r,vw,vh){return !!(r&&(r.x<0||r.y<0||r.x+r.width>vw||r.y+r.height>vh))}
          test('WU63 post-repair preserves camera, rail reachability and input ownership',async({page},testInfo)=>{
            const vw=testInfo.project.use.viewport.width, vh=testInfo.project.use.viewport.height;
            const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});expect(response?.ok()).toBeTruthy();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});
            const deck=await installLegalBattleDeck(page);expect(deck.committed).toBeTruthy();expect(deck.saved.ok).toBeTruthy();
            const setupControl=page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first();await expect(setupControl).toBeVisible();await setupControl.click();
            const setup=page.locator('section[data-screen="setup"]');await expect(setup).toBeVisible();await setup.locator('[data-content="road_shield"]').click();await setup.locator('[data-mode="2p"]').click();await setup.locator('#startMatch').click();
            const battle=page.locator('section[data-screen="battle"]');await expect(battle).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();
            const ret=battle.locator('#cameraReturnBtn'), rail=battle.locator('.battleRail'), hand=battle.locator('#hand'), top=battle.locator('.battleTopStatus');
            await expect(ret).toBeHidden();
            const follow=await ret.evaluate(el=>({hidden:el.hidden,display:getComputedStyle(el).display,pointer:getComputedStyle(el).pointerEvents,rects:el.getClientRects().length,aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));expect(follow).toEqual({hidden:true,display:'none',pointer:'none',rects:0,aria:'true',tab:-1});
            const followHand=await hand.boundingBox(); const followRail=await rail.boundingBox();
            const followInteractive=await rail.locator('button,[role="button"],[tabindex]:not([tabindex="-1"])').evaluateAll((els)=>els.map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{tag:el.tagName,id:el.id,cls:String(el.className||''),hidden:el.hidden,display:s.display,visibility:s.visibility,pointer:s.pointerEvents,x:r.x,y:r.y,width:r.width,height:r.height}}).filter(x=>!x.hidden&&x.display!=='none'&&x.visibility!=='hidden'&&x.pointer!=='none'&&x.width>0&&x.height>0));
            const followRows=await battle.locator('#battleAdvanceReservation .arRow').evaluateAll((els)=>els.map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{cls:String(el.className||''),display:s.display,visibility:s.visibility,x:r.x,y:r.y,width:r.width,height:r.height}}).filter(x=>x.display!=='none'&&x.visibility!=='hidden'&&x.width>0&&x.height>0));
            const interactiveOverlaps=followInteractive.filter(r=>overlaps(followHand,r));expect(interactiveOverlaps).toEqual([]);
            if(vw===667&&vh===375){
              expect(followRail).not.toBeNull();expect(outside(followRail,vw,vh),JSON.stringify(followRail)).toBeFalsy();
              expect(followRows.length).toBeGreaterThan(0);
              const offscreen=[...followInteractive,...followRows].filter(r=>outside(r,vw,vh));expect(offscreen,JSON.stringify(offscreen)).toEqual([]);
            }
            await page.screenshot({path:path.join(output,`${testInfo.project.name}-follow.png`),animations:'disabled'});
            const world=battle.locator('#battleMap'), box=await world.boundingBox();expect(box).not.toBeNull();await page.mouse.move(box.x+box.width*.52,box.y+box.height*.50);await page.mouse.down();await page.mouse.move(box.x+box.width*.35,box.y+box.height*.50,{steps:8});await page.mouse.up();
            await expect(ret).toBeVisible();await expect(ret).toHaveAttribute('data-camera-mode','MANUAL_INSPECT');
            const rr=await ret.boundingBox(), hr=await hand.boundingBox(), tr=await top.boundingBox();expect(rr).not.toBeNull();expect(rr.width).toBeGreaterThanOrEqual(44);expect(rr.height).toBeGreaterThanOrEqual(44);expect(rr.x).toBeGreaterThanOrEqual(0);expect(rr.y).toBeGreaterThanOrEqual(0);expect(rr.x+rr.width).toBeLessThanOrEqual(vw);expect(rr.y+rr.height).toBeLessThanOrEqual(vh);expect(overlaps(rr,hr)).toBeFalsy();expect(overlaps(rr,tr)).toBeFalsy();
            const railState=await rail.evaluate(el=>({opacity:getComputedStyle(el).opacity,pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));expect(railState).toEqual({opacity:'0',pointer:'none',visibility:'hidden'});
            const manual=await ret.evaluate(el=>({aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));expect(manual).toEqual({aria:'false',tab:0});
            const target=battle.locator('#targetBox');let targetRect=null;if(await target.count()&&await target.isVisible()){targetRect=await target.boundingBox();expect(overlaps(rr,targetRect)).toBeFalsy();}
            fs.writeFileSync(path.join(output,`${testInfo.project.name}-metrics.json`),JSON.stringify({viewport:{width:vw,height:vh},follow,followHand,followRail,followInteractive,followRows,interactiveOverlaps,returnRect:rr,handRect:hr,topRect:tr,targetRect,railState},null,2));
            await page.screenshot({path:path.join(output,`${testInfo.project.name}-manual.png`),animations:'disabled'});
            await ret.click();await expect(ret).toBeHidden();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode)).toBe('FOLLOW_CONTROLLED');const restored=await rail.evaluate(el=>({pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));expect(restored.visibility).not.toBe('hidden');expect(restored.pointer).not.toBe('none');await page.screenshot({path:path.join(output,`${testInfo.project.name}-returned.png`),animations:'disabled'});
          });
          EOF
          npx playwright test --config=.wu63-post/playwright.config.mjs --workers=1
      - name: Upload WU63 post-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-camera-wu63-postrepair-${{ github.run_id }}
          path: |
            visual-evidence/wu63-post/
            test-results/wu63-post/
          if-no-files-found: warn
          retention-days: 14
