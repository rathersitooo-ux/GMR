<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,-apple-system,sans-serif}button,select{font:inherit}button{cursor:pointer}.app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#071018}.scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 30% 44%,#dff6d4 0 14%,transparent 38%),linear-gradient(135deg,#29495b,#152a39 48%,#071018);transition:.2s}.scene.ink{background:linear-gradient(105deg,#f0eadb 0 47%,#03d7f2 47.2% 49%,#070b12 49.2% 100%)}.scene.ink:before{content:"GAMEROAD";position:absolute;left:5vw;bottom:8vh;font-weight:1000;font-size:min(8vw,84px);color:#081018;transform:skew(-8deg);border-bottom:8px solid #08d8f3}.scene.ink:after{content:"CHOOSE\A YOUR ROAD";white-space:pre;position:absolute;right:8vw;top:18vh;font-weight:1000;font-size:min(5vw,58px);line-height:.86;transform:rotate(-2deg)}.character{position:absolute;left:10vw;bottom:8vh;width:min(26vw,320px);height:min(64vh,520px);border-radius:52% 48% 44% 56%;background:linear-gradient(180deg,#55ddff 0 25%,#102735 25% 50%,#fff 50% 72%,#151b22 72%);box-shadow:0 26px 60px #0008}.ink .character{filter:saturate(1.2);box-shadow:0 26px 60px #0007}.object{position:absolute;min-width:120px;min-height:56px;border:1px dashed #35d9ff77;background:#07101855;color:#fff;border-radius:16px;padding:8px 10px;text-align:left}.object small{display:block;margin-top:3px;opacity:.7}.gate{right:10vw;top:39vh}.desk{right:26vw;bottom:17vh}.friend{right:26vw;top:53vh}.ink .object{background:transparent;border-color:#35d9ff55;color:transparent}.ink .object small{position:absolute;right:2px;bottom:2px;color:#fff;background:#071018c9;padding:3px 7px;border-radius:999px;font-size:9px}.top{position:absolute;z-index:30;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:.14em;text-shadow:0 3px 8px #000}.presets{display:flex;gap:7px}.presets button,.gear{min-height:44px;border:1px solid #ffffff2c;background:#09111bcc;color:#fff;border-radius:999px;padding:0 14px}.presets .on{outline:2px solid #35d9ff}.gear{position:absolute;z-index:40;right:20px;top:72px;width:46px;padding:0;border-radius:14px}.padzone{position:absolute;z-index:50;right:12px;bottom:12px;width:280px;height:260px;touch-action:none;user-select:none}.pad{position:absolute;right:0;bottom:0;width:88px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#536473,#18222d 55%,#05080b 56%);box-shadow:0 0 0 4px #eef6ffcc,0 0 0 9px #101722,0 18px 40px #0009}.pad:after{content:"";position:absolute;left:31%;top:31%;width:38%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7ff3ff,#1aa8d2 58%,#0a4361);box-shadow:0 0 18px #35d9ff}.hint{position:absolute;right:100px;bottom:16px;width:150px;text-align:right;font-size:11px;opacity:.72}.quick{position:absolute;right:64px;bottom:52px;width:520px;height:250px;opacity:0;pointer-events:none;transform:scale(.94);transform-origin:100% 100%;transition:.12s}.quick.open{opacity:1;transform:scale(1)}.qb{position:absolute;width:64px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:7px;text-align:center;color:#10151c;font-size:10px;font-weight:1000;box-shadow:inset 0 4px 9px #fff8,inset 0 -8px 16px #0003,0 10px 20px #0006,0 0 0 3px #fff8}.qb.unavailable{filter:grayscale(1) brightness(.5);opacity:.27!important}.qb[data-p="-4"]{right:420px;bottom:72px;opacity:.18}.qb[data-p="-3"]{right:350px;bottom:104px;opacity:.28}.qb[data-p="-2"]{right:280px;bottom:132px;opacity:.44}.qb[data-p="-1"]{right:208px;bottom:148px;opacity:.72}.qb[data-p="0"]{right:136px;bottom:136px;opacity:1;box-shadow:inset 0 4px 9px #fff9,inset 0 -8px 16px #0003,0 15px 28px #0008,0 0 0 5px #fff,0 0 0 9px #35d9ffaa}.qb[data-p="1"]{right:78px;bottom:98px;opacity:.72}.qb[data-p="2"]{right:46px;bottom:46px;opacity:.44}.qb[data-p="3"]{right:50px;bottom:-12px;opacity:.28}.qb[data-p="4"]{right:88px;bottom:-66px;opacity:.18}.qlabel{position:absolute;right:205px;bottom:72px;min-width:190px;text-align:right;font-weight:1000;text-shadow:0 2px 6px #000}.qlabel small{display:block;font-size:10px;opacity:.68;margin-top:4px}.flash{position:absolute;right:128px;bottom:128px;width:75px;height:75px;border-radius:50%;border:2px solid #fff;opacity:0}.flash.on{animation:flash .16s ease-out}@keyframes flash{0%{opacity:.85;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}.status{position:absolute;z-index:80;left:50%;top:15px;transform:translate(-50%,-100px);background:#071018e8;border:1px solid #ffffff28;border-radius:14px;padding:10px 16px;font-weight:900;transition:.2s}.status.show{transform:translate(-50%,0)}.panel{position:absolute;z-index:100;right:0;top:0;bottom:0;width:min(440px,94vw);padding:18px;background:#070b11f7;border-left:1px solid #ffffff22;overflow:auto;transform:translateX(102%);transition:.22s}.panel.open{transform:none}.phead{position:sticky;top:-18px;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 0 14px;background:#070b11}.phead h2{margin:0}.close{width:44px;aspect-ratio:1;border-radius:12px;border:1px solid #ffffff30;background:#121b25;color:#fff}.section{padding:15px 0;border-top:1px solid #ffffff18}.section p{font-size:11px;opacity:.7;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.edit{aspect-ratio:1;border-radius:50%;border:2px solid #ffffff88;color:#111;font-size:10px;font-weight:1000}.edit.default{outline:3px solid #fff;outline-offset:2px}.edit.unavailable{filter:grayscale(1) brightness(.5);opacity:.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button,.part{min-height:42px;border-radius:12px;border:1px solid #ffffff28;background:#121b25;color:#fff;font-weight:800}.assignment{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:8px 0}.assignment select{min-height:42px;border-radius:10px;border:1px solid #ffffff28;background:#121b25;color:#fff;padding:0 8px}.parts{display:flex;flex-wrap:wrap;gap:8px}.part{padding:8px 11px}.part.on{outline:2px solid #35d9ff}.paid{font-size:9px;margin-left:5px;background:#eee7d8;color:#111;padding:2px 5px;border-radius:999px}.note{font-size:10px;opacity:.62;line-height:1.55;margin-top:10px}@media(max-width:720px){.presets{display:none}.character{left:1vw;width:46vw}.quick{right:28px;scale:.82}.hint{display:none}.padzone{width:44vw}.scene.ink:after{font-size:8vw;right:4vw}.object{min-width:90px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001ms!important}}

<div class="app">
 <div class="scene" id="scene"><div class="character"></div><button class="object gate" data-slot="gate"><b>城門</b><small>バトル</small></button><button class="object desk" data-slot="desk"><b>机のカード</b><small>カード</small></button><button class="object friend" data-slot="friend"><b>相方</b><small>パートナー</small></button></div>
 <div class="top"><div class="brand">◆ GAMEROAD / HOME</div><div class="presets"><button class="on" data-preset="current">既存ホーム構成</button><button data-preset="ink">Ink候補構成</button><button data-preset="mix">混合構成</button></div></div>
 <button class="gear" id="gear">⚙</button><div class="status" id="status"></div>
 <div class="padzone"><div class="quick" id="quick"><div id="track"></div><div class="flash" id="flash"></div><div class="qlabel" id="qlabel"></div></div><div class="hint">押したまま左右へ<br>カチカチ送る</div><div class="pad" id="pad"></div></div>
 <aside class="panel" id="panel"><div class="phead"><h2>HOME CUSTOM</h2><button class="close" id="close">×</button></div><div class="section"><h3>クイックセット</h3><p>同じ大きさのボタンを並べ替えます。白枠が「動かさず離した時」の項目です。</p><div class="grid" id="grid"></div><div class="actions"><button id="left">← 左へ</button><button id="right">右へ →</button></div></div><div class="section"><h3>ホーム上の分岐</h3><p>人物・物・場所ごとに好きな行き先を割り当てます。</p><div id="assign"></div></div><div class="section"><h3>ホーム部品</h3><p>完成テーマでも、背景・人物・文字・動きの混在でも使えます。課金候補は価格を発明せず部品としてだけ表示します。</p><h4>背景</h4><div class="parts" id="bg"></div><h4>人物</h4><div class="parts" id="ch"></div><h4>文字・形</h4><div class="parts" id="ty"></div><h4>動き</h4><div class="parts" id="mo"></div><div class="note">購入処理・価格・商品番号・所持判定は未接続。これは見た目と操作を判断する候補です。</div></div></aside>
</div>
<script>
(()=>{const A={battle:['バトル','#ff5f65',1],cards:['カード','#ffd24c',1],partner:['パートナー','#63d7ff',1],shop:['ショップ','#7cef84',1],missions:['ミッション','#b18cff',1],gacha:['ガチャ','#ff78c8',1],records:['記録','#7fd0c5',1],profile:['プロフィール','#ffc68a',1],settings:['設定','#d9e2ec',1],tea:['お茶会','#e6a879',1],season:['シーズン','#8da1b5',0]},S={order:Object.keys(A),def:0,sel:0,edit:0,assign:{gate:'battle',desk:'cards',friend:'partner'},parts:{bg:'current',char:'base',type:'clean',motion:'float'}},$=s=>document.querySelector(s),scene=$('#scene'),quick=$('#quick'),track=$('#track'),qlabel=$('#qlabel'),flash=$('#flash'),pad=$('#pad'),status=$('#status');const mod=(n,m)=>((n%m)+m)%m,at=i=>S.order[mod(i,S.order.length)];function rq(){track.innerHTML='';[-4,-3,-2,-1,0,1,2,3,4].forEach(p=>{const k=at(S.sel+p),a=A[k],b=document.createElement('div');b.className='qb'+(a[2]?'':' unavailable');b.dataset.p=p;b.style.background=a[1];b.textContent=a[0];track.append(b)});const a=A[at(S.sel)];qlabel.innerHTML=a[0]+`<small>${a[2]?'↻ 左右にカチカチ循環 ・ 離すと決定':'↻ 左右に循環 ・ 現在は使用できません'}</small>`}function det(n){if(!n)return;S.sel=mod(S.sel+n,S.order.length);rq();flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');navigator.vibrate?.(8)}function msg(t){status.textContent=t;status.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>status.classList.remove('show'),900)}let id=null,x0=0,y0=0,last=0,cancel=0;pad.onpointerdown=e=>{if(id!==null)return;id=e.pointerId;x0=e.clientX;y0=e.clientY;last=0;cancel=0;S.sel=S.def;pad.setPointerCapture(id);quick.classList.add('open');rq()};pad.onpointermove=e=>{if(e.pointerId!==id)return;const dx=e.clientX-x0,dy=e.clientY-y0;cancel=Math.hypot(dx,dy)>Math.min(innerWidth,innerHeight)*.34||dy>130;quick.style.filter=cancel?'grayscale(1) brightness(.58)':'';if(cancel)return;const step=Math.trunc(dx/38);if(step!==last){det(step-last);last=step}};function finish(e,ok){if(e.pointerId!==id)return;if(ok&&!cancel){const a=A[at(S.sel)];msg(a[2]?a[0]+' を開く':a[0]+' は現在使えません')}id=null;quick.classList.remove('open');quick.style.filter=''}pad.onpointerup=e=>finish(e,1);pad.onpointercancel=e=>finish(e,0);function editor(){const g=$('#grid');g.innerHTML='';S.order.forEach((k,i)=>{const a=A[k],b=document.createElement('button');b.className='edit'+(i===S.def?' default':'')+(a[2]?'':' unavailable');b.style.background=a[1];b.textContent=a[0];b.onclick=()=>{S.edit=i;S.def=i;editor()};if(i===S.edit)b.style.boxShadow='0 0 0 4px #35d9ff';g.append(b)})}function move(d){const i=S.edit,j=mod(i+d,S.order.length);[S.order[i],S.order[j]]=[S.order[j],S.order[i]];if(S.def===i)S.def=j;else if(S.def===j)S.def=i;S.edit=j;editor()}$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);function assignments(){const host=$('#assign');host.innerHTML='';[['gate','城門'],['desk','机のカード'],['friend','相方']].forEach(([slot,label])=>{const row=document.createElement('div');row.className='assignment';const l=document.createElement('span');l.textContent=label;const s=document.createElement('select');Object.entries(A).filter(([,a])=>a[2]).forEach(([k,a])=>s.add(new Option(a[0],k)));s.value=S.assign[slot];s.onchange=()=>{S.assign[slot]=s.value;document.querySelector(`[data-slot="${slot}"] small`).textContent=A[s.value][0]};row.append(l,s);host.append(row)})}document.querySelectorAll('.object').forEach(b=>b.onclick=()=>msg(b.querySelector('small').textContent+' を開く'));function parts(){const defs={bg:[['current','草原',0],['ink','Ink',0],['night','夜景',1]],ch:[['base','青の相方',0],['ink','Ink人物',1],['none','人物なし',0]],ty:[['clean','静かな文字',0],['ink','切り紙文字',1]],mo:[['float','人物ゆらぎ',0],['pulse','物の鼓動',1],['none','動きなし',0]]};Object.entries(defs).forEach(([kind,list])=>{const h=$('#'+kind);list.forEach(([k,label,paid])=>{const b=document.createElement('button');b.className='part'+(S.parts[kind]===k?' on':'');b.innerHTML=label+(paid?'<span class="paid">課金候補</span>':'');b.onclick=()=>{S.parts[kind]=k;if(kind==='bg')scene.classList.toggle('ink',k==='ink');partsRefresh()};h.append(b)})})}function partsRefresh(){document.querySelectorAll('.parts').forEach(h=>h.innerHTML='');parts()}document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('on'));b.classList.add('on');scene.classList.toggle('ink',b.dataset.preset!=='current');msg(b.textContent+' に切替')});$('#gear').onclick=()=>{$('#panel').classList.add('open');editor();assignments();partsRefresh()};$('#close').onclick=()=>$('#panel').classList.remove('open');editor();assignments();partsRefresh()})();
</script>
