name: TEMP Advice Partner independent public acceptance R16

on:
  push:
    branches:
      - sol/partner-advice-independent-public-r16-20260912

permissions:
  contents: read

jobs:
  public-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUBLIC_BASE: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD: 75f4f47c60eb2c478e8314dd1dd1b6e1955571ee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind stable public build
        shell: bash
        run: |
          set -euo pipefail
          build=$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE/gameroad-version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).build_id||'')))")
          echo "PUBLIC_BUILD=$build"
          test "$build" = "$EXPECTED_BUILD"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Diagnose normal and Advice Partner save split on stable public
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r16-public
          cat > .r16-public/partner-advice-r16.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 667, height: 375 } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(e.message));
            const gotoRoot = async () => {
              const response = await page.goto(process.env.PUBLIC_BASE + '/', { waitUntil: 'domcontentloaded', timeout: 30_000 });
              assert.ok(response?.ok(), `root status=${response?.status()}`);
              await page.locator('section[data-screen="home"]').waitFor({ state: 'visible', timeout: 12_000 });
              await page.waitForTimeout(450);
            };
            const snapshot = async () => page.evaluate(() => {
              const t = window.__GAMEROAD_TEST__;
              const raw = localStorage.getItem('gameroad.browser.v10.core.1');
              let saved = null;
              try { saved = raw ? JSON.parse(raw) : null; } catch {}
              return {
                screen: t?.state?.screen || null,
                selectedPartnerId: t?.state?.selectedPartnerId || null,
                advicePartnerId: t?.state?.settings?.advicePartnerId || null,
                roster: Object.keys(t?.state?.partnerProfiles || {}),
                savedKeys: saved && typeof saved === 'object' ? Object.keys(saved).sort() : [],
                savedSelectedPartnerId: saved?.selectedPartnerId ?? null,
                savedAdvicePartnerId: saved?.settings?.advicePartnerId ?? null,
              };
            });

            await gotoRoot();
            const chars = page.locator('[data-home-target="characters"]:visible, [data-go="characters"]:visible').first();
            assert.equal(await chars.count(), 1, 'Home→Characters missing');
            await chars.click();
            const charScreen = page.locator('section[data-screen="characters"]');
            await charScreen.waitFor({ state: 'visible', timeout: 7_000 });
            const partnerRole = charScreen.locator('button:visible,[role="button"]:visible').filter({ hasText: /^パートナー/ }).first();
            if (await partnerRole.count()) await partnerRole.click();
            const roster = page.locator('#charRoster');
            await roster.waitFor({ state: 'visible', timeout: 5_000 });
            const mato = roster.locator('button:visible').filter({ hasText: /泊愛まと/ }).first();
            assert.equal(await mato.count(), 1, '泊愛まと normal Partner card missing');
            await mato.click();
            await page.waitForTimeout(300);
            const normalSet = await snapshot();
            console.log('ADVICE_PUBLIC normal_set=' + JSON.stringify(normalSet));
            assert.equal(normalSet.selectedPartnerId, 'partner.mato');

            // Stay in the same document: prove the Battle Advice control is independently mutable before reload.
            const directBattle = page.locator('[data-go="battle"]:visible').first();
            if (await directBattle.count()) {
              await directBattle.click();
            } else {
              const homeControl = page.locator('[data-go="home"]:visible,[data-home-target="home"]:visible').first();
              assert.equal(await homeControl.count(), 1, 'Characters→Home/Battle route missing');
              await homeControl.click();
              await page.locator('section[data-screen="home"]').waitFor({ state: 'visible', timeout: 5_000 });
              const battleFromHome = page.locator('[data-home-target="battle"]:visible,[data-go="battle"]:visible').first();
              assert.equal(await battleFromHome.count(), 1, 'Home→Battle missing');
              await battleFromHome.click();
            }

            const battle = page.locator('section[data-screen="battle"]');
            await battle.waitFor({ state: 'visible', timeout: 7_000 });
            const switchButton = battle.locator('.partnerAdvicePartnerSwitch:visible').first();
            await switchButton.waitFor({ state: 'visible', timeout: 7_000 });
            assert.equal(await switchButton.isEnabled(), true, 'Advice Partner switch disabled');
            const roleName = battle.locator('[data-role="advice-partner-name"]:visible').first();
            const before = await snapshot();
            console.log('ADVICE_PUBLIC before_switch=' + JSON.stringify({ ...before, roleName: ((await roleName.textContent()) || '').trim() }));
            assert.equal(before.selectedPartnerId, 'partner.mato', 'normal Partner changed before Advice switch');

            await switchButton.click();
            await page.waitForTimeout(350);
            const after = await snapshot();
            const afterName = ((await roleName.textContent()) || '').trim();
            const visiblePartnerSpeech = await battle.locator('.partnerAdviceSpeech.partner.on:visible').allTextContents();
            console.log('ADVICE_PUBLIC after_switch=' + JSON.stringify({ ...after, roleName: afterName, visiblePartnerSpeech }));
            assert.equal(after.selectedPartnerId, 'partner.mato', 'Advice switch mutated normal selectedPartnerId');
            assert.ok(after.advicePartnerId, 'Advice switch did not set advicePartnerId');
            assert.notEqual(after.advicePartnerId, after.selectedPartnerId, 'Advice Partner was forced equal to normal Partner');
            if (after.advicePartnerId !== 'partner.saasuna') {
              const leakedSaasuna = visiblePartnerSpeech.some((text) => /優秀なんですよ、私|がっぽり|大氷結|ゆるしてヒヤシンス|バトルカード、セット/.test(text));
              assert.equal(leakedSaasuna, false, 'unsupported Advice Partner leaked Saasuna dialogue');
            }

            const expectedAdvice = after.advicePartnerId;
            await gotoRoot();
            const reloaded = await snapshot();
            console.log('ADVICE_PUBLIC reloaded=' + JSON.stringify(reloaded));
            assert.equal(reloaded.advicePartnerId, expectedAdvice, 'Advice Partner did not persist after reload');
            // Do not hide the reproduced regular-Partner defect: report it explicitly without weakening it into PASS.
            assert.notEqual(reloaded.selectedPartnerId, 'partner.mato', 'diagnostic expected the already reproduced regular Partner persistence defect');
            assert.deepEqual(pageErrors, [], `page errors: ${pageErrors.join(' | ')}`);
            console.log(`ADVICE_PUBLIC DIAG_PASS same_session_independent=true advice_persisted=true regular_persisted=false normal_before=partner.mato advice=${expectedAdvice} normal_after=${reloaded.selectedPartnerId}`);
          } finally {
            await browser.close();
          }
          NODE
          node .r16-public/partner-advice-r16.mjs
          rm -rf .r16-public
