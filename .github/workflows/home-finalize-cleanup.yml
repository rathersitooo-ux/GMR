name: Finalize Home cleanup candidate

on:
  push:
    branches:
      - work/BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001
    paths:
      - '.github/workflows/home-finalize-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize-home-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Cross-check patched Browser against baseline main
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';

          const BASE='480fdeb3cf17509337de7a78e3f429516a560370';
          const EXPECTED_PATCH_BLOB='4fa1eb5d6525f2d93810278ef733185a3c29701f';
          const current=await readFile('browser/GAMEROAD.html','utf8');
          const currentBuf=Buffer.from(current,'utf8');
          const blob=spawnSync('git',['hash-object','browser/GAMEROAD.html'],{encoding:'utf8'}).stdout.trim();
          if(blob!==EXPECTED_PATCH_BLOB||currentBuf.byteLength!==11794228)throw Error(`patched identity mismatch ${blob}/${currentBuf.byteLength}`);
          const baseRun=spawnSync('git',['show',`${BASE}:browser/GAMEROAD.html`],{encoding:null,maxBuffer:32*1024*1024});
          if(baseRun.status!==0)throw Error('failed to read baseline Browser from Git history');
          const baseline=baseRun.stdout.toString('utf8');
          const digest=s=>createHash('sha256').update(s).digest('hex');
          const count=(s,n)=>s.split(n).length-1;
          const dataGoElements=s=>[...s.matchAll(/<[^>]+\bdata-go\s*=/gi)].length;
          const extract=(s,re,label)=>{const v=s.match(re)?.[0];if(!v)throw Error(`missing ${label}`);return v};
          const protectedRegions={
            state:/const state=\{[^\n]+\};/,
            roster:/const PROD_CHARS=\[[\s\S]*?\];/,
            saveLoad:/function save\(\)\{[^\n]+\}\nfunction load\(\)\{[^\n]+\}/,
          };
          for(const [label,re] of Object.entries(protectedRegions)){
            const a=digest(extract(baseline,re,`baseline ${label}`)),b=digest(extract(current,re,`current ${label}`));
            if(a!==b)throw Error(`protected ${label} changed ${a} -> ${b}`);
          }
          for(const token of ['partner.naki','selectedPartnerId','playerCharacterId','navigateDetail']){
            if(count(current,token)!==count(baseline,token))throw Error(`protected token count changed ${token}`);
          }
          if(dataGoElements(current)!==dataGoElements(baseline))throw Error('actual data-go element count changed');
          for(const token of ['homeRuntime','homeCharName','homeLivePartner','homeMount','codexHeroRuntime'])if(count(current,token)!==0)throw Error(`${token} remains: ${count(current,token)}`);
          if(count(current,"mountChar('#homeRuntime'")!==0)throw Error('Home character mount remains');
          if(count(current,"document.getElementById('homeLivePartner')")!==0)throw Error('Battle still reads Home partner DOM');
          if(count(current,"publicPartner=(typeof partnerInfo==='function'?partnerInfo()?.name:'')?.trim();")!==1)throw Error('Battle partner state lookup not unique');
          if(count(current,'data-formal-background="missing"')!==1)throw Error('formal background MISSING marker not unique');
          if(!current.includes('<html lang="ja" class="grCodexHomeActive">'))throw Error('initial Home shell class missing');
          if(!current.includes("document.documentElement.classList.toggle('grCodexHomeActive',name==='home')"))throw Error('Home shell lifecycle missing');
          const home=current.match(/<section\b[^>]*data-screen=["']home["'][^>]*>[\s\S]*?<\/section\s*>/i)?.[0];
          if(!home)throw Error('Home section missing');
          const targets=[...home.matchAll(/data-home-target=["']([^"']+)["']/gi)].map(m=>m[1]).sort();
          if(JSON.stringify(targets)!==JSON.stringify(['cards','characters','setup','shop']))throw Error(`Home targets changed ${JSON.stringify(targets)}`);
          for(const legacy of ['homeScene','homeCopy','homeLiveCard','homeRail','homeCmd','homeDock','homeMotionField','homeMotionMediaSlot','homeFoot']){
            if(new RegExp(`class=["'][^"']*(?:^|\\s)${legacy}(?:\\s|$)`,'i').test(home))throw Error(`legacy Home DOM class remains ${legacy}`);
          }
          console.log('HOME_POSTCHECK_PASS',JSON.stringify({base:BASE,blob,bytes:currentBuf.byteLength,sha256:digest(current),homeTargets:targets,dataGoElements:dataGoElements(current)}));
          NODE
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Remove all one-shot Home audit and patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- audit
          git rm -- \
            .github/scripts/home-apply-cleanup.mjs \
            .github/scripts/home-audit-split.mjs \
            .github/scripts/home-codex-css-audit.mjs \
            .github/scripts/home-current-audit.mjs \
            .github/scripts/home-patch-context-audit.mjs \
            .github/workflows/home-apply-cleanup.yml \
            .github/workflows/home-audit-split.yml \
            .github/workflows/home-codex-css-audit.yml \
            .github/workflows/home-current-audit.yml \
            .github/workflows/home-patch-context-audit.yml \
            .github/workflows/home-finalize-cleanup.yml
          test "$(git diff --cached --name-only | grep -Ev '^(audit/|\.github/scripts/home-|\.github/workflows/home-)' || true)" = ""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001] remove one-shot audit machinery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
