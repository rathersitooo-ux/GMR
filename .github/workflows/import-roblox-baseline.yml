name: Diagnose broad single-character transport shift

on:
  push:
    branches:
      - work/GITHUB-ROBLOX-CODE-PLACEMENT-001
    paths:
      - .github/workflows/import-roblox-baseline.yml

permissions:
  contents: read

jobs:
  diagnose-broad-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Search all single deletions before the first observed XZ corruption
        shell: bash
        env:
          EXPECTED_SIZE: "10245508"
          EXPECTED_SHA256: b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/GITHUB-ROBLOX-CODE-PLACEMENT-001"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, time

          expected_size = 10245508
          expected_sha = "b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51"
          cat = b"".join(b"".join(Path(f".github/import/roblox-baseline.part{i:03d}.b64").read_bytes().split()) for i in range(10))
          assert len(cat) == 159001 and len(cat) % 4 == 1

          # The uncorrected stream first fails around compressed byte 18016.
          # Test every possible single inserted base64 character before that point,
          # but only decompress a prefix for pruning. A true correction must survive
          # past the old failure before it is allowed to do a full decompression.
          search_hi = min(len(cat), 26000)
          probe_packed = 22000
          survivors = []
          t0 = time.time()

          for i in range(search_hi):
              cand = cat[:i] + cat[i+1:]
              try:
                  cp = base64.b64decode(cand, validate=True)
              except Exception:
                  continue
              dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              try:
                  raw_prefix = dec.decompress(cp[:probe_packed])
              except lzma.LZMAError:
                  continue
              # Wrong shifts that happen to parse should not be accepted merely for parsing.
              # Survive beyond the previous corruption with nontrivial output before full test.
              if len(raw_prefix) < 114500:
                  continue
              survivors.append((i, len(raw_prefix), dec.eof))
              print(f"SURVIVOR delete_index={i} removed={cat[i:i+1]!r} prefix_raw={len(raw_prefix)} eof={dec.eof}")
              try:
                  raw = lzma.decompress(cp, format=lzma.FORMAT_XZ)
              except lzma.LZMAError:
                  continue
              size = len(raw)
              sha = hashlib.sha256(raw).hexdigest()
              print(f"FULL_DECOMPRESS delete_index={i} raw_size={size} raw_sha={sha}")
              if size == expected_size and sha == expected_sha:
                  print(f"EXACT_SINGLE_DELETE_RECOVERY index={i} removed={cat[i:i+1]!r}")
                  Path("/tmp/recovered-delete-index.txt").write_text(str(i))
                  raise SystemExit(0)

          print(f"searched=0:{search_hi} elapsed={time.time()-t0:.2f}s survivors={survivors[:50]} total_survivors={len(survivors)}")
          print("NO_EXACT_SINGLE_DELETE_RECOVERY_BEFORE_FIRST_FAILURE")
          raise SystemExit(63)
          PY
