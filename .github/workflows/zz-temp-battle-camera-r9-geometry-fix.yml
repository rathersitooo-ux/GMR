name: TEMP Battle Camera R9 Geometry Fix

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-final-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact 667 return-control clearance fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text(encoding='utf-8')
          old='bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px))'
          new='bottom:max(180px,calc(env(safe-area-inset-bottom) + 180px))'
          if s.count(old)!=1:
              raise SystemExit(f'expected one 108px camera-return bottom anchor, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          node --test tests/battle-camera-control-core.test.mjs tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
      - name: Commit product fix and remove writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-battle-camera-r9-geometry-fix.yml
          git add browser/GAMEROAD.html
          git diff --cached --check
          git commit -m 'Battle: カメラ復帰をSlidePad上へ逃がす R9'
          git push origin HEAD:sol/battle-camera-visual-r9-final-20260914
