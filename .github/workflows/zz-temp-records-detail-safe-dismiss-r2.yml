name: zz-temp Records detail safe dismiss R2

on:
  push:
    branches:
      - sol/records-detail-safe-dismiss-r2-20260908

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/records-detail-safe-dismiss-r2-20260908
          fetch-depth: 0
      - name: Verify exact base product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/profile-presentation-runtime-mount.mjs)" = "fd9fbf5a8566e88e0024ef21b33f697dc34cd596"
          test "$(git hash-object tests/profile-presentation-runtime-mount.test.mjs)" = "b243238ac2ae28f374b5f94b5bf4f15900d08257"
      - name: Apply exact presentation-only patch
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('browser/profile-presentation-runtime-mount.mjs')
          source = source_path.read_text()

          old_select = '''function selectRecordRow(row, list, panel) {
            if (!row || !list || !panel) return;
            for (const candidate of list.querySelectorAll('.record')) {
              const selected = candidate === row;
              candidate.dataset.recordsSelected = selected ? 'true' : 'false';
              candidate.setAttribute('aria-expanded', selected ? 'true' : 'false');
            }

            const summary = recordSummaryText(row);
            const summaryNode = panel.querySelector('.recordsMatchDetailSummary');
            if (summaryNode) summaryNode.textContent = summary || '対戦内容を確認できませんでした。';
            panel.hidden = false;
          }

          function bindRecordsInteraction(list, panel) {
            if (list.dataset.recordsInteractionBound === 'true') return;
            list.dataset.recordsInteractionBound = 'true';

            list.addEventListener('click', (event) => {
              const row = event.target?.closest?.('.record');
              if (!row || !list.contains(row)) return;
              selectRecordRow(row, list, panel);
            });

            list.addEventListener('keydown', (event) => {
              if (event.key !== 'Enter' && event.key !== ' ') return;
              const row = event.target?.closest?.('.record');
              if (!row || event.target !== row || !list.contains(row)) return;
              event.preventDefault();
              selectRecordRow(row, list, panel);
            });
          }
          '''

          new_select = '''export function dismissRecordsMatchDetail(list, panel, { restoreFocus = true } = {}) {
            if (!list || !panel || panel.hidden) return false;
            const opener = panel.__gameroadRecordsOpener ?? null;
            for (const candidate of list.querySelectorAll('.record')) {
              candidate.dataset.recordsSelected = 'false';
              candidate.setAttribute('aria-expanded', 'false');
            }
            panel.hidden = true;
            panel.__gameroadRecordsOpener = null;
            if (restoreFocus && typeof opener?.focus === 'function') {
              try {
                opener.focus({ preventScroll: true });
              } catch {
                opener.focus();
              }
            }
            return true;
          }

          function selectRecordRow(row, list, panel) {
            if (!row || !list || !panel) return;
            panel.__gameroadRecordsOpener = row;
            for (const candidate of list.querySelectorAll('.record')) {
              const selected = candidate === row;
              candidate.dataset.recordsSelected = selected ? 'true' : 'false';
              candidate.setAttribute('aria-expanded', selected ? 'true' : 'false');
            }

            const summary = recordSummaryText(row);
            const summaryNode = panel.querySelector('.recordsMatchDetailSummary');
            if (summaryNode) summaryNode.textContent = summary || '対戦内容を確認できませんでした。';
            panel.hidden = false;
          }

          function bindRecordsInteraction(screen, list, panel, doc) {
            if (screen.dataset.recordsInteractionBound === 'true') return;
            screen.dataset.recordsInteractionBound = 'true';

            list.addEventListener('click', (event) => {
              const row = event.target?.closest?.('.record');
              if (!row || !list.contains(row)) return;
              selectRecordRow(row, list, panel);
            });

            list.addEventListener('keydown', (event) => {
              if (event.key !== 'Enter' && event.key !== ' ') return;
              const row = event.target?.closest?.('.record');
              if (!row || event.target !== row || !list.contains(row)) return;
              event.preventDefault();
              selectRecordRow(row, list, panel);
            });

            doc.addEventListener('click', (event) => {
              if (panel.hidden || !screen.classList.contains('active') || panel.contains(event.target)) return;
              event.preventDefault();
              event.stopPropagation();
              dismissRecordsMatchDetail(list, panel);
            }, true);

            doc.addEventListener('keydown', (event) => {
              if (event.key !== 'Escape' || panel.hidden || !screen.classList.contains('active')) return;
              event.preventDefault();
              event.stopPropagation();
              dismissRecordsMatchDetail(list, panel);
            }, true);
          }
          '''

          if source.count(old_select) != 1:
            raise SystemExit('expected select/bind block exactly once')
          source = source.replace(old_select, new_select, 1)

          old_bind = '  bindRecordsInteraction(list, panel);\n'
          new_bind = '  bindRecordsInteraction(screen, list, panel, doc);\n'
          if source.count(old_bind) != 1:
            raise SystemExit('expected mount bind call exactly once')
          source = source.replace(old_bind, new_bind, 1)
          source_path.write_text(source)

          test_path = Path('tests/profile-presentation-runtime-mount.test.mjs')
          tests = test_path.read_text()
          old_import = '''  PROFILE_PRESENTATION_CONTRACT,
            projectProfilePresentation,
            readCurrentProfileAuthority,
          } from '../browser/profile-presentation-runtime-mount.mjs';'''
          new_import = '''  PROFILE_PRESENTATION_CONTRACT,
            dismissRecordsMatchDetail,
            projectProfilePresentation,
            readCurrentProfileAuthority,
          } from '../browser/profile-presentation-runtime-mount.mjs';'''
          if tests.count(old_import) != 1:
            raise SystemExit('expected import block exactly once')
          tests = tests.replace(old_import, new_import, 1)

          addition = r'''

          test('Records detail dismiss clears transient selection and restores its opener focus', () => {
            const focusCalls = [];
            const opener = { focus: (options) => focusCalls.push(options) };
            const rows = [
              { dataset: { recordsSelected: 'true' }, setAttribute(name, value) { this[name] = value; } },
              { dataset: { recordsSelected: 'false' }, setAttribute(name, value) { this[name] = value; } },
            ];
            const list = { querySelectorAll: () => rows };
            const panel = { hidden: false, __gameroadRecordsOpener: opener };

            assert.equal(dismissRecordsMatchDetail(list, panel), true);
            assert.equal(panel.hidden, true);
            assert.equal(panel.__gameroadRecordsOpener, null);
            assert.deepEqual(rows.map((row) => row.dataset.recordsSelected), ['false', 'false']);
            assert.deepEqual(rows.map((row) => row['aria-expanded']), ['false', 'false']);
            assert.deepEqual(focusCalls, [{ preventScroll: true }]);
            assert.equal(dismissRecordsMatchDetail(list, panel), false);
          });

          test('Records detail consumes safe outside click and Escape without a second state authority', () => {
            const source = readFileSync(new URL('../browser/profile-presentation-runtime-mount.mjs', import.meta.url), 'utf8');
            assert.match(source, /doc\.addEventListener\('click',[\s\S]*?panel\.contains\(event\.target\)[\s\S]*?event\.preventDefault\(\);[\s\S]*?event\.stopPropagation\(\);[\s\S]*?dismissRecordsMatchDetail\(list, panel\);[\s\S]*?}, true\);/);
            assert.match(source, /doc\.addEventListener\('keydown',[\s\S]*?event\.key !== 'Escape'[\s\S]*?dismissRecordsMatchDetail\(list, panel\);[\s\S]*?}, true\);/);
            assert.doesNotMatch(source, /localStorage|sessionStorage/);
          });
          '''
          if 'Records detail dismiss clears transient selection' in tests:
            raise SystemExit('dismiss tests already present')
          tests += addition
          test_path.write_text(tests)
      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/profile-presentation-runtime-mount.test.mjs
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort)" = $'browser/profile-presentation-runtime-mount.mjs\ntests/profile-presentation-runtime-mount.test.mjs'
      - name: Commit product-only final tree
        shell: bash
        env:
          BRANCH: sol/records-detail-safe-dismiss-r2-20260908
        run: |
          set -euo pipefail
          git config user.name "gameroad-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/zz-temp-records-detail-safe-dismiss-r2.yml
          git rm data/preaction-authorizations/RECORDS-DETAIL-DISMISS-R2-20260908T0849-SOL-Q6N4V8.json
          git add browser/profile-presentation-runtime-mount.mjs tests/profile-presentation-runtime-mount.test.mjs
          git commit -m "UI: safely dismiss Records match detail"
          git push origin "HEAD:${BRANCH}"
