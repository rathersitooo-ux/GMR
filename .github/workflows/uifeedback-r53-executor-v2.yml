name: UIFEEDBACK R53 Executor V2

on:
  push:
    branches:
      - work/uifeedback-r53-readyplan-material-visible-20260825-1644

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/uifeedback-r53-readyplan-material-visible-20260825-1644
      - name: Verify base
        run: test "$(git merge-base HEAD origin/main)" = "562b6cf535aa74ec4d791483ed2c8abfa0ff7905"
      - name: Apply authorized patch
        run: python .github/scripts/uifeedback-r53-patch.py
      - name: Run focused tests
        run: |
          node --test tests/ui-state-feedback-ready-plan-adapter.test.mjs
          node --test tests/ui-state-feedback-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
      - name: Commit durable scope
        run: |
          rm -f .github/scripts/uifeedback-r53-patch.py
          rm -f .github/workflows/uifeedback-r53-bounded-executor.yml
          rm -f .github/workflows/uifeedback-r53-executor-v2.yml
          rm -f data/preaction-authorizations/UIFEEDBACK-R53-READYPLAN-MATERIAL-VISIBLE-20260825T1644-SOL.json
          git add -A
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' browser/ui-state-feedback-ready-plan-adapter.mjs deploy/cloudflare/tests/build.test.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "UIFEEDBACK R53: project material feedback in ReadyPlan consumer"
          git push origin HEAD:work/uifeedback-r53-readyplan-material-visible-20260825-1644
