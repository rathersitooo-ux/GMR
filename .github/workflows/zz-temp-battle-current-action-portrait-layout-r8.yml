name: TEMP Battle current-action portrait layout R8

on:
  push:
    branches:
      - sol/battle-current-action-portrait-layout-r8-20260914
    paths:
      - .github/workflows/zz-temp-battle-current-action-portrait-layout-r8.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-current-action-portrait-layout-r8-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authorized base and patch owner layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 44120519c4225420b7e2e3001f63f8cb332e58a8)" = "44120519c4225420b7e2e3001f63f8cb332e58a8"
          python3 <<'PY'
          from pathlib import Path
          path = Path('browser/battle-current-player-ui-runtime.mjs')
          text = path.read_text()
          marker = '@media(max-width:520px) and (orientation:portrait){\n'
          rule = '  .screen.battle[${ROOT_ATTR}="1"] [${ZONE_ATTR}="current-action"]{transform:translateY(6px)!important}\n'
          if text.count(marker) != 1:
              raise SystemExit(f'portrait marker count={text.count(marker)}')
          if rule in text:
              raise SystemExit('portrait current-action owner rule already exists')
          generic = '[${ZONE_ATTR}="current-action"]{position:absolute!important;z-index:32!important;top:calc(var(--gr-ui-edge) + clamp(42px,9vh,72px))!important;left:var(--gr-ui-edge)!important;right:auto!important;bottom:auto!important;max-width:min(38vw,310px)!important;transform:none!important;'
          if generic not in text:
              raise SystemExit('generic owner transform anchor missing')
          text = text.replace(marker, marker + rule, 1)
          path.write_text(text)

          test = Path('tests/battle-current-action-portrait-layout-owner.test.mjs')
          test.write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync(new URL('../browser/battle-current-player-ui-runtime.mjs', import.meta.url), 'utf8');
          const marker = '@media(max-width:520px) and (orientation:portrait){';
          const ownerRule = '.screen.battle[${ROOT_ATTR}="1"] [${ZONE_ATTR}="current-action"]{transform:translateY(6px)!important}';
          const genericOwner = '[${ZONE_ATTR}="current-action"]{position:absolute!important;z-index:32!important;top:calc(var(--gr-ui-edge) + clamp(42px,9vh,72px))!important;left:var(--gr-ui-edge)!important;right:auto!important;bottom:auto!important;max-width:min(38vw,310px)!important;transform:none!important;';

          const mediaIndex = source.indexOf(marker);
          const ruleIndex = source.indexOf(ownerRule);
          assert.ok(mediaIndex >= 0, 'portrait media owner must exist');
          assert.ok(ruleIndex > mediaIndex, 'portrait current-action override must live after portrait media marker');
          assert.ok(source.includes(genericOwner), 'generic layout owner remains transform:none!important');
          assert.equal(source.match(/transform:translateY\(6px\)!important/g)?.length, 1, 'only the bounded portrait owner override is added');
          console.log('battle-current-action-portrait-layout-owner: owner-layer override regression passed');
          ''')
          PY
          git diff --check
          git diff -- browser/battle-current-player-ui-runtime.mjs tests/battle-current-action-portrait-layout-owner.test.mjs
      - name: Run focused regressions
        run: |
          set -euo pipefail
          node --test tests/battle-current-action-portrait-layout-owner.test.mjs
          node --test tests/battle-current-player-ui-runtime.test.mjs
      - name: Commit only durable product paths
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add browser/battle-current-player-ui-runtime.mjs tests/battle-current-action-portrait-layout-owner.test.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "browser/battle-current-player-ui-runtime.mjs tests/battle-current-action-portrait-layout-owner.test.mjs "
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git commit -m 'Battle: portrait current-action spacing belongs to layout owner'
          git push origin HEAD:sol/battle-current-action-portrait-layout-r8-20260914
