name: Home Contextual Tutorial Replay R1B Apply

on:
  push:
    branches:
      - work/home-contextual-tutorial-replay-r1b-20260905
    paths:
      - .github/workflows/home-contextual-tutorial-replay-r1b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/home-contextual-tutorial-replay-r1b-20260905
          fetch-depth: 0
      - name: Configure local committer identity
        run: |
          git config user.name "gameroad-bot"
          git config user.email "gameroad-bot@users.noreply.github.com"
      - name: Fetch verified donor history
        run: git fetch origin work/home-contextual-tutorial-replay-r1-20260905
      - name: Reuse verified product commit
        run: git cherry-pick 902e1b598760bc8834e982383456c7a98e02274c
      - name: Verify exact product commit scope
        shell: bash
        run: |
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = $'browser/home-boot-runtime-mount.mjs\ntests/home-boot-presentation.test.mjs'
      - name: Run focused Home tests
        run: node --test tests/home-boot-presentation.test.mjs
      - name: Verify product diff against authorization base
        shell: bash
        run: |
          git diff --name-only d257e551b54814a97a338d6a6c41f6297dd0c037...HEAD | grep -v '^data/preaction-authorizations/' | grep -v '^.github/workflows/home-contextual-tutorial-replay-r1b-apply.yml$' | sort > /tmp/product-paths.txt
          test "$(cat /tmp/product-paths.txt)" = $'browser/home-boot-runtime-mount.mjs\ntests/home-boot-presentation.test.mjs'
      - name: Push verified product commit
        run: git push origin HEAD:work/home-contextual-tutorial-replay-r1b-20260905
