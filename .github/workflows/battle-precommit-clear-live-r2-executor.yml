name: Battle Precommit Clear Live R2 Executor

on:
  push:
    branches:
      - sol/battle-precommit-clear-live-r2-20260905
    paths:
      - .github/workflows/battle-precommit-clear-live-r2-executor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact bounded product and acceptance patch
        shell: bash
        env:
          HTML_BLOCK_B64: 
          BFI_BLOCK_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          html_path = Path('browser/GAMEROAD.html')
          build_path = Path('deploy/cloudflare/scripts/build.mjs')
          bfi_path = Path('tests/browser-full-interaction.spec.mjs')

          html = html_path.read_text(encoding='utf-8')
          marker = 'GAMEROAD_BATTLE_PRECOMMIT_CLEAR_LIVE_R2'
          anchor = 'window.GAMEROAD_PARTNER_STATE=Object.freeze('
          if marker not in html:
              if html.count(anchor) != 1:
                  raise SystemExit(f'HTML anchor count drift: {html.count(anchor)}')
              block = base64.b64decode(os.environ['HTML_BLOCK_B64']).decode('utf-8')
              html_path.write_text(html.replace(anchor, block + anchor, 1), encoding='utf-8')

          build = build_path.read_text(encoding='utf-8')
          artifact = "  { source: 'browser/battle-precommit-clear-core.mjs', output: 'battle-precommit-clear-core.mjs', artifact: 'battle_precommit_clear_core', label: 'Battle precommit clear core' },"
          build_anchor = "  { source: 'browser/battle-auto-input-core.mjs', output: 'battle-auto-input-core.mjs', artifact: 'battle_auto_input_core', label: 'Battle Auto input core' },"
          if artifact not in build:
              if build.count(build_anchor) != 1:
                  raise SystemExit(f'build anchor count drift: {build.count(build_anchor)}')
              build_path.write_text(build.replace(build_anchor, build_anchor + '\n' + artifact, 1), encoding='utf-8')

          bfi = bfi_path.read_text(encoding='utf-8')
          test_marker = 'R2 visible precommit one-operation clear preserves route undo and fails closed against commit race'
          if test_marker not in bfi:
              test_block = base64.b64decode(os.environ['BFI_BLOCK_B64']).decode('utf-8')
              bfi_path.write_text(bfi + test_block, encoding='utf-8')
          PY
      - name: Run focused core and public package tests
        run: |
          node --test tests/battle-precommit-clear-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Verify bounded changed paths before cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed={
            'browser/GAMEROAD.html',
            'deploy/cloudflare/scripts/build.mjs',
            'tests/browser-full-interaction.spec.mjs',
            '.github/workflows/battle-precommit-clear-live-r2-executor.yml',
            'data/preaction-authorizations/BATTLE-PRECOMMIT-CLEAR-LIVE-R2-20260905T2010-SOL-Q7M4P2.json',
          }
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed={line[3:] for line in lines if len(line)>=4}
          extra=changed-allowed
          if extra:
              raise SystemExit('unexpected changed paths: '+','.join(sorted(extra)))
          PY
      - name: Cleanup transient authorization and executor then commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git rm .github/workflows/battle-precommit-clear-live-r2-executor.yml
          git rm data/preaction-authorizations/BATTLE-PRECOMMIT-CLEAR-LIVE-R2-20260905T2010-SOL-Q7M4P2.json
          git add browser/GAMEROAD.html deploy/cloudflare/scripts/build.mjs tests/browser-full-interaction.spec.mjs
          git diff --cached --check
          git commit -m 'Battle: connect precommit selection clear to live consumer'
          git push origin HEAD:sol/battle-precommit-clear-live-r2-20260905
