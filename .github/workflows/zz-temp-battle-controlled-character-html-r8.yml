name: zz-temp-battle-controlled-character-html-r8
on:
  push:
    branches:
      - sol/battle-controlled-character-html-handoff-r8-20260909
permissions:
  contents: write
jobs:
  mutate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded R8 product patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'gameroad-controlled-character-4p-live-r8' browser/GAMEROAD.html; then
            echo 'R8 product patch already present; verify-only run.'
          else
            python tools/temp-battle-controlled-character-html-r8.py
          fi
      - name: Run focused controlled-character tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/battle-controlled-character-html-handoff.test.mjs)
          for candidate in \
            tests/battle-board-naki-4p-visual-binding.test.mjs \
            tests/battle-controlled-character-4p-motion-director.test.mjs \
            tests/battle-controlled-character-motion-core.test.mjs; do
            [[ -f "$candidate" ]] && tests+=("$candidate")
          done
          printf 'Focused tests: %s\n' "${tests[*]}"
          node --test "${tests[@]}"
      - name: Build Cloudflare browser artifact
        shell: bash
        run: |
          set -euo pipefail
          node deploy/cloudflare/scripts/build.mjs \
            --source-commit "$(git rev-parse HEAD)" \
            --published-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Verify exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed before product commit:\n%s\n' "${changed[*]:-<none>}"
          for path in "${changed[@]}"; do
            case "$path" in
              browser/GAMEROAD.html|deploy/cloudflare/scripts/build.mjs|tests/battle-controlled-character-html-handoff.test.mjs) ;;
              *) echo "Unexpected product diff: $path" >&2; exit 1;;
            esac
          done
          grep -Fq "participantId:p.id,characterId:String(p.character||''),positionKey:p.position" browser/GAMEROAD.html
          grep -Fq "grControlledCharacter4pEvent(p,'MOVE_ACCEPTED',{toPositionKey:to,facing});renderField3D();renderBoard();if(human)await updateBattleAvatar();if(dur)" browser/GAMEROAD.html
          grep -Fq 'html body:has(.battle.active) .top{display:flex!important}' browser/GAMEROAD.html
          grep -Fq '#boardPlayers .boardPlayerToken.human [data-board-controlled-character]{display:none!important}' browser/GAMEROAD.html
          grep -Fq "battle-controlled-character-4p-motion-director.mjs" deploy/cloudflare/scripts/build.mjs
      - name: Commit product bytes
        shell: bash
        run: |
          set -euo pipefail
          git add browser/GAMEROAD.html deploy/cloudflare/scripts/build.mjs tests/battle-controlled-character-html-handoff.test.mjs
          if git diff --cached --quiet; then
            echo 'No product commit needed.'
            exit 0
          fi
          git config user.name 'gameroad-sol-r8'
          git config user.email 'gameroad-sol-r8@users.noreply.github.com'
          git commit -m 'Battle: render controlled characters for all four participants'
          git push origin HEAD:sol/battle-controlled-character-html-handoff-r8-20260909
