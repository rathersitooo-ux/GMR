name: PublicHost deploy race R51 patch

on:
  push:
    branches:
      - work/publichost-deploy-race-r51-20260905
    paths:
      - .github/workflows/publichost-deploy-race-r51-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publichost-deploy-race-r51-20260905
          fetch-depth: 0
      - name: Apply exact trigger-race repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-public-deploy.yml')
          s = p.read_text()
          old = '''  workflow_dispatch:\n  workflow_run:\n    workflows: ["Required Gate auto-merge"]\n    types: [completed]\n'''
          new = '''  workflow_dispatch:\n'''
          if s.count(old) != 1:
              raise SystemExit(f'workflow_run trigger block count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''  cancel-in-progress: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.sha != github.event.workflow_run.head_sha) }}\n'''
          new = '''  cancel-in-progress: true\n'''
          if s.count(old) != 1:
              raise SystemExit(f'concurrency expression count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.sha != github.event.workflow_run.head_sha)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'deploy job guard count={s.count(old)}')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- .github/workflows/cloudflare-public-deploy.yml
      - name: Commit product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-r51
          git config user.email gameroad-r51@users.noreply.github.com
          git add .github/workflows/cloudflare-public-deploy.yml
          git commit -m 'Fix Cloudflare deploy trigger race'
          git push origin HEAD:work/publichost-deploy-race-r51-20260905
