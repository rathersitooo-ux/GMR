name: TEMP Battle causal trace R1

on:
  push:
    branches:
      - sol/ka6-battle-causal-trace-r1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/ka6-battle-causal-trace-r1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact-anchor patch
        run: python3 tools/temp-battle-causal-trace-r1.py

      - name: Syntax check runtime
        run: node --check browser/battle-screen-runtime-mount.mjs

      - name: Run focused runtime test
        run: node tests/battle-screen-runtime-mount.test.mjs

      - name: Run presentation model regression
        run: node tests/battle-screen-presentation-core.test.mjs

      - name: Ensure clean diff syntax
        run: git diff --check

      - name: Remove temporary patch machinery
        run: |
          git rm tools/temp-battle-causal-trace-r1.py
          git rm .github/workflows/zz-temp-battle-causal-trace-r1.yml

      - name: Commit verified product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs
          git diff --cached --check
          git commit -m "Battle: causal traceを攻撃から盤面帰着まで一本化"
          git push origin HEAD:sol/ka6-battle-causal-trace-r1
