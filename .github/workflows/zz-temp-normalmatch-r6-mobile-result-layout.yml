name: TEMP NormalMatch R6 Mobile Result Layout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'work/normalmatch-r6-currentbase-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/normalmatch-r6-currentbase-recovery
      - name: Keep autoqueue in the existing Result action row on phone
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text()
          marker='#postMatchAutoQueueStatus[data-state="matched"]{color:var(--b)}\n'
          patch='''#postMatchAutoQueueStatus[data-state="matched"]{color:var(--b)}\n@media (max-width:480px) and (max-height:900px){\n.screen.result .resultBtns{grid-template-columns:repeat(4,minmax(0,1fr))}\n#postMatchAutoQueue{grid-column:auto;min-width:0;gap:3px;flex-wrap:nowrap;padding:5px 4px;font-size:9px;justify-content:center}\n#postMatchAutoQueue label{gap:3px;white-space:nowrap;font-size:0}\n#postMatchAutoQueue label::after{content:"連戦";font-size:9px}\n#postMatchAutoQueue input{width:16px;height:16px;flex:0 0 auto}\n#postMatchAutoQueueStatus{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}\n}\n'''
          if marker not in s: raise SystemExit('expected R6 autoqueue CSS marker missing')
          if '@media (max-width:480px) and (max-height:900px)' in s: raise SystemExit('repair already present')
          p.write_text(s.replace(marker,patch,1))
          PY
          git diff --check
          git diff -- browser/GAMEROAD.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-temp-normalmatch-r6-mobile-result-layout.yml
          git add browser/GAMEROAD.html
          git commit -m "NORMALMATCH R6: keep phone Result actions clear of ranking"
          git push --force-with-lease=refs/heads/work/normalmatch-r6-currentbase-recovery:${EXPECTED_HEAD} origin HEAD:work/normalmatch-r6-currentbase-recovery
