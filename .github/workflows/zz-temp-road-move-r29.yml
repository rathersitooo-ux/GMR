name: TEMP Road Move R29 Evidence

on:
  push:
    branches:
      - sol/road-move-bidirectional-r29-20260911
    paths:
      - 'tests/road-move-bidirectional-live-r27.spec.mjs'
      - '.github/workflows/zz-temp-road-move-r29.yml'
      - 'data/preaction-authorizations/ROAD-MOVE-RUNTIME-R29-20260911T1224-SOL-Q7N4V6.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-bidirectional-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run fixed Road bidirectional regression
        shell: bash
        run: |
          set -uo pipefail
          npx playwright test tests/road-move-bidirectional-live-r27.spec.mjs --config=playwright.full-interaction.config.mjs --reporter=line 2>&1 | tee road-move-r29.log
          exit ${PIPESTATUS[0]}

      - name: Upload Road evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-move-r29-${{ github.run_id }}
          path: |
            road-move-r29.log
            test-results
          if-no-files-found: warn
