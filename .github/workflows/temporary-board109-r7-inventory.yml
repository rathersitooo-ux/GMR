name: TEMP BOARD109 R7 runtime semantic probe

on:
  push:
    branches:
      - work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact patched product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "BOARD109_R7_RUNTIME_PROBE_V1"
          test "$(git rev-parse HEAD^)" = "c45b195d11f83fa96c37edba5caf0e0700355ec0"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "0535bf3a37f9afdab3b0cddbc23e7aa610fcbc15"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('browser/GAMEROAD.html').read_bytes()
          assert len(raw)==11816410, len(raw)
          assert hashlib.sha256(raw).hexdigest()=='cbdc9c679282466a430ad81e7ce391cf4d0f159b971c9946ba910eb322a1d36a'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create ephemeral runtime test
        shell: bash
        run: |
          mkdir -p .tmp-board109-r7/tests
          cat > .tmp-board109-r7/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: 'corner-runtime.spec.mjs',
            timeout: 90_000,
            expect: { timeout: 8_000 },
            workers: 1,
            retries: 0,
            reporter: [['line']],
            use: { baseURL:'http://127.0.0.1:4173', browserName:'chromium', headless:true, trace:'retain-on-failure', screenshot:'only-on-failure' },
            webServer: { command:'python3 -m http.server 4173 --bind 127.0.0.1', url:'http://127.0.0.1:4173/browser/GAMEROAD.html', reuseExistingServer:false, timeout:120_000 },
          });
          EOF
          cat > .tmp-board109-r7/tests/corner-runtime.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          const CORNERS=['K:NW','K:NE','K:SW','K:SE'];

          async function installLegalBattleDeck(page){
            return page.evaluate(()=>{
              const t=window.__GAMEROAD_TEST__;
              if(!t||!Array.isArray(window.__CARD_DATA__))throw new Error('current runtime test hooks unavailable');
              const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));
              const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);
              const royalIds=['SP_J','SP_Q','SP_K'];
              const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));
              const main=[...nonRoyal.slice(0,37),...royalIds];
              const set=t.deckSetDraft(main,[]);
              const committed=set.ok?t.deckCommit():false;
              return{count:main.length,set,committed,validation:t.deckValidate(t.state.savedDeck,{forBattle:true})};
            });
          }

          test('BOARD-109 R7 accepted corners are real bidirectional walkable/stoppable runtime nodes', async({page})=>{
            const pageErrors=[];const consoleErrors=[];const unexpectedHttp=[];let known404=0;
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()<400)return;const u=new URL(r.url());if(r.status()===404&&u.pathname.endsWith('/browser/gameroad-version.json')){known404++;return}unexpectedHttp.push(`${r.status()} ${u.pathname}`)});

            const res=await page.goto('/browser/GAMEROAD.html',{waitUntil:'domcontentloaded'});
            expect(res?.ok()).toBeTruthy();
            await page.waitForTimeout(700);
            const deck=await installLegalBattleDeck(page);
            expect(deck.count).toBe(40);expect(deck.set.ok,JSON.stringify(deck.set)).toBeTruthy();expect(deck.committed).toBeTruthy();expect(deck.validation.ok,JSON.stringify(deck.validation)).toBeTruthy();

            const evidence=await page.evaluate(async(corners)=>{
              const core=window.__GAMEROAD_TEST__;
              const match=core.start('4p','road_shield');
              if(!match)throw new Error('4p road_shield start failed');
              if(core.state.match?.players?.length!==4)throw new Error(`expected 4 players, got ${core.state.match?.players?.length}`);
              if(typeof cornerRoadIds!=='function'||typeof neighbors!=='function'||typeof reachable!=='function'||typeof shortest!=='function'||typeof renderBoard!=='function'||typeof selectEndpoint!=='function'||typeof animateResolvedPath!=='function')throw new Error('current board runtime functions unavailable');

              const players=core.state.match.players;
              const filler=window.__CARD_DATA__.find(c=>c&&c.id)?.id;
              if(!filler)throw new Error('no filler card');
              for(const p of players){p.lanes.L=[filler];p.lanes.C=[];p.lanes.R=[filler];}
              const me=players[0];
              const moveCard=window.__CARD_DATA__.map(c=>c.id).find(id=>roadSelectable(id)&&normalMoveLimitForRoad(id)>=1);
              const battleCard=window.__CARD_DATA__.map(c=>c.id).find(id=>id!==moveCard&&roadSelectable(id));
              if(!moveCard||!battleCard)throw new Error('no current legal movement card pair');
              me.hand=[moveCard,battleCard,filler].filter((v,i,a)=>v&&a.indexOf(v)===i);
              if(me.hand.length<2)throw new Error('hand setup failed');

              const accepted={
                'K:NW':[['N','L'],['W','R']],
                'K:NE':[['N','R'],['E','L']],
                'K:SW':[['S','R'],['W','L']],
                'K:SE':[['S','L'],['E','R']],
              };
              const allViewerMappings={};
              for(const viewer of players){
                const proj=projectionFor(viewer);const ownerByArm=Object.fromEntries(Object.entries(proj).map(([owner,arm])=>[arm,owner]));
                allViewerMappings[viewer.id]={};
                for(const k of corners){
                  const expected=accepted[k].map(([arm,lane])=>`R:${ownerByArm[arm]}:${lane}:1`);
                  const actual=cornerRoadIds(k,viewer);
                  if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`${viewer.id} ${k} mapping ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`);
                  const ns=neighbors(k,viewer);
                  if(JSON.stringify(ns)!==JSON.stringify(expected))throw new Error(`${viewer.id} ${k} neighbors ${JSON.stringify(ns)} != ${JSON.stringify(expected)}`);
                  for(const r of expected)if(!neighbors(r,viewer).includes(k))throw new Error(`${viewer.id} ${r} missing reverse ${k}`);
                  allViewerMappings[viewer.id][k]=actual;
                }
              }

              const target='K:NW';
              const acceptedRoads=cornerRoadIds(target,me);
              const start=acceptedRoads[0];
              me.position=start;
              me.plan={roadId:moveCard,battleId:battleCard,path:[start]};
              const moveLimit=normalMoveLimitForRoad(moveCard);
              if(moveLimit<1)throw new Error('movement limit unexpectedly <1');
              const oneReach=reachable(me,1);
              const directPath=shortest(start,target,1,me);
              const oneStepCorners=corners.filter(k=>oneReach.get(k)===1);
              if(JSON.stringify(directPath)!==JSON.stringify([start,target]))throw new Error(`shortest direct mismatch ${JSON.stringify(directPath)}`);
              if(JSON.stringify(oneStepCorners)!==JSON.stringify([target]))throw new Error(`unexpected one-step corners ${JSON.stringify(oneStepCorners)}`);

              renderBoard();
              const targetEl=document.querySelector(`#board .node[data-pos="${target}"]`);
              if(!targetEl)throw new Error('corner DOM missing');
              const before={className:targetEl.className,disabled:targetEl.disabled,pointerEvents:getComputedStyle(targetEl).pointerEvents,distance:targetEl.dataset.moveDistance??null,aria:targetEl.getAttribute('aria-label')};
              if(targetEl.disabled||!targetEl.classList.contains('reachable')||getComputedStyle(targetEl).pointerEvents==='none')throw new Error(`corner DOM not interactive ${JSON.stringify(before)}`);

              selectEndpoint(target);
              const selectedPath=[...me.plan.path];
              if(JSON.stringify(selectedPath)!==JSON.stringify([start,target]))throw new Error(`selectEndpoint path ${JSON.stringify(selectedPath)}`);
              const legal=typeof legalPlan==='function'?legalPlan(me,me.plan):null;
              if(legal&&!legal.ok)throw new Error(`legalPlan rejected corner endpoint ${JSON.stringify(legal)}`);

              await animateResolvedPath(me);
              if(me.position!==target)throw new Error(`resolved movement did not stop on corner: ${me.position}`);

              me.plan={roadId:moveCard,battleId:battleCard,path:[target]};
              const fromCorner=reachable(me,1);
              const fromCornerRoads=[...fromCorner.entries()].filter(([id,d])=>d===1&&id.startsWith('R:')).map(([id])=>id).sort();
              const expectedRoads=[...acceptedRoads].sort();
              if(JSON.stringify(fromCornerRoads)!==JSON.stringify(expectedRoads))throw new Error(`corner exits ${JSON.stringify(fromCornerRoads)} != ${JSON.stringify(expectedRoads)}`);
              const wrongAtOne=[...fromCorner.entries()].filter(([id,d])=>d===1&&(id.startsWith('C:')||id.startsWith('S:')||(id.startsWith('K:')&&id!==target))).map(([id])=>id);
              if(wrongAtOne.length)throw new Error(`corner has forbidden direct exits ${JSON.stringify(wrongAtOne)}`);

              renderBoard();renderField3D();
              const nw=nodeWorld(target,me);const surface=nodeTopSurface(target,me);const projected=fieldProjection.get(target);
              if(!surface||!projected)throw new Error('corner 3D surface/projection missing');
              const rect=document.querySelector('#battleMap').getBoundingClientRect();
              const hit=nearestProjectedNode(rect.left+projected.x/100*rect.width,rect.top+projected.y/100*rect.height,true);
              if(hit!==target)throw new Error(`projected hit expected ${target}, got ${hit}`);

              const boardCount=core.boardCount();if(boardCount!==109)throw new Error(`boardCount ${boardCount}`);
              return{boardCount,playerCount:players.length,moveCard,moveLimit,target,start,acceptedRoads,allViewerMappings,oneStepCorners,before,selectedPath,stoppedAt:me.position,fromCornerRoads,wrongAtOne,world:nw,projected,hit};
            },corners);

            const remaining=[...consoleErrors];
            for(let i=0;i<known404;i++){const ix=remaining.findIndex(x=>x.includes('Failed to load resource')&&x.includes('404'));if(ix>=0)remaining.splice(ix,1)}
            console.log('BOARD109_R7_RUNTIME '+JSON.stringify({...evidence,runtimeErrors:{pageErrors,consoleErrors:remaining,unexpectedHttp,known404}}));
            expect(evidence.boardCount).toBe(109);
            expect(evidence.stoppedAt).toBe('K:NW');
            expect(evidence.fromCornerRoads.sort()).toEqual([...evidence.acceptedRoads].sort());
            expect(pageErrors).toEqual([]);expect(unexpectedHttp).toEqual([]);expect(remaining).toEqual([]);
          });
          EOF
      - name: Run current Chromium semantic probe
        run: npx playwright test --config=.tmp-board109-r7/playwright.config.mjs --workers=1
