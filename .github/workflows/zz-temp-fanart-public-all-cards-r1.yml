name: FanArt Public All Cards R1 Executor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'sol/fanart-public-all-cards-r1-20260908'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable pre-action base
        run: |
          test "$(git merge-base HEAD origin/main)" = "65877b226bb6d34841940492bd65dee2fa93e5cb"
          test -f data/preaction-authorizations/FANART-PUBLIC-ALL-CARDS-R1-20260908T0754-SOL-M7Q4N6.json
      - name: Apply bounded product patch
        run: |
          python3 tools/zz-temp-fanart-public-all-cards-r1.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/cards-deck-presentation.test.mjs')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Focused regression
        run: node --test tests/cards-deck-presentation.test.mjs
      - name: Static boundary checks
        run: |
          grep -q "installFanartPublicBattleCardProjection" browser/cards-deck-presentation.mjs
          grep -q "runtimeGlobal?.renderBattlePlayerCards" browser/cards-deck-presentation.mjs
          grep -q "allOwnersSameViewerProjection: true" browser/cards-deck-presentation.mjs
          ! grep -q "opponentEnabled" browser/cards-deck-presentation.mjs
          ! grep -q "opponentEquippedSkin" browser/cards-deck-presentation.mjs
          git diff --check
      - name: Remove transient executor files
        run: |
          rm -f .github/workflows/zz-temp-fanart-public-all-cards-r1.yml
          rm -f tools/zz-temp-fanart-public-all-cards-r1.py
          rm -f data/preaction-authorizations/FANART-PUBLIC-ALL-CARDS-R1-20260908T0754-SOL-M7Q4N6.json
      - name: Commit product result
        run: |
          git config user.name "gameroad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cards: show local art on all public Battle cards"
          test "$(git diff --name-only 65877b226bb6d34841940492bd65dee2fa93e5cb...HEAD | sort)" = "$(printf '%s\n' 'browser/cards-deck-presentation.mjs' 'tests/cards-deck-presentation.test.mjs' | sort)"
          git push origin HEAD:${{ github.head_ref }}
