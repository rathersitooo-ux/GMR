name: Playtest R58 First-Time Legal Deck Visible Closure

on:
  push:
    branches:
      - work/playglobal-r58-firsttime-legaldeck-visible-closure-20260825-1851
    paths:
      - '.github/workflows/playtest-first-time-r58.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-time-legal-deck-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Bind canonical public manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playtest-r58
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output playtest-r58/gameroad-version.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          cat playtest-r58/gameroad-version.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Exercise clean visible card-by-card recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const OUT = 'playtest-r58';
          const BASE = process.env.GAMEROAD_PUBLIC_BASE_URL;
          const journey = [];
          const pageErrors = [];
          const consoleErrors = [];
          const httpErrors = [];
          const normalize = (s) => String(s ?? '').replace(/\s+/g, ' ').trim();
          const visibleSelector = 'button, a, [role="button"], input, [onclick]';
          const actionWords = /(HOME|BATTLE|DECK|CARD|SHOP|PROFILE|SETUP|設定|ホーム|対戦|バトル|デッキ|カード|ショップ|プロフィール|戻る|閉じる|保存|SAVE|START|開始|次へ|NEXT|決定|CONFIRM|削除|REMOVE|クリア|CLEAR|おすすめ|おまかせ|AUTO)/i;

          async function controlInfo(el) {
            return el.evaluate((node) => {
              const r = node.getBoundingClientRect();
              const label = [node.innerText, node.getAttribute('aria-label'), node.getAttribute('title'), node.getAttribute('value'), node.getAttribute('alt')]
                .filter(Boolean).join(' | ').replace(/\s+/g, ' ').trim();
              return {
                tag: node.tagName.toLowerCase(), label,
                disabled: Boolean(node.disabled || node.getAttribute('aria-disabled') === 'true'),
                x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height)
              };
            });
          }

          async function visibleControls(page) {
            const loc = page.locator(visibleSelector);
            const out = [];
            for (let i = 0; i < await loc.count(); i += 1) {
              const el = loc.nth(i);
              if (!(await el.isVisible().catch(() => false))) continue;
              const info = await controlInfo(el);
              if (info.w > 0 && info.h > 0) out.push({ index: i, ...info });
            }
            return out;
          }

          async function bodyText(page) {
            return normalize(await page.locator('body').innerText().catch(() => ''));
          }

          function deckCount(text) {
            const matches = [...text.matchAll(/(?:MAIN|メイン|DECK|デッキ|枚数)?\s*(\d{1,2})\s*\/\s*40\b/gi)];
            if (!matches.length) return null;
            const vals = matches.map(m => Number(m[1])).filter(n => Number.isFinite(n) && n <= 40);
            return vals.length ? Math.max(...vals) : null;
          }

          async function snapshot(page, name) {
            const text = (await bodyText(page)).slice(0, 12000);
            const controls = await visibleControls(page);
            const snap = { name, url: page.url(), deckCount: deckCount(text), text, controls };
            journey.push({ type: 'snapshot', ...snap });
            fs.writeFileSync(`${OUT}/${name}.json`, JSON.stringify(snap, null, 2));
            await page.screenshot({ path: `${OUT}/${name}.png`, fullPage: true, animations: 'disabled' });
            console.log(`\n=== ${name} ===`);
            console.log('DECK_COUNT', snap.deckCount);
            console.log('TEXT', text);
            console.log('CONTROLS', JSON.stringify(controls));
            return snap;
          }

          async function naturalClick(page, label, regexes) {
            const loc = page.locator(visibleSelector);
            for (const rx of regexes) {
              for (let i = 0; i < await loc.count(); i += 1) {
                const el = loc.nth(i);
                if (!(await el.isVisible().catch(() => false))) continue;
                if (!(await el.isEnabled().catch(() => true))) continue;
                const info = await controlInfo(el).catch(() => null);
                if (!info?.label || !rx.test(info.label)) continue;
                journey.push({ type: 'visible-action', label, matched: info.label, regex: String(rx) });
                console.log(`ACTION ${label}: ${info.label}`);
                await el.click({ timeout: 5000 }).catch(() => {});
                await page.waitForTimeout(700);
                return { ok: true, matched: info.label };
              }
            }
            journey.push({ type: 'visible-action-miss', label, regexes: regexes.map(String) });
            return { ok: false };
          }

          async function enterDeck(page) {
            await page.goto(`${BASE}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1400);
            await naturalClick(page, 'home-to-play', [/(^|\b)BATTLE(\b|$)/i, /対戦|バトル/, /PLAY|START|あそぶ|遊ぶ/i]);
            await page.waitForTimeout(500);
            const text = await bodyText(page);
            if (!/DECK|デッキ|カード/i.test(text)) {
              await naturalClick(page, 'choose-content', [/Honey Hunt|ハニー/i, /Road Shield|ロード/i, /通常対戦|Normal Match/i]);
            }
            const r = await naturalClick(page, 'open-deck-visible', [/DECK|デッキ/i, /カード編成|カード構築|CARDS?/i]);
            if (!r.ok) {
              await naturalClick(page, 'setup-deck-recovery', [/デッキ|DECK/i, /カード|CARDS?/i, /編成|構築/i]);
            }
            await page.waitForTimeout(700);
          }

          async function attemptFormalMandatoryByVisibleLabel(page) {
            const requirements = [
              { key: 'Royal J', body: /Royal\s*J\s*(?:0\s*\/\s*1|不足|必要|required|missing)|ロイヤル\s*J/i, labels: [/Royal\s*J/i, /ロイヤル\s*J/i] },
              { key: 'Royal Q', body: /Royal\s*Q\s*(?:0\s*\/\s*1|不足|必要|required|missing)|ロイヤル\s*Q/i, labels: [/Royal\s*Q/i, /ロイヤル\s*Q/i] },
              { key: 'Royal K', body: /Royal\s*K\s*(?:0\s*\/\s*1|不足|必要|required|missing)|ロイヤル\s*K/i, labels: [/Royal\s*K/i, /ロイヤル\s*K/i] },
              ...[1,2,3,4,5,6,7].map(n => ({ key: `Trump ${n}`, body: new RegExp(`Trump\\s*${n}.*(?:不足|必要|required|missing)|トランプ\\s*${n}`, 'i'), labels: [new RegExp(`Trump\\s*${n}`, 'i'), new RegExp(`トランプ\\s*${n}`, 'i')] }))
            ];
            for (const req of requirements) {
              const text = await bodyText(page);
              if (!req.body.test(text)) continue;
              const before = deckCount(text);
              const clicked = await naturalClick(page, `formal-visible-${req.key}`, req.labels);
              const after = deckCount(await bodyText(page));
              journey.push({ type: 'formal-visible-attempt', requirement: req.key, before, after, clicked });
            }
          }

          async function addVisibleCardsUntil40(page) {
            const tried = new Set();
            let progress = 0;
            for (let step = 0; step < 80; step += 1) {
              let text = await bodyText(page);
              let count = deckCount(text);
              if (count === 40) return { ok: true, progress, count };
              const loc = page.locator(visibleSelector);
              let advanced = false;
              for (let i = 0; i < await loc.count(); i += 1) {
                const el = loc.nth(i);
                if (!(await el.isVisible().catch(() => false))) continue;
                if (!(await el.isEnabled().catch(() => true))) continue;
                const info = await controlInfo(el).catch(() => null);
                if (!info?.label || info.label.length > 140 || actionWords.test(info.label)) continue;
                const key = `${info.label}@${info.x},${info.y}`;
                if (tried.has(key)) continue;
                tried.add(key);
                const before = count;
                journey.push({ type: 'card-candidate-visible-click', step, label: info.label, before });
                await el.click({ timeout: 4000 }).catch(() => {});
                await page.waitForTimeout(450);
                const afterText = await bodyText(page);
                const after = deckCount(afterText);
                journey.push({ type: 'card-candidate-result', label: info.label, before, after });
                if (after != null && before != null && after > before) {
                  progress += after - before;
                  advanced = true;
                  break;
                }
                if (after != null && before != null && after < before) {
                  await el.click({ timeout: 4000 }).catch(() => {});
                  await page.waitForTimeout(350);
                } else {
                  await naturalClick(page, 'close-nonadding-card-detail', [/閉じる|CLOSE/i, /戻る|BACK/i]);
                }
                text = await bodyText(page);
                count = deckCount(text);
              }
              if (!advanced) return { ok: false, progress, count: deckCount(await bodyText(page)), reason: 'NO_VISIBLE_ADDING_CONTROL_LEFT', tried: [...tried] };
            }
            return { ok: false, progress, count: deckCount(await bodyText(page)), reason: 'STEP_LIMIT' };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 667, height: 375 }, hasTouch: true, isMobile: true, deviceScaleFactor: 1 });
            const page = await context.newPage();
            page.on('pageerror', e => pageErrors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('response', r => { if (r.status() >= 400) httpErrors.push(`${r.status()} ${r.url()}`); });

            await enterDeck(page);
            const initial = await snapshot(page, '00-clean-deck-entry');
            await naturalClick(page, 'visible-save-to-surface-legality', [/保存|SAVE/i, /確定|COMMIT/i]);
            await page.waitForTimeout(400);
            await snapshot(page, '01-legality-feedback');
            await attemptFormalMandatoryByVisibleLabel(page);
            const mandatory = await snapshot(page, '02-after-formal-visible-attempts');
            const fill = await addVisibleCardsUntil40(page);
            journey.push({ type: 'visible-fill-result', fill });
            const forty = await snapshot(page, '03-after-visible-card-by-card');

            const save = await naturalClick(page, 'save-visible-legal-deck', [/保存|SAVE/i, /確定|COMMIT/i, /決定/i]);
            const saved = await snapshot(page, '04-after-save');

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
            const reloaded = await snapshot(page, '05-after-reload');
            const reloadCount = reloaded.deckCount;

            await naturalClick(page, 'return-home-or-battle', [/(^|\b)BATTLE(\b|$)/i, /対戦|バトル/, /戻る|BACK|HOME|ホーム/i]);
            await page.waitForTimeout(600);
            await naturalClick(page, 'return-to-setup', [/(^|\b)BATTLE(\b|$)/i, /対戦|バトル/, /PLAY|START|あそぶ|遊ぶ/i]);
            await page.waitForTimeout(500);
            await naturalClick(page, 'choose-content-after-reload', [/Honey Hunt|ハニー/i, /Road Shield|ロード/i, /通常対戦|Normal Match/i]);
            const setup = await snapshot(page, '06-setup-after-reload');
            const startControls = setup.controls.filter(c => /対戦開始|ゲーム開始|開始する|はじめる|START MATCH|START GAME|START/i.test(c.label));
            const enabledStart = startControls.some(c => !c.disabled);
            if (enabledStart) await naturalClick(page, 'start-visible-battle', [/対戦開始|ゲーム開始|開始する|はじめる|START MATCH|START GAME|START/i]);
            await page.waitForTimeout(900);
            const final = await snapshot(page, '07-after-start');
            const battleReached = /行動を計画|Round|ターン|Turn|Battle|バトル/i.test(final.text) && !/デッキ.*\d+\s*\/\s*40/i.test(final.text.slice(0, 600));

            const result = {
              canonicalBase: BASE,
              initialDeckCount: initial.deckCount,
              afterMandatoryCount: mandatory.deckCount,
              afterVisibleCardByCardCount: forty.deckCount,
              visibleFill: fill,
              saveVisibleAction: save,
              reloadDeckCount: reloadCount,
              setupStartEnabled: enabledStart,
              battleReached,
              pageErrors,
              consoleErrors,
              httpErrors,
              internalGameApiUsed: false,
              hiddenTestHookUsed: false,
              hiddenGameSelectorUsedForDecision: false,
              formalStarterOrFixedCardListInjected: false,
              journey
            };
            fs.writeFileSync(`${OUT}/result.json`, JSON.stringify(result, null, 2));
            console.log('\n=== R58 RESULT ===');
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(error => {
            fs.writeFileSync(`${OUT}/fatal.txt`, String(error?.stack || error));
            console.error(error);
            process.exitCode = 3;
          });
          NODE

      - name: Upload R58 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playtest-r58-firsttime-legaldeck-visible-${{ github.run_id }}
          path: playtest-r58/
          if-no-files-found: error
          retention-days: 14
