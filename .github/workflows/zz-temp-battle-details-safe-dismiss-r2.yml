name: TEMP Battle details safe dismiss R2

on:
  push:
    branches:
      - sol/battle-details-safe-dismiss-r2-20260908

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-details-safe-dismiss-r2-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact base blobs, patch product, test, self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "591c4b3a5104f43832d9ed3e1e561c59deb75c83"
          test "$(git hash-object tests/battle-replay-live-adapter.test.mjs)" = "deee7cdb9dfafebba935ecf052404e9312c86ee9"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "934b54475683c0d34885c986716cb0f6b4ad428b"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          adapter_path = Path('browser/battle-replay-live-adapter.mjs')
          adapter = adapter_path.read_text()
          marker = 'export function mountBattleDetailsSafeDismiss('
          if marker in adapter:
              raise SystemExit('safe-dismiss binder already present')
          adapter += r'''

const BATTLE_DETAILS_SAFE_DISMISS_BOUND = new WeakSet();

function battleDetailsDrawerOpen(drawer) {
  return drawer?.classList?.contains?.('on') === true &&
    drawer.getAttribute?.('aria-hidden') !== 'true';
}

function battleDetailsTargetInside(node, target) {
  return node === target || node?.contains?.(target) === true;
}

export function mountBattleDetailsSafeDismiss({
  documentRef = browserGlobal('document'),
  queueMicrotaskRef = browserGlobal('queueMicrotask')
} = {}) {
  const drawer = documentRef?.getElementById?.('battleDrawer');
  const opener = documentRef?.getElementById?.('detailsBtn');
  const closeButton = documentRef?.getElementById?.('detailsClose');
  if (!drawer?.classList || !opener || !closeButton ||
      typeof documentRef?.addEventListener !== 'function') {
    return deepFreeze({
      mounted: false,
      reason: 'BATTLE_DETAILS_SURFACE_UNAVAILABLE',
      presentationOnly: true,
      gameplayAuthority: false,
      gameStateWrite: false
    });
  }
  if (BATTLE_DETAILS_SAFE_DISMISS_BOUND.has(drawer)) {
    return deepFreeze({
      mounted: true,
      idempotent: true,
      presentationOnly: true,
      gameplayAuthority: false,
      gameStateWrite: false
    });
  }

  const focusOpener = () => {
    try {
      opener.focus?.({ preventScroll: true });
    } catch {
      try { opener.focus?.(); } catch { /* presentation-only */ }
    }
  };
  const closeDrawer = () => {
    if (!battleDetailsDrawerOpen(drawer)) return false;
    drawer.classList.remove('on');
    drawer.setAttribute?.('aria-hidden', 'true');
    focusOpener();
    return true;
  };
  const consume = event => {
    event?.preventDefault?.();
    event?.stopPropagation?.();
  };
  const onDocumentClick = event => {
    if (!battleDetailsDrawerOpen(drawer)) return;
    const target = event?.target;
    if (battleDetailsTargetInside(drawer, target) ||
        battleDetailsTargetInside(opener, target)) return;
    consume(event);
    closeDrawer();
  };
  const onDocumentKeydown = event => {
    if (!battleDetailsDrawerOpen(drawer) || event?.key !== 'Escape') return;
    consume(event);
    closeDrawer();
  };
  const schedule = typeof queueMicrotaskRef === 'function'
    ? queueMicrotaskRef
    : callback => Promise.resolve().then(callback);
  const onExplicitClose = () => {
    schedule(() => {
      if (!battleDetailsDrawerOpen(drawer)) focusOpener();
    });
  };

  documentRef.addEventListener('click', onDocumentClick, true);
  documentRef.addEventListener('keydown', onDocumentKeydown, true);
  closeButton.addEventListener?.('click', onExplicitClose);
  BATTLE_DETAILS_SAFE_DISMISS_BOUND.add(drawer);
  return deepFreeze({
    mounted: true,
    idempotent: false,
    presentationOnly: true,
    gameplayAuthority: false,
    gameStateWrite: false
  });
}

function autoMountBattleDetailsSafeDismiss() {
  const documentRef = browserGlobal('document');
  if (!documentRef) return;
  const mount = () => {
    try { mountBattleDetailsSafeDismiss({ documentRef }); } catch { /* presentation-only */ }
  };
  if (documentRef.readyState === 'loading' && typeof documentRef.addEventListener === 'function') {
    documentRef.addEventListener('DOMContentLoaded', mount, { once: true });
  } else {
    mount();
  }
}

autoMountBattleDetailsSafeDismiss();
'''
          adapter_path.write_text(adapter)

          test_path = Path('tests/battle-replay-live-adapter.test.mjs')
          tests = test_path.read_text()
          test_marker = "Battle details drawer safe dismiss consumes outside/Escape"
          if test_marker in tests:
              raise SystemExit('safe-dismiss test already present')
          tests += r'''

test('Battle details drawer safe dismiss consumes outside/Escape, preserves inside input, and restores opener focus', async () => {
  const { mountBattleDetailsSafeDismiss } = await import('../browser/battle-replay-live-adapter.mjs');
  const classes = new Set(['battleDrawer', 'on']);
  let ariaHidden = 'false';
  let focusCount = 0;
  const insideTarget = {};
  const outsideTarget = {};
  const listeners = new Map();
  const closeListeners = [];
  const microtasks = [];
  const opener = {
    focus() { focusCount += 1; },
    contains(target) { return target === this; }
  };
  const closeButton = {
    addEventListener(type, handler) { if (type === 'click') closeListeners.push(handler); }
  };
  const drawer = {
    classList: {
      contains(name) { return classes.has(name); },
      remove(name) { classes.delete(name); },
      add(name) { classes.add(name); }
    },
    getAttribute(name) { return name === 'aria-hidden' ? ariaHidden : null; },
    setAttribute(name, value) { if (name === 'aria-hidden') ariaHidden = String(value); },
    contains(target) { return target === this || target === insideTarget || target === closeButton; }
  };
  const documentRef = {
    getElementById(id) {
      if (id === 'battleDrawer') return drawer;
      if (id === 'detailsBtn') return opener;
      if (id === 'detailsClose') return closeButton;
      return null;
    },
    addEventListener(type, handler, options) {
      if (!listeners.has(type)) listeners.set(type, []);
      listeners.get(type).push({ handler, options });
    }
  };
  const queueMicrotaskRef = callback => microtasks.push(callback);
  const first = mountBattleDetailsSafeDismiss({ documentRef, queueMicrotaskRef });
  assert.equal(first.mounted, true);
  assert.equal(first.idempotent, false);
  assert.equal(listeners.get('click').length, 1);
  assert.equal(listeners.get('keydown').length, 1);
  assert.equal(listeners.get('click')[0].options, true);
  assert.equal(listeners.get('keydown')[0].options, true);
  assert.equal(closeListeners.length, 1);

  const insideEvent = {
    target: insideTarget,
    prevented: false,
    stopped: false,
    preventDefault() { this.prevented = true; },
    stopPropagation() { this.stopped = true; }
  };
  listeners.get('click')[0].handler(insideEvent);
  assert.equal(classes.has('on'), true);
  assert.equal(insideEvent.prevented, false);
  assert.equal(insideEvent.stopped, false);

  const outsideEvent = {
    target: outsideTarget,
    prevented: false,
    stopped: false,
    preventDefault() { this.prevented = true; },
    stopPropagation() { this.stopped = true; }
  };
  listeners.get('click')[0].handler(outsideEvent);
  assert.equal(classes.has('on'), false);
  assert.equal(ariaHidden, 'true');
  assert.equal(outsideEvent.prevented, true);
  assert.equal(outsideEvent.stopped, true);
  assert.equal(focusCount, 1);

  classes.add('on');
  ariaHidden = 'false';
  const otherKey = { key: 'Enter', preventDefault() { throw new Error('must not consume'); } };
  listeners.get('keydown')[0].handler(otherKey);
  assert.equal(classes.has('on'), true);
  const escapeEvent = {
    key: 'Escape',
    prevented: false,
    stopped: false,
    preventDefault() { this.prevented = true; },
    stopPropagation() { this.stopped = true; }
  };
  listeners.get('keydown')[0].handler(escapeEvent);
  assert.equal(classes.has('on'), false);
  assert.equal(escapeEvent.prevented, true);
  assert.equal(escapeEvent.stopped, true);
  assert.equal(focusCount, 2);

  classes.add('on');
  ariaHidden = 'false';
  closeListeners[0]();
  classes.delete('on');
  ariaHidden = 'true';
  assert.equal(microtasks.length, 1);
  microtasks.shift()();
  assert.equal(focusCount, 3);

  const second = mountBattleDetailsSafeDismiss({ documentRef, queueMicrotaskRef });
  assert.equal(second.mounted, true);
  assert.equal(second.idempotent, true);
  assert.equal(listeners.get('click').length, 1);
  assert.equal(listeners.get('keydown').length, 1);
  assert.equal(closeListeners.length, 1);
  assert.equal(first.presentationOnly, true);
  assert.equal(first.gameplayAuthority, false);
  assert.equal(first.gameStateWrite, false);
});
'''
          test_path.write_text(tests)

          new_adapter_blob = subprocess.check_output(
              ['git', 'hash-object', str(adapter_path)], text=True
          ).strip()
          build_path = Path('deploy/cloudflare/tests/build.test.mjs')
          build = build_path.read_text()
          old = "currentBlob: '591c4b3a5104f43832d9ed3e1e561c59deb75c83'"
