name: zz-temp-battle-controlled-character-html-r8
on:
  push:
    branches:
      - sol/battle-controlled-character-html-handoff-r8-20260909
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect module insertion and top-bar preservation seams
        shell: python
        run: |
          from pathlib import Path
          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          for needle in ['body:has(.battle.active) .top','type="module" src="./','</body>','</html>','battle-board-naki-4p-visual-binding.mjs']:
              print('\n===== ',repr(needle),' count=',text.count(needle),' =====')
              start=0
              for hit in range(min(text.count(needle),12)):
                  idx=text.find(needle,start)
                  if idx<0: break
                  print('OFFSET',idx,'LINE',text.count('\n',0,idx)+1)
                  print(text[max(0,idx-900):min(len(text),idx+len(needle)+1200)].replace('\r',''))
                  print('---')
                  start=idx+len(needle)
          print('\n===== TAIL =====')
          print(text[-7000:].replace('\r',''))
