name: TEMP Battle Board Hierarchy R2

on:
  push:
    branches:
      - sol/battle-board-hierarchy-r2-20260908

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/battle-board-hierarchy-r2-20260908
          fetch-depth: 0

      - name: Verify exact current source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/battle-screen-runtime-mount.mjs)" = "5e939faa366e5ae598b8f4a556e8732a89c4086a"
          test "$(git hash-object tests/battle-screen-runtime-mount.test.mjs)" = "014d860091d20f55460902f26c268853e912c325"
          test "$(git rev-parse 2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb^{commit})" = "2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb"

      - name: Apply board-first presentation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module_path = Path('browser/battle-screen-runtime-mount.mjs')
          test_path = Path('tests/battle-screen-runtime-mount.test.mjs')
          module = module_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          old_grid = '[${SHELL_ATTR}="1"] [${GRID_ATTR}]{position:absolute;z-index:4;top:clamp(68px,12vh,92px);right:5%;bottom:clamp(54px,10vh,82px);left:52%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,18px);align-items:stretch;overflow:visible;pointer-events:none}'
          new_grid = '[${SHELL_ATTR}="1"] [${GRID_ATTR}]{position:absolute;z-index:4;top:clamp(96px,16vh,122px);right:clamp(8px,1.5vw,18px);bottom:auto;left:40%;height:clamp(86px,15vh,116px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:clamp(4px,.7vw,8px);align-items:stretch;overflow:visible;pointer-events:none}'
          module = replace_once(module, old_grid, new_grid, 'causal grid rail')

          old_pseudo = '[${SHELL_ATTR}="1"] [${GRID_ATTR}]::before{content:"";position:absolute;'
          new_pseudo = '[${SHELL_ATTR}="1"] [${GRID_ATTR}]::before{content:"";display:none;position:absolute;'
          module = replace_once(module, old_pseudo, new_pseudo, 'decorative center diamond suppression')

          old_lane = '[${SHELL_ATTR}="1"] [${LANE_ATTR}]{position:relative;min-width:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:clamp(7px,1.1vw,13px);border:1px solid rgba(219,241,207,.24);border-radius:clamp(9px,1.4vw,16px);background:linear-gradient(180deg,rgba(19,56,49,.76),rgba(6,25,24,.58));box-shadow:0 10px 22px rgba(2,20,17,.20),inset 0 0 0 1px rgba(255,255,255,.025);transition:transform 180ms ease,opacity 180ms ease,border-color 180ms ease,background 180ms ease}'
          new_lane = '[${SHELL_ATTR}="1"] [${LANE_ATTR}]{position:relative;min-width:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;gap:4px;padding:clamp(5px,.7vw,8px);border:1px solid rgba(219,241,207,.18);border-radius:clamp(8px,1vw,11px);background:linear-gradient(180deg,rgba(19,56,49,.62),rgba(6,25,24,.46));box-shadow:0 5px 12px rgba(2,20,17,.16),inset 0 0 0 1px rgba(255,255,255,.02);transition:transform 180ms ease,opacity 180ms ease,border-color 180ms ease,background 180ms ease}'
          module = replace_once(module, old_lane, new_lane, 'compact lane surface')

          old_fourth = '[${SHELL_ATTR}="1"] [${LANE_ATTR}]:nth-child(4){left:-10%;top:-9%}\n'
          new_fourth = old_fourth + '[${SHELL_ATTR}="1"] [${GRID_ATTR}] > [${LANE_ATTR}]{left:0!important;top:0!important}\n'
          module = replace_once(module, old_fourth, new_fourth, 'remove stagger offsets inside compact rail')

          old_narrow = '@media(max-width:540px){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{left:4px;right:4px;gap:3px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}'
          new_narrow = '@media(max-width:540px){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{left:4px;right:4px;gap:3px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}'
          module = replace_once(module, old_narrow, new_narrow, 'narrow landscape rail')

          old_portrait = '@media(max-width:540px) and (orientation:portrait){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{top:88px;right:8px;bottom:96px;left:8px;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}'
          new_portrait = '@media(max-width:540px) and (orientation:portrait){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{top:88px;right:8px;bottom:96px;left:8px;height:auto;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}'
          module = replace_once(module, old_portrait, new_portrait, 'portrait height reset')

          old_short = '@media(max-height:420px){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{top:58px;bottom:34px}'
          new_short = '@media(max-height:420px){[${SHELL_ATTR}="1"] [${GRID_ATTR}]{top:78px;bottom:auto;height:72px;left:36%;right:4px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}'
          module = replace_once(module, old_short, new_short, 'short landscape board clearance')

          tests = replace_once(
              tests,
              "assert.ok(runtimeStyle.textContent.includes('left:52%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))'));",
              "assert.ok(runtimeStyle.textContent.includes('left:40%;height:clamp(86px,15vh,116px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)'));",
              'desktop rail assertion',
          )
          tests = replace_once(
              tests,
              "assert.ok(runtimeStyle.textContent.includes('clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)'));",
              "assert.ok(runtimeStyle.textContent.includes('clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)'));\nassert.ok(runtimeStyle.textContent.includes('[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]::before{content:\"\";display:none;'));\nassert.ok(runtimeStyle.textContent.includes('[data-battle-screen-causal-grid] > [data-battle-screen-lane]{left:0!important;top:0!important}'));",
              'decorative suppression assertions',
          )
          tests = replace_once(
              tests,
              "assert.ok(runtimeStyle.textContent.includes('@media(max-width:540px){[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]{left:4px;right:4px;gap:3px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}'));",
              "assert.ok(runtimeStyle.textContent.includes('@media(max-width:540px){[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]{left:4px;right:4px;gap:3px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}'));",
              'narrow rail assertion',
          )
          tests = replace_once(
              tests,
              "assert.ok(runtimeStyle.textContent.includes('@media(max-width:540px) and (orientation:portrait){[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]{top:88px;right:8px;bottom:96px;left:8px;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}'));",
              "assert.ok(runtimeStyle.textContent.includes('@media(max-width:540px) and (orientation:portrait){[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]{top:88px;right:8px;bottom:96px;left:8px;height:auto;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}'));",
              'portrait rail assertion',
          )
          anchor = "assert.ok(runtimeStyle.textContent.includes('@media(max-height:470px) and (orientation:landscape)'));"
          tests = replace_once(
              tests,
              anchor,
              anchor + "\nassert.ok(runtimeStyle.textContent.includes('@media(max-height:420px){[data-gr-battle-screen=\"1\"] [data-battle-screen-causal-grid]{top:78px;bottom:auto;height:72px;left:36%;right:4px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}'));",
              'short landscape rail assertion',
          )

          module_path.write_text(module)
          test_path.write_text(tests)
          PY

      - name: Run focused presentation regression
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/battle-screen-runtime-mount.mjs
          node --test tests/battle-screen-runtime-mount.test.mjs

      - name: Verify bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "browser/battle-screen-runtime-mount.mjs tests/battle-screen-runtime-mount.test.mjs "
          ! git diff -- browser/battle-screen-runtime-mount.mjs | grep -E 'gameStateWrite|gameplayAuthority|battle-janken|row-roulette|GAMEROAD\.html' >/dev/null

      - name: Commit validated product and self-clean transient files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-battle-board-hierarchy-r2.yml
          rm -f data/preaction-authorizations/BATTLE-BOARD-HIERARCHY-R2-20260908T0852-SOL-K7N4Q2.json
          git config user.name "gameroad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Battle: make four-player status peripheral to the board"
          git push origin HEAD:sol/battle-board-hierarchy-r2-20260908
