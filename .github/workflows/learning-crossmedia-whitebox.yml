name: Learning Crossmedia Whitebox

on:
  push:
    branches:
      - main
      - 'work/LEARNING-CROSSMEDIA-INTRINSIC-CONTRACT-001-R2'
    paths:
      - 'browser/learning-crossmedia-whitebox.html'
      - 'tests/learning-crossmedia-whitebox.spec.mjs'
      - 'playwright.learning-crossmedia.config.mjs'
      - '.github/workflows/learning-crossmedia-whitebox.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'browser/learning-crossmedia-whitebox.html'
      - 'tests/learning-crossmedia-whitebox.spec.mjs'
      - 'playwright.learning-crossmedia.config.mjs'
      - '.github/workflows/learning-crossmedia-whitebox.yml'

permissions:
  contents: read

jobs:
  chromium-mobile-whitebox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run intrinsic-learning isolated whitebox
        run: npx playwright test --config=playwright.learning-crossmedia.config.mjs --workers=1
      - name: Upload whitebox evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-crossmedia-whitebox-${{ github.run_id }}
          path: |
            playwright-report-learning-crossmedia/
            test-results/
          if-no-files-found: warn
          retention-days: 14
