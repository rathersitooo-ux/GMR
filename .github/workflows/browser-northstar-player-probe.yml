name: TEMP GAMEROAD Northstar Player Probe

on:
  push:
    branches:
      - work/BROWSER-PLAYGLOBAL-NORTHSTAR-R1
    paths:
      - .github/workflows/browser-northstar-player-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/browser-northstar-player-probe.yml

permissions:
  contents: read

jobs:
  public-player-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind actual public build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p northstar-evidence
          curl --fail --silent --show-error --location --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused --max-time 30 \
            "$GAMEROAD_PUBLIC_BASE_URL/gameroad-version.json" \
            | tee northstar-evidence/gameroad-version.json

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: First-time visible UI deck completion to first battle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = process.env.GAMEROAD_PUBLIC_BASE_URL;
          const out = 'northstar-evidence';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 2,
          });
          const page = await context.newPage();
          const consoleErrors = [];
          const pageErrors = [];
          const actions = [];
          let taps = 0;
          let maxScrollY = 0;
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', err => pageErrors.push(String(err)));

          async function visibleState() {
            return page.evaluate(() => {
              const visible = el => {
                const s = getComputedStyle(el), r = el.getBoundingClientRect();
                return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity || 1) > 0 && r.width > 0 && r.height > 0;
              };
              const controls = [...document.querySelectorAll('button,a,input,select,[role="button"]')]
                .filter(visible)
                .map(el => {
                  const r = el.getBoundingClientRect();
                  return {
                    text: String(el.innerText || el.value || '').replace(/\s+/g,' ').trim().slice(0,180),
                    aria: String(el.getAttribute('aria-label') || '').trim().slice(0,180),
                    disabled: Boolean(el.disabled) || el.getAttribute('aria-disabled') === 'true',
                    rect: {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},
                  };
                });
              return {
                body: String(document.body?.innerText || '').replace(/\n{3,}/g,'\n\n').trim().slice(0,12000),
                controls,
                deckTotal: document.getElementById('r4DeckTotal')?.textContent || document.getElementById('deckCount')?.textContent || null,
                scrollY: Math.round(window.scrollY),
                scrollHeight: Math.round(document.documentElement.scrollHeight),
                viewport: {width:innerWidth,height:innerHeight},
              };
            });
          }

          async function snapshot(label) {
            const data = await visibleState();
            data.label = label;
            await page.screenshot({path:`${out}/${label}.png`,fullPage:true});
            fs.writeFileSync(`${out}/${label}.json`, JSON.stringify(data,null,2));
            console.log(`NORTHSTAR_${label.toUpperCase()} ${JSON.stringify(data,null,2)}`);
            return data;
          }

          async function tap(locator, label) {
            await locator.scrollIntoViewIfNeeded().catch(() => {});
            maxScrollY = Math.max(maxScrollY, await page.evaluate(() => Math.round(window.scrollY)));
            await locator.click({timeout:10_000});
            taps += 1;
            actions.push({kind:'tap',label,scrollY:await page.evaluate(() => Math.round(window.scrollY))});
          }

          async function closeDetailIfPresent() {
            const candidates = [
              page.getByRole('button',{name:/閉じる/}).first(),
              page.getByRole('button',{name:/詳細.*閉/}).first(),
              page.getByRole('button',{name:/^×$|^✕$/}).first(),
            ];
            for (const candidate of candidates) {
              if (await candidate.count().catch(() => 0) && await candidate.isVisible().catch(() => false)) {
                await tap(candidate,'カード詳細を閉じる');
                await page.waitForTimeout(120);
                return true;
              }
            }
            return false;
          }

          await page.goto(`${base}/?utm_source=chatgpt.com`, {waitUntil:'domcontentloaded',timeout:60_000});
          await page.waitForTimeout(1200);
          const entry = await snapshot('01-entry');

          await tap(page.getByRole('button',{name:/^バトルへ/}).first(),'Home: バトルへ');
          await page.waitForTimeout(500);
          const setupBefore = await snapshot('02-setup-invalid-deck');
          if (!setupBefore.body.includes('現在26枚')) throw new Error('expected-first-time-deck-26-not-observed');
          if (!setupBefore.controls.some(c => c.text === '盤面へ' && c.disabled)) throw new Error('expected-board-disabled-before-deck-fix');

          await tap(page.getByRole('button',{name:'デッキへ',exact:true}),'Setup: デッキへ');
          await page.waitForTimeout(650);
          const deckBefore = await snapshot('03-deck-before-completion');
          if (String(deckBefore.deckTotal).trim() !== '26') throw new Error(`unexpected-initial-deck-total:${deckBefore.deckTotal}`);

          const labels = await page.locator('button[aria-label$=" 詳細を開く"]').evaluateAll(btns => btns.map(b => b.getAttribute('aria-label')).filter(Boolean));
          const unique = [...new Set(labels)];
          const ordered = [...unique.filter(x => /J 詳細を開く$/.test(x)), ...unique.filter(x => !/J 詳細を開く$/.test(x))];
          const addAttempts = [];
          let jAdded = false;

          for (const label of ordered) {
            const state = await visibleState();
            if (Number.parseInt(String(state.deckTotal),10) >= 40) break;
            const tile = page.getByRole('button',{name:label,exact:true}).first();
            if (!await tile.count().catch(() => 0)) continue;
            try {
              await tap(tile,`Card: ${label}`);
              await page.waitForTimeout(120);
              const detail = await visibleState();
              const add = page.getByRole('button',{name:'デッキに追加',exact:true}).first();
              const canAdd = await add.count().catch(() => 0) && await add.isVisible().catch(() => false) && await add.isEnabled().catch(() => false);
              const detailControls = detail.controls.map(c => c.aria || c.text).filter(Boolean).slice(-24);
              if (canAdd) {
                await tap(add,`Detail: ${label} → デッキに追加`);
                await page.waitForTimeout(120);
                if (/J 詳細を開く$/.test(label)) jAdded = true;
                const afterAdd = await visibleState();
                addAttempts.push({label,added:true,deckTotal:afterAdd.deckTotal,detailControls});
              } else {
                addAttempts.push({label,added:false,deckTotal:detail.deckTotal,detailControls});
              }
              await closeDetailIfPresent();
            } catch (error) {
              const failureState = await visibleState();
              addAttempts.push({label,added:false,error:String(error),deckTotal:failureState.deckTotal,controls:failureState.controls.map(c => c.aria || c.text).filter(Boolean).slice(-30)});
              await snapshot('04-addition-failure');
              throw error;
            }
          }

          const deckReady = await snapshot('05-deck-40-before-save');
          if (Number.parseInt(String(deckReady.deckTotal),10) !== 40) throw new Error(`visible-ui-could-not-reach-40:${deckReady.deckTotal}`);
          if (!jAdded) throw new Error('visible-ui-reached-40-without-observed-j-addition');

          await tap(page.getByRole('button',{name:'保存',exact:true}).first(),'Deck: 保存');
          await page.waitForTimeout(350);
          const saved = await snapshot('06-deck-saved');

          const back = page.getByRole('button',{name:'一つ前の画面へ戻る',exact:true}).first();
          await tap(back,'Deck: ← 戻る');
          await page.waitForTimeout(450);
          let afterBack = await snapshot('07-after-deck-back');
          let returnDestination = afterBack.body.includes('現在のデッキ') || afterBack.controls.some(c => c.text === '盤面へ') ? 'setup' : (afterBack.controls.some(c => /^バトルへ/.test(c.text)) ? 'home' : 'other');

          if (returnDestination === 'home') {
            await tap(page.getByRole('button',{name:/^バトルへ/}).first(),'Home again: バトルへ');
            await page.waitForTimeout(450);
            afterBack = await snapshot('08-setup-after-home-return');
          }

          const setupAfter = await snapshot('09-setup-valid-deck');
          const boardControl = setupAfter.controls.find(c => c.text === '盤面へ');
          if (!boardControl || boardControl.disabled) throw new Error(`board-not-enabled-after-visible-deck-save:${JSON.stringify(boardControl)}`);
          if (!setupAfter.body.includes('40')) throw new Error('setup-after-save-does-not-show-40');

          await tap(page.getByRole('button',{name:'盤面へ',exact:true}).first(),'Setup: 盤面へ');
          await page.waitForTimeout(700);
          const firstBattle = await snapshot('10-first-battle');

          const report = {
            base,
            taps,
            maxScrollY,
            returnDestination,
            initialDeckTotal: deckBefore.deckTotal,
            finalDeckTotal: deckReady.deckTotal,
            jAdded,
            addAttempts,
            actions,
            entryBody:entry.body,
            setupBeforeBody:setupBefore.body,
            deckBeforeBody:deckBefore.body,
            savedBody:saved.body,
            afterBackBody:afterBack.body,
            setupAfterBody:setupAfter.body,
            firstBattleBody:firstBattle.body,
            firstBattleControls:firstBattle.controls,
            consoleErrors,
            pageErrors,
          };
          fs.writeFileSync(`${out}/first-time-to-first-battle-report.json`,JSON.stringify(report,null,2));
          console.log(`NORTHSTAR_FIRST_BATTLE_SUMMARY ${JSON.stringify({taps,maxScrollY,returnDestination,initialDeckTotal:deckBefore.deckTotal,finalDeckTotal:deckReady.deckTotal,jAdded,additions:addAttempts.filter(x=>x.added).length,firstBattleBody:firstBattle.body.slice(0,1200),consoleErrors,pageErrors},null,2)}`);
          if (pageErrors.length) throw new Error(`page-errors:${pageErrors.join(' | ')}`);
          await browser.close();
          NODE

      - name: Run existing visible 4-player Honey journey on same public origin
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .northstar-public
          sed "s#'/browser/GAMEROAD.html'#'/'#g" tests/browser-full-interaction.spec.mjs > .northstar-public/browser-full-interaction.spec.mjs
          cat > .northstar-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';
          const publicProjects = (baseConfig.projects ?? []).filter(p => !p.grep).map(p => ({name:p.name,use:p.use}));
          export default defineConfig({
            testDir:'.',testMatch:'browser-full-interaction.spec.mjs',
            grep:/R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout:240_000,expect:{timeout:7_000},fullyParallel:false,workers:1,retries:0,
            outputDir:'../northstar-evidence/full-path-results',reporter:[['line'],['json',{outputFile:'../northstar-evidence/full-path-report.json'}]],
            use:{...baseConfig.use,baseURL:process.env.GAMEROAD_PUBLIC_BASE_URL,trace:'retain-on-failure',screenshot:'only-on-failure',video:'off'},projects:publicProjects,
          });
          EOF
          npx playwright test --config=.northstar-public/playwright.config.mjs --workers=1

      - name: Upload bounded player evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: northstar-player-probe-${{ github.run_id }}
          path: northstar-evidence/
          if-no-files-found: error
          retention-days: 7
