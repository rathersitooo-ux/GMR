name: TEMP Battle final QA R6B visible click probe

on:
  push:
    branches:
      - sol/battle-final-qa-r6b-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w46-visible-click-probe:
    if: github.actor == 'rathersitooo-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout fresh current product
        uses: actions/checkout@v4
        with:
          ref: 5bf4e7a6963b7f005958dd03d59c89c9eb229fa9
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Materialize visible-only player probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .w46-visible
          cat > .w46-visible/visible-click.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('W46 visible Home to Battle setup remains interactive', async ({ page }, testInfo) => {
            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'commit', timeout: 20_000 });
            expect(response).not.toBeNull();
            expect(response.ok()).toBeTruthy();

            const home = page.locator('section[data-screen="home"]');
            await expect(home, 'Home becomes player-visible').toBeVisible({ timeout: 10_000 });
            await testInfo.attach(`${testInfo.project.name}-home.png`, {
              body: await page.screenshot({ animations: 'allow' }),
              contentType: 'image/png',
            });

            const setupControl = page.locator('[data-home-target="setup"]:visible, [data-go="setup"]:visible').first();
            await expect(setupControl, 'visible Battle setup control').toBeVisible({ timeout: 5_000 });
            await setupControl.click({ timeout: 7_000 });

            const setup = page.locator('section[data-screen="setup"]');
            await expect(setup, 'visible click reaches Setup').toBeVisible({ timeout: 7_000 });
            await testInfo.attach(`${testInfo.project.name}-setup.png`, {
              body: await page.screenshot({ animations: 'allow' }),
              contentType: 'image/png',
            });
          });
          EOF

          cat > .w46-visible/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';

          const names = new Set(['desktop-1280x720', 'phone-390x844', 'short-landscape-667x375']);
          const projects = (baseConfig.projects ?? [])
            .filter((project) => names.has(project.name))
            .map((project) => ({ name: project.name, use: project.use }));

          export default defineConfig({
            testDir: '.',
            testMatch: 'visible-click.spec.mjs',
            timeout: 30_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/w46-visible-click',
            reporter: [['line'], ['json', { outputFile: '../test-results/w46-visible-click/report.json' }]],
            use: {
              ...baseConfig.use,
              trace: 'on',
              screenshot: 'on',
              video: 'on',
            },
            projects,
            webServer: baseConfig.webServer,
          });
          EOF

      - name: Run visible-only three-viewport click probe
        run: npx playwright test --config=.w46-visible/playwright.config.mjs --workers=1

      - name: Upload visible-click evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-final-qa-r6b-visible-${{ github.run_id }}
          path: |
            test-results/w46-visible-click/
          if-no-files-found: error
          retention-days: 14
