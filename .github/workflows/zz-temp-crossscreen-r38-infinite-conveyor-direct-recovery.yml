name: TEMP CROSSSCREEN R38 Direct Recovery

on:
  push:
    branches:
      - work/crossscreen-r38-infinite-conveyor-direct-recovery

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crossscreen-r38-infinite-conveyor-direct-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact acquired preimage
        shell: bash
        run: |
          set -euo pipefail
          BASE=1bab3183c7cfefed209a9ea5465924d3223d6bd0
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "3e02fd3f14ef16287bc9d93f0cbd6e1018b83dd8"
          test "$(git hash-object tests/battle-replay-live-adapter.test.mjs)" = "0820826fa1d4da20342a69bee170132f6ce4633d"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "93a3f53a7dbd0e13640acac752779eb79ec137ce"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "80c72cbcdb2a618fe4d7ee78c2097d4dab86c308"
      - name: Apply bounded reviewed R38 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)

          adapter_path = Path('browser/battle-replay-live-adapter.mjs')
          adapter = adapter_path.read_text()
          adapter = replace_once(
              adapter,
              "import { planBattleConveyor } from './battle-conveyor-presentation-core.mjs';",
              "import {\n  planBattleConveyor,\n  planBattleConveyorEnvironmentFrame\n} from './battle-conveyor-presentation-core.mjs';",
              'adapter import'
          )
          adapter = replace_once(
              adapter,
              "const CARD_PRESENTATION_HOLD_MS = 400;\nconst PARTNER_BATTLE_LOG_HOST_ATTR = 'data-partner-battle-event-log';",
              "const CARD_PRESENTATION_HOLD_MS = 400;\nconst BATTLE_CONVEYOR_ENVIRONMENT_STYLE_ID = 'gameroad-battle-conveyor-environment-r38-style';\nconst BATTLE_CONVEYOR_ENVIRONMENT_HOST_ATTR = 'data-battle-conveyor-environment';\nconst BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_ATTR = 'data-battle-conveyor-segment';\nconst BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_COUNT = 8;\nconst PARTNER_BATTLE_LOG_HOST_ATTR = 'data-partner-battle-event-log';",
              'adapter constants'
          )

          environment_renderer = r'''function ensureBattleConveyorEnvironmentStyle(documentRef) {
            if (!documentRef?.head || typeof documentRef.createElement !== 'function') return false;
            if (documentRef.getElementById?.(BATTLE_CONVEYOR_ENVIRONMENT_STYLE_ID)) return true;
            const style = documentRef.createElement('style');
            style.id = BATTLE_CONVEYOR_ENVIRONMENT_STYLE_ID;
            style.textContent = `
          #battlePhaseSurface{position:relative}
          #battlePhaseSurface>[data-battle-conveyor-environment]{position:absolute;inset:0;overflow:hidden;pointer-events:none;contain:paint;opacity:.42}
          #battlePhaseSurface>[data-battle-conveyor-environment]>[data-battle-conveyor-segment]{position:absolute;left:50%;height:0;border-top:1px solid currentColor;transform:translate(-50%,-50%);transform-origin:50% 50%;transition:top 180ms ease-out,width 180ms ease-out,opacity 180ms ease-out}
          body.low-perf #battlePhaseSurface>[data-battle-conveyor-environment]>[data-battle-conveyor-segment]{transition:none!important}
          @media(prefers-reduced-motion:reduce){#battlePhaseSurface>[data-battle-conveyor-environment]>[data-battle-conveyor-segment]{transition:none!important}}
          `;
            documentRef.head.appendChild(style);
            return true;
          }

          function ensureBattleConveyorEnvironmentHost(documentRef, frame) {
            const surface = documentRef?.getElementById?.('battlePhaseSurface');
            if (!surface || typeof documentRef?.createElement !== 'function') return null;
            ensureBattleConveyorEnvironmentStyle(documentRef);
            let host = typeof surface.querySelector === 'function'
              ? surface.querySelector(`[${BATTLE_CONVEYOR_ENVIRONMENT_HOST_ATTR}]`)
              : null;
            if (!host) {
              host = documentRef.createElement('div');
              if (!host || typeof host.setAttribute !== 'function') return null;
              host.setAttribute(BATTLE_CONVEYOR_ENVIRONMENT_HOST_ATTR, '');
              host.setAttribute('aria-hidden', 'true');
              if (host.style) host.style.pointerEvents = 'none';
              if (typeof surface.insertBefore === 'function') surface.insertBefore(host, surface.firstChild || null);
              else if (typeof surface.appendChild === 'function') surface.appendChild(host);
              else return null;
            }
            if (!host.dataset || !host.children || typeof host.appendChild !== 'function') return null;
            if (host.children.length === 0) {
              for (const segment of frame.segments) {
                const node = documentRef.createElement('div');
                if (!node || typeof node.setAttribute !== 'function' || !node.style) return null;
                node.setAttribute(BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_ATTR, segment.segmentId);
                host.appendChild(node);
              }
            }
            return host;
          }

          export function renderBattleConveyorEnvironmentFrame(frame, environment = {}, metadata = {}) {
            if (!frame ||
                frame.schema !== 'gameroad.battle-conveyor-environment.v1' ||
                frame.presentationOnly !== true ||
                frame.gameStateWrite !== false ||
                frame.position109Write !== false ||
                frame.targetWrite !== false ||
                frame.orderWrite !== false ||
                !Array.isArray(frame.segments) ||
                frame.segments.length !== BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_COUNT) {
              return false;
            }
            const documentRef = environmentValue(environment, 'document');
            const host = ensureBattleConveyorEnvironmentHost(documentRef, frame);
            if (!host || host.children.length !== frame.segments.length) return false;
            const nodes = Array.from(host.children);
            for (let index = 0; index < frame.segments.length; index += 1) {
              const segment = frame.segments[index];
              const node = nodes[index];
              if (node?.getAttribute?.(BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_ATTR) !== segment.segmentId || !node?.style) {
                return false;
              }
              node.style.top = `${(segment.screenY * 100).toFixed(3)}%`;
              node.style.width = `${(segment.scale * 100).toFixed(3)}%`;
              node.style.opacity = segment.opacity.toFixed(3);
              if (node.dataset) node.dataset.recycleCycle = String(segment.recycleCycle);
            }
            host.dataset.battleConveyorEnvironment = 'mounted';
            host.dataset.battleConveyorEnvironmentPhase = frame.phase;
            host.dataset.battleConveyorEnvironmentMotion = frame.motionSuppressed ? 'static_only' : 'allowed';
            host.dataset.battleConveyorEnvironmentTravel = String(frame.effectiveTravel);
            const eventId = maybeString(metadata.eventId);
            if (eventId) host.dataset.battleConveyorEnvironmentEvent = eventId;
            return true;
          }

          function planAcceptedBattleEnvironmentFrame(serial, preferences, phase = 'RESOLVE') {
            safeInteger(serial, 'RESOLUTION_SERIAL', 0);
            return planBattleConveyorEnvironmentFrame({
              segmentCount: BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_COUNT,
              travel: serial / BATTLE_CONVEYOR_ENVIRONMENT_SEGMENT_COUNT,
              phase,
              reducedMotion: preferences.reducedMotion,
              lowPerf: preferences.lowPerf
            });
          }

          '''
          adapter = replace_once(
              adapter,
              'export function renderBattleReplayCardPresentationPlan(plan, environment = {}) {',
              environment_renderer + 'export function renderBattleReplayCardPresentationPlan(plan, environment = {}) {',
              'environment renderer insertion'
          )

          old_bridge_start = '''export function createBattleReplayCardPresentationBridge(environment = {}) {
            const sessions = new Map();
            const renderPlan = typeof environment.renderPlan === 'function'
              ? environment.renderPlan
              : plan => renderBattleReplayCardPresentationPlan(plan, environment);

            function begin(matchId) {
              if (!nonEmptyString(matchId)) throw new TypeError('MATCH_ID_REQUIRED');
              const runtime = {
                state: createCardPresentationSession({ sessionId: matchId }),
                lastPlan: null,
                lastFinisherPlan: null
              };
              sessions.set(matchId, runtime);
              return runtime.state;
            }
'''
          new_bridge_start = '''export function createBattleReplayCardPresentationBridge(environment = {}) {
            const sessions = new Map();
            const renderPlan = typeof environment.renderPlan === 'function'
              ? environment.renderPlan
              : plan => renderBattleReplayCardPresentationPlan(plan, environment);
            const renderEnvironmentFrame = typeof environment.renderEnvironmentFrame === 'function'
              ? environment.renderEnvironmentFrame
              : (frame, metadata) => renderBattleConveyorEnvironmentFrame(frame, environment, metadata);

            function begin(matchId) {
              if (!nonEmptyString(matchId)) throw new TypeError('MATCH_ID_REQUIRED');
              const preferences = readBattleReplayCardPresentationPreferences(environment);
              const environmentFrame = planAcceptedBattleEnvironmentFrame(0, preferences, 'IDLE_READ');
              const runtime = {
                state: createCardPresentationSession({ sessionId: matchId }),
                lastPlan: null,
                lastFinisherPlan: null,
                lastEnvironmentFrame: environmentFrame
              };
              sessions.set(matchId, runtime);
              try {
                renderEnvironmentFrame(environmentFrame, { eventId: `battle-environment:begin:${matchId}` });
              } catch {
                // Environment presentation is strictly fail-soft and never owns replay/gameplay success.
              }
              return runtime.state;
            }
'''
          adapter = replace_once(adapter, old_bridge_start, new_bridge_start, 'bridge start')

          old_current_fallback = '''    const current = sessions.get(matchId) || {
              state: createCardPresentationSession({ sessionId: matchId }),
              lastPlan: null,
              lastFinisherPlan: null
            };
'''
          new_current_fallback = '''    const current = sessions.get(matchId) || {
              state: createCardPresentationSession({ sessionId: matchId }),
              lastPlan: null,
              lastFinisherPlan: null,
              lastEnvironmentFrame: null
            };
'''
          if adapter.count(old_current_fallback) != 2:
              raise SystemExit(f'current fallback: expected 2 anchors, got {adapter.count(old_current_fallback)}')
          adapter = adapter.replace(old_current_fallback, new_current_fallback)

          old_resolution_store = '''    if (!result.accepted) return result;
            sessions.set(matchId, {
              state: result.state,
              lastPlan: result.duplicate ? current.lastPlan : result.plan,
              lastFinisherPlan: current.lastFinisherPlan
            });
            if (!result.duplicate && result.plan) {
              try {
                renderPlan(result.plan);
              } catch {
                // Presentation is strictly fail-soft and never owns replay/gameplay success.
              }
            }
            return result;
'''
          new_resolution_store = '''    if (!result.accepted) return result;
            let environmentFrame = current.lastEnvironmentFrame;
            if (!result.duplicate) {
              const preferences = readBattleReplayCardPresentationPreferences(environment);
              environmentFrame = planAcceptedBattleEnvironmentFrame(serial, preferences, 'RESOLVE');
            }
            sessions.set(matchId, {
              state: result.state,
              lastPlan: result.duplicate ? current.lastPlan : result.plan,
              lastFinisherPlan: current.lastFinisherPlan,
              lastEnvironmentFrame: environmentFrame
            });
            if (!result.duplicate && result.plan) {
              try {
                renderPlan(result.plan);
              } catch {
                // Presentation is strictly fail-soft and never owns replay/gameplay success.
              }
            }
            if (!result.duplicate && environmentFrame) {
              try {
                renderEnvironmentFrame(environmentFrame, { eventId: `battle-resolution:${serial}` });
              } catch {
                // Environment presentation is strictly fail-soft and never owns replay/gameplay success.
              }
            }
            return result;
'''
          adapter = replace_once(adapter, old_resolution_store, new_resolution_store, 'resolution store')

          old_match_store = '''    sessions.set(matchId, {
              state: current.state,
              lastPlan: current.lastPlan,
              lastFinisherPlan: plan
            });
'''
          new_match_store = '''    sessions.set(matchId, {
              state: current.state,
              lastPlan: current.lastPlan,
              lastFinisherPlan: plan,
              lastEnvironmentFrame: current.lastEnvironmentFrame
            });
'''
          adapter = replace_once(adapter, old_match_store, new_match_store, 'match store')

          old_snapshot = '''      lastPlan: runtime.lastPlan,
              lastFinisherPlan: runtime.lastFinisherPlan
'''
          new_snapshot = '''      lastPlan: runtime.lastPlan,
              lastFinisherPlan: runtime.lastFinisherPlan,
              lastEnvironmentFrame: runtime.lastEnvironmentFrame
'''
          adapter = replace_once(adapter, old_snapshot, new_snapshot, 'snapshot')
          adapter_path.write_text(adapter)

          test_path = Path('tests/battle-replay-live-adapter.test.mjs')
          tests = test_path.read_text()
          environment_tests = r'''
          test('accepted Battle resolutions advance one reusable conveyor segment while duplicate events do not advance the environment', () => {
            const frames = [];
            const bridge = createBattleReplayCardPresentationBridge({
              document: null,
              matchMedia: () => ({ matches: false }),
              renderPlan() {},
              renderEnvironmentFrame(frame, metadata) {
                frames.push({ frame, metadata });
                return true;
              }
            });
            bridge.begin('M-ENV');
            const first = bridge.acceptAcceptedResolution({ matchId: 'M-ENV', serial: 1 });
            const duplicate = bridge.acceptAcceptedResolution({ matchId: 'M-ENV', serial: 1 });
            const second = bridge.acceptAcceptedResolution({ matchId: 'M-ENV', serial: 2 });
            assert.equal(first.accepted, true);
            assert.equal(duplicate.duplicate, true);
            assert.equal(second.accepted, true);
            assert.equal(frames.length, 3);
            assert.deepEqual(frames.map(row => row.metadata.eventId), [
              'battle-environment:begin:M-ENV',
              'battle-resolution:1',
              'battle-resolution:2'
            ]);
            const ids = frame => frame.segments.map(segment => segment.segmentId);
            assert.deepEqual(ids(frames[1].frame), ids(frames[0].frame));
            assert.deepEqual(ids(frames[2].frame), ids(frames[0].frame));
            assert.equal(frames[0].frame.segments.length, 8);
            assert.equal(frames[1].frame.effectiveTravel, 1 / 8);
            assert.equal(frames[2].frame.effectiveTravel, 2 / 8);
            assert.equal(frames[2].frame.gameStateWrite, false);
            assert.equal(frames[2].frame.position109Write, false);
            assert.equal(frames[2].frame.targetWrite, false);
            assert.equal(frames[2].frame.orderWrite, false);
            assert.equal(bridge.snapshot('M-ENV').lastEnvironmentFrame.effectiveTravel, 2 / 8);
          });

          test('Reduced Motion and lowPerf preserve the same finite conveyor identities while suppressing non-essential travel', () => {
            for (const options of [{ reduceMotion: true }, { lowPerf: true }]) {
              const fake = fakePresentationDocument(options);
              const frames = [];
              const bridge = createBattleReplayCardPresentationBridge({
                document: fake.document,
                matchMedia: () => ({ matches: false }),
                renderPlan() {},
                renderEnvironmentFrame(frame) { frames.push(frame); return true; }
              });
              bridge.begin(`M-ENV-${options.reduceMotion ? 'REDUCE' : 'LOW'}`);
              bridge.acceptAcceptedResolution({
                matchId: `M-ENV-${options.reduceMotion ? 'REDUCE' : 'LOW'}`,
                serial: 1
              });
              assert.equal(frames.length, 2);
              assert.equal(frames[1].motionSuppressed, true);
              assert.equal(frames[1].effectiveTravel, 0);
              assert.deepEqual(
                frames[1].segments.map(segment => segment.segmentId),
                frames[0].segments.map(segment => segment.segmentId)
              );
              assert.deepEqual(
                frames[1].segments.map(segment => segment.normalizedDepth),
                frames[0].segments.map(segment => segment.normalizedDepth)
              );
            }
          });

          '''
          tests = replace_once(
              tests,
              "test('presentation preferences fail to static-only for user/system motion reduction and low performance', () => {",
              environment_tests + "test('presentation preferences fail to static-only for user/system motion reduction and low performance', () => {",
              'unit tests insertion'
          )
          test_path.write_text(tests)

          full_path = Path('tests/browser-full-interaction.spec.mjs')
          full = full_path.read_text()
          full = replace_once(
              full,
              '''  let cardPresentationFallbacks = 0;
            let lastCardPresentationEvent = null;
''',
              '''  let cardPresentationFallbacks = 0;
            let lastCardPresentationEvent = null;
            let conveyorEnvironmentFrames = 0;
            let lastConveyorEnvironmentEvent = null;
            let conveyorSegmentIds = null;
''',
              'full interaction counters'
          )
          environment_probe = r'''
              const conveyorEnvironment = battle.locator('#battlePhaseSurface [data-battle-conveyor-environment]');
              if ((await conveyorEnvironment.count()) === 1) {
                const evidence = await conveyorEnvironment.first().evaluate((host) => ({
                  ariaHidden: host.getAttribute('aria-hidden'),
                  pointerEvents: getComputedStyle(host).pointerEvents,
                  eventId: host.dataset.battleConveyorEnvironmentEvent || null,
                  motion: host.dataset.battleConveyorEnvironmentMotion || null,
                  effectiveTravel: Number(host.dataset.battleConveyorEnvironmentTravel),
                  segmentIds: Array.from(host.querySelectorAll('[data-battle-conveyor-segment]')).map((node) =>
                    node.getAttribute('data-battle-conveyor-segment')),
                }));
                expect(evidence.ariaHidden).toBe('true');
                expect(evidence.pointerEvents).toBe('none');
                expect(evidence.segmentIds).toHaveLength(8);
                expect(new Set(evidence.segmentIds).size).toBe(8);
                if (conveyorSegmentIds) expect(evidence.segmentIds).toEqual(conveyorSegmentIds);
                else conveyorSegmentIds = evidence.segmentIds;
                if (evidence.eventId?.startsWith('battle-resolution:') && evidence.eventId !== lastConveyorEnvironmentEvent) {
                  lastConveyorEnvironmentEvent = evidence.eventId;
                  conveyorEnvironmentFrames += 1;
                  expect(evidence.motion).toBe('allowed');
                  expect(evidence.effectiveTravel).toBeGreaterThan(0);
                  if (conveyorEnvironmentFrames === 1) {
                    await attachStateScreenshot(page, testInfo, `${evidencePrefix}-battle-conveyor-environment`);
                  }
                }
              }

          '''
          full = replace_once(
              full,
              '''    if (await satisfyVisibleAbilityChoice(page)) {
''',
              environment_probe + '''    if (await satisfyVisibleAbilityChoice(page)) {
''',
              'full interaction environment probe'
          )
          full = replace_once(
              full,
              '''  expect(cardPresentationFallbacks, 'accepted/public Battle resolution mounts the current CardPRES fallback on the visible production resolution surface').toBeGreaterThan(0);
''',
              '''  expect(cardPresentationFallbacks, 'accepted/public Battle resolution mounts the current CardPRES fallback on the visible production resolution surface').toBeGreaterThan(0);
            expect(conveyorEnvironmentFrames, 'accepted/public Battle resolution advances the finite recycled environment on the real Battle surface').toBeGreaterThan(0);
            expect(conveyorSegmentIds, 'Battle environment exposes the stable finite segment pool').toHaveLength(8);
''',
              'full interaction environment acceptance'
          )
          full = replace_once(
              full,
              '''    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, cardPresentationFallbacks=${cardPresentationFallbacks}, result=${roundsText}` ,
''',
              '''    description: `submitted=${roundsSubmitted}, targetConfirms=${targetConfirms}, battleAdvances=${presentationAdvances}, abilityConfirms=${abilityConfirms}, cardPresentationFallbacks=${cardPresentationFallbacks}, conveyorEnvironmentFrames=${conveyorEnvironmentFrames}, result=${roundsText}` ,
''',
              'full interaction annotation'
          )
          full = replace_once(
              full,
              '''  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, cardPresentationFallbacks, roundsText };
''',
              '''  return { battle, result, roundsSubmitted, targetConfirms, presentationAdvances, abilityConfirms, cardPresentationFallbacks, conveyorEnvironmentFrames, conveyorSegmentIds, roundsText };
''',
              'full interaction return'
          )
          full_path.write_text(full)
          PY
          NEW_BLOB="$(git hash-object browser/battle-replay-live-adapter.mjs)"
          python - "$NEW_BLOB" <<'PY'
          from pathlib import Path
          import sys
          path = Path('deploy/cloudflare/tests/build.test.mjs')
          text = path.read_text()
          old = "    currentBlob: '3e02fd3f14ef16287bc9d93f0cbd6e1018b83dd8',\n  },\n  {\n    file: 'partner-battle-event-log-projection.mjs',"
          new = f"    currentBlob: '{sys.argv[1]}',\n  }},\n  {{\n    file: 'partner-battle-event-log-projection.mjs',"
          if text.count(old) != 1:
              raise SystemExit(f'provenance anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-replay-live-adapter.test.mjs
          node tests/battle-conveyor-presentation-core.test.mjs
          node --check tests/browser-full-interaction.spec.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit durable exact-four delta and remove executor
        shell: bash
        run: |
          set -euo pipefail
          BASE=1bab3183c7cfefed209a9ea5465924d3223d6bd0
          TEMP=.github/workflows/zz-temp-crossscreen-r38-infinite-conveyor-direct-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs tests/browser-full-interaction.spec.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m "CROSSSCREEN R38: mount recycled environment in live Battle presentation"
          git rm "$TEMP"
          git commit -m "CROSSSCREEN R38: remove temporary direct recovery executor"
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${changed[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${changed[2]}" = "tests/battle-replay-live-adapter.test.mjs"
          test "${changed[3]}" = "tests/browser-full-interaction.spec.mjs"
          git push origin HEAD:work/crossscreen-r38-infinite-conveyor-direct-recovery
