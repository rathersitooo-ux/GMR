name: TEMP PartnerAdvice R24 bounded executor
on:
  push:
    branches: [work/partneradvice-r24-visible-battle-mount-recovery-20260825-1617]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: work/partneradvice-r24-visible-battle-mount-recovery-20260825-1617}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify R24 authorization and preimages
        shell: bash
        run: |
          set -euo pipefail
          BASE=562b6cf535aa74ec4d791483ed2c8abfa0ff7905
          MANIFEST=data/preaction-authorizations/VWORK-PARTNERADVICE-R24-VISIBLE-BATTLE-PREACTION-20260825T1617.json
          FIRST=$(git rev-list --reverse "${BASE}..HEAD" | head -n1)
          test "$(git rev-parse "${FIRST}^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$FIRST" | wc -l)" -eq 1
          git diff-tree --no-commit-id --name-only -r "$FIRST" | grep -Fx "$MANIFEST"
          test "$(git hash-object browser/GAMEROAD.html)" = "6a49aa324d0c40ed342e9e9b0cafc0683d64cdc1"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "15fdd63a799bcbf896575a18702b28cddebc7237"
          node - <<'NODE'
          const fs=require('fs'),p='data/preaction-authorizations/VWORK-PARTNERADVICE-R24-VISIBLE-BATTLE-PREACTION-20260825T1617.json',m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.recordId!=='VWORK-PARTNERADVICE-R24-VISIBLE-BATTLE-PREACTION-20260825T1617')throw Error('bad record id');
          if(m.authorizationBaseSha!=='562b6cf535aa74ec4d791483ed2c8abfa0ff7905')throw Error('stale auth base');
          if(!String(m.proceedToken||'').startsWith('PROCEED|VWORK-PARTNERADVICE-R24-VISIBLE-BATTLE-PREACTION-20260825T1617|PREACTION_PROCEED_ALLOWED|MATERIAL_NOVEL|'))throw Error('bad proceed token');
          const want=['browser/GAMEROAD.html','tests/browser-full-interaction.spec.mjs','.github/workflows/partneradvice-r24-bounded-executor.yml'].sort();
          if(JSON.stringify([...(m.scope||[])].sort())!==JSON.stringify(want))throw Error('bad scope');
          NODE
      - name: Extract read-only R23 donor and apply as R24
        shell: bash
        run: |
          set -euo pipefail
          DONOR_BRANCH=work/partneradvice-r23-visible-battle-mount-currentmain-20260825-1509
          DONOR_SHA=375b10142a7d244eca0ee2e04ce46a1189a6d7a7
          git fetch origin "$DONOR_BRANCH:refs/remotes/origin/r23-donor"
          test "$(git rev-parse refs/remotes/origin/r23-donor)" = "$DONOR_SHA"
          git show "$DONOR_SHA:.github/workflows/partneradvice-r23-bounded-executor.yml" > /tmp/r23-donor.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/r23-donor.yml').read_text()
          token="          python3 - <<'PY'\n"
          start=s.index(token)+len(token)
          end=s.index("\n          PY\n",start)
          raw=s[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())+'\n'
          code=code.replace('R23','R24').replace('r23','r24')
          Path('/tmp/r24-patch.py').write_text(code)
          PY
          python3 /tmp/r24-patch.py
          python3 - <<'PY'
          from pathlib import Path
          h=Path('browser/GAMEROAD.html').read_text()
          t=Path('tests/browser-full-interaction.spec.mjs').read_text()
          required=[
            'gameroad-partner-advice-object-projection-r24',
            "if(kind==='road'||kind==='battle')return document.querySelector('#hand .handCard[data-card-id=",
            "if(kind==='target')return document.querySelector('#boardPlayers .boardPlayerToken[data-player=",
            'r.presentationRole===ROLE&&r.autoExecute===false',
            "clear();const env=explicit===undefined?api()?.adviceEnvelope?.():explicit",
            'data-partner-advice-glyph',
            "rangeVisible:document.getElementById('battleMap')?.classList.contains('showRange')",
            '__GAMEROAD_PARTNER_ADVICE_BOARD_R24__',
            'battle-partner-advice-object-projection-visible'
          ]
          missing=[x for x in required if x not in h and x not in t]
          if missing: raise SystemExit('R24 static GREEN missing: '+repr(missing))
          def adapter_ok(txt):
            return "#hand .handCard[data-card-id=" in txt and "#boardPlayers .boardPlayerToken[data-player=" in txt and 'r.presentationRole===ROLE&&r.autoExecute===false' in txt
          if not adapter_ok(h): raise SystemExit('R24 adapter normal GREEN failed')
          bad=h.replace('#hand .handCard[data-card-id=','#hand .r24MissingCard[data-card-id=',1)
          if adapter_ok(bad): raise SystemExit('R24 known-bad wrong selector was not detected')
          if 'dangerBtn' not in h or 'showRange' not in h: raise SystemExit('R24 nearby-normal threat/range missing')
          print('R24_SENSITIVITY known-bad-wrong-hand-selector=RED_EXPECTED normal=GREEN nearby-range-threat=GREEN')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'browser/GAMEROAD.html'
          git diff --name-only | grep -Fx 'tests/browser-full-interaction.spec.mjs'
          node --test tests/partner-advice-runtime-mount.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git commit -m 'PARTNERADVICE R24: project advice onto current Battle objects'
          git push origin HEAD:work/partneradvice-r24-visible-battle-mount-recovery-20260825-1617
