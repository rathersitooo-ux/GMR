name: OPS AI Evidence Purpose Diagnose R2
on:
  push:
    branches:
      - work/ops-ai-evidence-purpose-binding-r2-20260829
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep protocol fixture evidence inside its test packet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sol-reasoning-protocol.test.mjs')
          text = p.read_text()
          old = "  const packed = packReasoningPacket(source, evidenceContext());"
          new = "  const packed = packReasoningPacket(source, evidenceContext(), { maxWireBytes: 5000 });"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'gameroad-evidence-bot'
          git config user.email 'gameroad-evidence-bot@users.noreply.github.com'
          git add tests/sol-reasoning-protocol.test.mjs
          git commit -m 'test: preserve causal refs in protocol fixture packet'
          git push origin HEAD:work/ops-ai-evidence-purpose-binding-r2-20260829
