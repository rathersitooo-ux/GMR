name: TEMP Partner Advice Quick3 Diagnostic R4

on:
  push:
    branches:
      - sol/partner-advice-quick3-r1-20260913
    paths:
      - .github/workflows/zz-temp-partner-advice-quick3-r4.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect contextual tutorial implementation and source-game coaching
        shell: bash
        run: |
          set -euo pipefail
          start=$(grep -n "export function createBattleContextualTutorialReplayControl" browser/partner-advice-runtime-mount.mjs | head -1 | cut -d: -f1)
          end=$((start + 150))
          echo "=== contextual replay control lines ${start}-${end} ==="
          nl -ba browser/partner-advice-runtime-mount.mjs | sed -n "${start},${end}p"
          help=$(grep -n "export function projectTutorialExperienceHelp" browser/tutorial-experience-profile-core.mjs | head -1 | cut -d: -f1)
          help_end=$((help + 90))
          echo "=== tutorial experience help lines ${help}-${help_end} ==="
          nl -ba browser/tutorial-experience-profile-core.mjs | sed -n "${help},${help_end}p"
          echo "=== focused baseline failures ==="
          set +e
          node --test tests/partner-advice-runtime-mount.test.mjs
          rc=$?
          set -e
          echo "BASELINE_RC=$rc"
          exit 0
