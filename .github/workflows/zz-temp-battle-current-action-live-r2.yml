name: TEMP Battle current action live R2
on:
  push:
    branches:
      - sol/battle-current-action-live-r2-20260914
    paths:
      - .github/workflows/zz-temp-battle-current-action-live-r2.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-current-action-live-r2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch public package spec only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/scripts/build.mjs')
          s = p.read_text()
          entry = "  { source: 'browser/battle-current-action-context-presentation-core.mjs', output: 'battle-current-action-context-presentation-core.mjs', artifact: 'battle_current_action_context_presentation_core', label: 'Battle current action context presentation core' },\n"
          if entry not in s:
              anchor = "  { source: 'browser/battle-current-player-ui-live-adapter.mjs', output: 'battle-current-player-ui-live-adapter.mjs', artifact: 'battle_current_player_ui_live_adapter', label: 'Battle current player UI live adapter' },\n"
              if s.count(anchor) != 1:
                  raise SystemExit('expected unique current-player live adapter package anchor')
              s = s.replace(anchor, anchor + entry, 1)
              p.write_text(s)
          PY
      - name: Focused tests and package provenance
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-current-action-context-presentation-core.test.mjs
          node --test tests/battle-current-player-ui-live-adapter.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check
      - name: Commit bounded package delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/cloudflare/scripts/build.mjs; then
            echo 'package entry already present'
            exit 0
          fi
          git config user.name 'gameroad-sol-bot'
          git config user.email 'gameroad-sol-bot@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m 'Battle: package current action context core'
          git push origin HEAD:sol/battle-current-action-live-r2-20260914
