name: Home Legacy Visual Layer R88 Executor
on:
  push:
    branches:
      - sol/home-legacy-visual-layer-r88-20260906
    paths:
      - .github/workflows/home-legacy-visual-layer-r88-executor.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/home-legacy-visual-layer-r88-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded current-authority regression repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/home-boot-runtime-mount.mjs')
          test_path = Path('tests/home-boot-presentation.test.mjs')
          runtime = runtime_path.read_text()
          tests = test_path.read_text()

          old_runtime = """// The codex Home visual layer is still the current player-facing Home consumer. Do not destroy it
          // during compatibility cleanup; only duplicate legacy controls are safe to remove here.
          const LEGACY_HOME_SELECTORS = Object.freeze([
            '#codexHomePartnerChip',
          """
          new_runtime = """// R62: the legacy visual layer and duplicate legacy controls are retired Home producers.
          // Keep the current hero/background/character and canonical SlidePad/routes; remove only these legacy nodes.
          const LEGACY_HOME_SELECTORS = Object.freeze([
            '#codexHomeVisualLayer',
            '.codexHomeVisualLayer',
            '#codexHomePartnerChip',
          """
          if runtime.count(old_runtime) != 1:
              raise SystemExit(f'authorized runtime pattern count was {runtime.count(old_runtime)}, expected exactly 1')
          if '#codexHomeVisualLayer' in runtime or '.codexHomeVisualLayer' in runtime:
              raise SystemExit('legacy visual-layer selector already present before bounded repair')
          runtime = runtime.replace(old_runtime, new_runtime, 1)

          old_test = r'''test('Home runtime preserves the current visual layer while removing duplicate legacy controls', () => {
            const removed = [];
            const liveVisualLayer = { remove: () => removed.push('visual') };
            const battleCta = { remove: () => removed.push('battle') };
            const partnerChip = { remove: () => removed.push('partner') };
            const home = {
              querySelectorAll(selector) {
                if (selector === '#codexHomeVisualLayer' || selector === '.codexHomeVisualLayer') return [liveVisualLayer];
                if (selector === '#codexHomeBattleCta' || selector === '.codexBattleCta') return [battleCta];
                if (selector === '#codexHomePartnerChip' || selector === '.codexPartnerChip') return [partnerChip];
                return [];
              },
            };
            assert.equal(removeLegacyHomeNodes(home), 2);
            assert.deepEqual(removed.sort(), ['battle', 'partner']);
          });'''
          new_test = r'''test('Home runtime removes the retired visual layer together with duplicate legacy controls', () => {
            const removed = [];
            const legacyLayer = { remove: () => removed.push('visual') };
            const battleCta = { remove: () => removed.push('battle') };
            const partnerChip = { remove: () => removed.push('partner') };
            const home = {
              querySelectorAll(selector) {
                if (selector === '#codexHomeVisualLayer' || selector === '.codexHomeVisualLayer') return [legacyLayer];
                if (selector === '#codexHomeBattleCta' || selector === '.codexBattleCta') return [battleCta];
                if (selector === '#codexHomePartnerChip' || selector === '.codexPartnerChip') return [partnerChip];
                return [];
              },
            };
            assert.equal(removeLegacyHomeNodes(home), 3);
            assert.deepEqual(removed.sort(), ['battle', 'partner', 'visual']);
          });'''
          if tests.count(old_test) != 1:
              raise SystemExit(f'stale current test pattern count was {tests.count(old_test)}, expected exactly 1')
          if new_test in tests:
              raise SystemExit('replacement current-authority test already exists before repair')
          tests = tests.replace(old_test, new_test, 1)

          runtime_path.write_text(runtime)
          test_path.write_text(tests)
          PY
      - name: Run focused Home regression
        run: node --test tests/home-boot-presentation.test.mjs
      - name: Commit bounded product repair and cleanup transient authorization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-scoped-patch'
          git config user.email 'gameroad-scoped-patch@users.noreply.github.com'
          git add browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs
          git commit -m 'Home: remove retired legacy visual overlay'
          rm .github/workflows/home-legacy-visual-layer-r88-executor.yml
          rm data/preaction-authorizations/HOME-LEGACY-VISUAL-LAYER-R88B-20260906T0318-SOL-H7K4M2.json
          git add -A
          git commit -m 'PREACTION: cleanup Home legacy visual-layer repair'
          git push origin HEAD:sol/home-legacy-visual-layer-r88-20260906
