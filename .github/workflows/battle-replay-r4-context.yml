name: Battle Replay R4 exact context extractor

on:
  push:
    branches:
      - work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT

permissions:
  contents: write

jobs:
  extract-current-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify production blob and extract bounded source context
        shell: bash
        run: |
          set -euo pipefail
          target="browser/GAMEROAD.html"
          expected_blob="c7f5ebf7828840de695093cdd782882d0f00aeba"
          actual_blob="$(git hash-object "${target}")"
          if [[ "${actual_blob}" != "${expected_blob}" ]]; then
            echo "production blob drift: expected=${expected_blob} actual=${actual_blob}"
            exit 1
          fi
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          needles = [
              'resolveBattleView',
              'endMatch',
              'showResult',
              'pushLog',
              'state.match.log',
              'roundLog',
              'gameLog',
              'checkpointTurnLog',
              'makeRoundSnapshot',
          ]
          radius = 5000
          max_hits = 4
          out = []
          out.append(f'R4_SOURCE_SHA256={hashlib.sha256(text.encode("utf-8")).hexdigest()}')
          out.append(f'R4_SOURCE_CHARS={len(text)}')
          out.append('R4_POLICY=read-only bounded exact-context extraction; no production bytes changed')
          for needle in needles:
              starts = []
              pos = 0
              while len(starts) < max_hits:
                  idx = text.find(needle, pos)
                  if idx < 0:
                      break
                  starts.append(idx)
                  pos = idx + len(needle)
              out.append(f'\n===== NEEDLE {needle!r} HIT_COUNT_SHOWN={len(starts)} =====')
              for n, idx in enumerate(starts, 1):
                  lo = max(0, idx-radius)
                  hi = min(len(text), idx+len(needle)+radius)
                  snippet = text[lo:hi]
                  out.append(f'\n--- HIT {n} OFFSET={idx} RANGE={lo}:{hi} ---\n{snippet}\n--- END HIT {n} ---')
          Path('evidence/battle-replay-r4-context.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          test -s evidence/battle-replay-r4-context.txt
          echo "evidence bytes=$(wc -c < evidence/battle-replay-r4-context.txt)"

      - name: Commit evidence and self-remove extractor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/battle-replay-r4-context.yml
          git config user.name "gameroad-r4-bot"
          git config user.email "gameroad-r4-bot@users.noreply.github.com"
          git add evidence/battle-replay-r4-context.txt .github/workflows/battle-replay-r4-context.yml
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "${changed}"
          if [[ "${changed}" != $'.github/workflows/battle-replay-r4-context.yml\nevidence/battle-replay-r4-context.txt' ]]; then
            echo "unexpected staged paths"
            exit 1
          fi
          git commit -m "[BATTLE-REPLAY R4] capture exact live Battle/Result context"
          git push origin HEAD:work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT
