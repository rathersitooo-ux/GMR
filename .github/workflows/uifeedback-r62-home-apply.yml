name: UIFEEDBACK R62R Home Illustration Acceptance

on:
  push:
    branches:
      - 'work/uifeedback-r62r-home-illustration-public-20260826'
    paths:
      - 'browser/GAMEROAD.html'
      - 'browser/home-theme-orientation-core.mjs'
      - 'assets/visual/home/**'
      - 'deploy/cloudflare/scripts/build.mjs'
      - 'deploy/cloudflare/tests/build.test.mjs'
      - 'tests/home-theme-orientation-core.test.mjs'
      - 'tests/browser-full-interaction.spec.mjs'
      - '.github/workflows/uifeedback-r62-home-apply.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'browser/GAMEROAD.html'
      - 'browser/home-theme-orientation-core.mjs'
      - 'assets/visual/home/**'
      - 'deploy/cloudflare/scripts/build.mjs'
      - 'deploy/cloudflare/tests/build.test.mjs'
      - 'tests/home-theme-orientation-core.test.mjs'
      - 'tests/browser-full-interaction.spec.mjs'
      - '.github/workflows/uifeedback-r62-home-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uifeedback-r62-home-illustration-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Home illustration and orientation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Home orientation core and public package checks
        run: |
          set -euo pipefail
          node --test tests/home-theme-orientation-core.test.mjs deploy/cloudflare/tests/build.test.mjs
          node --check deploy/cloudflare/scripts/build.mjs

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run temporal Home orientation Browser evidence
        run: npx playwright test --config=playwright.full-interaction.config.mjs --grep='R62R proves Home illustration orientation transitions through temporal Browser evidence' --workers=1

      - name: Upload temporal Browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: uifeedback-r62-home-orientation-${{ github.run_id }}
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
          if-no-files-found: error
          retention-days: 14
