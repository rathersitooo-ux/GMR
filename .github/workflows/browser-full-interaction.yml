name: Browser Full Interaction Evidence

on:
  schedule:
    - cron: '17 18 * * 2'
  workflow_dispatch:
  repository_dispatch:
    types: [gameroad-candidate-evidence]
  workflow_run:
    workflows:
      - GAMEROAD Cloudflare Public Deploy
    types:
      - completed
  pull_request:
    branches:
      - main
    paths:
      - 'browser/GAMEROAD.html'
      - 'browser/*presentation*.mjs'
      - 'browser/*runtime*.mjs'
      - 'browser/*visual*.mjs'
      - 'browser/assets/**'
      - 'browser/*motion*.mjs'
      - 'browser/new-base-*.mjs'
      - 'browser/screen-navigation-core.mjs'
      - 'browser/slidepad-slot-roll-core.mjs'
      - 'tests/browser-full-interaction.spec.mjs'
      - 'tests/browser-full-interaction-state-sequence.spec.mjs'
      - 'playwright.full-interaction.config.mjs'
      - '.github/workflows/browser-full-interaction.yml'
  push:
    branches:
      - main
    paths:
      - 'browser/GAMEROAD.html'
      - 'browser/*presentation*.mjs'
      - 'browser/*runtime*.mjs'
      - 'browser/*visual*.mjs'
      - 'browser/assets/**'
      - 'browser/*motion*.mjs'
      - 'browser/new-base-*.mjs'
      - 'browser/screen-navigation-core.mjs'
      - 'browser/slidepad-slot-roll-core.mjs'
      - 'tests/browser-full-interaction.spec.mjs'
      - 'tests/browser-full-interaction-state-sequence.spec.mjs'
      - 'playwright.full-interaction.config.mjs'
      - '.github/workflows/browser-full-interaction.yml'

permissions:
  contents: read

jobs:
  chromium-interaction-evidence:
    permissions:
      contents: read
      issues: write
    if: ${{ github.event_name != 'workflow_run' && (github.event_name != 'repository_dispatch' || github.event.client_payload.bfi_required == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.sha }}

      - name: Verify dispatched exact head
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha != '' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Restore matching full-interaction evidence
        id: interaction_evidence_cache
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: actions/cache@v4
        with:
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
          key: ${{ runner.os }}-browser-full-interaction-v1-${{ hashFiles('browser/GAMEROAD.html', 'browser/*presentation*.mjs', 'browser/*runtime*.mjs', 'browser/*visual*.mjs', 'browser/assets/**', 'browser/*motion*.mjs', 'browser/new-base-*.mjs', 'browser/screen-navigation-core.mjs', 'browser/slidepad-slot-roll-core.mjs', 'tests/browser-full-interaction.spec.mjs', 'tests/browser-full-interaction-state-sequence.spec.mjs', 'playwright.full-interaction.config.mjs', '.github/workflows/browser-full-interaction.yml') }}

      - name: Set up Node
        if: ${{ steps.interaction_evidence_cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        if: ${{ steps.interaction_evidence_cache.outputs.cache-hit != 'true' }}
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        if: ${{ steps.interaction_evidence_cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Smoke real Setup field layout before full 109-test suite
        if: ${{ steps.interaction_evidence_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4197 --bind 127.0.0.1 >/tmp/gameroad-setup-field-focused-http.log 2>&1 &
          SERVER_PID="$!"
          trap 'kill "$SERVER_PID" || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          
          const origin = 'http://127.0.0.1:4197';
          const output = 'test-results/full-interaction/setup-field-focused';
          fs.mkdirSync(output, { recursive: true });
          for (let n = 0; n < 40; n += 1) {
            try {
              if ((await fetch(origin + '/browser/GAMEROAD.html', { method: 'HEAD' })).ok) break;
            } catch {}
            if (n === 39) throw new Error('focused-smoke-local-server-not-ready');
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          const browser = await chromium.launch({ headless: true });
          const results = [];
          for (const view of [
            { name: 'desktop', width: 1280, height: 720 },
            { name: 'phone', width: 390, height: 844 },
            { name: 'short-landscape', width: 667, height: 375 },
          ]) {
            const page = await browser.newPage({ viewport: { width: view.width, height: view.height } });
            try {
              const response = await page.goto(origin + '/browser/GAMEROAD.html', { waitUntil: 'commit', timeout: 60000 });
              assert.ok(response?.ok(), view.name + ': game HTML must load');
              await page.locator('section[data-screen="home"]').waitFor({ state: 'visible', timeout: 20000 });
              await page.locator('section.screen.active [data-home-target="setup"]:visible, section.screen.active [data-go="setup"]:visible, section.screen.active [data-root-go="setup"]:visible').first().click({ timeout: 15000 });
              const setup = page.locator('section[data-screen="setup"]');
              await setup.waitFor({ state: 'visible' });
              const picker = setup.locator('#gameroadBattleFieldSelection');
              await picker.waitFor({ state: 'visible', timeout: 12000 });
              const choices = picker.locator('button[data-field-id]');
              assert.ok((await choices.count()) >= 2, view.name + ': missing selectable battle fields');
              await choices.nth(1).scrollIntoViewIfNeeded();
              await choices.nth(1).click();
              assert.equal(await choices.nth(1).getAttribute('aria-pressed'), 'true', view.name + ': player selection did not work');
              await choices.first().scrollIntoViewIfNeeded();
              await choices.first().click();
              assert.equal(await choices.first().getAttribute('aria-pressed'), 'true', view.name + ': default field could not be restored');
              const state = await page.evaluate(() => {
                const host = document.getElementById('gameroadBattleFieldSelection');
                const field = host.getBoundingClientRect();
                const first = host.querySelector('button[data-field-id]').getBoundingClientRect();
                const element = document.elementFromPoint((first.left + first.right) / 2, (first.top + first.bottom) / 2);
                const firstHit = host.querySelector('button[data-field-id]').contains(element);
                const collides = (a, b) => a.left < b.right - 1 && a.right > b.left + 1 && a.top < b.bottom - 1 && a.bottom > b.top + 1;
                const collisions = ['.contentRow', '.modeRow', '#startMatch'].filter((selector) => {
                  const node = document.querySelector('section[data-screen="setup"] ' + selector);
                  return node && node.getClientRects().length && collides(field, node.getBoundingClientRect());
                });
                return { firstHit, collisions, field: { x: Math.round(field.x), y: Math.round(field.y), width: Math.round(field.width), height: Math.round(field.height) } };
              });
              await page.screenshot({ path: output + '/' + view.name + '-setup-field.png' });
              assert.ok(state.firstHit, view.name + ': field is visually visible but hit target obstructed');
              assert.deepEqual(state.collisions, [], view.name + ': field overlaps gameplay setup controls ' + JSON.stringify(state));
              results.push({ view: view.name, ok: true, ...state });
              console.log('SETUP_FIELD_SMOKE_PASS', view.name, JSON.stringify(state));
            } catch (error) {
              results.push({ view: view.name, ok: false, reason: String(error?.message || error) });
              await page.screenshot({ path: output + '/' + view.name + '-FAIL.png' }).catch(() => {});
              console.error('SETUP_FIELD_SMOKE_FAIL', view.name, error);
            } finally {
              await page.close();
            }
          }
          await browser.close();
          fs.writeFileSync(output + '/report.json', JSON.stringify({ sourceCommit: process.env.GITHUB_SHA, results }, null, 2) + '\n');
          if (results.some((result) => !result.ok)) process.exitCode = 1;
          NODE

      - name: Run GAMEROAD full interaction evidence R1
        id: interaction_run
        if: ${{ steps.interaction_evidence_cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1

      - name: Record evidence reuse identity
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVIDENCE_INPUT_HASH: ${{ hashFiles('browser/GAMEROAD.html', 'browser/*presentation*.mjs', 'browser/*runtime*.mjs', 'browser/*visual*.mjs', 'browser/assets/**', 'browser/*motion*.mjs', 'browser/new-base-*.mjs', 'browser/screen-navigation-core.mjs', 'browser/slidepad-slot-roll-core.mjs', 'tests/browser-full-interaction.spec.mjs', 'tests/browser-full-interaction-state-sequence.spec.mjs', 'playwright.full-interaction.config.mjs', '.github/workflows/browser-full-interaction.yml') }}
          EVIDENCE_CACHE_HIT: ${{ steps.interaction_evidence_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p evidence-metadata
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'source_sha=%s\nrun_id=%s\ninput_hash=%s\nreference_checked=true\ncache_hit=%s\nfresh_capture=%s\n' \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$EVIDENCE_INPUT_HASH" "${EVIDENCE_CACHE_HIT:-false}" \
            "$([[ "${EVIDENCE_CACHE_HIT:-false}" == "true" ]] && echo false || echo true)" \
            > evidence-metadata/reuse-binding.txt

      - name: Upload interaction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-full-interaction-${{ github.run_id }}
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
            evidence-metadata/
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate runtime evidence receipt
        if: ${{ always() && github.event_name == 'repository_dispatch' && github.event.client_payload.candidate_only == true && github.event.client_payload.bfi_required == true }}
        uses: actions/github-script@v7
        env:
          CANDIDATE_PR: ${{ github.event.client_payload.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
          WORK_UNIT_KEY: ${{ github.event.client_payload.work_unit_key }}
          ACQUIRE_KEY: ${{ github.event.client_payload.acquire_key }}
          CACHE_HIT: ${{ steps.interaction_evidence_cache.outputs.cache-hit }}
          INTERACTION_OUTCOME: ${{ steps.interaction_run.outcome }}
          EVIDENCE_INPUT_HASH: ${{ hashFiles('browser/GAMEROAD.html', 'browser/*presentation*.mjs', 'browser/*runtime*.mjs', 'browser/*visual*.mjs', 'browser/assets/**', 'browser/*motion*.mjs', 'browser/new-base-*.mjs', 'browser/screen-navigation-core.mjs', 'browser/slidepad-slot-roll-core.mjs', 'tests/browser-full-interaction.spec.mjs', 'tests/browser-full-interaction-state-sequence.spec.mjs', 'playwright.full-interaction.config.mjs', '.github/workflows/browser-full-interaction.yml') }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const prNumber = Number(process.env.CANDIDATE_PR);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('candidate runtime evidence PR number is invalid');
              return;
            }
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').toLowerCase();
            const observedHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
            const cacheHit = process.env.CACHE_HIT === 'true';
            const interactionOutcome = String(process.env.INTERACTION_OUTCOME || '');
            const passed = observedHead === expectedHead && !cacheHit && interactionOutcome === 'success';
            const receipt = {
              schemaVersion: 'gameroad-runtime-evidence-v1',
              kind: 'runtime_evidence',
              target: 'browser-full-interaction',
              taskId: process.env.TASK_ID,
              workUnitKey: process.env.WORK_UNIT_KEY,
              acquireKey: process.env.ACQUIRE_KEY,
              candidatePr: prNumber,
              headSha: expectedHead,
              observedHeadSha: observedHead,
              workflowRun: Number(context.runId),
              artifact: `browser-full-interaction-${context.runId}`,
              inputHash: process.env.EVIDENCE_INPUT_HASH || '',
              cacheHit,
              freshCapture: !cacheHit,
              status: passed ? 'PASS' : 'FAIL',
            };
            const marker = `<!-- gameroad-runtime-evidence:browser-full-interaction:${receipt.acquireKey} -->`;
            const body = `${marker}\nBROWSER_FULL_INTERACTION_RUNTIME_EVIDENCE\n\n\`\`\`runtime-evidence\n${JSON.stringify(receipt, null, 2)}\n\`\`\`\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  chromium-public-origin-evidence:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Checkout source under evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind canonical public origin to deployed build
        id: public_manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          MANIFEST='public-origin-metadata/gameroad-version.json'
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output "$MANIFEST" \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED_BUILD_ID="$(MANIFEST="$MANIFEST" node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          echo "Public GAMEROAD build_id=${OBSERVED_BUILD_ID}"
          echo "observed_build_id=${OBSERVED_BUILD_ID}" >> "$GITHUB_OUTPUT"
          if [[ -n "${EXPECTED_BUILD_ID:-}" && "$OBSERVED_BUILD_ID" != "$EXPECTED_BUILD_ID" ]]; then
            echo "::error::Public build mismatch: expected=${EXPECTED_BUILD_ID} observed=${OBSERVED_BUILD_ID}"
            exit 1
          fi
          printf 'event=%s\nexpected_build_id=%s\nobserved_build_id=%s\npublic_origin=%s\n' \
            "$GITHUB_EVENT_NAME" "${EXPECTED_BUILD_ID:-}" "$OBSERVED_BUILD_ID" "$GAMEROAD_PUBLIC_BASE_URL" \
            > public-origin-metadata/binding.txt

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare bounded public-origin R19 runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r37-public
          SOURCE='tests/browser-full-interaction.spec.mjs'
          TARGET='.r37-public/browser-full-interaction.spec.mjs'
          BEFORE="$(grep -oF "'/browser/GAMEROAD.html'" "$SOURCE" | wc -l | tr -d ' ')"
          if [[ "$BEFORE" -lt 1 ]]; then
            echo '::error::Expected current local Browser entry path was not found in full-interaction spec'
            exit 1
          fi
          sed "s#'/browser/GAMEROAD.html'#'/'#g" "$SOURCE" > "$TARGET"
          if grep -Fq "'/browser/GAMEROAD.html'" "$TARGET"; then
            echo '::error::Temporary public-origin spec still contains the local Browser entry path'
            exit 1
          fi
          cat > .r37-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';

          const publicProjects = (baseConfig.projects ?? [])
            .filter((project) => !project.grep)
            .map((project) => ({ name: project.name, use: project.use }));

          export default defineConfig({
            testDir: '.',
            testMatch: 'browser-full-interaction.spec.mjs',
            grep: /R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout: 240_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/public-origin',
            reporter: [
              ['line'],
              ['html', { outputFolder: '../playwright-report-public-origin', open: 'never' }],
              ['json', { outputFile: '../test-results/public-origin/public-origin-report.json' }],
            ],
            use: {
              ...baseConfig.use,
              baseURL: process.env.GAMEROAD_PUBLIC_BASE_URL,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
            projects: publicProjects,
          });
          EOF

      - name: Run visible four-player Honey Hunt on public origin
        run: npx playwright test --config=.r37-public/playwright.config.mjs --workers=1

      - name: Record public-origin evidence binding
        if: always()
        shell: bash
        env:
          OBSERVED_BUILD_ID: ${{ steps.public_manifest.outputs.observed_build_id }}
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          printf 'event=%s\nrun_id=%s\nsource_sha=%s\nexpected_build_id=%s\nobserved_build_id=%s\npublic_origin=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${EXPECTED_BUILD_ID:-}" "${OBSERVED_BUILD_ID:-}" "$GAMEROAD_PUBLIC_BASE_URL" \
            > public-origin-metadata/run-binding.txt

      - name: Upload public interaction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-public-interaction-${{ github.run_id }}
          path: |
            playwright-report-public-origin/
            test-results/public-origin/
            public-origin-metadata/
          if-no-files-found: error
          retention-days: 14
