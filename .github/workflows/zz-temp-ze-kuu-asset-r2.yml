name: zz-temp-ze-kuu-asset-r2
on:
  push:
    branches:
      - sol/ze-kuu-card-art-r1-20260908
permissions:
  contents: write
jobs:
  install-exact-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/ze-kuu-card-art-r1-20260908
          fetch-depth: 0
      - name: Fetch exact user source and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/visual/cards
          curl -fL --retry 3 --retry-delay 1 'https://d2ol7oe51mr4n9.cloudfront.net/user_3I8QWmERVB8vCXEYPg2da43g4zR/72c5a63c-63b0-4676-95db-1b540b1a606c.png' -o assets/visual/cards/dcg-ze-kuu.jpg
          test "$(wc -c < assets/visual/cards/dcg-ze-kuu.jpg | tr -d ' ')" = '726664'
          echo 'f95232b8f1f45154d8644ce350abeffff22e7f5c3fe777df58066841dd2b37d0  assets/visual/cards/dcg-ze-kuu.jpg' | sha256sum -c -
          test "$(git hash-object assets/visual/cards/dcg-ze-kuu.jpg)" = '79cc243ed23b86a658fed66277fc2cb77c1e9975'
      - name: Commit exact bytes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visual/cards/dcg-ze-kuu.jpg
          git rm .github/workflows/zz-temp-ze-kuu-asset-r2.yml
          git commit -m 'feat: install exact Ze-Kuu formal card art'
          git push origin HEAD:sol/ze-kuu-card-art-r1-20260908
