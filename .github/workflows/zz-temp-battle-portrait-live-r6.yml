name: TEMP Battle Portrait Live R6

on:
  push:
    branches:
      - sol/battle-portrait-live-r6-20260909

permissions:
  contents: write

jobs:
  recover-and-test:
    if: github.event.head_commit.message == 'Install temporary portrait R6 recovery executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-portrait-live-r6-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch read-only R5 donor head
        run: git fetch origin 2934da813c8806991f57980c699bbad2d198b148 --depth=1
      - name: Restore exact donor files and package base dependencies
        run: python3 tools/temp-battle-portrait-live-r6.py
      - name: Verify exact authorized product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            browser/battle-janken-slidepad-runtime-mount-base.mjs \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            browser/battle-screen-runtime-mount-base.mjs \
            browser/battle-screen-runtime-mount.mjs \
            deploy/cloudflare/scripts/build.mjs \
            tests/battle-janken-slidepad-runtime-mount-base.test.mjs \
            tests/battle-screen-runtime-mount-base.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: Run portrait/runtime focused Node tests
        run: >-
          node --test
          tests/battle-janken-slidepad-runtime-mount-base.test.mjs
          tests/battle-screen-runtime-mount-base.test.mjs
          tests/battle-janken-slidepad-runtime-mount.test.mjs
          tests/battle-screen-runtime-mount.test.mjs
      - name: Run Cloudflare build contract tests
        run: node --test deploy/cloudflare/tests/build.test.mjs
      - name: Verify runtime syntax
        run: |
          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --check browser/battle-janken-slidepad-runtime-mount-base.mjs
          node --check browser/battle-screen-runtime-mount.mjs
          node --check browser/battle-screen-runtime-mount-base.mjs
      - name: Verify packaged base dependencies exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "browser/battle-janken-slidepad-runtime-mount-base.mjs" deploy/cloudflare/scripts/build.mjs)" -eq 1
          test "$(grep -Fc "browser/battle-screen-runtime-mount-base.mjs" deploy/cloudflare/scripts/build.mjs)" -eq 1
      - name: Commit scoped portrait recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            browser/battle-janken-slidepad-runtime-mount-base.mjs \
            browser/battle-janken-slidepad-runtime-mount.mjs \
            browser/battle-screen-runtime-mount-base.mjs \
            browser/battle-screen-runtime-mount.mjs \
            deploy/cloudflare/scripts/build.mjs \
            tests/battle-janken-slidepad-runtime-mount-base.test.mjs \
            tests/battle-screen-runtime-mount-base.test.mjs
          git commit -m 'Battle: recover portrait runtime and public base dependencies'
          git push origin HEAD:sol/battle-portrait-live-r6-20260909
