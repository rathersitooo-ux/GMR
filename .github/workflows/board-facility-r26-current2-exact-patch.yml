name: Board Facility R26 current-main exact production mount

on:
  push:
    branches:
      - work/boardfacility-r26-production-mount-current2-20260819
    paths:
      - .github/workflows/board-facility-r26-current2-exact-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current main and HTML preimage
        shell: bash
        run: |
          set -euo pipefail
          expected_base='02e237df7dfac9ae101fbd0434f4bdd252a862aa'
          expected_html='b7ec934042afefccced34cc7bc477311a8e6df6e'
          test "$(git rev-parse HEAD^)" = "${expected_base}"
          test "$(git rev-parse HEAD^:browser/GAMEROAD.html)" = "${expected_html}"

      - name: Apply bounded Board Facility bootstrap mount
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'browser/GAMEROAD.html';
          const html = fs.readFileSync(path, 'utf8');
          const anchor = '<script src="./deck-save-recovery-core.mjs"></script>\n<script type="module">\nimport { resolveScreenNavigation } from "./screen-navigation-core.mjs";';
          const classicTag = '<script src="./board-facility-state-core.classic.js"></script>';
          const mountImport = 'import { mountBoardFacilityRuntime } from "./board-facility-runtime-mount.mjs";';
          const mountCall = 'await mountBoardFacilityRuntime(globalThis);';
          const count = (text, needle) => text.split(needle).length - 1;
          if (count(html, anchor) !== 1) throw new Error('BOARD_FACILITY_R26_CURRENT2_ANCHOR_COUNT');
          if (count(html, classicTag) !== 0 || count(html, mountImport) !== 0 || count(html, mountCall) !== 0) {
            throw new Error('BOARD_FACILITY_R26_CURRENT2_ALREADY_MOUNTED_OR_COLLISION');
          }
          const replacement = [
            '<script src="./deck-save-recovery-core.mjs"></script>',
            classicTag,
            '<script type="module">',
            mountImport,
            mountCall,
            '</script>',
            '<script type="module">',
            'import { resolveScreenNavigation } from "./screen-navigation-core.mjs";'
          ].join('\n');
          const next = html.replace(anchor, replacement);
          if (count(next, classicTag) !== 1 || count(next, mountImport) !== 1 || count(next, mountCall) !== 1) {
            throw new Error('BOARD_FACILITY_R26_CURRENT2_POST_COUNT');
          }
          const classicIndex = next.indexOf(classicTag);
          const mountIndex = next.indexOf(mountImport);
          const navigationIndex = next.indexOf('import { resolveScreenNavigation } from "./screen-navigation-core.mjs";');
          if (!(classicIndex < mountIndex && mountIndex < navigationIndex)) {
            throw new Error('BOARD_FACILITY_R26_CURRENT2_ORDER');
          }
          fs.writeFileSync(path, next, 'utf8');
          NODE

      - name: Run focused Board Facility and Browser static checks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check

      - name: Persist product-only branch and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git rm .github/workflows/board-facility-r26-current2-exact-patch.yml
          git commit -m 'BOARD-FACILITY R26: mount production runtime on current main'
          final_paths="$(git diff --name-only 02e237df7dfac9ae101fbd0434f4bdd252a862aa..HEAD)"
          test "${final_paths}" = 'browser/GAMEROAD.html'
          git push origin HEAD:work/boardfacility-r26-production-mount-current2-20260819
