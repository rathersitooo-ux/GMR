name: GAMEROAD Required Gate

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'data/gameroad-fixed-knowledge-witness.json'
      - 'data/gameroad-fixed-knowledge-witness.schema.json'
      - 'tools/fixed-knowledge-witness-validator.mjs'
      - 'tests/fixed-knowledge-witness-validator.test.mjs'
      - '.github/workflows/gameroad-required-gate.yml'

permissions:
  contents: read

jobs:
  required-gate:
    name: GAMEROAD Required Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "Unable to resolve comparison SHAs."
            exit 1
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/gameroad-changed.txt
          echo "Changed paths:"
          cat /tmp/gameroad-changed.txt

          browser=false
          browser_full_interaction=false
          dino=false
          fossil=false
          learning=false
          advice=false
          replay=false
          ping=false
          result=false
          gacha=false
          pursuit=false
          ui_feedback=false
          deck_ack=false
          self_deck=false
          ai_optimal=false
          partner_vtuber=false
          partner_humanlike=false
          partner_conversation=false
          observability=false
          card_presentation=false
          base52_face=false
          battle_conveyor=false
          battle2v2_reconnect=false
          hate_presence=false
          hate_forced_delegation=false
          board_facility=false
          auto_rank=false
          version_manifest=false
          roblox=false
          publichost=false
          fixed_knowledge_witness=false
          multi_agent_match_follow=false
          board_visual=false
          executor_bus=false
          unclassified=false
          : > /tmp/gameroad-unclassified.txt

          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              tests/browser-full-interaction.spec.mjs|\
              tests/browser-full-interaction-state-sequence.spec.mjs)
                browser_full_interaction=true
                ;;
              browser/GAMEROAD.html|\
              browser/home-cards-2p5d-presentation.mjs|\
              tests/home-cards-2p5d-runtime.spec.mjs|\
              browser/home-shell-presentation-core.mjs|\
              browser/boot-loading-presentation-core.mjs|\
              browser/home-boot-runtime-mount.mjs|\
              tests/home-boot-presentation.test.mjs|\
              tests/home-boot-runtime.spec.mjs|\
              browser/cards-deck-presentation.mjs|\
              browser/quick-deck-overlay-presentation.mjs|\
              tests/cards-deck-presentation.test.mjs|\
              tests/quick-deck-overlay-presentation.test.mjs|\
              browser/battle-plan-hud-presentation-core.mjs|\
              tests/battle-plan-hud-presentation-core.test.mjs|\
              browser/post-match-autoqueue-core.mjs|\
              tests/post-match-autoqueue-core.test.mjs|\
              browser/screen-navigation-core.mjs|\
              tests/screen-navigation-core.test.mjs|\
              browser/slaykia-voice-preview.html|\
              browser/slaykia-voice-preview.mjs|\
              tests/slaykia-voice-preview.test.mjs|\
              tests/browser-static-check.mjs|\
              tests/browser-runtime-smoke.spec.mjs|\
              playwright.config.mjs|\
              playwright.full-interaction.config.mjs|\
              .github/workflows/browser-node-ci.yml|\
              .github/workflows/browser-runtime-smoke.yml|\
              .github/workflows/browser-full-interaction.yml)
                browser=true
                ;;
              browser/dino-dig-mobile-whitebox.html|\
              tests/dino-dig-mobile-whitebox.spec.mjs|\
              playwright.dino-dig.config.mjs|\
              .github/workflows/dino-dig-mobile-whitebox.yml)
                dino=true
                ;;
              browser/fossil-excavation-state-core.mjs|\
              tests/fossil-excavation-state-core.test.mjs)
                fossil=true
                ;;
              browser/learning-crossmedia-whitebox.html|\
              tests/learning-crossmedia-whitebox.spec.mjs|\
              playwright.learning-crossmedia.config.mjs|\
              .github/workflows/learning-crossmedia-whitebox.yml)
                learning=true
                ;;
              tools/advice-collective-eval.mjs|\
              tests/advice-collective-eval.test.mjs|\
              .github/workflows/advice-collective-eval.yml|\
              tools/partner-advice-decision-product.mjs|\
              tests/partner-advice-decision-product.test.mjs|\
              .github/workflows/partner-advice-decision-product.yml|\
              tools/external-creative-submission.mjs|\
              tests/external-creative-submission.test.mjs)
                advice=true
                ;;
              browser/battle-replay-core.mjs|\
              tests/battle-replay-core.test.mjs|\
              browser/battle-replay-live-adapter.mjs|\
              tests/battle-replay-live-adapter.test.mjs|\
              browser/partner-battle-event-log-projection.mjs|\
              tests/partner-battle-event-log-projection.test.mjs|\
              browser/battle-replay-public-commentary-core.mjs|\
              tests/battle-replay-public-commentary-core.test.mjs)
                replay=true
                ;;
              browser/battle-team-ping-core.mjs|\
              tests/battle-team-ping-core.test.mjs)
                ping=true
                ;;
              browser/result-presentation-core.mjs|\
              tests/result-presentation-core.test.mjs)
                result=true
                ;;
              browser/gacha-presentation-core.mjs|\
              tests/gacha-presentation-core.test.mjs)
                gacha=true
                ;;
              browser/pursuit-triad-core.mjs|\
              tests/pursuit-triad-core.test.mjs|\
              browser/pursuit-triad-durable-store.mjs|\
              tests/pursuit-triad-durable-store.test.mjs)
                pursuit=true
                ;;
              browser/ui-state-feedback-core.mjs|\
              tests/ui-state-feedback-core.test.mjs|\
              browser/ui-state-feedback-ready-plan-adapter.mjs|\
              tests/ui-state-feedback-ready-plan-adapter.test.mjs|\
              browser/home-theme-orientation-core.mjs|\
              tests/home-theme-orientation-core.test.mjs|\
              browser/shop-transaction-presentation-adapter.mjs|\
              tests/shop-transaction-presentation-adapter.test.mjs)
                ui_feedback=true
                ;;
              browser/deck-save-ack-core.mjs|\
              tests/deck-save-ack-core.test.mjs|\
              browser/deck-save-recovery-core.mjs|\
              tests/deck-save-recovery-core.test.mjs)
                deck_ack=true
                ;;
              browser/battle-self-deck-inspect-core.mjs|\
              tests/battle-self-deck-inspect-core.test.mjs)
                self_deck=true
                ;;
              browser/partner-legal-action-adapter.mjs|\
              tests/partner-legal-action-adapter.test.mjs|\
              browser/partner-advice-runtime-mount.mjs|\
              tests/partner-advice-runtime-mount.test.mjs)
                ai_optimal=true
                ;;
              browser/partner-vtuber-public-context-core.mjs|\
              tests/partner-vtuber-public-context-core.test.mjs|\
              browser/partner-body-intent-core.mjs|\
              tests/partner-body-intent-core.test.mjs|\
              tools/kimodo-bvh-output-probe.mjs|\
              tests/kimodo-bvh-output-probe.test.mjs|\
              tools/motion-artifact-evaluator.mjs|\
              tests/motion-artifact-evaluator.test.mjs)
                partner_vtuber=true
                ;;
              browser/partner-humanlike-repair-evaluator.mjs|\
              tests/partner-humanlike-repair-evaluator.test.mjs)
                partner_humanlike=true
                ;;
              browser/partner-saasuna-conversation-source.mjs|\
              browser/partner-conversation-core.mjs|\
              tests/partner-conversation-core.test.mjs|\
              browser/partner-conversation-collective-context.mjs|\
              tests/partner-conversation-collective-context.test.mjs)
                partner_conversation=true
                ;;
              browser/observability-core.mjs|\
              tests/observability-core.test.mjs|\
              browser/observability-browser-adapter.mjs|\
              tests/observability-browser-adapter.test.mjs)
                observability=true
                ;;
              browser/card-presentation-core.mjs|\
              tests/card-presentation-core.test.mjs)
                card_presentation=true
                ;;
              browser/base52-face-layout-candidate.mjs|\
              tests/base52-face-layout-candidate.test.mjs)
                base52_face=true
                ;;
              browser/battle-conveyor-presentation-core.mjs|\
              tests/battle-conveyor-presentation-core.test.mjs)
                battle_conveyor=true
                ;;
              browser/battle-2v2-reconnect-core.mjs|\
              tests/battle-2v2-reconnect-core.test.mjs)
                battle2v2_reconnect=true
                ;;
              browser/hate-peer-presence-core.mjs|\
              tests/hate-peer-presence-core.test.mjs)
                hate_presence=true
                ;;
              browser/hate-forced-delegation-core.mjs|\
              tests/hate-forced-delegation-core.test.mjs)
                hate_forced_delegation=true
                ;;
              browser/board-facility-state-core.mjs|\
              browser/board-facility-state-core.classic.js|\
              browser/board-facility-runtime-mount.mjs|\
              scripts/build-board-facility-classic.mjs|\
              tests/board-facility-state-core.test.mjs|\
              tests/board-facility-classic-adapter.test.mjs|\
              tests/board-facility-runtime-mount.test.mjs)
                board_facility=true
                ;;
              browser/auto-rank-d06-collision-contract.mjs|\
              tests/auto-rank-d06-collision-contract.test.mjs|\
              browser/auto-rank-season-registration-core.mjs|\
              tests/auto-rank-season-registration-core.test.mjs|\
              browser/auto-rank-result-receipt-ledger-core.mjs|\
              tests/auto-rank-result-receipt-ledger-core.test.mjs)
                auto_rank=true
                ;;
              deploy/cloudflare/scripts/generate-version-manifest.mjs|\
              deploy/cloudflare/tests/version-manifest.test.mjs)
                version_manifest=true
                ;;
              roblox/GAMEROAD.rbxlx)
                roblox=true
                ;;
              browser/field-music-policy-core.mjs|\
              tests/field-music-policy-core.test.mjs|\
              deploy/cloudflare/.gitignore|\
              deploy/cloudflare/README.md|\
              deploy/cloudflare/functions/ws.js|\
              deploy/cloudflare/relay/src/relay-core.mjs|\
              deploy/cloudflare/relay/src/match-store.mjs|\
              deploy/cloudflare/relay/src/relay-worker.mjs|\
              deploy/cloudflare/relay/wrangler.toml|\
              deploy/cloudflare/scripts/build.mjs|\
              deploy/cloudflare/tests/build.test.mjs|\
              deploy/cloudflare/tests/relay-core.test.mjs|\
              deploy/cloudflare/tests/normal-match-r3.test.mjs|\
              deploy/cloudflare/wrangler.pages.toml|\
              .github/workflows/cloudflare-public-deploy.yml)
                publichost=true
                ;;
              data/gameroad-fixed-knowledge-witness.json|\
              data/gameroad-fixed-knowledge-witness.schema.json|\
              tools/fixed-knowledge-witness-validator.mjs|\
              tests/fixed-knowledge-witness-validator.test.mjs)
                fixed_knowledge_witness=true
                ;;
              tools/multi-agent-match-follow-harness.mjs|\
              tests/multi-agent-match-follow-harness.test.mjs)
                multi_agent_match_follow=true
                ;;
              browser/battle-board-visual-explanation-core.mjs|\
              tests/battle-board-visual-explanation-core.test.mjs)
                board_visual=true
                ;;
              .github/workflows/gameroad-executor-bus.yml|\
              tools/executor-bus-packet.mjs|\
              tests/executor-bus-packet.test.mjs|\
              tools/executor-bus-packet-compressor.mjs|\
              tests/executor-bus-packet-compressor.test.mjs|\
              tools/chatgpt-browser-transport-core.mjs|\
              tools/chatgpt-browser-transport-runner.mjs|\
              tests/chatgpt-browser-transport-core.test.mjs|\
              tools/luna-sol-router-core.mjs|\
              tools/luna-sol-router-runner.mjs|\
              tests/luna-sol-router-core.test.mjs|\
              tools/sol_bridge/evaluation/completion-ab-evaluator.mjs|\
              tools/sol_bridge/evaluation/completion-ab-evaluator-runner.mjs|\
              tests/sol_bridge/evaluation/completion-ab-evaluator.test.mjs|\
              tools/sol-reasoning-protocol.mjs|\
              tests/sol-reasoning-protocol.test.mjs|\
              tools/luna-sol-integration-core.mjs|\
              tests/luna-sol-integration-core.test.mjs|\
              tools/luna-sol-codex-browser-bridge.mjs|\
              tools/luna-sol-codex-browser-bridge-runner.mjs|\
              tests/luna-sol-codex-browser-bridge.test.mjs|\
              tests/luna-sol-codex-browser-bridge-local-queue-gate.test.mjs)
                executor_bus=true
                ;;
              .github/workflows/gameroad-required-gate.yml|\
              .github/workflows/gameroad-observability-ci.yml|\
              tools/preaction-authorization-validator.mjs|\
              tests/preaction-authorization-validator.test.mjs|\
              tools/jit-evidence-compiler.mjs|\
              tests/jit-evidence-compiler.test.mjs|\
              README.md|.gitignore|.gitattributes)
                ;;
              browser/*|roblox/*|unity/*|tools/*|tests/*|.github/workflows/*|\
              playwright*.mjs|*.js|*.mjs|*.ts|*.tsx|*.lua|*.luau|*.html|*.css|\
              package.json|package-lock.json)
                unclassified=true
                printf '%s\n' "${path}" >> /tmp/gameroad-unclassified.txt
                ;;
              *)
                ;;
            esac
          done < /tmp/gameroad-changed.txt

          {
            echo "browser=${browser}"
            echo "browser_full_interaction=${browser_full_interaction}"
            echo "dino=${dino}"
            echo "fossil=${fossil}"
            echo "learning=${learning}"
            echo "advice=${advice}"
            echo "replay=${replay}"
            echo "ping=${ping}"
            echo "result=${result}"
            echo "gacha=${gacha}"
            echo "pursuit=${pursuit}"
            echo "ui_feedback=${ui_feedback}"
            echo "deck_ack=${deck_ack}"
            echo "self_deck=${self_deck}"
            echo "ai_optimal=${ai_optimal}"
            echo "partner_vtuber=${partner_vtuber}"
            echo "partner_humanlike=${partner_humanlike}"
            echo "partner_conversation=${partner_conversation}"
            echo "observability=${observability}"
            echo "card_presentation=${card_presentation}"
            echo "base52_face=${base52_face}"
            echo "battle_conveyor=${battle_conveyor}"
            echo "battle2v2_reconnect=${battle2v2_reconnect}"
            echo "hate_presence=${hate_presence}"
            echo "hate_forced_delegation=${hate_forced_delegation}"
            echo "board_facility=${board_facility}"
            echo "auto_rank=${auto_rank}"
            echo "version_manifest=${version_manifest}"
            echo "roblox=${roblox}"
            echo "publichost=${publichost}"
            echo "fixed_knowledge_witness=${fixed_knowledge_witness}"
            echo "multi_agent_match_follow=${multi_agent_match_follow}"
            echo "board_visual=${board_visual}"
            echo "executor_bus=${executor_bus}"
            echo "unclassified=${unclassified}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${unclassified}" == "true" ]]; then
            echo "Unclassified executable/CI paths:"
            cat /tmp/gameroad-unclassified.txt
          fi

      - name: Verify Browser full interaction delegated evidence lane
        if: steps.classify.outputs.browser_full_interaction == 'true'
        run: echo "tests/browser-full-interaction.spec.mjs execution is delegated to Browser Full Interaction Evidence."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce PRE_ACTION authorization before material PR merge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test tests/preaction-authorization-validator.test.mjs
          node tools/preaction-authorization-validator.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --changed /tmp/gameroad-changed.txt

      - name: Set up Node for Fossil
        if: steps.classify.outputs.fossil == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Node for BASE52
        if: steps.classify.outputs.base52_face == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Node for Battle Conveyor
        if: steps.classify.outputs.battle_conveyor == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Public package provenance invariant
        run: node --test deploy/cloudflare/tests/build.test.mjs

      - name: Validate fixed knowledge witness
        if: steps.classify.outputs.fixed_knowledge_witness == 'true'
        run: |
          node --test tests/fixed-knowledge-witness-validator.test.mjs
          node tools/fixed-knowledge-witness-validator.mjs data/gameroad-fixed-knowledge-witness.json data/gameroad-fixed-knowledge-witness.schema.json

      - name: Run Four-agent match follow harness tests
        if: steps.classify.outputs.multi_agent_match_follow == 'true'
        run: node --test tests/multi-agent-match-follow-harness.test.mjs

      - name: Run Executor bus and Luna Sol integration tests
        if: steps.classify.outputs.executor_bus == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/executor-bus-packet.test.mjs
          node --test tests/executor-bus-packet-compressor.test.mjs
          node --test tests/chatgpt-browser-transport-core.test.mjs
          node --test tests/luna-sol-router-core.test.mjs
          node --test tests/sol_bridge/evaluation/completion-ab-evaluator.test.mjs
          node --test tests/sol-reasoning-protocol.test.mjs
          node --test tests/luna-sol-integration-core.test.mjs
          if grep -Eq '^(tools/luna-sol-codex-browser-bridge(-runner)?\.mjs|tests/luna-sol-codex-browser-bridge(-local-queue-gate)?\.test\.mjs)$' /tmp/gameroad-changed.txt; then
            if [[ -f tests/luna-sol-codex-browser-bridge.test.mjs ]]; then
              node --test tests/luna-sol-codex-browser-bridge.test.mjs
            fi
            if [[ -f tests/luna-sol-codex-browser-bridge-local-queue-gate.test.mjs ]]; then
              node --test tests/luna-sol-codex-browser-bridge-local-queue-gate.test.mjs
            fi
          fi

      - name: Run JIT evidence compiler tests when changed
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^(tools/jit-evidence-compiler\.mjs|tests/jit-evidence-compiler\.test\.mjs)$' /tmp/gameroad-changed.txt; then
            if [[ ! -f tests/jit-evidence-compiler.test.mjs ]]; then
              echo "Required JIT compiler test is missing: tests/jit-evidence-compiler.test.mjs"
              exit 1
            fi
            node --test tests/jit-evidence-compiler.test.mjs
          fi

      - name: Run Browser static check
        if: steps.classify.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail

          run_optional_package_test() {
            local test_path="$1"
            shift

            if [[ -f "${test_path}" ]]; then
              node --test "${test_path}"
              return
            fi

            local package_path
            for package_path in "$@"; do
              if grep -Fxq "${package_path}" /tmp/gameroad-changed.txt; then
                echo "Required Browser package test is missing: ${test_path}"
                echo "Changed package path requires this test: ${package_path}"
                exit 1
              fi
            done

            echo "Optional Browser baseline absent and package untouched: ${test_path}"
          }

          node --test tests/screen-navigation-core.test.mjs
          node --test tests/post-match-autoqueue-core.test.mjs
          node --test tests/slaykia-voice-preview.test.mjs
          run_optional_package_test tests/home-boot-presentation.test.mjs \
            browser/home-shell-presentation-core.mjs \
            browser/boot-loading-presentation-core.mjs \
            tests/home-boot-presentation.test.mjs
          run_optional_package_test tests/cards-deck-presentation.test.mjs \
            browser/cards-deck-presentation.mjs \
            tests/cards-deck-presentation.test.mjs
          run_optional_package_test tests/quick-deck-overlay-presentation.test.mjs \
            browser/quick-deck-overlay-presentation.mjs \
            tests/quick-deck-overlay-presentation.test.mjs
          run_optional_package_test tests/battle-plan-hud-presentation-core.test.mjs \
            browser/battle-plan-hud-presentation-core.mjs \
            tests/battle-plan-hud-presentation-core.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Run Fossil excavation state core tests
        if: steps.classify.outputs.fossil == 'true'
        run: node --test tests/fossil-excavation-state-core.test.mjs

      - name: Run BASE52 face layout candidate tests
        if: steps.classify.outputs.base52_face == 'true'
        run: node --test tests/base52-face-layout-candidate.test.mjs

      - name: Run Battle conveyor presentation core tests
        if: steps.classify.outputs.battle_conveyor == 'true'
        run: node --test tests/battle-conveyor-presentation-core.test.mjs

      - name: Run Advice offline evaluator tests
        if: steps.classify.outputs.advice == 'true'
        run: node --test tests/advice-collective-eval.test.mjs tests/partner-advice-decision-product.test.mjs tests/external-creative-submission.test.mjs

      - name: Run Battle replay core tests
        if: steps.classify.outputs.replay == 'true'
        run: node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs tests/partner-battle-event-log-projection.test.mjs tests/battle-replay-public-commentary-core.test.mjs

      - name: Run Battle team ping core tests
        if: steps.classify.outputs.ping == 'true'
        run: node --test tests/battle-team-ping-core.test.mjs

      - name: Run Result presentation core tests
        if: steps.classify.outputs.result == 'true'
        run: node --test tests/result-presentation-core.test.mjs

      - name: Run Gacha presentation core tests
        if: steps.classify.outputs.gacha == 'true'
        run: node --test tests/gacha-presentation-core.test.mjs

      - name: Run Pursuit triad core and durable store tests
        if: steps.classify.outputs.pursuit == 'true'
        run: node --test tests/pursuit-triad-core.test.mjs tests/pursuit-triad-durable-store.test.mjs

      - name: Run UI state feedback core tests
        if: steps.classify.outputs.ui_feedback == 'true'
        run: node --test tests/ui-state-feedback-core.test.mjs tests/ui-state-feedback-ready-plan-adapter.test.mjs tests/home-theme-orientation-core.test.mjs tests/shop-transaction-presentation-adapter.test.mjs

      - name: Run Deck save ACK core tests
        if: steps.classify.outputs.deck_ack == 'true'
        run: node --test tests/deck-save-ack-core.test.mjs

      - name: Run Deck save recovery core tests
        if: steps.classify.outputs.deck_ack == 'true'
        run: node --test tests/deck-save-recovery-core.test.mjs

      - name: Run Battle self remaining deck inspect core tests
        if: steps.classify.outputs.self_deck == 'true'
        run: node --test tests/battle-self-deck-inspect-core.test.mjs

      - name: Run Partner legal action adapter tests
        if: steps.classify.outputs.ai_optimal == 'true'
        run: node --test tests/partner-legal-action-adapter.test.mjs tests/partner-advice-runtime-mount.test.mjs

      - name: Run Partner VTuber public-context and BodyIntent boundary tests
        if: steps.classify.outputs.partner_vtuber == 'true'
        run: node --test tests/partner-vtuber-public-context-core.test.mjs tests/partner-body-intent-core.test.mjs tests/kimodo-bvh-output-probe.test.mjs tests/motion-artifact-evaluator.test.mjs

      - name: Run Partner humanlike repair evaluator tests
        if: steps.classify.outputs.partner_humanlike == 'true'
        run: node --test tests/partner-humanlike-repair-evaluator.test.mjs

      - name: Run Partner conversation focused tests
        if: steps.classify.outputs.partner_conversation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^(browser/partner-saasuna-conversation-source\.mjs|browser/partner-conversation-core\.mjs|tests/partner-conversation-core\.test\.mjs)$' /tmp/gameroad-changed.txt; then
            if [[ ! -f tests/partner-conversation-core.test.mjs ]]; then
              echo "Required Partner conversation core test is missing: tests/partner-conversation-core.test.mjs"
              exit 1
            fi
            node --test tests/partner-conversation-core.test.mjs
          fi
          if grep -Eq '^(browser/partner-conversation-collective-context\.mjs|tests/partner-conversation-collective-context\.test\.mjs)$' /tmp/gameroad-changed.txt; then
            if [[ ! -f tests/partner-conversation-collective-context.test.mjs ]]; then
              echo "Required Partner conversation collective-context test is missing: tests/partner-conversation-collective-context.test.mjs"
              exit 1
            fi
            node --test tests/partner-conversation-collective-context.test.mjs
          fi

      - name: Run Observability core and Browser adapter tests
        if: steps.classify.outputs.observability == 'true'
        run: node --test tests/observability-core.test.mjs tests/observability-browser-adapter.test.mjs

      - name: Run Card presentation core tests
        if: steps.classify.outputs.card_presentation == 'true'
        run: node --test tests/card-presentation-core.test.mjs

      - name: Run Battle 2v2 reconnect core tests
        if: steps.classify.outputs.battle2v2_reconnect == 'true'
        run: node --test tests/battle-2v2-reconnect-core.test.mjs

      - name: Run HATE peer presence core tests
        if: steps.classify.outputs.hate_presence == 'true'
        run: node --test tests/hate-peer-presence-core.test.mjs

      - name: Run HATE forced delegation core tests
        if: steps.classify.outputs.hate_forced_delegation == 'true'
        run: node --test tests/hate-forced-delegation-core.test.mjs

      - name: Run Board facility state core tests
        if: steps.classify.outputs.board_facility == 'true'
        run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs

      - name: Run Battle board visual explanation core tests
        if: steps.classify.outputs.board_visual == 'true'
        run: node --test tests/battle-board-visual-explanation-core.test.mjs

      - name: Run Auto-rank D06 collision, season registration, and result receipt ledger tests
        if: steps.classify.outputs.auto_rank == 'true'
        run: node --test tests/auto-rank-d06-collision-contract.test.mjs tests/auto-rank-season-registration-core.test.mjs tests/auto-rank-result-receipt-ledger-core.test.mjs

      - name: Run Browser version manifest contract tests
        if: steps.classify.outputs.version_manifest == 'true'
        run: node --test deploy/cloudflare/tests/version-manifest.test.mjs

      - name: Run Browser version manifest syntax check
        if: steps.classify.outputs.version_manifest == 'true'
        run: node --check deploy/cloudflare/scripts/generate-version-manifest.mjs

      - name: Run PublicHost Cloudflare deploy-prep tests
        if: steps.classify.outputs.publichost == 'true'
        run: node --test tests/field-music-policy-core.test.mjs deploy/cloudflare/tests/relay-core.test.mjs

      - name: Run PublicHost Cloudflare syntax checks
        if: steps.classify.outputs.publichost == 'true'
        run: |
          node --check deploy/cloudflare/functions/ws.js
          node --check deploy/cloudflare/relay/src/relay-core.mjs
          node --check deploy/cloudflare/relay/src/relay-worker.mjs
          node --check deploy/cloudflare/scripts/build.mjs

      - name: Verify formal Roblox placement
        if: steps.classify.outputs.roblox == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="roblox/GAMEROAD.rbxlx"
          expected_sha256="b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51"

          if [[ ! -f "${target}" ]]; then
            echo "Required formal Roblox placement is missing: ${target}"
            exit 1
          fi

          actual_sha256="$(sha256sum "${target}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "Roblox placement SHA-256 mismatch."
            echo "expected=${expected_sha256}"
            echo "actual=${actual_sha256}"
            exit 1
          fi

          python3 - "${target}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except ET.ParseError as exc:
              raise SystemExit(f"Roblox placement XML parse failed: {exc}")

          tag = root.tag.rsplit('}', 1)[-1]
          if tag != "roblox":
              raise SystemExit(f"Roblox placement root must be <roblox>, got <{tag}>")
          if not root.attrib.get("version"):
              raise SystemExit("Roblox placement root is missing the version attribute")

          print(f"Roblox placement verified: root={tag} version={root.attrib['version']}")
          PY

      - name: Install Playwright test runner
        if: steps.classify.outputs.browser == 'true' || steps.classify.outputs.dino == 'true' || steps.classify.outputs.learning == 'true'
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium browser for Browser lane
        if: steps.classify.outputs.browser == 'true'
        run: npx playwright install chromium

      - name: Install Chromium and OS dependencies for DINO/Learning lanes
        if: steps.classify.outputs.dino == 'true' || steps.classify.outputs.learning == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Browser runtime smoke
        if: steps.classify.outputs.browser == 'true'
        run: npx playwright test --config=playwright.config.mjs --workers=1

      - name: Run Browser full interaction evidence
        if: steps.classify.outputs.browser == 'true'
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1

      - name: Run DINO DIG mobile whitebox smoke
        if: steps.classify.outputs.dino == 'true'
        run: npx playwright test --config=playwright.dino-dig.config.mjs --workers=1

      - name: Run Learning Crossmedia whitebox smoke
        if: steps.classify.outputs.learning == 'true'
        run: npx playwright test --config=playwright.learning-crossmedia.config.mjs --workers=1

      - name: Fail closed on unclassified executable or CI paths
        if: always() && steps.classify.outputs.unclassified == 'true'
        run: |
          echo "Required gate has no approved test mapping for these executable/CI paths:"
          cat /tmp/gameroad-unclassified.txt
          exit 1
