name: Battle Mana Rank Recovery Surgical Patch

on:
  push:
    branches:
      - fix/battle-mana-rank-recovery-r1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-mana-rank-recovery-r1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded resource repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          test_path = Path('tests/browser-static-check.mjs')
          html = html_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          old_fn = 'function awardRoundStartHoney(m){for(const row of currentPlacementRanks(m)){const gain=Math.max(1,Number(row.rank)||1);row.player.honey=Math.max(0,Number(row.player.honey)||0)+gain;log(`${row.player.name}：${gain}位のためハニー+${gain}。`)}}'
          new_fn = 'function recoverRoundStartManaByPlacement(m){for(const row of currentPlacementRanks(m)){const gain=Math.max(1,Number(row.rank)||1),p=row.player,max=Math.max(0,Number(p.manaMax)||10);const before=Math.max(0,Math.min(max,Number(p.manaCurrent)||0)),after=Math.min(max,before+gain);p.manaCurrent=after;log(`${p.name}：${gain}位のためマナ回復+${after-before}（${after}/${max}）。`)}}'
          old_round_one = 'grBattleReplayBegin(state.match);awardRoundStartHoney(state.match);initRoundRuntime(state.match)'
          new_round_one = 'grBattleReplayBegin(state.match);recoverRoundStartManaByPlacement(state.match);initRoundRuntime(state.match)'
          old_later = 'm.players.forEach(p=>p.plan=null);awardRoundStartHoney(m);initRoundRuntime(m)'
          new_later = 'm.players.forEach(p=>p.plan=null);recoverRoundStartManaByPlacement(m);initRoundRuntime(m)'

          for label, old, new in [
              ('round-start function', old_fn, new_fn),
              ('round-one call', old_round_one, new_round_one),
              ('later-round call', old_later, new_later),
          ]:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              html = html.replace(old, new, 1)

          old_contracts = '''    [/function awardRoundStartHoney\\(m\\)/, 'round-start Honey income is not mounted'],
    [/grBattleReplayBegin\\(state\\.match\\);awardRoundStartHoney\\(state\\.match\\);initRoundRuntime\\(state\\.match\\)/, 'round one does not award current-rank Honey before play'],
    [/m\\.players\\.forEach\\(p=>p\\.plan=null\\);awardRoundStartHoney\\(m\\);initRoundRuntime\\(m\\)/, 'later rounds do not award current-rank Honey'],'''
          new_contracts = '''    [/function recoverRoundStartManaByPlacement\\(m\\)/, 'round-start placement Mana recovery is not mounted'],
    [/function recoverRoundStartManaByPlacement\\(m\\)\\{[\\s\\S]{0,700}p\\.manaCurrent=after;/, 'round-start placement Mana recovery does not clamp and write numeric Mana'],
    [/grBattleReplayBegin\\(state\\.match\\);recoverRoundStartManaByPlacement\\(state\\.match\\);initRoundRuntime\\(state\\.match\\)/, 'round one does not recover current-rank Mana before play'],
    [/m\\.players\\.forEach\\(p=>p\\.plan=null\\);recoverRoundStartManaByPlacement\\(m\\);initRoundRuntime\\(m\\)/, 'later rounds do not recover current-rank Mana'],'''
          if test.count(old_contracts) != 1:
              raise SystemExit(f'static resource contracts: expected exactly 1 match, found {test.count(old_contracts)}')
          test = test.replace(old_contracts, new_contracts, 1)

          anchor = "  if (/function takeManaByPower\\(/.test(html) || /\\.mana\\?*\\.length/.test(html) || /Array\\.isArray\\(me\\?*\\.mana\\)/.test(html)) {"
          guard = "  if (/function awardRoundStartHoney\\(/.test(html)) errors.push('legacy round-start Honey income remains');\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'legacy Honey guard anchor: expected exactly 1 match, found {test.count(anchor)}')
          test = test.replace(anchor, guard + anchor, 1)

          if 'awardRoundStartHoney(' in html:
              raise SystemExit('legacy round-start Honey runtime symbol remains after patch')
          if 'recoverRoundStartManaByPlacement(' not in html:
              raise SystemExit('rank Mana recovery symbol missing after patch')

          html_path.write_text(html, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify static Browser contracts
        run: node tests/browser-static-check.mjs

      - name: Verify bounded diff and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'browser/GAMEROAD.html\ntests/browser-static-check.mjs'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files before transient cleanup:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git rm .github/workflows/battle-mana-rank-recovery-surgical.yml
          git diff --check

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-static-check.mjs .github/workflows/battle-mana-rank-recovery-surgical.yml
          git commit -m 'fix(browser): recover mana by placement at round start'
          git push origin HEAD:fix/battle-mana-rank-recovery-r1
