name: TEMP Battle central world binding diagnostic R6

on:
  push:
    branches:
      - sol/battle-central-world-binding-diag-r6-20260914

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-central-world-binding-diag-r6-20260914
          fetch-depth: 1
      - name: Extract exact current board identity and binding seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          text=p.read_text()
          print('HTML_BYTES', p.stat().st_size)
          needles=[
            'function makePlayer', 'function getActiveNodes', 'function nodeXY',
            'function neighbors', 'function renderBoard', 'function updateBattleAvatar',
            'roadKey', 'shieldKey', 'roadNodeXY', 'shieldAnchor',
            'GOAL_REACHED', 'ROAD_COMPLETED', 'goalReached',
            'state.match.projection', 'projection[', 'p.lanes', '.lanes',
            "position:'C:0:0'", 'function resolveBattle', 'function renderPlayers',
            'function animateResolvedPath', 'function getLane', 'function lane'
          ]
          for needle in needles:
            print(f'\n### NEEDLE {needle!r}')
            start=0; count=0
            while count<12:
              i=text.find(needle,start)
              if i<0: break
              lo=max(0,i-900); hi=min(len(text),i+1800)
              snippet=' '.join(text[lo:hi].split())
              print(f'AT {i}: {snippet[:2700]}')
              start=i+len(needle); count+=1
            print('COUNT_SHOWN',count)

          print('\n=== ROAD_SHIELD_TEMPLATE_FRAGMENTS ===')
          for token in ['R:${','S:${','C:${','K:${','`R:','`S:','`C:','`K:']:
            start=0; shown=0
            while shown<20:
              i=text.find(token,start)
              if i<0: break
              print(token, 'AT', i, '=>', ' '.join(text[max(0,i-300):min(len(text),i+700)].split())[:1000])
              start=i+len(token); shown+=1
            print(token,'COUNT_SHOWN',shown)

          print('\n=== PLAYER IDS AND ROAD INDEX NEARBY ===')
          for token in ["id:'P'+(i+1)", "id:'P1'", "id:'P2'", "id:'P3'", "id:'P4'", 'roadIndex', 'road:', 'shield:']:
            i=text.find(token)
            print('\nTOKEN',token,'AT',i)
            if i>=0: print(' '.join(text[max(0,i-1200):min(len(text),i+2600)].split())[:3800])
          PY
