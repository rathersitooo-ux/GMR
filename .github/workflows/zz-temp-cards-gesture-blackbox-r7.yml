name: Cards Gesture Public Blackbox R7

on:
  push:
    branches:
      - sol/cards-gesture-public-blackbox-r7-20260907
    paths:
      - '.github/workflows/zz-temp-cards-gesture-blackbox-r7.yml'

permissions:
  contents: read

jobs:
  public-cards-gesture-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind public build before evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cards-gesture-evidence
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output cards-gesture-evidence/start-version.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          START_BUILD_ID="$(node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('cards-gesture-evidence/start-version.json','utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          printf '%s' "$START_BUILD_ID" > cards-gesture-evidence/start-build-id.txt
          echo "CARDS_GESTURE_PUBLIC_START_BUILD=${START_BUILD_ID}"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Prepare bounded Cards public interaction spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cards-gesture-r7 cards-gesture-evidence
          cat > .cards-gesture-r7/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: '.',
            testMatch: 'cards-gesture.spec.mjs',
            timeout: 90_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../cards-gesture-evidence/test-results',
            reporter: [['line'], ['json', { outputFile: '../cards-gesture-evidence/report.json' }]],
            use: {
              baseURL: process.env.GAMEROAD_PUBLIC_BASE_URL,
              viewport: { width: 1280, height: 720 },
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'off',
            },
          });
          EOF
          cat > .cards-gesture-r7/cards-gesture.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          const DISCOVERY_KEY = 'gameroad.cards.deckSwipeDiscovery.v1';
          const NEGATIVE = process.env.NEGATIVE_CONTROL === '1';

          async function attachShot(page, testInfo, name) {
            const body = await page.screenshot({ fullPage: true, animations: 'disabled' });
            await testInfo.attach(name, { body, contentType: 'image/png' });
          }

          async function enterCards(page) {
            const home = page.locator('section[data-screen="home"]');
            await expect(home, 'fresh public route reaches Home').toBeVisible({ timeout: 15_000 });
            const control = page.locator('[data-home-target="cards"]:visible, [data-go="cards"]:visible').first();
            await expect(control, 'visible Home Cards route').toBeVisible();
            await control.click();
            const cards = page.locator('section[data-screen="cards"]');
            await expect(cards).toBeVisible();
            return cards;
          }

          async function horizontalSwipe(page, locator, dx) {
            await locator.scrollIntoViewIfNeeded();
            const box = await locator.boundingBox();
            expect(box, 'swipe source has a visible bounding box').not.toBeNull();
            const x = box.x + box.width / 2;
            const y = box.y + box.height / 2;
            await page.mouse.move(x, y);
            await page.mouse.down();
            await page.mouse.move(x + dx, y, { steps: 10 });
            await page.mouse.up();
            await page.waitForTimeout(300);
          }

          async function visibleDeckCard(cards) {
            let card = cards.locator('#deckSlots [data-id]:visible').first();
            if ((await card.count()) === 0) {
              const toggle = cards.locator('#r4DeckTrayToggle:visible');
              if ((await toggle.count()) > 0) await toggle.click();
              card = cards.locator('#deckSlots [data-id]:visible').first();
            }
            await expect(card, 'a visible main Deck card exists').toBeVisible();
            return card;
          }

          test('public Cards learns left-remove then right-add only after matching success', async ({ page }, testInfo) => {
            await page.addInitScript((key) => {
              const marker = 'gameroad.cards.deckSwipeDiscovery.r7.test-cleared';
              if (sessionStorage.getItem(marker) !== '1') {
                localStorage.removeItem(key);
                sessionStorage.setItem(marker, '1');
              }
            }, DISCOVERY_KEY);

            const response = await page.goto('/', { waitUntil: 'domcontentloaded' });
            expect(response?.ok(), 'public root responds successfully').toBeTruthy();
            let cards = await enterCards(page);

            const addHint = cards.locator('[data-role="deck-swipe-discovery-add"]');
            const removeHint = cards.locator('[data-role="deck-swipe-discovery-remove"]');
            await expect(addHint).toHaveText('→ 右フリックで札組へ');
            await expect(removeHint).toHaveText('← 左フリックで外す');
            await expect(addHint, 'add hint starts visible').toBeVisible();
            await expect(removeHint, 'remove hint starts visible').toBeVisible();
            await attachShot(page, testInfo, 'cards-hints-initial');

            let deckCard = await visibleDeckCard(cards);
            const cardId = await deckCard.getAttribute('data-id');
            expect(cardId, 'selected Deck card has data-id').toBeTruthy();
            const deckCount = cards.locator('#deckCount');
            const initialCount = Number.parseInt((await deckCount.textContent()) ?? '', 10);
            expect(Number.isFinite(initialCount), 'initial deck count is numeric').toBeTruthy();

            await horizontalSwipe(page, deckCard, 100);
            await expect(deckCount, 'wrong-direction Deck swipe does not mutate deck').toHaveText(String(initialCount));
            await expect(addHint, 'wrong-direction swipe does not dismiss add hint').toBeVisible();
            await expect(removeHint, 'wrong-direction swipe does not dismiss remove hint').toBeVisible();

            deckCard = cards.locator(`#deckSlots [data-id="${cardId}"]:visible`).first();
            await expect(deckCard).toBeVisible();
            await horizontalSwipe(page, deckCard, -100);
            await expect(deckCount, 'left Deck swipe removes one card').toHaveText(String(initialCount - 1));
            await expect(addHint, 'remove success does not dismiss add hint').toBeVisible();

            if (NEGATIVE) {
              const actuallyHidden = await removeHint.isHidden();
              if (!actuallyHidden) throw new Error('NEGATIVE_CONTROL_PRECONDITION_NOT_MET_REMOVE_HINT_NOT_HIDDEN');
              await expect(removeHint, 'DELIBERATE_NEGATIVE_CONTROL_REMOVE_HINT_SHOULD_STAY_VISIBLE').toBeVisible({ timeout: 800 });
              return;
            }

            await expect(removeHint, 'matching left-remove success dismisses remove hint').toBeHidden();
            await attachShot(page, testInfo, 'cards-after-left-remove');

            const collectionCard = cards.locator(`#collectionGrid [data-id="${cardId}"]:visible`).first();
            await expect(collectionCard, 'removed Deck card is visibly available in Collection').toBeVisible();
            await horizontalSwipe(page, collectionCard, 100);
            await expect(deckCount, 'right Collection swipe adds the same card back').toHaveText(String(initialCount));
            await expect(addHint, 'matching right-add success dismisses add hint').toBeHidden();
            await expect(removeHint).toBeHidden();
            await attachShot(page, testInfo, 'cards-after-right-add');

            await page.reload({ waitUntil: 'domcontentloaded' });
            cards = await enterCards(page);
            const addAfterReload = cards.locator('[data-role="deck-swipe-discovery-add"]');
            const removeAfterReload = cards.locator('[data-role="deck-swipe-discovery-remove"]');
            await expect(addAfterReload, 'learned add hint stays dismissed after reload').toBeHidden();
            await expect(removeAfterReload, 'learned remove hint stays dismissed after reload').toBeHidden();
            const persisted = await page.evaluate((key) => localStorage.getItem(key), DISCOVERY_KEY);
            expect(persisted, 'local UI discovery state is persisted').not.toBeNull();
            expect(JSON.parse(persisted)).toEqual({ add: true, remove: true });
            await attachShot(page, testInfo, 'cards-hints-persisted-after-reload');
          });
          EOF

      - name: Prove verifier catches a deliberate wrong postcondition
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NEGATIVE_CONTROL=1 npx playwright test --config=.cards-gesture-r7/playwright.config.mjs --workers=1 2>&1 | tee cards-gesture-evidence/negative-control.log
          RED_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ "$RED_EXIT" -eq 0 ]]; then
            echo '::error::Deliberate negative control unexpectedly passed'
            exit 1
          fi
          if grep -Fq 'NEGATIVE_CONTROL_PRECONDITION_NOT_MET' cards-gesture-evidence/negative-control.log; then
            echo '::error::Negative run failed before the deliberate inverted postcondition'
            exit 1
          fi
          grep -F 'DELIBERATE_NEGATIVE_CONTROL_REMOVE_HINT_SHOULD_STAY_VISIBLE' cards-gesture-evidence/negative-control.log >/dev/null
          printf 'EXPECTED_RED_EXIT=%s\nTARGET=DELIBERATE_NEGATIVE_CONTROL_REMOVE_HINT_SHOULD_STAY_VISIBLE\n' "$RED_EXIT" > cards-gesture-evidence/test-sensitivity.txt

      - name: Run normal public Cards gesture black-box
        env:
          NEGATIVE_CONTROL: '0'
        run: |
          set -euo pipefail
          npx playwright test --config=.cards-gesture-r7/playwright.config.mjs --workers=1 2>&1 | tee cards-gesture-evidence/normal-green.log
          printf 'NORMAL_GREEN=PASS\n' >> cards-gesture-evidence/test-sensitivity.txt

      - name: Verify public build did not change during evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output cards-gesture-evidence/end-version.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          START_BUILD_ID="$(cat cards-gesture-evidence/start-build-id.txt)"
          END_BUILD_ID="$(node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('cards-gesture-evidence/end-version.json','utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          printf 'START_BUILD_ID=%s\nEND_BUILD_ID=%s\nPUBLIC_ORIGIN=%s\n' "$START_BUILD_ID" "$END_BUILD_ID" "$GAMEROAD_PUBLIC_BASE_URL" > cards-gesture-evidence/build-binding.txt
          if [[ "$START_BUILD_ID" != "$END_BUILD_ID" ]]; then
            echo "::error::Public build changed during evidence: start=${START_BUILD_ID} end=${END_BUILD_ID}"
            exit 1
          fi
          echo "CARDS_GESTURE_PUBLIC_EVIDENCE_BUILD=${END_BUILD_ID}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-gesture-public-blackbox-r7-${{ github.run_id }}
          path: cards-gesture-evidence/
          if-no-files-found: error
          retention-days: 14
