name: REQCHECK R7 Board Facility Gate Mapper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-required-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/reqcheck-r7-board-mount-map-20260819
          fetch-depth: 0

      - name: Patch exact board-facility mapping anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gameroad-required-gate.yml')
          text = path.read_text(encoding='utf-8')

          old_paths = '''              browser/board-facility-state-core.mjs|\\
              browser/board-facility-state-core.classic.js|\\
              scripts/build-board-facility-classic.mjs|\\
              tests/board-facility-state-core.test.mjs|\\
              tests/board-facility-classic-adapter.test.mjs)'''
          new_paths = '''              browser/board-facility-state-core.mjs|\\
              browser/board-facility-state-core.classic.js|\\
              browser/board-facility-runtime-mount.mjs|\\
              scripts/build-board-facility-classic.mjs|\\
              tests/board-facility-state-core.test.mjs|\\
              tests/board-facility-classic-adapter.test.mjs|\\
              tests/board-facility-runtime-mount.test.mjs)'''

          old_test = '        run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs'
          new_test = '        run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs'

          if text.count(old_paths) != 1:
              raise SystemExit(f'board path anchor count={text.count(old_paths)}; expected 1')
          if text.count(old_test) != 1:
              raise SystemExit(f'board test anchor count={text.count(old_test)}; expected 1')

          text = text.replace(old_paths, new_paths, 1).replace(old_test, new_test, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run board-facility focused tests
        run: node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs

      - name: Validate bounded diff and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows/gameroad-required-gate.yml
          test "$(git diff --numstat -- .github/workflows/gameroad-required-gate.yml | wc -l)" -eq 1
          grep -F 'browser/board-facility-runtime-mount.mjs' .github/workflows/gameroad-required-gate.yml
          grep -F 'tests/board-facility-runtime-mount.test.mjs' .github/workflows/gameroad-required-gate.yml
          git rm .github/workflows/reqcheck-r7-board-mount-map-temp.yml
          git status --short

      - name: Commit exact workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gameroad-required-gate.yml .github/workflows/reqcheck-r7-board-mount-map-temp.yml
          git commit -m 'REQCHECK R7: classify board runtime mount'
          git push origin HEAD:work/reqcheck-r7-board-mount-map-20260819
