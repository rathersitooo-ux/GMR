name: temp Battle janken board clearance R1
on:
  push:
    branches:
      - work/battle-janken-board-clearance-r1-20260905
    paths:
      - .github/workflows/temp-battle-janken-board-clearance-r1.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/battle-janken-board-clearance-r1-20260905
          fetch-depth: 0
      - name: Compact existing reserved janken card fan on portrait
        shell: python
        run: |
          from pathlib import Path
          p = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          s = p.read_text()
          old = '@media(max-width:540px) and (orientation:portrait){[${HOST_ATTR}="1"]{bottom:185px}[${HOST_ATTR}="1"] .grJankenLoadPreview{width:98px;height:132px}}'
          new = '@media(max-width:540px) and (orientation:portrait){[${HOST_ATTR}="1"]{bottom:185px}[${HOST_ATTR}="1"] .grJankenSlidePadSlot{width:64px;height:88px;padding:5px 4px;border-radius:10px}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.rock{transform:translate(-126px,12px) rotate(-15deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.scissors{transform:translate(-96px,-43px) rotate(-7deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.paper{transform:translate(-38px,-72px) rotate(4deg)}[${HOST_ATTR}="1"] .grJankenSlidePadSuit{font-size:20px}[${HOST_ATTR}="1"] .grJankenSlidePadCard{font-size:9px;line-height:1.1}[${HOST_ATTR}="1"] .grJankenSlidePadHand{font-size:8px}[${HOST_ATTR}="1"] .grJankenLoadPreview{width:98px;height:132px}}'
          if s.count(old) != 1:
              raise SystemExit(f'expected portrait rule once, got {s.count(old)}')
          p.write_text(s.replace(old, new))

          t = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          ts = t.read_text()
          marker = "test('portrait reserved janken fan compacts without changing desktop slot geometry'"
          if marker in ts:
              raise SystemExit('focused regression already present')
          ts += '''\n\ntest('portrait reserved janken fan compacts without changing desktop slot geometry', async () => {\n  const { readFile } = await import('node:fs/promises');\n  const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');\n  assert.match(source, /\\.grJankenSlidePadSlot\\{position:absolute;right:2px;bottom:2px;width:82px;height:112px/);\n  assert.match(source, /@media\\(max-width:540px\\) and \\(orientation:portrait\\)\\{[^\\n]*\\.grJankenSlidePadSlot\\{width:64px;height:88px/);\n  assert.match(source, /orientation:portrait[^\\n]*rock\\{transform:translate\\(-126px,12px\\)[^\\n]*scissors\\{transform:translate\\(-96px,-43px\\)[^\\n]*paper\\{transform:translate\\(-38px,-72px\\)/);\n});\n'''
          t.write_text(ts)
      - name: Verify focused product delta
        run: |
          set -euo pipefail
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --check
          git diff -- browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs "
      - name: Commit product repair and remove executor
        run: |
          set -euo pipefail
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git rm .github/workflows/temp-battle-janken-board-clearance-r1.yml
          git commit -m "Battle: compact portrait janken reserved card fan"
          git push origin HEAD:work/battle-janken-board-clearance-r1-20260905
