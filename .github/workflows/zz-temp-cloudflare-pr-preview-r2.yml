name: GAMEROAD Codex Shared Preview Start Contract Diagnostic R6

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762

jobs:
  diagnose:
    name: Extract exact Battle start contract from target source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact target source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Extract bounded start-contract snippets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('browser/GAMEROAD.html', 'utf8');
          const needles = [
            'window.__GAMEROAD_TEST__',
            '__GAMEROAD_TEST__',
            'startMatch',
            "addEventListener('click'",
            'setupMode',
            'setupContent',
            'deckValidate',
            'function startMatch',
            'start:(',
            'start: ('
          ];
          const seen = new Set();
          for (const needle of needles) {
            let from = 0;
            let hits = 0;
            while (hits < 8) {
              const index = source.indexOf(needle, from);
              if (index < 0) break;
              const key = `${needle}:${index}`;
              if (!seen.has(key)) {
                const start = Math.max(0, index - 1800);
                const end = Math.min(source.length, index + needle.length + 3600);
                console.log(`\n===== CONTRACT_SNIPPET needle=${JSON.stringify(needle)} index=${index} =====`);
                console.log(source.slice(start, end));
                seen.add(key);
              }
              hits += 1;
              from = index + needle.length;
            }
          }
          console.log(`\nSOURCE_LENGTH=${source.length}`);
          NODE
