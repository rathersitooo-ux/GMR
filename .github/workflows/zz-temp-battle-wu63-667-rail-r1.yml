name: TEMP WU63 667 Rail Repair R1

on:
  push:
    branches:
      - sol/battle-wu63-667-rail-repair-r1-20260914

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact advance-reservation and rail contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence/wu63-r1
          python3 - <<'PY'
          from pathlib import Path
          src=Path('browser/GAMEROAD.html').read_text()
          test=Path('tests/browser-static-check.mjs').read_text()
          needles=['battleAdvanceReservation','advanceReservation','arRow','gameroad-battle-visual-first-r4','.battleRail{top:144px','.battleRail{top:','battleRail{top:']
          chunks=[]
          for label,text in [('HTML',src),('STATIC',test)]:
              for needle in needles:
                  start=0;n=0
                  while True:
                      i=text.find(needle,start)
                      if i<0: break
                      n+=1
                      lo=max(0,i-2600);hi=min(len(text),i+5200)
                      chunks.append(f'===== {label} {needle} occurrence {n} @ {i} =====\n'+text[lo:hi])
                      start=i+len(needle)
                      if n>=30: break
          out='\n\n'.join(chunks)
          Path('visual-evidence/wu63-r1/advance-source-context.txt').write_text(out)
          print('contexts',len(chunks))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battle-wu63-r1-advance-source-${{ github.run_id }}
          path: visual-evidence/wu63-r1/advance-source-context.txt
          retention-days: 14
