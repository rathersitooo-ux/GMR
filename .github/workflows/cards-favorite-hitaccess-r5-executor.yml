name: Cards Favorite Hit Access R5

on:
  push:
    branches: [sol/cards-favorite-hitaccess-r5-20260906]

permissions:
  contents: write

env:
  BASE_SHA: 77777f15cc263a33ff9bb8ec1de7e896c979223b
  MANIFEST: data/preaction-authorizations/CARDS-FAVORITE-HITACCESS-R5-20260906T0539-SOL-M8Q4K7.json
  WORKFLOW_FILE: .github/workflows/cards-favorite-hitaccess-r5-executor.yml
  PRODUCT_FILE: browser/cards-deck-presentation.mjs
  TEST_FILE: tests/home-cards-2p5d-runtime.spec.mjs

jobs:
  repair-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cards-favorite-hitaccess-r5-20260906
          fetch-depth: 0

      - name: Verify authorization
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path(os.environ['MANIFEST']).read_text())
          assert m['recordId']=='CARDS-FAVORITE-HITACCESS-R5-20260906T0539-SOL-M8Q4K7'
          assert m['leaseState']=='ACTIVE'
          assert m['diagnosticCaptured'] is True
          assert m['diagnosticRunId']=='33991263168'
          PY

      - name: Apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PRODUCT_FILE']); s=p.read_text()
          pairs=[
            ("  grid.before?.(host);\n  if (!host.parentNode) screen.insertBefore?.(host, grid) ?? screen.appendChild?.(host);","  grid.prepend?.(host);\n  if (!host.parentNode) grid.insertBefore?.(host, grid.firstChild ?? null) ?? grid.appendChild?.(host);"),
            ('[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}','[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;grid-column:1/-1;min-width:0;margin:6px 0 10px}'),
            ("  const observer = typeof win?.MutationObserver === 'function'\n    ? new win.MutationObserver(() => render())\n    : null;","  const observer = typeof win?.MutationObserver === 'function'\n    ? new win.MutationObserver((mutations) => {\n      if (mutations?.length && mutations.every((mutation) => host.contains?.(mutation.target))) return;\n      render();\n    })\n    : null;")]
          for old,new in pairs:
            if s.count(old)!=1: raise SystemExit(f'repair seam count={s.count(old)}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Verify normal-entry hit access
        shell: bash
        run: |
          set -euo pipefail
          cp "$TEST_FILE" /tmp/r5-test
          trap 'cp /tmp/r5-test "$TEST_FILE"' EXIT
          cat >> "$TEST_FILE" <<'EOF'

          test('R5 favorite filter and collection cards own their hit centers', async ({ page }) => {
            test.setTimeout(120_000);
            const ownsCenter = async (loc) => loc.evaluate((node) => {
              const r=node.getBoundingClientRect();
              const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
              return !!top && (top===node || node.contains(top));
            });
            for (const size of [{width:1280,height:720},{width:390,height:844},{width:667,height:375}]) {
              await page.setViewportSize(size);
              const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'load',timeout:30_000});
              expect(response?.ok()).toBeTruthy();
              await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA && globalThis.GAMEROAD_SCREEN_TRANSITION));
              const go=page.locator('.homePadChoice[data-home-target="cards"]:visible').first();
              await expect(go).toBeVisible();
              await go.click();
              await page.waitForFunction(() => globalThis.GAMEROAD_NAV_QA?.snapshot?.().screen==='cards' && globalThis.GAMEROAD_SCREEN_TRANSITION?.getState?.().phase==='IDLE');
              const host=page.locator('[data-role="cards-deck-findability"]');
              const filter=host.locator('[data-filter="favorite"]');
              await expect(host).toBeVisible({timeout:10_000});
              await expect(filter).toBeVisible();
              expect(await host.evaluate(n=>n.parentElement?.id)).toBe('collectionGrid');
              expect(await host.evaluate(n=>n.getBoundingClientRect().height)).toBeGreaterThanOrEqual(44);
              expect(await ownsCenter(filter)).toBe(true);
              await filter.click();
              await expect(filter).toHaveAttribute('aria-pressed','true');
              await filter.click();
              await expect(filter).toHaveAttribute('aria-pressed','false');
              const card=page.locator('#collectionGrid button.slot.live.cardFace:visible').first();
              await expect(card).toBeVisible();
              await card.scrollIntoViewIfNeeded();
              expect(await ownsCenter(card)).toBe(true);
              await card.click();
              await expect(page.locator('.cardPreview')).toBeVisible();
            }
          });
          EOF
          npx playwright test "$TEST_FILE" --config=playwright.config.mjs --workers=1 --grep 'R5 favorite filter and collection cards own their hit centers'
          cp /tmp/r5-test "$TEST_FILE"
          trap - EXIT
          git diff --exit-code -- "$TEST_FILE"

      - name: Run existing Cards regression
        run: npx playwright test "$TEST_FILE" --config=playwright.config.mjs --workers=1

      - name: Commit tested product only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$WORKFLOW_FILE" "$MANIFEST"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$PRODUCT_FILE"
          git add "$PRODUCT_FILE"
          git diff --cached --check
          git commit -m 'Fix Cards favorite filter hit access across viewports'
          git push origin HEAD:sol/cards-favorite-hitaccess-r5-20260906
