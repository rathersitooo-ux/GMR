name: TEMP Public BFI Northstar R1

on:
  push:
    branches:
      - evidence/public-bfi-northstar-r1-20260905
    paths:
      - .github/workflows/temp-public-bfi-northstar-r1.yml

permissions:
  contents: read

jobs:
  public-setup-owner-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD_ID: ca182b54bb8fd91ac90284d96355e3c53be78ecf
    steps:
      - name: Checkout current public source
        uses: actions/checkout@v4
        with:
          ref: ca182b54bb8fd91ac90284d96355e3c53be78ecf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind canonical public origin to current deployed build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' \
            --output public-origin-metadata/gameroad-version.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('public-origin-metadata/gameroad-version.json'));process.stdout.write(String(m.build_id||''))")"
          test "$OBSERVED" = "$EXPECTED_BUILD_ID" || { echo "::error::expected=$EXPECTED_BUILD_ID observed=$OBSERVED"; exit 1; }

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Trace current Setup selector ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata .northstar-public
          cat > .northstar-public/inspect-owner.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:667,height:375}});
          await page.goto(`${process.env.GAMEROAD_PUBLIC_BASE_URL}/`,{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1000);
          await page.locator('[data-home-target="setup"]:visible, [data-go="setup"]:visible, [data-root-go="setup"]:visible').first().click();
          const setup=page.locator('section[data-screen="setup"]');
          await setup.waitFor({state:'visible'});
          await setup.locator('[data-content="honey_hunt"]').click();
          await setup.locator('[data-mode="4p"]').click();
          await page.waitForTimeout(300);
          const data=await page.evaluate(()=>{
            const field=document.querySelector('#gameroadBattleFieldSelection');
            const hero=document.querySelector('.setupHero');
            const box=document.querySelector('.setupBox');
            const start=document.querySelector('#startMatch');
            const matchingRules=[];
            for(const sheet of [...document.styleSheets]){
              let rules=[];
              try{rules=[...(sheet.cssRules||[])];}catch{}
              const walk=(arr,depth=0)=>{
                for(const rule of arr){
                  const text=String(rule.cssText||'');
                  if(/gameroadBattleFieldSelection|grField|setupHero|setupBox|startMatch/.test(text)){
                    matchingRules.push({href:sheet.href||null,ownerTag:sheet.ownerNode?.tagName||null,ownerId:sheet.ownerNode?.id||null,depth,text:text.slice(0,5000)});
                  }
                  if(rule.cssRules) walk([...rule.cssRules],depth+1);
                }
              };
              walk(rules);
            }
            const scripts=[...document.scripts].map((s,i)=>({i,src:s.src||null,type:s.type||null,id:s.id||null,text:(!s.src?String(s.textContent||'').slice(0,1000):'')}));
            const resources=performance.getEntriesByType('resource').map(r=>r.name).filter(n=>/\.m?js(?:\?|$)|GAMEROAD\.html/.test(n));
            const ancestors=(el)=>{const out=[];for(let n=el;n&&n!==document.documentElement;n=n.parentElement){out.push({tag:n.tagName,id:n.id||null,cls:n.className||null});}return out;};
            return {
              fieldOuterHTML:field?.outerHTML||null,
              fieldAncestors:ancestors(field),
              heroOuterHTML:hero?.outerHTML||null,
              heroAncestors:ancestors(hero),
              boxChildren:[...(box?.children||[])].map(n=>({tag:n.tagName,id:n.id||null,cls:n.className||null})),
              startAncestors:ancestors(start),
              matchingRules,scripts,resources,
            };
          });
          fs.writeFileSync('public-origin-metadata/setup-runtime-owner.json',JSON.stringify(data,null,2));
          console.log(JSON.stringify(data,null,2));
          await browser.close();
          EOF
          node .northstar-public/inspect-owner.mjs

      - name: Upload ownership evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-public-setup-owner-${{ github.run_id }}
          path: public-origin-metadata/
          if-no-files-found: error
          retention-days: 7
