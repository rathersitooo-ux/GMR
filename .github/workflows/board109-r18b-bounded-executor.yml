name: TEMP BOARD109 R18B bounded executor
on:
  push:
    branches: [work/board109-r18b-publicpackage-closure-20260826]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/board109-r18b-publicpackage-closure-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R18B authorization and exact preimages
        shell: bash
        run: |
          set -euo pipefail
          BASE=e909300c8ad9ef7de4c7fd697556c8bec0aaf3ea
          MANIFEST=data/preaction-authorizations/VWORK-BOARD109-R18B-PUBLICPACKAGE-CLOSURE-20260826T0022-SOL.json
          FIRST=$(git rev-list --reverse "${BASE}..HEAD" | head -n1)
          test "$(git rev-parse "${FIRST}^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$FIRST" | wc -l)" -eq 1
          git diff-tree --no-commit-id --name-only -r "$FIRST" | grep -Fx "$MANIFEST"
          test "$(git hash-object browser/GAMEROAD.html)" = "6a49aa324d0c40ed342e9e9b0cafc0683d64cdc1"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "15fdd63a799bcbf896575a18702b28cddebc7237"
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "a0dc0848831d9e0739e3b920d200f6711675ac08"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "1860d158b18b0634f26e23e47826c545b186d078"
          node - <<'NODE'
          const fs=require('fs');
          const p='data/preaction-authorizations/VWORK-BOARD109-R18B-PUBLICPACKAGE-CLOSURE-20260826T0022-SOL.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.recordId!=='VWORK-BOARD109-R18B-PUBLICPACKAGE-CLOSURE-20260826T0022-SOL') throw Error('bad record id');
          if(m.authorizationBaseSha!=='e909300c8ad9ef7de4c7fd697556c8bec0aaf3ea') throw Error('stale auth base');
          if(m.acquireKey!=='BOARD109-R18-R17STALE-PUBLICPACKAGE-20260826T0009-SOL-P9Q4V7K2M6RX') throw Error('bad acquire key');
          if(!String(m.proceedToken||'').startsWith('PROCEED|VWORK-BOARD109-R18B-PUBLICPACKAGE-CLOSURE-20260826T0022-SOL|PREACTION_PROCEED_ALLOWED|MATERIAL_STANDARD|')) throw Error('bad proceed token');
          const want=[
            'browser/GAMEROAD.html',
            'tests/browser-full-interaction.spec.mjs',
            'deploy/cloudflare/scripts/build.mjs',
            'deploy/cloudflare/tests/build.test.mjs',
            '.github/workflows/board109-r18b-bounded-executor.yml',
          ].sort();
          if(JSON.stringify([...(m.scope||[])].sort())!==JSON.stringify(want)) throw Error('bad scope');
          NODE
      - name: Apply exact R17 projection and R18B package closure
        shell: bash
        run: |
          set -euo pipefail
          DONOR_BRANCH=work/board109-r17-refresh-resume-projection-20260825
          DONOR_SHA=217910726daf28990549fc60620b14e092f8a3c6
          git fetch origin "$DONOR_BRANCH:refs/remotes/origin/r17-donor"
          test "$(git rev-parse refs/remotes/origin/r17-donor)" = "$DONOR_SHA"
          git show "$DONOR_SHA:browser/GAMEROAD.html" > browser/GAMEROAD.html
          git show "$DONOR_SHA:tests/browser-full-interaction.spec.mjs" > tests/browser-full-interaction.spec.mjs
          test "$(git hash-object browser/GAMEROAD.html)" = "84e470b4f0c6c571e984223fbb4ccdee76ca7206"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "134846879dcc83dfb2689bc0f87c19fd9ea8189f"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
