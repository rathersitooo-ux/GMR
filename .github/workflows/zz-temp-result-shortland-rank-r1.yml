name: TEMP Result Shortland Rank R1

on:
  push:
    branches:
      - work/result-shortland-rank-r1-20260901

permissions:
  contents: write

concurrency:
  group: temp-result-shortland-rank-r1
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact authority and apply one presentation-only patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "work/result-shortland-rank-r1-20260901"
          git merge-base --is-ancestor b59c4659b1f999b5afc385c648ba38b4c3fc501e HEAD
          test -f data/preaction-authorizations/RESULT-SHORTLAND-RANK-R1-20260901T1457-SOL-H6Q2M8.json
          grep -Fq '".github/workflows/zz-temp-result-shortland-rank-r1.yml"' data/preaction-authorizations/RESULT-SHORTLAND-RANK-R1-20260901T1457-SOL-H6Q2M8.json
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          old = '''@media (max-height:500px) and (orientation:landscape){
  .result.active #resultRanking{gap:2px}
  .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:2px 6px}
}'''
          new = '''@media (max-height:500px) and (orientation:landscape){
  .result.active .resultPoints{margin:0}
  .result.active #resultRanking{gap:2px}
  .result.active #resultRanking .rankLine{min-height:0;margin-bottom:0;padding:2px 6px}
}'''
          if new in s:
              if s.count(new) != 1:
                  raise SystemExit(f'PATCHED_BLOCK_CARDINALITY:{s.count(new)}')
              print('PATCH_STATE=ALREADY_APPLIED')
          else:
              if s.count(old) != 1:
                  raise SystemExit(f'OLD_BLOCK_CARDINALITY:{s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('PATCH_STATE=APPLIED')
          PY
          if git diff --quiet -- browser/GAMEROAD.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            before_blob="$(git rev-parse HEAD:browser/GAMEROAD.html)"
            test "$before_blob" = "e3b13b6a770be20ee038bd0e829fc39730e2fac3"
            git diff --check -- browser/GAMEROAD.html
            git diff --stat -- browser/GAMEROAD.html
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Browser static check
        run: node tests/browser-static-check.mjs
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify existing R19 Result path in all normal viewports
        run: npx playwright test tests/browser-full-interaction.spec.mjs --config=playwright.full-interaction.config.mjs --workers=1 --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home"
      - name: Commit product patch only after verification passes
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --cached --name-only)" = "browser/GAMEROAD.html"
          git commit -m 'fix(result): fit ranking in short landscape'
          git push origin HEAD:work/result-shortland-rank-r1-20260901
