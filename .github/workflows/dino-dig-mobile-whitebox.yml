name: DINO DIG Mobile Whitebox

on:
  push:
    branches:
      - main
      - 'work/DINO-DIG-INTERACTION-MOBILE-TECH-001-R2'
    paths:
      - 'browser/dino-dig-mobile-whitebox.html'
      - 'tests/dino-dig-mobile-whitebox.spec.mjs'
      - 'playwright.dino-dig.config.mjs'
      - '.github/workflows/dino-dig-mobile-whitebox.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'browser/dino-dig-mobile-whitebox.html'
      - 'tests/dino-dig-mobile-whitebox.spec.mjs'
      - 'playwright.dino-dig.config.mjs'
      - '.github/workflows/dino-dig-mobile-whitebox.yml'

permissions:
  contents: read

jobs:
  chromium-mobile-whitebox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated DINO DIG mobile whitebox smoke
        run: npx playwright test --config=playwright.dino-dig.config.mjs --workers=1

      - name: Upload whitebox evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dino-dig-mobile-whitebox-${{ github.run_id }}
          path: |
            playwright-report-dino-dig/
            test-results/
          if-no-files-found: warn
          retention-days: 14
