name: GAMEROAD Hand Fan Atomic Patch R2

on:
  push:
    branches:
      - work/BATTLE-HAND-FAN-SELECTION-PRESENTATION-001-R2
    paths:
      - .github/workflows/hand-fan-atomic-patch-r2.yml

permissions:
  contents: write

jobs:
  atomic-patch:
    name: Atomic hand fan patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/BATTLE-HAND-FAN-SELECTION-PRESENTATION-001-R2
          fetch-depth: 0

      - name: Patch exact production HTML
        run: python3 tools/hand-fan-patch-r2.py

      - name: Verify Browser static integrity
        run: |
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check

      - name: Commit production HTML and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-automation"
          git config user.email "actions@users.noreply.github.com"
          git add browser/GAMEROAD.html
          git rm .github/workflows/hand-fan-atomic-patch-r2.yml tools/hand-fan-patch-r2.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          printf 'staged=%s\n' "${staged[*]}"
          [[ "${#staged[@]}" -eq 3 ]]
          [[ "${staged[0]}" == ".github/workflows/hand-fan-atomic-patch-r2.yml" ]]
          [[ "${staged[1]}" == "browser/GAMEROAD.html" ]]
          [[ "${staged[2]}" == "tools/hand-fan-patch-r2.py" ]]
          git commit -m "[BATTLE-HAND-FAN-SELECTION-PRESENTATION-001 R2] fan hand selection presentation"
          git push origin HEAD:work/BATTLE-HAND-FAN-SELECTION-PRESENTATION-001-R2
