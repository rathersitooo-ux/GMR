name: TEMP Result no-defeat character state R1

on:
  push:
    branches:
      - sol/result-nodefeat-charstate-r1-20260909
    paths:
      - .github/workflows/zz-temp-result-nodefeat-charstate-r1.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Result presentation repair
        run: python3 tools/zz-temp-result-nodefeat-charstate-r1.py
      - name: Run focused Result tests
        run: node --test tests/result-presentation-core.test.mjs
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit validated product delta
        shell: bash
        run: |
          git config user.name "gameroad-ci"
          git config user.email "gameroad-ci@users.noreply.github.com"
          git add browser/GAMEROAD.html tests/result-presentation-core.test.mjs
          if git diff --cached --quiet; then
            echo "Expected Result product delta was not produced" >&2
            exit 1
          fi
          git commit -m "Result: remove defeat character presentation from normal ranks"
          git push origin HEAD:${GITHUB_REF_NAME}
