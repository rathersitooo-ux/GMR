name: Post-merge branch cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-work-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'work/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged work branch if it still exists
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            echo "Branch already absent: ${HEAD_REF}"
            exit 0
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
