name: TEMP Battle Camera R9 Capture R2

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-final-20260914

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reuse bounded capture script with correct module resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gameroad-camera-r9-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/zz-temp-battle-camera-r9-capture.yml')
          s=p.read_text(encoding='utf-8')
          marker="          cat >/tmp/camera-r9-capture.mjs <<'NODE'\n"
          start=s.index(marker)+len(marker)
          end=s.index("\n          NODE\n",start)
          Path('/tmp/camera-r9-capture.mjs').write_text(textwrap.dedent(s[start:end])+"\n",encoding='utf-8')
          PY
          rm -rf /tmp/node_modules
          ln -s "$PWD/node_modules" /tmp/node_modules
          node /tmp/camera-r9-capture.mjs
      - name: Upload 667x375 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-camera-r9-667-evidence-r2
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
