name: temp battle card focus r3

on:
  push:
    branches:
      - sol/battle-card-focus-r3-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'battle card focus R3 product delta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-card-focus-r3-20260910
          fetch-depth: 0

      - name: Apply validated focus runtime and classified tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sol/battle-card-focus-r2-20260910
          git diff --binary a84a3c877be133901dec969a6e67a54deb6da0c9..origin/sol/battle-card-focus-r2-20260910 -- \
            browser/battle-janken-slidepad-runtime-mount.mjs > /tmp/card-focus-r2-runtime.patch
          test -s /tmp/card-focus-r2-runtime.patch
          git apply --3way /tmp/card-focus-r2-runtime.patch
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          s = p.read_text(encoding='utf-8')
          marker = '// BATTLE_CARD_FOCUS_PRESENTATION_R3_BEGIN'
          if marker in s:
              raise SystemExit('focus R3 test marker already present')
          block = base64.b64decode('').decode('utf-8')
          p.write_text(s + block, encoding='utf-8')
          PY
          mapfile -t changed < <({ git diff --name-only; git diff --cached --name-only; } | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'browser/battle-janken-slidepad-runtime-mount.mjs'
          test "${changed[1]}" = 'tests/battle-janken-slidepad-runtime-mount.test.mjs'

      - name: Classified runtime tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --check

      - name: Commit product delta only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m 'battle card focus R3 product delta'
          git push origin HEAD:sol/battle-card-focus-r3-20260910