name: Task-private deck slots gate map R2

on:
  push:
    branches:
      - work/required-gate-deck-slots-map-r2-20260829

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact bounded Required Gate mapping
        shell: bash
        env:
          AUTH_BASE: d08f5be0cb695c21fd4a12f60013a1f0f84ff614
          PREACTION_PATH: data/preaction-authorizations/REQGATE-DECKSLOTS-MAP-R2-20260829T1505.json
          SELF_PATH: .github/workflows/deck-slots-gate-map-r2-apply.yml
        run: |
          set -euo pipefail
          git fetch origin main work/deck-slots-core-r1-20260829 --no-tags
          merge_base="$(git merge-base HEAD origin/main)"
          test "${merge_base}" = "${AUTH_BASE}"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gameroad-required-gate.yml')
          text = path.read_text(encoding='utf-8')

          old_classifier = (
              "              browser/deck-save-ack-core.mjs|\\\n"
              "              tests/deck-save-ack-core.test.mjs|\\\n"
              "              browser/deck-save-recovery-core.mjs|\\\n"
              "              tests/deck-save-recovery-core.test.mjs)\n"
          )
          new_classifier = (
              "              browser/deck-save-ack-core.mjs|\\\n"
              "              tests/deck-save-ack-core.test.mjs|\\\n"
              "              browser/deck-save-recovery-core.mjs|\\\n"
              "              tests/deck-save-recovery-core.test.mjs|\\\n"
              "              browser/deck-slots-core.mjs|\\\n"
              "              tests/deck-slots-core.test.mjs)\n"
          )

          old_tests = (
              "      - name: Run Deck save recovery core tests\n"
              "        if: steps.classify.outputs.deck_ack == 'true'\n"
              "        run: node --test tests/deck-save-recovery-core.test.mjs\n"
          )
          new_tests = old_tests + (
              "\n"
              "      - name: Run Deck slots core tests when changed\n"
              "        if: steps.classify.outputs.deck_ack == 'true'\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          if grep -Eq '^(browser/deck-slots-core\\.mjs|tests/deck-slots-core\\.test\\.mjs)$' /tmp/gameroad-changed.txt; then\n"
              "            if [[ ! -f tests/deck-slots-core.test.mjs ]]; then\n"
              "              echo \"Required deck slots test is missing: tests/deck-slots-core.test.mjs\"\n"
              "              exit 1\n"
              "            fi\n"
              "            node --test tests/deck-slots-core.test.mjs\n"
              "          fi\n"
          )

          assert text.count(old_classifier) == 1, f'classifier occurrence count={text.count(old_classifier)}'
          assert text.count(old_tests) == 1, f'test-anchor occurrence count={text.count(old_tests)}'
          assert 'browser/deck-slots-core.mjs' not in text
          assert 'tests/deck-slots-core.test.mjs' not in text

          updated = text.replace(old_classifier, new_classifier, 1).replace(old_tests, new_tests, 1)
          assert updated.count('browser/deck-slots-core.mjs') == 1, f"source path count={updated.count('browser/deck-slots-core.mjs')}"
          assert updated.count('tests/deck-slots-core.test.mjs') == 4, f"test path count={updated.count('tests/deck-slots-core.test.mjs')}"
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check -- .github/workflows/gameroad-required-gate.yml

          mkdir -p /tmp/deck-slots-donor/browser /tmp/deck-slots-donor/tests
          git show origin/work/deck-slots-core-r1-20260829:browser/deck-slots-core.mjs > /tmp/deck-slots-donor/browser/deck-slots-core.mjs
          git show origin/work/deck-slots-core-r1-20260829:tests/deck-slots-core.test.mjs > /tmp/deck-slots-donor/tests/deck-slots-core.test.mjs
          node --test /tmp/deck-slots-donor/tests/deck-slots-core.test.mjs

          rm "${SELF_PATH}"

          actual="$(git diff --name-only "${AUTH_BASE}" | sort)"
          expected="$(printf '%s\n' '.github/workflows/gameroad-required-gate.yml' "${PREACTION_PATH}" | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo 'Unexpected final branch paths:'
            printf '%s\n' "${actual}"
            exit 1
          fi

          test_step_adds="$(git diff --unified=0 "${AUTH_BASE}" -- .github/workflows/gameroad-required-gate.yml | grep -c '^+      - name: Run Deck slots core tests when changed$' || true)"
          test "${test_step_adds}" -eq 1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gameroad-required-gate.yml "${SELF_PATH}"
          git commit -m 'ci: classify and test deck slot core'
          git push origin HEAD:work/required-gate-deck-slots-map-r2-20260829

# trigger: measured-path-counts-r3
