name: FanArt Opponent Real Card Host Census R1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4

      - name: Inspect module loading seams for Battle local opponent skins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('browser/GAMEROAD.html', 'utf8');
          const compact = value => String(value).replace(/\s+/g, ' ').trim();
          function contexts(source, needle, max = 8, radius = 1100) {
            const out = [];
            let from = 0;
            while (out.length < max) {
              const i = source.indexOf(needle, from);
              if (i < 0) break;
              out.push(compact(source.slice(Math.max(0, i - radius), Math.min(source.length, i + needle.length + radius))));
              from = i + needle.length;
            }
            return out;
          }
          const evidence = {
            cardsDeckModule: contexts(html, 'cards-deck-presentation.mjs', 12),
            battleScreenModule: contexts(html, 'battle-screen-runtime-mount.mjs', 12),
            moduleScripts: [...html.matchAll(/<script[^>]+type=["']module["'][^>]*>[\s\S]{0,1600}?<\/script>/gi)].slice(-16).map(m=>compact(m[0])),
            dynamicImports: [...html.matchAll(/import\([^)]{0,220}\)/g)].slice(-40).map(m=>compact(m[0])),
            resolutionRenderer: contexts(html, 'function renderBattlePlayerCards', 3, 1800),
            resolutionHostMarkup: contexts(html, 'id="battleResolution"', 4, 1200),
            resolutionHostMarkupBare: contexts(html, 'id=battleResolution', 4, 1200)
          };
          console.log('OPPONENT_MODULE_LOAD_CENSUS=' + JSON.stringify(evidence));
          NODE
