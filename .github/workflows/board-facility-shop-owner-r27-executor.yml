name: Board Facility Shop Owner R27

on:
  push:
    branches:
      - sol/board-facility-shop-owner-r27-20260906

permissions:
  contents: write

env:
  BASE_SHA: 77777f15cc263a33ff9bb8ec1de7e896c979223b
  MANIFEST: data/preaction-authorizations/BOARD-FACILITY-SHOP-OWNER-R27-20260906T0550-SOL-K7M4Q2.json
  WORKFLOW_FILE: .github/workflows/board-facility-shop-owner-r27-executor.yml

jobs:
  repair-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/board-facility-shop-owner-r27-20260906
          fetch-depth: 0

      - name: Verify authorization
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -f "$MANIFEST"
          python3 -c "import json,os; r=json.load(open(os.environ['MANIFEST'], encoding='utf-8')); assert r.get('authorizationBaseSha') == os.environ['BASE_SHA']; assert r.get('leaseState') == 'ACTIVE'; assert r.get('solutionSignature') == 'BOARD_FACILITY_SHOP_GRANT_OWNER_GUARD_R27'"

      - name: Apply bounded Shop ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('browser/board-facility-state-core.mjs'); s=p.read_text(encoding='utf-8'); old=\"  const product = state.shopProducts[productId];\\n  if (!product) return decision(state, 'rejected', 'PRODUCT_NOT_REGISTERED');\\n  if (state.honey < product.cost) return decision(state, 'rejected', 'INSUFFICIENT_HONEY');\\n\"; new=\"  const product = state.shopProducts[productId];\\n  if (!product) return decision(state, 'rejected', 'PRODUCT_NOT_REGISTERED');\\n  if (product.grantCard.ownerId !== state.playerId) return decision(state, 'rejected', 'GRANT_CARD_NOT_OWNED');\\n  if (state.honey < product.cost) return decision(state, 'rejected', 'INSUFFICIENT_HONEY');\\n\"; assert s.count(old)==1, 'core anchor mismatch'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          cat > /tmp/r27-g7.txt <<'EOF'
          test('G7 a Shop product cannot charge or grant a card owned by another player', () => {
            const initial = baseState({
              shopProducts: {
                itemForeign: { cost: 3, grantCard: { id: 'shop-card-foreign', ownerId: 'p2' } },
              },
            });
            const result = purchaseShopProduct(initial, {
              requestId: 'shop-foreign-owner-1', catalogRevision: 'shop-r7', productId: 'itemForeign',
            });
            assert.equal(result.status, 'rejected');
            assert.equal(result.reason, 'GRANT_CARD_NOT_OWNED');
            assert.equal(result.state, initial);
            assert.equal(result.state.honey, 10);
            assert.deepEqual(result.state.pendingReturns, []);
            assert.deepEqual(result.state.processedRequestIds, []);
          });

          EOF
          python3 -c "from pathlib import Path; p=Path('tests/board-facility-state-core.test.mjs'); s=p.read_text(encoding='utf-8'); a='// H: arena contract, sixteen evidence cases.\\n'; add=Path('/tmp/r27-g7.txt').read_text(encoding='utf-8'); assert s.count(a)==1, 'test anchor mismatch'; p.write_text(s.replace(a,add+a,1),encoding='utf-8')"

      - name: Run focused Board facility tests
        run: node --test tests/board-facility-state-core.test.mjs

      - name: Refresh exact public package dependency pin
        shell: bash
        run: |
          set -euo pipefail
          old=e1aec42eab392b04a94a5b30b1f0f97ad81f368f
          new="$(git hash-object browser/board-facility-state-core.mjs)"
          test "$(grep -o "$old" deploy/cloudflare/tests/build.test.mjs | wc -l)" -eq 1
          sed -i "s/$old/$new/" deploy/cloudflare/tests/build.test.mjs
          echo "BOARD_CORE_BLOB=$new"

      - name: Run public package build contract
        run: node --test deploy/cloudflare/tests/build.test.mjs

      - name: Verify exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'browser/board-facility-state-core.mjs'
          test "${changed[1]}" = 'deploy/cloudflare/tests/build.test.mjs'
          test "${changed[2]}" = 'tests/board-facility-state-core.test.mjs'

      - name: Commit tested product delta and remove transient witnesses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$WORKFLOW_FILE" "$MANIFEST"
          git add browser/board-facility-state-core.mjs tests/board-facility-state-core.test.mjs deploy/cloudflare/tests/build.test.mjs
          mapfile -t bounded < <(git diff --cached --name-only "$BASE_SHA" | sort)
          test "${#bounded[@]}" -eq 3
          test "${bounded[0]}" = 'browser/board-facility-state-core.mjs'
          test "${bounded[1]}" = 'deploy/cloudflare/tests/build.test.mjs'
          test "${bounded[2]}" = 'tests/board-facility-state-core.test.mjs'
          git diff --cached --check
          git commit -m 'Board Shop reject foreign-owner grants'
          git push origin HEAD:sol/board-facility-shop-owner-r27-20260906
