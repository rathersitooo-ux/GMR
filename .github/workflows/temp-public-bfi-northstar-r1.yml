name: TEMP Public BFI Northstar R1

on:
  push:
    branches:
      - evidence/public-bfi-northstar-r1-20260905
    paths:
      - .github/workflows/temp-public-bfi-northstar-r1.yml

permissions:
  contents: read

jobs:
  public-r19-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD_ID: d257e551b54814a97a338d6a6c41f6297dd0c037
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: d257e551b54814a97a338d6a6c41f6297dd0c037

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind canonical public origin to exact deployed build
        id: public_manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          MANIFEST='public-origin-metadata/gameroad-version.json'
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --header 'Cache-Control: no-cache' \
            --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 40 \
            --max-time 30 \
            --output "$MANIFEST" \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          OBSERVED_BUILD_ID="$(MANIFEST="$MANIFEST" node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          echo "observed_build_id=${OBSERVED_BUILD_ID}" >> "$GITHUB_OUTPUT"
          if [[ "$OBSERVED_BUILD_ID" != "$EXPECTED_BUILD_ID" ]]; then
            echo "::error::Public build mismatch expected=${EXPECTED_BUILD_ID} observed=${OBSERVED_BUILD_ID}"
            exit 1
          fi
          printf 'expected_build_id=%s\nobserved_build_id=%s\npublic_origin=%s\n' \
            "$EXPECTED_BUILD_ID" "$OBSERVED_BUILD_ID" "$GAMEROAD_PUBLIC_BASE_URL" \
            > public-origin-metadata/binding.txt

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect short-landscape Setup DOM geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata .northstar-public
          cat > .northstar-public/inspect-setup.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const base = process.env.GAMEROAD_PUBLIC_BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 667, height: 375 } });
          await page.goto(`${base}/`, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(1000);
          const setupGo = page.locator('[data-home-target="setup"]:visible, [data-go="setup"]:visible, [data-root-go="setup"]:visible').first();
          await setupGo.click();
          const setup = page.locator('section[data-screen="setup"]');
          await setup.waitFor({ state: 'visible' });
          await setup.locator('[data-content="honey_hunt"]').click();
          await setup.locator('[data-mode="4p"]').click();
          await page.waitForTimeout(300);
          const data = await page.evaluate(() => {
            const rect = (el) => {
              const r = el?.getBoundingClientRect?.();
              return r ? { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom } : null;
            };
            const style = (el) => {
              if (!el) return null;
              const s = getComputedStyle(el);
              return {
                display:s.display, position:s.position, overflow:s.overflow,
                overflowX:s.overflowX, overflowY:s.overflowY,
                gridTemplateColumns:s.gridTemplateColumns,
                gridTemplateRows:s.gridTemplateRows,
                flexDirection:s.flexDirection,
                justifyContent:s.justifyContent,
                alignItems:s.alignItems,
                padding:s.padding, margin:s.margin,
              };
            };
            const node = (el) => el ? ({
              tag:el.tagName, id:el.id || null, cls:el.className || null,
              rect:rect(el), style:style(el),
              text:(el.textContent || '').replace(/\s+/g,' ').trim().slice(0,120),
            }) : null;
            const setup = document.querySelector('section[data-screen="setup"]');
            const start = document.querySelector('#startMatch');
            const host = document.querySelector('#battleFieldSetupHost');
            const ancestors = [];
            let cur = start;
            while (cur && cur !== document.documentElement) {
              ancestors.push({ ...node(cur), children:[...cur.children].map(node) });
              if (cur === setup) break;
              cur = cur.parentElement;
            }
            const visibleSetupChildren = [...setup.querySelectorAll('*')]
              .filter((el) => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              })
              .map(node)
              .filter((entry) => entry.rect.width >= 80 && entry.rect.height >= 30)
              .slice(0,120);
            return {
              viewport:{width:innerWidth,height:innerHeight,scrollX,scrollY},
              setup:node(setup), start:node(start), host:node(host),
              ancestors, setupChildren:[...setup.children].map(node), visibleSetupChildren,
            };
          });
          fs.writeFileSync('public-origin-metadata/setup-short-landscape-dom.json', JSON.stringify(data, null, 2));
          console.log(JSON.stringify(data, null, 2));
          await browser.close();
          EOF
          node .northstar-public/inspect-setup.mjs

      - name: Prepare exact public-origin R19 runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .northstar-public
          SOURCE='tests/browser-full-interaction.spec.mjs'
          TARGET='.northstar-public/browser-full-interaction.spec.mjs'
          grep -qF "'/browser/GAMEROAD.html'" "$SOURCE"
          sed "s#'/browser/GAMEROAD.html'#'/'#g" "$SOURCE" > "$TARGET"
          cat > .northstar-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';

          const publicProjects = (baseConfig.projects ?? [])
            .filter((project) => !project.grep)
            .map((project) => ({ name: project.name, use: project.use }));

          export default defineConfig({
            testDir: '.',
            testMatch: 'browser-full-interaction.spec.mjs',
            grep: /R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout: 240_000,
            expect: { timeout: 7_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../test-results/public-origin',
            reporter: [
              ['line'],
              ['html', { outputFolder: '../playwright-report-public-origin', open: 'never' }],
              ['json', { outputFile: '../test-results/public-origin/public-origin-report.json' }],
            ],
            use: {
              ...baseConfig.use,
              baseURL: process.env.GAMEROAD_PUBLIC_BASE_URL,
              trace: 'retain-on-failure',
              screenshot: 'on',
              video: 'off',
            },
            projects: publicProjects,
          });
          EOF

      - name: Run public Home Setup 4P Honey Battle Result Home path
        run: npx playwright test --config=.northstar-public/playwright.config.mjs --workers=1

      - name: Record evidence binding
        if: always()
        shell: bash
        env:
          OBSERVED_BUILD_ID: ${{ steps.public_manifest.outputs.observed_build_id }}
        run: |
          set -euo pipefail
          mkdir -p public-origin-metadata
          printf 'workflow_run_id=%s\nsource_sha=%s\nexpected_build_id=%s\nobserved_build_id=%s\npublic_origin=%s\n' \
            "$GITHUB_RUN_ID" "d257e551b54814a97a338d6a6c41f6297dd0c037" "$EXPECTED_BUILD_ID" "${OBSERVED_BUILD_ID:-}" "$GAMEROAD_PUBLIC_BASE_URL" \
            > public-origin-metadata/run-binding.txt

      - name: Upload public interaction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-public-bfi-northstar-${{ github.run_id }}
          path: |
            playwright-report-public-origin/
            test-results/public-origin/
            public-origin-metadata/
          if-no-files-found: error
          retention-days: 7
