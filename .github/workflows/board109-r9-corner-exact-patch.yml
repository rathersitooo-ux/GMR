name: BOARD-109 R9 Corner Exact Patch

on:
  push:
    branches:
      - work/BOARD-109-R9-CORNERFIX-20260816T2142-SOL-J32NHP

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current Browser transport
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='3a8d34bfadf263e0980a4b1c9ec78f75fea07646'
          ACTUAL_BLOB="$(git hash-object browser/GAMEROAD.html)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN_BASE=$(git merge-base HEAD origin/main)"
          echo "BROWSER_BLOB=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          cp browser/GAMEROAD.html /tmp/GAMEROAD.exact-current.html
          test -z "$(git status --porcelain -- browser/GAMEROAD.html)"
      - uses: actions/upload-artifact@v4
        with:
          name: board109-r9-exact-current-browser
          path: /tmp/GAMEROAD.exact-current.html
          if-no-files-found: error
          retention-days: 1
