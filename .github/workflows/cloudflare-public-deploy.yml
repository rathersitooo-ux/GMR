name: GAMEROAD Cloudflare Public Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-public-deploy.yml
      - deploy/cloudflare/release-comms-source.json
      - deploy/cloudflare/relay/wrangler.toml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gameroad-cloudflare-public-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public GAMEROAD package
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: gameroad-browser-r5
      RELAY_WORKER: gameroad-friend-relay-r5
      EVIDENCE_ISSUE: '158'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Run public-host finite checks
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            deploy/cloudflare/tests/relay-core.test.mjs \
            deploy/cloudflare/tests/build.test.mjs \
            deploy/cloudflare/tests/version-manifest.test.mjs
          node --check deploy/cloudflare/relay/src/relay-worker.mjs
          node --check deploy/cloudflare/functions/ws.js

      - name: Build exact public package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BLOB="$(git hash-object browser/GAMEROAD.html)"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node deploy/cloudflare/scripts/build.mjs \
            --expected-blob "$BROWSER_BLOB" \
            --source-commit "$GITHUB_SHA" \
            --published-at "$PUBLISHED_AT"

          PUBLISHED_AT="$PUBLISHED_AT" node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'deploy/cloudflare/release-comms-source.json';
          const outputPath = 'deploy/cloudflare/dist/gameroad-release-comms.json';
          const headersPath = 'deploy/cloudflare/dist/_headers';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (source.schema !== 'GAMEROAD_RELEASE_COMMS_SOURCE_V1') {
            throw new Error(`Unexpected release communications source schema: ${source.schema}`);
          }
          const requiredStates = {
            calendar: 'UNPUBLISHED',
            roadmap: 'UNPUBLISHED',
            release_notes: 'UNPUBLISHED',
            known_issues: 'NOT_ASSERTED',
            service_status: 'NOT_ASSERTED',
          };
          for (const [section, state] of Object.entries(requiredStates)) {
            if (source?.[section]?.state !== state) {
              throw new Error(`release communications ${section}.state must remain ${state} until formal input exists`);
            }
          }
          for (const section of ['calendar', 'roadmap', 'release_notes', 'known_issues']) {
            if (!Array.isArray(source[section].items) || source[section].items.length !== 0) {
              throw new Error(`release communications ${section}.items must remain empty in fail-closed R1`);
            }
          }
          if (source.service_status.message !== null) {
            throw new Error('release communications service_status.message must remain null in fail-closed R1');
          }
          if (!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA || '')) {
            throw new Error('GITHUB_SHA must be an exact lowercase 40-hex commit');
          }
          if (!process.env.PUBLISHED_AT || !Number.isFinite(Date.parse(process.env.PUBLISHED_AT))) {
            throw new Error('PUBLISHED_AT must be an explicit parseable timestamp');
          }
          const output = {
            schema: 'GAMEROAD_RELEASE_COMMS_V1',
            channel: 'current',
            build_id: process.env.GITHUB_SHA,
            published_at: process.env.PUBLISHED_AT,
            communications: {
              calendar: source.calendar,
              roadmap: source.roadmap,
              release_notes: source.release_notes,
              known_issues: source.known_issues,
              service_status: source.service_status,
            },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(output, null, 2)}\n`, 'utf8');
          fs.appendFileSync(headersPath, '\n/gameroad-release-comms.json\n  Cache-Control: no-store\n', 'utf8');
          NODE

      - name: Deploy friend-room relay Worker and Durable Object
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config deploy/cloudflare/relay/wrangler.toml

      - name: Ensure Pages project exists
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@4 pages project list --json)"
          PROJECT_EXISTS="$(
            printf '%s' "$PROJECTS" | node -e '
              const fs = require("node:fs");
              const projects = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!Array.isArray(projects)) {
                throw new Error("Expected Pages project list JSON array.");
              }
              const found = projects.some(
                (project) => project?.["Project Name"] === process.env.PAGES_PROJECT
              );
              process.stdout.write(found ? "yes" : "no");
            '
          )"
          if [[ "$PROJECT_EXISTS" == "yes" ]]; then
            echo "Pages project ${PAGES_PROJECT} already exists."
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
              --production-branch main
          fi

      - name: Deploy Pages production package
        id: pages
        shell: bash
        working-directory: deploy/cloudflare
        run: |
          set -euo pipefail
          cp wrangler.pages.toml wrangler.toml
          trap 'rm -f wrangler.toml' EXIT
          set +e
          OUTPUT="$(npx --yes wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -n 1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Read back production deployment
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deployment list \
            --project-name "$PAGES_PROJECT" \
            --environment production \
            --json

      - name: Probe public Pages URL
        id: probe
        shell: bash
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          if [[ -z "${PAGES_URL:-}" ]]; then
            echo "::error::Pages deployment did not expose a public URL"
            exit 1
          fi
          PROBE_BODY="$RUNNER_TEMP/gameroad-public-probe.html"
          curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --output "$PROBE_BODY" \
            "${PAGES_URL}/"
          if [[ ! -s "$PROBE_BODY" ]]; then
            echo "::error::Public Pages probe returned an empty body"
            exit 1
          fi
          if ! cmp --silent deploy/cloudflare/dist/index.html "$PROBE_BODY"; then
            echo "::error::Public Pages body does not match the exact deployed index.html"
            exit 1
          fi
          echo "External HTTP exact-byte probe succeeded for ${PAGES_URL}/"

      - name: Probe public version manifest
        id: manifest_probe
        shell: bash
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          if [[ -z "${PAGES_URL:-}" ]]; then
            echo "::error::Pages deployment did not expose a public URL for version manifest probe"
            exit 1
          fi
          MANIFEST_BODY="$RUNNER_TEMP/gameroad-version.json"
          MANIFEST_HEADERS="$RUNNER_TEMP/gameroad-version.headers"
          HTTP_CODE="$(curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --dump-header "$MANIFEST_HEADERS" \
            --output "$MANIFEST_BODY" \
            --write-out '%{http_code}' \
            "${PAGES_URL}/gameroad-version.json")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Public version manifest returned HTTP ${HTTP_CODE}, expected 200"
            exit 1
          fi
          if [[ ! -s "$MANIFEST_BODY" ]]; then
            echo "::error::Public version manifest probe returned an empty body"
            exit 1
          fi
          if ! cmp --silent deploy/cloudflare/dist/gameroad-version.json "$MANIFEST_BODY"; then
            echo "::error::Public version manifest does not match the exact deployed gameroad-version.json"
            exit 1
          fi
          if ! grep -qi '^cache-control:.*no-store' "$MANIFEST_HEADERS"; then
            echo "::error::Public version manifest is missing Cache-Control: no-store"
            exit 1
          fi
          MANIFEST_BODY="$MANIFEST_BODY" node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_BODY, 'utf8'));
          const expected = JSON.parse(fs.readFileSync('deploy/cloudflare/dist/gameroad-version.json', 'utf8'));
          if (manifest.build_id !== process.env.GITHUB_SHA) {
            throw new Error(`Public version manifest build_id ${manifest.build_id} does not equal GITHUB_SHA ${process.env.GITHUB_SHA}`);
          }
          for (const key of ['schema', 'channel', 'reload_policy']) {
            if (JSON.stringify(manifest[key]) !== JSON.stringify(expected[key])) {
              throw new Error(`Public version manifest ${key} does not match generated manifest`);
            }
          }
          NODE
          echo "External version-manifest exact-byte/cache/build probe succeeded for ${PAGES_URL}/gameroad-version.json"

      - name: Probe public release communications
        id: release_comms_probe
        shell: bash
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          if [[ -z "${PAGES_URL:-}" ]]; then
            echo "::error::Pages deployment did not expose a public URL for release communications probe"
            exit 1
          fi
          RELEASE_COMMS_BODY="$RUNNER_TEMP/gameroad-release-comms.json"
          RELEASE_COMMS_HEADERS="$RUNNER_TEMP/gameroad-release-comms.headers"
          HTTP_CODE="$(curl --fail --silent --show-error --location \
            --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused \
            --max-time 30 \
            --dump-header "$RELEASE_COMMS_HEADERS" \
            --output "$RELEASE_COMMS_BODY" \
            --write-out '%{http_code}' \
            "${PAGES_URL}/gameroad-release-comms.json")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Public release communications returned HTTP ${HTTP_CODE}, expected 200"
            exit 1
          fi
          if [[ ! -s "$RELEASE_COMMS_BODY" ]]; then
            echo "::error::Public release communications probe returned an empty body"
            exit 1
          fi
          if ! cmp --silent deploy/cloudflare/dist/gameroad-release-comms.json "$RELEASE_COMMS_BODY"; then
            echo "::error::Public release communications does not match exact deployed artifact"
            exit 1
          fi
          if ! grep -qi '^cache-control:.*no-store' "$RELEASE_COMMS_HEADERS"; then
            echo "::error::Public release communications is missing Cache-Control: no-store"
            exit 1
          fi
          RELEASE_COMMS_BODY="$RELEASE_COMMS_BODY" node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_COMMS_BODY, 'utf8'));
          const version = JSON.parse(fs.readFileSync('deploy/cloudflare/dist/gameroad-version.json', 'utf8'));
          if (manifest.schema !== 'GAMEROAD_RELEASE_COMMS_V1') throw new Error('Unexpected release communications schema');
          if (manifest.channel !== 'current') throw new Error('Release communications channel must be current');
          if (manifest.build_id !== process.env.GITHUB_SHA) throw new Error('Release communications build_id must equal GITHUB_SHA');
          if (manifest.build_id !== version.build_id) throw new Error('Release communications build_id must equal version manifest build_id');
          if (manifest.published_at !== version.published_at) throw new Error('Release communications published_at must equal version manifest published_at');
          const requiredStates = {
            calendar: 'UNPUBLISHED',
            roadmap: 'UNPUBLISHED',
            release_notes: 'UNPUBLISHED',
            known_issues: 'NOT_ASSERTED',
            service_status: 'NOT_ASSERTED',
          };
          for (const [section, state] of Object.entries(requiredStates)) {
            if (manifest?.communications?.[section]?.state !== state) {
              throw new Error(`Public release communications ${section}.state must be ${state}`);
            }
          }
          for (const section of ['calendar', 'roadmap', 'release_notes', 'known_issues']) {
            if (!Array.isArray(manifest.communications[section].items) || manifest.communications[section].items.length !== 0) {
              throw new Error(`Public release communications ${section}.items must remain empty in fail-closed R1`);
            }
          }
          if (manifest.communications.service_status.message !== null) {
            throw new Error('Public release communications service_status.message must remain null in fail-closed R1');
          }
          NODE
          echo "External release-communications exact-byte/cache/version probe succeeded for ${PAGES_URL}/gameroad-release-comms.json"

      - name: Probe public friend-room WebSocket
        id: ws_probe
        shell: bash
        env:
          GAMEROAD_PUBLIC_WS_PROBE_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          if [[ -z "${GAMEROAD_PUBLIC_WS_PROBE_URL:-}" ]]; then
            echo "::error::Pages deployment did not expose a public URL for WebSocket probe"
            exit 1
          fi
          node --test deploy/cloudflare/tests/relay-core.test.mjs

      - name: Report sanitized deployment outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELAY_OUTCOME: ${{ steps.relay.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          MANIFEST_PROBE_OUTCOME: ${{ steps.manifest_probe.outcome }}
          RELEASE_COMMS_PROBE_OUTCOME: ${{ steps.release_comms_probe.outcome }}
          WS_PROBE_OUTCOME: ${{ steps.ws_probe.outcome }}
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/publichost-r12-evidence.txt" <<EOF
          PUBLICHOST_R12_DEPLOY_EVIDENCE
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          credentials=${CREDENTIALS_OUTCOME}
          checks=${CHECKS_OUTCOME}
          build=${BUILD_OUTCOME}
          relay=${RELAY_OUTCOME}
          project=${PROJECT_OUTCOME}
          pages=${PAGES_OUTCOME}
          readback=${READBACK_OUTCOME}
          probe=${PROBE_OUTCOME}
          manifest_probe=${MANIFEST_PROBE_OUTCOME}
          release_comms_probe=${RELEASE_COMMS_PROBE_OUTCOME}
          ws_probe=${WS_PROBE_OUTCOME}
          url=${PAGES_URL:-}
          EOF
          gh issue comment "$EVIDENCE_ISSUE" --body-file "$RUNNER_TEMP/publichost-r12-evidence.txt"
