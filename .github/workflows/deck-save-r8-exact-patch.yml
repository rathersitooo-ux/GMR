name: DeckSave R8 Exact Patch Executor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  exact-patch:
    if: github.head_ref == 'work/deck-save-r8-production-integration-20260816'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify base ancestry and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 598bbd33d627fc067cff8432dd6bfc3a52bab8ce HEAD
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          test_path = Path('tests/browser-full-interaction.spec.mjs')
          html = html_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          save_key = "const SAVE_KEY='gameroad.browser.v10.core.1';"
          assert html.count(save_key) == 1, f'SAVE_KEY count={html.count(save_key)}'
          marker_index = html.index(save_key)
          script_open = html.rfind('<script>', 0, marker_index)
          script_close = html.find('</script>', marker_index)
          assert script_open >= 0 and script_close > marker_index, 'app script boundary not found'
          assert html[script_open:script_open+8] == '<script>', 'app script preimage is not classic script'
          assert html.count("from './deck-save-recovery-core.mjs'") == 0, 'recovery core already imported'
          import_block = """<script type=\"module\">\nimport { inspectRawSave, classifyDeckProjection, prepareExplicitDeckCommit, readStorage, writePreparedSaveVerified, resetExplicitSaveKeys } from './deck-save-recovery-core.mjs';\n"""
          html = html[:script_open] + import_block + html[script_open+8:]

          start = html.index('function save(){')
          end = html.index('function show(name){', start)
          assert html.count('function save(){') == 1, 'save() marker not unique'
          assert html.count('function show(name){') == 1, 'show() marker not unique'
          recovery_block = r'''const SAVE_AUTHORITY=Object.freeze({currentSaveRevision:3,currentRuleId:'FIRST_REGULATION',currentRuleRevision:3,recognizedLegacyRules:[{ruleId:'FIRST_REGULATION',ruleRevision:1,deckSizes:[24,26,39]},{ruleId:'FIRST_REGULATION',ruleRevision:2,deckSizes:[24,26,39]}]});
const saveRecoveryRuntime={inspection:null,classification:null,write:null,reset:null};
function savePack(){return{v:3,partner:{id:state.selectedPartnerId,playerCharacterId:state.playerCharacterId,selectionRole:state.characterSelectionRole,profiles:state.partnerProfiles},history:state.history.slice(-20),settings:{...state.settings,audio:{...normalizeAudioSettings()}},progression:state.progression,deck:{main:[...state.savedDeck.main],ex:[...state.savedDeck.ex],ruleId:state.savedDeckRule?.id??null,ruleRevision:state.savedDeckRule?.revision??null},lastPackPreview:[...(state.lastPackPreview||[])]}}
function saveProjection(root){const d=root&&typeof root==='object'&&!Array.isArray(root)?root:{},legacyArray=Array.isArray(d.deck),deck=legacyArray?{main:d.deck,ex:[],ruleId:null,ruleRevision:null}:(d.deck&&typeof d.deck==='object'&&!Array.isArray(d.deck)?d.deck:{}),hasArrays=Array.isArray(deck.main)&&Array.isArray(deck.ex),main=hasArrays?deck.main:[],ex=hasArrays?deck.ex:[];return{saveRevision:Number.isInteger(d.v)&&d.v>=0?d.v:-1,ruleId:deck.ruleId??null,ruleRevision:deck.ruleRevision??null,deckSize:hasArrays?main.length:-1,deckLegal:hasArrays?validateDeck({main,ex}).ok:false}}
function classifySave(inspection){const classification=classifyDeckProjection({inspection,projection:saveProjection(inspection.parsed),authority:SAVE_AUTHORITY});saveRecoveryRuntime.inspection=inspection;saveRecoveryRuntime.classification=classification;return classification}
function cloneObject(v){return v&&typeof v==='object'&&!Array.isArray(v)?JSON.parse(JSON.stringify(v)):{} }
function applyParsedSave(d){if(d.v===1){state.selectedPartnerId=d.char||state.selectedPartnerId;state.playerCharacterId=state.selectedPartnerId;state.characterSelectionRole='partner';state.partnerProfiles=normalizePartnerProfiles(null);state.history=Array.isArray(d.history)?d.history:[];state.settings={reduceMotion:!!d.settings?.reduceMotion,lowPerf:!!d.settings?.lowPerf,audio:normalizeAudioSettings(null)};state.progression={battlePoints:0};if(Array.isArray(d.deck)){state.savedDeck={main:d.deck,ex:[]};state.savedDeckRule={id:null,revision:null};state.deckDraft={main:[...d.deck],ex:[]}}}
else if(d.v===2||d.v===3){state.selectedPartnerId=CHARACTERS.some(c=>c.id===d.partner?.id)?d.partner.id:state.selectedPartnerId;state.playerCharacterId=CHARACTERS.some(c=>c.id===d.partner?.playerCharacterId)?d.partner.playerCharacterId:state.selectedPartnerId;state.characterSelectionRole=d.partner?.selectionRole==='player'?'player':'partner';state.partnerProfiles=normalizePartnerProfiles(d.partner?.profiles);state.history=Array.isArray(d.history)?d.history:[];state.settings={reduceMotion:!!d.settings?.reduceMotion,lowPerf:!!d.settings?.lowPerf,audio:normalizeAudioSettings(d.settings?.audio)};state.progression=d.progression&&typeof d.progression==='object'?d.progression:{battlePoints:0};state.lastPackPreview=Array.isArray(d.lastPackPreview)?d.lastPackPreview.filter(id=>CARDS[id]).slice(-7):[];if(Array.isArray(d.deck?.main)&&Array.isArray(d.deck?.ex)){state.savedDeck={main:d.deck.main.filter(id=>CARDS[id]),ex:d.deck.ex.filter(id=>CARDS[id])};state.savedDeckRule={id:d.deck?.ruleId??null,revision:d.deck?.ruleRevision??null};state.deckDraft={main:[...state.savedDeck.main],ex:[...state.savedDeck.ex]}}}}
function verifiedRawWrite(nextRaw,previousRaw){let writeFailed=false,readbackFailed=false,readback=null;try{localStorage.setItem(SAVE_KEY,nextRaw)}catch(e){writeFailed=true}try{readback=localStorage.getItem(SAVE_KEY)}catch(e){readbackFailed=true}if(!writeFailed&&!readbackFailed&&readback===nextRaw){memorySave=nextRaw;state.storage='localStorage';saveRecoveryRuntime.write={status:'saved',reason:'ADAPTER_WRITE_READBACK_OK'};return true}try{if(previousRaw===null)localStorage.removeItem(SAVE_KEY);else localStorage.setItem(SAVE_KEY,previousRaw);const restored=localStorage.getItem(SAVE_KEY);if(restored!==previousRaw)throw new Error('rollback-mismatch')}catch(e){saveRecoveryRuntime.write={status:'failed',reason:'ADAPTER_ROLLBACK_FAILED'};state.storage='memory';return false}saveRecoveryRuntime.write={status:'failed',reason:writeFailed?'ADAPTER_WRITE_FAILED':readbackFailed?'ADAPTER_READBACK_FAILED':'ADAPTER_READBACK_MISMATCH'};state.storage='memory';return false}
function mergeKnownPack(base,pack){const next={...cloneObject(base),...pack};next.partner={...cloneObject(base?.partner),...pack.partner,profiles:{...cloneObject(base?.partner?.profiles),...cloneObject(pack.partner?.profiles)}};next.settings={...cloneObject(base?.settings),...pack.settings,audio:{...cloneObject(base?.settings?.audio),...cloneObject(pack.settings?.audio)}};next.progression={...cloneObject(base?.progression),...cloneObject(pack.progression)};next.deck={...pack.deck};return next}
function save(){const pack=savePack(),read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){memorySave=JSON.stringify(pack);state.storage='memory';saveRecoveryRuntime.write={status:'failed',reason:read.reason};return false}const inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection),deckOk=validateDeck(state.savedDeck).ok&&state.savedDeckRule?.id===DECK_RULE.id&&state.savedDeckRule?.revision===DECK_RULE.revision;if(classification.status!=='current'||!deckOk){state.storage='localStorage';saveRecoveryRuntime.write={status:'blocked',reason:classification.reason};return false}return verifiedRawWrite(JSON.stringify(mergeKnownPack(inspection.parsed,pack)),read.rawValue)}
function load(){let read=readStorage(localStorage,SAVE_KEY),raw=null;if(read.status==='read'){state.storage='localStorage';raw=read.rawValue;memorySave=raw}else{state.storage='memory';raw=memorySave}const inspection=inspectRawSave(raw),classification=classifySave(inspection);if((classification.status==='current'||classification.status==='recognized_legacy')&&inspection.parsed)applyParsedSave(inspection.parsed);state.settings.audio=normalizeAudioSettings(state.settings.audio);state.partnerProfiles=normalizePartnerProfiles(state.partnerProfiles);state.progression=state.progression&&typeof state.progression==='object'?state.progression:{battlePoints:0};recoverDeckDraftSession();return classification}
window.__GAMEROAD_SAVE_RECOVERY__={snapshot:()=>JSON.parse(JSON.stringify(saveRecoveryRuntime)),authority:{...SAVE_AUTHORITY}};
'''
          html = html[:start] + recovery_block + html[end:]

          old_commit_start = html.index('function commitDeck(){')
          old_commit_end = html.index('function restoreDeck(){', old_commit_start)
          assert html.count('function commitDeck(){') == 1, 'commitDeck marker not unique'
          commit_block = r'''function commitDeck(){const v=validateDeck(state.deckDraft);if(!v.ok){toast(v.errors[0]);renderCards();return false}const nextDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex],ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision},nextProjection={saveRevision:3,ruleId:DECK_RULE.id,ruleRevision:DECK_RULE.revision,deckSize:state.deckDraft.main.length,deckLegal:true},read=readStorage(localStorage,SAVE_KEY);if(read.status!=='read'){state.storage='memory';saveRecoveryRuntime.write={status:'failed',reason:read.reason};toast('端末保存を確認できません。札組は保存していません');renderCards();return false}let inspection=inspectRawSave(read.rawValue),classification=classifySave(inspection);if(inspection.status==='missing'){const seed=savePack();seed.deck=nextDeck;inspection=inspectRawSave(JSON.stringify(seed));classification=classifyDeckProjection({inspection,projection:nextProjection,authority:SAVE_AUTHORITY})}const prepared=prepareExplicitDeckCommit({inspection,currentClassification:classification,path:['deck'],nextDeckRecord:nextDeck,nextProjection,authority:SAVE_AUTHORITY});if(prepared.status!=='prepared'){saveRecoveryRuntime.write=prepared;toast('保存データを保護するため札組を上書きしません');renderCards();return false}const written=writePreparedSaveVerified(localStorage,SAVE_KEY,prepared,{previousRawValue:read.rawValue});saveRecoveryRuntime.write=written;if(written.status!=='saved'){state.storage='memory';toast('保存に失敗しました。元の保存データを維持します');renderCards();return false}memorySave=prepared.serialized;state.storage='localStorage';state.savedDeck={main:[...state.deckDraft.main],ex:[...state.deckDraft.ex]};state.savedDeckRule={id:DECK_RULE.id,revision:DECK_RULE.revision};clearDeckDraftSession();renderCards();renderSetupDeckStatus();if(typeof ctxSet==='function')ctxSet('DECK_SAVED',{kind:'ok',ttl:2200});toast('札組を端末へ保存しました');return true}
'''
          html = html[:old_commit_start] + commit_block + html[old_commit_end:]

          reset_start = html.index("$('#resetSave').onclick=()=>{")
          reset_end = html.index(';wireAudioSettings();', reset_start)
          assert html.count("$('#resetSave').onclick=()=>{") == 1, 'reset handler marker not unique'
          reset_block = r'''$('#resetSave').onclick=()=>{if(!window.confirm('端末のGAMEROAD保存を初期化します。よろしいですか？'))return false;const rr=resetExplicitSaveKeys(localStorage,[SAVE_KEY],{confirmed:true});saveRecoveryRuntime.reset=rr;if(rr.status!=='reset'){state.storage='memory';renderSettings();toast('保存の初期化に失敗しました。元の保存データを維持します');return false}memorySave=null;clearDeckDraftSession();state.history=[];state.progression={battlePoints:0};state.setupMode='2p';state.setupContent='road_shield';state.selectedPartnerId='partner.naki';state.playerCharacterId='partner.naki';state.characterSelectionRole='partner';state.partnerProfiles=normalizePartnerProfiles(null);state.settings={reduceMotion:false,lowPerf:false,audio:{...AUDIO_DEFAULTS}};state.lastPackPreview=[];state.gachaBusy=false;state.savedDeck={main:[...DEFAULT_DECK],ex:[]};state.savedDeckRule={id:null,revision:null};state.deckDraft={main:[...DEFAULT_DECK],ex:[]};state.storage='localStorage';audioStopMusic('reset');audioRuntime.seenEvents.clear();renderSettings();renderCards();renderSetupDeckStatus();toast('保存を初期化しました');return true}'''
          html = html[:reset_start] + reset_block + html[reset_end:]

          ctx_old = "$('#saveDeck').addEventListener('click',()=>{const v=validateDeck(state.deckDraft);if(!v.ok)ctxSet('DECK_INVALID',{message:ctxSafeText(v.errors[0])});else ctxSet('DECK_SAVED',{kind:'ok',ttl:2200})},true);"
          ctx_new = "$('#saveDeck').addEventListener('click',()=>{const v=validateDeck(state.deckDraft);if(!v.ok)ctxSet('DECK_INVALID',{message:ctxSafeText(v.errors[0])});else ctxClear('DECK_')},true);"
          assert html.count(ctx_old) == 1, f'context save marker count={html.count(ctx_old)}'
          html = html.replace(ctx_old, ctx_new, 1)

          assert html.count("from './deck-save-recovery-core.mjs'") == 1
          assert html.count('function save(){') == 1
          assert html.count('function commitDeck(){') == 1
          assert html.count("$('#resetSave').onclick=()=>{") == 1
          assert 'localStorage.removeItem(SAVE_KEY)}catch(e){}' not in html
          html_path.write_text(html, encoding='utf-8')

          test_marker = "test('deck recovery adapter preserves blocked raw saves, keeps legacy repairable, and reset does not reseed default 26'"
          assert test_marker not in tests, 'R8 browser recovery test already present'
          tests += r'''

test('deck recovery adapter preserves blocked raw saves, keeps legacy repairable, and reset does not reseed default 26', async ({ page }, testInfo) => {
  const runtime = observeRuntimeErrors(page);
  await bootCurrentBrowser(page);
  const initialRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);
  expect(initialRaw, 'missing save is not implicitly materialized on boot').toBeNull();
  const defaultDeck = await page.evaluate(() => [...window.__DEFAULT_DECK__]);
  expect(defaultDeck).toHaveLength(26);

  const reloadWithRaw = async (raw) => {
    await page.evaluate(({ key, rawValue }) => localStorage.setItem(key, rawValue), { key: STORAGE_KEY, rawValue: raw });
    await page.reload({ waitUntil: 'domcontentloaded' });
    await page.waitForTimeout(800);
    return page.evaluate((key) => ({
      raw: localStorage.getItem(key),
      recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(),
      savedDeck: [...window.__GAMEROAD_TEST__.state.savedDeck.main],
      rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule },
    }), STORAGE_KEY);
  };

  const corruptRaw = '{not-json';
  let observed = await reloadWithRaw(corruptRaw);
  expect(observed.raw).toBe(corruptRaw);
  expect(observed.recovery.inspection.status).toBe('corrupt');

  const unknownRaw = JSON.stringify({ v: 3, opaque: { keep: 7 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 99 } });
  observed = await reloadWithRaw(unknownRaw);
  expect(observed.raw).toBe(unknownRaw);
  expect(observed.recovery.classification.status).toBe('blocked');
  expect(observed.recovery.classification.reason).toBe('RULE_UNKNOWN_OR_UNSUPPORTED');

  const newerRaw = JSON.stringify({ v: 4, opaque: { keep: 8 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 3 } });
  observed = await reloadWithRaw(newerRaw);
  expect(observed.raw).toBe(newerRaw);
  expect(observed.recovery.classification.reason).toBe('SAVE_REVISION_NEWER');

  const legacyRaw = JSON.stringify({ v: 2, partner: { id: 'partner.naki' }, history: [{ keep: 'legacy-history' }], settings: { reduceMotion: true }, progression: { battlePoints: 9 }, deck: { main: defaultDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 2 }, opaque: { keep: 9 } });
  observed = await reloadWithRaw(legacyRaw);
  expect(observed.raw).toBe(legacyRaw);
  expect(observed.recovery.classification.status).toBe('recognized_legacy');
  expect(observed.savedDeck).toHaveLength(26);
  expect(observed.rule.revision).toBe(2);

  await page.evaluate((key) => localStorage.removeItem(key), STORAGE_KEY);
  await page.reload({ waitUntil: 'domcontentloaded' });
  await page.waitForTimeout(800);
  const legal = await installLegalBattleDeck(page);
  expect(legal.committed).toBeTruthy();
  const storedLegal = await page.evaluate((key) => JSON.parse(localStorage.getItem(key)), STORAGE_KEY);
  expect(storedLegal.deck.main).toHaveLength(40);
  expect(storedLegal.deck.ruleId).toBe('FIRST_REGULATION');
  expect(storedLegal.deck.ruleRevision).toBe(3);

  page.once('dialog', async (dialog) => dialog.accept());
  await page.evaluate(() => document.querySelector('#resetSave').click());
  await page.waitForTimeout(120);
  const afterReset = await page.evaluate((key) => ({
    raw: localStorage.getItem(key),
    savedCount: window.__GAMEROAD_TEST__.state.savedDeck.main.length,
    rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule },
  }), STORAGE_KEY);
  expect(afterReset.raw, 'explicit reset does not resurrect default26 as a durable save').toBeNull();
  expect(afterReset.savedCount).toBe(26);
  expect(afterReset.rule.id).toBeNull();

  const failedWrite = await page.evaluate((key) => {
    const t = window.__GAMEROAD_TEST__;
    const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
    const standard = window.__CARD_DATA__.filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank))).map((card) => card.id);
    const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
    const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
    const main = [...nonRoyal.slice(0, 37), ...royalIds];
    const setValidation = t.deckSetDraft(main, []);
    const proto = Object.getPrototypeOf(localStorage);
    const originalSetItem = proto.setItem;
    Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value() { throw new Error('forced-storage-write-failure'); } });
    let committed;
    try { committed = t.deckCommit(); }
    finally { Object.defineProperty(proto, 'setItem', { configurable: true, writable: true, value: originalSetItem }); }
    return { committed, setValidation, raw: localStorage.getItem(key), recovery: window.__GAMEROAD_SAVE_RECOVERY__.snapshot(), savedCount: t.state.savedDeck.main.length };
  }, STORAGE_KEY);
  expect(failedWrite.setValidation.ok).toBeTruthy();
  expect(failedWrite.committed, 'write failure fails closed').toBeFalsy();
  expect(failedWrite.raw).toBeNull();
  expect(failedWrite.savedCount, 'failed durable save does not promote the 40-card draft').toBe(26);
  expect(failedWrite.recovery.write.status).toBe('failed');
  runtime.assertClean(testInfo);
});
'''
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check tests/browser-full-interaction.spec.mjs
          git diff --check

      - name: Self-clean executor and push exact patch commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-r8-executor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/deck-save-r8-exact-patch.yml
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/deck-save-r8-exact-patch.yml browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${#staged[@]}" -eq 3 ]]
          [[ "$(printf '%s\n' "${staged[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]]
          git commit -m 'DeckSave R8: wire non-destructive recovery into production browser'
          git push origin HEAD:${{ github.head_ref }}
