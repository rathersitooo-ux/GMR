name: Temporary Saasuna Battle AI R2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'sol/saasuna-battle-ai-contextual-reaction-r2-20260908'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact product patch
        run: python tools/zz-temp-saasuna-battle-ai-r2.py
      - name: Focused test
        run: node --test tests/partner-battle-ai-contextual-reaction.test.mjs
      - name: Commit durable product delta and remove transient runner
        run: |
          git config user.name 'gameroad-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/partner-advice-runtime-mount.mjs tests/partner-battle-ai-contextual-reaction.test.mjs
          git rm data/preaction-authorizations/PARTNER-SAASUNA-BATTLE-AI-R2-20260908T0803-SOL-Q7N4V9.json tools/zz-temp-saasuna-battle-ai-r2.py .github/workflows/zz-temp-saasuna-battle-ai-r2.yml
          git commit -m 'Connect Saasuna AI to confirmed battle reactions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
