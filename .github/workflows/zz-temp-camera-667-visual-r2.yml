name: TEMP Camera 667 Visual R3

on:
  push:
    branches:
      - sol/battle-camera-html-r8-20260913

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair hidden rail semantics and run focused static tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hp=Path('browser/GAMEROAD.html')
          s=hp.read_text(encoding='utf-8')
          hidden_rule='.battle .battleRail .railBtn[hidden]{display:none!important;pointer-events:none!important}'
          if hidden_rule not in s:
              old='#cameraReturnBtn{display:none;pointer-events:none}\n#cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{display:flex;pointer-events:auto;'
              new='#cameraReturnBtn{display:none;pointer-events:none}\n'+hidden_rule+'\n#cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{display:flex;pointer-events:auto;'
              if s.count(old)!=1:
                  raise SystemExit(f'camera CSS anchor count={s.count(old)}')
              s=s.replace(old,new,1)
              hp.write_text(s,encoding='utf-8')

          tp=Path('tests/battle-camera-live-integration.test.mjs')
          t=tp.read_text(encoding='utf-8')
          hidden_assert="  assert.match(html,/\\.battle \\.battleRail \\.railBtn\\[hidden\\]\\{display:none!important;pointer-events:none!important\\}/);"
          if hidden_assert not in t:
              old_test="  assert.match(html,/#cameraReturnBtn\\{display:none;pointer-events:none\\}/);"
              if t.count(old_test)!=1:
                  raise SystemExit(f'camera regression anchor count={t.count(old_test)}')
              t=t.replace(old_test,old_test+'\n'+hidden_assert,1)
              tp.write_text(t,encoding='utf-8')
          PY
          node --test tests/battle-camera-live-integration.test.mjs
          node tests/browser-static-check.mjs
          git diff --check
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Write bounded 667x375 evidence test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .camera-667 visual-evidence test-results
          cat > .camera-667/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir:'.',testMatch:'camera-667.spec.mjs',outputDir:'../test-results',timeout:90000,
            expect:{timeout:7000},workers:1,retries:0,
            use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},trace:'retain-on-failure'},
            webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}
          });
          EOF
          cat > .camera-667/camera-667.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const output=path.resolve('visual-evidence');
          async function installLegalBattleDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__;const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);const royalIds=['SP_J','SP_Q','SP_K'];const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));const main=[...nonRoyal.slice(0,37),...royalIds];t.deckSetDraft(main,[]);const validation=t.deckValidate(t.state.deckDraft,{forBattle:true});const committed=validation.ok?t.deckCommit():false;return{committed,validation,saved:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          async function railMetrics(page){return page.evaluate(()=>{const vr={w:innerWidth,h:innerHeight};const rail=document.querySelector('.battleRail');const rr=rail?.getBoundingClientRect();const items=[...document.querySelectorAll('.battleRail .railBtn')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return{id:el.id,aria:el.getAttribute('aria-label')||el.title||'',hidden:el.hidden,disabled:el.disabled,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,pointer:cs.pointerEvents,rect:{x:r.x,y:r.y,w:r.width,h:r.height},inViewport:r.width>0&&r.height>0&&r.right>0&&r.bottom>0&&r.left<innerWidth&&r.top<innerHeight}});return{viewport:vr,rail:rr?{x:rr.x,y:rr.y,w:rr.width,h:rr.height}:null,items}})}
          test('667x375 camera is transient and rail geometry is measured, not guessed',async({page})=>{
            const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});expect(response?.ok()).toBeTruthy();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});
            const deck=await installLegalBattleDeck(page);expect(deck.committed).toBeTruthy();expect(deck.saved.ok).toBeTruthy();
            const setupControl=page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first();await expect(setupControl).toBeVisible();await setupControl.click();
            const setup=page.locator('section[data-screen="setup"]');await expect(setup).toBeVisible();await setup.locator('[data-content="road_shield"]').click();await setup.locator('[data-mode="2p"]').click();await setup.locator('#startMatch').click();
            const battle=page.locator('section[data-screen="battle"]');await expect(battle).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();
            const returnBtn=battle.locator('#cameraReturnBtn');await expect(returnBtn).toBeHidden();
            const follow=await returnBtn.evaluate(el=>({hidden:el.hidden,display:getComputedStyle(el).display,pointer:getComputedStyle(el).pointerEvents,rects:el.getClientRects().length,mode:el.dataset.cameraMode||null}));expect(follow).toEqual({hidden:true,display:'none',pointer:'none',rects:0,mode:'FOLLOW_CONTROLLED'});
            const clear=page.locator('#clearPrecommitSelection');if(await clear.count()){const cs=await clear.evaluate(el=>({hidden:el.hidden,display:getComputedStyle(el).display,rects:el.getClientRects().length}));if(cs.hidden)expect(cs).toEqual({hidden:true,display:'none',rects:0});}
            const baseCount=await battle.locator('.battleRail .railBtn:visible').count();const m1=await railMetrics(page);fs.writeFileSync(path.join(output,'rail-follow.json'),JSON.stringify(m1,null,2));await page.screenshot({path:path.join(output,'camera-follow-667x375.png'),animations:'disabled'});
            const world=battle.locator('#battleMap'),box=await world.boundingBox();expect(box).not.toBeNull();await page.mouse.move(box.x+box.width*.52,box.y+box.height*.50);await page.mouse.down();await page.mouse.move(box.x+box.width*.35,box.y+box.height*.50,{steps:8});await page.mouse.up();
            await expect(returnBtn).toBeVisible();await expect(returnBtn).toHaveAttribute('data-camera-mode','MANUAL_INSPECT');expect(await battle.locator('.battleRail .railBtn:visible').count()).toBe(baseCount+1);const m2=await railMetrics(page);fs.writeFileSync(path.join(output,'rail-manual.json'),JSON.stringify(m2,null,2));await page.screenshot({path:path.join(output,'camera-manual-inspect-667x375.png'),animations:'disabled'});
            await returnBtn.click();await expect(returnBtn).toBeHidden();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode)).toBe('FOLLOW_CONTROLLED');expect(await battle.locator('.battleRail .railBtn:visible').count()).toBe(baseCount);const m3=await railMetrics(page);fs.writeFileSync(path.join(output,'rail-returned.json'),JSON.stringify(m3,null,2));await page.screenshot({path:path.join(output,'camera-returned-667x375.png'),animations:'disabled'});
          });
          EOF
      - name: Run bounded 667x375 evidence
        run: npx playwright test --config=.camera-667/playwright.config.mjs --workers=1
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: camera-667-visual-${{ github.run_id }}
          path: |
            visual-evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified hidden semantics and cleanup
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs
          git rm -f .github/workflows/zz-temp-camera-667-visual-r2.yml
          git commit -m 'Battle: hidden rail操作のfootprintを0化'
          git push origin HEAD:sol/battle-camera-html-r8-20260913
