name: temp-home-transition-readiness-r8
on:
  push:
    branches:
      - sol/home-transition-readiness-r8-20260915
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/home-transition-readiness-r8-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence exact product inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/GAMEROAD.html)" = "643ed5f94e9507098488e8b738a8e34e86d89aa2"
          test "$(git hash-object tests/browser-static-check.mjs)" = "30d8e9642ed048a23eb44a2256bca66df486d1cd"
      - name: Apply bounded readiness repair
        run: python3 tools/temp-home-transition-readiness-r8.py
      - name: Verify classified Browser static regression
        run: node tests/browser-static-check.mjs
      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "browser/GAMEROAD.html"
          test "${changed[1]}" = "tests/browser-static-check.mjs"
      - name: Commit durable product diff and clean transient authorization
        shell: bash
        run: |
          set -euo pipefail
          rm tools/temp-home-transition-readiness-r8.py
          rm .github/workflows/zz-temp-home-transition-readiness-r8.yml
          rm data/preaction-authorizations/BROWSER-HOME-TRANSITION-READINESS-R8-20260915T0108-SOL-RO43.json
          git add -A
          git diff --cached --check
          git config user.name "gameroad-bounded-writer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: gate Home routes on transition runtime readiness"
          git push origin HEAD:sol/home-transition-readiness-r8-20260915
