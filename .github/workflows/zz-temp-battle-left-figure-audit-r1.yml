name: TEMP Battle Left Figure Audit R1

on:
  push:
    branches:
      - sol/battle-left-figure-audit-r1-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare bounded DOM audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tests/browser-full-interaction.spec.mjs').read_text()
          needle = "  await attachStateScreenshot(page, testInfo, 'r19-honey-four-player-battle-visible');"
          if src.count(needle) != 1:
              raise SystemExit(f'needle count={src.count(needle)}')
          injection = r'''  await attachStateScreenshot(page, testInfo, 'r19-honey-four-player-battle-visible');
          const leftFigureAudit = await battle.evaluate((root) => {
            const rect = (node) => {
              const r = node.getBoundingClientRect();
              return { left:r.left, top:r.top, right:r.right, bottom:r.bottom, width:r.width, height:r.height, area:r.width*r.height };
            };
            const describe = (node) => {
              if (!node) return null;
              const cs = getComputedStyle(node);
              const before = getComputedStyle(node, '::before');
              const after = getComputedStyle(node, '::after');
              return {
                tag: node.tagName,
                id: node.id || null,
                className: typeof node.className === 'string' ? node.className : null,
                src: node.currentSrc || node.src || null,
                dataset: {...node.dataset},
                rect: rect(node),
                computed: {
                  display: cs.display, visibility: cs.visibility, opacity: cs.opacity,
                  position: cs.position, zIndex: cs.zIndex, overflow: cs.overflow,
                  objectFit: cs.objectFit, objectPosition: cs.objectPosition,
                  backgroundImage: cs.backgroundImage,
                },
                before: { content: before.content, backgroundImage: before.backgroundImage },
                after: { content: after.content, backgroundImage: after.backgroundImage },
              };
            };
            const nodes = [...root.querySelectorAll('*')];
            const candidates = nodes.filter((node) => {
              const r = node.getBoundingClientRect();
              if (r.width < 44 || r.height < 72 || r.right <= 0 || r.bottom <= 0) return false;
              const cs = getComputedStyle(node);
              if (cs.display === 'none' || cs.visibility === 'hidden' || Number(cs.opacity) <= 0) return false;
              const bg = cs.backgroundImage && cs.backgroundImage !== 'none';
              const pseudoBg = getComputedStyle(node,'::before').backgroundImage !== 'none' || getComputedStyle(node,'::after').backgroundImage !== 'none';
              return node.tagName === 'IMG' || node.tagName === 'CANVAS' || bg || pseudoBg;
            }).map((node) => {
              const ancestors = [];
              let p = node.parentElement;
              for (let i=0; p && i<6; i+=1, p=p.parentElement) ancestors.push({tag:p.tagName,id:p.id||null,className:typeof p.className==='string'?p.className:null,dataset:{...p.dataset},rect:rect(p)});
              return {...describe(node), ancestors};
            }).sort((a,b) => b.rect.area - a.rect.area);
            return {
              viewport: { width: innerWidth, height: innerHeight },
              root: describe(root),
              candidates: candidates.slice(0, 40),
            };
          });
          console.log(`LEFT_FIGURE_AUDIT_JSON=${JSON.stringify(leftFigureAudit)}`);
          return;'''
          Path('tests/.temp-battle-left-figure-audit.spec.mjs').write_text(src.replace(needle, injection))
          PY
          cat > .temp-battle-left-figure-audit.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from './playwright.full-interaction.config.mjs';
          export default defineConfig({
            ...baseConfig,
            testDir: './tests',
            testMatch: '.temp-battle-left-figure-audit.spec.mjs',
            grep: /R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout: 120_000,
            workers: 1,
            retries: 0,
            reporter: [['line']],
            projects: [{ name: 'desktop-1280x720-audit', use: { viewport: { width: 1280, height: 720 } } }],
            use: { ...baseConfig.use, trace: 'off', screenshot: 'off', video: 'off' },
          });
          EOF
      - name: Audit live Battle DOM
        run: npx playwright test --config=.temp-battle-left-figure-audit.config.mjs --workers=1
