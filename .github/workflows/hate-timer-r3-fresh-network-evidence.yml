name: HATE Timer R3 Fresh Network Evidence

on:
  push:
    branches:
      - 'work/HATE_TIMER-01-R3-NETWORK-EVIDENCE-FRESH'
    paths:
      - '.github/workflows/hate-timer-r3-fresh-network-evidence.yml'

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact QA and plan source inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          names=['qaState','qaSetFast','qaSetNoEffectHands','qaPlans','submitHostPlan','submitGuestPlan','hostStart','legalPlan']
          for name in names:
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\(',s)
              print(f'\n===== {name} @ {m.start() if m else -1} =====')
              if m: print(s[max(0,m.start()-250):min(len(s),m.start()+5500)].replace('\r',''))
          i=s.find('window.GAMEROAD_FRIEND_ROOM_R2')
          print('\n===== API EXPORT =====')
          print(s[i:i+8000].replace('\r','') if i>=0 else 'NOT_FOUND')
          PY
      - name: No mutation
        run: test -z "$(git status --porcelain --untracked-files=all)"
