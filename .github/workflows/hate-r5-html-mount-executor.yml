name: HATE R5 HTML Mount Executor

on:
  push:
    branches:
      - work/HATE_TIMER-01-R5-PRODMOUNT-20260817

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recheck current base and owned pre-HTML diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0c4b095d105de1556d12c1e5a57d19fb78b4bf9d"
          git merge-base --is-ancestor origin/main HEAD^
          test "$(git hash-object browser/GAMEROAD.html)" = "c7f5ebf7828840de695093cdd782882d0f00aeba"
          mapfile -t changed < <(git diff --name-only origin/main HEAD^ | sort)
          expected=(
            "deploy/cloudflare/relay/src/relay-core.mjs"
            "deploy/cloudflare/relay/src/relay-worker.mjs"
            "deploy/cloudflare/scripts/build.mjs"
            "deploy/cloudflare/tests/build.test.mjs"
            "deploy/cloudflare/tests/relay-core.test.mjs"
            "tests/browser-static-check.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Mount server-revisioned peer presence into production Browser
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('browser/GAMEROAD.html')
          html = path.read_text()

          anchor = r"function normCode(v=''){return String(v||'').toUpperCase().replace(/[\s\-_.]/g,'')}"
          helper = r"""const FRIEND_TRANSPORT_PRESENCE_TYPE='transport_presence';
          const FRIEND_PRESENCE={states:new Map(),corePromise:null,core:null};
          async function friendPresenceCore(){
            if(!FRIEND_PRESENCE.corePromise)FRIEND_PRESENCE.corePromise=import('./hate-peer-presence-core.mjs');
            const core=await FRIEND_PRESENCE.corePromise;FRIEND_PRESENCE.core=core;return core
          }
          function friendPresenceEligible(cid){
            const peerId=String(cid||''),prior=FRIEND_PRESENCE.states.get(peerId),core=FRIEND_PRESENCE.core;
            if(!prior||!core)return false;
            try{return !!core.projectHateHumanWaitSourceEligibility(prior).eligible}catch{return false}
          }
          async function friendApplyTransportPresence(m){
            const peerId=String(m?.clientId||''),sessionId=String(m?.sessionId||''),revision=Number(m?.revision),kind=String(m?.kind||'');
            if(!peerId||!sessionId||!Number.isSafeInteger(revision)||revision<=0)return false;
            try{
              const core=await friendPresenceCore();
              let prior=FRIEND_PRESENCE.states.get(peerId);
              if(!prior||prior.sessionId!==sessionId)prior=core.createHatePeerPresenceState({peerId,sessionId,revision:0,connected:false});
              const applied=core.applyHatePeerPresenceEvent(prior,{kind,peerId,sessionId,revision});
              if(!applied.ok){FR.lastReject='hate_presence_'+String(applied.reason||'invalid').toLowerCase();return friendPresenceEligible(peerId)}
              FRIEND_PRESENCE.states.set(peerId,applied.state);
              return !!core.projectHateHumanWaitSourceEligibility(applied.state).eligible
            }catch(e){FR.lastReject='hate_presence_core_unavailable';return false}
          }
          """
          if html.count(anchor) != 1:
              raise SystemExit(f'normCode anchor count must be 1, got {html.count(anchor)}')
          html = html.replace(anchor, helper + anchor, 1)

          old = "async function handleHostMessage(m){const cid=String(m.clientId||'');if(m.type==='join'){"
          new = "async function handleHostMessage(m){const cid=String(m.clientId||'');if(m.type===FRIEND_TRANSPORT_PRESENCE_TYPE){if(FR.transport!=='ws_relay_recipient_r21'||normCode(m.code)!==FR.code)return;const s=slotByClient(cid),connected=await friendApplyTransportPresence(m);if(s)s.connected=connected;friendSyncHateClocks(performance.now());if(FR.roomState==='lobby')sendAllLobby();else if(state.match)broadcastSnapshots();return}if(m.type==='join'){"
          if html.count(old) != 1:
              raise SystemExit(f'host handler anchor count must be 1, got {html.count(old)}')
          html = html.replace(old, new, 1)

          old = "if(a.newMember)resetReady();a.s.connected=true;a.s.ready=false;send({type:'accept'"
          new = "if(a.newMember)resetReady();a.s.connected=friendPresenceEligible(cid);a.s.ready=false;send({type:'accept'"
          if html.count(old) != 1:
              raise SystemExit(f'join anchor count must be 1, got {html.count(old)}')
          html = html.replace(old, new, 1)

          old = "if(m.type==='sync'){s.connected=true;if(FR.roomState==='lobby')sendAllLobby();else broadcastSnapshots();return}"
          new = "if(m.type==='sync'){s.connected=friendPresenceEligible(cid);if(FR.roomState==='lobby')sendAllLobby();else broadcastSnapshots();return}"
          if html.count(old) != 1:
              raise SystemExit(f'sync anchor count must be 1, got {html.count(old)}')
          html = html.replace(old, new, 1)

          old = "if(m.type==='leave'){s.connected=false;s.ready=false;delete FR.planValues[s.pid];"
          new = "if(m.type==='leave'){s.connected=false;FRIEND_PRESENCE.states.delete(cid);s.ready=false;delete FR.planValues[s.pid];"
          if html.count(old) != 1:
              raise SystemExit(f'leave anchor count must be 1, got {html.count(old)}')
          html = html.replace(old, new, 1)

          old = "function reset(sendLeave=true){closeChannel(sendLeave);Object.assign(FR,{"
          new = "function reset(sendLeave=true){closeChannel(sendLeave);FRIEND_PRESENCE.states.clear();Object.assign(FR,{"
          if html.count(old) != 1:
              raise SystemExit(f'reset anchor count must be 1, got {html.count(old)}')
          html = html.replace(old, new, 1)

          path.write_text(html)
          PY

          node --check deploy/cloudflare/relay/src/relay-core.mjs
          node --check deploy/cloudflare/relay/src/relay-worker.mjs
          node --check deploy/cloudflare/scripts/build.mjs
          node --check browser/hate-peer-presence-core.mjs
          node --test tests/hate-peer-presence-core.test.mjs
          node --test deploy/cloudflare/tests/relay-core.test.mjs deploy/cloudflare/tests/build.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check

      - name: Verify product-only final tree and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hate-r5-html-mount-executor.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only origin/main | sort)
          expected=(
            "browser/GAMEROAD.html"
            "deploy/cloudflare/relay/src/relay-core.mjs"
            "deploy/cloudflare/relay/src/relay-worker.mjs"
            "deploy/cloudflare/scripts/build.mjs"
            "deploy/cloudflare/tests/build.test.mjs"
            "deploy/cloudflare/tests/relay-core.test.mjs"
            "tests/browser-static-check.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' "${changed[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test "$(grep -F -o "friendApplyTransportPresence(m)" browser/GAMEROAD.html | wc -l)" -ge 1
          test "$(grep -F -o "a.s.connected=friendPresenceEligible(cid)" browser/GAMEROAD.html | wc -l)" -eq 1
          test "$(grep -F -o "if(m.type==='sync'){s.connected=friendPresenceEligible(cid)" browser/GAMEROAD.html | wc -l)" -eq 1
          test "$(grep -F -o "FRIEND_PRESENCE.states.delete(cid)" browser/GAMEROAD.html | wc -l)" -eq 1
          git config user.name "rathersitooo-ux"
          git config user.email "rathersitooo@gmail.com"
          git commit -m "HATE R5: mount authoritative peer presence in production transport"
          git push origin HEAD:work/HATE_TIMER-01-R5-PRODMOUNT-20260817
