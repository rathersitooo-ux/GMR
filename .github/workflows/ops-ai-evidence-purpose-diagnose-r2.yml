name: OPS AI Evidence Purpose Diagnose R2
on:
  push:
    branches:
      - work/ops-ai-evidence-purpose-binding-r2-20260829
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair protocol-test packet budget in applicator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ops-ai-evidence-purpose-binding-r2.yml')
          text = p.read_text()
          marker = "          PY\n\n          cat >> tests/jit-evidence-compiler.test.mjs <<'EOF'"
          assert text.count(marker) == 1
          addition = '''          replace_once('tests/sol-reasoning-protocol.test.mjs',\n          "  const packed = packReasoningPacket(source, evidenceContext());",\n          "  const packed = packReasoningPacket(source, evidenceContext(), { maxWireBytes: 5000 });")\n'''
          p.write_text(text.replace(marker, addition + marker, 1))
          PY
          git config user.name 'gameroad-evidence-bot'
          git config user.email 'gameroad-evidence-bot@users.noreply.github.com'
          git add .github/workflows/ops-ai-evidence-purpose-binding-r2.yml
          git commit -m 'fix: keep protocol fixture evidence inside test packet'
          git push origin HEAD:work/ops-ai-evidence-purpose-binding-r2-20260829
