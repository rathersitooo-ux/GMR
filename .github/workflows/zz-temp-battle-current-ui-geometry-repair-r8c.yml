name: TEMP Battle Current UI Geometry Repair R8C

on:
  push:
    branches:
      - sol/battle-current-ui-geometry-repair-r8c-20260913

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/battle-current-player-ui-runtime.mjs)" = "c74c707942f1bc075a85a18b7b7825913d6bee90"
          test -f data/preaction-authorizations/BATTLE-CURRENT-UI-R8C-20260913T1448-SOL-GEOMETRY-R8C.json
      - name: Apply bounded landscape bottom inset repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/battle-current-player-ui-runtime.mjs')
          s = p.read_text()
          anchor = '@media(max-height:430px) and (orientation:landscape){'
          insert = '@media(orientation:landscape){\n  .screen.battle[${ROOT_ATTR}="1"] .battleInfo{bottom:calc(var(--gr-ui-edge) + 22px)!important}\n}\n' + anchor
          if s.count(anchor) != 1:
              raise SystemExit(f'anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor, insert, 1))
          PY
          git diff --check
          git diff -- browser/battle-current-player-ui-runtime.mjs
      - name: Run focused current UI tests
        run: |
          set -euo pipefail
          node --test tests/battle-current-player-ui-runtime.test.mjs
          node --test tests/battle-current-player-ui-live-adapter.test.mjs
          node --test tests/battle-replay-live-adapter.test.mjs
      - name: Commit bounded product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/battle-current-player-ui-runtime.mjs
          git commit -m 'Battle UI: keep landscape plan controls inside Battle root R8C'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Clean transient workflow and PRE_ACTION
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm -f .github/workflows/zz-temp-battle-current-ui-geometry-repair-r8c.yml data/preaction-authorizations/BATTLE-CURRENT-UI-R8C-20260913T1448-SOL-GEOMETRY-R8C.json
          git commit -m 'Battle UI geometry R8C cleanup'
          git push origin HEAD:${GITHUB_REF_NAME}