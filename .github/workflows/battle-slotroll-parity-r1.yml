name: Battle Slot Roll Parity R1 Patch

on:
  push:
    branches:
      - sol/battle-slotroll-parity-r1-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-slotroll-parity-r1-20260905
          fetch-depth: 0
      - name: Apply marker-guarded Battle Slot Roll parity patch
        shell: bash
        env:
          PATCH_SCRIPT_B64: ""
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --check
          rm .github/workflows/battle-slotroll-parity-r1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs .github/workflows/battle-slotroll-parity-r1.yml
          git commit -m 'Battle: reuse shared Slot Roll gesture core'
          git push origin HEAD:sol/battle-slotroll-parity-r1-20260905
