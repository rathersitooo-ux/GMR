name: Temp Lobby Deck Residual R16 Cleanup

on:
  push:
    branches:
      - chatgpt/lobby-deck-residual-r16-20261005
    paths:
      - '.github/workflows/temp-lobby-deck-residual-r16.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout owned branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/lobby-deck-residual-r16-20261005
          fetch-depth: 0

      - name: Remove transient R16 files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/temp-lobby-deck-residual-r16.mjs
          rm -f data/preaction-authorizations/LOBBY-DECK-RESIDUAL-R16-20261005T1023-SOL.json
          rm -f .github/workflows/temp-lobby-deck-residual-r16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Remove transient R16 executor files"
          git push origin HEAD:chatgpt/lobby-deck-residual-r16-20261005
