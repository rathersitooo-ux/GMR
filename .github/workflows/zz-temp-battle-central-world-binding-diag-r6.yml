name: TEMP Battle central world binding diagnostic R6

on:
  push:
    branches:
      - sol/battle-central-world-binding-diag-r6-20260914

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-central-world-binding-diag-r6-20260914
          fetch-depth: 1
      - name: Extract exact current board identity and binding seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('browser/GAMEROAD.html')
          text=p.read_text()
          lines=text.splitlines()
          print('HTML_BYTES', p.stat().st_size)
          print('=== EXACT_IDENTIFIER_MATCHES ===')
          needles=[
            'function makePlayer', 'function getActiveNodes', 'function nodeXY',
            'function neighbors', 'function renderBoard', 'function updateBattleAvatar',
            'roadKey', 'shieldKey', 'roadNodeXY', 'shieldAnchor',
            'GOAL_REACHED', 'goalReached', 'goal:', 'ROAD_COMPLETED',
            'p.lanes', 'lanes[', 'projection[', 'state.match.projection',
            "position:'C:0:0'", 'position:"C:0:0"'
          ]
          for needle in needles:
            hits=[i for i,l in enumerate(lines) if needle in l]
            print(f'\n### NEEDLE {needle!r} COUNT {len(hits)}')
            for i in hits[:12]:
              lo=max(0,i-2); hi=min(len(lines),i+3)
              print(f'--- lines {lo+1}-{hi} ---')
              for j in range(lo,hi): print(f'{j+1}: {lines[j]}')

          print('\n=== POSITION_LITERAL_SCAN ===')
          pats=[r"['\"]([RSCGK]:[^'\"`<>{}\s,;)]{1,40})['\"]", r"`([RSCGK]:[^`]{1,60})`"]
          seen=set()
          for pat in pats:
            for m in re.finditer(pat,text):
              v=m.group(1)
              if v not in seen:
                seen.add(v); print(v)
          print('POSITION_LITERAL_UNIQUE',len(seen))

          print('\n=== PLAYER_ROAD_CONTEXT ===')
          for rx in [
            r'.{0,180}(?:road|Road).{0,180}(?:player|participant|P1|P2|P3|P4).{0,180}',
            r'.{0,180}(?:player|participant|P1|P2|P3|P4).{0,180}(?:road|Road).{0,180}',
          ]:
            out=[]
            for m in re.finditer(rx,text,re.S):
              s=' '.join(m.group(0).split())
              if s not in out: out.append(s)
            for s in out[:30]: print(s[:900])

          print('\n=== GOAL_CONTEXT ===')
          for m in list(re.finditer(r'.{0,260}(?:GOAL_REACHED|GOAL|goal).{0,320}',text,re.S))[:40]:
            print(' '.join(m.group(0).split())[:1200])

          print('\n=== LANE_MUTATION_CONTEXT ===')
          for m in list(re.finditer(r'.{0,220}(?:lanes\.|lanes\[|\.lanes).{0,360}',text,re.S))[:40]:
            print(' '.join(m.group(0).split())[:1200])
          PY
