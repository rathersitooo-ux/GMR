name: TEMP Road Move R23 Diagnostic

on:
  push:
    branches: [sol/road-move-bidirectional-r23-20260909]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-bidirectional-r23-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bounded candidate from accepted Road donors
        shell: bash
        run: |
          set -euo pipefail
          BASE=a59332356dbe5f70e3afaf350bfae8fdcbb3ea6d
          test "$(git rev-parse "$BASE":browser/GAMEROAD.html)" = d7ae9d0532df7e66ebbf29f1e7eecb3f352d346d
          git fetch origin sol/road-move-bidirectional-live-r5-20260906:refs/remotes/origin/r5 sol/road-move-bidirectional-live-r6-20260906:refs/remotes/origin/r6
          git show refs/remotes/origin/r5:tools/zz-temp-road-move-runtime-r5.py > /tmp/r23.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r23.py');s=p.read_text()
          for a,b in [("BASE = '0be3a466b55cbd0af23244bc9fc90b2f5f6640fd'","BASE = 'a59332356dbe5f70e3afaf350bfae8fdcbb3ea6d'"),("EXPECTED_HTML_BLOB = '35f9203e2be95ba07b44c875e26bfe2047a3cee5'","EXPECTED_HTML_BLOB = 'd7ae9d0532df7e66ebbf29f1e7eecb3f352d346d'"),('ROAD-MOVE-RUNTIME-R5-20260906T2113-SOL-P8N4V6','ROAD-MOVE-RUNTIME-R23-20260909T0542-SOL-Q7N4V3'),('.github/workflows/zz-temp-road-move-runtime-r5.yml','.github/workflows/zz-temp-road-move-r23-diagnostic.yml'),("    'tools/zz-temp-road-move-runtime-r5.py',\n",''),('road-move-bidirectional-live-r5.spec.mjs','road-move-bidirectional-live-r23.spec.mjs'),('ROAD-MOVE-BIDIRECTIONAL-R5','ROAD-MOVE-BIDIRECTIONAL-R23'),('R5 source contract','R23 source contract'),('R5_PATCH_READY','R23_PATCH_READY')]:
            if a not in s: raise SystemExit('missing donor anchor '+a)
            s=s.replace(a,b)
          p.write_text(s)
          PY
          python3 /tmp/r23.py
          git show refs/remotes/origin/r6:tools/zz-temp-road-move-runtime-r6.py > /tmp/r23-post.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r23-post.py');s=p.read_text();s=s.replace('tests/road-move-bidirectional-live-r6.spec.mjs','tests/road-move-bidirectional-live-r23.spec.mjs').replace('R6_POSTPATCH_READY','R23_POSTPATCH_READY');p.write_text(s)
          PY
          python3 /tmp/r23-post.py
      - name: Apply contextual wrapper and remove stale test selector assumption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html');s=p.read_text()
          old="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0];if(!me?.plan?.roadId){ctxSet('PLAN_CARD_MISSING',{message:'先にロードカードを選ぶと移動範囲を決められます。'});return}const path=shortest(me.position,id,normalMoveLimitForRoad(me.plan.roadId),me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          new="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0],moveLimit=draftMoveLimitForPlayer(me);if(moveLimit<1){ctxSet('PLAN_CARD_MISSING',{message:'移動に使えるロードカードがありません。'});return}const path=shortest(me.position,id,moveLimit,me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          if s.count(old)!=1:raise SystemExit('wrapper mismatch')
          # R16 already reproduced this exact short-landscape occlusion on the unchanged HTML blob.
          col='grid-template-columns:142px minmax(0,1fr)'
          if s.count(col)!=1:raise SystemExit('short landscape anchor mismatch')
          p.write_text(s.replace(old,new,1).replace(col,'grid-template-columns:146px minmax(0,1fr)',1))
          t=Path('tests/road-move-bidirectional-live-r23.spec.mjs');x=t.read_text()
          x=x.replace('  expect(html).toContain("removeHand(p,p.plan.battleId)");','  expect(html).toContain("let battle=p.plan.battleId;");\n  expect(html).toContain("removeHand(p,battle)");')
          anchor="async function snapshot(page){return page.evaluate(()=>window.__GAMEROAD_DIRECT_CARD_TEST__.snapshot())}\n"
          helper='''async function snapshot(page){return page.evaluate(()=>window.__GAMEROAD_DIRECT_CARD_TEST__.snapshot())}\nasync function physicalTapReachable(page){const point=await page.evaluate(()=>{for(const node of document.querySelectorAll('#board .node.reachable')){const r=node.getBoundingClientRect();if(!(r.width>0&&r.height>0))continue;const x=r.left+r.width/2,y=r.top+r.height/2,hit=document.elementFromPoint(x,y);if(hit&&(hit===node||node.contains(hit)))return{x,y}}return null});if(!point)throw new Error('ROAD_REACHABLE_POINTER_BLOCKED');await page.mouse.click(point.x,point.y)}\nasync function physicalTapCard(page,id){const point=await page.evaluate(id=>{const node=document.querySelector(`#hand .handCard[data-card-id="${CSS.escape(id)}"]`);if(!node)return null;const r=node.getBoundingClientRect();for(const [fx,fy] of [[.5,.18],[.3,.18],[.7,.18],[.5,.35],[.3,.35],[.7,.35]]){const x=r.left+r.width*fx,y=r.top+r.height*fy,hit=document.elementFromPoint(x,y);if(hit&&(hit===node||node.contains(hit)))return{x,y}}return null},id);if(!point)throw new Error('ROAD_CARD_POINTER_BLOCKED');await page.mouse.click(point.x,point.y)}\n'''
          if anchor not in x:raise SystemExit('snapshot anchor missing')
          x=x.replace(anchor,helper,1)
          compact="const next=battle.locator('.node.reachable[data-move-distance=\\\"1\\\"]').first();await expect(next).toBeEnabled();await next.click();"
          x=x.replace(compact,'await physicalTapReachable(page);')
          x=x.replace("  const next=battle.locator('.node.reachable[data-move-distance=\\\"1\\\"]').first();\n  await expect(next).toBeEnabled();\n  await next.click();",'  await physicalTapReachable(page);')
          x=x.replace('await card.click();','await physicalTapCard(page,id);',1)
          x=x.replace('await candidate.click();',"await physicalTapCard(page,await candidate.getAttribute('data-card-id'));",1)
          x=x.replace('await battle.locator(`#hand .handCard[data-card-id="${a}"]`).click();','await physicalTapCard(page,a);').replace('await battle.locator(`#hand .handCard[data-card-id="${b}"]`).click();','await physicalTapCard(page,b);')
          t.write_text(x)
          PY
          git diff --check
          node --test tests/road-move-compatibility-core.test.mjs
      - name: Install and run physical-input matrix
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
          cat > .r23.config.mjs <<'EOF'
          import {defineConfig} from '@playwright/test';const c={baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,trace:'off',screenshot:'off',video:'off'};export default defineConfig({testDir:'./tests',testMatch:'road-move-bidirectional-live-r23.spec.mjs',timeout:60000,expect:{timeout:10000},workers:1,retries:0,reporter:[['line']],projects:[{name:'desktop',use:{...c,viewport:{width:1280,height:720}}},{name:'portrait',use:{...c,viewport:{width:390,height:844}}},{name:'landscape',use:{...c,viewport:{width:844,height:390}}},{name:'reduced',use:{...c,viewport:{width:844,height:390},reducedMotion:'reduce'}}],webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}})
          EOF
          npx playwright test --config=.r23.config.mjs --grep-invert 'Elastic Focus' --workers=1
          rm -f .r23.config.mjs
          node --test tests/road-move-compatibility-core.test.mjs
          git diff --check
      - name: Package exact bounded patch evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff a59332356dbe5f70e3afaf350bfae8fdcbb3ea6d -- browser/GAMEROAD.html tests/road-move-bidirectional-live-r23.spec.mjs > /tmp/road-r23.patch
          test -s /tmp/road-r23.patch
          cp /tmp/road-r23.patch road-r23.patch
      - uses: actions/upload-artifact@v4
        with:
          name: road-r23-bounded-patch
          path: road-r23.patch
          if-no-files-found: error
