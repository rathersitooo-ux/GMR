name: Cards Favorite Hit Access R4

on:
  push:
    branches:
      - sol/cards-favorite-hitaccess-r4-20260906

permissions:
  contents: write

env:
  BASE_SHA: 5a94373bdb5c1a754c79dbf729d9a4a629af576e
  ACQUIRE_KEY: CARDS-FAVORITE-HITACCESS-R4-20260906T0306-SOL-J7N4K2
  MANIFEST: data/preaction-authorizations/CARDS-FAVORITE-HITACCESS-R4-20260906T0306-SOL-J7N4K2.json
  WORKFLOW_FILE: .github/workflows/cards-favorite-hitaccess-r4-executor.yml

jobs:
  phone-geometry-probe:
    if: ${{ !contains(github.event.head_commit.message, '[r4-diag-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/cards-favorite-hitaccess-r4-20260906
          fetch-depth: 0

      - name: Verify PRE_ACTION fence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 'gameroad-preaction-v3',
              'recordId': os.environ['ACQUIRE_KEY'],
              'taskId': 'BROWSER-PLAYGLOBAL-VISUAL-SHELL-REVIEW-001',
              'workUnitKey': 'CARDS-FAVORITE-HITACCESS-LIVE-R4',
              'authorizationBaseSha': os.environ['BASE_SHA'],
              'leaseAuthority': 'CURRENT_ACTIVE_LEASES',
              'leaseState': 'ACTIVE',
          }
          for key, value in expected.items():
              if m.get(key) != value:
                  raise SystemExit(f'PRE_ACTION mismatch {key}: {m.get(key)!r} != {value!r}')
          token = str(m.get('proceedToken', ''))
          if not token.startswith(f"PROCEED|{os.environ['ACQUIRE_KEY']}|"):
              raise SystemExit('PRE_ACTION proceed token mismatch')
          PY
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          mapfile -t expected < <(printf '%s\n' "$MANIFEST" "$WORKFLOW_FILE" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"

      - name: Patch candidate and write temporary phone probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          product = Path('browser/cards-deck-presentation.mjs')
          text = product.read_text(encoding='utf-8')
          old = '[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}[data-role="cards-deck-findability"] input{min-height:44px;min-width:min(240px,58vw);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,18,30,.72);color:inherit;font:inherit}[data-role="cards-deck-findability"] button{min-height:44px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:700 13px/1 system-ui}'
          new = '[data-role="cards-deck-findability"]{position:relative;z-index:2;pointer-events:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}#collectionGrid{position:relative;z-index:1;isolation:isolate}[data-role="cards-deck-findability"] input{pointer-events:auto;min-height:44px;min-width:min(240px,58vw);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,18,30,.72);color:inherit;font:inherit}[data-role="cards-deck-findability"] button{pointer-events:auto;min-height:44px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:700 13px/1 system-ui}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one findability style seam, found {text.count(old)}')
          product.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('tests/r4-phone-hit-geometry.spec.mjs').write_text(r'''import { test, expect } from '@playwright/test';

test('R4 phone hit geometry probe', async ({ page }) => {
  await page.setViewportSize({ width: 390, height: 844 });
  const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'load' });
  expect(response?.ok()).toBeTruthy();
  await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA));
  await page.evaluate(() => localStorage.removeItem('gameroad.cards.favorite.v1'));
  await page.reload({ waitUntil: 'load' });
  await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA));
  const go = page.locator('.homePadChoice[data-home-target="cards"]:visible').first();
  await expect(go).toBeVisible();
  await go.click();
  await page.waitForFunction(() => (
    globalThis.GAMEROAD_NAV_QA?.snapshot?.().screen === 'cards'
    && globalThis.GAMEROAD_SCREEN_TRANSITION?.getState?.().phase === 'IDLE'
  ));
  const card = page.locator('#collectionGrid button.slot.live.cardFace:visible').first();
  await expect(card).toBeVisible();
  await card.scrollIntoViewIfNeeded();
  const geometry = await card.evaluate((node) => {
    const describe = (el) => {
      if (!el) return null;
      const r = el.getBoundingClientRect();
      const s = getComputedStyle(el);
      return {
        tag: el.tagName,
        id: el.id || null,
        className: typeof el.className === 'string' ? el.className : null,
        role: el.getAttribute('data-role'),
        filter: el.getAttribute('data-filter'),
        dataId: el.getAttribute('data-id'),
        rect: { left:r.left, top:r.top, right:r.right, bottom:r.bottom, width:r.width, height:r.height },
        style: { position:s.position, zIndex:s.zIndex, pointerEvents:s.pointerEvents, transform:s.transform, overflow:s.overflow },
      };
    };
    const r = node.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height / 2;
    const host = document.querySelector('[data-role="cards-deck-findability"]');
    const filter = document.querySelector('[data-role="cards-deck-findability"] [data-filter="favorite"]');
    const grid = document.querySelector('#collectionGrid');
    const screen = document.querySelector('section[data-screen="cards"]');
    const stack = document.elementsFromPoint(x, y).slice(0, 10).map(describe);
    const fr = filter?.getBoundingClientRect?.();
    const fx = fr ? fr.left + fr.width / 2 : 0;
    const fy = fr ? fr.top + fr.height / 2 : 0;
    return {
      point: { x, y },
      card: describe(node),
      stack,
      host: describe(host),
      filter: describe(filter),
      filterStack: fr ? document.elementsFromPoint(fx, fy).slice(0, 10).map(describe) : [],
      grid: describe(grid),
      screen: describe(screen),
      scroll: { x: window.scrollX, y: window.scrollY },
      viewport: { width: innerWidth, height: innerHeight },
    };
  });
  console.log('R4_GEOMETRY=' + JSON.stringify(geometry));
});
''', encoding='utf-8')
          PY
          git diff --check

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run phone probe and persist geometry
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/r4-phone-hit-geometry.spec.mjs --config=playwright.config.mjs --workers=1 2>&1 | tee /tmp/r4-geometry.log
          git reset --hard HEAD
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          log = Path('/tmp/r4-geometry.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'R4_GEOMETRY=(\{.*\})', log)
          if not match:
              raise SystemExit('R4 geometry marker missing')
          geometry = json.loads(match.group(1))
          manifest = Path(os.environ['MANIFEST'])
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['diagnosticGeometryCaptured'] = True
          data['diagnosticGeometryCapturedAtJst'] = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST')
          data['diagnosticGeometryRunId'] = os.environ.get('GITHUB_RUN_ID', '')
          data['diagnosticGeometry'] = geometry
          data['leaseSnapshotReadbackAtJst'] = '2026-09-06 04:24 JST'
          data['leaseUntilJst'] = '2026-09-06 05:30 JST'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m '[r4-diag-result] capture phone hit geometry'
          git push origin HEAD:sol/cards-favorite-hitaccess-r4-20260906
