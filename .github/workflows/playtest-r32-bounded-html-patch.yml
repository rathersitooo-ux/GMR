name: Playtest R32 fresh four-player Result evidence

on:
  push:
    branches:
      - work/playtest-r32-result-ranking-fix
    paths:
      - .github/workflows/playtest-r32-bounded-html-patch.yml

permissions:
  contents: write

jobs:
  fresh-four-player-honey-result:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/playtest-r32-result-ranking-fix
          fetch-depth: 0
      - name: Verify current source identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "a92cb7822069624e9557c719afbc6573e9285cf2"
          test "$(git hash-object browser/GAMEROAD.html)" = "4a3dfbb9fee26089fd790a69791fc7b3326e5917"
          grep -Fq 'grid-template-rows:auto auto auto minmax(0,1fr);gap:10px;overflow:hidden' browser/GAMEROAD.html
          grep -Fq '#resultRanking{min-height:0;overflow:auto}' browser/GAMEROAD.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Add ephemeral reachability assertion to existing R19 visible loop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-full-interaction.spec.mjs')
          s=p.read_text()
          old="""  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';\n  expect(roundsText).toMatch(/\\d+ラウンド/);\n  await attachStateScreenshot(page, testInfo, 'r19-honey-four-player-result-visible');\n"""
          new="""  await expect(result.locator('#resultRanking .rankLine')).toHaveCount(4);\n  const ranking = result.locator('#resultRanking');\n  const rankRows = ranking.locator('.rankLine');\n  const rankingBox = await ranking.boundingBox();\n  expect(rankingBox, 'Result ranking has a rendered viewport').not.toBeNull();\n  expect(rankingBox.height, 'Result ranking viewport has positive height').toBeGreaterThan(0);\n  await ranking.evaluate((node) => { node.scrollTop = 0; });\n  await attachStateScreenshot(page, testInfo, 'r32-honey-four-player-result-ranking-top');\n  const reachability = [];\n  for (let i = 0; i < 4; i += 1) {\n    const row = rankRows.nth(i);\n    await row.scrollIntoViewIfNeeded();\n    await expect(row, `ranking row ${i + 1} becomes user-reachable inside the Result scroller`).toBeVisible();\n    reachability.push(await page.evaluate((index) => {\n      const host = document.querySelector('#resultRanking');\n      const row = host?.querySelectorAll('.rankLine')?.[index];\n      if (!host || !row) return { ok: false };\n      const h = host.getBoundingClientRect(), r = row.getBoundingClientRect();\n      return {\n        ok: r.bottom > h.top && r.top < h.bottom && r.bottom > 0 && r.top < innerHeight,\n        row: { top: r.top, bottom: r.bottom },\n        host: { top: h.top, bottom: h.bottom, clientHeight: host.clientHeight, scrollHeight: host.scrollHeight, scrollTop: host.scrollTop },\n      };\n    }, i));\n    expect(reachability.at(-1).ok, `ranking row ${i + 1} intersects the usable Result ranking viewport after visible scrolling`).toBeTruthy();\n  }\n  await attachStateScreenshot(page, testInfo, 'r32-honey-four-player-result-ranking-bottom');\n  testInfo.annotations.push({ type: 'r32-result-ranking-reachability', description: JSON.stringify(reachability) });\n  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';\n  expect(roundsText).toMatch(/\\d+ラウンド/);\n  await attachStateScreenshot(page, testInfo, 'r19-honey-four-player-result-visible');\n"""
          if s.count(old) != 1:
              raise SystemExit(f'R19 assertion anchor count={s.count(old)}, expected 1')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run the same visible four-player Honey Hunt loop in all current visual projects
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1 --grep "R19 reaches Result from visible four-player Honey Hunt and returns Home" --project=desktop-1280x720 --project=phone-390x844 --project=short-landscape-667x375
      - name: Upload fresh Result evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playtest-r32-result-${{ github.run_id }}
          path: |
            playwright-report-full-interaction/
            test-results/full-interaction/
          if-no-files-found: error
          retention-days: 14
      - name: Record success as an empty branch commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- tests/browser-full-interaction.spec.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit --allow-empty -m "PLAYTEST R32 EVIDENCE PASS run=${GITHUB_RUN_ID} 4P-Honey-Result-reachable-3viewports"
          git push origin HEAD:work/playtest-r32-result-ranking-fix
