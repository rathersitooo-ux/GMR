name: TEMP BFI Boot R42 exact patch

on:
  push:
    branches:
      - fix/bfi-boot-readiness-r39
    paths:
      - .github/workflows/zz-temp-bfi-boot-r42.yml

permissions:
  contents: write

concurrency:
  group: temp-bfi-boot-r42
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/bfi-boot-readiness-r39

      - name: Apply bounded exact-anchor repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          html = html_path.read_text(encoding='utf-8')

          old_runtime = '''function currentScreenTransitionRuntime(){const runtime=globalThis.GAMEROAD_SCREEN_TRANSITION;if(!runtime||typeof runtime.navigate!=="function"||typeof runtime.back!=="function")throw new Error("GAMEROAD screen transition runtime is not ready");return runtime}'''
          new_runtime = '''async function currentScreenTransitionRuntime(timeoutMs=5000){const startedAt=performance.now();for(;;){const runtime=globalThis.GAMEROAD_SCREEN_TRANSITION;if(runtime&&typeof runtime.navigate==="function"&&typeof runtime.back==="function")return runtime;if(performance.now()-startedAt>=timeoutMs)throw new Error("GAMEROAD screen transition runtime is not ready");await new Promise(resolve=>setTimeout(resolve,16))}}'''

          old_nav = '''function navigateDetail(target){return currentScreenTransitionRuntime().navigate(target,{reason:'detail'})}\nfunction navigateRoot(target){return currentScreenTransitionRuntime().navigate(target,{reason:'root'})}\nfunction navigateBack(){const entry=gameroadNav.stack[gameroadNav.stack.length-1];return currentScreenTransitionRuntime().back(entry,{reason:'back'})}'''
          new_nav = '''async function navigateDetail(target){const runtime=await currentScreenTransitionRuntime();return runtime.navigate(target,{reason:'detail'})}\nasync function navigateRoot(target){const runtime=await currentScreenTransitionRuntime();return runtime.navigate(target,{reason:'root'})}\nasync function navigateBack(){const runtime=await currentScreenTransitionRuntime();const entry=gameroadNav.stack[gameroadNav.stack.length-1];return runtime.back(entry,{reason:'back'})}'''

          for label, old, new in (
              ('screen-transition runtime accessor', old_runtime, new_runtime),
              ('navigation consumers', old_nav, new_nav),
          ):
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, expected=1')
              html = html.replace(old, new, 1)

          html_path.write_text(html, encoding='utf-8')

          spec_path = Path('tests/browser-full-interaction.spec.mjs')
          spec = spec_path.read_text(encoding='utf-8')
          old_probe = '''    const roadSelect = battle.locator('#roadSelect:visible');\n    if ((await roadSelect.count()) > 0 && (await roadSelect.isEnabled())) {\n      await submitVisiblePlan(battle);'''
          new_probe = '''    const planReady = await battle.evaluate((root) => {\n      const roadSelect = root.querySelector('#roadSelect');\n      if (!roadSelect || roadSelect.disabled || roadSelect.getClientRects().length === 0) return false;\n      const style = getComputedStyle(roadSelect);\n      return style.visibility !== 'hidden' && style.display !== 'none';\n    });\n    if (planReady) {\n      await submitVisiblePlan(battle);'''
          count = spec.count(old_probe)
          if count != 2:
              raise SystemExit(f'BFI roadSelect probe anchor count={count}, expected=2')
          spec = spec.replace(old_probe, new_probe)
          spec_path.write_text(spec, encoding='utf-8')
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/browser-full-interaction.spec.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual.txt
          printf '%s\n' browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-r42-bounded-executor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git commit -m "Browser: close boot readiness and BFI phase probe R42"
          git push origin "HEAD:fix/bfi-boot-readiness-r39"
