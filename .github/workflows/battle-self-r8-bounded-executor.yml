name: TEMP BATTLESELF R8 bounded executor

on:
  push:
    branches:
      - work/BATTLE-SELF-REMAINING-DECK-INSPECT-001-R8-BROWSER-MOUNT

permissions:
  contents: write

concurrency:
  group: battle-self-r8-browser-mount
  cancel-in-progress: false

jobs:
  patch-test-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current preimages
        shell: bash
        run: |
          set -euo pipefail
          BASE=800cbffd2fd513d488df1d78dc6f72c17a300a0d
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "cb3ba74e38a59b951dc6e38bfcaeea724b188bba"
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "1c9208c001cb2612ab360daf7acce8265323e489"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "a5bf7658a1206b4418711979ca442e9ae6a413cf"
          test "$(git hash-object browser/battle-self-deck-inspect-core.mjs)" = "ae8488df0ef5eb4530c350d2f2ab8fa65a4f0f5e"
          test -s browser/battle-self-deck-inspect-runtime-mount.mjs
          test -s tests/battle-self-deck-inspect-runtime-mount.test.mjs

      - name: Exact-patch production seam and public package
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one preimage, got {count}')
              return text.replace(old, new, 1)

          replay_path = Path('browser/battle-replay-live-adapter.mjs')
          replay = replay_path.read_text()
          if "import './battle-self-deck-inspect-runtime-mount.mjs';" in replay:
              raise SystemExit('replay adapter already contains self-deck runtime mount import')
          replay = "import './battle-self-deck-inspect-runtime-mount.mjs';\n" + replay
          replay_path.write_text(replay)

          build_path = Path('deploy/cloudflare/scripts/build.mjs')
          build = build_path.read_text()
          build = replace_once(build,
              "const defaultReplayAdapterSource = path.join(repoRoot, 'browser/battle-replay-live-adapter.mjs');\nconst defaultPartnerBattleEventProjectionSource",
              "const defaultReplayAdapterSource = path.join(repoRoot, 'browser/battle-replay-live-adapter.mjs');\nconst defaultSelfDeckInspectCoreSource = path.join(repoRoot, 'browser/battle-self-deck-inspect-core.mjs');\nconst defaultSelfDeckInspectRuntimeMountSource = path.join(repoRoot, 'browser/battle-self-deck-inspect-runtime-mount.mjs');\nconst defaultPartnerBattleEventProjectionSource",
              'build defaults')
          build = replace_once(build,
              "  replayAdapterSource = defaultReplayAdapterSource,\n  partnerBattleEventProjectionSource",
              "  replayAdapterSource = defaultReplayAdapterSource,\n  selfDeckInspectCoreSource = defaultSelfDeckInspectCoreSource,\n  selfDeckInspectRuntimeMountSource = defaultSelfDeckInspectRuntimeMountSource,\n  partnerBattleEventProjectionSource",
              'build source args')
          build = replace_once(build,
              "  expectedReplayAdapterBlob = '',\n  expectedPartnerBattleEventProjectionBlob",
              "  expectedReplayAdapterBlob = '',\n  expectedSelfDeckInspectCoreBlob = '',\n  expectedSelfDeckInspectRuntimeMountBlob = '',\n  expectedPartnerBattleEventProjectionBlob",
              'build expected args')
          build = replace_once(build,
              "  const replayAdapterInput = await readFile(replayAdapterSource);\n  const partnerBattleEventProjectionInput",
              "  const replayAdapterInput = await readFile(replayAdapterSource);\n  const selfDeckInspectCoreInput = await readFile(selfDeckInspectCoreSource);\n  const selfDeckInspectRuntimeMountInput = await readFile(selfDeckInspectRuntimeMountSource);\n  const partnerBattleEventProjectionInput",
              'build reads')
          build = replace_once(build,
              "  const replayAdapterBlob = gitBlobSha1(replayAdapterInput);\n  const partnerBattleEventProjectionBlob",
              "  const replayAdapterBlob = gitBlobSha1(replayAdapterInput);\n  const selfDeckInspectCoreBlob = gitBlobSha1(selfDeckInspectCoreInput);\n  const selfDeckInspectRuntimeMountBlob = gitBlobSha1(selfDeckInspectRuntimeMountInput);\n  const partnerBattleEventProjectionBlob",
              'build hashes')
          replay_check = """  if (expectedReplayAdapterBlob && replayAdapterBlob !== expectedReplayAdapterBlob) {\n    throw new Error(`Battle replay live adapter blob mismatch: expected=${expectedReplayAdapterBlob} actual=${replayAdapterBlob}`);\n  }\n"""
          build = replace_once(build, replay_check, replay_check + """  if (expectedSelfDeckInspectCoreBlob && selfDeckInspectCoreBlob !== expectedSelfDeckInspectCoreBlob) {\n    throw new Error(`Battle self-deck inspect core blob mismatch: expected=${expectedSelfDeckInspectCoreBlob} actual=${selfDeckInspectCoreBlob}`);\n  }\n  if (expectedSelfDeckInspectRuntimeMountBlob && selfDeckInspectRuntimeMountBlob !== expectedSelfDeckInspectRuntimeMountBlob) {\n    throw new Error(`Battle self-deck inspect runtime mount blob mismatch: expected=${expectedSelfDeckInspectRuntimeMountBlob} actual=${selfDeckInspectRuntimeMountBlob}`);\n  }\n""", 'build expected checks')
          marker = "  const partnerBattleEventProjectionOutputPath = path.join(dist, 'partner-battle-event-log-projection.mjs');\n"
          copy_block = """  const selfDeckInspectCoreOutputPath = path.join(dist, 'battle-self-deck-inspect-core.mjs');\n  await writeFile(selfDeckInspectCoreOutputPath, selfDeckInspectCoreInput);\n  const selfDeckInspectCoreRoundTrip = await readFile(selfDeckInspectCoreOutputPath);\n  if (!selfDeckInspectCoreInput.equals(selfDeckInspectCoreRoundTrip)) {\n    throw new Error('dist/battle-self-deck-inspect-core.mjs is not byte-identical to Browser dependency source');\n  }\n\n  const selfDeckInspectRuntimeMountOutputPath = path.join(dist, 'battle-self-deck-inspect-runtime-mount.mjs');\n  await writeFile(selfDeckInspectRuntimeMountOutputPath, selfDeckInspectRuntimeMountInput);\n  const selfDeckInspectRuntimeMountRoundTrip = await readFile(selfDeckInspectRuntimeMountOutputPath);\n  if (!selfDeckInspectRuntimeMountInput.equals(selfDeckInspectRuntimeMountRoundTrip)) {\n    throw new Error('dist/battle-self-deck-inspect-runtime-mount.mjs is not byte-identical to Browser dependency source');\n  }\n\n"""
          build = replace_once(build, marker, copy_block + marker, 'build copies')
          manifest_marker = """      partner_battle_event_log_projection: provenance(\n"""
          manifest_block = """      battle_self_deck_inspect_core: provenance(\n        'browser/battle-self-deck-inspect-core.mjs',\n        'battle-self-deck-inspect-core.mjs',\n        selfDeckInspectCoreInput,\n        selfDeckInspectCoreBlob,\n      ),\n      battle_self_deck_inspect_runtime_mount: provenance(\n        'browser/battle-self-deck-inspect-runtime-mount.mjs',\n        'battle-self-deck-inspect-runtime-mount.mjs',\n        selfDeckInspectRuntimeMountInput,\n        selfDeckInspectRuntimeMountBlob,\n      ),\n"""
          build = replace_once(build, manifest_marker, manifest_block + manifest_marker, 'build manifest')
          build = replace_once(build,
              "    else if (a === '--replay-adapter-source') out.replayAdapterSource = path.resolve(argv[++i]);\n    else if (a === '--partner-battle-event-projection-source')",
              "    else if (a === '--replay-adapter-source') out.replayAdapterSource = path.resolve(argv[++i]);\n    else if (a === '--self-deck-inspect-core-source') out.selfDeckInspectCoreSource = path.resolve(argv[++i]);\n    else if (a === '--self-deck-inspect-runtime-mount-source') out.selfDeckInspectRuntimeMountSource = path.resolve(argv[++i]);\n    else if (a === '--partner-battle-event-projection-source')",
              'build cli source args')
          build = replace_once(build,
              "    else if (a === '--expected-replay-adapter-blob') out.expectedReplayAdapterBlob = argv[++i] || '';\n    else if (a === '--expected-partner-battle-event-projection-blob')",
              "    else if (a === '--expected-replay-adapter-blob') out.expectedReplayAdapterBlob = argv[++i] || '';\n    else if (a === '--expected-self-deck-inspect-core-blob') out.expectedSelfDeckInspectCoreBlob = argv[++i] || '';\n    else if (a === '--expected-self-deck-inspect-runtime-mount-blob') out.expectedSelfDeckInspectRuntimeMountBlob = argv[++i] || '';\n    else if (a === '--expected-partner-battle-event-projection-blob')",
              'build cli expected args')
          build_path.write_text(build)

          replay_blob = subprocess.check_output(['git', 'hash-object', str(replay_path)], text=True).strip()
          core_blob = subprocess.check_output(['git', 'hash-object', 'browser/battle-self-deck-inspect-core.mjs'], text=True).strip()
          mount_blob = subprocess.check_output(['git', 'hash-object', 'browser/battle-self-deck-inspect-runtime-mount.mjs'], text=True).strip()

          test_path = Path('deploy/cloudflare/tests/build.test.mjs')
          text = test_path.read_text()
          pattern = re.compile(r"^  \{ file: 'battle-replay-live-adapter\.mjs'.*?currentBlob: '[0-9a-f]+' \},$", re.M)
          match = pattern.search(text)
          if not match:
              raise SystemExit('build test replay dependency entry not found')
          replay_entry = match.group(0)
          replay_entry = replace_once(replay_entry,
              "fixture: \"import './battle-replay-core.mjs';\\n",
              "fixture: \"import './battle-self-deck-inspect-runtime-mount.mjs';\\nimport './battle-replay-core.mjs';\\n",
              'build test replay fixture')
          replay_entry = re.sub(r"currentBlob: '[0-9a-f]+'", f"currentBlob: '{replay_blob}'", replay_entry, count=1)
          extra = (
              replay_entry + "\n"
              + "  { file: 'battle-self-deck-inspect-core.mjs', source: 'browser/battle-self-deck-inspect-core.mjs', sourceArg: 'selfDeckInspectCoreSource', expectedArg: 'expectedSelfDeckInspectCoreBlob', artifact: 'battle_self_deck_inspect_core', fixture: \"export function createAuthoritativeRemainingDeckSnapshot(){ return {}; }\\nexport function projectRemainingDeckForViewer(){ return {}; }\\n\", currentBlob: '" + core_blob + "' },\n"
              + "  { file: 'battle-self-deck-inspect-runtime-mount.mjs', source: 'browser/battle-self-deck-inspect-runtime-mount.mjs', sourceArg: 'selfDeckInspectRuntimeMountSource', expectedArg: 'expectedSelfDeckInspectRuntimeMountBlob', artifact: 'battle_self_deck_inspect_runtime_mount', fixture: \"import './battle-self-deck-inspect-core.mjs';\\nexport const BATTLE_SELF_DECK_INSPECT_RUNTIME_MOUNT_SCHEMA='fixture';\\n\", currentBlob: '" + mount_blob + "' },"
          )
          text = text[:match.start()] + extra + text[match.end():]
          test_path.write_text(text)

          print('PATCHED', replay_blob, core_blob, mount_blob)
          PY

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/battle-self-deck-inspect-runtime-mount.mjs
          node --test \
            tests/battle-self-deck-inspect-core.test.mjs \
            tests/battle-self-deck-inspect-runtime-mount.test.mjs \
            tests/battle-replay-live-adapter.test.mjs \
            deploy/cloudflare/tests/build.test.mjs
          git diff --check

      - name: Finalize exact product diff and self-delete executor
        shell: bash
        run: |
          set -euo pipefail
          BASE=800cbffd2fd513d488df1d78dc6f72c17a300a0d
          rm .github/workflows/battle-self-r8-bounded-executor.yml
          git diff --check
          actual="$(git diff --name-only "$BASE"...HEAD; git diff --name-only)"
          actual="$(printf '%s\n' "$actual" | sed '/^$/d' | sort -u)"
          expected="$(printf '%s\n' \
            browser/battle-replay-live-adapter.mjs \
            browser/battle-self-deck-inspect-runtime-mount.mjs \
            deploy/cloudflare/scripts/build.mjs \
            deploy/cloudflare/tests/build.test.mjs \
            tests/battle-self-deck-inspect-runtime-mount.test.mjs | sort)"
          test "$actual" = "$expected"
          git config user.name gameroad-battle-self-r8
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "BATTLESELF R8: mount owner remaining deck inspect"
          git push origin HEAD:work/BATTLE-SELF-REMAINING-DECK-INSPECT-001-R8-BROWSER-MOUNT
