name: TEMP BOARD109 R7 test-hook source diagnostic v5

on:
  push:
    branches:
      - work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - name: Verify exact patched product and print only hook-related exact source contexts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "BOARD109_R7_TESTHOOK_SOURCE_DIAG_V5"
          test "$(git rev-parse HEAD^)" = "3e018f4123ea5b61b46cd7b8c68ceee12bb95b65"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "0535bf3a37f9afdab3b0cddbc23e7aa610fcbc15"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          raw=Path('browser/GAMEROAD.html').read_bytes()
          assert len(raw)==11816410
          assert hashlib.sha256(raw).hexdigest()=='cbdc9c679282466a430ad81e7ce391cf4d0f159b971c9946ba910eb322a1d36a'
          text=raw.decode('utf-8-sig')
          for needle in ['window.__GAMEROAD_TEST__','targetLegalIds','projectionIndependent','visibleButtons','boardCount','show:','start:']:
            print('===== '+needle+' =====')
            hits=[m.start() for m in re.finditer(re.escape(needle),text)]
            print('count',len(hits))
            for pos in hits[:8]:
              line=text.count('\n',0,pos)+1
              print('--- line',line,'---')
              print(text[max(0,pos-1800):min(len(text),pos+len(needle)+2800)])
          PY
