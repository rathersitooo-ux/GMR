name: temp battle janken physical card lineage r3
on:
  push:
    branches:
      - sol/battle-janken-physical-card-lineage-r3-20260914
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[lineage-css-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-janken-physical-card-lineage-r3-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep RPS role badge secondary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime_path = Path('browser/battle-janken-focus-runtime-surface.mjs')
          test_path = Path('tests/battle-janken-focus-runtime-surface.test.mjs')
          s = runtime_path.read_text()
          t = test_path.read_text()

          replacements = [
            ('.grJankenRoleBadge{display:block;font-size:18px;font-weight:900;margin-bottom:6px}\n', ''),
            ('.grJankenFocusBloomPanel .grJankenRoleBadge{text-align:center;font-size:20px;letter-spacing:.06em}\n', ''),
            ('.grJankenRoleBadge{font-size:16px}', '.grJankenRoleBadge{font-size:10px}'),
            ('.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:17px}', '.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:10px}'),
            ('.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:15px;margin-bottom:3px}', '.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:9px}'),
            ('.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:15px}', '.grJankenFocusBloomPanel .grJankenRoleBadge{font-size:9px}'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing css anchor: {old}')
            s = s.replace(old, new, 1)

          anchor = """  assert.match(style.textContent, /prefers-reduced-motion:reduce/);
          """
          addition = """  assert.match(style.textContent, /\\.grJankenRoleBadge\\{position:absolute;[^}]*font-size:10px/);
            assert.doesNotMatch(style.textContent, /grJankenRoleBadge\\{display:block;font-size:18px/);
            assert.doesNotMatch(style.textContent, /grJankenFocusBloomPanel \\.grJankenRoleBadge\\{text-align:center;font-size:20px/);
          """
          if t.count(anchor) != 1:
            raise SystemExit(f'test anchor count {t.count(anchor)}')
          t = t.replace(anchor, anchor + addition, 1)

          runtime_path.write_text(s)
          test_path.write_text(t)
          PY
      - name: Focused regression
        run: |
          node --test tests/battle-janken-focus-runtime-surface.test.mjs
          git diff --check
      - name: Commit bounded correction
        shell: bash
        run: |
          test "$(git diff --name-only | sort)" = $'browser/battle-janken-focus-runtime-surface.mjs\ntests/battle-janken-focus-runtime-surface.test.mjs'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/battle-janken-focus-runtime-surface.mjs tests/battle-janken-focus-runtime-surface.test.mjs
          git commit -m 'Battle: keep RPS badge visually secondary [lineage-css-fix]'
          git push origin HEAD:sol/battle-janken-physical-card-lineage-r3-20260914
