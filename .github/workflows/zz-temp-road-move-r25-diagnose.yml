name: TEMP Road Move R25 Diagnose

on:
  push:
    branches:
      - sol/road-move-bidirectional-r24-20260909

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-bidirectional-r24-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact bounded R25 candidate from accepted Road donors
        shell: bash
        run: |
          set -euo pipefail
          BASE=3176d910db54f09ae5b93821e71a05653f3be3a2
          HTML_BLOB=d7ae9d0532df7e66ebbf29f1e7eecb3f352d346d
          test "$(git rev-parse "$BASE":browser/GAMEROAD.html)" = "$HTML_BLOB"
          git fetch origin \
            sol/road-move-bidirectional-live-r5-20260906:refs/remotes/origin/road-r5-donor \
            sol/road-move-bidirectional-live-r6-20260906:refs/remotes/origin/road-r6-donor
          git show refs/remotes/origin/road-r5-donor:tools/zz-temp-road-move-runtime-r5.py > /tmp/road-r25-base.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/road-r25-base.py'); s=p.read_text()
          replacements=[
            ("BASE = '0be3a466b55cbd0af23244bc9fc90b2f5f6640fd'","BASE = '3176d910db54f09ae5b93821e71a05653f3be3a2'"),
            ("EXPECTED_HTML_BLOB = '35f9203e2be95ba07b44c875e26bfe2047a3cee5'","EXPECTED_HTML_BLOB = 'd7ae9d0532df7e66ebbf29f1e7eecb3f352d346d'"),
            ('ROAD-MOVE-RUNTIME-R5-20260906T2113-SOL-P8N4V6','ROAD-MOVE-RUNTIME-R25-20260909T1424-SOL-V6K3N9'),
            ('.github/workflows/zz-temp-road-move-runtime-r5.yml','.github/workflows/zz-temp-road-move-r25-diagnose.yml'),
            ("    'tools/zz-temp-road-move-runtime-r5.py',\n",''),
            ('road-move-bidirectional-live-r5.spec.mjs','road-move-bidirectional-live-r25.spec.mjs'),
            ('ROAD-MOVE-BIDIRECTIONAL-R5','ROAD-MOVE-BIDIRECTIONAL-R25'),
            ('R5 source contract','R25 source contract'),
            ('R5_PATCH_READY','R25_PATCH_READY'),
          ]
          for old,new in replacements:
            if old not in s: raise SystemExit('R5 donor adaptation anchor missing: '+old)
            s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 /tmp/road-r25-base.py
          git show refs/remotes/origin/road-r6-donor:tools/zz-temp-road-move-runtime-r6.py > /tmp/road-r25-post.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/road-r25-post.py'); s=p.read_text(); old='tests/road-move-bidirectional-live-r6.spec.mjs'
          if old not in s: raise SystemExit('R6 spec anchor missing')
          p.write_text(s.replace(old,'tests/road-move-bidirectional-live-r25.spec.mjs').replace('R6_POSTPATCH_READY','R25_POSTPATCH_READY'))
          PY
          python3 /tmp/road-r25-post.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path('browser/GAMEROAD.html'); s=html.read_text()
          old="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0];if(!me?.plan?.roadId){ctxSet('PLAN_CARD_MISSING',{message:'先にロードカードを選ぶと移動範囲を決められます。'});return}const path=shortest(me.position,id,normalMoveLimitForRoad(me.plan.roadId),me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          new="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0],moveLimit=draftMoveLimitForPlayer(me);if(moveLimit<1){ctxSet('PLAN_CARD_MISSING',{message:'移動に使えるロードカードがありません。'});return}const path=shortest(me.position,id,moveLimit,me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          if s.count(old)!=1: raise SystemExit(f'context endpoint wrapper mismatch: {s.count(old)}')
          html.write_text(s.replace(old,new,1))
          PY
          git diff --check
          node --test tests/road-move-compatibility-core.test.mjs

      - name: Add one bounded diagnostic at 844x390
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/road-move-bidirectional-live-r25.spec.mjs <<'EOF'

          test('R25 diagnose move-first candidate render and physical card tap',async({page})=>{
            const fs=await import('node:fs');
            const battle=await openRoadBattle(page);
            const report={viewport:page.viewportSize(),steps:[]};
            const snap=async label=>{
              const x=await snapshot(page);report.steps.push({label,snapshot:x});return x;
            };
            const cardInfo=async id=>page.evaluate((id)=>{
              const n=[...document.querySelectorAll('#hand .handCard[data-card-id]')].find(e=>e.dataset.cardId===id);if(!n)return{exists:false,id};
              const r=n.getBoundingClientRect(),cs=getComputedStyle(n),samples=[[.5,.12],[.3,.18],[.7,.18],[.5,.3],[.3,.35],[.7,.35],[.5,.55],[.3,.65],[.7,.65],[.5,.82]];
              const hits=samples.map(([fx,fy])=>{const x=r.left+r.width*fx,y=r.top+r.height*fy,h=document.elementFromPoint(x,y);return{fx,fy,x,y,self:!!h&&(h===n||n.contains(h)),tag:h?.tagName||null,id:h?.id||null,cls:h?.className||null,cardId:h?.closest?.('[data-card-id]')?.dataset?.cardId||null,planBox:!!h?.closest?.('.planBox')}});
              return{exists:true,id,dataset:{...n.dataset},className:n.className,disabled:!!n.disabled,ariaDisabled:n.getAttribute('aria-disabled'),rect:{left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom},style:{display:cs.display,visibility:cs.visibility,opacity:cs.opacity,pointerEvents:cs.pointerEvents,zIndex:cs.zIndex,transform:cs.transform},hits};
            },id);
            await snap('initial');
            const nodeResult=await page.evaluate(()=>{
              for(const n of document.querySelectorAll('.node.reachable[data-pos]')){const r=n.getBoundingClientRect();for(const [fx,fy] of [[.5,.5],[.3,.3],[.7,.3],[.3,.7],[.7,.7]]){const x=r.left+r.width*fx,y=r.top+r.height*fy,h=document.elementFromPoint(x,y);if(h&&(h===n||n.contains(h)))return{id:n.dataset.pos,x,y}}}return null;
            });
            report.nodeResult=nodeResult;
            if(nodeResult)await page.mouse.click(nodeResult.x,nodeResult.y);
            await page.waitForTimeout(40);
            const moved=await snap('after-path-physical-tap');
            const candidate=moved.compatibleRoadIds?.[0]||null;report.candidate=candidate;
            if(candidate){
              report.beforeRender=await cardInfo(candidate);
              report.renderHandGlobal=await page.evaluate(()=>typeof globalThis.renderHand==='function');
              if(report.renderHandGlobal)await page.evaluate(()=>globalThis.renderHand());
              await page.waitForTimeout(20);
              report.afterRender=await cardInfo(candidate);
              await snap('after-explicit-renderHand');
              report.syncGlobal=await page.evaluate(()=>typeof globalThis.syncRoadMoveDraftUi==='function');
              if(report.syncGlobal)await page.evaluate(()=>globalThis.syncRoadMoveDraftUi());
              await page.waitForTimeout(10);
              report.afterManualSync=await cardInfo(candidate);
              const hit=report.afterManualSync?.hits?.find(h=>h.self)||null;report.chosenPhysicalHit=hit;
              if(hit)await page.mouse.click(hit.x,hit.y);
              await page.waitForTimeout(40);
              const afterPhysical=await snap('after-candidate-physical-tap');
              report.afterPhysical=await cardInfo(candidate);
              if(afterPhysical.roadId!==candidate){
                report.beforeDomClick=await cardInfo(candidate);
                await page.evaluate((id)=>[...document.querySelectorAll('#hand .handCard[data-card-id]')].find(e=>e.dataset.cardId===id)?.click(),candidate);
                await page.waitForTimeout(30);
                await snap('after-candidate-dom-click-fallback');
              }
            }
            fs.writeFileSync('.road-r25-diagnosis.txt',JSON.stringify(report,null,2));
          });
          EOF
          cat > .road-r25-diagnose.config.mjs <<'EOF'
          import {defineConfig} from '@playwright/test';
          export default defineConfig({testDir:'./tests',testMatch:'road-move-bidirectional-live-r25.spec.mjs',timeout:60000,expect:{timeout:10000},workers:1,retries:0,reporter:[['line']],use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,trace:'off',screenshot:'off',video:'off',viewport:{width:844,height:390}},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}})
          EOF

      - name: Install Chromium and run diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
          npx playwright test --config=.road-r25-diagnose.config.mjs --grep 'R25 diagnose move-first candidate render and physical card tap' --workers=1
          test -s .road-r25-diagnosis.txt

      - name: Persist diagnosis only and remove transient workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .road-r25-diagnosis.txt ]; then printf '%s\n' '{"diagnosis":"workflow_failed_before_browser_report"}' > .road-r25-diagnosis.txt; fi
          git restore browser/GAMEROAD.html || true
          rm -f tests/road-move-bidirectional-live-r25.spec.mjs .road-r25-diagnose.config.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-temp-road-move-r25-diagnose.yml
          git add .road-r25-diagnosis.txt
          git diff --cached --check
          git commit -m 'chore(road): capture R25 physical input diagnosis'
          git push origin HEAD:sol/road-move-bidirectional-r24-20260909
