name: temp-battle-shared-package-r3

on:
  push:
    branches:
      - sol/battle-shared-package-train-r3-20260910

permissions:
  contents: write

jobs:
  package-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-shared-package-train-r3-20260910
      - name: Confirm PRE_ACTION
        run: |
          test -f data/preaction-authorizations/BATTLE-PACKAGE-TRAIN-R3-20260910T0334-SOL-PKG-Q8N4M8.json
          grep -F 'PREACTION_PROCEED_ALLOWED' data/preaction-authorizations/BATTLE-PACKAGE-TRAIN-R3-20260910T0334-SOL-PKG-Q8N4M8.json
          grep -F 'CURRENT_ACTIVE_LEASES!A891:L891' data/preaction-authorizations/BATTLE-PACKAGE-TRAIN-R3-20260910T0334-SOL-PKG-Q8N4M8.json
      - name: Apply bounded recovery package patch
        run: python tools/temp-battle-shared-package-r3.py
      - name: Run recovery and Cloudflare build tests
        run: |
          node --test tests/battle-recovery-runtime-surface.test.mjs tests/battle-recovery-live-adapter.test.mjs deploy/cloudflare/tests/build.test.mjs
      - name: Build public package and verify recovery artifacts
        run: |
          rm -rf /tmp/gameroad-recovery-package-r3
          node deploy/cloudflare/scripts/build.mjs --dist /tmp/gameroad-recovery-package-r3 --source-commit "$GITHUB_SHA" --published-at '2026-09-10T03:36:00+09:00' > /tmp/gameroad-recovery-package-r3.out
          node - <<'NODE'
          const fs=require('node:fs');
          const path='/tmp/gameroad-recovery-package-r3';
          const manifest=JSON.parse(fs.readFileSync(`${path}/manifest.json`,'utf8'));
          const expected={
            battle_2v2_reconnect_core:'battle-2v2-reconnect-core.mjs',
            battle_recovery_presentation_core:'battle-recovery-presentation-core.mjs',
            battle_recovery_runtime_surface:'battle-recovery-runtime-surface.mjs',
            battle_recovery_live_adapter:'battle-recovery-live-adapter.mjs'
          };
          for(const [artifact,file] of Object.entries(expected)){
            if(!manifest.artifacts?.[artifact]) throw new Error(`missing manifest artifact ${artifact}`);
            if(manifest.artifacts[artifact].output!==file) throw new Error(`wrong output for ${artifact}`);
            if(!fs.existsSync(`${path}/${file}`)) throw new Error(`missing dist file ${file}`);
          }
          console.log('Battle recovery public package closure PASS');
          NODE
      - name: Verify bounded product diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = 'deploy/cloudflare/scripts/build.mjs'
          git diff -- deploy/cloudflare/scripts/build.mjs
      - name: Commit product patch
        run: |
          if git diff --quiet -- deploy/cloudflare/scripts/build.mjs; then echo 'No product diff to commit'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m 'Build: package Battle recovery runtime dependencies'
          git push origin HEAD:sol/battle-shared-package-train-r3-20260910
