name: BOARD-FACILITY R21 exact-base executor

on:
  push:
    branches:
      - work/boardfacility-r21-production-mount-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BASE_SHA: a8a6b7b25758650fdbe8c2a783137105c9d7125c
      BRANCH_NAME: work/boardfacility-r21-production-mount-20260818
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Refuse stale base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          echo "expected_base=${EXPECTED_BASE_SHA}"
          echo "actual_main=${actual}"
          test "${actual}" = "${EXPECTED_BASE_SHA}"

      - name: Apply bounded production mount patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/boardfacility-r21-patch.py

      - name: Remove task-scoped executor sources before product commit
        shell: bash
        run: |
          rm .github/workflows/boardfacility-r21-exact-base-executor.yml
          rm .github/boardfacility-r21-patch.py

      - name: Run bounded regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/board-facility-runtime-mount.mjs
          node --test tests/board-facility-state-core.test.mjs tests/board-facility-classic-adapter.test.mjs tests/board-facility-runtime-mount.test.mjs tests/board-facility-production-mount.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff --check

      - name: Commit and push bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A browser/GAMEROAD.html browser/board-facility-runtime-mount.mjs deploy/cloudflare/scripts/build.mjs tests/board-facility-runtime-mount.test.mjs tests/board-facility-production-mount.test.mjs .github/workflows/gameroad-required-gate.yml .github/workflows/boardfacility-r21-exact-base-executor.yml .github/boardfacility-r21-patch.py
          git status --short
          git commit -m "BOARD-FACILITY R21: mount production facility runtime"
          git push origin HEAD:${BRANCH_NAME}
