name: TEMP Battle Hand3 no-legacy-flicker R1
on:
  push:
    branches:
      - sol/battle-hand3-slidepad-current-r1-20260910
permissions:
  contents: write
jobs:
  patch-test-finalize:
    if: github.event.head_commit.message == 'TEMP run Hand3 no-legacy-flicker R1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-hand3-slidepad-current-r1-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded no-legacy-flicker repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          tests = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          src = runtime.read_text(encoding='utf-8')
          tst = tests.read_text(encoding='utf-8')

          old = """    assignment = model.assignment;\n    syncHandZoneProjection(root, model);\n    syncPlayableHandAffordance(root);\n    syncHandCardFocusPresentation();\n    rowRouletteHost.hidden = rouletteEnabled !== true;\n    rowRouletteRuntime?.refresh?.();\n    const currentSourceHandIds = hand.map((card) => card.id);\n"""
          new = """    assignment = model.assignment;\n    const awaitingCurrentHand3 = dedicatedFocus\n      && assignment?.assignmentMode !== NEW_BASE_ROUND_START_JANKEN_ASSIGNMENT_MODE.CURRENT_HAND3_POLICY;\n    if (awaitingCurrentHand3) {\n      clearPlayableHandAffordance(root);\n      rowRouletteHost.hidden = true;\n      rowRouletteRuntime?.refresh?.();\n      for (const jankenHand of SLOT_ORDER) {\n        const node = slotNodes.get(jankenHand);\n        const cardText = node?.querySelector?.('.grJankenSlidePadCard');\n        if (!node) continue;\n        node.disabled = true;\n        node.dataset.cardId = '';\n        node.setAttribute('aria-label', `${SLOT_VIEW[jankenHand].symbol} ${SLOT_VIEW[jankenHand].hand} 読み込み中`);\n        if (cardText) cardText.textContent = '—';\n        node.onclick = null;\n      }\n      openForRound(model.roundId);\n      if (!focusAssignmentSyncPending) {\n        focusAssignmentSyncPending = true;\n        void readDedicatedFocusContext().finally(() => {\n          focusAssignmentSyncPending = false;\n        });\n      }\n      return;\n    }\n    syncHandZoneProjection(root, model);\n    syncPlayableHandAffordance(root);\n    syncHandCardFocusPresentation();\n    rowRouletteHost.hidden = rouletteEnabled !== true;\n    rowRouletteRuntime?.refresh?.();\n    const currentSourceHandIds = hand.map((card) => card.id);\n"""
          if src.count(old) != 1:
              raise SystemExit(f'runtime anchor count={src.count(old)}')
          src = src.replace(old, new, 1)

          old_tail = """    if (\n      dedicatedFocus\n      && assignment?.assignmentMode !== NEW_BASE_ROUND_START_JANKEN_ASSIGNMENT_MODE.CURRENT_HAND3_POLICY\n      && !focusAssignmentSyncPending\n    ) {\n      focusAssignmentSyncPending = true;\n      void readDedicatedFocusContext().finally(() => {\n        focusAssignmentSyncPending = false;\n      });\n    }\n"""
          if src.count(old_tail) != 1:
              raise SystemExit(f'old tail sync count={src.count(old_tail)}')
          src = src.replace(old_tail, '', 1)
          runtime.write_text(src, encoding='utf-8')

          anchor = """test('dedicated Focus projection proactively replaces the legacy display snapshot with current Hand3 authority', () => {\n  const runtimeSource = readFileSync(\n    new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url),\n    'utf8',\n  );\n  assert.match(runtimeSource, /const callerAssignment = model\\.assignment\\?\\.assignmentMode[\\s\\S]*CURRENT_HAND3_POLICY[\\s\\S]*\\? model\\.assignment[\\s\\S]*: null/);\n  assert.match(runtimeSource, /assignment = currentAssignment;\\n      render\\(\\);/);\n  assert.match(runtimeSource, /focusAssignmentSyncPending = true;[\\s\\S]*readDedicatedFocusContext\\(\\)\\.finally/);\n});\n"""
          replacement = anchor + """\n\ntest('dedicated Focus never paints the legacy suit-bound mapping while current Hand3 authority is loading', () => {\n  const runtimeSource = readFileSync(\n    new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url),\n    'utf8',\n  );\n  assert.match(runtimeSource, /const awaitingCurrentHand3 = dedicatedFocus[\\s\\S]*CURRENT_HAND3_POLICY/);\n  assert.match(runtimeSource, /if \\(awaitingCurrentHand3\\) \\{[\\s\\S]*node\\.disabled = true;[\\s\\S]*node\\.dataset\\.cardId = '';[\\s\\S]*cardText\\.textContent = '—';[\\s\\S]*readDedicatedFocusContext\\(\\)\\.finally[\\s\\S]*return;/);\n  assert.equal((runtimeSource.match(/readDedicatedFocusContext\\(\\)\\.finally/g) ?? []).length, 1);\n});\n"""
          if tst.count(anchor) != 1:
              raise SystemExit(f'test anchor count={tst.count(anchor)}')
          tests.write_text(tst.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Focused tests
        run: |
          node --test \
            tests/battle-janken-slidepad-runtime-mount.test.mjs \
            tests/new-base-hand3-uniform-assignment-policy.test.mjs \
            tests/new-base-round-start-janken-slot-assignment-core.test.mjs
      - name: Finalize product-only branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bounded-writer
          git config user.email gameroad-bounded-writer@users.noreply.github.com
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          git rm .github/workflows/zz-temp-battle-hand3-no-legacy-flicker-r1.yml
          git rm data/preaction-authorizations/BATTLE-HAND3-SLIDEPAD-CURRENT-R1-20260910T0355-SOL-Q7M4N20.json
          git diff --cached --check
          git commit -m 'Battle: Hand3取得前の旧割当誤表示を防止'
          git push origin HEAD:sol/battle-hand3-slidepad-current-r1-20260910
