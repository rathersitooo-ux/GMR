name: Apply Home presence cleanup

on:
  push:
    branches:
      - work/BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001
    paths:
      - '.github/scripts/home-apply-cleanup.mjs'
      - '.github/workflows/home-apply-cleanup.yml'

permissions:
  contents: write

jobs:
  apply-home-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic current-blob Home patch with diagnostic capture
        shell: bash
        run: |
          set +e
          mkdir -p audit
          node .github/scripts/home-apply-cleanup.mjs > audit/home-patch-attempt.log 2>&1
          code=$?
          cat audit/home-patch-attempt.log
          if [ "$code" -ne 0 ]; then
            git checkout -- browser/GAMEROAD.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- audit/home-patch-attempt.log
            git commit -m "[BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001] record failed patch assertion"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$code"
          fi

      - name: Run Browser static CI locally before commit
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Commit Browser only
        shell: bash
        run: |
          set -euo pipefail
          git add -- browser/GAMEROAD.html
          test "$(git diff --cached --name-only)" = "browser/GAMEROAD.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[BROWSER-HOME-PRESENCE-LEGACY-CLEANUP-001] decouple Home partner presence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
