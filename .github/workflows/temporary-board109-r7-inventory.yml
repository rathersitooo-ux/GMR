name: TEMP BOARD109 R7 exact corner executor v2

on:
  push:
    branches:
      - work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "BOARD109_R7_EXECUTOR_V2" ]; then
            echo "non-executor push; no mutation"
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "228ee9541224afaf79a7fb45f5764f032c212eb0"
          test "$(git rev-parse HEAD~4)" = "2f115ac62bf124a1c118ebeeef6dbff1e52566e7"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "3a8d34bfadf263e0980a4b1c9ec78f75fea07646"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path('browser/GAMEROAD.html')
          raw=p.read_bytes()
          assert len(raw)==11815819
          assert hashlib.sha256(raw).hexdigest()=='8728ff16e341926c82a9a2c10a55f5fe58b0f6e3325a0cdb40fe91a616881f2f'
          bom=raw.startswith(b'\xef\xbb\xbf')
          text=raw.decode('utf-8-sig')

          def r(label,old,new):
              global text
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected1 found{n}')
              if new in text: raise SystemExit(f'{label}: new already present')
              text=text.replace(old,new,1)

          r('active',"function activeNodes(){const s=new Set(centerIds());","function cornerIds(){return['K:NW','K:NE','K:SW','K:SE']}\nfunction activeNodes(){const s=new Set([...centerIds(),...cornerIds()]);")

          old="function neighbors(id,viewer){const act=activeNodes(),out=[];if(id.startsWith('C:')){const [,rs,cs]=id.split(':'),r=+rs,c=+cs;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{const x=`C:${rr}:${cc}`;if(act.has(x))out.push(x)});state.match.players.forEach(p=>['L','C','R'].forEach(l=>{const sh=shieldId(p.id,l);if(centerPort(p.id,l,viewer)===id&&act.has(sh))out.push(sh)}))}else if(id.startsWith('S:')){const [,owner,lane]=id.split(':');out.push(centerPort(owner,lane,viewer));const r1=roadId(owner,lane,1);if(act.has(r1))out.push(r1)}else if(id.startsWith('R:')){const {owner,lane,depth}=parseRoad(id);if(depth===1)out.push(shieldId(owner,lane));const a=roadId(owner,lane,depth-1),b=roadId(owner,lane,depth+1);if(depth>1&&act.has(a))out.push(a);if(depth<7&&act.has(b))out.push(b)}return out.filter(x=>act.has(x))}"
          new="function cornerRoadIds(id,viewer){const spec={'K:NW':[['N','L'],['W','R']],'K:NE':[['N','R'],['E','L']],'K:SW':[['S','R'],['W','L']],'K:SE':[['S','L'],['E','R']]}[id];if(!spec)return[];const ownerByArm={};Object.entries(projectionFor(viewer)).forEach(([owner,arm])=>ownerByArm[arm]=owner);return spec.map(([arm,lane])=>roadId(ownerByArm[arm],lane,1))}\nfunction neighbors(id,viewer){const act=activeNodes(),out=[];if(id.startsWith('C:')){const [,rs,cs]=id.split(':'),r=+rs,c=+cs;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{const x=`C:${rr}:${cc}`;if(act.has(x))out.push(x)});state.match.players.forEach(p=>['L','C','R'].forEach(l=>{const sh=shieldId(p.id,l);if(centerPort(p.id,l,viewer)===id&&act.has(sh))out.push(sh)}))}else if(id.startsWith('S:')){const [,owner,lane]=id.split(':');out.push(centerPort(owner,lane,viewer));const r1=roadId(owner,lane,1);if(act.has(r1))out.push(r1)}else if(id.startsWith('R:')){const {owner,lane,depth}=parseRoad(id);if(depth===1){out.push(shieldId(owner,lane));cornerIds().forEach(k=>{if(cornerRoadIds(k,viewer).includes(id))out.push(k)})}const a=roadId(owner,lane,depth-1),b=roadId(owner,lane,depth+1);if(depth>1&&act.has(a))out.push(a);if(depth<7&&act.has(b))out.push(b)}else if(id.startsWith('K:'))out.push(...cornerRoadIds(id,viewer));return out.filter(x=>act.has(x))}"
          r('graph',old,new)

          r('world',"const k={NW:{x:-10,z:-10},NE:{x:10,z:-10},SW:{x:-10,z:10},SE:{x:10,z:10}}[id.split(':')[1]];return{k,y:.2,...k}}","const k={NW:{x:-3.6,z:-3.6},NE:{x:3.6,z:-3.6},SW:{x:-3.6,z:3.6},SE:{x:3.6,z:3.6}}[id.split(':')[1]];return{k,y:.2,...k}}")
          r('surface',"if(typ==='center'){size=1.06;topY=nw.y-.015+.16}else if(typ==='shield'){size=1.05;topY=nw.y+.24}else if(typ==='road'){if(!activeNodes().has(id))return null;size=.88;topY=nw.y-.01+.105}else return null;","if(typ==='center'){size=1.06;topY=nw.y-.015+.16}else if(typ==='shield'){size=1.05;topY=nw.y+.24}else if(typ==='road'){if(!activeNodes().has(id))return null;size=.88;topY=nw.y-.01+.105}else if(typ==='corner'){size=.88;topY=nw.y-.01+.105}else return null;")
          r('drag',"for(const [id,p] of fieldProjection){if(id.startsWith('K:'))continue;if(onlyReach&&!reach.has(id))continue;","for(const [id,p] of fieldProjection){if(onlyReach&&!reach.has(id))continue;")
          r('render-skip',"for(const id of all){if(id.startsWith('K:'))continue;const nw=nodeWorld(id,viewer),typ=posType(id);","for(const id of all){const nw=nodeWorld(id,viewer),typ=posType(id);")
          r('render-tile',"box(nw.x,nw.y+(active.has(id)?.10:-.017),nw.z,active.has(id)?.42:.16,.014,active.has(id)?.42:.16,pc,active.has(id)?'roadMarkActive':'roadMark')}}if(m.honey?.byNode)","box(nw.x,nw.y+(active.has(id)?.10:-.017),nw.z,active.has(id)?.42:.16,.014,active.has(id)?.42:.16,pc,active.has(id)?'roadMarkActive':'roadMark')}else if(typ==='corner'){box(nw.x,nw.y-.01,nw.z,.88,.105,.88,[.46,.49,.43],'corner')}}if(m.honey?.byNode)")
          r('css',".node.corner{opacity:0;pointer-events:none}",".node.corner{opacity:0}")
          r('dom',"if(id.startsWith('K:'))e.disabled=true;else if(!e.classList.contains('reachable'))e.disabled=true;else e.onclick=","if(!e.classList.contains('reachable'))e.disabled=true;else e.onclick=")

          for token in [
              "function cornerIds(){return['K:NW','K:NE','K:SW','K:SE']}",
              "'K:NW':[['N','L'],['W','R']]",
              "'K:NE':[['N','R'],['E','L']]",
              "'K:SW':[['S','R'],['W','L']]",
              "'K:SE':[['S','L'],['E','R']]",
              "else if(id.startsWith('K:'))out.push(...cornerRoadIds(id,viewer))",
              "else if(typ==='corner'){size=.88;topY=nw.y-.01+.105}",
              "else if(typ==='corner'){box(nw.x,nw.y-.01,nw.z,.88,.105,.88,[.46,.49,.43],'corner')}",
              ".node.corner{opacity:0}"
          ]: assert token in text, token
          for forbidden in [
              "for(const [id,p] of fieldProjection){if(id.startsWith('K:'))continue",
              "for(const id of all){if(id.startsWith('K:'))continue",
              "if(id.startsWith('K:'))e.disabled=true",
              ".node.corner{opacity:0;pointer-events:none}"
          ]: assert forbidden not in text, forbidden
          assert 9+4*(3+21)+4==109

          players=['P1','P2','P3','P4']; arms=['N','E','S','W']
          spec={'K:NW':[('N','L'),('W','R')],'K:NE':[('N','R'),('E','L')],'K:SW':[('S','R'),('W','L')],'K:SE':[('S','L'),('E','R')]}
          corners={'K:NW':(-3.6,-3.6),'K:NE':(3.6,-3.6),'K:SW':(-3.6,3.6),'K:SE':(3.6,3.6)}
          off={'L':-1.45,'C':0,'R':1.45}
          def rw(arm,lane):
              d=3.6;o=off[lane]
              return {'N':(o,-d),'S':(-o,d),'W':(-d,-o),'E':(d,o)}[arm]
          for vi,_ in enumerate(players):
              proj={pid:arms[(i-vi+4)%4] for i,pid in enumerate(players)}
              oba={arm:pid for pid,arm in proj.items()}
              for k,pairs in spec.items():
                  roads=[f'R:{oba[a]}:{lane}:1' for a,lane in pairs]
                  assert len(set(roads))==2 and all(':C:1' not in x for x in roads)
                  cx,cz=corners[k]
                  for a,lane in pairs:
                      x,z=rw(a,lane)
                      assert abs(cx-x)<1e-9 or abs(cz-z)<1e-9

          encoded=text.encode('utf-8')
          if bom: encoded=b'\xef\xbb\xbf'+encoded
          p.write_bytes(encoded)
          print('patched_sha256='+hashlib.sha256(encoded).hexdigest())
          print('patched_bytes='+str(len(encoded)))
          PY
          test "$(git diff --name-only)" = "browser/GAMEROAD.html"
          git diff --check
          git config user.name "GAMEROAD Board109 R7"
          git config user.email "actions@users.noreply.github.com"
          git add browser/GAMEROAD.html
          git commit -m "BOARD-109 R7 connect accepted walkable corners"
          git push origin HEAD:work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL
