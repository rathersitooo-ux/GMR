name: TEMP Records detail R3 locate current consumer

on:
  push:
    branches: [sol/records-recent-history-r3b-20260906]
    paths:
      - '.github/workflows/zz-temp-records-recent-history-r3.yml'
      - 'browser/profile-presentation-runtime-mount.mjs'
      - 'tests/profile-presentation-runtime-mount.test.mjs'
      - 'tests/browser-full-interaction-state-sequence.spec.mjs'

permissions:
  contents: read

jobs:
  locate-records-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact current Records and save-authority exposure
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Records producer ==='
          grep -nE -C 4 'function renderRecords|if\(name===.records.\)|data-screen="records"' browser/GAMEROAD.html || true
          echo '=== save authority ==='
          grep -nE -C 8 'SAVE_AUTHORITY|SAVE_KEY|__GAMEROAD_SAVE_RECOVERY__' browser/GAMEROAD.html | head -n 260 || true
          echo '=== production globals touching history/state ==='
          grep -nE -C 3 'window\.[A-Za-z0-9_]*(HISTORY|STATE|SAVE)|history:[[:space:]]*\(\)|history:[[:space:]]*\[' browser/GAMEROAD.html | head -n 320 || true
          echo '=== mode/round localization ==='
          grep -nE -C 3 '二人|四人|二対二|ラウンド|巡' browser/GAMEROAD.html | tail -n 260 || true
