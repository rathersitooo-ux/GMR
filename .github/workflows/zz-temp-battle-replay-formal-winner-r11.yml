name: temp-battle-replay-formal-winner-r11

on:
  push:
    branches:
      - sol/battle-replay-formal-winner-r11-20260913
    paths:
      - .github/workflows/zz-temp-battle-replay-formal-winner-r11.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-replay-formal-winner-r11-20260913
          fetch-depth: 0
      - name: Patch replay formal winner seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter_path = Path('browser/battle-replay-live-adapter.mjs')
          test_path = Path('tests/battle-replay-live-adapter.test.mjs')
          adapter = adapter_path.read_text()
          tests = test_path.read_text()

          old_adapter = """  const winnerSet = new Set(winnerIds);\n  const reachedSeven = rows.filter(row => row.maxColumn >= 7).map(row => row.id);\n  if (reachedSeven.length !== winnerSet.size || reachedSeven.some(id => !winnerSet.has(id))) {\n    throw new TypeError('MATCH_END_FORMAL_WINNER_MISMATCH');\n  }\n\n"""
          new_adapter = """  const winnerSet = new Set(winnerIds);\n\n"""
          if adapter.count(old_adapter) != 1:
              raise SystemExit(f'ADAPTER_PATCH_ANCHOR_COUNT={adapter.count(old_adapter)}')
          adapter = adapter.replace(old_adapter, new_adapter, 1)

          old_name = "test('Free4P formal ranking fails closed on rank, winner, duplicate-id, range, and mode mismatches', () => {"
          new_name = "test('Free4P formal ranking trusts formal winner ids and fails closed on rank, duplicate-id, range, and mode mismatches', () => {"
          if tests.count(old_name) != 1:
              raise SystemExit(f'TEST_NAME_ANCHOR_COUNT={tests.count(old_name)}')
          tests = tests.replace(old_name, new_name, 1)

          old_assert = """  assert.throws(() => appendAcceptedMatchEnd(initial(), {\n    winnerIds: ['P1'], round: 1, mode: '4p',\n    formalRanking: base.map(row => row.id === 'P2' ? { ...row, maxColumn: 7, rank: 1 } : row)\n  }), /MATCH_END_FORMAL_WINNER_MISMATCH/);\n\n"""
          new_assert = """  const roadCompleteNonWinner = appendAcceptedMatchEnd(initial(), {\n    winnerIds: ['P1'], round: 1, mode: '4p',\n    formalRanking: base.map(row => row.id === 'P2' ? { ...row, maxColumn: 7 } : row)\n  });\n  const roadCompleteNonWinnerEnd = readLiveReplay(roadCompleteNonWinner).events.at(-1).publicData;\n  assert.deepEqual(roadCompleteNonWinnerEnd.winnerIds, ['P1']);\n  assert.equal(\n    roadCompleteNonWinnerEnd.formalRanking.find(row => row.id === 'P2').maxColumn,\n    7\n  );\n\n"""
          if tests.count(old_assert) != 1:
              raise SystemExit(f'TEST_ASSERT_ANCHOR_COUNT={tests.count(old_assert)}')
          tests = tests.replace(old_assert, new_assert, 1)

          if 'MATCH_END_FORMAL_WINNER_MISMATCH' in adapter:
              raise SystemExit('LEGACY_WINNER_MISMATCH_STILL_PRESENT_IN_ADAPTER')

          adapter_path.write_text(adapter)
          test_path.write_text(tests)
          PY
      - name: Focused replay tests
        run: node --test tests/battle-replay-live-adapter.test.mjs
      - name: Browser static check
        run: node tests/browser-static-check.mjs
      - name: Verify bounded diff and commit product patch
        shell: bash
        run: |
          git diff -- browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs
          changed="$(git diff --name-only -- browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs | sort)"
          expected=$'browser/battle-replay-live-adapter.mjs\ntests/battle-replay-live-adapter.test.mjs'
          test "$changed" = "$expected"
          rm data/preaction-authorizations/BATTLE-SINGLE-HTML-SPINE-R11-20260913T1845-SOL.json
          rm .github/workflows/zz-temp-battle-replay-formal-winner-r11.yml
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs data/preaction-authorizations/BATTLE-SINGLE-HTML-SPINE-R11-20260913T1845-SOL.json .github/workflows/zz-temp-battle-replay-formal-winner-r11.yml
          git commit -m "Battle: replay winner判定を正式winnerIdsへ一本化"
          git push origin HEAD:sol/battle-replay-formal-winner-r11-20260913
