name: TEMP Replay Package Pin R3
on:
  push:
    branches:
      - sol/battle-recent-causal-detail-r3-20260914
    paths:
      - .github/workflows/zz-temp-battle-recent-causal-detail-r3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-recent-causal-detail-r3-20260914
          fetch-depth: 0
      - name: Synchronize replay adapter provenance pin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/tests/build.test.mjs')
          s = p.read_text()
          old = "currentBlob: 'ffa34c835ba4d271020eb59f47ff1be6eb29843f'"
          new = "currentBlob: '4047d561436345de7d0382129d35b9de00a805de'"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          node --test tests/partner-battle-event-log-projection.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit and push package pin
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/cloudflare/tests/build.test.mjs
          git diff --cached --check
          git commit -m "Cloudflare: Replay adapter provenanceを同期"
          git push origin HEAD:sol/battle-recent-causal-detail-r3-20260914
