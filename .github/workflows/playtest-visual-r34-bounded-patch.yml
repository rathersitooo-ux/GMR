name: PLAYTEST DECK transient selection diagnostic

on:
  push:
    branches:
      - work/visual-r34-result-update-banner
    paths:
      - .github/workflows/playtest-visual-r34-bounded-patch.yml

permissions:
  contents: read

env:
  EXACT_BASE: aa77a5799da2de6bea9d28640df46e4328c2046e
  EXACT_HTML_BLOB: 477325641fa328ecd55cdc15a11a5d0ea90759f1
  EXACT_TEST_BLOB: 5386451be827ac75554f8f99c7d0d4586a5a07c2

jobs:
  diagnose-current-deck-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-r34-result-update-banner
          fetch-depth: 0
      - name: Verify exact current product and emit bounded source contexts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_BASE"
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXACT_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXACT_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('browser/GAMEROAD.html').read_text(encoding='utf-8-sig')
          patterns = [
              '選択カードをデッキへ追加',
              'collection-card',
              'deckEditor',
              'deck-editor',
              'selectedCard',
              "classList.add('selected'",
              'classList.add("selected"',
              "classList.toggle('selected'",
              'classList.toggle("selected"',
              ':focus-visible',
              ':focus-within',
              '.selected',
              'outline:',
              'r4PreviewClose',
          ]
          for pattern in patterns:
              print(f'\n===== PATTERN {pattern!r} =====')
              start = 0
              found = 0
              while found < 20:
                  idx = data.find(pattern, start)
                  if idx < 0:
                      break
                  found += 1
                  lo = max(0, idx - 1400)
                  hi = min(len(data), idx + len(pattern) + 2200)
                  print(f'--- occurrence {found} char={idx} ---')
                  print(data[lo:hi].replace('\r',''))
                  start = idx + len(pattern)
              print(f'COUNT_SHOWN={found}')
          PY
