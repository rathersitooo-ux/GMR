name: TEMP Battle current-action portrait layout R8 classifier repair

on:
  push:
    branches:
      - sol/battle-current-action-portrait-layout-r8-20260914
    paths:
      - .github/workflows/zz-temp-battle-current-action-portrait-layout-r8.yml

permissions:
  contents: write

jobs:
  integrate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-current-action-portrait-layout-r8-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move regression into classified runtime test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/battle-current-player-ui-runtime.test.mjs')
          text = path.read_text()
          anchor = '  const snapshot = runtime.inspect();\n'
          assertion = '  assert.match(styleText, /@media\\(max-width:520px\\) and \\(orientation:portrait\\)\\{[\\s\\S]*?\\[data-gr-current-ui-zone="current-action"\\]\\{transform:translateY\\(6px\\)!important\\}/);\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'snapshot anchor count={text.count(anchor)}')
          if assertion in text:
              raise SystemExit('portrait owner assertion already present')
          path.write_text(text.replace(anchor, assertion + anchor, 1))
          standalone = Path('tests/battle-current-action-portrait-layout-owner.test.mjs')
          if not standalone.exists():
              raise SystemExit('standalone regression missing before classifier repair')
          standalone.unlink()
          PY
          git diff --check
          git diff -- tests/battle-current-player-ui-runtime.test.mjs tests/battle-current-action-portrait-layout-owner.test.mjs
      - name: Run classified focused regression
        run: |
          set -euo pipefail
          node --test tests/battle-current-player-ui-runtime.test.mjs
      - name: Commit only regression path correction
        shell: bash
        run: |
          set -euo pipefail
          git add tests/battle-current-player-ui-runtime.test.mjs tests/battle-current-action-portrait-layout-owner.test.mjs
          git diff --cached --name-status
          git config user.name 'rathersitooo-ux'
          git config user.email 'rathersitooo@gmail.com'
          git commit -m 'test(battle): keep portrait current-action regression in classified runtime test'
          git push origin HEAD:sol/battle-current-action-portrait-layout-r8-20260914
