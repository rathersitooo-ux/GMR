name: TEMP WU63 short-landscape rail R7

on:
  push:
    branches:
      - sol/battle-wu63-short-landscape-rail-r7-20260914
    paths:
      - .github/workflows/zz-temp-battle-wu63-short-landscape-rail-r7.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-wu63-short-landscape-rail-r7-20260914
          fetch-depth: 0
      - name: Apply bounded short-landscape rail repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('browser/battle-current-player-ui-runtime.mjs')
          text = runtime.read_text(encoding='utf-8')
          old = '  .screen.battle[${ROOT_ATTR}="1"] .battleRail{max-width:168px!important}'
          new = '  .screen.battle[${ROOT_ATTR}="1"] .battleRail{top:144px!important;bottom:auto!important;max-width:168px!important}'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one runtime anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          test = Path('tests/battle-current-player-ui-runtime.test.mjs')
          t = test.read_text(encoding='utf-8')
          anchor = "  assert.match(styleText, /@media\\(max-width:520px\\)[\\s\\S]*\\.battleRail\\{[^}]*top:118px!important[^}]*max-width:none!important/);"
          addition = anchor + "\n  assert.equal(styleText.includes('.battleRail{top:144px!important;bottom:auto!important;max-width:168px!important}'), true);"
          if t.count(anchor) != 1:
              raise SystemExit(f'expected exactly one test anchor, found {t.count(anchor)}')
          if "top:144px!important;bottom:auto!important;max-width:168px!important" in t:
              raise SystemExit('focused regression already present')
          t = t.replace(anchor, addition, 1)
          test.write_text(t, encoding='utf-8')
          PY
      - name: Focused regression
        run: node tests/battle-current-player-ui-runtime.test.mjs
      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name "gameroad-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-current-player-ui-runtime.mjs tests/battle-current-player-ui-runtime.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No material change'; exit 1; }
          git commit -m "Fix WU63 short-landscape rail containment"
          git push origin HEAD:sol/battle-wu63-short-landscape-rail-r7-20260914
