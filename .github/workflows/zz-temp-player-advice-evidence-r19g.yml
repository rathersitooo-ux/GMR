name: TEMP Player Advice Evidence R19G

on:
  push:
    branches:
      - sol/player-advice-evidence-r19g-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/player-advice-evidence-r19g-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse validated donor patch and repair hash only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/partner-advice-runtime-mount.mjs)" = "7f057a2d89b566b27350f0c65fa6809e1895e455"
          test "$(git hash-object tests/partner-advice-runtime-mount.test.mjs)" = "bb7be0affeaff9c6abe78c0cc0c871be5455c937"
          git fetch origin sol/player-advice-evidence-r19f-20260908
          python - <<'PY'
          from pathlib import Path
          import subprocess

          donor = subprocess.check_output([
              'git', 'show',
              'origin/sol/player-advice-evidence-r19f-20260908:.github/workflows/zz-temp-player-advice-evidence-r19f.yml'
          ], text=True)
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          start = donor.find(start_token)
          if start < 0:
              raise SystemExit('R19F donor Python start not found')
          start += len(start_token)
          end = donor.find(end_token, start)
          if end < 0:
              raise SystemExit('R19F donor Python end not found')
          body = donor[start:end]
          lines = []
          repaired = 0
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if line.strip().startswith('runtime_blob = hashlib.sha1('):
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + "runtime_blob = hashlib.sha1(b'blob ' + str(len(runtime_bytes)).encode() + bytes([0]) + runtime_bytes).hexdigest()"
                  repaired += 1
              lines.append(line)
          if repaired != 1:
              raise SystemExit(f'expected one donor hash repair, got {repaired}')
          patch_script = '\n'.join(lines) + '\n'
          Path('/tmp/r19g-patch.py').write_text(patch_script)
          PY
          python /tmp/r19g-patch.py
          test "$(git hash-object browser/partner-advice-runtime-mount.mjs)" = "66078f3d9ffc608ba1a20fbc5850d6caa04a1e61"
          grep -Fq "currentBlob: '66078f3d9ffc608ba1a20fbc5850d6caa04a1e61'" deploy/cloudflare/tests/build.test.mjs
          node --test tests/partner-advice-runtime-mount.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Persist product delta and remove transient carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-r19g-bot"
          git config user.email "gameroad-r19g-bot@users.noreply.github.com"
          git rm .github/workflows/zz-temp-player-advice-evidence-r19g.yml
          git rm data/preaction-authorizations/BIGDATA-PLAYER-ADVICE-EVIDENCE-R19G-20260908T0938-SOL-C9Q4M8.json
          git add browser/partner-advice-runtime-mount.mjs tests/partner-advice-runtime-mount.test.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m "Partner: explain advice source and reason"
          git push origin HEAD:sol/player-advice-evidence-r19g-20260908
