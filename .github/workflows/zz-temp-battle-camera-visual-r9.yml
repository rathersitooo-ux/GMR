name: TEMP Battle Camera Visual R9

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-20260914

permissions:
  contents: write

jobs:
  apply-verify-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded camera seam using current UI research
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/GAMEROAD.html)" = "5f06efc5b69b198ac56cb3a502f94f97d8a61880"
          git fetch origin sol/battle-camera-html-r8-20260913:refs/remotes/origin/sol/battle-camera-html-r8-20260913
          git show origin/sol/battle-camera-html-r8-20260913:browser/GAMEROAD.html > browser/GAMEROAD.html
          python - <<'PY'
          from pathlib import Path

          hp=Path('browser/GAMEROAD.html')
          s=hp.read_text(encoding='utf-8')

          old_btn='<button class="railBtn" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る" hidden>自分</button>'
          if s.count(old_btn)!=1:
              raise SystemExit(f'donor camera rail button count={s.count(old_btn)}')
          s=s.replace(old_btn,'',1)

          anchor='<button class="railBtn warn" id="leaveMatch">退出</button></div><div class="targetBox floatingTarget"'
          replacement='<button class="railBtn warn" id="leaveMatch">退出</button></div><button type="button" class="cameraReturnControl" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る" hidden aria-hidden="true" tabindex="-1">自分</button><div class="targetBox floatingTarget"'
          if s.count(anchor)!=1:
              raise SystemExit(f'battle rail close anchor count={s.count(anchor)}')
          s=s.replace(anchor,replacement,1)

          old_style='''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn{display:none;pointer-events:none}
          #cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{display:flex;pointer-events:auto;box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}
          </style>'''
          new_style='''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn[hidden]{display:none!important;pointer-events:none!important}
          #cameraReturnBtn.cameraReturnControl{position:absolute;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:34;display:flex;align-items:center;justify-content:center;min-width:56px;min-height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.58);border-radius:22px;background:rgba(27,31,36,.94);color:#f5f7f8;font:800 13px/1 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.28);touch-action:manipulation;pointer-events:auto}
          #cameraReturnBtn.cameraReturnControl[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(255,255,255,.24),0 6px 18px rgba(0,0,0,.28)}
          #battleMap[data-camera-mode="MANUAL_INSPECT"] .battleRail{opacity:0;pointer-events:none;visibility:hidden}
          </style>'''
          if s.count(old_style)!=1:
              raise SystemExit(f'donor camera style block count={s.count(old_style)}')
          s=s.replace(old_style,new_style,1)

          old_destroy="function destroy(){runtime?.destroy?.();runtime=null;key='';returnControl.hidden=true;delete world.dataset.cameraMode;delete returnControl.dataset.cameraMode}"
          new_destroy="function syncReturnControl(cameraState){const manual=cameraState?.mode==='MANUAL_INSPECT';returnControl.hidden=!manual;returnControl.setAttribute('aria-hidden',manual?'false':'true');returnControl.tabIndex=manual?0:-1;if(manual)returnControl.dataset.cameraMode='MANUAL_INSPECT';else delete returnControl.dataset.cameraMode}function destroy(){runtime?.destroy?.();runtime=null;key='';delete world.dataset.cameraMode;syncReturnControl(null)}"
          if s.count(old_destroy)!=1:
              raise SystemExit(f'donor camera destroy anchor count={s.count(old_destroy)}')
          s=s.replace(old_destroy,new_destroy,1)

          old_apply="applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;returnControl.hidden=cameraState.mode!=='MANUAL_INSPECT'}});"
          new_apply="applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;syncReturnControl(cameraState)}});"
          if s.count(old_apply)!=1:
              raise SystemExit(f'donor camera applyView anchor count={s.count(old_apply)}')
          s=s.replace(old_apply,new_apply,1)

          old_state="const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;returnControl.hidden=cameraState.mode!=='MANUAL_INSPECT';return cameraState}"
          new_state="const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;syncReturnControl(cameraState);return cameraState}"
          if s.count(old_state)!=1:
              raise SystemExit(f'donor camera state anchor count={s.count(old_state)}')
          s=s.replace(old_state,new_state,1)

          rail=s.split('<div class="battleRail">',1)[1].split('</div>',1)[0]
          if 'cameraReturnBtn' in rail:
              raise SystemExit('camera return leaked into persistent battleRail')
          if s.count('id="cameraReturnBtn"')!=1:
              raise SystemExit(f'cameraReturnBtn count={s.count("id=\"cameraReturnBtn\"")}')
          hp.write_text(s,encoding='utf-8')

          tp=Path('tests/browser-static-check.mjs')
          t=tp.read_text(encoding='utf-8')
          marker='  errors.push(...collectHomeVisualShellErrors(html));\n'
          if t.count(marker)!=1:
              raise SystemExit(f'browser static insertion marker count={t.count(marker)}')
          checks=r'''  const cameraReturnIds = html.match(/id=["']cameraReturnBtn["']/g) ?? [];
          if (cameraReturnIds.length !== 1) errors.push(`camera return control count is ${cameraReturnIds.length}, expected 1`);
          const cameraRailMatch = html.match(/<div class=["']battleRail["']>([\s\S]*?)<\/div>/i);
          if (cameraRailMatch?.[1]?.includes('cameraReturnBtn')) errors.push('camera return control is inside persistent battle rail');
          if (!/class=["']cameraReturnControl["'][^>]*id=["']cameraReturnBtn["'][^>]*hidden[^>]*aria-hidden=["']true["'][^>]*tabindex=["']-1["']/i.test(html)) errors.push('camera return is not a default-hidden contextual control');
          if (!/#cameraReturnBtn\[hidden\]\{display:none!important;pointer-events:none!important\}/.test(html)) errors.push('camera return hidden state does not guarantee zero visual and input footprint');
          if (!/#battleMap\[data-camera-mode=["']MANUAL_INSPECT["']\] \.battleRail\{opacity:0;pointer-events:none;visibility:hidden\}/.test(html)) errors.push('low-priority battle rail does not yield during manual camera inspect');
          if (!/const manual=cameraState\?\.mode==='MANUAL_INSPECT';returnControl\.hidden=!manual;/.test(html)) errors.push('camera return visibility is not bound to MANUAL_INSPECT');
          if (!/authority:\{gameplay:false,movement:false,target:false,legality:false,stateWrite:false\}/.test(html)) errors.push('camera adapter lost gameplay-write firewall');
          if (/class=["']railBtn["'] id=["']cameraReturnBtn["']/.test(html)) errors.push('camera return was reinserted into persistent rail');
'''
          if 'const cameraReturnIds = html.match' not in t:
              t=t.replace(marker,checks+marker,1)
              tp.write_text(t,encoding='utf-8')
          PY

          git diff --check
          node --test tests/battle-camera-control-core.test.mjs tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Install Playwright for bounded 667x375 evidence
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Write and run bounded 667x375 actual acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .camera-r9 visual-evidence test-results
          cat > .camera-r9/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir:'.',testMatch:'camera-r9.spec.mjs',outputDir:'../test-results',timeout:90000,
            expect:{timeout:7000},workers:1,retries:0,
            use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},trace:'retain-on-failure'},
            webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}
          });
          EOF
          cat > .camera-r9/camera-r9.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const out=path.resolve('visual-evidence');
          async function installLegalBattleDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__;const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);const royalIds=['SP_J','SP_Q','SP_K'];const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));const main=[...nonRoyal.slice(0,37),...royalIds];t.deckSetDraft(main,[]);const validation=t.deckValidate(t.state.deckDraft,{forBattle:true});const committed=validation.ok?t.deckCommit():false;return{committed,validation,saved:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          function overlaps(a,b){return !!(a&&b&&a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y)}
          test('camera inspect gives space to the current task at 667x375',async({page})=>{
            const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});expect(response?.ok()).toBeTruthy();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});
            const deck=await installLegalBattleDeck(page);expect(deck.committed).toBeTruthy();expect(deck.saved.ok).toBeTruthy();
            const setupControl=page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first();await expect(setupControl).toBeVisible();await setupControl.click();
            const setup=page.locator('section[data-screen="setup"]');await expect(setup).toBeVisible();await setup.locator('[data-content="road_shield"]').click();await setup.locator('[data-mode="2p"]').click();await setup.locator('#startMatch').click();
            const battle=page.locator('section[data-screen="battle"]');await expect(battle).toBeVisible();
            await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();
            const ret=battle.locator('#cameraReturnBtn'),rail=battle.locator('.battleRail'),hand=battle.locator('#hand'),top=battle.locator('.battleTopStatus');
            await expect(ret).toBeHidden();
            const follow=await ret.evaluate(el=>({hidden:el.hidden,display:getComputedStyle(el).display,pointer:getComputedStyle(el).pointerEvents,rects:el.getClientRects().length,aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));
            expect(follow).toEqual({hidden:true,display:'none',pointer:'none',rects:0,aria:'true',tab:-1});
            await page.screenshot({path:path.join(out,'camera-follow-667x375.png'),animations:'disabled'});

            const world=battle.locator('#battleMap'),box=await world.boundingBox();expect(box).not.toBeNull();
            await page.mouse.move(box.x+box.width*.52,box.y+box.height*.52);await page.mouse.down();await page.mouse.move(box.x+box.width*.34,box.y+box.height*.52,{steps:8});await page.mouse.up();
            await expect(ret).toBeVisible();await expect(ret).toHaveAttribute('data-camera-mode','MANUAL_INSPECT');
            const rr=await ret.boundingBox(),hr=await hand.boundingBox(),tr=await top.boundingBox();expect(rr).not.toBeNull();
            expect(rr.width).toBeGreaterThanOrEqual(44);expect(rr.height).toBeGreaterThanOrEqual(44);
            expect(rr.x).toBeGreaterThanOrEqual(0);expect(rr.y).toBeGreaterThanOrEqual(0);expect(rr.x+rr.width).toBeLessThanOrEqual(667);expect(rr.y+rr.height).toBeLessThanOrEqual(375);
            expect(overlaps(rr,hr)).toBeFalsy();expect(overlaps(rr,tr)).toBeFalsy();
            const railState=await rail.evaluate(el=>({opacity:getComputedStyle(el).opacity,pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));
            expect(railState).toEqual({opacity:'0',pointer:'none',visibility:'hidden'});
            const manualState=await ret.evaluate(el=>({aria:el.getAttribute('aria-hidden'),tab:el.tabIndex}));expect(manualState).toEqual({aria:'false',tab:0});
            fs.writeFileSync(path.join(out,'camera-manual-667-metrics.json'),JSON.stringify({returnRect:rr,handRect:hr,topRect:tr,railState},null,2));
            await page.screenshot({path:path.join(out,'camera-manual-667x375.png'),animations:'disabled'});

            await ret.click();await expect(ret).toBeHidden();
            await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode)).toBe('FOLLOW_CONTROLLED');
            const railBack=await rail.evaluate(el=>({pointer:getComputedStyle(el).pointerEvents,visibility:getComputedStyle(el).visibility}));
            expect(railBack.visibility).not.toBe('hidden');expect(railBack.pointer).not.toBe('none');
            await page.screenshot({path:path.join(out,'camera-returned-667x375.png'),animations:'disabled'});
          });
          EOF
          npx playwright test --config=.camera-r9/playwright.config.mjs --workers=1

      - name: Upload bounded visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-camera-visual-r9-${{ github.run_id }}
          path: |
            visual-evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit clean product delta and self-clean
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git rm -f .github/workflows/zz-temp-battle-camera-visual-r9.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' browser/GAMEROAD.html tests/browser-static-check.mjs .github/workflows/zz-temp-battle-camera-visual-r9.yml | sort)"
          test "$changed" = "$expected"
          git commit -m 'Battle: カメラ確認時だけ復帰操作へ場所を譲る R9'
          git push origin HEAD:sol/battle-camera-visual-r9-20260914
