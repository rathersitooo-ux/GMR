name: TEMP Battle current-action visual R3

on:
  push:
    branches:
      - sol/battle-current-action-visual-r3-20260914
    paths:
      - .github/workflows/zz-temp-battle-current-action-visual-r3.yml

permissions:
  contents: read

jobs:
  public-home-battle-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind public build and capture shipped root
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          curl --fail --silent --show-error --location --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --max-time 30 \
            --output visual-evidence/gameroad-version-before.json \
            "${GAMEROAD_PUBLIC_BASE_URL}/gameroad-version.json"
          BUILD="$(node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('visual-evidence/gameroad-version-before.json','utf8'));if(!m.build_id)process.exit(2);process.stdout.write(String(m.build_id));")"
          echo "observed_build_id=${BUILD}" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --max-time 30 \
            --output visual-evidence/public-root.html "${GAMEROAD_PUBLIC_BASE_URL}/"
          BUILD="$BUILD" node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('visual-evidence/public-root.html','utf8');
          const needles=['data-home-target','homeTarget','[data-home-target','data-go','function go','showScreen','setScreen','activateScreen'];
          const result={build:process.env.BUILD,length:html.length,contexts:{}};
          for(const needle of needles){
            const rows=[]; let at=0;
            while(rows.length<12){ const i=html.indexOf(needle,at); if(i<0) break; rows.push(html.slice(Math.max(0,i-450),Math.min(html.length,i+900))); at=i+needle.length; }
            result.contexts[needle]=rows;
          }
          fs.writeFileSync('visual-evidence/source-contexts.json',JSON.stringify(result,null,2));
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Diagnose visible Home Battle control at 667x375
        env:
          OBSERVED_BUILD_ID: ${{ steps.bind.outputs.observed_build_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > visual-evidence/diagnose.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const base=process.env.GAMEROAD_PUBLIC_BASE_URL;
          const boundBuild=process.env.OBSERVED_BUILD_ID;
          const viewport={width:667,height:375};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport,deviceScaleFactor:1});
          const page=await context.newPage();
          const consoleRows=[]; const pageErrors=[];
          page.on('console',m=>consoleRows.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push(String(e)));
          const buildNow=async()=>String((await (await fetch(`${base}/gameroad-version.json`,{headers:{'Accept-Encoding':'identity'}})).json()).build_id||'');
          const visibleScreens=async()=>page.locator('section[data-screen]').evaluateAll(nodes=>nodes.filter(n=>{const s=getComputedStyle(n);const r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(n=>({screen:n.getAttribute('data-screen'),id:n.id,className:n.className,ariaHidden:n.getAttribute('aria-hidden')})));
          const snapshot=async(label)=>({label,url:page.url(),hash:location.hash,visibleScreens:await visibleScreens(),bodyClass:await page.locator('body').getAttribute('class'),activeElement:await page.evaluate(()=>{const n=document.activeElement;return n?{tag:n.tagName,id:n.id,className:n.className,text:(n.textContent||'').trim().slice(0,80)}:null;})});
          const beforeBuild=await buildNow();
          if(beforeBuild!==boundBuild) throw new Error(`build drift before: ${boundBuild} -> ${beforeBuild}`);
          const response=await page.goto(`${base}/`,{waitUntil:'domcontentloaded',timeout:30000});
          if(!response?.ok()) throw new Error(`root HTTP ${response?.status?.()}`);
          await page.locator('section[data-screen="home"]').waitFor({state:'visible',timeout:15000});
          await page.evaluate(()=>{
            window.__GR_DIAG_EVENTS__=[];
            const slim=n=>n?{tag:n.tagName,id:n.id,className:String(n.className||''),homeTarget:n.getAttribute?.('data-home-target'),go:n.getAttribute?.('data-go'),rootGo:n.getAttribute?.('data-root-go'),text:(n.textContent||'').trim().slice(0,90)}:null;
            for(const type of ['pointerdown','pointerup','click']) document.addEventListener(type,e=>window.__GR_DIAG_EVENTS__.push({type,target:slim(e.target),current:slim(e.currentTarget),defaultPrevented:e.defaultPrevented,isTrusted:e.isTrusted}),true);
          });
          const button=page.locator('[data-home-target="setup"]:visible, [data-go="setup"]:visible, [data-root-go="setup"]:visible').first();
          await button.waitFor({state:'visible',timeout:7000});
          const buttonInfo=await button.evaluate(n=>{const r=n.getBoundingClientRect(),s=getComputedStyle(n);const cx=r.left+r.width/2,cy=r.top+r.height/2;const top=document.elementFromPoint(cx,cy);const slim=x=>x?{tag:x.tagName,id:x.id,className:String(x.className||''),homeTarget:x.getAttribute?.('data-home-target'),go:x.getAttribute?.('data-go'),rootGo:x.getAttribute?.('data-root-go'),text:(x.textContent||'').trim().slice(0,100)}:null;return{outerHTML:n.outerHTML.slice(0,1800),rect:{x:r.x,y:r.y,width:r.width,height:r.height},style:{display:s.display,visibility:s.visibility,pointerEvents:s.pointerEvents,zIndex:s.zIndex,position:s.position,opacity:s.opacity},center:{x:cx,y:cy},elementFromPoint:slim(top),self:slim(n),closestButton:slim(n.closest('button'))};});
          const globals=await page.evaluate(()=>Object.keys(window).filter(k=>/(screen|nav|home|route|gameroad)/i.test(k)).sort().slice(0,160));
          const before=await snapshot('before-click');
          await page.screenshot({path:'visual-evidence/home-before-click-667x375.png'});
          await button.click({timeout:7000});
          await page.waitForTimeout(500);
          const after500=await snapshot('after-500ms');
          await page.waitForTimeout(1200);
          const after1700=await snapshot('after-1700ms');
          const events=await page.evaluate(()=>window.__GR_DIAG_EVENTS__||[]);
          const setupState=await page.locator('section[data-screen="setup"]').evaluate(n=>{const s=getComputedStyle(n),r=n.getBoundingClientRect();return{className:n.className,hidden:n.hidden,ariaHidden:n.getAttribute('aria-hidden'),display:s.display,visibility:s.visibility,rect:{x:r.x,y:r.y,width:r.width,height:r.height}};}).catch(()=>null);
          await page.screenshot({path:'visual-evidence/home-after-click-667x375.png'});

          // Compare a second visible Home route without relying on hidden/private APIs.
          let secondary=null;
          const char=page.locator('[data-home-target="characters"]:visible, [data-go="characters"]:visible, [data-root-go="characters"]:visible').first();
          if(await char.count()){
            try{ await char.click({timeout:5000}); await page.waitForTimeout(500); secondary={target:'characters',snapshot:await snapshot('after-characters-click')}; }catch(e){ secondary={target:'characters',error:String(e)}; }
          }
          const afterBuild=await buildNow();
          const result={passDiagnostic:true,boundBuild,beforeBuild,afterBuild,buildStable:afterBuild===boundBuild,viewport,buttonInfo,globals,before,after500,after1700,events,setupState,secondary,consoleRows,pageErrors};
          fs.writeFileSync('visual-evidence/home-battle-diagnostic.json',JSON.stringify(result,null,2));
          if(afterBuild!==boundBuild) throw new Error(`build drift during diagnostic: ${boundBuild} -> ${afterBuild}`);
          await browser.close();
          EOF
          node visual-evidence/diagnose.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-current-action-nav-diagnostic-${{ github.run_id }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
