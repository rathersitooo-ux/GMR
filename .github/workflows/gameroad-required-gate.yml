name: GAMEROAD Required Gate

on:
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  required-gate:
    name: GAMEROAD Required Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "Unable to resolve comparison SHAs."
            exit 1
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/gameroad-changed.txt
          echo "Changed paths:"
          cat /tmp/gameroad-changed.txt

          browser=false
          dino=false
          learning=false
          advice=false
          replay=false
          ping=false
          result=false
          gacha=false
          pursuit=false
          ui_feedback=false
          deck_ack=false
          self_deck=false
          partner_vtuber=false
          roblox=false
          unclassified=false
          : > /tmp/gameroad-unclassified.txt

          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              browser/GAMEROAD.html|\
              tests/browser-static-check.mjs|\
              tests/browser-runtime-smoke.spec.mjs|\
              tests/browser-full-interaction.spec.mjs|\
              playwright.config.mjs|\
              playwright.full-interaction.config.mjs|\
              .github/workflows/browser-node-ci.yml|\
              .github/workflows/browser-runtime-smoke.yml|\
              .github/workflows/browser-full-interaction.yml)
                browser=true
                ;;
              browser/dino-dig-mobile-whitebox.html|\
              tests/dino-dig-mobile-whitebox.spec.mjs|\
              playwright.dino-dig.config.mjs|\
              .github/workflows/dino-dig-mobile-whitebox.yml)
                dino=true
                ;;
              browser/learning-crossmedia-whitebox.html|\
              tests/learning-crossmedia-whitebox.spec.mjs|\
              playwright.learning-crossmedia.config.mjs|\
              .github/workflows/learning-crossmedia-whitebox.yml)
                learning=true
                ;;
              tools/advice-collective-eval.mjs|\
              tests/advice-collective-eval.test.mjs|\
              .github/workflows/advice-collective-eval.yml)
                advice=true
                ;;
              browser/battle-replay-core.mjs|\
              tests/battle-replay-core.test.mjs)
                replay=true
                ;;
              browser/battle-team-ping-core.mjs|\
              tests/battle-team-ping-core.test.mjs)
                ping=true
                ;;
              browser/result-presentation-core.mjs|\
              tests/result-presentation-core.test.mjs)
                result=true
                ;;
              browser/gacha-presentation-core.mjs|\
              tests/gacha-presentation-core.test.mjs)
                gacha=true
                ;;
              browser/pursuit-triad-core.mjs|\
              tests/pursuit-triad-core.test.mjs)
                pursuit=true
                ;;
              browser/ui-state-feedback-core.mjs|\
              tests/ui-state-feedback-core.test.mjs)
                ui_feedback=true
                ;;
              browser/deck-save-ack-core.mjs|\
              tests/deck-save-ack-core.test.mjs)
                deck_ack=true
                ;;
              browser/battle-self-deck-inspect-core.mjs|\
              tests/battle-self-deck-inspect-core.test.mjs)
                self_deck=true
                ;;
              browser/partner-vtuber-public-context-core.mjs|\
              tests/partner-vtuber-public-context-core.test.mjs)
                partner_vtuber=true
                ;;
              roblox/GAMEROAD.rbxlx)
                roblox=true
                ;;
              .github/workflows/gameroad-required-gate.yml|README.md|.gitignore|.gitattributes)
                ;;
              browser/*|roblox/*|unity/*|tools/*|tests/*|.github/workflows/*|\
              playwright*.mjs|*.js|*.mjs|*.ts|*.tsx|*.lua|*.luau|*.html|*.css|\
              package.json|package-lock.json)
                unclassified=true
                printf '%s\n' "${path}" >> /tmp/gameroad-unclassified.txt
                ;;
              *)
                ;;
            esac
          done < /tmp/gameroad-changed.txt

          {
            echo "browser=${browser}"
            echo "dino=${dino}"
            echo "learning=${learning}"
            echo "advice=${advice}"
            echo "replay=${replay}"
            echo "ping=${ping}"
            echo "result=${result}"
            echo "gacha=${gacha}"
            echo "pursuit=${pursuit}"
            echo "ui_feedback=${ui_feedback}"
            echo "deck_ack=${deck_ack}"
            echo "self_deck=${self_deck}"
            echo "partner_vtuber=${partner_vtuber}"
            echo "roblox=${roblox}"
            echo "unclassified=${unclassified}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${unclassified}" == "true" ]]; then
            echo "Unclassified executable/CI paths:"
            cat /tmp/gameroad-unclassified.txt
          fi

      - name: Set up Node
        if: steps.classify.outputs.browser == 'true' || steps.classify.outputs.dino == 'true' || steps.classify.outputs.learning == 'true' || steps.classify.outputs.advice == 'true' || steps.classify.outputs.replay == 'true' || steps.classify.outputs.ping == 'true' || steps.classify.outputs.result == 'true' || steps.classify.outputs.gacha == 'true' || steps.classify.outputs.pursuit == 'true' || steps.classify.outputs.ui_feedback == 'true' || steps.classify.outputs.deck_ack == 'true' || steps.classify.outputs.self_deck == 'true' || steps.classify.outputs.partner_vtuber == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Browser static check
        if: steps.classify.outputs.browser == 'true'
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Run Advice offline evaluator tests
        if: steps.classify.outputs.advice == 'true'
        run: node --test tests/advice-collective-eval.test.mjs

      - name: Run Battle replay core tests
        if: steps.classify.outputs.replay == 'true'
        run: node --test tests/battle-replay-core.test.mjs

      - name: Run Battle team ping core tests
        if: steps.classify.outputs.ping == 'true'
        run: node --test tests/battle-team-ping-core.test.mjs

      - name: Run Result presentation core tests
        if: steps.classify.outputs.result == 'true'
        run: node --test tests/result-presentation-core.test.mjs

      - name: Run Gacha presentation core tests
        if: steps.classify.outputs.gacha == 'true'
        run: node --test tests/gacha-presentation-core.test.mjs

      - name: Run Pursuit triad core tests
        if: steps.classify.outputs.pursuit == 'true'
        run: node --test tests/pursuit-triad-core.test.mjs

      - name: Run UI state feedback core tests
        if: steps.classify.outputs.ui_feedback == 'true'
        run: node --test tests/ui-state-feedback-core.test.mjs

      - name: Run Deck save ACK core tests
        if: steps.classify.outputs.deck_ack == 'true'
        run: node --test tests/deck-save-ack-core.test.mjs

      - name: Run Battle self remaining deck inspect core tests
        if: steps.classify.outputs.self_deck == 'true'
        run: node --test tests/battle-self-deck-inspect-core.test.mjs

      - name: Run Partner VTuber public context boundary tests
        if: steps.classify.outputs.partner_vtuber == 'true'
        run: node --test tests/partner-vtuber-public-context-core.test.mjs

      - name: Verify formal Roblox placement
        if: steps.classify.outputs.roblox == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="roblox/GAMEROAD.rbxlx"
          expected_sha256="b5eb61ae6eca8d3c06a0ae5593ea41479e7597d6e8e8e7b6d941dafceaaa3d51"

          if [[ ! -f "${target}" ]]; then
            echo "Required formal Roblox placement is missing: ${target}"
            exit 1
          fi

          actual_sha256="$(sha256sum "${target}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "Roblox placement SHA-256 mismatch."
            echo "expected=${expected_sha256}"
            echo "actual=${actual_sha256}"
            exit 1
          fi

          python3 - "${target}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except ET.ParseError as exc:
              raise SystemExit(f"Roblox placement XML parse failed: {exc}")

          tag = root.tag.rsplit('}', 1)[-1]
          if tag != "roblox":
              raise SystemExit(f"Roblox placement root must be <roblox>, got <{tag}>")
          if not root.attrib.get("version"):
              raise SystemExit("Roblox placement root is missing the version attribute")

          print(f"Roblox placement verified: root={tag} version={root.attrib['version']}")
          PY

      - name: Install Playwright and Chromium
        if: steps.classify.outputs.browser == 'true' || steps.classify.outputs.dino == 'true' || steps.classify.outputs.learning == 'true'
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Run Browser runtime smoke
        if: steps.classify.outputs.browser == 'true'
        run: npx playwright test --config=playwright.config.mjs --workers=1

      - name: Run Browser full interaction evidence
        if: steps.classify.outputs.browser == 'true'
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1

      - name: Run DINO DIG mobile whitebox smoke
        if: steps.classify.outputs.dino == 'true'
        run: npx playwright test --config=playwright.dino-dig.config.mjs --workers=1

      - name: Run Learning Crossmedia whitebox smoke
        if: steps.classify.outputs.learning == 'true'
        run: npx playwright test --config=playwright.learning-crossmedia.config.mjs --workers=1

      - name: Fail closed on unclassified executable or CI paths
        if: always() && steps.classify.outputs.unclassified == 'true'
        run: |
          echo "Required gate has no approved test mapping for these executable/CI paths:"
          cat /tmp/gameroad-unclassified.txt
          exit 1
