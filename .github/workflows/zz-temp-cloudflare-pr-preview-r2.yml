name: GAMEROAD Codex Shared Preview Route Diagnostic R3

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762
  PREVIEW_ALIAS_URL: https://codex-shared.gameroad-browser-r5.pages.dev

jobs:
  diagnose:
    name: Compare public root and local-test path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe and compare shared routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-diagnostic
          for path in / /index.html /gameroad-version.json /browser/GAMEROAD.html; do
            safe="$(printf '%s' "$path" | tr '/.' '__')"
            out="route-diagnostic/${safe}.body"
            code="$(curl --silent --show-error --location --header 'Accept-Encoding: identity' --header 'Cache-Control: no-cache' --connect-timeout 10 --max-time 60 --output "$out" --write-out '%{http_code}' "$PREVIEW_ALIAS_URL$path" || true)"
            bytes="$(wc -c < "$out" 2>/dev/null || echo 0)"
            sha="$(sha256sum "$out" 2>/dev/null | awk '{print $1}' || true)"
            ctype="$(curl --silent --show-error --head --location --max-time 30 "$PREVIEW_ALIAS_URL$path" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print substr($0,index($0,":")+2);exit}' || true)"
            printf 'ROUTE path=%s code=%s bytes=%s sha256=%s content_type=%s\n' "$path" "$code" "$bytes" "$sha" "$ctype" | tee -a route-diagnostic/result.txt
          done
          root_sha="$(sha256sum route-diagnostic/_.body | awk '{print $1}')"
          index_sha="$(sha256sum route-diagnostic/_index_html.body | awk '{print $1}')"
          browser_sha="$(sha256sum route-diagnostic/_browser_GAMEROAD_html.body | awk '{print $1}')"
          echo "COMPARE root_eq_index=$([[ "$root_sha" = "$index_sha" ]] && echo true || echo false) root_eq_browser=$([[ "$root_sha" = "$browser_sha" ]] && echo true || echo false)" | tee -a route-diagnostic/result.txt
          cat route-diagnostic/result.txt

      - name: Upload route diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gameroad-codex-shared-route-diagnostic
          path: route-diagnostic/
          if-no-files-found: error
          retention-days: 7
