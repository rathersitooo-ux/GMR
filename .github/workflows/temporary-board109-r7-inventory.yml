name: TEMP BOARD109 R7 lowPerf runtime v9

on:
  push:
    branches:
      - work/BOARD-109-R7-CORNERFIX-20260816T1004-SOL

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - name: Verify exact product and add runner-only observation bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "BOARD109_R7_LOWPERF_RUNTIME_V9"
          test "$(git rev-parse HEAD^)" = "4f3de5d355b7621194a3929fdfc081fd51a4878c"
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "0535bf3a37f9afdab3b0cddbc23e7aa610fcbc15"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('browser/GAMEROAD.html');raw=p.read_bytes()
          assert len(raw)==11816410
          assert hashlib.sha256(raw).hexdigest()=='cbdc9c679282466a430ad81e7ce391cf4d0f159b971c9946ba910eb322a1d36a'
          bom=raw.startswith(b'\xef\xbb\xbf');text=raw.decode('utf-8-sig')
          assert 'id="lowPerf"' in text and 'settings:{reduceMotion:false,lowPerf:false' in text
          anchor='window.__V105_ABILITY_TEST__={'
          names=['cornerRoadIds','neighbors','reachable','shortest','renderBoard','selectEndpoint','animateResolvedPath','renderField3D','nodeWorld','nodeTopSurface','nearestProjectedNode','projectionFor','roadSelectable','normalMoveLimitForRoad','fieldProjection']
          pairs=[]
          for n in names:
              if n=='fieldProjection': pairs.append("fieldProjection:typeof fieldProjection!=='undefined'?()=>fieldProjection:null")
              else: pairs.append(f"{n}:typeof {n}==='function'?{n}:null")
          bridge="window.__BOARD109_R7_INTERNAL_TEST__=()=>({"+','.join(pairs)+"});\n"
          assert text.count(anchor)==1 and '__BOARD109_R7_INTERNAL_TEST__' not in text
          text=text.replace(anchor,bridge+anchor,1)
          out=text.encode('utf-8');out=(b'\xef\xbb\xbf'+out) if bom else out;p.write_bytes(out)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Run lowPerf setting through real UI and exact four-corner semantics
        shell: bash
        run: |
          mkdir -p .tmp-board109-r7/tests
          cat > .tmp-board109-r7/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({testDir:'./tests',testMatch:'lowperf.spec.mjs',timeout:90000,workers:1,retries:0,reporter:[['line']],use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1 --directory ..',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}});
          EOF
          cat > .tmp-board109-r7/tests/lowperf.spec.mjs <<'EOF'
          import {test,expect} from '@playwright/test';
          const CORNERS=['K:NW','K:NE','K:SW','K:SE'];
          async function legalDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__,pub=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id)),std=window.__CARD_DATA__.filter(c=>pub.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id),roy=['SP_J','SP_Q','SP_K'],non=std.filter(id=>!t.isRoyalCard(id)),main=[...non.slice(0,37),...roy],set=t.deckSetDraft(main,[]),commit=set.ok?t.deckCommit():false;return{count:main.length,set,commit,val:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          test('real lowPerf UI preserves accepted corner runtime semantics',async({page})=>{
            const pageErrors=[],consoleErrors=[],unexpected=[];let known404=0;
            page.on('pageerror',e=>pageErrors.push(e.message));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('response',r=>{if(r.status()<400)return;const u=new URL(r.url());if(r.status()===404&&u.pathname.endsWith('/browser/gameroad-version.json')){known404++;return}unexpected.push(`${r.status()} ${u.pathname}`)});
            const r=await page.goto('/browser/GAMEROAD.html',{waitUntil:'domcontentloaded'});expect(r?.ok()).toBeTruthy();await page.waitForTimeout(600);
            await page.evaluate(()=>window.__GAMEROAD_TEST__.show('settings'));
            const low=page.locator('#lowPerf');await expect(low).toBeVisible();expect(await page.evaluate(()=>window.__GAMEROAD_TEST__.state.settings.lowPerf)).toBeFalsy();await low.click();expect(await page.evaluate(()=>window.__GAMEROAD_TEST__.state.settings.lowPerf)).toBeTruthy();
            const d=await legalDeck(page);expect(d.count).toBe(40);expect(d.set.ok).toBeTruthy();expect(d.commit).toBeTruthy();expect(d.val.ok,JSON.stringify(d.val)).toBeTruthy();
            const ev=await page.evaluate(async(corners)=>{
              const core=window.__GAMEROAD_TEST__,q=window.__BOARD109_R7_INTERNAL_TEST__();for(const [k,v] of Object.entries(q))if(typeof v!=='function')throw Error(`missing ${k}`);if(!core.state.settings.lowPerf)throw Error('lowPerf not enabled');
              const m=core.start('4p','road_shield');if(!m||m.players.length!==4)throw Error('4p start failed');const players=m.players,me=players[0],filler=window.__CARD_DATA__.find(c=>c?.id)?.id;for(const p of players){p.lanes.L=[filler];p.lanes.C=[];p.lanes.R=[filler]}
              const ids=window.__CARD_DATA__.map(c=>c.id),move=ids.find(id=>q.roadSelectable(id)&&q.normalMoveLimitForRoad(id)>=1),battle=ids.find(id=>id!==move&&q.roadSelectable(id));me.hand=[move,battle];const accepted={'K:NW':[['N','L'],['W','R']],'K:NE':[['N','R'],['E','L']],'K:SW':[['S','R'],['W','L']],'K:SE':[['S','L'],['E','R']]};
              for(const viewer of players){const oba=Object.fromEntries(Object.entries(q.projectionFor(viewer)).map(([owner,arm])=>[arm,owner]));for(const k of corners){const ex=accepted[k].map(([arm,lane])=>`R:${oba[arm]}:${lane}:1`);if(JSON.stringify(q.neighbors(k,viewer))!==JSON.stringify(ex))throw Error(`${viewer.id}/${k} neighbors`);for(const road of ex)if(!q.neighbors(road,viewer).includes(k))throw Error(`${viewer.id}/${road} reverse`)}}
              const per={};for(const k of corners){const roads=q.cornerRoadIds(k,me),start=roads[0];me.position=start;me.plan={roadId:move,battleId:battle,path:[start]};const path=q.shortest(start,k,1,me);if(JSON.stringify(path)!==JSON.stringify([start,k]))throw Error(`${k} shortest`);q.renderBoard();const el=document.querySelector(`#board .node[data-pos="${k}"]`);if(!el||el.disabled||!el.classList.contains('reachable')||getComputedStyle(el).pointerEvents==='none')throw Error(`${k} DOM`);q.selectEndpoint(k);if(JSON.stringify(me.plan.path)!==JSON.stringify([start,k]))throw Error(`${k} select`);await q.animateResolvedPath(me);if(me.position!==k)throw Error(`${k} stop`);me.plan={roadId:move,battleId:battle,path:[k]};const out=q.reachable(me,1),outRoads=[...out].filter(([id,d])=>d===1&&id.startsWith('R:')).map(([id])=>id).sort();if(JSON.stringify(outRoads)!==JSON.stringify([...roads].sort()))throw Error(`${k} exits`);q.renderBoard();q.renderField3D();const fp=q.fieldProjection().get(k),rect=document.querySelector('#battleMap').getBoundingClientRect(),hit=q.nearestProjectedNode(rect.left+fp.x/100*rect.width,rect.top+fp.y/100*rect.height,true);if(hit!==k)throw Error(`${k} hit ${hit}`);per[k]={roads,stopped:me.position,hit}}
              return{lowPerf:core.state.settings.lowPerf,boardCount:core.boardCount(),projectionIndependent:core.projectionIndependent(),per};
            },CORNERS);
            const remaining=[...consoleErrors];for(let i=0;i<known404;i++){const ix=remaining.findIndex(x=>x.includes('Failed to load resource')&&x.includes('404'));if(ix>=0)remaining.splice(ix,1)}console.log('BOARD109_R7_LOWPERF '+JSON.stringify({...ev,runtimeErrors:{pageErrors,consoleErrors:remaining,unexpected,known404}}));expect(ev.lowPerf).toBeTruthy();expect(ev.boardCount).toBe(109);expect(ev.projectionIndependent).toBeTruthy();expect(Object.keys(ev.per)).toEqual(CORNERS);expect(pageErrors).toEqual([]);expect(unexpected).toEqual([]);expect(remaining).toEqual([]);
          });
          EOF
          npx playwright test --config=.tmp-board109-r7/playwright.config.mjs --workers=1
