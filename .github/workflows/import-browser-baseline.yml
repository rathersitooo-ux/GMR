name: Import exact Browser baseline

on:
  push:
    branches:
      - work/GITHUB-BROWSER-CODE-PLACEMENT-001
    paths:
      - .github/workflows/import-browser-baseline.yml

permissions:
  contents: write

jobs:
  import-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact Drive Browser and verify bytes
        shell: bash
        env:
          DRIVE_FILE_ID: 1UeSrt8K0E79ma1t3iW4uw8a860NTJ5rI
          EXPECTED_SIZE: "11794881"
          EXPECTED_SHA256: 5e31760d6efb909c8e74759001cc59def51deda5a6af81602a705325c994065b
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/GITHUB-BROWSER-CODE-PLACEMENT-001"
          test ! -e browser/GAMEROAD.html

          tmp="$RUNNER_TEMP/GAMEROAD.html"
          rm -f "$tmp"

          urls=(
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&confirm=t&id=${DRIVE_FILE_ID}"
          )

          matched=0
          for url in "${urls[@]}"; do
            rm -f "$tmp"
            if ! curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --user-agent "Mozilla/5.0 GAMEROAD-GitHub-Import" "$url" --output "$tmp"; then
              continue
            fi
            size="$(wc -c < "$tmp" | tr -d ' ')"
            sha="$(sha256sum "$tmp" | awk '{print $1}')"
            echo "download candidate size=$size sha256=$sha"
            if [ "$size" = "$EXPECTED_SIZE" ] && [ "$sha" = "$EXPECTED_SHA256" ]; then
              matched=1
              break
            fi
          done

          if [ "$matched" -ne 1 ]; then
            echo "Drive download did not match the exact CURRENT Browser bytes." >&2
            exit 41
          fi

          mkdir -p browser
          mv "$tmp" browser/GAMEROAD.html

          final_size="$(wc -c < browser/GAMEROAD.html | tr -d ' ')"
          final_sha="$(sha256sum browser/GAMEROAD.html | awk '{print $1}')"
          test "$final_size" = "$EXPECTED_SIZE"
          test "$final_sha" = "$EXPECTED_SHA256"

          {
            echo "### Exact Browser import verification"
            echo "- size: $final_size"
            echo "- sha256: $final_sha"
            echo "- source Drive file: $DRIVE_FILE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exact Browser bytes to this work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- browser/GAMEROAD.html
          test -n "$(git diff --cached --name-only -- browser/GAMEROAD.html)"
          git commit -m "[GITHUB-BROWSER-CODE-PLACEMENT-001] import exact Drive Browser baseline"
          commit_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          {
            echo "- browser commit: $commit_sha"
            echo "- branch: $GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
