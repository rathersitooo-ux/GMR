name: TEMP Battle turn-loop root R1

on:
  push:
    branches:
      - fix/battle-new-base-turn-loop-root-r1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate PRE_ACTION witness
        shell: bash
        run: |
          set -euo pipefail
          BASE=957e92ac9fb3744d996fd90d5abe626d3d21d1e0
          MANIFEST=data/preaction-authorizations/BATTLE-TURN-LOOP-ROOT-R1-20260916T1157-SOL.json
          FIRST=$(git rev-list --reverse "$BASE"..HEAD | head -1)
          test -n "$FIRST"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$FIRST")" = "$MANIFEST"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateManifest } from './tools/preaction-authorization-validator.mjs';
          const path='data/preaction-authorizations/BATTLE-TURN-LOOP-ROOT-R1-20260916T1157-SOL.json';
          const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
          const result=validateManifest(manifest,path,{nowMs:Date.now()});
          console.log('PREACTION_WITNESS=' + JSON.stringify(result));
          if(!result.ok) process.exit(1);
          NODE
      - name: Diagnose live Battle seams
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path = 'browser/GAMEROAD.html';
          const s = fs.readFileSync(path, 'utf8');
          console.log('HTML_SHA256=' + crypto.createHash('sha256').update(s).digest('hex'));
          const needles = [
            'function commitPlans',
            'function resolveBattle',
            'function checkWin',
            "state.phase='target'",
            'confirmTarget',
            'targetBox',
            'dedicatedBattlePhase',
            'battlePhaseSurface',
            'opponentId',
            'shieldLane',
            'jankenHand',
            'publicCards',
            'battleId',
            'roadId',
            'foundation.length>=7',
            'endMatch()'
          ];
          for (const needle of needles) {
            let count = 0, from = 0, first = -1;
            while ((from = s.indexOf(needle, from)) !== -1) {
              if (first < 0) first = from;
              count++;
              from += Math.max(1, needle.length);
            }
            console.log(`COUNT ${JSON.stringify(needle)} ${count}`);
            if (first >= 0) {
              const a = Math.max(0, first - 1800);
              const b = Math.min(s.length, first + needle.length + 3600);
              console.log(`SNIP ${JSON.stringify(needle)} START=${a} END=${b}`);
              console.log(s.slice(a,b));
              console.log('END_SNIP');
            }
          }
          NODE
