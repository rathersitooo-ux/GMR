name: TEMP Records Historical Deck R12

on:
  push:
    branches: [sol/records-used-deck-r12-20260911]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/records-used-deck-r12-20260911

      - name: Apply exact candidate only in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html'); s=p.read_text(encoding='utf-8')
          a="partner:state.selectedPartnerId,battlePointsEarned:points.earned"
          b="partner:state.selectedPartnerId,deckStartSnapshot:safeClone(m.deckStartSnapshot),battlePointsEarned:points.earned"
          c="d.className='record';d.innerHTML=`<b>${h.mode.toUpperCase()} / ${h.rank}位</b><span>${h.rounds}巡</span>`"
          d="d.className='record';d.__gameroadHistoryEntry=h;d.innerHTML=`<b>${h.mode.toUpperCase()} / ${h.rank}位</b><span>${h.rounds}巡</span>`"
          if s.count(a)!=1 or s.count(c)!=1: raise SystemExit(f'anchors producer={s.count(a)} row={s.count(c)}')
          p.write_text(s.replace(a,b,1).replace(c,d,1),encoding='utf-8')
          PY
          git diff --check
          node tests/browser-static-check.mjs
          node --test tests/cards-deck-presentation.test.mjs tests/profile-presentation-runtime-mount.test.mjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Create isolated live Records proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-records && mkdir -p .tmp-records
          cat > .tmp-records/records.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('Records historical Deck survives current Deck change', async ({ page }, testInfo) => {
            test.setTimeout(120_000);
            const cdp = await page.context().newCDPSession(page);
            await page.route('**/gameroad-version.json*', async (route) => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ build_id: 'records-r12-evidence' }) });
            });
            const response = await page.goto('http://127.0.0.1:4173/browser/GAMEROAD.html', { waitUntil: 'commit' });
            expect(response?.ok()).toBeTruthy();
            await page.waitForTimeout(900);
            await cdp.send('Page.stopLoading');
            const boot = await page.evaluate(() => ({ readyState: document.readyState, hasTestApi: Boolean(window.__GAMEROAD_TEST__), screenCount: document.querySelectorAll('section[data-screen]').length }));
            expect(boot.hasTestApi, JSON.stringify(boot)).toBeTruthy();
            expect(boot.screenCount, JSON.stringify(boot)).toBeGreaterThan(0);

            const driven = await page.evaluate(async () => {
              const t=window.__GAMEROAD_TEST__;
              const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));
              const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);
              const royal=['SP_J','SP_Q','SP_K'];
              const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));
              const makeDeck=o=>[...nonRoyal.slice(o,o+37),...royal];
              const deckA=makeDeck(0), va=t.deckValidate({main:deckA,ex:[]},{forBattle:true});
              t.deckSetDraft(deckA,[]); if(!va.ok||!t.deckCommit()) return {ok:false,stage:'deckA',va};
              t.battlePresentationFast(true); const match=t.start('2p','road_shield'); window.__V105_ABILITY_TEST__?.setAutoChoices?.(true);
              const reached=await t.autoToResult(30);
              const historicalBefore=[...(t.state.history?.[0]?.deckStartSnapshot?.deck?.main??[])];
              let deckB=null;
              for(let o=1;o<=8;o+=1){const x=makeDeck(o);if(x.length===40&&JSON.stringify(x)!==JSON.stringify(deckA)&&t.deckValidate({main:x,ex:[]},{forBattle:true}).ok){deckB=x;break}}
              if(!deckB) return {ok:false,stage:'deckB',reached,nonRoyalCount:nonRoyal.length};
              t.deckSetDraft(deckB,[]); const committedB=t.deckCommit();
              const historicalAfter=[...(t.state.history?.[0]?.deckStartSnapshot?.deck?.main??[])], currentDeck=[...t.deckSaved().main];
              const deckAOnly=deckA.find(id=>!deckB.includes(id))??null, deckBOnly=deckB.find(id=>!deckA.includes(id))??null;
              t.show('records');
              const row=document.querySelector('#recordsList .record'); const selectable=row?.dataset.recordsSelectable??null, bound=Boolean(row?.__gameroadHistoryEntry); row?.click();
              const detail=document.querySelector('#recordsMatchDetail'), detailText=detail?.innerText??'';
              return {ok:true,reached,matchId:match?.id??null,committedB,deckA,deckB,historicalBefore,historicalAfter,currentDeck,deckAOnly,deckBOnly,selectable,bound,detailHidden:detail?.hidden??true,detailText};
            });
            expect(driven.ok, JSON.stringify(driven)).toBeTruthy();
            expect(driven.reached, JSON.stringify(driven)).toBeTruthy();
            expect(driven.committedB).toBeTruthy();
            expect(driven.historicalBefore).toEqual(driven.deckA);
            expect(driven.historicalAfter).toEqual(driven.deckA);
            expect(driven.currentDeck).toEqual(driven.deckB);
            expect(driven.historicalAfter).not.toEqual(driven.currentDeck);
            expect(driven.deckAOnly).not.toBeNull(); expect(driven.deckBOnly).not.toBeNull();
            expect(driven.selectable).toBe('true'); expect(driven.bound).toBeTruthy(); expect(driven.detailHidden).toBeFalsy();
            expect(driven.detailText).toContain(driven.deckAOnly); expect(driven.detailText).not.toContain(driven.deckBOnly);
            await testInfo.attach('records-historical-deck-r12.png',{body:await page.screenshot({fullPage:true,animations:'disabled'}),contentType:'image/png'});
          });
          EOF
          cat > .tmp-records/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({testDir:'.',testMatch:'records.spec.mjs',timeout:120000,expect:{timeout:7000},workers:1,retries:0,outputDir:'test-results',reporter:[['line']],use:{browserName:'chromium',headless:true,trace:'retain-on-failure',screenshot:'only-on-failure',video:'off'},projects:[{name:'desktop-1280x720',use:{viewport:{width:1280,height:720}}}]});
          EOF

      - name: Run isolated live Records proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/records-r12-http.log 2>&1 &
          HTTP_PID=$!; trap 'kill $HTTP_PID || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/browser/GAMEROAD.html >/dev/null && break || sleep 1; done
          npx playwright test --config=.tmp-records/playwright.config.mjs --workers=1

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-historical-deck-r12-${{ github.run_id }}
          path: .tmp-records/test-results/
          if-no-files-found: warn
          retention-days: 14
