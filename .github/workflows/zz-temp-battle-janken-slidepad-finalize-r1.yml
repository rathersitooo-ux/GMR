name: TEMP Battle Janken SlidePad Finalize R1
on:
  push:
    branches:
      - work/battle-janken-slidepad-live-r1-20260902
    paths:
      - .github/workflows/zz-temp-battle-janken-slidepad-finalize-r1.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/battle-janken-slidepad-live-r1-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch existing consumers and validate
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          adapter = Path('browser/battle-replay-live-adapter.mjs')
          text = adapter.read_text()
          import_line = "import './battle-janken-slidepad-runtime-mount.mjs';\n"
          if import_line not in text:
              text = import_line + text
          adapter.write_text(text)

          build = Path('deploy/cloudflare/scripts/build.mjs')
          text = build.read_text()
          marker = "  { option: 'battleConveyorCoreSource', expected: 'expectedBattleConveyorCoreBlob', source: 'browser/battle-conveyor-presentation-core.mjs'"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('build artifact insertion marker missing')
          artifact_lines = (
              "  { source: 'browser/battle-janken-slidepad-runtime-mount.mjs', output: 'battle-janken-slidepad-runtime-mount.mjs', artifact: 'battle_janken_slidepad_runtime_mount', label: 'Battle janken SlidePad runtime mount' },\n"
              "  { source: 'browser/new-base-round-start-janken-slot-assignment-core.mjs', output: 'new-base-round-start-janken-slot-assignment-core.mjs', artifact: 'new_base_round_start_janken_slot_assignment_core', label: 'Round-start janken slot assignment core' },\n"
              "  { source: 'browser/new-base-fixed-janken-slot-state.mjs', output: 'new-base-fixed-janken-slot-state.mjs', artifact: 'new_base_fixed_janken_slot_state', label: 'Fixed janken slot state' },\n"
          )
          if 'battle_janken_slidepad_runtime_mount' not in text:
              text = text[:pos] + artifact_lines + text[pos:]
          build.write_text(text)

          build_test = Path('deploy/cloudflare/tests/build.test.mjs')
          text = build_test.read_text()
          old_blob = 'cb3ba74e38a59b951dc6e38bfcaeea724b188bba'
          new_blob = '6721a1f1f7204ae2de529bf924d028b5fe111fe0'
          if old_blob not in text and new_blob not in text:
              raise SystemExit('battle replay adapter blob pin missing')
          text = text.replace(old_blob, new_blob)
          build_test.write_text(text)

          bfi = Path('tests/browser-full-interaction.spec.mjs')
          text = bfi.read_text()
          if 'data-battle-janken-slidepad' not in text:
              old = "  await expect(battle).toBeVisible();\n  await expect(battle.locator('#publicPlayerStrip .publicPlayerChip')).toHaveCount(4);"
              new = """  await expect(battle).toBeVisible();
          const jankenSlidePad = battle.locator('[data-battle-janken-slidepad=\"1\"]');
          await expect(jankenSlidePad).toBeVisible();
          await expect(jankenSlidePad.locator('[data-janken-slot]')).toHaveCount(3);
          await expect.poll(async () => page.evaluate(() => window.__GAMEROAD_BATTLE_JANKEN_SLIDEPAD__?.snapshot?.()?.roundId ?? null)).not.toBeNull();
          const jankenSnapshot = await page.evaluate(() => window.__GAMEROAD_BATTLE_JANKEN_SLIDEPAD__?.snapshot?.() ?? null);
          expect(jankenSnapshot?.ordinaryHandCardIds?.length).toBeGreaterThan(0);
          for (const cardId of jankenSnapshot?.assignment?.selectedJankenCardIds ?? []) {
            await expect(battle.locator(`#hand .handCard[data-card-id=\"${cardId}\"]`)).toHaveCount(1);
          }
          await expect(battle.locator('#publicPlayerStrip .publicPlayerChip')).toHaveCount(4);"""
              if old not in text:
                  raise SystemExit('BFI battle entry marker missing')
              text = text.replace(old, new, 1)
          bfi.write_text(text)
          PY

          node --check browser/battle-janken-slidepad-runtime-mount.mjs
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs tests/new-base-round-start-janken-slot-assignment-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

          rm -f data/preaction-authorizations/BATTLE-JANKEN-SLIDEPAD-LIVE-R1-20260902T2251-SOL-K7M4Q2.json
          rm -f .github/workflows/zz-temp-battle-janken-slidepad-live-r1.yml
          rm -f .github/workflows/zz-temp-battle-janken-slidepad-finalize-r1.yml
          git config user.name gameroad-exact-patch-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(battle): connect janken SlidePad to live hand'
          git push origin HEAD:work/battle-janken-slidepad-live-r1-20260902
