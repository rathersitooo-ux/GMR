name: TEMP Battle card flight public deps R1

on:
  push:
    branches:
      - sol/battle-card-flight-public-deps-r1-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    if: startsWith(github.event.head_commit.message, 'RUN_CARD_FLIGHT_PUBLIC_DEPS:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add exact flight dependencies to public package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/cloudflare/scripts/build.mjs')
          text = path.read_text()
          anchor = "  { source: 'browser/battle-janken-slidepad-runtime-mount.mjs', output: 'battle-janken-slidepad-runtime-mount.mjs', artifact: 'battle_janken_slidepad_runtime_mount', label: 'Battle janken SlidePad runtime mount' },\n"
          additions = (
              "  { source: 'browser/battle-card-release-flight-motion-core.mjs', output: 'battle-card-release-flight-motion-core.mjs', artifact: 'battle_card_release_flight_motion_core', label: 'Battle card release flight motion core' },\n"
              "  { source: 'browser/battle-card-release-flight-runtime-effect.mjs', output: 'battle-card-release-flight-runtime-effect.mjs', artifact: 'battle_card_release_flight_runtime_effect', label: 'Battle card release flight runtime effect' },\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one janken runtime artifact anchor, found {text.count(anchor)}')
          for line in additions:
              if line in text:
                  raise SystemExit('flight dependency already packaged; abort rather than duplicate')
          path.write_text(text.replace(anchor, anchor + ''.join(additions), 1))
          PY
      - name: Run focused motion/effect and Cloudflare build tests
        shell: bash
        run: |
          node --test tests/battle-card-release-flight-motion-core.test.mjs tests/battle-card-release-flight-runtime-effect.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Assert exact package entries
        shell: bash
        run: |
          grep -F "browser/battle-card-release-flight-motion-core.mjs" deploy/cloudflare/scripts/build.mjs
          grep -F "browser/battle-card-release-flight-runtime-effect.mjs" deploy/cloudflare/scripts/build.mjs
      - name: Commit durable package change and remove transient executor
        shell: bash
        run: |
          git config user.name 'gameroad-flight-bot'
          git config user.email 'gameroad-flight-bot@users.noreply.github.com'
          git rm .github/workflows/zz-temp-battle-card-flight-public-deps-r1.yml
          git rm tools/temp-battle-card-flight-public-deps-r1.py
          git rm data/preaction-authorizations/BATTLE-CARD-FLIGHT-PUBLIC-DEPS-R1-20260909T1745-SOL-MO35-Q4N9K4.json
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m 'Battle: package card release flight dependencies'
          git push origin HEAD:sol/battle-card-flight-public-deps-r1-20260909
