name: Deck Highlander Conformance

on:
  push:
    branches:
      - 'work/DECK-HIGHLANDER-RUNTIME-ENFORCEMENT-001-R1'
    paths:
      - 'tests/deck-highlander-conformance.spec.mjs'
      - 'playwright.deck-highlander.config.mjs'
      - '.github/workflows/deck-highlander-conformance.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tests/deck-highlander-conformance.spec.mjs'
      - 'playwright.deck-highlander.config.mjs'
      - '.github/workflows/deck-highlander-conformance.yml'

permissions:
  contents: read

jobs:
  chromium-mobile-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated Deck Highlander conformance
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx playwright test --config=playwright.deck-highlander.config.mjs --workers=1 --timeout=30000 2>&1 | tee deck-highlander-test-output.txt
          status=${PIPESTATUS[0]}
          if [[ "${status}" -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('deck-highlander-test-output.txt').read_text(errors='replace')[-6000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=tests/deck-highlander-conformance.spec.mjs,title=Deck Highlander Playwright failure::{escaped}')
          PY
          fi
          exit "${status}"

      - name: Upload conformance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deck-highlander-conformance-${{ github.run_id }}
          path: |
            playwright-report-deck-highlander/
            test-results/
            deck-highlander-test-output.txt
          if-no-files-found: warn
          retention-days: 14
