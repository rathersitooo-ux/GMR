name: Battle recent public history R2 scoped patch

on:
  push:
    branches:
      - sol/battle-recent-public-history-r2-20260905
    paths:
      - .github/workflows/battle-recent-history-r2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-recent-public-history-r2-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply owned patch
        run: python3 tools/battle-recent-history-r2-patch.py
      - name: Focused replay regression
        run: node --test tests/battle-replay-live-adapter.test.mjs
      - name: Commit product patch and remove transient transport
        shell: bash
        run: |
          rm -f .github/workflows/battle-recent-history-r2-patch.yml
          rm -f tools/battle-recent-history-r2-patch.py
          rm -f data/preaction-authorizations/BATTLE-RECENT-HISTORY-R2-20260905T1051-SOL-H5K8P3.json
          git config user.name gameroad-scoped-patch
          git config user.email gameroad-scoped-patch@users.noreply.github.com
          git add -A browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs .github/workflows/battle-recent-history-r2-patch.yml tools/battle-recent-history-r2-patch.py data/preaction-authorizations/BATTLE-RECENT-HISTORY-R2-20260905T1051-SOL-H5K8P3.json
          git commit -m 'Battle: add compact recent public history'
          git push origin HEAD:sol/battle-recent-public-history-r2-20260905
