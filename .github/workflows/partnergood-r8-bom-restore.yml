name: PARTNER-GOODMOVE R8 BOM-only cleanup

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'work/partnergood-r8-orphan-prodhtml-20260819' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore only the original UTF-8 BOM and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/GAMEROAD.html)" = "e33169ce35db4d1dc851c3607469f812aaf8c223"
          test "$(git show origin/main:browser/GAMEROAD.html | git hash-object --stdin)" = "4485af3c1aabd7fdf2001a9e2586afbf7443ff53"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = ".github/workflows/partnergood-r8-bom-restore.yml browser/GAMEROAD.html "
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          b=p.read_bytes()
          bom=b'\xef\xbb\xbf'
          assert not b.startswith(bom)
          assert b.count(b'PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R8 production mount') == 1
          p.write_bytes(bom+b)
          PY
          test "$(grep -c 'PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R8 production mount' browser/GAMEROAD.html)" = "1"
          git config user.name "gameroad-r8-executor"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/partnergood-r8-bom-restore.yml
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/partnergood-r8-bom-restore.yml browser/GAMEROAD.html "
          git commit -m "PARTNER-GOODMOVE R8: restore original HTML BOM"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "browser/GAMEROAD.html "
          git push origin HEAD:work/partnergood-r8-orphan-prodhtml-20260819
