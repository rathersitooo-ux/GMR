name: R52 Setup Recovery Executor

on:
  push:
    branches:
      - work/r52-setup-invalid-deck-recovery
    paths:
      - .github/workflows/r52-setup-recovery-executor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r52-setup-invalid-deck-recovery
          fetch-depth: 0
      - name: Apply guarded Setup recovery grid repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text(encoding='utf-8')
          old = '.setup.active .setupBox>.k, .setup.active .setupBox>.contentRow, .setup.active .setupBox>.modeRow, .setup.active .setupBox>.setupDeckNote, .setup.active .setupBox>#startMatch, .setup.active .setupBox>#friendRoomEntry{grid-column:1/-1}'
          new = '.setup.active .setupBox>.k, .setup.active .setupBox>.contentRow, .setup.active .setupBox>.modeRow, .setup.active .setupBox>.setupDeckRecovery, .setup.active .setupBox>.setupDeckNote, .setup.active .setupBox>#startMatch, .setup.active .setupBox>#friendRoomEntry{grid-column:1/-1}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exact old selector once, got {s.count(old)}')
          if '.setup.active .setupBox>.setupDeckRecovery,' in s:
              raise SystemExit('target wrapper selector already present')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- browser/GAMEROAD.html
      - name: Remove temporary executor and commit durable product diff
        shell: bash
        run: |
          rm .github/workflows/r52-setup-recovery-executor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html .github/workflows/r52-setup-recovery-executor.yml
          git diff --cached --check
          git commit -m 'R52: make Setup deck recovery span full grid width'
          git push origin HEAD:work/r52-setup-invalid-deck-recovery
