name: Cards Favorite Hit Access R5

on:
  push:
    branches:
      - sol/cards-favorite-hitaccess-r5-20260906

permissions:
  contents: write

env:
  BASE_SHA: 77777f15cc263a33ff9bb8ec1de7e896c979223b
  ACQUIRE_KEY: CARDS-FAVORITE-HITACCESS-R5-20260906T0539-SOL-M8Q4K7
  MANIFEST: data/preaction-authorizations/CARDS-FAVORITE-HITACCESS-R5-20260906T0539-SOL-M8Q4K7.json
  WORKFLOW_FILE: .github/workflows/cards-favorite-hitaccess-r5-executor.yml
  PRODUCT_FILE: browser/cards-deck-presentation.mjs
  TEST_FILE: tests/home-cards-2p5d-runtime.spec.mjs

jobs:
  repair-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact owned branch
        uses: actions/checkout@v4
        with:
          ref: sol/cards-favorite-hitaccess-r5-20260906
          fetch-depth: 0

      - name: Verify current authorization and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 'gameroad-preaction-v3',
              'recordId': os.environ['ACQUIRE_KEY'],
              'taskId': 'BROWSER-PLAYGLOBAL-VISUAL-SHELL-REVIEW-001',
              'workUnitKey': 'CARDS_FAVORITE_HITACCESS_LIVE_R5',
              'authorizationBaseSha': os.environ['BASE_SHA'],
              'leaseAuthority': 'CURRENT_ACTIVE_LEASES',
              'leaseState': 'ACTIVE',
          }
          for key, value in expected.items():
              if m.get(key) != value:
                  raise SystemExit(f'PRE_ACTION mismatch {key}: {m.get(key)!r} != {value!r}')
          if not m.get('diagnosticCaptured') or m.get('diagnosticRunId') != '33991263168':
              raise SystemExit('R5 real-Chromium diagnostic not captured')
          PY

      - name: Apply one-file flow-layout repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PRODUCT_FILE'])
          text = p.read_text(encoding='utf-8')
          old_mount = """  grid.before?.(host);\n  if (!host.parentNode) screen.insertBefore?.(host, grid) ?? screen.appendChild?.(host);"""
          new_mount = """  grid.prepend?.(host);\n  if (!host.parentNode) grid.insertBefore?.(host, grid.firstChild ?? null) ?? grid.appendChild?.(host);"""
          if text.count(old_mount) != 1:
              raise SystemExit(f'expected exact findability mount seam once, found {text.count(old_mount)}')
          text = text.replace(old_mount, new_mount)
          old_style = '[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}'
          new_style = '[data-role="cards-deck-findability"]{display:flex;align-items:center;gap:8px;flex-wrap:wrap;grid-column:1/-1;min-width:0;margin:6px 0 10px}'
          if text.count(old_style) != 1:
              raise SystemExit(f'expected exact findability style seam once, found {text.count(old_style)}')
          text = text.replace(old_style, new_style)
          p.write_text(text, encoding='utf-8')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$PRODUCT_FILE"
          git diff --check
          git diff -- "$PRODUCT_FILE"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Run real Chromium favorite hit-access and persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          cp "$TEST_FILE" /tmp/home-cards-2p5d-runtime.spec.mjs
          trap 'cp /tmp/home-cards-2p5d-runtime.spec.mjs "$TEST_FILE"' EXIT
          cat >> "$TEST_FILE" <<'EOF'

          test('R5 Cards favorite controls and cards are physically hit-accessible across target viewports', async ({ page }) => {
            test.setTimeout(120_000);
            const sizes = [
              { width: 1280, height: 720, label: 'desktop' },
              { width: 390, height: 844, label: 'phone' },
              { width: 667, height: 375, label: 'short-landscape' },
            ];
            const enterCards = async () => {
              const go = page.locator('.homePadChoice[data-home-target="cards"]:visible').first();
              await expect(go).toBeVisible();
              await go.click();
              await page.waitForFunction(() => (
                globalThis.GAMEROAD_NAV_QA?.snapshot?.().screen === 'cards'
                && globalThis.GAMEROAD_SCREEN_TRANSITION?.getState?.().phase === 'IDLE'
              ));
            };
            const topOwns = async (locator, selector) => {
              const box = await locator.boundingBox();
              expect(box).not.toBeNull();
              return page.evaluate(({ x, y, selector }) => {
                const top = document.elementFromPoint(x, y);
                return Boolean(top?.closest?.(selector));
              }, { x: box.x + box.width / 2, y: box.y + box.height / 2, selector });
            };
            for (const size of sizes) {
              await page.setViewportSize({ width: size.width, height: size.height });
              let response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'load' });
              expect(response?.ok(), size.label).toBeTruthy();
              await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA));
              await page.evaluate(() => localStorage.removeItem('gameroad.cards.favorite.v1'));
              response = await page.reload({ waitUntil: 'load' });
              expect(response?.ok(), size.label + ' reload after storage clear').toBeTruthy();
              await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA));
              await enterCards();

              const host = page.locator('[data-role="cards-deck-findability"]');
              const filter = host.locator('[data-filter="favorite"]');
              await expect(host, size.label).toBeVisible();
              await expect(filter, size.label).toBeVisible();
              expect(await page.evaluate(() => document.querySelector('[data-role="cards-deck-findability"]')?.parentElement?.id), size.label).toBe('collectionGrid');
              expect(await topOwns(filter, '[data-role="cards-deck-findability"] [data-filter="favorite"]'), size.label + ' filter center').toBe(true);

              const card = page.locator('#collectionGrid button.slot.live.cardFace:visible').first();
              await expect(card, size.label).toBeVisible();
              await card.scrollIntoViewIfNeeded();
              expect(await topOwns(card, '#collectionGrid button.slot.live.cardFace'), size.label + ' card center').toBe(true);
              const cardId = await card.getAttribute('data-id');
              expect(cardId, size.label).toBeTruthy();
              await card.click();

              const favoriteAction = page.locator('[data-role="cards-favorite-action"]');
              await expect(favoriteAction, size.label).toBeVisible();
              await expect(favoriteAction, size.label).toHaveAttribute('aria-pressed', 'false');
              await favoriteAction.click();
              await expect(favoriteAction, size.label).toHaveAttribute('aria-pressed', 'true');

              await filter.scrollIntoViewIfNeeded();
              expect(await topOwns(filter, '[data-role="cards-deck-findability"] [data-filter="favorite"]'), size.label + ' filter after card click').toBe(true);
              await filter.click();
              await expect(filter, size.label).toHaveAttribute('aria-pressed', 'true');
              await expect(page.locator(`#collectionGrid button.slot.live.cardFace[data-id="${cardId}"]`), size.label + ' favorite survives filter').toBeVisible();

              await page.reload({ waitUntil: 'load' });
              await page.waitForFunction(() => Boolean(globalThis.__GAMEROAD_TEST__ && globalThis.GAMEROAD_NAV_QA));
              await enterCards();
              const persistedCard = page.locator(`#collectionGrid button.slot.live.cardFace[data-id="${cardId}"]`).first();
              await expect(persistedCard, size.label + ' persisted card').toBeVisible();
              await persistedCard.click();
              await expect(page.locator('[data-role="cards-favorite-action"]'), size.label + ' persisted favorite').toHaveAttribute('aria-pressed', 'true');
            }
          });
          EOF
          set +e
          npx playwright test "$TEST_FILE" --config=playwright.config.mjs --workers=1 --grep 'R5 Cards favorite controls and cards are physically hit-accessible' 2>&1 | tee /tmp/r5-acceptance.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/home-cards-2p5d-runtime.spec.mjs "$TEST_FILE"
          trap - EXIT
          test "$status" -eq 0
          git diff --exit-code -- "$TEST_FILE"

      - name: Run bounded existing Cards regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test "$TEST_FILE" --config=playwright.config.mjs --workers=1

      - name: Commit tested product and remove transient execution witnesses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$WORKFLOW_FILE" "$MANIFEST"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$PRODUCT_FILE"
          git add "$PRODUCT_FILE"
          git diff --cached --check
          git commit -m 'Fix Cards favorite filter hit access across viewports'
          git push origin HEAD:sol/cards-favorite-hitaccess-r5-20260906
