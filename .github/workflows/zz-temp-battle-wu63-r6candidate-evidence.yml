name: TEMP WU63 R6 Candidate Rail Evidence

on:
  push:
    branches:
      - sol/battle-wu63-r6candidate-evidence-20260914

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact R6 candidate source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="bfc157a1fa92237c956e5ff207a081bc4e87b878"
          test "$(git merge-base HEAD "$SOURCE")" = "$SOURCE"
          mapfile -t changed < <(git diff --name-only "$SOURCE" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/zz-temp-battle-wu63-r6candidate-evidence.yml'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Inspect 667x375 follow rail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wu63-r6 visual-evidence/wu63-r6 test-results/wu63-r6
          cat > .wu63-r6/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({testDir:'.',testMatch:'rail.spec.mjs',outputDir:'../test-results/wu63-r6',timeout:90000,expect:{timeout:7000},workers:1,retries:0,use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},hasTouch:true,trace:'retain-on-failure'},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}});
          EOF
          cat > .wu63-r6/rail.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs'; import path from 'node:path';
          async function installLegalBattleDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__;const publicMain=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id));const standard=window.__CARD_DATA__.filter(c=>publicMain.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);const royalIds=['SP_J','SP_Q','SP_K'];const nonRoyal=standard.filter(id=>!t.isRoyalCard(id));const main=[...nonRoyal.slice(0,37),...royalIds];t.deckSetDraft(main,[]);const v=t.deckValidate(t.state.deckDraft,{forBattle:true});const committed=v.ok?t.deckCommit():false;return{committed,saved:t.deckValidate(t.state.savedDeck,{forBattle:true})}})}
          function overlaps(a,b){return !!(a&&b&&a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y)}
          test('R6 candidate keeps every visible rail input fully reachable at 667x375',async({page})=>{
            const response=await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});expect(response?.ok()).toBeTruthy();
            await expect(page.locator('section[data-screen="home"]')).toBeVisible({timeout:15000});const deck=await installLegalBattleDeck(page);expect(deck.committed).toBeTruthy();expect(deck.saved.ok).toBeTruthy();
            const setupControl=page.locator('[data-home-target="setup"]:visible,[data-go="setup"]:visible').first();await setupControl.click();const setup=page.locator('section[data-screen="setup"]');await expect(setup).toBeVisible();await setup.locator('[data-content="road_shield"]').click();await setup.locator('[data-mode="2p"]').click();await setup.locator('#startMatch').click();
            const battle=page.locator('section[data-screen="battle"]');await expect(battle).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();
            const rail=battle.locator('.battleRail'), hand=battle.locator('#hand');const railRect=await rail.boundingBox(), handRect=await hand.boundingBox();
            const controls=await rail.locator('button,[role="button"],[tabindex]:not([tabindex="-1"])').evaluateAll((els)=>els.map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{id:el.id||null,cls:String(el.className||''),display:s.display,visibility:s.visibility,pointer:s.pointerEvents,hidden:el.hidden,x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}}).filter(x=>!x.hidden&&x.display!=='none'&&x.visibility!=='hidden'&&x.pointer!=='none'&&x.width>0&&x.height>0));
            const offscreen=controls.filter(r=>r.x<0||r.y<0||r.right>667||r.bottom>375);const handOverlap=controls.filter(r=>overlaps(handRect,r));
            const metrics={source:'bfc157a1fa92237c956e5ff207a081bc4e87b878',viewport:{width:667,height:375},railRect,handRect,controls,offscreen,handOverlap,camera:await page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode)};
            fs.writeFileSync(path.resolve('visual-evidence/wu63-r6/metrics.json'),JSON.stringify(metrics,null,2));await page.screenshot({path:path.resolve('visual-evidence/wu63-r6/follow-667x375.png'),animations:'disabled'});
            expect(handOverlap).toEqual([]);expect(offscreen).toEqual([]);
          });
          EOF
          npx playwright test --config=.wu63-r6/playwright.config.mjs --workers=1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-wu63-r6candidate-rail-${{ github.run_id }}
          path: |
            visual-evidence/wu63-r6/
            test-results/wu63-r6/
          if-no-files-found: warn
          retention-days: 14
