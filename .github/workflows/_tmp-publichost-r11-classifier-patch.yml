name: TEMP PublicHost R11 classifier patch

on:
  push:
    branches:
      - work/publichost-r11-github-actions-auth-bridge-20260819
    paths:
      - .github/workflows/_tmp-publichost-r11-classifier-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          ref: work/publichost-r11-github-actions-auth-bridge-20260819
          fetch-depth: 2

      - name: Patch exact PublicHost classifier and self-remove
        shell: bash
        env:
          EXPECTED_PARENT: 2a205aab6d0ca9efcdd11328f7cb364610b8f91e
          EXPECTED_GATE_BLOB: 74a51bee1b5135192049c76ef49b9c040171f06e
          TARGET_BRANCH: work/publichost-r11-github-actions-auth-bridge-20260819
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$EXPECTED_PARENT" ]]; then
            echo "::error::Unexpected executor parent: $actual_parent"
            exit 1
          fi

          gate=.github/workflows/gameroad-required-gate.yml
          actual_gate_blob="$(git hash-object "$gate")"
          if [[ "$actual_gate_blob" != "$EXPECTED_GATE_BLOB" ]]; then
            echo "::error::Required Gate blob moved: $actual_gate_blob"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gameroad-required-gate.yml')
          text = path.read_text()
          new_path = '              .github/workflows/cloudflare-public-deploy.yml)'
          anchor = '              deploy/cloudflare/wrangler.pages.toml)'
          if text.count(new_path) != 0:
              raise SystemExit('new Cloudflare workflow path already classified')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one PublicHost anchor, got {text.count(anchor)}')
          replacement = '              deploy/cloudflare/wrangler.pages.toml|\\\n              .github/workflows/cloudflare-public-deploy.yml)'
          patched = text.replace(anchor, replacement, 1)
          if patched.count(new_path) != 1:
              raise SystemExit('post-patch classifier count is not exactly one')
          path.write_text(patched)
          PY

          git rm .github/workflows/_tmp-publichost-r11-classifier-patch.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/_tmp-publichost-r11-classifier-patch.yml\n.github/workflows/gameroad-required-gate.yml'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected executor diff"
            printf 'actual:\n%s\n' "$changed"
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/gameroad-required-gate.yml
          git commit -m "PublicHost R11: classify Cloudflare deploy workflow"
          git push origin "HEAD:${TARGET_BRANCH}"
