name: starter-deck-40-fullreg-r3

on:
  push:
    branches:
      - work/starter-deck-40-product-r3-20260829
    paths:
      - .github/workflows/starter-deck-40-fullreg-r3.yml

permissions:
  contents: write

jobs:
  apply-and-full-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact authorized main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 482821bb7cc3b704dc94ae44cce32a794057f400 HEAD
      - name: Apply verified R3 delta and resolve three deck-only conflicts
        shell: bash
        run: |
          set -euo pipefail
          git show 632c03ec5c1be7facb6b1a0aff95d50bfa61bac9:browser/GAMEROAD.html > /tmp/base.html
          git show 5ca7793f6a8472583c471f8306d0e50309ebdf75:browser/GAMEROAD.html > /tmp/r3.html
          cp browser/GAMEROAD.html /tmp/current.html
          git merge-file -p /tmp/current.html /tmp/base.html /tmp/r3.html > /tmp/merged.html || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/merged.html')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n',re.S)
          blocks=pattern.findall(s)
          if len(blocks)!=3: raise SystemExit(f'expected exactly 3 known deck-only conflicts, got {len(blocks)}')
          cur1,r31=blocks[0]
          cur2,r32=blocks[1]
          cur3,r33=blocks[2]
          if 'id="defaultDeck"' not in cur1 or 'id="defaultDeck"' in r31:
              raise SystemExit('conflict 1 hidden default button shape mismatch')
          if 'window.__DEFAULT_DECK__' not in cur2 or 'window.__STARTER_DECK__' not in r32:
              raise SystemExit('conflict 2 starter symbol shape mismatch')
          if "$('#defaultDeck').addEventListener" not in cur3 or 'migrateLegacyFabricatedDefaultDeckInMemory' not in cur3:
              raise SystemExit('conflict 3 current legacy handler shape mismatch')
          if "$('#defaultDeck').addEventListener" in r33 or 'migrateLegacyFabricatedDefaultDeckInMemory' in r33 or 'function renderSetupDeckStatus(){const e=' not in r33:
              raise SystemExit('conflict 3 R3 cleanup shape mismatch')
          s,n=pattern.subn(lambda m:m.group(2),s)
          if n!=3: raise SystemExit(f'resolved {n} conflicts')
          if '<<<<<<<' in s or '>>>>>>>' in s or '\n=======\n' in s: raise SystemExit('conflict marker remains')
          p.write_text(s,encoding='utf-8')
          PY
          mv /tmp/merged.html browser/GAMEROAD.html
          git diff --check -- browser/GAMEROAD.html
          grep -q 'codex-home-pad-failsafe-r4' browser/GAMEROAD.html
      - name: Verify exact registered-starter static contract
        run: node --test tests/starter-deck-40-contract.spec.mjs
      - name: Align full-interaction assertions to registered starter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-full-interaction.spec.mjs')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label,n=1):
              global s
              c=s.count(old)
              if c!=n: raise SystemExit(f'{label}: expected {n}, got {c}')
              s=s.replace(old,new,n)
          rep("test('deck recovery preserves blocked raw saves, repairs legacy only on explicit legal commit, rolls back failures, and resets without reseeding', async ({ page }, testInfo) => {\n", "test('deck recovery preserves blocked raw saves, repairs generic legacy only on explicit legal commit, rolls back failures, and resets to the registered starter', async ({ page }, testInfo) => {\n", 'title')
          rep("  const initialRaw = await page.evaluate((key) => localStorage.getItem(key), STORAGE_KEY);\n  expect(initialRaw, 'missing save is not implicitly materialized on boot').toBeNull();\n  const defaultDeck = await page.evaluate(() => [...window.__DEFAULT_DECK__]);\n  expect(defaultDeck).toHaveLength(26);\n", "  const initial = await page.evaluate((key) => ({ raw: localStorage.getItem(key), starterDeck: [...window.__STARTER_DECK__], savedDeck: [...window.__GAMEROAD_TEST__.state.savedDeck.main], rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule } }), STORAGE_KEY);\n  expect(initial.raw, 'fresh boot registers the starter through the normal durable save path').not.toBeNull();\n  expect(initial.starterDeck).toHaveLength(40);\n  expect(initial.savedDeck).toEqual(initial.starterDeck);\n  expect(initial.rule).toEqual({ id: 'FIRST_REGULATION', revision: 3 });\n  const starterDeck = initial.starterDeck;\n  const legacyFixtureDeck = starterDeck.slice(0, 39);\n  expect(legacyFixtureDeck, 'generic legacy recovery fixture is not the starter/default deck').toHaveLength(39);\n", 'fresh boot')
          rep('deck: { main: defaultDeck, ex: [], ruleId:', 'deck: { main: starterDeck, ex: [], ruleId:', 'old default fixtures',3)
          rep("deck: { main: starterDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 2 }", "deck: { main: legacyFixtureDeck, ex: [], ruleId: 'FIRST_REGULATION', ruleRevision: 2 }", 'legacy fixture')
          rep('  expect(observed.savedDeck).toHaveLength(26);', '  expect(observed.savedDeck).toHaveLength(39);', 'legacy size')
          rep("  expect(afterReset.raw, 'explicit reset does not resurrect the transient starter as a durable save').toBeNull();\n  expect(afterReset.savedCount).toBe(26);\n  expect(afterReset.rule.id).toBeNull();\n", "  expect(afterReset.raw, 'explicit reset clears the durable save until the next normal boot registration').toBeNull();\n  expect(afterReset.savedCount).toBe(40);\n  expect(afterReset.rule).toEqual({ id: 'FIRST_REGULATION', revision: 3 });\n\n  await page.reload({ waitUntil: 'domcontentloaded' });\n  await page.waitForTimeout(800);\n  const afterResetReload = await page.evaluate((key) => ({ raw: localStorage.getItem(key), starterDeck: [...window.__STARTER_DECK__], savedDeck: [...window.__GAMEROAD_TEST__.state.savedDeck.main], rule: { ...window.__GAMEROAD_TEST__.state.savedDeckRule } }), STORAGE_KEY);\n  expect(afterResetReload.raw, 'reload re-registers the starter through the ordinary save path').not.toBeNull();\n  expect(afterResetReload.savedDeck).toEqual(afterResetReload.starterDeck);\n  expect(afterResetReload.savedDeck).toHaveLength(40);\n  expect(afterResetReload.rule).toEqual({ id: 'FIRST_REGULATION', revision: 3 });\n\n  await page.evaluate((key) => localStorage.removeItem(key), STORAGE_KEY);\n  await page.reload({ waitUntil: 'domcontentloaded' });\n  await page.waitForTimeout(800);\n  await page.evaluate((key) => localStorage.removeItem(key), STORAGE_KEY);\n", 'reset expectations')
          rep('  expect(writeFailure.savedCount).toBe(26);', '  expect(writeFailure.savedCount).toBe(40);', 'write failure preservation')
          if '__DEFAULT_DECK__' in s or 'toHaveLength(26)' in s or 'savedCount).toBe(26)' in s: raise SystemExit('obsolete default/26 assertion remains')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused starter recovery browser regression
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1 --grep 'deck recovery preserves blocked raw saves'
      - name: Full browser interaction
        run: npx playwright test --config=playwright.full-interaction.config.mjs --workers=1
      - name: Commit verified product mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'browser/GAMEROAD.html\ntests/browser-full-interaction.spec.mjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git commit -m 'fix(deck): register exact 40-card starter on current main'
          git push origin HEAD:work/starter-deck-40-product-r3-20260829
