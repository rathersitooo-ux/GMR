name: Required Gate auto-merge

on:
  workflow_run:
    workflows: ["GAMEROAD Required Gate", "Browser Full Interaction Evidence"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge-work-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update stale base or merge exact tested work PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request associated with this evidence run."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          if [ "${state}" != "open" ] || [ "${draft}" != "false" ]; then
            echo "PR is not an open non-draft PR; skip."
            exit 0
          fi
          if [ "${base_ref}" != "main" ] || [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
            echo "PR is not a same-repository main-targeting PR; skip."
            exit 0
          fi
          case "${head_ref}" in
            work/*) ;;
            *) echo "PR head is not work/**; skip."; exit 0 ;;
          esac
          if [ "${head_sha}" != "${TESTED_HEAD_SHA}" ]; then
            echo "Head moved after this evidence run; wait for evidence on the newer head."
            exit 0
          fi

          required_gate_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gameroad-required-gate.yml/runs?event=pull_request&head_sha=${head_sha}&per_page=20")"
          required_gate_status="$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // ""' <<<"${required_gate_json}")"
          required_gate_conclusion="$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // ""' <<<"${required_gate_json}")"
          if [ "${required_gate_status}" != "completed" ] || [ "${required_gate_conclusion}" != "success" ]; then
            echo "Required Gate is not successful for exact head ${head_sha}; skip automatic merge."
            exit 0
          fi

          bfi_required=false
          while IFS= read -r path; do
            case "${path}" in
              browser/GAMEROAD.html|\
              tests/browser-full-interaction.spec.mjs|\
              tests/browser-full-interaction-state-sequence.spec.mjs|\
              playwright.full-interaction.config.mjs|\
              .github/workflows/browser-full-interaction.yml)
                bfi_required=true
                ;;
              *) ;;
            esac
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')

          if [ "${bfi_required}" = "true" ]; then
            bfi_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/browser-full-interaction.yml/runs?event=pull_request&head_sha=${head_sha}&per_page=20")"
            bfi_status="$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // ""' <<<"${bfi_json}")"
            bfi_conclusion="$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // ""' <<<"${bfi_json}")"
            if [ "${bfi_status}" != "completed" ]; then
              echo "Broad Browser Full Interaction evidence is still nonterminal for exact head ${head_sha}; wait."
              exit 0
            fi
            if [ "${bfi_conclusion}" != "success" ]; then
              echo "Broad Browser Full Interaction evidence is non-success for exact head ${head_sha}."
              echo "This stops automatic merge only; it is not proof that the current PR caused the broad-suite failure. Route the failed assertion to causal scope review instead of patching unrelated product code."
              exit 0
            fi
          fi

          if [ -n "${TESTED_BASE_SHA}" ] && [ "${base_sha}" != "${TESTED_BASE_SHA}" ]; then
            echo "Base advanced after this evidence run; updating PR branch first."
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="${head_sha}"
            echo "Branch update requested. The synchronize event will run evidence again."
            exit 0
          fi

          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${head_sha}" \
            -f merge_method=squash)"
          if [ "$(jq -r '.merged' <<<"${result}")" != "true" ]; then
            echo "Merge was not accepted."
            jq . <<<"${result}"
            exit 1
          fi
          echo "Merged PR #${PR_NUMBER} at evidence-complete head ${head_sha} and base ${base_sha}."

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-public-deploy.yml/dispatches" \
            -f ref=main
          echo "Dispatched Cloudflare public deploy for current main after confirmed merge."
