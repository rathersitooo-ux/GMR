name: TEMP Battle Short Landscape Deconflict R1

on:
  push:
    branches:
      - sol/battle-short-landscape-deconflict-r1-20260908

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: sol/battle-short-landscape-deconflict-r1-20260908
          fetch-depth: 0

      - name: Verify PRE_ACTION and exact base
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/BATTLE-SHORT-LANDSCAPE-DECONFLICT-R1-20260908T0952-SOL-L7Q4N8.json
          git merge-base --is-ancestor 21088b37a6ce34197367bff4b26dba8a9cf78c79 HEAD
          test "$(git rev-parse 21088b37a6ce34197367bff4b26dba8a9cf78c79^)" = "528f0b09e124f7bc3df1b4404b832fb395ad3a80"
          test "$(git hash-object browser/battle-janken-slidepad-runtime-mount.mjs)" = "6b3ed3285cf7bca00e9349c131a336344b6423fe"
          test "$(git hash-object tests/battle-janken-slidepad-runtime-mount.test.mjs)" = "5ffea7079b807cd7b9c3f2c8485dc87e10ddf7ee"

      - name: Apply bounded responsive presentation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          text = runtime.read_text()

          old_row = '@media(max-height:430px) and (orientation:landscape){section[data-screen="battle"] [${BATTLE_PLAYABLE_HAND_ROW_ROULETTE_LIVE_HOST_ATTR}="1"]{left:var(--gameroad-battle-partner-right-x,104px);bottom:var(--gameroad-battle-partner-upper-y,84px);transform:scale(.86);transform-origin:left bottom}}'
          new_row = '@media(max-height:430px) and (orientation:landscape){section[data-screen="battle"] [${BATTLE_PLAYABLE_HAND_ROW_ROULETTE_LIVE_HOST_ATTR}="1"]{left:var(--gameroad-battle-partner-right-x,104px);bottom:var(--gameroad-battle-partner-upper-y,92px);transform:scale(.72);transform-origin:left bottom}}'
          if text.count(old_row) != 1:
              raise SystemExit(f'row roulette short-landscape seam count={text.count(old_row)}')
          text = text.replace(old_row, new_row)

          old_short = '@media(max-height:430px) and (orientation:landscape){section[data-screen="battle"] #hand.grPlayableHandActionBase{overflow:visible!important}[${HOST_ATTR}="1"]{width:220px;height:160px;right:7px;bottom:7px}[${HOST_ATTR}="1"] .grJankenSlidePadHandle{width:58px;height:58px}[${HOST_ATTR}="1"] .grJankenSlidePadSlot{width:70px;height:94px;padding:5px}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.rock{transform:translate(-143px,10px) rotate(-18deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.scissors{transform:translate(-109px,-47px) rotate(-8deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.paper{transform:translate(-64px,-75px) rotate(5deg)}[${HOST_ATTR}="1"] .grJankenLoadPreview{width:90px;height:120px;left:2px;top:2px}}'
          new_short = '@media(max-height:430px) and (orientation:landscape){section[data-screen="battle"] #hand.grPlayableHandActionBase{overflow:visible!important}[${HOST_ATTR}="1"]{width:188px;height:146px;right:58px;bottom:7px}[${HOST_ATTR}="1"] .grJankenSlidePadHandle{width:58px;height:58px}[${HOST_ATTR}="1"] .grJankenSlidePadSlot{width:60px;height:80px;padding:4px}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.rock{transform:translate(-124px,10px) rotate(-16deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.scissors{transform:translate(-92px,-40px) rotate(-7deg)}[${HOST_ATTR}="1"][data-expanded="true"] .grJankenSlidePadSlot.paper{transform:translate(-48px,-62px) rotate(4deg)}[${HOST_ATTR}="1"] .grJankenSlidePadSuit{font-size:20px}[${HOST_ATTR}="1"] .grJankenSlidePadCard{font-size:8px;line-height:1.05}[${HOST_ATTR}="1"] .grJankenSlidePadHand{font-size:8px}[${HOST_ATTR}="1"] .grJankenLoadPreview{width:82px;height:108px;left:2px;top:2px}}'
          if text.count(old_short) != 1:
              raise SystemExit(f'janken short-landscape seam count={text.count(old_short)}')
          text = text.replace(old_short, new_short)
          runtime.write_text(text)

          test_file = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          test_text = test_file.read_text()
          marker = "test('short-landscape Battle controls deconflict the fixed janken fan from the right utility rail', async () => {"
          if marker in test_text:
              raise SystemExit('focused regression test already exists')
          addition = r'''

          test('short-landscape Battle controls deconflict the fixed janken fan from the right utility rail', async () => {
            const { readFile } = await import('node:fs/promises');
            const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
            assert.match(source, /@media\(max-height:430px\) and \(orientation:landscape\)\{[^\n]*\[\$\{HOST_ATTR\}=\"1\"\]\{width:188px;height:146px;right:58px;bottom:7px/);
            assert.match(source, /max-height:430px[^\n]*\.grJankenSlidePadHandle\{width:58px;height:58px\}/,
              'the primary bottom-right touch target stays at the existing short-landscape size');
            assert.match(source, /max-height:430px[^\n]*\.grJankenSlidePadSlot\{width:60px;height:80px;padding:4px\}/);
            assert.match(source, /max-height:430px[^\n]*rock\{transform:translate\(-124px,10px\)[^\n]*scissors\{transform:translate\(-92px,-40px\)[^\n]*paper\{transform:translate\(-48px,-62px\)/);
          });

          test('short-landscape remaining-hand roulette compacts beside Partner without changing its board-occlusion contract', async () => {
            const { readFile } = await import('node:fs/promises');
            const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
            assert.match(source, /max-height:430px[^\n]*data-battle-playable-hand-row-roulette-live[^\n]*bottom:var\(--gameroad-battle-partner-upper-y,92px\);transform:scale\(\.72\)/);
            assert.match(source, /left:var\(--gameroad-battle-partner-right-x,clamp\(112px,14vw,174px\)\)/,
              'desktop placement remains anchored beside Partner rather than moving into the board');
          });
          '''
          test_file.write_text(test_text.rstrip() + addition.rstrip() + '\n')
          PY
          git diff --check

      - name: Run focused Battle tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs tests/battle-playable-hand-row-roulette-runtime.test.mjs

      - name: Verify exact product boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 528f0b09e124f7bc3df1b4404b832fb395ad3a80 -- browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs | sort | tr '\n' ' ')"
          test "$changed" = "browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs "
          test "$(git diff --name-only 528f0b09e124f7bc3df1b4404b832fb395ad3a80 -- browser/GAMEROAD.html browser/battle-playable-hand-row-roulette-runtime.mjs browser/battle-screen-runtime-mount.mjs | wc -l)" -eq 0

      - name: Commit product and remove transient controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-battle-short-landscape-deconflict-r1.yml
          rm -f data/preaction-authorizations/BATTLE-SHORT-LANDSCAPE-DECONFLICT-R1-20260908T0952-SOL-L7Q4N8.json
          git config user.name "gameroad-runtime-bot"
          git config user.email "gameroad-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "Battle: deconflict short-landscape controls"
          git push origin HEAD:sol/battle-short-landscape-deconflict-r1-20260908
