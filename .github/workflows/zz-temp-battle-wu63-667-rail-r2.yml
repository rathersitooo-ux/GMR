name: TEMP WU63 667 Rail Repair R2
on:
  push:
    branches: [sol/battle-wu63-667-rail-repair-r2-20260914]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-wu63-667-rail-repair-r2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply evidence-backed presentation-only inset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text()
          marker='gameroad-wu63-667-rail-r2'
          if marker not in s:
              style='''<style id="gameroad-wu63-667-rail-r2">\n@media (min-width:640px) and (max-width:900px) and (max-height:430px) and (orientation:landscape){\n  .battle.active #battleAdvanceReservation{transform:translateY(10px)!important}\n}\n</style>'''
              if s.count('</head>') != 1:
                  raise SystemExit('expected exactly one </head>')
              s=s.replace('</head>', style+'\n</head>', 1)
              p.write_text(s)
          PY
          node tests/browser-static-check.mjs
          if ! git diff --quiet -- browser/GAMEROAD.html; then
            git config user.name 'gameroad-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add browser/GAMEROAD.html
            git commit -m 'fix: keep WU63 reservation rail inside 667x375'
            git push origin HEAD:sol/battle-wu63-667-rail-repair-r2-20260914
          fi
      - run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify actual Battle 667x375
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wu63-r2 visual-evidence/wu63-r2 test-results/wu63-r2
          cat > .wu63-r2/playwright.config.mjs <<'EOF'
          import {defineConfig} from '@playwright/test';
          export default defineConfig({testDir:'.',testMatch:'verify.spec.mjs',outputDir:'../test-results/wu63-r2',timeout:90000,expect:{timeout:10000},workers:1,use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:667,height:375},hasTouch:true},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',cwd:new URL('../',import.meta.url).pathname,url:'http://127.0.0.1:4173/browser/GAMEROAD.html',timeout:120000}})
          EOF
          cat > .wu63-r2/verify.spec.mjs <<'EOF'
          import {test,expect} from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          async function installDeck(page){return page.evaluate(()=>{const t=window.__GAMEROAD_TEST__,pub=new Set(t.deckPublic().filter(c=>c.slot==='main').map(c=>c.id)),ids=window.__CARD_DATA__.filter(c=>pub.has(c.id)&&/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id),royal=['SP_J','SP_Q','SP_K'],non=ids.filter(id=>!t.isRoyalCard(id));t.deckSetDraft([...non.slice(0,37),...royal],[]);return t.deckValidate(t.state.deckDraft,{forBattle:true}).ok?t.deckCommit():false})}
          async function snap(page){return page.evaluate(()=>{const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{id:e.id||null,cls:String(e.className||''),x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};const rows=[...document.querySelectorAll('#battleAdvanceReservation .arRow')];const visible=[...document.querySelectorAll('section.battle.active button,section.battle.active [role="button"],section.battle.active [tabindex]:not([tabindex="-1"])')].filter(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return !e.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&s.pointerEvents!=='none'&&r.width>0&&r.height>0&&!e.closest('#battleDrawer')});const off=[...new Set([...visible,...rows])].filter(e=>{const r=e.getBoundingClientRect();return r.x<0||r.y<0||r.right>667||r.bottom>375}).map(box);return{off,rail:box(document.querySelector('.battleRail')),reservation:box(document.querySelector('#battleAdvanceReservation')),rows:rows.map(box),camera:window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().state?.mode,marker:!!document.querySelector('#gameroad-wu63-667-rail-r2')};})}
          test('WU63 rail remains reachable at 667x375',async({page})=>{await page.goto('/browser/GAMEROAD.html',{waitUntil:'commit'});await expect(page.locator('section[data-screen="home"]')).toBeVisible();await expect.poll(()=>page.evaluate(()=>typeof window.__GAMEROAD_TEST__?.start==='function'&&typeof window.GAMEROAD_CREATE_DECK_MATCH_START_SNAPSHOT==='function')).toBeTruthy();expect(await installDeck(page)).toBeTruthy();expect(await page.evaluate(()=>!!window.__GAMEROAD_TEST__.start('2p','road_shield'))).toBeTruthy();await expect(page.locator('section.battle.active')).toBeVisible();await expect.poll(()=>page.evaluate(()=>window.__GAMEROAD_BATTLE_CAMERA_LIVE__?.snapshot?.().mounted===true)).toBeTruthy();await page.waitForTimeout(200);const s=await snap(page);fs.writeFileSync(path.resolve('visual-evidence/wu63-r2/geometry.json'),JSON.stringify(s,null,2));await page.screenshot({path:path.resolve('visual-evidence/wu63-r2/667x375.png'),animations:'disabled'});expect(s.marker).toBeTruthy();expect(s.off,JSON.stringify(s.off)).toEqual([]);expect(s.rows.length).toBeGreaterThan(0);expect(s.rows[0].y).toBeGreaterThanOrEqual(0);expect(s.rail.y).toBeGreaterThanOrEqual(0);expect(s.rail.right).toBeLessThanOrEqual(667);expect(s.camera).toBe('FOLLOW_CONTROLLED');});
          EOF
          npx playwright test --config=.wu63-r2/playwright.config.mjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-wu63-r2-${{github.run_id}}
          path: |
            visual-evidence/wu63-r2/
            test-results/wu63-r2/
          if-no-files-found: warn
          retention-days: 14
