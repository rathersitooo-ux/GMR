name: no-defeat-saasuna-embedded-r2

on:
  push:
    branches:
      - work/no-defeat-saasuna-embedded-r2-20260904
    paths:
      - .github/workflows/no-defeat-saasuna-embedded-r2.yml

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch exact embedded Saasuna loss reactions and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          test_path = Path('tests/browser-static-check.mjs')
          html = html_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          forbidden_lines = [
              "      attack_lose:{status:'active',trigger:'自分が攻撃側・戦闘敗北',variants:['随分と良いカードをお持ちのようで']},\n",
              "      attack_lose_royal_nonlethal:{status:'active',trigger:'攻撃敗北・相手ロイヤル使用・非リーサル',variants:['切りましたね？']},\n",
              "      attack_lose_no_enemy_max_progress:{status:'active_2p_only',trigger:'2人戦・攻撃敗北・相手最大列進行数不増',variants:['流せた']},\n",
              "      attack_lose_disadvantage:{status:'pending_text_and_classifier',trigger:'攻撃敗北・不利',variants:[]},\n",
              "      defend_lose_nonlethal:{status:'active',trigger:'防御側・非リーサル敗北',variants:['気は済みましたか？']},\n",
          ]
          for line in forbidden_lines:
              count = html.count(line)
              if count != 1:
                  raise SystemExit(f'guard failed: expected 1 embedded copy for {line.strip()!r}, found {count}')
              html = html.replace(line, '')

          old_fn = "function saasunaBattleReaction(){const m=state?.match,r=m?.lastBattleResolution,me=m?.players?.find?.(p=>p.human);if(!r||!me)return null;const mine=r.winnerIds?.includes(me.id),attacking=r.attackerId===me.id,defending=r.defenderId===me.id;if(!attacking&&!defending)return null;const nonlethal=!publicMatchHasWinner();if(attacking){if(mine)return'attack_win';const enemy=m.mode==='2p'?m.players.find(p=>p.id!==me.id):null,prog=enemy?r.maxLaneProgress?.find(x=>x.id===enemy.id):null,flowFlag=!!(prog&&prog.after<=prog.before),royalFlag=!!(nonlethal&&r.players?.filter(p=>p.id!==me.id).flatMap(p=>p.cards||[]).some(x=>['J','Q','K'].includes(CARDS[x.cardId]?.rank)));if(flowFlag&&!royalFlag)return'attack_lose_no_enemy_max_progress';if(royalFlag&&!flowFlag)return'attack_lose_royal_nonlethal';return'attack_lose'}if(defending){if(mine)return'defend_win';if(nonlethal)return'defend_lose_nonlethal'}return null}"
          new_fn = "function saasunaBattleReaction(){const m=state?.match,r=m?.lastBattleResolution,me=m?.players?.find?.(p=>p.human);if(!r||!me)return null;const mine=r.winnerIds?.includes(me.id),attacking=r.attackerId===me.id,defending=r.defenderId===me.id;if(!attacking&&!defending)return null;if(!mine)return null;if(attacking)return'attack_win';if(defending)return'defend_win';return null}"
          fn_count = html.count(old_fn)
          if fn_count != 1:
              raise SystemExit(f'guard failed: expected 1 stale saasunaBattleReaction copy, found {fn_count}')
          html = html.replace(old_fn, new_fn)

          marker = "  const dedicatedScriptMatch = html.match(\n"
          if test.count(marker) != 1:
              raise SystemExit(f'guard failed: expected one static-check insertion marker, found {test.count(marker)}')
          regression = """  const saasunaForbiddenLossTokens = [\n    'attack_lose:',\n    'attack_lose_royal_nonlethal:',\n    'attack_lose_no_enemy_max_progress:',\n    'attack_lose_disadvantage:',\n    'defend_lose_nonlethal:',\n  ];\n  for (const token of saasunaForbiddenLossTokens) {\n    if (html.includes(token)) errors.push(`embedded Saasuna defeat/loss reaction remains: ${token}`);\n  }\n  if (!/function saasunaBattleReaction\\(\\)\\{[^}]*if\\(!mine\\)return null;if\\(attacking\\)return'attack_win';if\\(defending\\)return'defend_win';return null\\}/.test(html)) {\n    errors.push('embedded Saasuna battle reaction is not fail-closed for non-winning outcomes');\n  }\n\n"""
          test = test.replace(marker, regression + marker)

          html_path.write_text(html, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          PY
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
      - name: Commit bounded repair and remove transient authorization
        shell: bash
        run: |
          rm -f .github/workflows/no-defeat-saasuna-embedded-r2.yml
          rm -f data/preaction-authorizations/NO-DEFEAT-SAASUNA-EMBEDDED-R2-20260904T2247-SOL-N7Q4K2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Browser: fail closed Saasuna defeat reactions"
          git push origin HEAD:${{ github.ref_name }}
