name: TEMP Road Move R25 Diagnose
on:
  push:
    branches: [sol/road-move-bidirectional-r24-20260909]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-bidirectional-r24-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sol/road-move-bidirectional-live-r5-20260906:refs/remotes/origin/road-r5-donor sol/road-move-bidirectional-live-r6-20260906:refs/remotes/origin/road-r6-donor
          git show refs/remotes/origin/road-r5-donor:tools/zz-temp-road-move-runtime-r5.py > /tmp/r25.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r25.py');s=p.read_text(); reps=[
          ("BASE = '0be3a466b55cbd0af23244bc9fc90b2f5f6640fd'","BASE = '3176d910db54f09ae5b93821e71a05653f3be3a2'"),
          ("EXPECTED_HTML_BLOB = '35f9203e2be95ba07b44c875e26bfe2047a3cee5'","EXPECTED_HTML_BLOB = 'd7ae9d0532df7e66ebbf29f1e7eecb3f352d346d'"),
          ('ROAD-MOVE-RUNTIME-R5-20260906T2113-SOL-P8N4V6','ROAD-MOVE-RUNTIME-R25-20260909T1424-SOL-V6K3N9'),
          ('.github/workflows/zz-temp-road-move-runtime-r5.yml','.github/workflows/zz-temp-road-move-r25-diagnose.yml'),
          ("    'tools/zz-temp-road-move-runtime-r5.py',\n",''),
          ('road-move-bidirectional-live-r5.spec.mjs','road-move-bidirectional-live-r25.spec.mjs'),('ROAD-MOVE-BIDIRECTIONAL-R5','ROAD-MOVE-BIDIRECTIONAL-R25'),('R5 source contract','R25 source contract'),('R5_PATCH_READY','R25_PATCH_READY')]
          for a,b in reps:
            if a not in s: raise SystemExit('anchor '+a)
            s=s.replace(a,b)
          p.write_text(s)
          PY
          python3 /tmp/r25.py
          git show refs/remotes/origin/road-r6-donor:tools/zz-temp-road-move-runtime-r6.py > /tmp/r25post.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r25post.py');s=p.read_text();p.write_text(s.replace('tests/road-move-bidirectional-live-r6.spec.mjs','tests/road-move-bidirectional-live-r25.spec.mjs').replace('R6_POSTPATCH_READY','R25_POSTPATCH_READY'))
          PY
          python3 /tmp/r25post.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html');s=p.read_text()
          a="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0];if(!me?.plan?.roadId){ctxSet('PLAN_CARD_MISSING',{message:'先にロードカードを選ぶと移動範囲を決められます。'});return}const path=shortest(me.position,id,normalMoveLimitForRoad(me.plan.roadId),me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          b="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0],moveLimit=draftMoveLimitForPlayer(me);if(moveLimit<1){ctxSet('PLAN_CARD_MISSING',{message:'移動に使えるロードカードがありません。'});return}const path=shortest(me.position,id,moveLimit,me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          if s.count(a)!=1: raise SystemExit('late wrapper mismatch')
          p.write_text(s.replace(a,b,1))
          PY
      - name: Add fail-safe diagnostic
        shell: bash
        run: |
          cat >> tests/road-move-bidirectional-live-r25.spec.mjs <<'EOF'

          test('R25 fail-safe physical diagnosis',async({page})=>{
            const fs=await import('node:fs');const report={viewport:page.viewportSize(),events:[]};
            try{
              await openRoadBattle(page);report.events.push({stage:'open',s:await snapshot(page)});
              const pick=await page.evaluate(()=>{for(const n of document.querySelectorAll('.node.reachable[data-pos]')){const r=n.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,h=document.elementFromPoint(x,y);if(h&&(h===n||n.contains(h)))return{id:n.dataset.pos,x,y}}return null});report.node=pick;
              if(pick)await page.mouse.click(pick.x,pick.y);await page.waitForTimeout(40);
              const moved=await snapshot(page);report.events.push({stage:'moved',s:moved});const id=moved.compatibleRoadIds?.[0]||null;report.candidate=id;
              const info=async(label)=>{const v=await page.evaluate((id)=>{const n=[...document.querySelectorAll('#hand .handCard[data-card-id]')].find(e=>e.dataset.cardId===id);if(!n)return{exists:false};const r=n.getBoundingClientRect(),hits=[];for(const [fx,fy] of [[.5,.12],[.3,.18],[.7,.18],[.5,.35],[.3,.55],[.7,.55],[.5,.8]]){const x=r.left+r.width*fx,y=r.top+r.height*fy,h=document.elementFromPoint(x,y);hits.push({x,y,self:!!h&&(h===n||n.contains(h)),tag:h?.tagName||null,id:h?.id||null,cls:String(h?.className||''),cardId:h?.closest?.('[data-card-id]')?.dataset?.cardId||null,planBox:!!h?.closest?.('.planBox')})}return{exists:true,dataset:{...n.dataset},className:n.className,rect:{left:r.left,top:r.top,width:r.width,height:r.height},hits}},id);report.events.push({stage:label,card:v,s:await snapshot(page)});return v};
              if(id){await info('before-renderHand');report.renderHandGlobal=await page.evaluate(()=>typeof globalThis.renderHand==='function');if(report.renderHandGlobal)await page.evaluate(()=>globalThis.renderHand());await page.waitForTimeout(20);let v=await info('after-renderHand');report.syncGlobal=await page.evaluate(()=>typeof globalThis.syncRoadMoveDraftUi==='function');if(report.syncGlobal)await page.evaluate(()=>globalThis.syncRoadMoveDraftUi());await page.waitForTimeout(10);v=await info('after-manual-sync');const h=v.hits?.find(x=>x.self);report.hit=h||null;if(h)await page.mouse.click(h.x,h.y);await page.waitForTimeout(40);const after=await snapshot(page);report.events.push({stage:'after-physical-card-tap',s:after});if(after.roadId!==id){await page.evaluate((id)=>[...document.querySelectorAll('#hand .handCard[data-card-id]')].find(e=>e.dataset.cardId===id)?.click(),id);await page.waitForTimeout(20);report.events.push({stage:'after-dom-click-fallback',s:await snapshot(page)})}}
            }catch(e){report.error={name:e?.name||null,message:String(e?.message||e),stack:String(e?.stack||'')}}finally{fs.writeFileSync('.road-r25-diagnosis.txt',JSON.stringify(report,null,2))}
          });
          EOF
          cat > .r25.config.mjs <<'EOF'
          import{defineConfig}from'@playwright/test';export default defineConfig({testDir:'./tests',testMatch:'road-move-bidirectional-live-r25.spec.mjs',timeout:60000,workers:1,retries:0,reporter:[['line']],use:{baseURL:'http://127.0.0.1:4173',browserName:'chromium',headless:true,viewport:{width:844,height:390}},webServer:{command:'python3 -m http.server 4173 --bind 127.0.0.1',url:'http://127.0.0.1:4173/browser/GAMEROAD.html',reuseExistingServer:false,timeout:120000}})
          EOF
      - name: Run and always capture output
        shell: bash
        run: |
          set -uo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0 >/tmp/r25-install.log 2>&1
          npx playwright install --with-deps chromium >>/tmp/r25-install.log 2>&1
          npx playwright test --config=.r25.config.mjs --grep 'R25 fail-safe physical diagnosis' --workers=1 >/tmp/r25-test.log 2>&1
          status=$?
          if [ ! -s .road-r25-diagnosis.txt ]; then node -e "const fs=require('fs');fs.writeFileSync('.road-r25-diagnosis.txt',JSON.stringify({browserReportMissing:true,status:Number(process.argv[1]),testLog:fs.readFileSync('/tmp/r25-test.log','utf8').slice(-16000),installLog:fs.readFileSync('/tmp/r25-install.log','utf8').slice(-4000)},null,2))" "$status"; fi
          exit 0
      - name: Persist diagnosis only
        shell: bash
        run: |
          set -euo pipefail
          git restore browser/GAMEROAD.html
          rm -f tests/road-move-bidirectional-live-r25.spec.mjs .r25.config.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-temp-road-move-r25-diagnose.yml
          git add .road-r25-diagnosis.txt
          git diff --cached --check
          git commit -m 'chore(road): capture fail-safe R25 diagnosis'
          git push origin HEAD:sol/road-move-bidirectional-r24-20260909
