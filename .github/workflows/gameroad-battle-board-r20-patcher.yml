name: GAMEROAD Battle Board R20 One Shot

on:
  push:
    branches:
      - sol/battle-board-world-recompose-r20-20260920

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[R20-PATCHED]') && !contains(github.event.head_commit.message, '[R20-CLEANUP]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply direct live board seam
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html')
          s=p.read_text(encoding='utf-8')
          marker='/* BATTLE_BOARD_WORLD_FIELD_LIVE_HTML_R19 */'
          css_anchor='.battleCentralWorldLiveHost{position:absolute;inset:3% 3% 18%;pointer-events:none;min-width:0;min-height:0;overflow:hidden}'
          css_extra='#battleMap[data-central-world-live="1"] #board .node:not(.reachable):not(.path):not(.currentPosition):not(.nextStep){opacity:0;background:transparent;border-color:transparent;box-shadow:none}#battleWorldGoalLabel{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);min-width:64px;padding:6px 12px;border:2px solid #ffe18a;border-radius:999px;background:rgba(34,28,10,.88);color:#fff3b0;font-size:12px;font-weight:1000;letter-spacing:.16em;text-align:center;box-shadow:0 0 16px rgba(255,220,112,.45)}'
          if marker not in s:
              if s.count(css_anchor)!=1: raise SystemExit(f'CSS_ANCHOR_COUNT:{s.count(css_anchor)}')
              s=s.replace(css_anchor,css_anchor+css_extra)
              anchor='\nconst gl=initFieldGL();'
              if s.count(anchor)!=1: raise SystemExit(f'HTML_ANCHOR_COUNT:{s.count(anchor)}')
              draw=r"""/* BATTLE_BOARD_WORLD_FIELD_LIVE_HTML_R19 */
          const liveWorldBoard=battleCentralWorldRuntimeR8?.worldFieldRenderModel?.({centerX:0,centerZ:0,width:20,depth:11.25,y:.035});
          let liveGoalScreen=null;
          if(liveWorldBoard?.renderSpace==='WORLD_FIELD'){
            const graphColor=[.78,.70,.43],goalColor=[.96,.78,.28],gateColor=[.54,.36,.66],lowerColor=[.42,.58,.47],faintGoal=[.36,.34,.27];
            const segment=(a,b,col,size=.16,kind='liveWorldEdge')=>{if(!a||!b)return;const dx=b.x-a.x,dz=b.z-a.z,dy=(b.y||0)-(a.y||0),dist=Math.hypot(dx,dz),steps=Math.max(1,Math.ceil(dist/.34));for(let j=0;j<=steps;j++){const t=j/steps;box(a.x+dx*t,(a.y||0)+dy*t+.02,a.z+dz*t,size,.022,size,col,kind)}};
            for(const edge of liveWorldBoard.edges||[]){const pts=[edge.from,...(edge.waypoints||[]),edge.to],col=edge.region==='LOWER_SHARED_FIELD'?lowerColor:graphColor;for(let i=1;i<pts.length;i++)segment(pts[i-1],pts[i],col,.16,'liveWorldEdge')}
            for(const edge of liveWorldBoard.goalBranches||[]){const pts=[edge.from,...(edge.waypoints||[]),edge.to],col=edge.visualState==='STRONG_OPEN'?goalColor:faintGoal,size=edge.visualState==='STRONG_OPEN'?.20:.11;for(let i=1;i<pts.length;i++)segment(pts[i-1],pts[i],col,size,'liveWorldGoalBranch')}
            for(const cell of liveWorldBoard.roundCells||[]){const q=cell.world;if(!q)continue;box(q.x,q.y+.04,q.z,.48,.08,.48,cell.region==='LOWER_SHARED_FIELD'?lowerColor:graphColor,'liveWorldCell')}
            for(const gate of liveWorldBoard.gates||[]){const q=gate.world;if(!q)continue;const owner=String(gate.laneKey||'').split(':')[0],pc=fieldPlayerColor(owner,true);box(q.x,q.y+.06,q.z,.78,.12,.78,gate.state==='OPEN_PASSABLE_FRAME'?pc:gateColor,'liveWorldGate')}
            for(const shield of liveWorldBoard.shields||[]){const q=shield.world;if(!q)continue;const owner=String(shield.laneKey||'').split(':')[0],pc=fieldPlayerColor(owner,true);box(q.x,q.y+.15,q.z,.50,.045,.50,pc,'liveWorldShield')}
            for(const card of liveWorldBoard.actualBuiltCards||[]){const q=card.world;if(!q)continue;const owner=String(card.laneKey||'').split(':')[0],pc=fieldPlayerColor(owner,true);box(q.x,q.y+.11,q.z,.58,.055,.78,pc,'liveWorldBuiltCard')}
            const goal=liveWorldBoard.sharedGoal?.world;if(goal){box(goal.x,goal.y+.18,goal.z,1.18,.18,1.18,goalColor,'liveWorldGoal');liveGoalScreen=project3({x:goal.x,y:goal.y+.62,z:goal.z})}
          }
          let liveGoalLabel=$('#battleWorldGoalLabel');
          if(liveGoalScreen){if(!liveGoalLabel){liveGoalLabel=document.createElement('div');liveGoalLabel.id='battleWorldGoalLabel';liveGoalLabel.textContent='GOAL';$('#battleMap')?.appendChild(liveGoalLabel)}liveGoalLabel.hidden=false;liveGoalLabel.style.left=liveGoalScreen.x+'%';liveGoalLabel.style.top=liveGoalScreen.y+'%'}else if(liveGoalLabel){liveGoalLabel.hidden=true}
          """
              s=s.replace(anchor,'\n'+draw+anchor)
          current="battleCentralWorldRuntimeR8=runtime;$('#battleMap')?.setAttribute('data-central-world-live','1');globalThis.__GAMEROAD_BATTLE_CENTRAL_WORLD_LIVE__"
          scheduled="battleCentralWorldRuntimeR8=runtime;$('#battleMap')?.setAttribute('data-central-world-live','1');requestAnimationFrame(()=>{if(state.match)renderField3D()});globalThis.__GAMEROAD_BATTLE_CENTRAL_WORLD_LIVE__"
          if scheduled not in s:
              if s.count(current)!=1: raise SystemExit(f'REDRAW_ANCHOR_COUNT:{s.count(current)}')
              s=s.replace(current,scheduled)
          for token in (marker,'battleCentralWorldRuntimeR8?.worldFieldRenderModel?.(','liveGoalLabel.textContent=\'GOAL\'','requestAnimationFrame(()=>{if(state.match)renderField3D()})','data-central-world-live="1"] #board .node:not(.reachable)'):
              if token not in s: raise SystemExit('REQUIRED_TOKEN_MISSING:'+token)
          if 'battleCentralWorldRuntimeR8?.visualGraphWorld?.(' in s: raise SystemExit('RETIRED_VISUAL_GRAPH_CALL_PRESENT')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          node tests/browser-static-check.mjs
          node --test tests/battle-board-world-field-renderer.test.mjs
          node --test tests/battle-new-base-board-live-presentation-composer.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "gameroad-r20-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- browser/GAMEROAD.html; then
            git add browser/GAMEROAD.html
            git commit -m "Battle: connect actual world-field board live [R20-PATCHED]"
          fi
          git rm .github/workflows/gameroad-battle-board-r20-patcher.yml
          git commit -m "Battle: remove one-shot board patch helper [R20-CLEANUP]"
          git push origin HEAD:${GITHUB_REF_NAME}
