name: TEMP GAMEROAD Northstar Player Probe

on:
  push:
    branches:
      - work/BROWSER-PLAYGLOBAL-NORTHSTAR-R1
    paths:
      - .github/workflows/browser-northstar-player-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/browser-northstar-player-probe.yml

permissions:
  contents: read

jobs:
  public-player-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMEROAD_PUBLIC_BASE_URL: https://gameroad-browser-r5.pages.dev
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@v4

      - name: Inspect current first-play deck UI without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FIRST PLAY / DECK UI SOURCE ==='
          grep -n -C 7 -E 'setupDeckRecovery|setupDeckNote|fixDeckFromSetup|defaultDeckDraft|__DEFAULT_DECK__|renderSetupDeckStatus|deckValidation' browser/GAMEROAD.html | head -n 420 || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind actual public build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p northstar-evidence
          curl --fail --silent --show-error --location --header 'Accept-Encoding: identity' \
            --retry 4 --retry-delay 2 --retry-connrefused --max-time 30 \
            "$GAMEROAD_PUBLIC_BASE_URL/gameroad-version.json" \
            | tee northstar-evidence/gameroad-version.json

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: First-time visible-label deck recovery path
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = process.env.GAMEROAD_PUBLIC_BASE_URL;
          const out = 'northstar-evidence';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 2,
          });
          const page = await context.newPage();
          const consoleErrors = [];
          const pageErrors = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', err => pageErrors.push(String(err)));

          async function snapshot(label) {
            const data = await page.evaluate(() => {
              const visible = el => {
                const s = getComputedStyle(el), r = el.getBoundingClientRect();
                return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity || 1) > 0 && r.width > 0 && r.height > 0;
              };
              const controls = [...document.querySelectorAll('button,a,input,select,[role="button"]')]
                .filter(visible)
                .map(el => {
                  const r = el.getBoundingClientRect();
                  return {
                    text: String(el.innerText || el.value || '').replace(/\s+/g,' ').trim().slice(0,180),
                    aria: String(el.getAttribute('aria-label') || '').trim().slice(0,180),
                    disabled: Boolean(el.disabled) || el.getAttribute('aria-disabled') === 'true',
                    rect: {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},
                  };
                });
              const rect = id => {
                const el = document.getElementById(id); if (!el) return null;
                const r = el.getBoundingClientRect();
                return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),text:String(el.innerText||'').replace(/\s+/g,' ').trim().slice(0,500)};
              };
              return {
                screen: window.__GAMEROAD_TEST__?.state?.screen || null,
                body: String(document.body?.innerText || '').replace(/\n{3,}/g,'\n\n').trim().slice(0,9000),
                controls,
                setupNote: rect('setupDeckNote'),
                setupRecovery: rect('fixDeckFromSetup'),
                startMatch: rect('startMatch'),
                deckValidation: rect('deckValidation'),
                deckTotal: document.getElementById('r4DeckTotal')?.textContent || null,
                deckCount: document.getElementById('deckCount')?.textContent || null,
                defaultDeckVisible: (() => { const e=document.getElementById('defaultDeck'); return !!e && visible(e); })(),
                collectionVisibleCount: [...document.querySelectorAll('#collectionGrid button')].filter(visible).length,
              };
            });
            data.label = label;
            await page.screenshot({path:`${out}/${label}.png`,fullPage:true});
            fs.writeFileSync(`${out}/${label}.json`, JSON.stringify(data,null,2));
            console.log(`NORTHSTAR_${label.toUpperCase()} ${JSON.stringify(data,null,2)}`);
            return data;
          }

          await page.goto(`${base}/?utm_source=chatgpt.com`, {waitUntil:'domcontentloaded',timeout:60_000});
          await page.waitForTimeout(1600);
          const entry = await snapshot('01-entry');

          const battle = page.getByRole('button',{name:/^バトルへ/}).first();
          await battle.click({timeout:10_000});
          await page.waitForTimeout(700);
          const setup = await snapshot('02-setup-invalid-deck');
          if (!setup.body.includes('40枚') || !setup.body.includes('現在26枚')) throw new Error('expected-first-time-26-to-40-blocker-not-visible');
          if (!setup.controls.some(c => c.text === '盤面へ' && c.disabled)) throw new Error('expected-start-disabled-not-observed');

          const deckButton = page.getByRole('button',{name:'デッキへ',exact:true});
          await deckButton.click({timeout:10_000});
          await page.waitForTimeout(900);
          const deck = await snapshot('03-deck-recovery');
          if (deck.deckTotal !== '26') throw new Error(`unexpected-deck-total:${deck.deckTotal}`);
          if (deck.defaultDeckVisible) throw new Error('unexpected-default-deck-builder-visible');

          const report = {base,entry,setup,deck,consoleErrors,pageErrors};
          fs.writeFileSync(`${out}/first-time-deck-recovery-report.json`,JSON.stringify(report,null,2));
          console.log(`NORTHSTAR_SUMMARY ${JSON.stringify({setupNote:setup.setupNote,startMatch:setup.startMatch,deckValidation:deck.deckValidation,deckTotal:deck.deckTotal,defaultDeckVisible:deck.defaultDeckVisible,collectionVisibleCount:deck.collectionVisibleCount,consoleErrors,pageErrors},null,2)}`);
          if (pageErrors.length) throw new Error(`page-errors:${pageErrors.join(' | ')}`);
          await browser.close();
          NODE

      - name: Run existing visible 4-player Honey journey on same public origin
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .northstar-public
          sed "s#'/browser/GAMEROAD.html'#'/'#g" tests/browser-full-interaction.spec.mjs > .northstar-public/browser-full-interaction.spec.mjs
          cat > .northstar-public/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import baseConfig from '../playwright.full-interaction.config.mjs';
          const publicProjects = (baseConfig.projects ?? []).filter(p => !p.grep).map(p => ({name:p.name,use:p.use}));
          export default defineConfig({
            testDir:'.',testMatch:'browser-full-interaction.spec.mjs',
            grep:/R19 reaches Result from visible four-player Honey Hunt and returns Home/,
            timeout:240_000,expect:{timeout:7_000},fullyParallel:false,workers:1,retries:0,
            outputDir:'../northstar-evidence/full-path-results',reporter:[['line'],['json',{outputFile:'../northstar-evidence/full-path-report.json'}]],
            use:{...baseConfig.use,baseURL:process.env.GAMEROAD_PUBLIC_BASE_URL,trace:'retain-on-failure',screenshot:'only-on-failure',video:'off'},projects:publicProjects,
          });
          EOF
          npx playwright test --config=.northstar-public/playwright.config.mjs --workers=1

      - name: Upload bounded player evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: northstar-player-probe-${{ github.run_id }}
          path: northstar-evidence/
          if-no-files-found: error
          retention-days: 7
