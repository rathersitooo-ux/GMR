name: TEMP Battle central world package R4

on:
  push:
    branches:
      - sol/battle-central-world-package-r4-20260914

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-central-world-package-r4-20260914
          fetch-depth: 0

      - name: Patch package manifest and provenance contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('deploy/cloudflare/scripts/build.mjs')
          test = Path('deploy/cloudflare/tests/build.test.mjs')
          b = build.read_text()
          t = test.read_text()

          marker = 'BATTLE_CENTRAL_WORLD_PUBLIC_PACKAGE_R4'
          if marker not in b:
              anchor = "  // BATTLE_SHARED_PUBLIC_PACKAGE_TRAIN_R4 — already-merged Battle runtime/public closure.\n"
              assert b.count(anchor) == 1, f'build anchor count={b.count(anchor)}'
              insertion = """  // BATTLE_CENTRAL_WORLD_PUBLIC_PACKAGE_R4 — package the already-merged presentation chain; no live/gameplay authority.\n  { option: 'newBaseGoalPathPresentationCoreSource', expected: 'expectedNewBaseGoalPathPresentationCoreBlob', source: 'browser/new-base-goal-path-presentation-core.mjs', output: 'new-base-goal-path-presentation-core.mjs', artifact: 'new_base_goal_path_presentation_core', label: 'New Base GOAL path presentation core', sourceFlag: '--new-base-goal-path-presentation-core-source', expectedFlag: '--expected-new-base-goal-path-presentation-core-blob' },\n  { option: 'newBaseProgressionLanePresentationCoreSource', expected: 'expectedNewBaseProgressionLanePresentationCoreBlob', source: 'browser/new-base-progression-lane-presentation-core.mjs', output: 'new-base-progression-lane-presentation-core.mjs', artifact: 'new_base_progression_lane_presentation_core', label: 'New Base progression lane presentation core', sourceFlag: '--new-base-progression-lane-presentation-core-source', expectedFlag: '--expected-new-base-progression-lane-presentation-core-blob' },\n  { option: 'newBaseFlanoraMapLayoutCoreSource', expected: 'expectedNewBaseFlanoraMapLayoutCoreBlob', source: 'browser/new-base-flanora-map-layout-core.mjs', output: 'new-base-flanora-map-layout-core.mjs', artifact: 'new_base_flanora_map_layout_core', label: 'New Base Flanora map layout core', sourceFlag: '--new-base-flanora-map-layout-core-source', expectedFlag: '--expected-new-base-flanora-map-layout-core-blob' },\n  { option: 'newBaseFlanoraBoardSurfaceRuntimeSource', expected: 'expectedNewBaseFlanoraBoardSurfaceRuntimeBlob', source: 'browser/new-base-flanora-board-surface-runtime.mjs', output: 'new-base-flanora-board-surface-runtime.mjs', artifact: 'new_base_flanora_board_surface_runtime', label: 'New Base Flanora board surface runtime', sourceFlag: '--new-base-flanora-board-surface-runtime-source', expectedFlag: '--expected-new-base-flanora-board-surface-runtime-blob' },\n"""
              b = b.replace(anchor, insertion + anchor)
              build.write_text(b)

          if marker not in t:
              anchor = "  { file: 'tools/advice-collective-eval.mjs', source: 'tools/advice-collective-eval.mjs', sourceArg: 'adviceCollectiveEvalSource', expectedArg: 'expectedAdviceCollectiveEvalBlob', artifact: 'advice_collective_eval', fixture: 'export const ADVICE_COLLECTIVE_EVAL = Object.freeze({});\\n', currentBlob: '3cc7eb964493eb1e7cc022c420f7d49fad1be420' },\n"
              assert t.count(anchor) == 1, f'test anchor count={t.count(anchor)}'
              insertion = """  // BATTLE_CENTRAL_WORLD_PUBLIC_PACKAGE_R4 — exact source/blob and import-chain provenance.\n  { file: 'new-base-goal-path-presentation-core.mjs', source: 'browser/new-base-goal-path-presentation-core.mjs', sourceArg: 'newBaseGoalPathPresentationCoreSource', expectedArg: 'expectedNewBaseGoalPathPresentationCoreBlob', artifact: 'new_base_goal_path_presentation_core', fixture: 'export function isNewBaseGoalPathPresentation(){ return true; }\\n', currentBlob: '9b5fa5aed60fc9e9a8b06d752837f6df1b49d8dd' },\n  { file: 'new-base-progression-lane-presentation-core.mjs', source: 'browser/new-base-progression-lane-presentation-core.mjs', sourceArg: 'newBaseProgressionLanePresentationCoreSource', expectedArg: 'expectedNewBaseProgressionLanePresentationCoreBlob', artifact: 'new_base_progression_lane_presentation_core', fixture: \"import './new-base-goal-path-presentation-core.mjs';\\nexport function isNewBaseProgressionLanePresentation(){ return true; }\\n\", currentBlob: '215ef48ae520ab59159244c262c7c777b50b35aa' },\n  { file: 'new-base-flanora-map-layout-core.mjs', source: 'browser/new-base-flanora-map-layout-core.mjs', sourceArg: 'newBaseFlanoraMapLayoutCoreSource', expectedArg: 'expectedNewBaseFlanoraMapLayoutCoreBlob', artifact: 'new_base_flanora_map_layout_core', fixture: 'export function createFlanoraMapLayout(){ return Object.freeze({}); }\\n', currentBlob: 'aac8a591ccda1839b189652ed7cb3bce8b628ca6' },\n  { file: 'new-base-flanora-board-surface-runtime.mjs', source: 'browser/new-base-flanora-board-surface-runtime.mjs', sourceArg: 'newBaseFlanoraBoardSurfaceRuntimeSource', expectedArg: 'expectedNewBaseFlanoraBoardSurfaceRuntimeBlob', artifact: 'new_base_flanora_board_surface_runtime', fixture: \"import './new-base-flanora-map-layout-core.mjs';\\nimport './new-base-progression-lane-presentation-core.mjs';\\nexport function mountFlanoraBoardSurface(){ return Object.freeze({}); }\\n\", currentBlob: '68e93b906431bdadaa1562509d9b936673ab35bb' },\n"""
              t = t.replace(anchor, insertion + anchor)
              test.write_text(t)
          PY

      - name: Verify focused package contract
        run: node --test deploy/cloudflare/tests/build.test.mjs

      - name: Guard exact product scope
        shell: bash
        run: |
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "deploy/cloudflare/scripts/build.mjs"
          test "${files[1]}" = "deploy/cloudflare/tests/build.test.mjs"

      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No product diff; already patched.'
            exit 0
          fi
          git config user.name 'gameroad-bot'
          git config user.email 'gameroad-bot@users.noreply.github.com'
          git add deploy/cloudflare/scripts/build.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m 'build: package central world presentation modules'
          git push origin HEAD:sol/battle-central-world-package-r4-20260914
