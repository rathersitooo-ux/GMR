name: TEMP Battle Current UI Public Geometry R5

on:
  push:
    branches:
      - sol/battle-current-ui-public-geometry-r5-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://gameroad-browser-r5.pages.dev
      EXPECTED_BUILD: d96725f9ee3ff90986d1883cc2813872b1b9beee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind audit to exact public build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' --header 'Accept-Encoding: identity' --max-time 20 "${PUBLIC_URL}/gameroad-version.json" || true)"
            build="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).build_id||'')}catch{}})")"
            echo "public build attempt ${attempt}: ${build:-none}"
            if [[ "$build" == "$EXPECTED_BUILD" ]]; then exit 0; fi
            sleep 15
          done
          echo "::error::public canonical did not reach expected build ${EXPECTED_BUILD}"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Audit live mount and geometry on public Battle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/battle-current-ui-public-geometry-r5
          cat > /tmp/battle-current-ui-public-geometry-r5/audit.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const baseURL = process.env.PUBLIC_URL;
          const expectedBuild = process.env.EXPECTED_BUILD;
          const viewports = [
            { name: 'desktop-1280x720', width: 1280, height: 720 },
            { name: 'phone-390x844', width: 390, height: 844 },
            { name: 'short-landscape-667x375', width: 667, height: 375 },
          ];
          const outDir = '/tmp/battle-current-ui-public-geometry-r5';

          async function visibleFirst(page, selector) {
            const loc = page.locator(selector).first();
            await loc.waitFor({ state: 'visible', timeout: 15000 });
            return loc;
          }

          async function enterBattle(page) {
            await page.goto(`${baseURL}/`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('section[data-screen="home"]').waitFor({ state: 'visible', timeout: 20000 });
            await page.waitForFunction(() => window.__GAMEROAD_TEST__ && Array.isArray(window.__CARD_DATA__), null, { timeout: 20000 });
            const deck = await page.evaluate(() => {
              const t = window.__GAMEROAD_TEST__;
              const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
              const standard = window.__CARD_DATA__
                .filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)))
                .map((card) => card.id);
              const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
              const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
              const main = [...nonRoyal.slice(0, 37), ...royalIds];
              const setValidation = t.deckSetDraft(main, []);
              const draftValidation = t.deckValidate(t.state.deckDraft, { forBattle: true });
              const committed = draftValidation.ok ? t.deckCommit() : false;
              return { count: main.length, setOk: setValidation?.ok ?? false, draftOk: draftValidation.ok, committed };
            });
            if (deck.count !== 40 || !deck.draftOk || !deck.committed) throw new Error(`deck precondition failed ${JSON.stringify(deck)}`);

            const setupGo = await visibleFirst(page, '[data-home-target="setup"]:visible, [data-go="setup"]:visible, [data-root-go="setup"]:visible');
            await setupGo.click();
            const setup = page.locator('section[data-screen="setup"]');
            await setup.waitFor({ state: 'visible', timeout: 15000 });
            await setup.locator('[data-content="road_shield"]').click();
            await setup.locator('[data-mode="2p"]').click();
            const start = setup.locator('#startMatch');
            await start.waitFor({ state: 'visible', timeout: 10000 });
            if (!(await start.isEnabled())) throw new Error('startMatch disabled after legal deck');
            await start.click();
            const battle = page.locator('section[data-screen="battle"]');
            await battle.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => {
              const root = document.querySelector('section[data-screen="battle"]');
              const live = window.__GAMEROAD_BATTLE_CURRENT_PLAYER_UI_LIVE__;
              return root?.getAttribute('data-gr-current-player-ui') === '1'
                && live?.mounted?.() === true
                && live?.inspect?.()?.rootDecorated === true;
            }, null, { timeout: 15000 });
            return battle;
          }

          function finiteRect(rect) {
            if (!rect) return null;
            const keys = ['left','top','right','bottom','width','height'];
            return Object.fromEntries(keys.map((key) => [key, Number.isFinite(Number(rect[key])) ? Number(rect[key]) : null]));
          }

          const browser = await chromium.launch({ headless: true });
          const results = [];
          let mountFailure = false;
          try {
            for (const vp of viewports) {
              const context = await browser.newContext({ viewport: { width: vp.width, height: vp.height } });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', (error) => errors.push(`pageerror:${error.message}`));
              page.on('console', (message) => { if (message.type() === 'error') errors.push(`console:${message.text()}`); });
              try {
                const battle = await enterBattle(page);
                await page.waitForTimeout(250);
                const evidence = await page.evaluate(() => {
                  const root = document.querySelector('section[data-screen="battle"]');
                  const rootRect = root?.getBoundingClientRect?.() ?? null;
                  const live = window.__GAMEROAD_BATTLE_CURRENT_PLAYER_UI_LIVE__ ?? null;
                  const inspect = live?.inspect?.() ?? null;
                  const selectors = {
                    hand: '#hand',
                    thumbActions: '.planBox',
                    jankenSlidePad: '[data-battle-janken-slidepad="1"]',
                    roulette: '[data-battle-playable-hand-row-roulette-live="1"]',
                    targetConfirm: '#targetBox',
                    secondaryActions: '.battleRail',
                    resources: '[data-battle-critical-resource-hud="1"], .resourceStrip',
                    partner: '#partnerAdviceChatPresentation',
                    public4p: '#publicTurnHud',
                  };
                  const direct = {};
                  const overflow = {};
                  for (const [key, selector] of Object.entries(selectors)) {
                    const node = root?.querySelector?.(selector) ?? null;
                    const rect = node?.getBoundingClientRect?.() ?? null;
                    const style = node ? getComputedStyle(node) : null;
                    const visible = Boolean(node && rect && rect.width > 0 && rect.height > 0 && style?.display !== 'none' && style?.visibility !== 'hidden');
                    direct[key] = rect ? { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height, visible } : null;
                    overflow[key] = visible && rootRect ? {
                      left: rect.left < rootRect.left - 0.5,
                      right: rect.right > rootRect.right + 0.5,
                      top: rect.top < rootRect.top - 0.5,
                      bottom: rect.bottom > rootRect.bottom + 0.5,
                    } : null;
                  }
                  return {
                    viewport: { width: innerWidth, height: innerHeight },
                    screen: document.querySelector('.screen.active')?.dataset?.screen ?? null,
                    rootAttr: root?.getAttribute?.('data-gr-current-player-ui') ?? null,
                    rootLayout: root?.getAttribute?.('data-gr-ui-layout') ?? null,
                    rootRect: rootRect ? { left: rootRect.left, top: rootRect.top, right: rootRect.right, bottom: rootRect.bottom, width: rootRect.width, height: rootRect.height } : null,
                    liveExists: Boolean(live),
                    liveMounted: Boolean(live?.mounted?.()),
                    livePresentationOnly: live?.presentationOnly ?? null,
                    liveGameplayAuthority: live?.gameplayAuthority ?? null,
                    inspect,
                    direct,
                    overflow,
                  };
                });
                if (!evidence.liveMounted || evidence.rootAttr !== '1' || evidence.inspect?.rootDecorated !== true) mountFailure = true;
                const png = `${outDir}/${vp.name}.png`;
                await page.screenshot({ path: png, fullPage: false, animations: 'disabled' });
                results.push({ name: vp.name, expectedBuild, ...evidence, errors });
              } catch (error) {
                mountFailure = true;
                results.push({ name: vp.name, expectedBuild, fatal: String(error?.stack ?? error), errors });
                try { await page.screenshot({ path: `${outDir}/${vp.name}-failure.png`, fullPage: false, animations: 'disabled' }); } catch {}
              } finally {
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }
          fs.writeFileSync(`${outDir}/geometry.json`, `${JSON.stringify(results, null, 2)}\n`);
          console.log(JSON.stringify(results, null, 2));
          if (mountFailure) process.exit(2);
          EOF
          node /tmp/battle-current-ui-public-geometry-r5/audit.mjs
      - name: Upload geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-current-ui-public-geometry-r5
          path: /tmp/battle-current-ui-public-geometry-r5/
          if-no-files-found: error
          retention-days: 7
      - name: Clean transient workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-battle-current-ui-public-geometry-r5.yml
          git commit -m 'Public geometry audit cleanup Battle current UI R5'
          git push origin HEAD:${GITHUB_REF_NAME}
