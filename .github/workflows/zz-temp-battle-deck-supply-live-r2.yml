name: TEMP Battle deck supply live R2 exact-anchor patch

on:
  push:
    branches:
      - sol/battle-deck-supply-live-r2-20260916
    paths:
      - .github/workflows/zz-temp-battle-deck-supply-live-r2.yml

permissions:
  contents: write

concurrency:
  group: temp-battle-deck-supply-live-r2
  cancel-in-progress: false

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-deck-supply-live-r2-20260916

      - name: Apply exact current Battle supply anchors and repair stale static contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          text = html_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 current anchor, got {count}')
              text = text.replace(old, new, 1)

          module_anchor = '<!-- GAMEROAD_LOBBYDECK_R4_MATCHSTART_SNAPSHOT -->'
          module_block = '''<!-- GAMEROAD_BATTLE_DECK_SUPPLY_LIVE_R2 -->
          <script type="module" id="gameroad-battle-deck-supply-live-r2">
          import { consumeNextBattleSupply } from "./battle-deck-supply-boundary.mjs";
          const existingBattleDeckSupply=globalThis.GAMEROAD_CONSUME_NEXT_BATTLE_SUPPLY;
          if(existingBattleDeckSupply&&existingBattleDeckSupply!==consumeNextBattleSupply)throw new Error("GAMEROAD_BATTLE_DECK_SUPPLY_CONFLICT");
          if(!existingBattleDeckSupply)Object.defineProperty(globalThis,"GAMEROAD_CONSUME_NEXT_BATTLE_SUPPLY",{value:consumeNextBattleSupply,enumerable:false,configurable:false,writable:false});
          </script>
          ''' + module_anchor
          replace_once(module_anchor, module_block, 'supply-module-mount')
          replace_once(',deck,hand,shields:{', ',deck,subDeck:[],hand,shields:{', 'player-subdeck-zone')
          replace_once('battleBlockedRound:0,sourceDeckIds:', 'battleBlockedRound:0,finalResortMode:false,finalResortPolicy:null,sourceDeckIds:', 'player-final-resort-state')

          old_refill = "function refill(p){while(p.hand.length<3&&p.deck.length)p.hand.push(p.deck.shift())}"
          new_refill = "function consumeOrdinaryBattleSupply(p){const supply=globalThis.GAMEROAD_CONSUME_NEXT_BATTLE_SUPPLY;if(typeof supply!=='function')throw Error('BATTLE_DECK_SUPPLY_RUNTIME_UNAVAILABLE');const wasFinal=!!p.finalResortMode,result=supply({mainDeck:p.deck,subDeck:Array.isArray(p.subDeck)?p.subDeck:[],shuffleSubDeck:shuffle});p.deck=[...result.mainDeck];p.subDeck=[...result.subDeck];if(result.status==='FINAL_RESORT_REQUIRED'){p.finalResortMode=true;p.finalResortPolicy=result.finalResortPolicy;if(!wasFinal)log(`${p.name}：山札とサブデッキが尽き、パートナーが最終手段（ジョーカーなし52枚・能力なし）へ切替。`);return null}return result.card}\nfunction refill(p){while(p.hand.length<3){const card=consumeOrdinaryBattleSupply(p);if(card==null)break;p.hand.push(card)}}"
          replace_once(old_refill, new_refill, 'ordinary-refill-consumer')

          old_draw = "case'drawAndReduceCost':{if(p.deck.length)p.hand.push(p.deck.shift());p.nextCostReduction=(p.nextCostReduction||0)+2;log(`${p.name}：${c.display_name}で1枚引き、次の能力用マナを2軽減。`);break}"
          new_draw = "case'drawAndReduceCost':{const drawn=consumeOrdinaryBattleSupply(p);if(drawn!=null)p.hand.push(drawn);p.nextCostReduction=(p.nextCostReduction||0)+2;log(`${p.name}：${c.display_name}で1枚引き、次の能力用マナを2軽減。`);break}"
          replace_once(old_draw, new_draw, 'ability-draw-consumer')
          html_path.write_text(text, encoding='utf-8')

          static_path = Path('tests/browser-static-check.mjs')
          static_text = static_path.read_text(encoding='utf-8')
          marker = "'post-use refill target is no longer three'"
          if static_text.count(marker) != 1:
              raise SystemExit(f'static-refill-contract marker count={static_text.count(marker)}')
          at = static_text.index(marker)
          start = static_text.rfind('\n', 0, at) + 1
          end = static_text.find('\n', at)
          if end < 0:
              end = len(static_text)
          old_line = static_text[start:end]
          required_old = [
              'function refill\\(p\\)',
              'p\\.hand\\.length<3&&p\\.deck\\.length',
              'p\\.deck\\.shift\\(\\)',
          ]
          if not all(part in old_line for part in required_old):
              raise SystemExit(f'static-refill-contract unexpected old line: {old_line}')
          new_line = "    [/function refill\\(p\\)\\{while\\(p\\.hand\\.length<3\\)\\{const card=consumeOrdinaryBattleSupply\\(p\\);if\\(card==null\\)break;p\\.hand\\.push\\(card\\)\\}\\}/, 'post-use refill target is no longer three or bypasses shared deck-supply boundary'],"
          static_text = static_text[:start] + new_line + static_text[end:]
          static_path.write_text(static_text, encoding='utf-8')

          test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { consumeNextBattleSupply } from '../browser/battle-deck-supply-boundary.mjs';

          const source = fs.readFileSync(new URL('../browser/GAMEROAD.html', import.meta.url), 'utf8');

          test('live HTML mounts the existing deck-supply boundary without a second deck engine', () => {
            assert.match(source, /GAMEROAD_BATTLE_DECK_SUPPLY_LIVE_R2/);
            assert.match(source, /import \{ consumeNextBattleSupply \} from "\.\/battle-deck-supply-boundary\.mjs"/);
            assert.match(source, /GAMEROAD_CONSUME_NEXT_BATTLE_SUPPLY/);
            assert.match(source, /deck,subDeck:\[\],hand,shields:/);
            assert.match(source, /finalResortMode:false,finalResortPolicy:null/);
          });

          test('ordinary refill keeps target three and draw uses the same supply transition while deckTopToChip stays unchanged', () => {
            assert.match(source, /function consumeOrdinaryBattleSupply\(p\)/);
            assert.match(source, /mainDeck:p\.deck,subDeck:Array\.isArray\(p\.subDeck\)\?p\.subDeck:\[\],shuffleSubDeck:shuffle/);
            assert.match(source, /function refill\(p\)\{while\(p\.hand\.length<3\)\{const card=consumeOrdinaryBattleSupply\(p\);if\(card==null\)break;p\.hand\.push\(card\)\}\}/);
            assert.match(source, /case'drawAndReduceCost':\{const drawn=consumeOrdinaryBattleSupply\(p\)/);
            assert.match(source, /case'deckTopToChip':\{const moved=p\.deck\.shift\(\);p\.chip\.push\(moved\)/);
          });

          test('subdeck shuffle clears public-lower zone and supplies from shuffled main', () => {
            const result = consumeNextBattleSupply({ mainDeck: [], subDeck: ['a','b','c'], shuffleSubDeck: (cards) => [...cards].reverse() });
            assert.equal(result.status, 'CARD_SUPPLIED');
            assert.equal(result.source, 'SUB_DECK_SHUFFLED_TO_MAIN');
            assert.equal(result.card, 'c');
            assert.deepEqual(result.mainDeck, ['b','a']);
            assert.deepEqual(result.subDeck, []);
          });

          test('both empty enters final resort without inventing rank gameplay semantics', () => {
            const result = consumeNextBattleSupply({ mainDeck: [], subDeck: [], shuffleSubDeck: (cards) => cards });
            assert.equal(result.status, 'FINAL_RESORT_REQUIRED');
            assert.equal(result.finalResortPolicy.source.cardIdentityCount, 52);
            assert.equal(result.finalResortPolicy.source.jokersIncluded, false);
            assert.equal(result.finalResortPolicy.abilityPolicy, 'NONE');
            assert.equal(result.finalResortPolicy.rankGameplaySemanticsStatus, 'UNRESOLVED');
            assert.match(source, /finalResortMode=true;p\.finalResortPolicy=result\.finalResortPolicy/);
          });
          '''
          Path('tests/battle-deck-supply-live-integration.test.mjs').write_text(test, encoding='utf-8')
          PY

      - name: Run focused and static checks
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-deck-supply-live-integration.test.mjs
          node tests/browser-static-check.mjs
          git diff --check

      - name: Commit exact product delta and remove transient authorization files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-deck-supply-live-r2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-temp-battle-deck-supply-live-r2.yml
          git rm data/preaction-authorizations/BATTLE-DECK-SUPPLY-LIVE-R2-20260916T0305-SOL.json
          git add browser/GAMEROAD.html tests/browser-static-check.mjs tests/battle-deck-supply-live-integration.test.mjs
          git diff --cached --check
          git commit -m "Battle: connect subdeck supply chain to live refill and draw"
          git push origin HEAD:sol/battle-deck-supply-live-r2-20260916
