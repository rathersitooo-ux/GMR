name: TEMP Records Historical Deck R12

on:
  push:
    branches: [sol/records-used-deck-r12-20260911]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/records-used-deck-r12-20260911

      - name: Patch only the two existing Records seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html'); s=p.read_text(encoding='utf-8')
          a="partner:state.selectedPartnerId,battlePointsEarned:points.earned"
          b="partner:state.selectedPartnerId,deckStartSnapshot:safeClone(m.deckStartSnapshot),battlePointsEarned:points.earned"
          c="d.className='record';d.innerHTML=`<b>${h.mode.toUpperCase()} / ${h.rank}位</b><span>${h.rounds}巡</span>`"
          d="d.className='record';d.__gameroadHistoryEntry=h;d.innerHTML=`<b>${h.mode.toUpperCase()} / ${h.rank}位</b><span>${h.rounds}巡</span>`"
          if s.count(a)!=1 or s.count(c)!=1: raise SystemExit(f'anchors producer={s.count(a)} row={s.count(c)}')
          s=s.replace(a,b,1).replace(c,d,1); p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          node tests/browser-static-check.mjs
          node --test tests/cards-deck-presentation.test.mjs tests/profile-presentation-runtime-mount.test.mjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Create focused browser proof outside durable test tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-records
          mkdir -p .tmp-records
          cat > .tmp-records/records.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          test('Records historical Deck survives current Deck change', async ({ page }, testInfo) => {
            test.setTimeout(120_000);
            await page.route('**/gameroad-version.json*', async (route) => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ build_id: 'records-r12-evidence' }) });
            });
            const response = await page.goto('http://127.0.0.1:4173/browser/GAMEROAD.html', { waitUntil: 'commit' });
            expect(response?.ok()).toBeTruthy();
            await page.waitForTimeout(900);
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('Page.stopLoading');
            const boot = await page.evaluate(() => ({
              readyState: document.readyState,
              hasTestApi: Boolean(window.__GAMEROAD_TEST__),
              screenCount: document.querySelectorAll('section[data-screen]').length,
            }));
            expect(boot.hasTestApi, JSON.stringify(boot)).toBeTruthy();
            expect(boot.screenCount, JSON.stringify(boot)).toBeGreaterThan(0);

            const driven = await page.evaluate(async () => {
              const t = window.__GAMEROAD_TEST__;
              const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
              const standard = window.__CARD_DATA__
                .filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)))
                .map((card) => card.id);
              const royal = ['SP_J','SP_Q','SP_K'];
              const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
              const makeDeck = (offset) => [...nonRoyal.slice(offset, offset + 37), ...royal];
              const deckA = makeDeck(0);
              const va = t.deckValidate({ main: deckA, ex: [] }, { forBattle: true });
              t.deckSetDraft(deckA, []);
              if (!va.ok || !t.deckCommit()) return { ok:false, stage:'deckA', va };
              t.battlePresentationFast(true);
              const match = t.start('2p','road_shield');
              window.__V105_ABILITY_TEST__?.setAutoChoices?.(true);
              const reached = await t.autoToResult(30);
              const historicalBefore = [...(t.state.history?.[0]?.deckStartSnapshot?.deck?.main ?? [])];
              let deckB=null;
              for(let offset=1;offset<=8;offset+=1){
                const candidate=makeDeck(offset);
                if(candidate.length!==40 || JSON.stringify(candidate)===JSON.stringify(deckA)) continue;
                if(t.deckValidate({main:candidate,ex:[]},{forBattle:true}).ok){ deckB=candidate; break; }
              }
              if(!deckB) return {ok:false,stage:'deckB',reached,nonRoyalCount:nonRoyal.length};
              t.deckSetDraft(deckB,[]);
              const committedB=t.deckCommit();
              const historicalAfter=[...(t.state.history?.[0]?.deckStartSnapshot?.deck?.main ?? [])];
              const currentDeck=[...t.deckSaved().main];
              const deckAOnly=deckA.find((id)=>!deckB.includes(id))??null;
              const deckBOnly=deckB.find((id)=>!deckA.includes(id))??null;
              t.show('records');
              const row=document.querySelector('#recordsList .record');
              const selectable=row?.dataset.recordsSelectable??null;
              const bound=Boolean(row?.__gameroadHistoryEntry);
              row?.click();
              const detail=document.querySelector('#recordsMatchDetail');
              const detailText=detail?.innerText??'';
              return {ok:true,reached,matchId:match?.id??null,committedB,deckA,deckB,historicalBefore,historicalAfter,currentDeck,deckAOnly,deckBOnly,selectable,bound,detailHidden:detail?.hidden??true,detailText};
            });
            expect(driven.ok, JSON.stringify(driven)).toBeTruthy();
            expect(driven.reached, JSON.stringify(driven)).toBeTruthy();
            expect(driven.committedB).toBeTruthy();
            expect(driven.historicalBefore).toEqual(driven.deckA);
            expect(driven.historicalAfter).toEqual(driven.deckA);
            expect(driven.currentDeck).toEqual(driven.deckB);
            expect(driven.historicalAfter).not.toEqual(driven.currentDeck);
            expect(driven.deckAOnly).not.toBeNull();
            expect(driven.deckBOnly).not.toBeNull();
            expect(driven.selectable).toBe('true');
            expect(driven.bound).toBeTruthy();
            expect(driven.detailHidden).toBeFalsy();
            expect(driven.detailText).toContain(driven.deckAOnly);
            expect(driven.detailText).not.toContain(driven.deckBOnly);
            await testInfo.attach('records-historical-deck-r12.png', { body: await page.screenshot({ fullPage:true, animations:'disabled' }), contentType:'image/png' });
          });
          EOF
          cat > .tmp-records/playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({ testDir:'.', testMatch:'records.spec.mjs', timeout:120000, expect:{timeout:7000}, workers:1, retries:0, outputDir:'test-results', reporter:[['line']], use:{browserName:'chromium',headless:true,trace:'retain-on-failure',screenshot:'only-on-failure',video:'off'}, projects:[{name:'desktop-1280x720',use:{viewport:{width:1280,height:720}}}] });
          EOF

      - name: Run focused Records browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/records-r12-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/browser/GAMEROAD.html >/dev/null && break || sleep 1; done
          npx playwright test --config=.tmp-records/playwright.config.mjs --workers=1

      - name: Upload focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-historical-deck-r12-${{ github.run_id }}
          path: .tmp-records/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Add durable focused regression and commit proven product
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-full-interaction-state-sequence.spec.mjs'); s=p.read_text(encoding='utf-8')
          title='Records history binds each rendered row to its frozen match Deck snapshot'
          if title in s: raise SystemExit('durable test already exists unexpectedly')
          anchor="test('Partner Shell is reachable through the live Saasuna conversation and stays fail-closed for unsupported actions'"
          if s.count(anchor)!=1: raise SystemExit(f'anchor count={s.count(anchor)}')
          block=r'''test('Records history binds each rendered row to its frozen match Deck snapshot', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop-1280x720', 'single-project Records Deck regression');
            await page.route('**/gameroad-version.json*', (route) => route.fulfill({ status: 200, contentType: 'application/json', body: '{"build_id":"records-regression"}' }));
            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'commit' });
            expect(response?.ok()).toBeTruthy();
            await page.waitForTimeout(900);
            const cdp = await page.context().newCDPSession(page); await cdp.send('Page.stopLoading');
            const result = await page.evaluate(async () => {
              const t=window.__GAMEROAD_TEST__, ids=window.__CARD_DATA__.filter(c=>/^(SP|HT|DI|CL)$/.test(c.suit)&&/^(A|[2-9]|10|J|Q|K)$/.test(String(c.rank))).map(c=>c.id);
              const royal=['SP_J','SP_Q','SP_K'], nonRoyal=ids.filter(id=>!t.isRoyalCard(id)), make=o=>[...nonRoyal.slice(o,o+37),...royal], a=make(0), b=make(1);
              t.deckSetDraft(a,[]); if(!t.deckCommit()) return {ok:false,stage:'a'};
              t.battlePresentationFast(true); t.start('2p','road_shield'); window.__V105_ABILITY_TEST__?.setAutoChoices?.(true); if(!(await t.autoToResult(30))) return {ok:false,stage:'result'};
              const frozen=[...(t.state.history?.[0]?.deckStartSnapshot?.deck?.main??[])]; t.deckSetDraft(b,[]); if(!t.deckCommit()) return {ok:false,stage:'b'}; t.show('records');
              const row=document.querySelector('#recordsList .record'); return {ok:true,frozen,a,b,current:[...t.deckSaved().main],bound:Boolean(row?.__gameroadHistoryEntry)};
            });
            expect(result.ok, JSON.stringify(result)).toBeTruthy(); expect(result.frozen).toEqual(result.a); expect(result.current).toEqual(result.b); expect(result.bound).toBeTruthy();
          });
          '''
          p.write_text(s.replace(anchor,block+anchor,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'gameroad-r12-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html tests/browser-full-interaction-state-sequence.spec.mjs
          git commit -m 'fix(records): preserve completed-match Deck snapshot'

      - name: Cleanup transient authorization and writer then push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-records-history-deck-r12.yml data/preaction-authorizations/RECORDS-HISTORY-DECK-R12-20260911T1202-SOL-H7Q4N5.json
          git add -u .github/workflows/zz-temp-records-history-deck-r12.yml data/preaction-authorizations/RECORDS-HISTORY-DECK-R12-20260911T1202-SOL-H7Q4N5.json
          git commit -m 'chore: cleanup Records R12 authorization'
          git push origin HEAD:sol/records-used-deck-r12-20260911
