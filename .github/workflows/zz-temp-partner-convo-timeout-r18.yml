name: TEMP Partner conversation timeout R18

on:
  push:
    branches:
      - sol/partner-convo-upstream-timeout-r18-20260912

permissions:
  contents: write

jobs:
  bounded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/partner-convo-upstream-timeout-r18-20260912
          fetch-depth: 0

      - name: Verify bounded starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d48a97b9da3224bb9cd8a62cac0497ba4b5144a7"
          test "$(git hash-object deploy/cloudflare/functions/ws.js)" = "b10a7ea1d8e71325867cfa7ac92b40d8c23666e8"
          test "$(git hash-object tests/partner-conversation-core.test.mjs)" = "31c5f1065030a8ad4c408013ca5b3b56f0f93b07"

      - name: Apply exact Partner timeout patch
        shell: python
        run: |
          from pathlib import Path

          ws_path = Path('deploy/cloudflare/functions/ws.js')
          test_path = Path('tests/partner-conversation-core.test.mjs')
          ws = ws_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          endpoint = "const PARTNER_ENDPOINT = 'https://api.convai.com/character/getResponse';\n"
          timeout_decl = endpoint + "const PARTNER_UPSTREAM_TIMEOUT_MS = 15_000;\n"
          assert ws.count(endpoint) == 1, 'PARTNER_ENDPOINT declaration drifted'
          assert 'PARTNER_UPSTREAM_TIMEOUT_MS' not in ws, 'timeout already present unexpectedly'
          ws = ws.replace(endpoint, timeout_decl, 1)

          old = """  const upstreamFetch = typeof context?.fetch === 'function' ? context.fetch : fetch;\n  let upstream;\n  try {\n    upstream = await upstreamFetch(PARTNER_ENDPOINT, {\n      method: 'POST',\n      headers: { 'CONVAI-API-KEY': apiKey },\n      body: form,\n    });\n  } catch {\n    return json({ ok: false, state: 'provider_unavailable' }, 502);\n  }\n  if (!upstream?.ok) return json({ ok: false, state: 'provider_unavailable' }, 502);\n\n  let payload;\n  try {\n    payload = await upstream.json();\n  } catch {\n    return json({ ok: false, state: 'provider_invalid' }, 502);\n  }\n"""
          new = """  const upstreamFetch = typeof context?.fetch === 'function' ? context.fetch : fetch;\n  const abortController = new AbortController();\n  const timeoutId = setTimeout(() => abortController.abort(), PARTNER_UPSTREAM_TIMEOUT_MS);\n  let upstream;\n  let payload;\n  try {\n    upstream = await upstreamFetch(PARTNER_ENDPOINT, {\n      method: 'POST',\n      headers: { 'CONVAI-API-KEY': apiKey },\n      body: form,\n      signal: abortController.signal,\n    });\n    if (!upstream?.ok) return json({ ok: false, state: 'provider_unavailable' }, 502);\n    try {\n      payload = await upstream.json();\n    } catch {\n      return json({\n        ok: false,\n        state: abortController.signal.aborted ? 'provider_unavailable' : 'provider_invalid',\n      }, 502);\n    }\n  } catch {\n    return json({ ok: false, state: 'provider_unavailable' }, 502);\n  } finally {\n    clearTimeout(timeoutId);\n  }\n"""
          assert ws.count(old) == 1, 'Partner upstream fetch block drifted'
          ws = ws.replace(old, new, 1)

          marker = "test('server Partner transport aborts a hung upstream and returns bounded non-success'"
          assert marker not in tests, 'timeout regression already present unexpectedly'
          tests += r'''

test('server Partner transport aborts a hung upstream and returns bounded non-success', { concurrency: false }, async () => {
  const { onRequest } = await import('../deploy/cloudflare/functions/ws.js');
  const originalSetTimeout = globalThis.setTimeout;
  const originalClearTimeout = globalThis.clearTimeout;
  const timerToken = Symbol('partner-timeout');
  let timeoutMs = null;
  let cleared = false;
  let observedSignal = null;

  globalThis.setTimeout = (callback, ms) => {
    timeoutMs = ms;
    queueMicrotask(callback);
    return timerToken;
  };
  globalThis.clearTimeout = (token) => {
    if (token === timerToken) cleared = true;
  };

  try {
    const response = await onRequest({
      request: new Request('https://example.test/ws?partnerOp=conversation', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ userMessage: '返答が止まった時も会話へ戻って' }),
      }),
      env: {
        CONVAI_API_KEY: 'test-api-key',
        CONVAI_SAASUNA_CHARACTER_ID: 'saasuna-current',
      },
      fetch: async (_url, options) => {
        observedSignal = options.signal;
        return new Promise((_resolve, reject) => {
          const rejectAbort = () => reject(new Error('aborted upstream'));
          if (observedSignal.aborted) rejectAbort();
          else observedSignal.addEventListener('abort', rejectAbort, { once: true });
        });
      },
    });
    assert.equal(response.status, 502);
    assert.deepEqual(await response.json(), { ok: false, state: 'provider_unavailable' });
    assert.equal(timeoutMs, 15_000);
    assert.equal(observedSignal instanceof AbortSignal, true);
    assert.equal(observedSignal.aborted, true);
    assert.equal(cleared, true);
  } finally {
    globalThis.setTimeout = originalSetTimeout;
    globalThis.clearTimeout = originalClearTimeout;
  }
});

test('server Partner transport preserves timely valid, invalid, and missing-config paths', async () => {
  const { onRequest } = await import('../deploy/cloudflare/functions/ws.js');
  let observedSignal = null;
  const makeRequest = () => new Request('https://example.test/ws?partnerOp=conversation', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ userMessage: '今日も一緒に話そう' }),
  });
  const env = {
    CONVAI_API_KEY: 'test-api-key',
    CONVAI_SAASUNA_CHARACTER_ID: 'saasuna-current',
  };

  const okResponse = await onRequest({
    request: makeRequest(),
    env,
    fetch: async (_url, options) => {
      observedSignal = options.signal;
      return new Response(JSON.stringify({
        charID: 'saasuna-current',
        text: 'もちろん。何から話す？',
        sessionID: 'provider-session-1',
      }), { status: 200, headers: { 'content-type': 'application/json' } });
    },
  });
  assert.equal(okResponse.status, 200);
  assert.deepEqual(await okResponse.json(), {
    ok: true,
    text: 'もちろん。何から話す？',
    providerSessionId: 'provider-session-1',
  });
  assert.equal(observedSignal instanceof AbortSignal, true);
  assert.equal(observedSignal.aborted, false);

  const invalidResponse = await onRequest({
    request: makeRequest(),
    env,
    fetch: async () => new Response(JSON.stringify({
      charID: 'someone-else',
      text: 'wrong identity',
      sessionID: 'provider-session-2',
    }), { status: 200, headers: { 'content-type': 'application/json' } }),
  });
  assert.equal(invalidResponse.status, 502);
  assert.deepEqual(await invalidResponse.json(), { ok: false, state: 'provider_invalid' });

  const missingConfig = await onRequest({
    request: makeRequest(),
    env: {},
    fetch: async () => { throw new Error('must not call provider'); },
  });
  assert.equal(missingConfig.status, 503);
  assert.deepEqual(await missingConfig.json(), { ok: false, state: 'not_configured' });
});
'''

          ws_path.write_text(ws, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')

      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/cloudflare/functions/ws.js
          node --test tests/partner-conversation-core.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

      - name: Commit bounded durable diff and self-clean transients
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-partner-convo-timeout-r18.yml
          rm -f data/preaction-authorizations/PARTNER-CONVO-UPSTREAM-TIMEOUT-R18-20260912T1803-SOL-Q6N4P14.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Partner: bound upstream conversation wait'
          git push origin HEAD:sol/partner-convo-upstream-timeout-r18-20260912
