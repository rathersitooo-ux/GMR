name: Required Gate auto-merge

on:
  workflow_run:
    workflows: ["GAMEROAD Required Gate"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge-work-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update stale base or merge exact tested work PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request associated with this Required Gate run."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          if [ "${state}" != "open" ] || [ "${draft}" != "false" ]; then
            echo "PR is not an open non-draft PR; skip."
            exit 0
          fi
          if [ "${base_ref}" != "main" ] || [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
            echo "PR is not a same-repository main-targeting PR; skip."
            exit 0
          fi
          case "${head_ref}" in
            work/*) ;;
            *) echo "PR head is not work/**; skip."; exit 0 ;;
          esac
          if [ "${head_sha}" != "${TESTED_HEAD_SHA}" ]; then
            echo "Head moved after Required Gate; wait for the newer Gate run."
            exit 0
          fi

          if [ -n "${TESTED_BASE_SHA}" ] && [ "${base_sha}" != "${TESTED_BASE_SHA}" ]; then
            echo "Base advanced after this Gate run; updating PR branch first."
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="${head_sha}"
            echo "Branch update requested. The synchronize event will run Required Gate again."
            exit 0
          fi

          public_deploy_needed=false
          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/cloudflare-public-deploy.yml|browser/*|deploy/cloudflare/*|assets/*|tools/*)
                public_deploy_needed=true
                break
                ;;
            esac
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')

          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${head_sha}" \
            -f merge_method=squash)"
          if [ "$(jq -r '.merged' <<<"${result}")" != "true" ]; then
            echo "Merge was not accepted."
            jq . <<<"${result}"
            exit 1
          fi
          echo "public_deploy_needed=${public_deploy_needed}" >> "${GITHUB_OUTPUT}"
          echo "Merged PR #${PR_NUMBER} at tested head ${head_sha} and tested base ${base_sha}."

      - name: Dispatch current public build
        if: steps.merge.outputs.public_deploy_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloudflare-public-deploy.yml --ref main
          echo "Dispatched GAMEROAD Cloudflare Public Deploy for current main."
