name: zz-temp-partner-idle-shell-r1

on:
  push:
    branches:
      - sol/partner-idle-shell-r1-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'RUN_R1_PARTNER_IDLE_SHELL_WRITER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved Partner idle line to existing shell
        shell: bash
        run: |
          set -euo pipefail
          BASE='46dcb174d13eef1e700db6d9c129438af42c1f13'
          PRE='data/preaction-authorizations/PARTNER-IDLE-SHELL-R1-20260910T0520-SOL-P7N4Q6.json'
          WF='.github/workflows/zz-temp-partner-idle-shell-r1.yml'
          test "$(git rev-parse HEAD^^)" = "$BASE"

          python - <<'PY'
          from pathlib import Path

          runtime = Path('browser/partner-shell-runtime-mount.mjs')
          text = runtime.read_text()

          anchor = "import { mountPartnerCostumeScreen } from './partner-costume-screen-runtime-mount.mjs';\n"
          insert = anchor + "import { selectApprovedPartnerIdleUtterance } from './partner-dialogue-source-registry.mjs';\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)

          anchor = "  const roster = Object.freeze(view.roster.map((partner) => Object.freeze({\n    ...partner,\n    detailAction: view.view === 'list' && dispatchAllowed(\n      canDispatch,\n      'OPEN_DETAIL',\n      Object.freeze({ ...context, partnerId: partner.partnerId, targetView: 'detail' }),\n    ) ? frozenAction('OPEN_DETAIL', '詳細', { targetView: 'detail', partnerId: partner.partnerId }) : null,\n  })));\n\n"
          insert = anchor + "  const idleReadableLine = view.view === 'hub' && view.activePartnerId\n    ? selectApprovedPartnerIdleUtterance({\n        partnerId: view.activePartnerId,\n        seed: `partner-shell:${view.activePartnerId}`,\n      })\n    : null;\n\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'model anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)

          anchor = "    postBattleLine: view.postBattleLine,\n    voiceTuning: normalizePartnerVoiceTuning(input.partnerVoiceTuning),\n"
          insert = "    postBattleLine: view.postBattleLine,\n    idleReadableLine,\n    voiceTuning: normalizePartnerVoiceTuning(input.partnerVoiceTuning),\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'return anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)

          anchor = "  if (model.view === 'hub') {\n    const menu = element(doc, 'div', 'partner-shell-menu');\n"
          insert = "  if (model.view === 'hub') {\n    if (model.idleReadableLine?.text) {\n      const idle = element(doc, 'p', 'partner-shell-idle-readable', model.idleReadableLine.text);\n      idle.dataset.partnerId = model.idleReadableLine.partnerId;\n      idle.dataset.sourceState = model.idleReadableLine.sourceState;\n      idle.dataset.presentationOnly = 'true';\n      section.append(idle);\n    }\n    const menu = element(doc, 'div', 'partner-shell-menu');\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'render anchor count={text.count(anchor)}')
          text = text.replace(anchor, insert, 1)
          runtime.write_text(text)

          test_path = Path('tests/partner-shell-runtime-mount.test.mjs')
          tests = test_path.read_text()

          anchor = "  assert.equal(model.deadButtonAllowed, false);\n  assert.equal(model.readOnlyProjection, true);\n});\n"
          insert = "  assert.equal(model.deadButtonAllowed, false);\n  assert.equal(model.readOnlyProjection, true);\n  assert.equal(model.idleReadableLine?.partnerId, 'partner.saasuna');\n  assert.equal(model.idleReadableLine?.sourceState, 'approved_current');\n  assert.equal(model.idleReadableLine?.presentationOnly, true);\n  assert.equal(model.idleReadableLine?.automaticGameMutationAllowed, false);\n});\n\ntest('hub idle readable content stays silent for Partner without approved source', () => {\n  const model = buildPartnerShellRuntimeModel({ activePartnerId: 'partner.other', roster });\n  assert.equal(model.idleReadableLine, null);\n});\n"
          if tests.count(anchor) != 1:
              raise SystemExit(f'first-test anchor count={tests.count(anchor)}')
          tests = tests.replace(anchor, insert, 1)

          anchor = "  assert.equal(result.ok, true);\n  assert.equal(root.children[0].dataset.partnerShellView, 'hub');\n  const buttons = allNodes(root).filter((node) => node.tagName === 'BUTTON');\n"
          insert = "  assert.equal(result.ok, true);\n  assert.equal(root.children[0].dataset.partnerShellView, 'hub');\n  const idleLines = allNodes(root).filter((node) => node.className === 'partner-shell-idle-readable');\n  assert.equal(idleLines.length, 1);\n  assert.equal(idleLines[0].dataset.partnerId, 'partner.saasuna');\n  assert.equal(idleLines[0].dataset.sourceState, 'approved_current');\n  assert.equal(idleLines[0].dataset.presentationOnly, 'true');\n  const buttons = allNodes(root).filter((node) => node.tagName === 'BUTTON');\n"
          if tests.count(anchor) != 1:
              raise SystemExit(f'mount-test anchor count={tests.count(anchor)}')
          tests = tests.replace(anchor, insert, 1)
          test_path.write_text(tests)
          PY

          node --test tests/partner-shell-runtime-mount.test.mjs
          node --test tests/partner-dialogue-source-registry.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs
          git diff --check

          rm -f "$PRE" "$WF"

          python - <<'PY'
          import subprocess
          expected = sorted([
              'browser/partner-shell-runtime-mount.mjs',
              'tests/partner-shell-runtime-mount.test.mjs',
          ])
          actual = sorted(filter(None, subprocess.check_output([
              'git','diff','--name-only','46dcb174d13eef1e700db6d9c129438af42c1f13'
          ], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(f'unexpected final diff paths: {actual}')
          PY

          git config user.name 'gameroad-bounded-writer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Partner: 相方画面に承認済みのひとことを表示'
          git push origin HEAD:sol/partner-idle-shell-r1-20260910
