name: TEMP CROSSSCREEN R37 Executor Recovery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crossscreen-r37-infinite-conveyor-mount-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact recovery state and execute retained R37 patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=1bab3183c7cfefed209a9ea5465924d3223d6bd0
          PRIOR=f74637c956d4a43e1ea4086c06d965cb63e2ad35
          TEMP=.github/workflows/zz-temp-crossscreen-r37-infinite-conveyor-mount.yml
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git merge-base --is-ancestor "$PRIOR" HEAD
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "3e02fd3f14ef16287bc9d93f0cbd6e1018b83dd8"
          test "$(git hash-object tests/battle-replay-live-adapter.test.mjs)" = "0820826fa1d4da20342a69bee170132f6ce4633d"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "93a3f53a7dbd0e13640acac752779eb79ec137ce"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "80c72cbcdb2a618fe4d7ee78c2097d4dab86c308"
          git show "$PRIOR:$TEMP" > /tmp/r37-original.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('/tmp/r37-original.yml').read_text().splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() == 'run: |':
                  indent = len(line) - len(line.lstrip())
                  body = []
                  i += 1
                  while i < len(lines):
                      raw = lines[i]
                      if not raw.strip():
                          body.append('')
                          i += 1
                          continue
                      current = len(raw) - len(raw.lstrip())
                      if current <= indent:
                          break
                      body.append(raw[min(len(raw), indent + 2):])
                      i += 1
                  blocks.append('\n'.join(body) + '\n')
                  continue
              i += 1
          if len(blocks) != 4:
              raise SystemExit(f'EXPECTED_4_RUN_BLOCKS_GOT_{len(blocks)}')
          for index in (1, 2):
              subprocess.run(['bash', '-lc', blocks[index]], check=True)
          PY
      - name: Commit only the acquired durable delta and remove executor
        shell: bash
        run: |
          set -euo pipefail
          BASE=1bab3183c7cfefed209a9ea5465924d3223d6bd0
          TEMP=.github/workflows/zz-temp-crossscreen-r37-infinite-conveyor-mount.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs tests/browser-full-interaction.spec.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m "CROSSSCREEN R37: mount finite conveyor environment in live Battle presentation"
          git rm "$TEMP"
          git commit -m "CROSSSCREEN R37: remove temporary recovery executor"
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${changed[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${changed[2]}" = "tests/battle-replay-live-adapter.test.mjs"
          test "${changed[3]}" = "tests/browser-full-interaction.spec.mjs"
          git push origin HEAD:work/crossscreen-r37-infinite-conveyor-mount-recovery
