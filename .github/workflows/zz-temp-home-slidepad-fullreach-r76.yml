name: TEMP Home SlidePad full reach R76

on:
  push:
    branches:
      - work/home-slidepad-fullreach-r76-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/home-slidepad-fullreach-r76-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('browser/home-boot-runtime-mount.mjs')
          s = source.read_text()
          old_const = "const SLIDEPAD_LOCAL_FEEDBACK_MAX_PX = 144;\n"
          old_block = '''function moveKnobWithGesture(center, dx, dy) {
            if (!(center instanceof HTMLElement)) return;
            const distance = Math.hypot(dx, dy);
            if (!Number.isFinite(distance) || distance <= 0) {
              center.style.setProperty('--gameroad-home-slidepad-x', '0px');
              center.style.setProperty('--gameroad-home-slidepad-y', '0px');
              return;
            }
            const gain = Math.min(1, SLIDEPAD_LOCAL_FEEDBACK_MAX_PX / distance);
            center.style.setProperty('--gameroad-home-slidepad-x', `${(dx * gain).toFixed(1)}px`);
            center.style.setProperty('--gameroad-home-slidepad-y', `${(dy * gain).toFixed(1)}px`);
          }
          '''
          new_block = '''export function resolveHomeSlidepadFeedbackTranslation({ dx = 0, dy = 0 } = {}) {
            const x = Number(dx);
            const y = Number(dy);
            if (![x, y].every(Number.isFinite)) return null;
            return Object.freeze({ x, y });
          }

          function moveKnobWithGesture(center, dx, dy) {
            if (!(center instanceof HTMLElement)) return;
            const translation = resolveHomeSlidepadFeedbackTranslation({ dx, dy });
            if (!translation) return;
            center.style.setProperty('--gameroad-home-slidepad-x', `${translation.x.toFixed(1)}px`);
            center.style.setProperty('--gameroad-home-slidepad-y', `${translation.y.toFixed(1)}px`);
          }
          '''
          marker = 'export function resolveHomeSlidepadFeedbackTranslation'
          old_counts = (s.count(old_const), s.count(old_block), s.count(marker))
          if old_counts == (0, 0, 1):
              print('R76 source patch already applied')
          elif old_counts != (1, 1, 0):
              raise SystemExit(f'fail closed: unexpected source cardinality {old_counts}')
          else:
              s = s.replace(old_const, '', 1).replace(old_block, new_block, 1)
              source.write_text(s)

          test = Path('tests/home-boot-presentation.test.mjs')
          t = test.read_text()
          old_import = '  removeLegacyHomeNodes,\n  resolveHomeSlidepadRayTarget,\n'
          new_import = '  removeLegacyHomeNodes,\n  resolveHomeSlidepadFeedbackTranslation,\n  resolveHomeSlidepadRayTarget,\n'
          test_name = "test('Home SlidePad visual feedback follows the full pointer displacement without a fixed pixel clamp'"
          import_counts = (t.count(old_import), t.count(new_import), t.count(test_name))
          if import_counts == (0, 1, 1):
              print('R76 test patch already applied')
          elif import_counts != (1, 0, 0):
              raise SystemExit(f'fail closed: unexpected test cardinality {import_counts}')
          else:
              t = t.replace(old_import, new_import, 1)
              t += '''\n\ntest('Home SlidePad visual feedback follows the full pointer displacement without a fixed pixel clamp', () => {\n  assert.deepEqual(resolveHomeSlidepadFeedbackTranslation({ dx: 320, dy: -180 }), { x: 320, y: -180 });\n  assert.deepEqual(resolveHomeSlidepadFeedbackTranslation({ dx: -260, dy: 90 }), { x: -260, y: 90 });\n  assert.equal(resolveHomeSlidepadFeedbackTranslation({ dx: Number.POSITIVE_INFINITY, dy: 0 }), null);\n});\n'''
              test.write_text(t)
          PY
      - name: Focused Home tests
        run: node --test tests/home-boot-presentation.test.mjs
      - name: Commit product delta if needed
        shell: bash
        run: |
          if git diff --quiet -- browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs; then
            echo 'No product diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs
          git commit -m 'fix(home): let slidepad follow full pointer reach'
          git push origin HEAD:work/home-slidepad-fullreach-r76-20260902
