name: TEMP NormalMatch R8 current-main recovery

on:
  push:
    branches:
      - work/normalmatch-r8-currentmain-resultgeometry
    paths:
      - .github/workflows/tmp-normalmatch-r8-recovery.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-normalmatch-r8-recovery.yml

permissions:
  contents: write

jobs:
  recover-current-main:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/normalmatch-r8-currentmain-resultgeometry
          fetch-depth: 0

      - name: Reapply current PR335 candidate onto fresh main and fix Result geometry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main pull/335/head:refs/remotes/origin/pr335-r8
          BASE="$(git merge-base origin/main refs/remotes/origin/pr335-r8)"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$BASE" != "$CURRENT_MAIN" ]]; then
            echo "::error::PR335 is not based on current main: merge_base=$BASE main=$CURRENT_MAIN"
            exit 1
          fi
          git diff --binary "$BASE" refs/remotes/origin/pr335-r8 -- \
            .github/workflows/gameroad-required-gate.yml \
            browser/GAMEROAD.html \
            browser/post-match-autoqueue-core.mjs \
            tests/browser-runtime-smoke.spec.mjs \
            tests/post-match-autoqueue-core.test.mjs > /tmp/normal-r6.patch
          test -s /tmp/normal-r6.patch
          git apply --3way /tmp/normal-r6.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          s = p.read_text()
          old_root = '#postMatchAutoQueue{grid-column:auto;min-width:0;gap:3px;flex-wrap:nowrap;padding:5px 4px;font-size:9px;justify-content:center}'
          new_root = '#postMatchAutoQueue{grid-column:auto;min-width:0;min-height:0;gap:3px;flex-wrap:nowrap;padding:0 3px;font-size:9px;line-height:1;justify-content:center}'
          old_input = '#postMatchAutoQueue input{width:16px;height:16px;flex:0 0 auto}'
          new_input = '#postMatchAutoQueue input{width:14px;height:14px;flex:0 0 auto}'
          if s.count(old_root) != 1:
              raise SystemExit(f'expected one compact autoqueue root rule, found {s.count(old_root)}')
          if s.count(old_input) != 1:
              raise SystemExit(f'expected one compact autoqueue input rule, found {s.count(old_input)}')
          s = s.replace(old_root, new_root, 1).replace(old_input, new_input, 1)
          p.write_text(s)
          PY

          node --test tests/post-match-autoqueue-core.test.mjs
          node --check browser/post-match-autoqueue-core.mjs

          rm .github/workflows/tmp-normalmatch-r8-recovery.yml
          git add .github/workflows/gameroad-required-gate.yml browser/GAMEROAD.html browser/post-match-autoqueue-core.mjs tests/browser-runtime-smoke.spec.mjs tests/post-match-autoqueue-core.test.mjs .github/workflows/tmp-normalmatch-r8-recovery.yml
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No durable R8 product delta'; exit 1; }
          git commit -m 'Normal R8: recover autoqueue and fix Result geometry'
          git push origin HEAD:work/normalmatch-r8-currentmain-resultgeometry
