name: zz-temp-battle-camera-html-r5d

on:
  push:
    branches:
      - sol/battle-camera-html-r5d-20260910
    paths:
      - .github/workflows/zz-temp-battle-camera-html-r5d.yml

permissions:
  contents: write

concurrency:
  group: battle-camera-html-r5d-20260910
  cancel-in-progress: false

jobs:
  replay-tested-camera-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-camera-html-r5d-20260910

      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "d8b5bb1c0e22282ba4492d447c21cb62216f43b8"

      - name: Replay exact tested camera donor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            sol/battle-camera-html-r5c-20260910:refs/remotes/origin/camera-r5c
          donor="refs/remotes/origin/camera-r5c"
          test "$(git rev-parse "$donor")" = "6bb885c5233026bbdbc98dde2fb40e8fe68ee8cd"

          git diff --binary \
            70e11db18ac8981b571bd6e4996c6db1c1c45db1 \
            "$donor" -- browser/GAMEROAD.html > /tmp/camera-html.patch
          test -s /tmp/camera-html.patch
          git apply --3way --index /tmp/camera-html.patch

          git show "$donor":tests/battle-camera-live-integration.test.mjs \
            > tests/battle-camera-live-integration.test.mjs
          git add tests/battle-camera-live-integration.test.mjs

          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "browser/GAMEROAD.html"
          test "${changed[1]}" = "tests/battle-camera-live-integration.test.mjs"

          mapfile -t numstat < <(git diff --cached --numstat | sort -k3)
          printf '%s\n' "${numstat[@]}"
          test "${numstat[0]}" = $'37\t8\tbrowser/GAMEROAD.html'
          test "${numstat[1]}" = $'47\t0\ttests/battle-camera-live-integration.test.mjs'

          cmp \
            <(git show "$donor":tests/battle-camera-live-integration.test.mjs) \
            tests/battle-camera-live-integration.test.mjs

      - name: Run focused camera tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/battle-camera-input-router.test.mjs \
            tests/battle-camera-live-runtime.test.mjs \
            tests/battle-camera-live-integration.test.mjs

      - name: Persist clean donor and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-bounded-writer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/zz-temp-battle-camera-html-r5d.yml
          git add browser/GAMEROAD.html tests/battle-camera-live-integration.test.mjs
          git commit -m "Battle: 自由カメラHTML donorをfresh mainへ再適用"

          mapfile -t final_changed < <(git diff --name-only d8b5bb1c0e22282ba4492d447c21cb62216f43b8..HEAD | sort)
          test "${#final_changed[@]}" -eq 2
          test "${final_changed[0]}" = "browser/GAMEROAD.html"
          test "${final_changed[1]}" = "tests/battle-camera-live-integration.test.mjs"
          git diff --check d8b5bb1c0e22282ba4492d447c21cb62216f43b8..HEAD
          git push origin HEAD:sol/battle-camera-html-r5d-20260910
