name: temp Battle roulette player-path audit R3

on:
  push:
    branches:
      - sol/battle-roulette-playerpath-audit-r3-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Exact branch and product immutability baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
          echo "HTML_BYTES=$(wc -c < browser/GAMEROAD.html)"
          git status --porcelain=v1

      - name: Audit production authority to roulette mount seam
        shell: python
        run: |
          from pathlib import Path
          import json, re

          path = Path('browser/GAMEROAD.html')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          patterns = [
              'mountBattleJankenSlidePadRuntime',
              'rouletteEnabled',
              'projectOptionalRuleActivation',
              'readResolvedOptionalRuleAuthority',
              'optionalRules',
              'authorityRef',
              'data-battle-playable-hand-row-roulette',
              '__GAMEROAD_BATTLE_JANKEN_SLIDEPAD_RUNTIME__',
              'battle-new-base-live-consumer-adapter',
              'battle-optional-rule-activation-core',
              'battle-janken-slidepad-runtime-mount',
          ]
          summary = {}
          print('=== HTML SEAM AUDIT BEGIN ===')
          for needle in patterns:
              hits = [i for i, line in enumerate(lines) if needle in line]
              summary[needle] = len(hits)
              print(f'\n### {needle} count={len(hits)}')
              for hit in hits[:12]:
                  lo = max(0, hit - 8)
                  hi = min(len(lines), hit + 9)
                  print(f'--- context lines {lo+1}-{hi} hit={hit+1} ---')
                  for j in range(lo, hi):
                      safe = lines[j]
                      if len(safe) > 800:
                          safe = safe[:800] + '…<truncated>'
                      print(f'{j+1}: {safe}')
          print('\n=== SUMMARY JSON ===')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          print('=== HTML SEAM AUDIT END ===')

      - name: Verify current component contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/battle-optional-rule-activation-core.test.mjs \
            tests/battle-playable-hand-row-roulette-runtime.test.mjs \
            tests/battle-janken-slidepad-runtime-mount.test.mjs

      - name: Product bytes remain untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "FINAL_HTML_BLOB=$(git hash-object browser/GAMEROAD.html)"
