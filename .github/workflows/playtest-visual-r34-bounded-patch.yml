name: PLAYTEST R42 update banner source diagnostic

on:
  push:
    branches:
      - work/visual-r34-result-update-banner
    paths:
      - .github/workflows/playtest-visual-r34-bounded-patch.yml

permissions:
  contents: write

env:
  EXACT_BASE: aa77a5799da2de6bea9d28640df46e4328c2046e
  EXACT_HTML_BLOB: 477325641fa328ecd55cdc15a11a5d0ea90759f1
  EXACT_TEST_BLOB: 5386451be827ac75554f8f99c7d0d4586a5a07c2

jobs:
  extract-current-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-r34-result-update-banner
          fetch-depth: 0
      - name: Verify exact current product and extract bounded source contexts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_BASE"
          git checkout origin/main -- browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          test "$(git hash-object browser/GAMEROAD.html)" = "$EXACT_HTML_BLOB"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "$EXACT_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('browser/GAMEROAD.html').read_text(encoding='utf-8-sig')
          tokens = [
              'async checkUpdate(){',
              'renderUpdateBanner(){',
              'renderUpdateBanner()',
              "state.screen='home'",
              'state.screen="home"',
              'state.screen=',
              'data-screen="home"',
              'function showScreen',
              'showScreen(',
              'function show(',
              'show(screen',
              "screen==='home'",
              "screen === 'home'",
          ]
          out=[]
          seen=set()
          for token in tokens:
              start=0
              hit=0
              while True:
                  i=data.find(token,start)
                  if i < 0: break
                  key=(max(0,i-1200),min(len(data),i+2200))
                  if key not in seen:
                      seen.add(key)
                      hit+=1
                      out.append(f'===== TOKEN {token!r} HIT {hit} @ {i} =====\n')
                      out.append(data[key[0]:key[1]])
                      out.append('\n\n')
                  start=i+len(token)
                  if hit >= 8: break
          if not any('async checkUpdate(){' in x for x in out):
              raise SystemExit('checkUpdate anchor not found')
          Path('.tmp-update-banner-source.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git checkout -- browser/GAMEROAD.html tests/browser-full-interaction.spec.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-update-banner-source.txt
          git commit -m "PLAYTEST R42: record current update banner anchors"
          git push origin HEAD:work/visual-r34-result-update-banner
