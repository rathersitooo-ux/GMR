name: BROWSER Battle AOI R5 bootstrap

on:
  push:
    branches:
      - work/BROWSER-BATTLE-VISUAL-AOI-REBASE-001

permissions:
  contents: write

jobs:
  patch-browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact one-site Browser patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          data = p.read_bytes()
          old = b'.battleInfo.r10MockParity{grid-template-columns:190px 130px minmax(315px,1fr)!important}'
          new = b'.battleInfo.r10MockParity{grid-template-columns:190px 130px minmax(0,1fr)!important}'
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact target, found {count}')
          p.write_bytes(data.replace(old, new, 1))
          PY
      - name: Commit Browser-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "browser/GAMEROAD.html"
          git commit -m '[BROWSER-BATTLE-VISUAL-AOI-REBASE-001] fix short-landscape Ready rail overlap'
          git push origin "HEAD:${GITHUB_REF_NAME}"
