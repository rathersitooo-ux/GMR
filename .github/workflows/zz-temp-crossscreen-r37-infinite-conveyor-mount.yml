name: TEMP CROSSSCREEN R37 Infinite Conveyor Mount

on:
  push:
    branches:
      - work/crossscreen-r37-infinite-conveyor-mount-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crossscreen-r37-infinite-conveyor-mount-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard current base and exact acquired preimages
        shell: bash
        run: |
          set -euo pipefail
          BASE=1bab3183c7cfefed209a9ea5465924d3223d6bd0
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git hash-object browser/battle-replay-live-adapter.mjs)" = "3e02fd3f14ef16287bc9d93f0cbd6e1018b83dd8"
          test "$(git hash-object tests/battle-replay-live-adapter.test.mjs)" = "0820826fa1d4da20342a69bee170132f6ce4633d"
          test "$(git hash-object tests/browser-full-interaction.spec.mjs)" = "93a3f53a7dbd0e13640acac752779eb79ec137ce"
          test "$(git hash-object deploy/cloudflare/tests/build.test.mjs)" = "80c72cbcdb2a618fe4d7ee78c2097d4dab86c308"
      - name: Mount existing conveyor planner into existing replay presentation consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          adapter_path = Path('browser/battle-replay-live-adapter.mjs')
          text = adapter_path.read_text()
          old_import = "import { planBattleConveyor } from './battle-conveyor-presentation-core.mjs';"
          new_import = "import {\n  planBattleConveyor,\n  planBattleConveyorEnvironmentFrame\n} from './battle-conveyor-presentation-core.mjs';"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          anchor = "const CARD_PRESENTATION_HOLD_MS = 400;\n"
          constants = """const CARD_PRESENTATION_HOLD_MS = 400;
          const BATTLE_CONVEYOR_ENV_STYLE_ID = 'gameroad-battle-conveyor-environment-r37-style';
          const BATTLE_CONVEYOR_ENV_HOST_ATTR = 'data-battle-conveyor-environment';
          const BATTLE_CONVEYOR_ENV_SEGMENT_ATTR = 'data-battle-conveyor-segment';
          const BATTLE_CONVEYOR_ENV_SEGMENT_COUNT = 8;
          const BATTLE_CONVEYOR_ENV_TRAVEL_STEP = 0.16;
          const BATTLE_CONVEYOR_ENV_SETTLE_MS = 260;
          """
          constants = '\n'.join(line.strip() for line in constants.splitlines()) + '\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, constants, 1)

          style_anchor = "function ensureBattleReplayCardPresentationStyle(documentRef) {"
          environment_impl = r'''function ensureBattleReplayConveyorEnvironmentStyle(documentRef) {
            if (!documentRef?.head || typeof documentRef.createElement !== 'function') return false;
            if (documentRef.getElementById?.(BATTLE_CONVEYOR_ENV_STYLE_ID)) return true;
            const style = documentRef.createElement('style');
            style.id = BATTLE_CONVEYOR_ENV_STYLE_ID;
            style.textContent = `
          #battlePhaseSurface{isolation:isolate}
          #battlePhaseSurface [data-battle-conveyor-environment]{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;opacity:.86}
          #battlePhaseSurface [data-battle-conveyor-environment]::before{content:"";position:absolute;inset:5% 0 0;background:radial-gradient(ellipse at 50% 11%,rgba(176,255,233,.18) 0,rgba(55,128,112,.07) 17%,transparent 38%),linear-gradient(180deg,transparent 8%,rgba(16,54,49,.12) 52%,rgba(5,20,18,.38) 100%)}
          #battlePhaseSurface [data-battle-conveyor-segment]{position:absolute;left:50%;height:clamp(8px,2.4vh,22px);transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(90deg,transparent 0%,rgba(63,139,117,.12) 16%,rgba(163,244,213,.23) 50%,rgba(63,139,117,.12) 84%,transparent 100%);box-shadow:0 1px 0 rgba(200,255,236,.08),0 8px 18px rgba(3,16,13,.14);transition:top 220ms cubic-bezier(.2,.7,.2,1),width 220ms cubic-bezier(.2,.7,.2,1),opacity 180ms ease}
          #battlePhaseSurface [data-battle-conveyor-segment]::before,#battlePhaseSurface [data-battle-conveyor-segment]::after{content:"";position:absolute;top:-140%;width:14%;height:380%;border-radius:50%;background:radial-gradient(ellipse,rgba(46,112,83,.27),rgba(14,48,39,.08) 58%,transparent 72%);filter:blur(1px)}
          #battlePhaseSurface [data-battle-conveyor-segment]::before{left:-3%}
          #battlePhaseSurface [data-battle-conveyor-segment]::after{right:-3%}
          #battlePhaseSurface [data-battle-conveyor-environment][data-motion-suppressed="true"] [data-battle-conveyor-segment]{transition:none!important}
          @media(prefers-reduced-motion:reduce){#battlePhaseSurface [data-battle-conveyor-segment]{transition:none!important}}
          `;
            documentRef.head.appendChild(style);
            return true;
          }

          function battleReplayConveyorEnvironmentSegments(host) {
            if (!host || typeof host.querySelectorAll !== 'function') return [];
            return Array.from(host.querySelectorAll(`[${BATTLE_CONVEYOR_ENV_SEGMENT_ATTR}]`));
          }

          function ensureBattleReplayConveyorEnvironmentHost(documentRef, segmentCount) {
            const surface = documentRef?.getElementById?.('battlePhaseSurface');
            if (!surface || typeof documentRef?.createElement !== 'function') return null;
            ensureBattleReplayConveyorEnvironmentStyle(documentRef);
            let host = typeof surface.querySelector === 'function'
              ? surface.querySelector(`[${BATTLE_CONVEYOR_ENV_HOST_ATTR}]`)
              : null;
            if (!host) {
              host = documentRef.createElement('div');
              if (!host || typeof host.setAttribute !== 'function') return null;
              host.setAttribute(BATTLE_CONVEYOR_ENV_HOST_ATTR, '');
              host.setAttribute('aria-hidden', 'true');
              if (typeof surface.insertBefore === 'function') surface.insertBefore(host, surface.firstChild || null);
              else if (typeof surface.appendChild === 'function') surface.appendChild(host);
              else return null;
            }
            let segments = battleReplayConveyorEnvironmentSegments(host);
            if (segments.length !== segmentCount) {
              if (typeof host.replaceChildren === 'function') host.replaceChildren();
              else host.textContent = '';
              segments = [];
              for (let index = 0; index < segmentCount; index += 1) {
                const segment = documentRef.createElement('i');
                if (!segment || typeof segment.setAttribute !== 'function') return null;
                segment.setAttribute(BATTLE_CONVEYOR_ENV_SEGMENT_ATTR, `visual-segment-${index}`);
                segment.setAttribute('aria-hidden', 'true');
                if (typeof host.appendChild !== 'function') return null;
                host.appendChild(segment);
                segments.push(segment);
              }
            }
            return { surface, host, segments };
          }

          export function renderBattleReplayConveyorEnvironmentFrame(frame, environment = {}, eventId = null) {
            if (!frame || frame.presentationOnly !== true ||
                frame.schema !== 'gameroad.battle-conveyor-environment.v1' ||
                frame.environmentAuthority !== 'decorative_visual_loop_only' ||
                frame.gameStateWrite !== false || frame.position109Write !== false ||
                frame.targetWrite !== false || frame.orderWrite !== false ||
                !Array.isArray(frame.segments)) return false;
            const documentRef = environmentValue(environment, 'document');
            const mounted = ensureBattleReplayConveyorEnvironmentHost(documentRef, frame.segments.length);
            if (!mounted?.host?.dataset || mounted.segments.length !== frame.segments.length) return false;
            const { host, segments } = mounted;
            host.dataset.battleConveyorAuthority = frame.environmentAuthority;
            host.dataset.battleConveyorPhase = frame.phase;
            host.dataset.battleConveyorMotion = frame.motionIntent;
            host.dataset.motionSuppressed = frame.motionSuppressed ? 'true' : 'false';
            host.dataset.battleConveyorTravel = String(frame.effectiveTravel);
            if (nonEmptyString(eventId)) host.dataset.battleConveyorEvent = eventId;
            for (let index = 0; index < segments.length; index += 1) {
              const node = segments[index];
              const segment = frame.segments[index];
              if (!node?.dataset || !node.style || !segment || segment.segmentId !== `visual-segment-${index}`) return false;
              node.dataset.battleConveyorSegment = segment.segmentId;
              node.dataset.recycleCycle = String(segment.recycleCycle);
              node.dataset.normalizedDepth = segment.normalizedDepth.toFixed(6);
              node.style.top = `${(segment.screenY * 100).toFixed(3)}%`;
              node.style.width = `${(22 + (76 * segment.scale)).toFixed(3)}%`;
              node.style.opacity = segment.opacity.toFixed(4);
            }
            return true;
          }

          '''
          environment_impl = '\n'.join(line[10:] if line.startswith('          ') else line for line in environment_impl.splitlines()) + '\n'
          assert text.count(style_anchor) == 1
          text = text.replace(style_anchor, environment_impl + style_anchor, 1)

          bridge_start = text.index("export function createBattleReplayCardPresentationBridge(environment = {}) {")
          bridge_end = text.index("\nfunction formatPartnerBattleEventLogRow(event) {", bridge_start)
          new_bridge = r'''export function createBattleReplayCardPresentationBridge(environment = {}) {
            const sessions = new Map();
            const renderPlan = typeof environment.renderPlan === 'function'
              ? environment.renderPlan
              : plan => renderBattleReplayCardPresentationPlan(plan, environment);
            const renderEnvironment = typeof environment.renderEnvironment === 'function'
              ? environment.renderEnvironment
              : (frame, eventId) => renderBattleReplayConveyorEnvironmentFrame(frame, environment, eventId);

            function environmentFrame(travel, phase, preferences = readBattleReplayCardPresentationPreferences(environment)) {
              return planBattleConveyorEnvironmentFrame({
                segmentCount: BATTLE_CONVEYOR_ENV_SEGMENT_COUNT,
                travel,
                phase,
                reducedMotion: preferences.reducedMotion,
                lowPerf: preferences.lowPerf
              });
            }

            function renderEnvironmentFailSoft(frame, eventId) {
              try {
                renderEnvironment(frame, eventId);
              } catch {
                // Decorative environment is presentation-only and never owns replay/gameplay success.
              }
            }

            function createRuntime(matchId, preferences = readBattleReplayCardPresentationPreferences(environment)) {
              const frame = environmentFrame(0, 'IDLE_READ', preferences);
              return {
                state: createCardPresentationSession({ sessionId: matchId }),
                lastPlan: null,
                lastFinisherPlan: null,
                environmentTravel: 0,
                environmentEventId: `battle-environment:${matchId}:idle`,
                lastEnvironmentFrame: frame
              };
            }

            function begin(matchId) {
              if (!nonEmptyString(matchId)) throw new TypeError('MATCH_ID_REQUIRED');
              const runtime = createRuntime(matchId);
              sessions.set(matchId, runtime);
              renderEnvironmentFailSoft(runtime.lastEnvironmentFrame, runtime.environmentEventId);
              return runtime.state;
            }

            function acceptAcceptedResolution({ matchId, serial }) {
              if (!nonEmptyString(matchId)) throw new TypeError('MATCH_ID_REQUIRED');
              safeInteger(serial, 'RESOLUTION_SERIAL', 1);
              const preferences = readBattleReplayCardPresentationPreferences(environment);
              const current = sessions.get(matchId) || createRuntime(matchId, preferences);
              const result = applyCardPresentationEvent(current.state, {
                sessionId: matchId,
                eventId: `battle-resolution:${serial}`,
                authorized: true,
                visibility: 'public',
                kind: 'vfx',
                assets: {}
              }, preferences);

              if (!result.accepted) return result;
              const nextTravel = result.duplicate
                ? current.environmentTravel
                : current.environmentTravel + ((preferences.reducedMotion || preferences.lowPerf) ? 0 : BATTLE_CONVEYOR_ENV_TRAVEL_STEP);
              const nextEnvironmentFrame = result.duplicate
                ? current.lastEnvironmentFrame
                : environmentFrame(nextTravel, 'RESOLVE', preferences);
              const nextEnvironmentEventId = result.duplicate
                ? current.environmentEventId
                : result.plan?.eventId || `battle-resolution:${serial}`;
              sessions.set(matchId, {
                ...current,
                state: result.state,
                lastPlan: result.duplicate ? current.lastPlan : result.plan,
                environmentTravel: nextTravel,
                environmentEventId: nextEnvironmentEventId,
                lastEnvironmentFrame: nextEnvironmentFrame
              });
              if (!result.duplicate && result.plan) {
                try {
                  renderPlan(result.plan);
                } catch {
                  // Presentation is strictly fail-soft and never owns replay/gameplay success.
                }
                renderEnvironmentFailSoft(nextEnvironmentFrame, nextEnvironmentEventId);
                const setTimeoutRef = environmentValue(environment, 'setTimeout');
                if (typeof setTimeoutRef === 'function') {
                  setTimeoutRef(() => {
                    const latest = sessions.get(matchId);
                    if (!latest || latest.environmentEventId !== nextEnvironmentEventId) return;
                    const settleFrame = environmentFrame(
                      latest.environmentTravel,
                      'SETTLE_AFTERMATH',
                      readBattleReplayCardPresentationPreferences(environment)
                    );
                    sessions.set(matchId, { ...latest, lastEnvironmentFrame: settleFrame });
                    renderEnvironmentFailSoft(settleFrame, nextEnvironmentEventId);
                  }, BATTLE_CONVEYOR_ENV_SETTLE_MS);
                }
              }
              return result;
            }

            function acceptAcceptedMatchEnd({ matchId, winnerId, loserIds }) {
              if (!nonEmptyString(matchId)) throw new TypeError('MATCH_ID_REQUIRED');
              if (!nonEmptyString(winnerId)) throw new TypeError('FINISHER_WINNER_ID_REQUIRED');
              const normalizedLoserIds = stringArray(loserIds, 'FINISHER_LOSER_IDS');
              if (normalizedLoserIds.length !== 3 ||
                  new Set(normalizedLoserIds).size !== 3 ||
                  normalizedLoserIds.includes(winnerId)) {
                throw new TypeError('FINISHER_LOSER_IDS_INVALID');
              }
              const current = sessions.get(matchId) || createRuntime(matchId);
              const preferences = readBattleReplayCardPresentationPreferences(environment);
              const timeline = planBattleConveyor([{
                accepted: true,
                eventId: `match-end-finisher:${matchId}`,
                kind: 'finisher',
                publicData: {
                  winnerId,
                  loserIds: normalizedLoserIds
                }
              }], {
                reducedMotion: preferences.reducedMotion,
                lowPerf: preferences.lowPerf
              });
              const plan = timeline.plans[0] || null;
              sessions.set(matchId, {
                ...current,
                lastFinisherPlan: plan
              });
              if (plan) {
                try {
                  renderPlan(plan);
                } catch {
                  // Presentation is strictly fail-soft and never owns replay/gameplay success.
                }
              }
              return deepFreeze({ accepted: plan != null, plan });
            }

            function snapshot(matchId) {
              const runtime = sessions.get(matchId);
              if (!runtime) return null;
              return deepFreeze(cloneJson({
                matchId,
                seenEventIds: runtime.state.seenEventIds,
                lastPlan: runtime.lastPlan,
                lastFinisherPlan: runtime.lastFinisherPlan,
                environmentTravel: runtime.environmentTravel,
                environmentEventId: runtime.environmentEventId,
                lastEnvironmentFrame: runtime.lastEnvironmentFrame
              }));
            }

            return Object.freeze({ begin, acceptAcceptedResolution, acceptAcceptedMatchEnd, snapshot });
          }
          '''
          new_bridge = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_bridge.splitlines())
          text = text[:bridge_start] + new_bridge + text[bridge_end:]

          metadata_anchor = "  matchEndFinisher: Object.freeze({\n"
          metadata = """  battleConveyorEnvironment: Object.freeze({
            source: 'accepted_public_battle_resolution',
            actualDomSurface: 'battlePhaseSurface',
            segmentCount: BATTLE_CONVEYOR_ENV_SEGMENT_COUNT,
            authority: 'presentation_only_no_game_state_write'
          }),
            matchEndFinisher: Object.freeze({
          """
          metadata = '\n'.join(line[10:] if line.startswith('          ') else line for line in metadata.splitlines())
          assert text.count(metadata_anchor) == 1
          text = text.replace(metadata_anchor, metadata, 1)
          adapter_path.write_text(text)

          test_path = Path('tests/battle-replay-live-adapter.test.mjs')
          tests = test_path.read_text()
          addition = r'''

          test('Battle conveyor environment advances only on accepted non-duplicate resolution and suppresses travel for reduced/lowPerf', () => {
            const frames = [];
            const bridge = createBattleReplayCardPresentationBridge({
              document: null,
              matchMedia: () => ({ matches: false }),
              renderPlan: () => {},
              renderEnvironment: (frame, eventId) => frames.push({ frame, eventId })
            });
            bridge.begin('M-CONVEYOR-R37');
            const initial = bridge.snapshot('M-CONVEYOR-R37');
            assert.equal(initial.environmentTravel, 0);
            assert.equal(initial.lastEnvironmentFrame.phase, 'IDLE_READ');
            assert.equal(initial.lastEnvironmentFrame.segments.length, 8);
            assert.equal(frames.length, 1);

            const first = bridge.acceptAcceptedResolution({ matchId: 'M-CONVEYOR-R37', serial: 1 });
            assert.equal(first.accepted, true);
            assert.equal(first.duplicate, false);
            const afterFirst = bridge.snapshot('M-CONVEYOR-R37');
            assert.equal(afterFirst.environmentTravel, 0.16);
            assert.equal(afterFirst.lastEnvironmentFrame.phase, 'RESOLVE');
            assert.equal(afterFirst.lastEnvironmentFrame.environmentAuthority, 'decorative_visual_loop_only');
            assert.equal(afterFirst.lastEnvironmentFrame.gameStateWrite, false);
            assert.equal(afterFirst.lastEnvironmentFrame.position109Write, false);
            assert.equal(frames.length, 2);

            const duplicate = bridge.acceptAcceptedResolution({ matchId: 'M-CONVEYOR-R37', serial: 1 });
            assert.equal(duplicate.accepted, true);
            assert.equal(duplicate.duplicate, true);
            assert.equal(bridge.snapshot('M-CONVEYOR-R37').environmentTravel, 0.16);
            assert.equal(frames.length, 2);

            for (const profile of [
              { reduceMotion: true, lowPerf: false, id: 'REDUCED' },
              { reduceMotion: false, lowPerf: true, id: 'LOWPERF' }
            ]) {
              const profileFrames = [];
              const fake = fakePresentationDocument(profile);
              const profileBridge = createBattleReplayCardPresentationBridge({
                document: fake.document,
                matchMedia: () => ({ matches: false }),
                renderPlan: () => {},
                renderEnvironment: (frame) => profileFrames.push(frame)
              });
              profileBridge.begin(`M-CONVEYOR-${profile.id}`);
              profileBridge.acceptAcceptedResolution({ matchId: `M-CONVEYOR-${profile.id}`, serial: 1 });
              const snapshot = profileBridge.snapshot(`M-CONVEYOR-${profile.id}`);
              assert.equal(snapshot.environmentTravel, 0);
              assert.equal(snapshot.lastEnvironmentFrame.motionSuppressed, true);
              assert.equal(snapshot.lastEnvironmentFrame.effectiveTravel, 0);
              assert.equal(profileFrames.at(-1).segments.length, 8);
            }
          });
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          assert 'M-CONVEYOR-R37' not in tests
          test_path.write_text(tests.rstrip() + addition + '\n')

          full_path = Path('tests/browser-full-interaction.spec.mjs')
          full = full_path.read_text()
          vars_anchor = "  let cardPresentationFallbacks = 0;\n  let lastCardPresentationEvent = null;\n"
          vars_new = vars_anchor + "  let conveyorObserved = false;\n  let conveyorMaxTravel = 0;\n"
          assert full.count(vars_anchor) == 1
          full = full.replace(vars_anchor, vars_new, 1)

          loop_anchor = "    if (await satisfyVisibleAbilityChoice(page)) {\n"
          loop_probe = r'''    const conveyorEnvironment = battle.locator('#battlePhaseSurface [data-battle-conveyor-environment]').first();
            if ((await conveyorEnvironment.count()) > 0) {
              conveyorObserved = true;
              const travel = Number(await conveyorEnvironment.getAttribute('data-battle-conveyor-travel'));
              if (Number.isFinite(travel)) conveyorMaxTravel = Math.max(conveyorMaxTravel, travel);
            }

          '''
          loop_probe = '\n'.join(line[10:] if line.startswith('          ') else line for line in loop_probe.splitlines())
          assert full.count(loop_anchor) >= 1
          full = full.replace(loop_anchor, loop_probe + loop_anchor, 1)

          final_anchor = "  const roundsText = (await result.locator('#resultRounds').textContent()) ?? '';\n"
          final_probe = r'''  const finalConveyorEnvironment = battle.locator('#battlePhaseSurface [data-battle-conveyor-environment]').first();
            expect(conveyorObserved, 'accepted Battle resolution mounted the finite conveyor environment').toBeTruthy();
            await expect(finalConveyorEnvironment).toHaveAttribute('aria-hidden', 'true');
            await expect(finalConveyorEnvironment).toHaveAttribute('data-battle-conveyor-authority', 'decorative_visual_loop_only');
            expect(await finalConveyorEnvironment.locator('[data-battle-conveyor-segment]').count(), 'finite recycled environment segment pool').toBe(8);
            expect(await finalConveyorEnvironment.evaluate((node) => getComputedStyle(node).pointerEvents), 'decorative environment cannot intercept input').toBe('none');
            expect(conveyorMaxTravel, 'normal-motion accepted Battle resolution advances environment travel').toBeGreaterThan(0);
            expect(await battle.locator('#readyPlan').count(), 'existing screen-space decision control remains singular').toBe(1);
            expect(await finalConveyorEnvironment.locator('#readyPlan').count(), 'decision control is never moved inside the decorative environment').toBe(0);

          '''
          final_probe = '\n'.join(line[10:] if line.startswith('          ') else line for line in final_probe.splitlines())
          assert full.count(final_anchor) == 1
          full = full.replace(final_anchor, final_probe + final_anchor, 1)
          full_path.write_text(full)

          build_path = Path('deploy/cloudflare/tests/build.test.mjs')
          build = build_path.read_text()
          old_blob = '3e02fd3f14ef16287bc9d93f0cbd6e1018b83dd8'
          new_blob = subprocess.check_output(['git', 'hash-object', str(adapter_path)], text=True).strip()
          assert build.count(old_blob) == 1, build.count(old_blob)
          build = build.replace(old_blob, new_blob, 1)
          build_path.write_text(build)
          print('NEW_ADAPTER_BLOB=' + new_blob)
          PY
      - name: Focused regression and sensitivity
        shell: bash
        run: |
          set -euo pipefail
          node --check browser/battle-replay-live-adapter.mjs
          node --check tests/browser-full-interaction.spec.mjs
          node --test tests/battle-conveyor-presentation-core.test.mjs tests/battle-replay-live-adapter.test.mjs
      - name: Commit exact durable delta and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-replay-live-adapter.mjs tests/battle-replay-live-adapter.test.mjs tests/browser-full-interaction.spec.mjs deploy/cloudflare/tests/build.test.mjs
          git commit -m "CROSSSCREEN R37: mount finite conveyor environment in live Battle presentation"
          git rm .github/workflows/zz-temp-crossscreen-r37-infinite-conveyor-mount.yml
          git commit -m "CROSSSCREEN R37: remove temporary mount executor"
          mapfile -t changed < <(git diff --name-only 1bab3183c7cfefed209a9ea5465924d3223d6bd0...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "browser/battle-replay-live-adapter.mjs"
          test "${changed[1]}" = "deploy/cloudflare/tests/build.test.mjs"
          test "${changed[2]}" = "tests/battle-replay-live-adapter.test.mjs"
          test "${changed[3]}" = "tests/browser-full-interaction.spec.mjs"
          git push origin HEAD:work/crossscreen-r37-infinite-conveyor-mount-recovery
