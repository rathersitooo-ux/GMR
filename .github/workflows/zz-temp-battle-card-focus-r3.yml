name: TEMP Battle Card Focus R3

on:
  push:
    branches:
      - sol/battle-card-focus-r3-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-card-focus-r3-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Three-way donor merge and classified tests
        shell: bash
        run: |
          set -euo pipefail
          runtime='browser/battle-janken-slidepad-runtime-mount.mjs'
          testfile='tests/battle-janken-slidepad-runtime-mount.test.mjs'
          base='a84a3c877be133901dec969a6e67a54deb6da0c9'
          donor='257d9b49512b1f75e87c5c5a192b8212d4250da9'

          if grep -q 'BATTLE_CARD_FOCUS_PRESENTATION_SCHEMA' "$runtime" && grep -q 'CARD_FOCUS_R3_MERGED_TESTS' "$testfile"; then
            node --check "$runtime"
            node --test "$testfile"
            exit 0
          fi

          git fetch origin sol/battle-card-focus-r2-20260910:refs/remotes/origin/sol/battle-card-focus-r2-20260910
          git cat-file -e "${base}:${runtime}"
          git cat-file -e "${donor}:${runtime}"
          git show "${base}:${runtime}" > /tmp/card-focus-base.mjs
          git show "${donor}:${runtime}" > /tmp/card-focus-donor.mjs
          cp "$runtime" /tmp/card-focus-current.mjs
          set +e
          git merge-file -p /tmp/card-focus-current.mjs /tmp/card-focus-base.mjs /tmp/card-focus-donor.mjs > /tmp/card-focus-merged.mjs
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]]; then
            echo "Three-way runtime merge conflicted; fail closed."
            exit 1
          fi
          mv /tmp/card-focus-merged.mjs "$runtime"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          s = p.read_text()
          if "from 'node:fs/promises'" not in s:
              anchor = "import assert from 'node:assert/strict';\n"
              if anchor not in s:
                  raise SystemExit('missing assert import anchor')
              s = s.replace(anchor, anchor + "import { readFile } from 'node:fs/promises';\n", 1)
          additions = [
              ('  BATTLE_JANKEN_TARGET_PROXY_LAYER_CSS,\n', '  BATTLE_CARD_FOCUS_PRESENTATION_SCHEMA,\n'),
              ('  projectBattleHandDragGhostPosition,\n', '  projectBattleCardFocusSnapPosition,\n'),
              ('  projectBattleLoadCardPreview,\n', '  projectBattlePlayableHandAffordance,\n'),
          ]
          for anchor, addition in additions:
              if addition.strip() not in s:
                  if anchor not in s:
                      raise SystemExit(f'missing import anchor: {anchor!r}')
                  s = s.replace(anchor, anchor + addition, 1)
          marker = '// CARD_FOCUS_R3_MERGED_TESTS'
          if marker not in s:
              s += r'''

// CARD_FOCUS_R3_MERGED_TESTS

test('card focus keeps legal candidates delegated to the existing active option authority', () => {
  const state = projectBattlePlayableHandAffordance({
    handCardIds: ['a', 'b', 'c', 'd'],
    activeRole: 'battle',
    activeOptionValues: ['a', 'b', 'c'],
    oppositeSelectedCardId: 'b',
    reservedCardIds: ['c'],
    phasePlayable: true,
  });
  assert.equal(BATTLE_CARD_FOCUS_PRESENTATION_SCHEMA, 'gameroad.battle-card-focus-presentation.v1');
  assert.deepEqual(state.candidateCardIds, ['a']);
  assert.equal(state.showActionBase, true);
});

test('visual focus snap is bounded and does not rewrite pointer or gameplay authority', () => {
  const snapped = projectBattleCardFocusSnapPosition({
    ghostPosition: { left: 100, top: 100 },
    cardSize: { width: 80, height: 120 },
    snapRect: { left: 260, top: 180, width: 60, height: 60 },
    armed: true,
    maxPullPx: 28,
  });
  const dx = snapped.left - 100;
  const dy = snapped.top - 100;
  assert.ok(Math.hypot(dx, dy) <= 28.000001);
  assert.ok(snapped.left > 100);
  assert.ok(snapped.top > 100);
});

test('unarmed or invalid snap target preserves the raw drag projection', () => {
  assert.deepEqual(projectBattleCardFocusSnapPosition({
    ghostPosition: { left: 42, top: 77 },
    cardSize: { width: 80, height: 120 },
    snapRect: { left: 260, top: 180, width: 60, height: 60 },
    armed: false,
  }), { left: 42, top: 77 });
  assert.deepEqual(projectBattleCardFocusSnapPosition({
    ghostPosition: { left: 42, top: 77 },
    cardSize: { width: 0, height: 120 },
    snapRect: { left: 260, top: 180, width: 60, height: 60 },
    armed: true,
  }), { left: 42, top: 77 });
});

test('live drag arms and commits only a currently legal candidate while hit testing stays on the raw pointer', async () => {
  const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
  assert.match(source, /const legalCandidate = currentPlayableHandAffordance\(root\)\?\.candidateCardIds\?\.includes\?\.\(state\.cardId\) === true;/);
  assert.match(source, /const armed = legalCandidate && isBattleHandAuraLaunchArmed\(\{\s*pointer: \{ x, y \},\s*auraRect,/);
  assert.match(source, /const commit = !cancelled && moved && state\.armed && state\.legalCandidate === true && sourceStillOrdinary;/);
  assert.match(source, /projectBattleCardFocusSnapPosition\(\{[\s\S]*ghostPosition,[\s\S]*snapRect: auraRect,[\s\S]*armed,/);
});

test('focus presentation has distinct focused, legal and staged visual states and cleans them on destroy', async () => {
  const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
  assert.match(source, /data-card-focus="true"/);
  assert.match(source, /data-card-focus-legal="true"/);
  assert.match(source, /data-card-staged="true"/);
  assert.match(source, /delete node\.dataset\.cardFocus;/);
  assert.match(source, /delete node\.dataset\.cardFocusLegal;/);
  assert.match(source, /delete node\.dataset\.cardStaged;/);
});
'''
          p.write_text(s)
          PY

          node --check "$runtime"
          node --test "$testfile"
          git diff --check

          git config user.name 'gameroad-bounded-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$runtime" "$testfile"
          if git diff --cached --quiet; then
            echo 'No product delta after merge.'
            exit 0
          fi
          git commit -m 'Battle: card focusを現SlidePadへ3-way統合'
          git push origin HEAD:sol/battle-card-focus-r3-20260910
