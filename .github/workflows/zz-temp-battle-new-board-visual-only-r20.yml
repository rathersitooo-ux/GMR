name: TEMP Battle New Board Visual Only R20
# trigger after workflow exists on branch

on:
  push:
    branches:
      - battle-new-board-visual-only-r20

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: battle-new-board-visual-only-r20
          fetch-depth: 0

      - name: Verify exact current source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object browser/GAMEROAD.html)" = "c51af36c96a5865495fc1c24858104676ac94ef2"
          test "$(git hash-object tests/browser-static-check.mjs)" = "17db15ad22d17822aaae8f6d654f67f77f7ccf94"

      - name: Remove legacy Battle board visual fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html_path = Path("browser/GAMEROAD.html")
          test_path = Path("tests/browser-static-check.mjs")
          html = html_path.read_text(encoding="utf-8")
          test = test_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          html = replace_once(
              html,
              '#battleMap[data-central-world-live="1"] #board .node:not(.reachable):not(.path):not(.currentPosition):not(.nextStep){opacity:0;background:transparent;border-color:transparent;box-shadow:none}',
              '#battleMap[data-board-visual-authority="new-only"] #board .node:not(.reachable):not(.path):not(.currentPosition):not(.nextStep){opacity:0;background:transparent;border-color:transparent;box-shadow:none}',
              "permanent passive legacy-node suppression",
          )

          html = replace_once(
              html,
              "function renderBoard(){const board=$('#board'),me=state.match.players[0],m=state.match;renderField3D();",
              "function renderBoard(){const board=$('#board'),me=state.match.players[0],m=state.match;$('#battleMap')?.setAttribute('data-board-visual-authority','new-only');renderField3D();",
              "new-board-only visual authority assertion",
          )

          legacy_3d = "if(!liveWorldBoard){const active=activeNodes();for(const id of all){"
          start = html.find(legacy_3d)
          end = html.find("if(m.honey?.byNode)", start)
          if start < 0 or end <= start:
              raise SystemExit("legacy WebGL fallback block anchors missing")
          html = html[:start] + "/* BATTLE_BOARD_NEW_VISUAL_ONLY_NO_LEGACY_FALLBACK_R20 */" + html[end:]

          legacy_canvas = "if(!liveWorldBoard){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(const owner of ['P1','P2','P3','P4'])"
          start = html.find(legacy_canvas)
          end = html.find("const cpt=proj(", start)
          if start < 0 or end <= start:
              raise SystemExit("legacy Canvas fallback block anchors missing")
          html = html[:start] + "/* NEW_BOARD_ONLY: legacy canvas lane scaffolding intentionally disabled even before async board mount. */\n" + html[end:]

          def replace_line_with_phrase(text, phrase, replacement, label):
              lines = text.splitlines(keepends=True)
              hits = [i for i, line in enumerate(lines) if phrase in line]
              if len(hits) != 1:
                  raise SystemExit(f"{label}: expected exactly one line, got {len(hits)}")
              idx = hits[0]
              newline = "\n" if lines[idx].endswith("\n") else ""
              lines[idx] = replacement + newline
              return "".join(lines)

          test = replace_line_with_phrase(
              test,
              "legacy future board scaffolding is still player-visible after the central world mount",
              r"""    [/#battleMap\[data-board-visual-authority=['\"]new-only['\"]\] #board \.node:not\(\.reachable\):not\(\.path\):not\(\.currentPosition\):not\(\.nextStep\)/, 'legacy passive board scaffolding is not permanently hidden under NEW_BOARD_ONLY visual authority'],""",
              "static CSS contract",
          )
          test = replace_line_with_phrase(
              test,
              "legacy 3D board geometry is still drawn underneath the new world-field map",
              r"""    [/BATTLE_BOARD_NEW_VISUAL_ONLY_NO_LEGACY_FALLBACK_R20/, 'NEW_BOARD_ONLY visual fallback marker is missing'],""",
              "static WebGL fallback contract",
          )
          test = replace_line_with_phrase(
              test,
              "legacy canvas lane scaffolding is still drawn under the new world-field map",
              r"""    [/setAttribute\(['\"]data-board-visual-authority['\"],['\"]new-only['\"]\)/, 'Battle does not assert NEW_BOARD_ONLY visual authority before field rendering'],""",
              "static Canvas fallback contract",
          )

          negative_anchor = """  if ((html.match(/id=["']battleCentralWorldLiveHost["']/g) ?? []).length !== 1) {"""
          negative_checks = """  if (/if\\(!liveWorldBoard\\)\\{const active=activeNodes\\(\\);for\\(const id of all\\)/.test(html)) {
            errors.push('legacy 3D board visual fallback remains available before the canonical world-field mount');
          }
          if (/if\\(!liveWorldBoard\\)\\{ctx\\.save\\(\\);ctx\\.lineCap='round';ctx\\.lineJoin='round';for\\(const owner of \\['P1','P2','P3','P4'\\]\\)/.test(html)) {
            errors.push('legacy canvas lane visual fallback remains available before the canonical world-field mount');
          }
          if (/#battleMap\\[data-central-world-live=['"]1['"]\\] #board \\.node:not\\(\\.reachable\\):not\\(\\.path\\):not\\(\\.currentPosition\\):not\\(\\.nextStep\\)/.test(html)) {
            errors.push('legacy passive node visibility still depends on async central-world mount instead of permanent NEW_BOARD_ONLY authority');
          }
          """
          test = replace_once(test, negative_anchor, negative_checks + negative_anchor, "negative contract insertion")

          if legacy_3d in html:
              raise SystemExit("legacy WebGL topology fallback still present")
          if legacy_canvas in html:
              raise SystemExit("legacy Canvas topology fallback still present")
          if "BATTLE_BOARD_NEW_VISUAL_ONLY_NO_LEGACY_FALLBACK_R20" not in html:
              raise SystemExit("R20 marker missing")
          if "data-board-visual-authority','new-only" not in html:
              raise SystemExit("new-only authority assertion missing")

          html_path.write_text(html, encoding="utf-8")
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Focused Battle visual fallback regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-static-check.mjs
          node --test tests/battle-board-world-field-renderer.test.mjs
          node --test tests/battle-new-base-board-live-presentation-composer.test.mjs
          node --test deploy/cloudflare/tests/build.test.mjs

      - name: Verify bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "browser/GAMEROAD.html tests/browser-static-check.mjs "

      - name: Commit validated product and self-clean transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/zz-temp-battle-new-board-visual-only-r20.yml
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git commit -m "Battle: make canonical board the only visual topology"
          git push origin HEAD:${GITHUB_REF_NAME}
