name: Temp Garden3D Field R2
on:
  push:
    branches:
      - sol/battle-garden3d-field-r2-20260915
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/battle-garden3d-field-r2-20260915
      - name: Apply accepted FIELD-10 donor
        run: |
          set -euo pipefail
          git fetch origin sol/battle-symmetric-gate-field-r1-20260915
          git diff 061c899df9df59d3b798034f097dbe9951946c6d origin/sol/battle-symmetric-gate-field-r1-20260915 -- browser/GAMEROAD.html tests/browser-static-check.mjs > /tmp/field10.patch
          git apply --check /tmp/field10.patch
          git apply /tmp/field10.patch
      - name: Fix bounded Garden3D anchors in transient mutator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/temp-battle-garden3d-field-r2.py')
          s=p.read_text(encoding='utf-8')
          fixes=[
            (
              "html = replace_once(html, '</style>', css + '</style>', 'garden css')",
              "style_close=html.find('</style>')\nif style_close<0: raise SystemExit('garden css: missing style close')\nhtml=html[:style_close]+css+html[style_close:]"
            ),
            (
              "html = replace_once(html, \"if(m.honey?.byNode)\", \"if(garden3DFieldActive())pushGarden3DSceneGeometry(items,all,viewer);\\n if(m.honey?.byNode)\", 'garden geometry mount')",
              "render3d_start=html.find('function renderField3D(){')\nrender3d_end=html.find('\\nfunction ',render3d_start+1)\nhoney_anchor=html.find(\"if(m.honey?.byNode)\",render3d_start,render3d_end)\nif render3d_start<0 or render3d_end<0 or honey_anchor<0: raise SystemExit('garden geometry mount: live renderer anchor missing')\nhtml=html[:honey_anchor]+\"if(garden3DFieldActive())pushGarden3DSceneGeometry(items,all,viewer);\\n \"+html[honey_anchor:]"
            ),
            (
              "const_end = html.find('const SYMMETRIC_FIELD_NODE_IDS=', const_start)",
              "const_end = html.find('const state={', const_start)"
            )
          ]
          for old,new in fixes:
              if old not in s:
                  raise SystemExit(f'expected transient anchor missing: {old[:70]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add Garden3D field without a second gameplay engine
        run: |
          set -euo pipefail
          python tools/temp-battle-garden3d-field-r2.py
          git diff --check
          node tests/browser-static-check.mjs
      - name: Commit verified product mutation
        run: |
          set -euo pipefail
          git config user.name gameroad-sol
          git config user.email gameroad-sol@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git commit -m "Battle: add switchable Garden3D field R2"
      - name: Remove temporary authorization and runner files
        run: |
          set -euo pipefail
          git rm data/preaction-authorizations/BATTLE-GARDEN3D-FIELD-R2-20260915T0452-SOL-FIELD.json
          git rm tools/temp-battle-garden3d-field-r2.py
          git rm .github/workflows/zz-temp-battle-garden3d-field-r2.yml
          git commit -m "chore: close Garden3D pre-action lane"
          git push origin HEAD:sol/battle-garden3d-field-r2-20260915
