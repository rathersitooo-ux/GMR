name: Battle Replay R4 Required Gate patch

on:
  push:
    branches:
      - work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact gate and patch replay classification
        shell: bash
        run: |
          set -euo pipefail
          gate=.github/workflows/gameroad-required-gate.yml
          [[ "$(git hash-object "${gate}")" == "6e803f3ed05b857eb61607e8d0ec2589cb4af0ca" ]]
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gameroad-required-gate.yml')
          text=p.read_text(encoding='utf-8')
          old="""              browser/battle-replay-core.mjs|\\
              tests/battle-replay-core.test.mjs)
                replay=true
"""
          new="""              browser/battle-replay-core.mjs|\\
              tests/battle-replay-core.test.mjs|\\
              browser/battle-replay-live-adapter.mjs|\\
              tests/battle-replay-live-adapter.test.mjs)
                replay=true
"""
          if text.count(old)!=1:
              raise SystemExit(f'replay classification anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          old_test='run: node --test tests/battle-replay-core.test.mjs'
          new_test='run: node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs'
          if text.count(old_test)!=1:
              raise SystemExit(f'replay test anchor count={text.count(old_test)}')
          text=text.replace(old_test,new_test,1)
          p.write_text(text,encoding='utf-8')
          PY
          node --check browser/battle-replay-live-adapter.mjs
          node --test tests/battle-replay-core.test.mjs tests/battle-replay-live-adapter.test.mjs
      - name: Commit gate patch and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/battle-replay-r4-gate-patch.yml
          git config user.name "gameroad-r4-bot"
          git config user.email "gameroad-r4-bot@users.noreply.github.com"
          git add .github/workflows/gameroad-required-gate.yml .github/workflows/battle-replay-r4-gate-patch.yml
          git commit -m "[BATTLE-REPLAY R4] classify live adapter in Required Gate"
          git push origin HEAD:work/BATTLE-REPLAY-RUNTIME-CONTRACT-001-R4-CONTEXT
