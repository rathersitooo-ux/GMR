name: Browser Runtime Smoke

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'browser/GAMEROAD.html'
      - 'tests/browser-runtime-smoke.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-runtime-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'browser/GAMEROAD.html'
      - 'tests/browser-runtime-smoke.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Append Highlander reload-to-match-start regression
        shell: bash
        run: |
          cat >> tests/browser-runtime-smoke.spec.mjs <<'EOF'

          test('Highlander remains enforced after durable reload and invalid match start does not mutate the save', async ({ page }) => {
            const storageKey = 'gameroad.browser.v10.core.1';
            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'domcontentloaded' });
            expect(response, 'main HTML response').not.toBeNull();
            expect(response.ok(), `main HTML status ${response.status()}`).toBeTruthy();
            await page.waitForTimeout(500);

            const setup = await installLegalBattleDeck(page);
            expect(setup.main).toHaveLength(40);
            expect(setup.committed, 'legal 40-card deck committed before reload').toBeTruthy();
            expect(setup.savedValidation.ok, `saved deck validation: ${JSON.stringify(setup.savedValidation)}`).toBeTruthy();

            const durableBeforeReload = await page.evaluate((key) => localStorage.getItem(key), storageKey);
            expect(durableBeforeReload, 'explicit deck commit materializes durable browser save').not.toBeNull();
            const savedMainBeforeReload = await page.evaluate(() => [...window.__GAMEROAD_TEST__.state.savedDeck.main]);

            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);

            const reloaded = await page.evaluate((key) => {
              const t = window.__GAMEROAD_TEST__;
              if (!t) throw new Error('GAMEROAD runtime test hook is unavailable after reload');
              return {
                raw: localStorage.getItem(key),
                savedMain: [...t.state.savedDeck.main],
                validation: t.deckValidate(t.state.savedDeck, { forBattle: true }),
              };
            }, storageKey);
            expect(reloaded.raw, 'durable save survives reload byte-for-byte').toBe(durableBeforeReload);
            expect(reloaded.savedMain, 'saved deck identity survives reload').toEqual(savedMainBeforeReload);
            expect(reloaded.savedMain).toHaveLength(40);
            expect(reloaded.validation.ok, `reloaded deck validation: ${JSON.stringify(reloaded.validation)}`).toBeTruthy();

            const evidence = await page.evaluate(() => {
              const t = window.__GAMEROAD_TEST__;
              const cardData = window.__CARD_DATA__;
              if (!t || !Array.isArray(cardData)) throw new Error('deck validation test hooks are unavailable');
              const main = [...t.state.savedDeck.main];
              const aliasId = main[0];
              const targetId = main[1];
              if (!aliasId || !targetId || aliasId === targetId) throw new Error('two distinct saved deck IDs are required');

              const aliasCard = cardData.find((card) => card.id === aliasId);
              const targetCard = cardData.find((card) => card.id === targetId);
              if (!aliasCard || !targetCard) throw new Error('saved deck cards are missing from current card data');
              const targetCanonicalName = targetCard.canonical_name
                || targetCard.base_card_name
                || targetCard.display_name
                || targetCard.id;
              const hadCanonicalName = Object.prototype.hasOwnProperty.call(aliasCard, 'canonical_name');
              const originalCanonicalName = aliasCard.canonical_name;
              const savedBefore = JSON.stringify(t.state.savedDeck);
              const matchBefore = Boolean(t.state.match);
              let invalidValidation = null;
              let startReturned = null;
              let startThrew = false;
              let savedAfterAttempt = null;
              let matchAfterAttempt = null;
              let restoredValidation = null;

              try {
                aliasCard.canonical_name = targetCanonicalName;
                invalidValidation = t.deckValidate(t.state.savedDeck, { forBattle: true });
                try {
                  startReturned = t.start('4p', 'road_shield');
                } catch {
                  startThrew = true;
                }
                savedAfterAttempt = JSON.stringify(t.state.savedDeck);
                matchAfterAttempt = Boolean(t.state.match);
              } finally {
                if (hadCanonicalName) aliasCard.canonical_name = originalCanonicalName;
                else delete aliasCard.canonical_name;
                restoredValidation = t.deckValidate(t.state.savedDeck, { forBattle: true });
              }

              return {
                aliasId,
                targetId,
                targetCanonicalName,
                invalidValidation,
                startReturned: Boolean(startReturned),
                startThrew,
                savedBefore,
                savedAfterAttempt,
                matchBefore,
                matchAfterAttempt,
                restoredValidation,
              };
            });

            expect(evidence.aliasId).not.toBe(evidence.targetId);
            expect(evidence.invalidValidation?.ok, `aliased validation: ${JSON.stringify(evidence.invalidValidation)}`).toBeFalsy();
            expect(JSON.stringify(evidence.invalidValidation)).toContain('同名1枚まで');
            expect(evidence.matchBefore, 'test starts without an active match').toBeFalsy();
            expect(evidence.startReturned, 'invalid Highlander deck must not return a started match').toBeFalsy();
            expect(evidence.matchAfterAttempt, 'invalid Highlander deck must not install an active match').toBeFalsy();
            expect(evidence.savedAfterAttempt, 'rejected match start must not rewrite saved deck state').toBe(evidence.savedBefore);
            expect(evidence.restoredValidation?.ok, `restored validation: ${JSON.stringify(evidence.restoredValidation)}`).toBeTruthy();

            const durableAfterAttempt = await page.evaluate((key) => localStorage.getItem(key), storageKey);
            expect(durableAfterAttempt, 'rejected match start must not rewrite durable save').toBe(durableBeforeReload);
          });
          EOF

      - name: Append keyboard-only visible navigation playtest
        shell: bash
        run: |
          cat >> tests/browser-runtime-smoke.spec.mjs <<'EOF'

          test('keyboard-only navigation reaches Cards and returns Home through visible controls', async ({ page }, testInfo) => {
            const pageErrors = [];
            const consoleErrors = [];
            const unexpectedHttpErrors = [];
            let versionManifest404Count = 0;

            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('response', (response) => {
              if (response.status() < 400) return;
              const url = new URL(response.url());
              if (response.status() === 404 && url.pathname.endsWith('/browser/gameroad-version.json')) {
                versionManifest404Count += 1;
                return;
              }
              unexpectedHttpErrors.push(`${response.status()} ${url.pathname}`);
            });

            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'domcontentloaded' });
            expect(response, 'main HTML response').not.toBeNull();
            expect(response.ok(), `main HTML status ${response.status()}`).toBeTruthy();
            await page.waitForTimeout(800);
            await expect(page.locator('section[data-screen="home"]')).toBeVisible();

            const tabToTarget = async (target, maxTabs = 200) => {
              for (let i = 0; i < maxTabs; i += 1) {
                await page.keyboard.press('Tab');
                const focused = await page.evaluate(() => {
                  const el = document.activeElement;
                  if (!(el instanceof HTMLElement)) return null;
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return {
                    key: el.dataset.go ?? el.dataset.homeTarget ?? el.dataset.rootGo ?? null,
                    tag: el.tagName,
                    text: (el.textContent || '').trim().slice(0, 80),
                    visible: rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden' && style.display !== 'none',
                  };
                });
                if (focused?.visible && focused.key === target) return { ...focused, tabs: i + 1 };
              }
              throw new Error(`keyboard Tab traversal did not reach visible navigation target: ${target}`);
            };

            const cardsFocus = await tabToTarget('cards');
            expect(cardsFocus.tabs).toBeGreaterThan(0);
            await testInfo.attach('keyboard-home-cards-focused.png', {
              body: await page.screenshot({ fullPage: true, animations: 'disabled' }),
              contentType: 'image/png',
            });
            await page.keyboard.press('Enter');
            await expect(page.locator('section[data-screen="cards"]'), 'Enter on keyboard-focused Cards control').toBeVisible();
            await testInfo.attach('keyboard-cards-visible.png', {
              body: await page.screenshot({ fullPage: true, animations: 'disabled' }),
              contentType: 'image/png',
            });

            const homeFocus = await tabToTarget('home');
            expect(homeFocus.tabs).toBeGreaterThan(0);
            await testInfo.attach('keyboard-cards-home-focused.png', {
              body: await page.screenshot({ fullPage: true, animations: 'disabled' }),
              contentType: 'image/png',
            });
            await page.keyboard.press('Enter');
            await expect(page.locator('section[data-screen="home"]'), 'Enter on keyboard-focused Home control').toBeVisible();
            await testInfo.attach('keyboard-home-returned.png', {
              body: await page.screenshot({ fullPage: true, animations: 'disabled' }),
              contentType: 'image/png',
            });

            const remainingConsoleErrors = [...consoleErrors];
            for (let i = 0; i < versionManifest404Count; i += 1) {
              const index = remainingConsoleErrors.findIndex((message) =>
                message.includes('Failed to load resource') && message.includes('404'),
              );
              if (index >= 0) remainingConsoleErrors.splice(index, 1);
            }
            if (versionManifest404Count > 0) {
              testInfo.annotations.push({
                type: 'known-deployment-gap',
                description: `gameroad-version.json returned 404 ${versionManifest404Count} time(s); tracked separately from keyboard playability evidence`,
              });
            }

            testInfo.annotations.push({
              type: 'keyboard-visible-route',
              description: `Home→Cards tabs=${cardsFocus.tabs}; Cards→Home tabs=${homeFocus.tabs}; activation=Enter; direct focus/click/state injection=0`,
            });
            expect(unexpectedHttpErrors, `unexpected HTTP errors:\n${unexpectedHttpErrors.join('\n')}`).toEqual([]);
            expect(pageErrors, `page errors:\n${pageErrors.join('\n')}`).toEqual([]);
            expect(remainingConsoleErrors, `console errors:\n${remainingConsoleErrors.join('\n')}`).toEqual([]);
          });
          EOF

      - name: Run GAMEROAD runtime smoke
        run: npx playwright test --config=playwright.config.mjs --workers=1

      - name: Upload runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14