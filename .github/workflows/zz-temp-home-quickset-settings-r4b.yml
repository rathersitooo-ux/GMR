name: TEMP Home Quick Set Settings R4B
on:
  push:
    branches:
      - sol/home-quickset-settings-r4b-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/home-quickset-settings-r4b-20260908
          fetch-depth: 0
      - name: Apply bounded runtime integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('browser/home-boot-runtime-mount.mjs')
          text = path.read_text(encoding='utf-8')
          import_needle = """import {
            advanceSlotRollDrag,
            createSlotRollState,
            projectSlotRollWindow,
            resolveSlotRollCommit,
          } from './slidepad-slot-roll-core.mjs';
          """
          import_add = import_needle + "import { resolveHomeQuickSetConfiguration } from './home-quickset-settings-core.mjs';\n"
          if "from './home-quickset-settings-core.mjs'" not in text:
              if import_needle not in text:
                  raise SystemExit('runtime import anchor not found')
              text = text.replace(import_needle, import_add, 1)
          old = """    const created = createHomeQuickSetSlotRoll({
                items: quickSetItems(buttons),
                selectedRouteId: selectedRouteId(buttons),
                centerWidth: centerRect.width,
              });
          """
          new = """    const configuredQuickSet = resolveHomeQuickSetConfiguration({
                items: quickSetItems(buttons),
                fallbackSelectedId: selectedRouteId(buttons),
              });
              const created = createHomeQuickSetSlotRoll({
                items: configuredQuickSet.items,
                selectedRouteId: configuredQuickSet.selectedRouteId,
                centerWidth: centerRect.width,
              });
          """
          if 'const configuredQuickSet = resolveHomeQuickSetConfiguration' not in text:
              if old not in text:
                  raise SystemExit('Quick Set creation anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused checks
        run: |
          node --check browser/home-boot-runtime-mount.mjs
          node --check browser/home-quickset-settings-core.mjs
          node --test tests/home-quickset-settings-r4.test.mjs
      - name: Remove transient workflow and commit bounded patch
        shell: bash
        run: |
          git config user.name "gameroad-bot"
          git config user.email "gameroad-bot@users.noreply.github.com"
          git rm .github/workflows/zz-temp-home-quickset-settings-r4b.yml
          git add browser/home-boot-runtime-mount.mjs browser/home-quickset-settings-core.mjs tests/home-quickset-settings-r4.test.mjs
          if git diff --cached --quiet; then
            echo "No patch to commit"
            exit 0
          fi
          git commit -m "Home: connect Quick Set settings order and default"
          git push origin HEAD:sol/home-quickset-settings-r4b-20260908
