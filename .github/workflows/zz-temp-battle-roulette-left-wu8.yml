name: temp-battle-roulette-left-wu8

on:
  push:
    branches:
      - sol/battle-roulette-left-wu8-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-roulette-left-wu8-20260914
          fetch-depth: 0
      - name: Apply exact WU8 left-rail patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/battle-playable-hand-row-roulette-runtime.mjs')
          test_path = Path('tests/battle-playable-hand-row-roulette-runtime.test.mjs')
          runtime = runtime_path.read_text()
          test = test_path.read_text()

          def replace_exact(text, old, new, count, label):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} occurrence(s), found {actual}')
              return text.replace(old, new)

          runtime = replace_exact(
              runtime,
              "  side: 'RIGHT',\n  anchor: 'BOTTOM_RIGHT_THUMB_CLUSTER',",
              "  side: 'LEFT',\n  anchor: 'BOTTOM_LEFT_ROULETTE_RAIL',",
              1,
              'placement metadata',
          )
          runtime = replace_exact(
              runtime,
              '  left:auto;\n  right:268px;',
              '  left:12px;\n  right:auto;',
              1,
              'base left anchor',
          )
          runtime = replace_exact(
              runtime,
              'right:202px;bottom:9px;left:auto;',
              'left:9px;right:auto;bottom:9px;',
              1,
              'small-landscape left anchor',
          )
          runtime = replace_exact(
              runtime,
              'right:12px;bottom:392px;left:auto;',
              'left:12px;right:auto;bottom:392px;',
              1,
              'portrait left anchor',
          )
          runtime = replace_exact(
              runtime,
              'transform-origin:right bottom',
              'transform-origin:left bottom',
              3,
              'left transform origin',
          )

          test = replace_exact(
              test,
              "test('row roulette shares the bottom-right thumb cluster with SlidePad and never replaces ordinary hand', () => {",
              "test('row roulette uses its own bottom-left rail and never replaces ordinary hand', () => {",
              1,
              'focused test name',
          )
          test = replace_exact(test, "    side: 'RIGHT',", "    side: 'LEFT',", 1, 'test side')
          test = replace_exact(test, "    anchor: 'BOTTOM_RIGHT_THUMB_CLUSTER',", "    anchor: 'BOTTOM_LEFT_ROULETTE_RAIL',", 1, 'test anchor')
          test = replace_exact(
              test,
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /right:268px/);',
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /left:12px/);',
              1,
              'test base anchor',
          )
          test = replace_exact(
              test,
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /right:202px;bottom:9px/);',
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /left:9px;right:auto;bottom:9px/);',
              1,
              'test small-landscape anchor',
          )
          test = replace_exact(
              test,
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /left:auto/);',
              '  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /right:auto/);\n  assert.match(BATTLE_PLAYABLE_HAND_ROW_ROULETTE_CSS, /transform-origin:left bottom/);',
              1,
              'test separate left rail',
          )

          runtime_path.write_text(runtime)
          test_path.write_text(test)
          PY

          node --test tests/battle-playable-hand-row-roulette-runtime.test.mjs
          git diff --check
          git diff --exit-code -- .github/workflows/zz-temp-battle-roulette-left-wu8.yml || true
          if git diff --quiet -- browser/battle-playable-hand-row-roulette-runtime.mjs tests/battle-playable-hand-row-roulette-runtime.test.mjs; then
            echo 'Expected roulette product/test diff but found none.' >&2
            exit 3
          fi
          git status --short
          git diff -- browser/battle-playable-hand-row-roulette-runtime.mjs tests/battle-playable-hand-row-roulette-runtime.test.mjs

          git config user.name 'gameroad-surgical-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/battle-playable-hand-row-roulette-runtime.mjs tests/battle-playable-hand-row-roulette-runtime.test.mjs
          git commit -m 'fix(battle): move conditional roulette to left rail'
          git push origin HEAD:sol/battle-roulette-left-wu8-20260914
