name: TEMP Home Quick Set R1B

on:
  push:
    branches:
      - sol/home-quickset-current-integration-r1b-20260908
    paths:
      - '.github/workflows/zz-temp-home-quickset-r1b.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/home-quickset-current-integration-r1b-20260908
          fetch-depth: 0
      - name: Verify exact starting blobs
        run: |
          test "$(git hash-object browser/home-boot-runtime-mount.mjs)" = "cf2b5a90970db0ac960ac28aed762ca9b415ad0a"
          test "$(git hash-object tests/home-boot-presentation.test.mjs)" = "2c2ba8fcfd96f2250b5cecfd43ca0db21e189d69"
      - name: Patch Home Quick Set onto existing route gummies
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('browser/home-boot-runtime-mount.mjs')
          text = runtime_path.read_text()

          helper_marker = "function currentSetupModeItems() {"
          assert helper_marker in text
          helper = r'''export function createHomeQuickSetSlotRoll({
            items = [],
            selectedRouteId = null,
            centerWidth = HOME_TOUCH_TARGET_MIN_PX,
          } = {}) {
            if (!Array.isArray(items)) return null;
            const normalized = [];
            const seen = new Set();
            for (const source of items) {
              const id = String(source?.id ?? '').trim();
              if (!id || seen.has(id)) return null;
              seen.add(id);
              const label = String(source?.label ?? id).trim() || id;
              normalized.push(Object.freeze({ id, label }));
            }
            const width = Number(centerWidth);
            if (!normalized.length || !Number.isFinite(width) || width <= 0) return null;
            const requested = String(selectedRouteId ?? '').trim();
            let anchorIndex = requested ? normalized.findIndex((item) => item.id === requested) : -1;
            if (anchorIndex < 0) anchorIndex = normalized.findIndex((item) => roleForRouteId(item.id) === 'battle');
            if (anchorIndex < 0) anchorIndex = 0;
            return Object.freeze({
              state: createSlotRollState({ items: normalized, anchorIndex }),
              detentPx: Math.max(HOME_TOUCH_TARGET_MIN_PX, width),
              anchorId: normalized[anchorIndex].id,
            });
          }

          '''
          text = text.replace(helper_marker, helper + helper_marker, 1)

          reset_old = "  runtime.slidepad.moved = false;\n  clearPreview();\n  resetKnob(center);"
          reset_new = "  runtime.slidepad.moved = false;\n  if (runtime.slidepad.home instanceof HTMLElement) delete runtime.slidepad.home.dataset.homeQuickSetActive;\n  clearSlotRollProjection();\n  clearPreview();\n  resetKnob(center);"
          assert reset_old in text
          text = text.replace(reset_old, reset_new, 1)

          bind_start = text.index('function bindSlidepad(home) {')
          bind_end = text.index('\nexport function refreshHomeBootPresentation()', bind_start)
          new_bind = r'''function bindSlidepad(home) {
            const center = home.querySelector(SLIDEPAD_CENTER_SELECTOR);
            if (!(center instanceof HTMLElement)) {
              if (runtime.slidepad.center) unbindSlidepad();
              return;
            }
            if (runtime.slidepad.home === home && runtime.slidepad.center === center && runtime.slidepad.handlers) return;
            unbindSlidepad();
            runtime.slidepad.home = home;
            runtime.slidepad.center = center;
            center.dataset.homeSlidepadBound = 'true';

            const pointerVector = (event) => ({
              dx: Number(event.clientX) - runtime.slidepad.originX,
              dy: Number(event.clientY) - runtime.slidepad.originY,
            });

            const quickSetItems = (buttons) => buttons.map((button) => ({
              id: routeId(button),
              label: String(button.getAttribute('aria-label') || button.textContent || routeId(button) || '').trim() || routeId(button),
            }));

            const setQuickSetButton = (buttons, itemId) => {
              const button = buttons.find((candidate) => routeId(candidate) === itemId) || null;
              runtime.slotRoll.routeButton = button;
              setPreview(button);
              if (button) applyTargetAdhesion(button);
              return button;
            };

            const beginQuickSet = (event) => {
              const buttons = routeButtons(home);
              const centerRect = center.getBoundingClientRect();
              const created = createHomeQuickSetSlotRoll({
                items: quickSetItems(buttons),
                selectedRouteId: selectedRouteId(buttons),
                centerWidth: centerRect.width,
              });
              clearSlotRollProjection();
              if (!created) {
                setPreview(null);
                return null;
              }
              runtime.slotRoll.state = created.state;
              runtime.slotRoll.lastX = Number(event.clientX);
              runtime.slotRoll.detentPx = created.detentPx;
              home.dataset.homeQuickSetActive = 'true';
              return setQuickSetButton(buttons, created.anchorId);
            };

            const updateFromPointer = (event) => {
              const { dx, dy } = pointerVector(event);
              const distance = Math.hypot(dx, dy);
              if (distance >= SLIDEPAD_DEAD_ZONE_PX) runtime.slidepad.moved = true;
              const buttons = routeButtons(home);
              if (runtime.slotRoll.state) {
                const nextX = Number(event.clientX);
                const deltaPx = nextX - runtime.slotRoll.lastX;
                runtime.slotRoll.lastX = nextX;
                const advanced = advanceSlotRollDrag(runtime.slotRoll.state, {
                  deltaPx,
                  detentPx: runtime.slotRoll.detentPx,
                });
                runtime.slotRoll.state = advanced.state;
                setQuickSetButton(buttons, runtime.slotRoll.state.itemId);
              }
              moveKnobWithGesture(center, dx, dy);
              return { dx, dy, button: runtime.slidepad.previewButton };
            };

            const handlers = {
              dblclick(event) {
                if (!runtime.active) return;
                const expanded = explicitExpandedState(home);
                if (!shouldDismissHomeSlidepadOnBlankDoubleClick({ expanded, home, target: event.target })) return;
                event.preventDefault();
                event.stopPropagation();
                center.click();
              },
              pointerdown(event) {
                if (!runtime.active || runtime.slidepad.pointerId != null) return;
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                event.preventDefault();
                const rect = center.getBoundingClientRect();
                runtime.slidepad.pointerId = event.pointerId;
                runtime.slidepad.originX = rect.left + rect.width / 2;
                runtime.slidepad.originY = rect.top + rect.height / 2;
                runtime.slidepad.moved = false;
                center.dataset.homeSlidepadDragging = 'true';
                try { center.setPointerCapture?.(event.pointerId); } catch {}
                beginQuickSet(event);
                updateFromPointer(event);
              },
              pointermove(event) {
                if (event.pointerId !== runtime.slidepad.pointerId) return;
                updateFromPointer(event);
                if (runtime.slidepad.moved) event.preventDefault();
              },
              pointerup(event) {
                if (event.pointerId !== runtime.slidepad.pointerId) return;
                updateFromPointer(event);
                const commit = runtime.slotRoll.state ? resolveSlotRollCommit(runtime.slotRoll.state) : null;
                const button = commit?.itemId
                  ? routeButtons(home).find((candidate) => routeId(candidate) === commit.itemId) || null
                  : null;
                resetGesture();
                event.preventDefault();
                event.stopPropagation();
                if (!runtime.active) return;
                if (button) button.click();
              },
              pointercancel(event) {
                if (event.pointerId !== runtime.slidepad.pointerId) return;
                resetGesture();
              },
              lostpointercapture(event) {
                if (event.pointerId !== runtime.slidepad.pointerId) return;
                resetGesture({ releaseCapture: false });
              },
            };
            runtime.slidepad.handlers = handlers;
            home.addEventListener('dblclick', handlers.dblclick);
            center.addEventListener('pointerdown', handlers.pointerdown);
            center.addEventListener('pointermove', handlers.pointermove);
            center.addEventListener('pointerup', handlers.pointerup);
            center.addEventListener('pointercancel', handlers.pointercancel);
            center.addEventListener('lostpointercapture', handlers.lostpointercapture);
          }
          '''
          text = text[:bind_start] + new_bind + text[bind_end:]

          refresh_old = "  bindSlidepad(home);\n  bindHomeModeSlotRoll(home);"
          refresh_new = "  unbindHomeModeSlotRoll();\n  bindSlidepad(home);"
          assert refresh_old in text
          text = text.replace(refresh_old, refresh_new, 1)

          snapshot_old = "    slidepadTargeting: 'straight-ray-target-side-adhesion',\n    slotRollModeBranchBound: Boolean(runtime.slotRoll.center && runtime.slotRoll.handlers),\n    slotRollModeBranchActive: Boolean(runtime.slotRoll.state),\n    slotRollModeItemId: runtime.slotRoll.state?.itemId ?? null,\n    slotRollModeSource: 'setup-data-mode-current-dom',"
          snapshot_new = "    slidepadTargeting: 'cyclic-home-route-quickset',\n    quickSetRouteRollActive: Boolean(runtime.slotRoll.state),\n    quickSetRouteItemId: runtime.slotRoll.state?.itemId ?? null,\n    quickSetRouteSource: 'existing-home-route-buttons',\n    slotRollModeBranchBound: false,\n    slotRollModeBranchActive: false,\n    slotRollModeItemId: null,\n    slotRollModeSource: 'disabled-home-child-mode-branch',"
          assert snapshot_old in text
          text = text.replace(snapshot_old, snapshot_new, 1)

          runtime_path.write_text(text)

          test_path = Path('tests/home-boot-presentation.test.mjs')
          tests = test_path.read_text()
          import_old = "  HOME_CONTEXTUAL_REPLAY_LABEL,\n"
          import_new = "  HOME_CONTEXTUAL_REPLAY_LABEL,\n  createHomeQuickSetSlotRoll,\n"
          assert import_old in tests
          tests = tests.replace(import_old, import_new, 1)

          core_import_marker = "} from '../browser/boot-loading-presentation-core.mjs';\n"
          assert core_import_marker in tests
          tests = tests.replace(
            core_import_marker,
            core_import_marker + "import { advanceSlotRollDrag, resolveSlotRollCommit } from '../browser/slidepad-slot-roll-core.mjs';\n",
            1,
          )

          test_marker = "test('Home pointer targeting follows the straight drag ray and actual target geometry, not a quadrant label', () => {"
          assert test_marker in tests
          added_tests = r'''test('Home Quick Set press starts on a real route and zero-move release can commit that anchor', () => {
            const quickSet = createHomeQuickSetSlotRoll({
              items: [
                { id: 'setup', label: 'Battle' },
                { id: 'shop', label: 'Shop' },
                { id: 'partner', label: 'Partner' },
                { id: 'cards', label: 'Deck' },
              ],
              centerWidth: 64,
            });
            assert.ok(quickSet);
            assert.equal(quickSet.anchorId, 'setup');
            assert.equal(resolveSlotRollCommit(quickSet.state)?.itemId, 'setup');
            assert.equal(resolveSlotRollCommit(quickSet.state)?.totalSteps, 0);
          });

          test('Home Quick Set preserves an existing selected route as the no-move anchor', () => {
            const quickSet = createHomeQuickSetSlotRoll({
              items: [
                { id: 'setup', label: 'Battle' },
                { id: 'shop', label: 'Shop' },
                { id: 'partner', label: 'Partner' },
                { id: 'cards', label: 'Deck' },
              ],
              selectedRouteId: 'partner',
              centerWidth: 64,
            });
            assert.equal(quickSet?.anchorId, 'partner');
            assert.equal(resolveSlotRollCommit(quickSet.state)?.itemId, 'partner');
          });

          test('Home Quick Set cycles both directions and wraps through the existing route gummies', () => {
            const quickSet = createHomeQuickSetSlotRoll({
              items: [
                { id: 'setup', label: 'Battle' },
                { id: 'shop', label: 'Shop' },
                { id: 'partner', label: 'Partner' },
                { id: 'cards', label: 'Deck' },
              ],
              centerWidth: 64,
            });
            let state = quickSet.state;
            state = advanceSlotRollDrag(state, { deltaPx: 64, detentPx: quickSet.detentPx }).state;
            assert.equal(state.itemId, 'shop');
            state = advanceSlotRollDrag(state, { deltaPx: 64 * 3, detentPx: quickSet.detentPx }).state;
            assert.equal(state.itemId, 'setup');
            state = advanceSlotRollDrag(state, { deltaPx: -64, detentPx: quickSet.detentPx }).state;
            assert.equal(state.itemId, 'cards');
            assert.equal(resolveSlotRollCommit(state)?.itemId, 'cards');
          });

          '''
          tests = tests.replace(test_marker, added_tests + test_marker, 1)
          test_path.write_text(tests)
          PY
      - name: Focused Home presentation tests
        run: node --test tests/home-boot-presentation.test.mjs
      - name: Verify old Home child-roll and no-move toggle are disconnected
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('browser/home-boot-runtime-mount.mjs').read_text()
          assert 'bindHomeModeSlotRoll(home);' not in text
          assert "if (!moved) {\n        center.click();" not in text
          assert "slidepadTargeting: 'cyclic-home-route-quickset'" in text
          assert 'createHomeQuickSetSlotRoll' in text
          PY
      - name: Commit product patch and remove temporary executor
        run: |
          git config user.name gameroad-runtime-bot
          git config user.email gameroad-runtime-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-home-quickset-r1b.yml
          git add browser/home-boot-runtime-mount.mjs tests/home-boot-presentation.test.mjs
          git commit -m "Home: connect existing gummies to cyclic Quick Set"
          git push origin HEAD:sol/home-quickset-current-integration-r1b-20260908
