name: FOSSIL R96 FIELD deep seam inspection

on:
  push:
    branches:
      - sol/fossil-field-binding-r96-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm exact inspection base and product bytes untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e878972e2bdb3df294a48b0aab11b0259a8a00a8)" = "e878972e2bdb3df294a48b0aab11b0259a8a00a8"
          git diff --name-only e878972e2bdb3df294a48b0aab11b0259a8a00a8...HEAD | tee /tmp/diff.txt
          test "$(grep -Ev '^(\.github/workflows/fossil-field-binding-r96-inspect\.yml|data/preaction-authorizations/FOSSIL-FIELD-BINDING-R96-20260905T2319-SOL-K7M4P2\.json)$' /tmp/diff.txt | wc -l)" -eq 0

      - name: Extract exact live movement ability save and field seams
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess

          path=Path('browser/GAMEROAD.html')
          text=path.read_text(encoding='utf-8',errors='replace')
          lines=text.splitlines()

          needles=[
            r'async function animateResolvedPath',
            r'function animateResolvedPath',
            r'p\.position\s*=',
            r'\.position\s*=\s*[^=]',
            r'async function resolveAbilityBundle',
            r'function resolveAbilityBundle',
            r'function resolveAbility',
            r'effect_type',
            r'const CARDS',
            r'window\.__CARD_DATA__',
            r'function savePack',
            r'function save\(',
            r'function load',
            r'SAVE_KEY',
            r'function startMatch',
            r'function newMatch',
            r'match=\{',
            r'roadEntries',
            r'normalMoveLimitForRoad',
            r'function reachable',
            r'function neighbors',
            r'function randomOrderByRoad',
            r'spawnHoneyFromRoads',
          ]

          def line_of(pos):
            return text.count('\n',0,pos)+1

          def char_snip(m, radius=5000):
            lo=max(0,m.start()-radius); hi=min(len(text),m.end()+radius)
            return text[lo:hi]

          hits={}
          for raw in needles:
            rx=re.compile(raw,re.I)
            arr=[]
            for m in list(rx.finditer(text))[:12]:
              arr.append({'line':line_of(m.start()),'match':m.group(0),'snippet':char_snip(m,3500)})
            hits[raw]=arr

          # Exact line windows around key live-flow functions, preserving whole source lines.
          windows=[]
          for key in ['animateResolvedPath','resolveHumanPlans','resolveAbilityBundle','savePack','function save(){','startMatch','randomOrderByRoad']:
            for i,line in enumerate(lines):
              if key in line:
                lo=max(0,i-2); hi=min(len(lines),i+3)
                windows.append({'key':key,'line':i+1,'context':'\n'.join(f'{n+1}: {lines[n]}' for n in range(lo,hi))})
                break

          # Search current product modules for fossil/stratum/landing producer or consumer.
          module_hits=[]
          for p in sorted(Path('browser').glob('*.mjs')):
            if p.name=='fossil-excavation-state-core.mjs':
              continue
            s=p.read_text(encoding='utf-8',errors='replace')
            for rx in [r'fossil',r'stratum',r'issueFossilsFromExcavation',r'resolveLandingInteraction',r'runNewBaseTurnWithRuntime']:
              m=re.search(rx,s,re.I)
              if m:
                module_hits.append({'path':p.as_posix(),'term':rx,'line':s.count('\n',0,m.start())+1})

          report={
            'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'base':'e878972e2bdb3df294a48b0aab11b0259a8a00a8',
            'hits':hits,
            'windows':windows,
            'moduleHits':module_hits,
          }
          Path('fossil-r96-deep-inspection.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          out=['# FOSSIL R96 deep live seam inspection','',f"HEAD {report['head']}",'']
          out.append('## Exact line windows')
          for w in windows:
            out += [f"### {w['key']} @ {w['line']}",'```text',w['context'],'```']
          out.append('')
          out.append('## Pattern hit summary')
          for k,v in hits.items():
            out.append(f'- `{k}`: '+(', '.join(str(x['line']) for x in v) if v else '0'))
          out.append('')
          out.append('## Non-core module hits')
          for x in module_hits:
            out.append(f"- {x['path']}:{x['line']} term={x['term']}")
          Path('fossil-r96-deep-inspection.md').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY

      - name: Upload deep seam evidence
        uses: actions/upload-artifact@v4
        with:
          name: fossil-r96-deep-inspection
          path: |
            fossil-r96-deep-inspection.json
            fossil-r96-deep-inspection.md
          if-no-files-found: error
