name: zz-temp-battle-controlled-character-html-r8
on:
  push:
    branches:
      - sol/battle-controlled-character-html-handoff-r8-20260909
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact live Battle handoff seams
        shell: python
        run: |
          from pathlib import Path
          html = Path('browser/GAMEROAD.html').read_text(encoding='utf-8').splitlines()
          ranges = [
              (16320,16410),
              (17920,18020),
              (20820,21090),
              (24070,24130),
              (24890,25230),
              (27570,28130),
          ]
          for lo, hi in ranges:
              print(f'===== HTML {lo}:{hi} =====')
              for n in range(lo, min(hi, len(html)) + 1):
                  print(f'{n}: {html[n-1]}')
          exact = [
              'createBattleBoardNakiFourPlayerVisualBinding',
              'createBattleControlledCharacterFourPlayerMotionDirector',
              'battle-board-naki-4p-visual-binding',
              'battle-controlled-character-4p-motion-director',
              'battle-controlled-character-motion-core',
              'function renderBoard',
          ]
          for needle in exact:
              hits=[i for i,line in enumerate(html,1) if needle in line]
              print('EXACT', needle, hits)
          build = Path('deploy/cloudflare/scripts/build.mjs').read_text(encoding='utf-8').splitlines()
          print('===== BUILD controlled-character refs =====')
          for i,line in enumerate(build,1):
              if any(k in line for k in ['battle-board-naki-4p-visual-binding','battle-controlled-character-4p-motion-director','battle-controlled-character-motion-core']):
                  print(f'{i}: {line}')
