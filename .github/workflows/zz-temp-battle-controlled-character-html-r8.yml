name: zz-temp-battle-controlled-character-html-r8
on:
  push:
    branches:
      - sol/battle-controlled-character-html-handoff-r8-20260909
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact live Battle marker and movement seams
        shell: python
        run: |
          from pathlib import Path
          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          needles = [
              'function renderBoardPlayers()',
              "el.className='boardPlayerToken'",
              'p.position=step',
              'p.position=finalPos',
              "setBattleRuntimeMotionState(el,{state:'move'",
              'setBattleRuntimeMotionState',
              'renderBoardPlayers()',
              "document.getElementById('battleRuntime')",
              '#battleRuntime',
              '.boardPlayerToken',
          ]
          for needle in needles:
              print('\n===== NEEDLE', repr(needle), '=====')
              start=0; shown=0
              while True:
                  idx=text.find(needle,start)
                  if idx<0: break
                  shown+=1
                  line=text.count('\n',0,idx)+1
                  col=idx-(text.rfind('\n',0,idx)+1)
                  lo=max(0,idx-2200); hi=min(len(text),idx+len(needle)+3200)
                  print('HIT',shown,'OFFSET',idx,'LINE',line,'COL',col)
                  print(text[lo:hi].replace('\r',''))
                  print('-----')
                  start=idx+len(needle)
                  if shown>=6: break
              print('COUNT_SHOWN',shown)
