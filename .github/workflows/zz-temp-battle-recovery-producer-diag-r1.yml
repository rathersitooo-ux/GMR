name: TEMP Battle recovery producer diagnostic R1

on:
  push:
    branches:
      - sol/battle-recovery-producer-diag-r1-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm PRE_ACTION
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/BATTLE-RECOVERY-PRODUCER-DIAG-R1-20260910T0330-SOL-Q8N4D2.json
          grep -F 'PREACTION_PROCEED_ALLOWED' data/preaction-authorizations/BATTLE-RECOVERY-PRODUCER-DIAG-R1-20260910T0330-SOL-Q8N4D2.json
      - name: Trace production presence through Battle lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          print('HTML_BYTES',len(text.encode('utf-8')))
          terms=[
            'friendApplyTransportPresence(',
            'friendPresenceEligible(',
            'FRIEND_PRESENCE',
            "kind==='disconnect'",
            "kind==='rejoin'",
            "kind==='sync'",
            "kind:'disconnect'",
            "kind:'rejoin'",
            "kind:'sync'",
            'new WebSocket',
            'WebSocket(',
            'friend-room-match',
            'friendRoomIneligible',
            'startMatch()',
            'startMatch(',
            'FR.sessionId',
            'FR.clientId',
            'FR.room',
            'FR.match',
          ]
          for term in terms:
            hits=[m.start() for m in re.finditer(re.escape(term),text)]
            print(f'TERM {term} COUNT {len(hits)} POS {hits[:20]}')
            for i,p in enumerate(hits[:8]):
              lo=max(0,p-1100);hi=min(len(text),p+len(term)+1900)
              sn=text[lo:hi].replace('\r',' ').replace('\n',' ')
              print(f'SNIP {term} #{i+1}',sn[:3200])

          # Identify the concrete transport-message handler(s) that call presence.
          for m in re.finditer(r'friendApplyTransportPresence\s*\(',text):
            p=m.start();lo=max(0,p-2600);hi=min(len(text),p+4600)
            print('PRESENCE_CALL_CONTEXT',text[lo:hi].replace('\r',' ').replace('\n',' ')[:7600])

          # Look for any Battle state fields carrying friend-room / transport identity.
          battleish=sorted(set(re.findall(r'state\.match\?*\.([A-Za-z0-9_$]*(?:friend|room|session|client|peer|transport)[A-Za-z0-9_$]*)',text,re.I)))
          print('BATTLE_IDENTITY_FIELDS',battleish)
          matchkeys=sorted(set(re.findall(r'(?:match|state\.match)\.([A-Za-z0-9_$]+)',text)))
          print('MATCH_KEYS_WITH_IDENTITY_HINT',[k for k in matchkeys if any(x in k.lower() for x in ('friend','room','session','client','peer','transport'))])

          # Existing friend-presence is sufficient for Battle only if an explicit post-start consumer exists.
          call_count=len(re.findall(r'friendApplyTransportPresence\s*\(',text))
          has_exact_2v2=all(x in text for x in ('create2v2ReconnectState','reconnect2v2Player','disconnect2v2Player'))
          has_match_identity=bool(battleish) or any(any(x in k.lower() for x in ('friend','room','session','client','peer','transport')) for k in matchkeys)
          print('VERDICT_PRESENCE_CALL_COUNT',call_count)
          print('VERDICT_EXACT_2V2_CORE_CONSUMER',int(has_exact_2v2))
          print('VERDICT_MATCH_CARRIES_TRANSPORT_IDENTITY',int(has_match_identity))
          PY
