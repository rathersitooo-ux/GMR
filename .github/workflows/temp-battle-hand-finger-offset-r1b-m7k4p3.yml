name: TEMP Battle hand finger offset R1B

on:
  push:
    branches:
      - sol/battle-hand-finger-offset-r1b-20260905

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-hand-finger-offset-r1b-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded Battle hand ghost offset patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime_path = Path('browser/battle-janken-slidepad-runtime-mount.mjs')
          test_path = Path('tests/battle-janken-slidepad-runtime-mount.test.mjs')
          runtime = runtime_path.read_text()
          tests = test_path.read_text()

          helper_marker = 'function addStyle(documentRef) {'
          helper = '''export function projectBattleHandDragGhostPosition({
            pointer,
            grabOffset,
            cardSize,
            viewportHeight = null,
          } = {}) {
            const x = Number(pointer?.x);
            const y = Number(pointer?.y);
            const grabX = Number(grabOffset?.x);
            const height = Number(cardSize?.height);
            if (![x, y, grabX, height].every(Number.isFinite) || height <= 0) return null;
            const left = x - grabX;
            const unclampedTop = y - height;
            const viewport = Number(viewportHeight);
            const maxTop = Number.isFinite(viewport) && viewport > 0
              ? Math.max(0, viewport - height)
              : Number.POSITIVE_INFINITY;
            const top = Math.min(Math.max(0, unclampedTop), maxTop);
            return deepFreeze({ left, top });
          }

          '''
          if 'export function projectBattleHandDragGhostPosition' not in runtime:
            if runtime.count(helper_marker) != 1:
              raise SystemExit('helper marker count mismatch')
            runtime = runtime.replace(helper_marker, helper + helper_marker, 1)

          state_old = '''      offset: { x: x - Number(rect.left), y: y - Number(rect.top) },
                moved: false,'''
          state_new = '''      offset: { x: x - Number(rect.left), y: y - Number(rect.top) },
                cardSize: { width: Number(rect.width), height: Number(rect.height) },
                moved: false,'''
          if state_old not in runtime:
            raise SystemExit('hand drag state marker missing')
          runtime = runtime.replace(state_old, state_new, 1)

          move_old = '''    state.ghost.style.left = `${(x - state.offset.x).toFixed(2)}px`;
              state.ghost.style.top = `${(y - state.offset.y).toFixed(2)}px`;'''
          move_new = '''    const ghostPosition = projectBattleHandDragGhostPosition({
                pointer: { x, y },
                grabOffset: state.offset,
                cardSize: state.cardSize,
                viewportHeight: globalRef?.innerHeight,
              });
              if (!ghostPosition) return false;
              state.ghost.style.left = `${ghostPosition.left.toFixed(2)}px`;
              state.ghost.style.top = `${ghostPosition.top.toFixed(2)}px`;'''
          if move_old not in runtime:
            raise SystemExit('hand drag movement marker missing')
          runtime = runtime.replace(move_old, move_new, 1)

          import_marker = '  projectBattleLoadCardPreview,\n'
          if '  projectBattleHandDragGhostPosition,\n' not in tests:
            if tests.count(import_marker) != 1:
              raise SystemExit('test import marker count mismatch')
            tests = tests.replace(import_marker, '  projectBattleHandDragGhostPosition,\n' + import_marker, 1)

          test_marker = "test('R75 preview projects only the actually armed selectable janken slot', () => {"
          test_block = '''test('ordinary hand drag ghost stays above the pointer while preserving horizontal grab position', () => {
            assert.deepEqual(
              projectBattleHandDragGhostPosition({
                pointer: { x: 420, y: 360 },
                grabOffset: { x: 40, y: 60 },
                cardSize: { width: 100, height: 140 },
                viewportHeight: 720,
              }),
              { left: 380, top: 220 },
            );
            assert.deepEqual(
              projectBattleHandDragGhostPosition({
                pointer: { x: 420, y: 80 },
                grabOffset: { x: 40, y: 60 },
                cardSize: { width: 100, height: 140 },
                viewportHeight: 720,
              }),
              { left: 380, top: 0 },
              'visual projection clamps at the viewport top instead of moving the pointer authority',
            );
          });

          test('ordinary hand drag integration keeps aura arming on the raw pointer rather than the lifted ghost', async () => {
            const { readFile } = await import('node:fs/promises');
            const source = await readFile(new URL('../browser/battle-janken-slidepad-runtime-mount.mjs', import.meta.url), 'utf8');
            assert.match(source, /projectBattleHandDragGhostPosition\(\{[\s\S]*pointer: \{ x, y \}/);
            assert.match(source, /isBattleHandAuraLaunchArmed\(\{\s*pointer: \{ x, y \}/);
          });

          '''
          if "ordinary hand drag ghost stays above the pointer" not in tests:
            if tests.count(test_marker) != 1:
              raise SystemExit('test insertion marker count mismatch')
            tests = tests.replace(test_marker, test_block + test_marker, 1)

          runtime_path.write_text(runtime)
          test_path.write_text(tests)
          PY
      - name: Focused Battle hand regression
        run: node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
      - name: Remove transient authorization and workflow, then commit product delta
        shell: bash
        run: |
          rm -f data/preaction-authorizations/BATTLE-HAND-FINGER-OFFSET-R1B-20260905T1804-SOL-M7K4P3.json
          rm -f .github/workflows/temp-battle-hand-finger-offset-r1b-m7k4p3.yml
          git config user.name 'gameroad-scoped-patch'
          git config user.email 'gameroad-scoped-patch@users.noreply.github.com'
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs data/preaction-authorizations/BATTLE-HAND-FINGER-OFFSET-R1B-20260905T1804-SOL-M7K4P3.json .github/workflows/temp-battle-hand-finger-offset-r1b-m7k4p3.yml
          git commit -m 'Battle: lift dragged card above finger'
          git push origin HEAD:sol/battle-hand-finger-offset-r1b-20260905
