name: Partner Advice R4 Exact Production Mount
on:
  push:
    branches:
      - work/PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001-R4-DIRECT-MOUNT
    paths:
      - .github/workflows/partner-advice-r4-inspect.yml
permissions:
  contents: write
jobs:
  mount:
    if: github.actor == 'rathersitooo-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact production replayFor mount
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = 'browser/GAMEROAD.html';
          const s = fs.readFileSync(p, 'utf8');
          const sha = crypto.createHash('sha256').update(s).digest('hex');
          const expectedSha = 'ae0aeb66374cbaf2e5f7c3edb58aff8cb43651e6cfb437cd3ab8e13a845a99e0';
          if (sha !== expectedSha) throw new Error(`HTML_SHA_MISMATCH:${sha}`);
          const old = "function replayFor(candidates,rule=currentPartnerRule()){if(!rule)return{ok:false,error:'PARTNER_RULE_NOT_SELECTED'};return partnerReplay({rule,candidates})}";
          const count = s.split(old).length - 1;
          if (count !== 1) throw new Error(`REPLAY_TOKEN_COUNT:${count}`);
          const mount = `/* PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R4 production mount */\nconst __grPartnerAdviceRuntimeMount={control:null,bridge:null,pendingVersions:null,pendingManifest:null,pendingStateProvider:null,error:null};\nfunction __grPartnerAdviceValidVersions(v){return !!v&&typeof v==='object'&&!Array.isArray(v)&&['rulesVersion','cardVersion','stateVersion'].every(k=>typeof v[k]==='string'&&v[k]&&v[k].trim()===v[k]&&v[k].length<=96)}\nwindow.__GAMEROAD_PARTNER_ADVICE_RUNTIME__=Object.freeze({\n  setVersions(v){if(!__grPartnerAdviceValidVersions(v))return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setVersions(v);__grPartnerAdviceRuntimeMount.pendingVersions={...v};return true},\n  setManifest(v){if(!v||typeof v!=='object'||Array.isArray(v))return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setManifest(v);__grPartnerAdviceRuntimeMount.pendingManifest=v;return true},\n  clearManifest(){__grPartnerAdviceRuntimeMount.pendingManifest=null;if(__grPartnerAdviceRuntimeMount.control)__grPartnerAdviceRuntimeMount.control.clearManifest()},\n  setRuntimeStateProvider(fn){if(fn!==null&&typeof fn!=='function')return false;if(__grPartnerAdviceRuntimeMount.control)return __grPartnerAdviceRuntimeMount.control.setRuntimeStateProvider(fn);__grPartnerAdviceRuntimeMount.pendingStateProvider=fn;return true},\n  status(){const status=__grPartnerAdviceRuntimeMount.control?__grPartnerAdviceRuntimeMount.control.status():{versionReady:!!__grPartnerAdviceRuntimeMount.pendingVersions,manifestReady:!!__grPartnerAdviceRuntimeMount.pendingManifest,runtimeStateReady:typeof __grPartnerAdviceRuntimeMount.pendingStateProvider==='function',mode:'loading-fallback'};return Object.freeze({...status,moduleReady:!!__grPartnerAdviceRuntimeMount.bridge,error:__grPartnerAdviceRuntimeMount.error})}\n});\nimport('./partner-advice-runtime-mount.mjs').then(({createPartnerAdviceReplayBridge,createPartnerAdviceRuntimeControl})=>{\n  const control=createPartnerAdviceRuntimeControl();\n  if(__grPartnerAdviceRuntimeMount.pendingVersions)control.setVersions(__grPartnerAdviceRuntimeMount.pendingVersions);\n  if(__grPartnerAdviceRuntimeMount.pendingManifest)control.setManifest(__grPartnerAdviceRuntimeMount.pendingManifest);\n  if(__grPartnerAdviceRuntimeMount.pendingStateProvider)control.setRuntimeStateProvider(__grPartnerAdviceRuntimeMount.pendingStateProvider);\n  __grPartnerAdviceRuntimeMount.control=control;\n  __grPartnerAdviceRuntimeMount.bridge=createPartnerAdviceReplayBridge({legacyReplay:partnerReplay,getVersions:control.getVersions,getManifest:control.getManifest,getRuntimeState:control.getRuntimeState});\n}).catch(error=>{__grPartnerAdviceRuntimeMount.error=String(error?.message||error||'PARTNER_RUNTIME_IMPORT_FAILED')});\nfunction replayFor(candidates,rule=currentPartnerRule()){if(!rule)return{ok:false,error:'PARTNER_RULE_NOT_SELECTED'};const bridge=__grPartnerAdviceRuntimeMount.bridge;return typeof bridge==='function'?bridge(candidates,rule):partnerReplay({rule,candidates})}`;
          const next = s.replace(old, mount);
          if ((next.match(/PARTNER-GOODMOVE-ADVICE-RUNTIME-INTEGRATION-001 R4 production mount/g) || []).length !== 1) throw new Error('R4_MARKER_COUNT');
          if (next.includes(old)) throw new Error('OLD_REPLAY_TOKEN_REMAINS');
          fs.writeFileSync(p, next);
          const outSha = crypto.createHash('sha256').update(next).digest('hex');
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/partner-advice-r4-result.txt', [
            `base_html_sha256=${sha}`,
            `result_html_sha256=${outSha}`,
            `old_replay_token_count=${count}`,
            'r4_marker_count=1',
            'runtime_module=browser/partner-advice-runtime-mount.mjs',
            'production_behavior_without_formal_versions=legacy-fallback',
            'formal_manifest_requires_explicit_versions=true',
          ].join('\n') + '\n');
          NODE
      - name: Validate partner runtime modules
        run: |
          node --check browser/partner-advice-runtime-mount.mjs
          node --check browser/partner-legal-action-adapter.mjs
          node --test tests/partner-legal-action-adapter.test.mjs tests/partner-advice-runtime-mount.test.mjs | tee -a artifacts/partner-advice-r4-result.txt
      - name: Commit production mount after PASS
        run: |
          git config user.name 'gameroad-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html artifacts/partner-advice-r4-result.txt
          git commit -m 'feat(partner): mount R4 advice runtime in production Browser'
          git push
