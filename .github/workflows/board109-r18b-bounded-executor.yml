              "  return [...refs].sort();\n}\n\nexport async function buildPackage",
              "  return [...refs].sort();\n}\n\nfunction relativePartnerModuleRefs(moduleInput) {\n  const text = Buffer.isBuffer(moduleInput) ? moduleInput.toString('utf8') : String(moduleInput ?? '');\n  const refs = new Set();\n  const patterns = [\n    /\\bfrom\\s*(['\"])(\\.\\.?\\/[^'\"?#]+\\.(?:mjs|js))(?:[?#][^'\"]*)?\\1/g,\n    /\\bimport\\s*(['\"])(\\.\\.?\\/[^'\"?#]+\\.(?:mjs|js))(?:[?#][^'\"]*)?\\1/g,\n    /\\bimport\\s*\\(\\s*(['\"])(\\.\\.?\\/[^'\"?#]+\\.(?:mjs|js))(?:[?#][^'\"]*)?\\1\\s*\\)/g,\n  ];\n  for (const pattern of patterns) {\n    for (const match of text.matchAll(pattern)) refs.add(match[2]);\n  }\n  return [...refs].sort();\n}\n\nfunction resolvePartnerModuleOutput(fromOutput, ref) {\n  if (typeof ref !== 'string' || (!ref.startsWith('./') && !ref.startsWith('../')) || ref.includes('\\\\')) {\n    throw new Error(`Unsupported Partner runtime dependency path in public package: ${ref}`);\n  }\n  const target = path.posix.normalize(path.posix.join(path.posix.dirname(fromOutput), ref));\n  if (!target || target === '.' || target === '..' || target.startsWith('../') || path.posix.isAbsolute(target)) {\n    throw new Error(`Partner runtime dependency escapes public package: ${fromOutput} -> ${ref}`);\n  }\n  return target;\n}\n\nexport async function assertPartnerRuntimeModuleDependencyCompleteness(moduleEntries, dist) {\n  const declared = new Set(moduleEntries.map((entry) => entry.output));\n  const observed = [];\n  for (const entry of moduleEntries) {\n    for (const ref of relativePartnerModuleRefs(entry.input)) {\n      const target = resolvePartnerModuleOutput(entry.output, ref);\n      if (!declared.has(target)) {\n        throw new Error(`Partner runtime dependency is not provenance-declared: ${entry.output} -> ${ref}`);\n      }\n      try {\n        await readFile(path.join(dist, ...target.split('/')));\n      } catch (error) {\n        if (error?.code === 'ENOENT') {\n          throw new Error(`Public package missing Partner runtime dependency: ${entry.output} -> ${ref}`);\n        }\n        throw error;\n      }\n      observed.push(`${entry.output}->${target}`);\n    }\n  }\n  return observed.sort();\n}\n\nexport async function buildPackage",
