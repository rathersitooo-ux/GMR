name: GAMEROAD Codex Shared Preview Pixel Evidence R6

on:
  push:
    branches:
      - sol/cloudflare-pr-preview-r2-20260909
    paths:
      - .github/workflows/zz-temp-cloudflare-pr-preview-r2.yml

permissions:
  contents: read

env:
  TARGET_SHA: a8248b609656436394a73b9a32acc3fd4f11d762
  PREVIEW_ALIAS_URL: https://codex-shared.gameroad-browser-r5.pages.dev

jobs:
  capture:
    name: Verify exact shared build and capture four-player Battle pixels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify shared alias build identity
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gameroad-version.json"
          code="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}' "$PREVIEW_ALIAS_URL/gameroad-version.json")"
          test "$code" = 200
          build_id="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.build_id||"")' "$body")"
          test "$build_id" = "$TARGET_SHA"
          echo "Exact shared build verified: $build_id"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Capture proven four-player Battle at two viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-visual
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const baseUrl = process.env.PREVIEW_ALIAS_URL;
          const targetSha = process.env.TARGET_SHA;
          const consoleErrors = [];
          const pageErrors = [];
          const httpErrors = [];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 667, height: 375 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('pageerror', (e) => pageErrors.push(String(e?.message ?? e)));
          page.on('response', (r) => { if (r.status() >= 400) httpErrors.push(`${r.status()} ${new URL(r.url()).pathname}`); });

          const response = await page.goto(`${baseUrl}/`, { waitUntil: 'commit', timeout: 30_000 });
          if (!response?.ok()) throw new Error(`shared preview navigation failed: ${response?.status()}`);
          await page.waitForFunction(() => Boolean(window.__GAMEROAD_TEST__) && Array.isArray(window.__CARD_DATA__), null, { timeout: 180_000 });

          const deckSetup = await page.evaluate(() => {
            const t = window.__GAMEROAD_TEST__;
            const publicMain = new Set(t.deckPublic().filter((card) => card.slot === 'main').map((card) => card.id));
            const standard = window.__CARD_DATA__
              .filter((card) => publicMain.has(card.id) && /^(SP|HT|DI|CL)$/.test(card.suit) && /^(A|[2-9]|10|J|Q|K)$/.test(String(card.rank)))
              .map((card) => card.id);
            const royalIds = ['SP_J', 'SP_Q', 'SP_K'];
            const nonRoyal = standard.filter((id) => !t.isRoyalCard(id));
            const main = [...nonRoyal.slice(0, 37), ...royalIds];
            const setValidation = t.deckSetDraft(main, []);
            const draftValidation = t.deckValidate(t.state.deckDraft, { forBattle: true });
            const committed = draftValidation.ok ? t.deckCommit() : false;
            const savedValidation = t.deckValidate(t.state.savedDeck, { forBattle: true });
            return { count: main.length, committed, savedValidation };
          });
          if (deckSetup.count !== 40 || !deckSetup.committed || !deckSetup.savedValidation?.ok) {
            throw new Error(`legal deck precondition failed: ${JSON.stringify(deckSetup)}`);
          }

          await page.evaluate(() => {
            const t = window.__GAMEROAD_TEST__;
            t.battlePresentationFast(false);
            t.start('4p', 'road_shield');
            window.__CODEX_SHARED_ROUND_PROMISE__ = t.autoRound();
          });

          const battle = page.locator('section[data-screen="battle"]');
          await battle.waitFor({ state: 'visible', timeout: 30_000 });
          await page.waitForFunction(() =>
            document.querySelectorAll('#publicPlayerStrip .publicPlayerChip').length === 4 &&
            document.querySelectorAll('#boardPlayers .boardPlayerToken').length === 4 &&
            Boolean(document.querySelector('#battleMap')),
            null,
            { timeout: 30_000 }
          );
          await page.waitForTimeout(700);

          const snapshot = () => page.evaluate(() => ({
            width: innerWidth,
            height: innerHeight,
            activeScreen: document.querySelector('.screen.active')?.dataset?.screen ?? null,
            mode: window.__GAMEROAD_TEST__?.state?.match?.mode ?? null,
            publicPlayers: document.querySelectorAll('#publicPlayerStrip .publicPlayerChip').length,
            boardPlayers: document.querySelectorAll('#boardPlayers .boardPlayerToken').length,
            jankenPads: document.querySelectorAll('[data-battle-janken-slidepad="1"]').length,
            battlePhaseVisible: Boolean(document.querySelector('#battlePhaseSurface')?.getClientRects().length),
            phaseTitle: document.querySelector('#phaseTitle')?.textContent?.trim() ?? null,
          }));

          await page.screenshot({ path: 'preview-visual/battle-667x375.png', animations: 'disabled', fullPage: false });
          const small = await snapshot();
          await page.setViewportSize({ width: 1280, height: 720 });
          await page.waitForTimeout(500);
          await page.screenshot({ path: 'preview-visual/battle-1280x720.png', animations: 'disabled', fullPage: false });
          const large = await snapshot();

          const manifestResponse = await context.request.get(`${baseUrl}/gameroad-version.json`);
          const manifest = manifestResponse.ok() ? await manifestResponse.json() : null;
          if (manifest?.build_id !== targetSha) throw new Error(`build mismatch: ${manifest?.build_id ?? 'missing'} != ${targetSha}`);

          const receipt = {
            schema: 'gameroad.codex-shared-visual-evidence.v1',
            source_sha: targetSha,
            shared_url: baseUrl,
            build_id: manifest.build_id,
            small,
            large,
            consoleErrors,
            pageErrors,
            httpErrors,
            production_touched: false,
            relay_touched: false,
          };
          fs.writeFileSync('preview-visual/receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          await browser.close();
          NODE

      - name: Upload rendered visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gameroad-codex-shared-visual-evidence
          path: preview-visual/
          if-no-files-found: error
          retention-days: 7
