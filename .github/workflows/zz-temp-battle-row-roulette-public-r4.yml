name: TEMP Battle Row Roulette Public R4

on:
  push:
    branches:
      - sol/battle-playable-hand-row-roulette-public-r4-20260908

permissions:
  contents: write

jobs:
  port-package-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@v4
        with:
          ref: sol/battle-playable-hand-row-roulette-public-r4-20260908
          fetch-depth: 0

      - name: Verify fresh base and authorization
        shell: bash
        run: |
          set -euo pipefail
          test -f data/preaction-authorizations/BATTLE-ROW-ROULETTE-PUBLIC-R4-20260908T0911-SOL-J8N4Q5.json
          git merge-base --is-ancestor d7de8b87420ba0c1015ba444b0cda734167c62a1 HEAD
          test "$(git hash-object browser/battle-janken-slidepad-runtime-mount.mjs)" = "703e07ff5b9f6741432547f38aac6c9517a06824"
          test "$(git hash-object tests/battle-janken-slidepad-runtime-mount.test.mjs)" = "87b9cfdfa77e37cbab32b09ec3579f32009e9095"
          test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "38ab855108b9aae4bfa24bf1a30c23af807a7dfb"
          test "$(git hash-object browser/battle-playable-hand-row-roulette-runtime.mjs)" = "edc2ed9a2066cbeda20fc5ba87bc32a99c2a02c9"

      - name: Port validated PR1315 live-mount delta only
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 318300e528abc83922288316861c8ed84a77bfa3^{commit}
          git checkout 318300e528abc83922288316861c8ed84a77bfa3 -- browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs
          grep -q "createBattlePlayableHandRowRouletteController" browser/battle-janken-slidepad-runtime-mount.mjs
          grep -q "remaining-hand row roulette live mount reuses the current playable projection" tests/battle-janken-slidepad-runtime-mount.test.mjs

      - name: Add real row-roulette runtime to public package artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('deploy/cloudflare/scripts/build.mjs')
          source = path.read_text()
          anchor = "  { source: 'browser/battle-janken-slidepad-runtime-mount.mjs', output: 'battle-janken-slidepad-runtime-mount.mjs', artifact: 'battle_janken_slidepad_runtime_mount', label: 'Battle janken SlidePad runtime mount' },\n"
          addition = anchor + "  { source: 'browser/battle-playable-hand-row-roulette-runtime.mjs', output: 'battle-playable-hand-row-roulette-runtime.mjs', artifact: 'battle_playable_hand_row_roulette_runtime', label: 'Battle playable hand row roulette runtime' },\n"
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one Battle janken artifact anchor, got {source.count(anchor)}')
          if 'battle_playable_hand_row_roulette_runtime' in source:
              raise SystemExit('row roulette artifact already present unexpectedly')
          path.write_text(source.replace(anchor, addition, 1))
          PY

      - name: Run focused Battle tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/battle-playable-hand-row-roulette-runtime.test.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs

      - name: Run public package provenance tests
        shell: bash
        run: |
          set -euo pipefail
          node --test deploy/cloudflare/tests/build.test.mjs

      - name: Verify final product diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only d7de8b87420ba0c1015ba444b0cda734167c62a1 -- browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs deploy/cloudflare/scripts/build.mjs | sort | tr '\n' ' ')"
          test "$changed" = "browser/battle-janken-slidepad-runtime-mount.mjs deploy/cloudflare/scripts/build.mjs tests/battle-janken-slidepad-runtime-mount.test.mjs "
          test "$(git diff --name-only d7de8b87420ba0c1015ba444b0cda734167c62a1 -- browser/GAMEROAD.html | wc -l)" -eq 0

      - name: Commit validated product and remove transient control files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-temp-battle-row-roulette-public-r4.yml
          rm -f data/preaction-authorizations/BATTLE-ROW-ROULETTE-PUBLIC-R4-20260908T0911-SOL-J8N4Q5.json
          git config user.name "gameroad-runtime-bot"
          git config user.email "gameroad-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "Battle: package live remaining-hand row roulette"
          git push origin HEAD:sol/battle-playable-hand-row-roulette-public-r4-20260908
