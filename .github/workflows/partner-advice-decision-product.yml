name: Partner Advice Decision Product

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'tools/partner-advice-decision-product.mjs'
      - 'tests/partner-advice-decision-product.test.mjs'
      - '.github/workflows/partner-advice-decision-product.yml'
      - 'tools/advice-collective-eval.mjs'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/partner-advice-decision-product.mjs'
      - 'tests/partner-advice-decision-product.test.mjs'
      - '.github/workflows/partner-advice-decision-product.yml'
      - 'tools/advice-collective-eval.mjs'

permissions:
  contents: read

jobs:
  partner-advice-decision-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Run Partner advice decision product tests
        run: node --test tests/partner-advice-decision-product.test.mjs
