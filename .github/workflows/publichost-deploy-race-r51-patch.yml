name: PublicHost deploy race R51 patch

on:
  push:
    branches:
      - work/publichost-deploy-race-r51-20260905
    paths:
      - .github/workflows/publichost-deploy-race-r51-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publichost-deploy-race-r51-20260905
          fetch-depth: 0
      - name: Apply exact trigger-race repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-public-deploy.yml')
          s = p.read_text()
          trigger = '''  workflow_dispatch:\n  workflow_run:\n    workflows: ["Required Gate auto-merge"]\n    types: [completed]\n'''
          if s.count(trigger) != 1:
              raise SystemExit(f'workflow_run trigger block count={s.count(trigger)}')
          s = s.replace(trigger, '  workflow_dispatch:\n', 1)

          lines = s.splitlines(keepends=True)
          concurrency_hits = 0
          job_guard_hits = 0
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('cancel-in-progress:') and 'workflow_run' in line:
                  concurrency_hits += 1
                  out.append('  cancel-in-progress: true\n')
                  continue
              if stripped.startswith('if:') and 'github.event_name' in line and 'workflow_run' in line:
                  job_guard_hits += 1
                  continue
              out.append(line)
          if concurrency_hits != 1:
              raise SystemExit(f'concurrency expression count={concurrency_hits}')
          if job_guard_hits != 1:
              raise SystemExit(f'deploy job guard count={job_guard_hits}')
          s = ''.join(out)
          if 'workflow_run:' in s or 'github.event.workflow_run' in s:
              raise SystemExit('workflow_run residue remains')
          p.write_text(s)
          PY
          git diff --check
          git diff -- .github/workflows/cloudflare-public-deploy.yml
      - name: Commit product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-r51
          git config user.email gameroad-r51@users.noreply.github.com
          git add .github/workflows/cloudflare-public-deploy.yml
          git commit -m 'Fix Cloudflare deploy trigger race'
          git push origin HEAD:work/publichost-deploy-race-r51-20260905
