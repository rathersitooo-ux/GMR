name: Deck Runtime R2 Fix Applicator

on:
  push:
    branches:
      - work/deck-runtime-integration-r2-fix-20260829

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deck-runtime-integration-r2-fix-20260829
      - name: Apply audited deck runtime fixes
        run: python tools/deck-runtime-r2-fix.py browser/GAMEROAD.html
      - name: Static check
        run: node tests/browser-static-check.mjs
      - name: Commit patched HTML
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html
          git diff --cached --quiet && exit 1
          git commit -m "fix(deck): close audited runtime integration defects"
          git push origin HEAD:work/deck-runtime-integration-r2-fix-20260829
