name: TEMP Browser BFI Home Legacy R5

on:
  push:
    branches:
      - sol/browser-bfi-home-legacy-r5-20260911

permissions:
  contents: write

jobs:
  finalize-home-legacy-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current R5 product state and branch ownership
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='ea1df495fa3e9b13a97ad8b3aaa2f793a0f85ca0'
          EXPECTED_PARENT='801917e70a7e1f4751f055258a523ea57c6efa3c'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch origin main sol/browser-bfi-home-legacy-r5-20260911
          test "$(git rev-parse origin/sol/browser-bfi-home-legacy-r5-20260911)" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$AUTH_BASE"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('browser/GAMEROAD.html').read_text(encoding='utf-8')
          retired = [
              'class="codexHomeVisualLayer"',
              'class="codexPartnerChip ',
              'class="codexBattleCta"',
          ]
          for needle in retired:
              if needle in text:
                  raise SystemExit(f'retired Home producer unexpectedly present: {needle}')
          old = "home:{primary:this.rect('.codexBattleCta'),character:null,live:this.rect('.codexHomeCenterStage')}"
          new = "home:{primary:this.rect('.homePadChoice[data-home-target=\"setup\"]'),character:null,live:this.rect('.codexHomeCenterStage')}"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale QA locator, found {text.count(old)}')
          if text.count(new) != 0:
              raise SystemExit('canonical QA locator already present unexpectedly')
          if 'data-home-target="setup"' not in text:
              raise SystemExit('canonical Home setup route missing')
          print('PASS: retired producers are gone; only stale QA locator remains')
          PY

      - name: Point existing QA geometry at canonical Home SlidePad target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/GAMEROAD.html')
          text = p.read_text(encoding='utf-8')
          old = "home:{primary:this.rect('.codexBattleCta'),character:null,live:this.rect('.codexHomeCenterStage')}"
          new = "home:{primary:this.rect('.homePadChoice[data-home-target=\"setup\"]'),character:null,live:this.rect('.codexHomeCenterStage')}"
          if text.count(old) != 1:
              raise SystemExit(f'stale QA locator exact-count mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Run existing focused Home regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/home-boot-runtime-prune-static.test.mjs
          node --test tests/home-boot-runtime-r3-regression.test.mjs
          node tests/browser-static-check.mjs

      - name: Commit product-only final tree
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='ea1df495fa3e9b13a97ad8b3aaa2f793a0f85ca0'
          git rm .github/workflows/zz-temp-browser-bfi-home-legacy-r5.yml
          mapfile -t changed < <(git diff --name-only "$AUTH_BASE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'browser/GAMEROAD.html'
          git diff --check "$AUTH_BASE"
          git config user.name 'gameroad-bounded-writer'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html
          git commit -m 'fix: point Home QA at canonical SlidePad target'
          git push origin HEAD:sol/browser-bfi-home-legacy-r5-20260911
