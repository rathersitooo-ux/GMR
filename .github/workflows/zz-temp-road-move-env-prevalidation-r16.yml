name: TEMP Road Move Environment Prevalidation R16
on:
  push:
    branches:
      - sol/road-move-env-prevalidation-r16-20260908
permissions:
  contents: read
jobs:
  prevalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/road-move-env-prevalidation-r16-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ephemeral Road candidate and LowPerf acceptance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            sol/road-move-bidirectional-live-r5-20260906:refs/remotes/origin/road-r5-donor \
            sol/road-move-bidirectional-live-r6-20260906:refs/remotes/origin/road-r6-donor
          git show refs/remotes/origin/road-r5-donor:tools/zz-temp-road-move-runtime-r5.py > /tmp/road-r16-base.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/road-r16-base.py')
          s=p.read_text()
          s=s.replace("BASE = '0be3a466b55cbd0af23244bc9fc90b2f5f6640fd'", "BASE = '2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb'")
          s=s.replace('ROAD-MOVE-RUNTIME-R5-20260906T2113-SOL-P8N4V6','ROAD-MOVE-ENV-PREVALIDATION-R16-20260908T0850-SOL-Q8N4M6')
          s=s.replace('.github/workflows/zz-temp-road-move-runtime-r5.yml','.github/workflows/zz-temp-road-move-env-prevalidation-r16.yml')
          s=s.replace("    'tools/zz-temp-road-move-runtime-r5.py',\n",'')
          s=s.replace('road-move-bidirectional-live-r5.spec.mjs','road-move-bidirectional-live-r16.spec.mjs')
          s=s.replace('ROAD-MOVE-BIDIRECTIONAL-R5','ROAD-MOVE-BIDIRECTIONAL-R16')
          s=s.replace('R5 source contract','R16 source contract').replace('R5_PATCH_READY','R16_PATCH_READY')
          p.write_text(s)
          PY
          python3 /tmp/road-r16-base.py
          git show refs/remotes/origin/road-r6-donor:tools/zz-temp-road-move-runtime-r6.py > /tmp/road-r16-post.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/road-r16-post.py')
          s=p.read_text().replace('tests/road-move-bidirectional-live-r6.spec.mjs','tests/road-move-bidirectional-live-r16.spec.mjs').replace('R6_POSTPATCH_READY','R16_POSTPATCH_READY')
          p.write_text(s)
          PY
          python3 /tmp/road-r16-post.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path('browser/GAMEROAD.html')
          s=html.read_text()
          old="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0];if(!me?.plan?.roadId){ctxSet('PLAN_CARD_MISSING',{message:'先にロードカードを選ぶと移動範囲を決められます。'});return}const path=shortest(me.position,id,normalMoveLimitForRoad(me.plan.roadId),me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          new="const __ctxBaseSelectEndpoint=selectEndpoint;selectEndpoint=function(id){const me=state.match?.players?.[0],moveLimit=draftMoveLimitForPlayer(me);if(moveLimit<1){ctxSet('PLAN_CARD_MISSING',{message:'移動に使えるロードカードがありません。'});return}const path=shortest(me.position,id,moveLimit,me);if(!path){ctxSet('MOVE_PATH_INVALID');return}const r=__ctxBaseSelectEndpoint(id);ctxClear();return r};"
          if s.count(old)!=1: raise SystemExit(f'context endpoint wrapper mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          html.write_text(s)

          spec=Path('tests/road-move-bidirectional-live-r16.spec.mjs')
          t=spec.read_text()
          stale='  expect(html).toContain("removeHand(p,p.plan.battleId)");'
          semantic='  expect(html).toContain("let battle=p.plan.battleId;");\n  expect(html).toContain("removeHand(p,battle)");'
          if stale not in t: raise SystemExit('stale Battle source assertion not found')
          t=t.replace(stale,semantic,1)
          anchor="async function snapshot(page){return page.evaluate(()=>window.__GAMEROAD_DIRECT_CARD_TEST__.snapshot())}\n"
          helper="""async function snapshot(page){return page.evaluate(()=>window.__GAMEROAD_DIRECT_CARD_TEST__.snapshot())}\nasync function physicalTapReachable(page,distance=1){\n  const point=await page.evaluate((distance)=>{\n    const nodes=[...document.querySelectorAll(`.node.reachable[data-move-distance=\"${distance}\"]`)];\n    for(const node of nodes){\n      const r=node.getBoundingClientRect(),style=getComputedStyle(node);\n      if(!(r.width>0&&r.height>0)||style.display==='none'||style.visibility==='hidden'||Number(style.opacity)===0)continue;\n      const x=r.left+r.width/2,y=r.top+r.height/2,hit=document.elementFromPoint(x,y);\n      if(hit&&(hit===node||node.contains(hit)))return{x,y,pos:node.dataset.pos};\n    }\n    return null;\n  },String(distance));\n  expect(point).not.toBeNull();\n  await page.mouse.click(point.x,point.y);\n}\nasync function physicalTapCard(page,id){\n  const point=await page.evaluate((id)=>{\n    const node=document.querySelector(`#hand .handCard[data-card-id=\"${CSS.escape(id)}\"]`);\n    if(!node)return null;\n    const r=node.getBoundingClientRect(),style=getComputedStyle(node);\n    if(!(r.width>0&&r.height>0)||style.display==='none'||style.visibility==='hidden'||Number(style.opacity)===0)return null;\n    const samples=[[.5,.18],[.3,.18],[.7,.18],[.5,.35],[.3,.35],[.7,.35],[.5,.65],[.3,.65],[.7,.65]];\n    for(const [fx,fy] of samples){\n      const x=r.left+r.width*fx,y=r.top+r.height*fy,hit=document.elementFromPoint(x,y);\n      if(hit&&(hit===node||node.contains(hit)))return{x,y};\n    }\n    return null;\n  },id);\n  expect(point).not.toBeNull();\n  await page.mouse.click(point.x,point.y);\n}\n"""
          if anchor not in t: raise SystemExit('snapshot helper anchor missing')
          t=t.replace(anchor,helper,1)
          t=t.replace('await next.click();','await physicalTapReachable(page,1);')
          t=t.replace('await target.click();','await physicalTapReachable(page,targetDistance);')
          if 'await card.click();' not in t: raise SystemExit('card-first click anchor missing')
          t=t.replace('await card.click();','await physicalTapCard(page,id);',1)
          spec.write_text(t)
          PY
          cat >> tests/road-move-bidirectional-live-r16.spec.mjs <<'EOF'

          test('LowPerf keeps move-first Road matching and Battle-card noninterference',async({page})=>{
            const battle=await openRoadBattle(page);
            const enabled=await page.evaluate(()=>{const e=document.querySelector('#lowPerf');if(!e)return false;if(!/ON/.test(e.textContent||''))e.click();return /ON/.test(e.textContent||'')});
            expect(enabled).toBe(true);
            const before=await snapshot(page);
            expect(before.roadId).toBeNull();
            expect(before.battleId).toBeNull();
            await physicalTapReachable(page,1);
            const moved=await snapshot(page);
            expect(moved.compatibleRoadIds.length).toBeGreaterThan(0);
            expect(moved.battleId).toBeNull();
            const id=moved.compatibleRoadIds[0];
            await physicalTapCard(page,id);
            const focused=await snapshot(page);
            expect(focused.roadId).toBe(id);
            expect(focused.battleId).toBeNull();
            expect(focused.path).toEqual(moved.path);
            await expect(battle.locator(`#hand .handCard[data-card-id="${id}"]`)).toHaveAttribute('data-road-move-state','FOCUSED');
          });
          EOF
          git diff --check
          node --test tests/road-move-compatibility-core.test.mjs
          printf 'base=%s\nhtml_blob_before=%s\n' "2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb" "$(git rev-parse 2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb:browser/GAMEROAD.html)" > r16-lowperf-evidence.txt
          printf 'candidate_html=%s\n' "$(git hash-object browser/GAMEROAD.html)" >> r16-lowperf-evidence.txt
          grep -F "test('LowPerf keeps move-first Road matching and Battle-card noninterference'" tests/road-move-bidirectional-live-r16.spec.mjs >/dev/null
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Run LowPerf Road prevalidation
        shell: bash
        run: |
          set -o pipefail
          cat > .road-r16-lowperf.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: 'road-move-bidirectional-live-r16.spec.mjs',
            timeout: 60000,
            expect: { timeout: 10000 },
            workers: 1,
            retries: 0,
            reporter: [['line']],
            use: { baseURL: 'http://127.0.0.1:4173', browserName: 'chromium', headless: true, viewport: { width: 844, height: 390 }, trace: 'off', screenshot: 'off', video: 'off' },
            webServer: { command: 'python3 -m http.server 4173 --bind 127.0.0.1', url: 'http://127.0.0.1:4173/browser/GAMEROAD.html', reuseExistingServer: false, timeout: 120000 }
          });
          EOF
          set +e
          npx playwright test --config=.road-r16-lowperf.config.mjs --workers=1 --grep "LowPerf keeps move-first Road matching" 2>&1 | tee -a r16-lowperf-evidence.txt
          code=${PIPESTATUS[0]}
          set -e
          printf 'playwright_exit=%s\n' "$code" >> r16-lowperf-evidence.txt
          rm -f .road-r16-lowperf.config.mjs
          exit "$code"
      - name: Verify branch product bytes remain unchanged
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          test "$(git rev-parse HEAD:browser/GAMEROAD.html)" = "$(git rev-parse 2cd8c32133350b2f41aeabf8f3a7efdd9cb32efb:browser/GAMEROAD.html)"
      - name: Upload LowPerf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-r16-lowperf-prevalidation
          path: r16-lowperf-evidence.txt
          if-no-files-found: warn
