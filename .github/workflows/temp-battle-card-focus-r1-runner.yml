name: temp battle card focus r1 product runner

on:
  push:
    branches:
      - sol/battle-card-focus-r1-20260909

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/battle-card-focus-r1-20260909
          fetch-depth: 0
      - name: Reuse bounded writer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/temp-battle-card-focus-r1.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_card_focus.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_card_focus.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/battle-card-focus-presentation.test.mjs')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              stripped = line.strip()
              indent = line[:len(line)-len(line.lstrip())]
              if stripped.startswith('assert.match(source, /data-card-focus='):
                  out.append(indent + 'assert.match(source, /data-card-focus="true"/);')
              elif stripped.startswith('assert.match(source, /data-card-focus-legal='):
                  out.append(indent + 'assert.match(source, /data-card-focus-legal="true"/);')
              elif stripped.startswith('assert.match(source, /data-card-staged='):
                  out.append(indent + 'assert.match(source, /data-card-staged="true"/);')
              else:
                  out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Focused tests
        shell: bash
        run: |
          node --test tests/battle-card-focus-presentation.test.mjs
          node --test tests/battle-janken-slidepad-runtime-mount.test.mjs
          git diff --check
      - name: Commit product delta only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/battle-janken-slidepad-runtime-mount.mjs tests/battle-card-focus-presentation.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "battle card focus product delta"
          git push origin HEAD:sol/battle-card-focus-r1-20260909
