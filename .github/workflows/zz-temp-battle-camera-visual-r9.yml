name: TEMP Battle Camera Visual R9

on:
  push:
    branches:
      - sol/battle-camera-visual-r9-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded camera visual repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e935ee9df7a595a2b1fc657152a5d08e6c0984e8" || true
          test "$(git hash-object browser/GAMEROAD.html)" = "5f06efc5b69b198ac56cb3a502f94f97d8a61880"
          git fetch origin sol/battle-camera-html-r8-20260913:refs/remotes/origin/sol/battle-camera-html-r8-20260913
          python - <<'PY'
          from pathlib import Path
          import subprocess

          html_path = Path('browser/GAMEROAD.html')
          donor = subprocess.check_output(
              ['git','show','origin/sol/battle-camera-html-r8-20260913:browser/GAMEROAD.html'],
              text=True,
          )
          s = donor

          old_btn = '<button class="railBtn" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る">自分</button>'
          assert s.count(old_btn) == 1, f'camera rail button count={s.count(old_btn)}'
          s = s.replace(old_btn, '')

          anchor = '<button class="railBtn warn" id="leaveMatch">退出</button></div><div class="targetBox floatingTarget"'
          replacement = '<button class="railBtn warn" id="leaveMatch">退出</button></div><button type="button" class="cameraReturnControl" id="cameraReturnBtn" aria-label="操作キャラへカメラを戻す" title="操作キャラへ戻る" hidden aria-hidden="true" tabindex="-1">自分</button><div class="targetBox floatingTarget"'
          assert s.count(anchor) == 1, f'rail close anchor count={s.count(anchor)}'
          s = s.replace(anchor, replacement)

          old_style = '''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}
          </style>'''
          new_style = '''<style id="gameroad-battle-camera-live-style">
          #battleMap[data-camera-live="1"]{touch-action:none}
          #cameraReturnBtn[hidden]{display:none!important}
          #cameraReturnBtn.cameraReturnControl{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px));z-index:34;min-width:52px;min-height:44px;padding:0 14px;border:1px solid rgba(210,238,244,.62);border-radius:999px;background:rgba(17,49,58,.88);color:#fff;font:700 13px/1 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.26);touch-action:manipulation}
          #cameraReturnBtn.cameraReturnControl[data-camera-mode="MANUAL_INSPECT"]{box-shadow:0 0 0 2px rgba(176,231,255,.58),0 6px 18px rgba(0,0,0,.28);background:rgba(17,66,82,.92)}
          </style>'''
          assert s.count(old_style) == 1, f'camera style block count={s.count(old_style)}'
          s = s.replace(old_style, new_style)

          old_destroy = "function destroy(){runtime?.destroy?.();runtime=null;key='';delete world.dataset.cameraMode;delete returnControl.dataset.cameraMode}"
          new_destroy = "function syncReturnControl(cameraState){const manual=cameraState?.mode==='MANUAL_INSPECT';returnControl.hidden=!manual;returnControl.setAttribute('aria-hidden',manual?'false':'true');returnControl.tabIndex=manual?0:-1;if(manual)returnControl.dataset.cameraMode='MANUAL_INSPECT';else delete returnControl.dataset.cameraMode}function destroy(){runtime?.destroy?.();runtime=null;key='';delete world.dataset.cameraMode;syncReturnControl(null)}"
          assert s.count(old_destroy) == 1, f'destroy anchor count={s.count(old_destroy)}'
          s = s.replace(old_destroy, new_destroy)

          old_apply = "applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode}});"
          new_apply = "applyView:(cameraState,meta)=>{adapter.applyView(cameraState,meta);world.dataset.cameraMode=cameraState.mode;syncReturnControl(cameraState)}});"
          assert s.count(old_apply) == 1, f'applyView anchor count={s.count(old_apply)}'
          s = s.replace(old_apply, new_apply)

          old_state = "const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;returnControl.dataset.cameraMode=cameraState.mode;return cameraState}"
          new_state = "const cameraState=runtime.getState();world.dataset.cameraMode=cameraState.mode;syncReturnControl(cameraState);return cameraState}"
          assert s.count(old_state) == 1, f'camera state anchor count={s.count(old_state)}'
          s = s.replace(old_state, new_state)

          assert '<div class="battleRail">' in s
          rail = s.split('<div class="battleRail">',1)[1].split('</div>',1)[0]
          assert 'cameraReturnBtn' not in rail, 'camera return leaked into persistent battleRail'
          assert s.count('id="cameraReturnBtn"') == 1
          assert 'hidden aria-hidden="true" tabindex="-1"' in s
          html_path.write_text(s, encoding='utf-8')

          test_path = Path('tests/browser-static-check.mjs')
          t = test_path.read_text(encoding='utf-8')
          test_anchor = '  errors.push(...collectHomeVisualShellErrors(html));\n'
          assert t.count(test_anchor) == 1, f'static insertion anchor count={t.count(test_anchor)}'
          camera_checks = r'''  const cameraReturnIds = html.match(/id=["']cameraReturnBtn["']/g) ?? [];
          if (cameraReturnIds.length !== 1) errors.push(`camera return control count is ${cameraReturnIds.length}, expected 1`);
          const battleRailMatch = html.match(/<div class=["']battleRail["']>([\s\S]*?)<\/div>/i);
          if (battleRailMatch?.[1]?.includes('cameraReturnBtn')) errors.push('camera return control is inside persistent battle rail');
          if (!/<button[^>]*class=["']cameraReturnControl["'][^>]*id=["']cameraReturnBtn["'][^>]*hidden[^>]*aria-hidden=["']true["'][^>]*tabindex=["']-1["']/i.test(html)) {
            errors.push('camera return control is not default-hidden/non-focusable outside the rail');
          }
          if (!/#cameraReturnBtn\[hidden\]\{display:none!important\}/.test(html)) errors.push('camera return hidden state does not guarantee zero footprint');
          if (!/const manual=cameraState\?\.mode==='MANUAL_INSPECT';returnControl\.hidden=!manual;/.test(html)) errors.push('camera return visibility is not bound only to MANUAL_INSPECT');
          if (!/__GAMEROAD_BATTLE_CAMERA_FIELD_ADAPTER__/.test(html) || !/mountBattleCameraLiveRuntime/.test(html)) errors.push('camera live adapter/runtime mount is missing');
          if (!/authority:\{gameplay:false,movement:false,target:false,legality:false,stateWrite:false\}/.test(html)) errors.push('camera field adapter lost gameplay-write firewall');
          '''
          t = t.replace(test_anchor, camera_checks + test_anchor)
          test_path.write_text(t, encoding='utf-8')
          PY
          git diff --check
          node --test tests/battle-camera-control-core.test.mjs tests/battle-camera-input-router.test.mjs tests/battle-camera-live-runtime.test.mjs
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          git diff -- browser/GAMEROAD.html tests/browser-static-check.mjs
      - name: Commit clean product delta and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gameroad-bot
          git config user.email gameroad-bot@users.noreply.github.com
          git rm .github/workflows/zz-temp-battle-camera-visual-r9.yml
          git rm data/preaction-authorizations/BATTLE-CAMERA-VISUAL-R9-20260914T0052-SOL.json
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' browser/GAMEROAD.html tests/browser-static-check.mjs | sort)"
          test "$changed" = "$expected"
          git commit -m 'Battle: カメラ復帰を確認中だけ表示 R9'
          git push origin HEAD:sol/battle-camera-visual-r9-20260914
