# product-patch-r5
name: TEMP Battle Hand7 Honey R3 Exact Patch
on:
  push:
    branches:
      - work/battle-hand7-honey-r3-20260903
    paths:
      - .github/workflows/zz-temp-battle-hand7-honey-r3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/battle-hand7-honey-r3-20260903
          fetch-depth: 0
      - name: Apply bounded patch
        run: python scripts/zz-temp-battle-hand7-honey-r3.py
      - name: Run conventional regression
        run: |
          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html
          node --test tests/new-base-turn-runtime-binding.test.mjs
      - name: Commit bounded product patch
        run: |
          git config user.name gameroad-exact-patch-bot
          git config user.email actions@users.noreply.github.com
          git add browser/GAMEROAD.html tests/browser-static-check.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Battle: apply corrected Hand7 and Honey round income R3"
          git push origin HEAD:work/battle-hand7-honey-r3-20260903
