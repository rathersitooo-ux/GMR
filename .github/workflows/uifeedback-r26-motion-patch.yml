name: TEMP UI R26 Motion Patch

on:
  push:
    branches:
      - work/uifeedback-r26-motion-temporal

permissions:
  contents: write

jobs:
  patch-current-browser:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/uifeedback-r26-motion-temporal
          fetch-depth: 0

      - name: Patch exact current Home gamepad edge semantics and regression lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('browser/GAMEROAD.html')
          html = html_path.read_text(encoding='utf-8')

          old_runtime = "const homeMotionRuntime={state:HOME_MOTION_STATES.EXPANDED,preview:'',busy:false,returnTimer:0,bridgeTimer:0,lastDirection:'',gamepadStamp:0};"
          new_runtime = "const homeMotionRuntime={state:HOME_MOTION_STATES.EXPANDED,preview:'',busy:false,returnTimer:0,bridgeTimer:0,lastDirection:'',gamepadStamp:0,gamepadAPressed:false,gamepadBPressed:false};"
          if old_runtime not in html:
              raise SystemExit('R26 runtime object source identity mismatch')
          if html.count(old_runtime) != 1:
              raise SystemExit(f'R26 runtime object expected once, got {html.count(old_runtime)}')
          html = html.replace(old_runtime, new_runtime, 1)

          old_poll = "function homeMotionGamepadPoll(){if(state.screen==='home'&&!homeMotionRuntime.busy){const pads=navigator.getGamepads?.()||[],pad=[...pads].find(Boolean);if(pad){const now=performance.now(),cool=now-homeMotionRuntime.gamepadStamp>230,ax=pad.axes?.[0]||0,ay=pad.axes?.[1]||0;if(cool){let dir='';if(ay<-.58&&Math.abs(ax)<.42)dir='up';else if(ax>.58&&Math.abs(ay)<.5)dir='right';else if(ax<-.48&&ay<-.22)dir='up-left';else if(ax<-.48&&ay>.22)dir='down-left';if(dir){homeMotionRuntime.gamepadStamp=now;homeMotionFocusDirection(dir)}else if(pad.buttons?.[0]?.pressed){homeMotionRuntime.gamepadStamp=now;const t=document.activeElement?.dataset?.homeTarget;if(t)homeMotionNavigate(t);else homeMotionToggle()}else if(pad.buttons?.[1]?.pressed){homeMotionRuntime.gamepadStamp=now;homeMotionToggle()}}}}requestAnimationFrame(homeMotionGamepadPoll)}"
          new_poll = "function homeMotionGamepadPoll(){const pads=navigator.getGamepads?.()||[],pad=[...pads].find(Boolean),aPressed=!!pad?.buttons?.[0]?.pressed,bPressed=!!pad?.buttons?.[1]?.pressed,aJustPressed=aPressed&&!homeMotionRuntime.gamepadAPressed,bJustPressed=bPressed&&!homeMotionRuntime.gamepadBPressed;homeMotionRuntime.gamepadAPressed=aPressed;homeMotionRuntime.gamepadBPressed=bPressed;if(state.screen==='home'&&!homeMotionRuntime.busy&&pad){const now=performance.now(),cool=now-homeMotionRuntime.gamepadStamp>230,ax=pad.axes?.[0]||0,ay=pad.axes?.[1]||0;let dir='';if(ay<-.58&&Math.abs(ax)<.42)dir='up';else if(ax>.58&&Math.abs(ay)<.5)dir='right';else if(ax<-.48&&ay<-.22)dir='up-left';else if(ax<-.48&&ay>.22)dir='down-left';if(dir&&cool){homeMotionRuntime.gamepadStamp=now;homeMotionFocusDirection(dir)}if(aJustPressed){const t=document.activeElement?.dataset?.homeTarget;if(t)homeMotionNavigate(t);else homeMotionToggle()}else if(bJustPressed){homeMotionToggle()}}requestAnimationFrame(homeMotionGamepadPoll)}"
          if old_poll not in html:
              raise SystemExit('R26 Home gamepad poll source identity mismatch')
          if html.count(old_poll) != 1:
              raise SystemExit(f'R26 Home gamepad poll expected once, got {html.count(old_poll)}')
          html = html.replace(old_poll, new_poll, 1)
          html_path.write_text(html, encoding='utf-8')

          test_path = Path('tests/browser-runtime-smoke.spec.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          marker = "test('Home gamepad confirm and cancel are edge-triggered under held input'"
          if marker in test_text:
              raise SystemExit('R26 temporal browser test already exists unexpectedly')
          test_text += r'''

          test('Home gamepad confirm and cancel are edge-triggered under held input', async ({ page }) => {
            await page.addInitScript(() => {
              const qaPad = { a: false, b: false, axes: [0, 0] };
              Object.defineProperty(globalThis, '__GAMEROAD_QA_PAD__', {
                configurable: false,
                enumerable: false,
                writable: false,
                value: qaPad,
              });
              const button = (pressed) => ({ pressed, touched: pressed, value: pressed ? 1 : 0 });
              Object.defineProperty(Navigator.prototype, 'getGamepads', {
                configurable: true,
                value() {
                  const s = globalThis.__GAMEROAD_QA_PAD__;
                  return [{
                    connected: true,
                    index: 0,
                    id: 'GAMEROAD QA STANDARD GAMEPAD',
                    mapping: 'standard',
                    timestamp: performance.now(),
                    axes: [...s.axes],
                    buttons: [button(s.a), button(s.b)],
                  }];
                },
              });
            });

            const response = await page.goto('/browser/GAMEROAD.html', { waitUntil: 'domcontentloaded' });
            expect(response, 'main HTML response').not.toBeNull();
            expect(response.ok(), `main HTML status ${response.status()}`).toBeTruthy();
            await page.waitForLoadState('load');
            await page.waitForTimeout(300);

            const trace = [];
            const snap = async (label) => {
              trace.push(await page.evaluate((entryLabel) => ({
                label: entryLabel,
                t: Number(performance.now().toFixed(1)),
                nav: window.GAMEROAD_NAV_QA?.snapshot?.() ?? null,
                motion: window.GAMEROAD_HOME_MOTION_QA?.snapshot?.() ?? null,
                activeTarget: document.activeElement?.dataset?.homeTarget ?? null,
              }), label));
            };
            const setPad = async (patch) => page.evaluate((next) => Object.assign(globalThis.__GAMEROAD_QA_PAD__, next), patch);
            const focusSetup = async () => page.evaluate(() => {
              window.GAMEROAD_NAV_QA.root('home');
              window.GAMEROAD_HOME_MOTION_QA.expand();
              const target = document.querySelector('.homePadChoice[data-home-target="setup"]');
              if (!target) throw new Error('Home setup motion target missing');
              target.focus();
            });

            await setPad({ a: false, b: false, axes: [0, 0] });
            await page.waitForTimeout(80);
            await focusSetup();
            await snap('home-focused-before-A');

            await setPad({ a: true });
            await page.waitForTimeout(360);
            await snap('after-A-edge');
            expect((await page.evaluate(() => window.GAMEROAD_NAV_QA.snapshot().screen))).toBe('setup');

            await page.evaluate(() => {
              window.GAMEROAD_NAV_QA.root('home');
              window.GAMEROAD_HOME_MOTION_QA.expand();
              document.querySelector('.homePadChoice[data-home-target="setup"]')?.focus();
            });
            await page.waitForTimeout(620);
            await snap('A-held-after-return-home');
            expect((await page.evaluate(() => window.GAMEROAD_NAV_QA.snapshot().screen))).toBe('home');

            await setPad({ a: false });
            await page.waitForTimeout(80);
            await setPad({ a: true });
            await page.waitForTimeout(360);
            await snap('A-repress');
            expect((await page.evaluate(() => window.GAMEROAD_NAV_QA.snapshot().screen))).toBe('setup');

            await setPad({ a: false, b: false });
            await page.waitForTimeout(80);
            await page.evaluate(() => {
              window.GAMEROAD_NAV_QA.root('home');
              window.GAMEROAD_HOME_MOTION_QA.expand();
              const center = document.getElementById('homePadCenter');
              if (!center) throw new Error('Home motion center missing');
              globalThis.__GAMEROAD_QA_B_MUTATIONS__ = 0;
              new MutationObserver((records) => {
                for (const record of records) {
                  if (record.attributeName === 'aria-expanded') globalThis.__GAMEROAD_QA_B_MUTATIONS__ += 1;
                }
              }).observe(center, { attributes: true, attributeFilter: ['aria-expanded'] });
            });
            await setPad({ b: true });
            await page.waitForTimeout(720);
            await snap('B-held');
            const bEvidence = await page.evaluate(() => ({
              mutations: globalThis.__GAMEROAD_QA_B_MUTATIONS__,
              expanded: document.getElementById('homePadCenter')?.getAttribute('aria-expanded'),
              screen: window.GAMEROAD_NAV_QA.snapshot().screen,
            }));
            expect(bEvidence.screen).toBe('home');
            expect(bEvidence.mutations).toBe(1);
            expect(bEvidence.expanded).toBe('false');

            await setPad({ b: false });
            console.log(`GAMEROAD_HOME_GAMEPAD_TEMPORAL ${JSON.stringify({ trace, bEvidence })}`);
            test.info().annotations.push({
              type: 'home-gamepad-temporal',
              description: JSON.stringify({ trace, bEvidence }),
            });
          });
          '''
          test_path.write_text(test_text, encoding='utf-8')

          gate_path = Path('.github/workflows/gameroad-required-gate.yml')
          gate = gate_path.read_text(encoding='utf-8')
          old_case = "              browser/GAMEROAD.html|\\\n              browser/screen-navigation-core.mjs|\\\n              tests/screen-navigation-core.test.mjs|\\"
          new_case = "              browser/GAMEROAD.html|\\\n              browser/screen-transition-core.mjs|\\\n              tests/screen-transition-core.test.mjs|\\\n              browser/screen-navigation-core.mjs|\\\n              tests/screen-navigation-core.test.mjs|\\"
          if old_case not in gate:
              raise SystemExit('R26 Required Gate browser classifier identity mismatch')
          gate = gate.replace(old_case, new_case, 1)
          old_cmd = "          node --test tests/screen-navigation-core.test.mjs\n          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html"
          new_cmd = "          node --test tests/screen-navigation-core.test.mjs tests/screen-transition-core.test.mjs\n          node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html"
          if old_cmd not in gate:
              raise SystemExit('R26 Required Gate Browser test command identity mismatch')
          gate = gate.replace(old_cmd, new_cmd, 1)
          gate_path.write_text(gate, encoding='utf-8')
          PY

      - name: Focused transition-core test before commit
        run: node --test tests/screen-transition-core.test.mjs

      - name: Remove temporary executor and commit durable patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/uifeedback-r26-motion-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser/GAMEROAD.html browser/screen-transition-core.mjs tests/screen-transition-core.test.mjs tests/browser-runtime-smoke.spec.mjs .github/workflows/gameroad-required-gate.yml .github/workflows/uifeedback-r26-motion-patch.yml
          git diff --cached --check
          git commit -m 'UI R26: enforce Home gamepad edge semantics and temporal regression'
          git push origin HEAD:work/uifeedback-r26-motion-temporal
