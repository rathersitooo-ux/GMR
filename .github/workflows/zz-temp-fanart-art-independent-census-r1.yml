name: FanArt Art-Independent Card Registry Census R1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4

      - name: Read Browser-only card objects
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('browser/GAMEROAD.html', 'utf8');
          const marker = 'window.__CARD_DATA__';
          const markerPos = html.indexOf(marker);
          if (markerPos < 0) throw new Error('window.__CARD_DATA__ missing');
          const eqPos = html.indexOf('=', markerPos + marker.length);
          function expressionEnd(source, start) {
            let quote = null, escape = false, round = 0, square = 0, curly = 0, began = false;
            for (let i = start; i < source.length; i += 1) {
              const ch = source[i];
              if (quote) {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === '"' || ch === "'" || ch === '`') { quote = ch; began = true; continue; }
              if (/\s/.test(ch) && !began) continue;
              began = true;
              if (ch === '(') round += 1;
              else if (ch === ')') round -= 1;
              else if (ch === '[') square += 1;
              else if (ch === ']') square -= 1;
              else if (ch === '{') curly += 1;
              else if (ch === '}') curly -= 1;
              else if (ch === ';' && round === 0 && square === 0 && curly === 0) return i;
            }
            throw new Error('unterminated card-data expression');
          }
          const rhs = html.slice(eqPos + 1, expressionEnd(html, eqPos + 1)).trim();
          const data = vm.runInNewContext(`(${rhs})`, Object.create(null), { timeout: 1500 });
          const cards = Array.isArray(data) ? data : data.cards;
          const targets = new Set(['DCG_AB_SHIELD','DCG_SLAYKIA','GED']);
          const found = cards.filter(card => targets.has(String(card?.id ?? '')));
          console.log('BROWSER_ONLY_CARD_OBJECTS=' + JSON.stringify(found));
          if (found.length !== 3) throw new Error(`expected 3 Browser-only card objects, got ${found.length}`);
          NODE
