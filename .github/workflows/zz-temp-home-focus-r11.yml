name: TEMP R11 Home pressed snap executor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-prove-pressed-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gr/ui-feedback-r11-homefocus
          fetch-depth: 2
      - name: Exact-base and state guard
        id: guard
        shell: bash
        env:
          EXPECTED_BASE: cb34bf4d6c205493fa78b6997186df257fc7b899
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          grep -Fq 'brightness(1.08) drop-shadow(0 0 2px rgba(255,255,255,.98))' browser/GAMEROAD.html
          if grep -Fq '.homePadChoice:active,.homePadChoice.pressed{transform:translateY(1px) scale(.985);transition:none}' browser/GAMEROAD.html; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.already != 'true'
        with:
          node-version: '22'
      - name: Install Playwright
        if: steps.guard.outputs.already != 'true'
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Prepare time-series probe
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          mkdir -p .r11-press/evidence
          cat > .r11-press/probe.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const phase=process.env.R11_PHASE;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:4173/browser/GAMEROAD.html',{waitUntil:'domcontentloaded'});
          const control=page.locator('.home.codexHome [data-home-target="cards"]:visible').first();
          await control.waitFor({state:'visible',timeout:15000});
          const sample=()=>control.evaluate((el)=>{const art=el.querySelector('.codexPadArt');const cs=getComputedStyle(el);return {transform:cs.transform,transition:cs.transition,artFilter:art?getComputedStyle(art).filter:null};});
          const series={phase,normalPath:{},focusedPath:{}};
          await page.evaluate(()=>document.activeElement instanceof HTMLElement&&document.activeElement.blur());
          await page.waitForTimeout(200);
          await control.evaluate(el=>el.classList.add('pressed'));
          series.normalPath.t0=await sample();
          await page.waitForTimeout(20); series.normalPath.t20=await sample();
          await page.screenshot({path:path.resolve(`.r11-press/evidence/${phase}-normalpath-t20.png`)});
          await page.waitForTimeout(60); series.normalPath.t80=await sample();
          await page.waitForTimeout(100); series.normalPath.t180=await sample();
          await control.evaluate(el=>el.classList.remove('pressed'));
          await page.waitForTimeout(200);
          await control.focus();
          await page.waitForTimeout(200);
          series.focusedPath.before=await sample();
          await control.evaluate(el=>el.classList.add('pressed'));
          series.focusedPath.t0=await sample();
          await page.waitForTimeout(20); series.focusedPath.t20=await sample();
          await page.screenshot({path:path.resolve(`.r11-press/evidence/${phase}-focuspath-t20.png`)});
          await page.waitForTimeout(60); series.focusedPath.t80=await sample();
          await control.evaluate(el=>el.classList.remove('pressed'));
          if(phase==='after'){
            for(const [route,states] of Object.entries({normalPath:series.normalPath,focusedPath:series.focusedPath})){
              for(const key of ['t0','t20']){
                const raw=states[key].transform;
                const m=raw.match(/^matrix\(([^,]+),[^,]+,[^,]+,([^,]+),[^,]+,([^\)]+)\)$/);
                if(!m) throw new Error(`${route}/${key}: unexpected transform ${raw}`);
                const sx=Number(m[1]),sy=Number(m[2]),ty=Number(m[3]);
                if(sx>.99||sy>.99||ty<.8) throw new Error(`${route}/${key}: press is not immediately depressed: ${raw}`);
                if(states[key].transition!=='none') throw new Error(`${route}/${key}: pressed transition still delays feedback: ${states[key].transition}`);
                if(!String(states[key].artFilter).includes('brightness(0.92)')) throw new Error(`${route}/${key}: pressed art feedback missing`);
              }
            }
          }
          await fs.writeFile(path.resolve(`.r11-press/evidence/${phase}-series.json`),JSON.stringify(series,null,2));
          await browser.close();
          EOF
      - name: Start Browser server
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/r11-press-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/browser/GAMEROAD.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/r11-press-http.log
          exit 1
      - name: Capture pre-snap time series
        if: steps.guard.outputs.already != 'true'
        env: { R11_PHASE: before }
        run: node .r11-press/probe.mjs
      - name: Apply immediate pressed-state transform
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('browser/GAMEROAD.html'); s=p.read_text(encoding='utf-8')
          old='.homePadChoice:active,.homePadChoice.pressed{transform:translateY(1px) scale(.985)}'
          new='.homePadChoice:active,.homePadChoice.pressed{transform:translateY(1px) scale(.985);transition:none}'
          if s.count(old)!=1: raise SystemExit(f'pressed rule count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Capture and assert post-snap time series
        if: steps.guard.outputs.already != 'true'
        env: { R11_PHASE: after }
        run: node .r11-press/probe.mjs
      - name: Commit pressed-start repair
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameroad-r11-executor'
          git config user.email 'actions@users.noreply.github.com'
          git add browser/GAMEROAD.html
          test "$(git diff --cached --name-only)" = 'browser/GAMEROAD.html'
          git commit -m 'UI feedback R11: make Home press feedback immediate'
          git push origin HEAD:gr/ui-feedback-r11-homefocus
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.already != 'true' && always()
        with:
          name: r11-home-pressed-timeseries
          path: .r11-press/evidence/
          if-no-files-found: error
          retention-days: 14
