name: Deck runtime R2 task-private applicator

on:
  push:
    branches:
      - work/deck-runtime-integration-r2-fix-20260829

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: work/deck-runtime-integration-r2-fix-20260829
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact audited fixes
        run: python3 tools/deck-runtime-r2-fix.py browser/GAMEROAD.html

      - name: Verify Browser static contract
        run: node tests/browser-static-check.mjs --self-test browser/GAMEROAD.html

      - name: Commit product fix and remove task-private applicator
        env:
          BRANCH: work/deck-runtime-integration-r2-fix-20260829
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/deck-runtime-r2-fix.py .github/workflows/deck-runtime-r2-fix.yml
          git add browser/GAMEROAD.html
          git diff --cached --check
          git commit -m 'fix(deck): close post-integration runtime gaps'
          git push origin HEAD:"${BRANCH}"
