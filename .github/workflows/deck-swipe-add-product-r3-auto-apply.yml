name: Deck Swipe Add Product R3 Auto Apply

on:
  push:
    branches:
      - work/deck-swipe-add-product-r3-20260829

permissions:
  contents: write

concurrency:
  group: deck-swipe-add-product-r3
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/deck-swipe-add-product-r3-20260829
          fetch-depth: 0

      - name: Apply bounded Product Mount patch
        run: python3 tools/deck-swipe-add-product-r3-apply.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Browser smoke including deck swipe regression
        run: npx playwright test --config=playwright.config.mjs --workers=1

      - name: Remove task-private applicator
        run: |
          rm -f tools/deck-swipe-add-product-r3-apply.py
          rm -f .github/workflows/deck-swipe-add-product-r3-auto-apply.yml

      - name: Commit verified Product Mount
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gameroad-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A browser/GAMEROAD.html tests/browser-runtime-smoke.spec.mjs tools/deck-swipe-add-product-r3-apply.py .github/workflows/deck-swipe-add-product-r3-auto-apply.yml
          if git diff --cached --quiet; then
            echo "No Product Mount changes to commit"
            exit 0
          fi
          git commit -m "feat: add right-swipe deck insertion R3"
          git push origin HEAD:work/deck-swipe-add-product-r3-20260829
