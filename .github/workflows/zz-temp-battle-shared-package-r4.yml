name: temp-battle-shared-package-r4

on:
  push:
    branches:
      - sol/battle-shared-package-train-r4-20260910

permissions:
  contents: write

jobs:
  package-current-merged-battle-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm PRE_ACTION and exact branch
        run: |
          test "$GITHUB_REF_NAME" = "sol/battle-shared-package-train-r4-20260910"
          test -f data/preaction-authorizations/BATTLE-SHARED-PACKAGE-TRAIN-R4-20260910T0533-SOL-PKG-Q8N4M10.json
          grep -F 'PREACTION_PROCEED_ALLOWED' data/preaction-authorizations/BATTLE-SHARED-PACKAGE-TRAIN-R4-20260910T0533-SOL-PKG-Q8N4M10.json
      - name: Patch exact shared package whitelist
        run: |
          if grep -Fq 'BATTLE_SHARED_PUBLIC_PACKAGE_TRAIN_R4' deploy/cloudflare/scripts/build.mjs; then
            echo 'package R4 already applied; verification-only rerun'
          else
            test "$(git hash-object deploy/cloudflare/scripts/build.mjs)" = "b4b168a05fb2defc0048a885a08d7159cde933b0"
            python tools/temp-battle-shared-package-r4.py
          fi
      - name: Verify exact package spec multiplicity
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('deploy/cloudflare/scripts/build.mjs').read_text(encoding='utf-8')
          sources=[
            'browser/battle-interaction-feedback-runtime.mjs',
            'browser/battle-screen-presentation-core.mjs',
            'browser/battle-critical-resource-hud-runtime.mjs',
            'browser/battle-resolution-action-order-adapter.mjs',
            'browser/battle-resolution-board-return-presentation-core.mjs',
            'browser/battle-screen-runtime-mount.mjs',
            'browser/battle-critical-resource-hud-live-adapter.mjs',
            'browser/new-base-goal-result-core.mjs',
            'browser/new-base-goal-arrival-presentation-core.mjs',
            'browser/new-base-goal-arrival-runtime-mount.mjs',
            'browser/new-base-goal-arrival-consumer.mjs',
            'browser/battle-goal-arrival-live-adapter.mjs',
            'browser/battle-goal-arrival-live-integration.mjs',
            'browser/triad-resolver-core.mjs',
            'browser/battle-janken-processing-order-authority-adapter.mjs',
          ]
          for source in sources:
            count=text.count(f"source: '{source}'")
            assert count == 1, (source,count)
            assert Path(source).is_file(), source
          print('EXACT_PACKAGE_SPECS_PASS',len(sources))
          PY
      - name: Run focused Battle and package tests
        run: |
          tests=(
            deploy/cloudflare/tests/build.test.mjs
            tests/battle-interaction-feedback-runtime.test.mjs
            tests/battle-screen-runtime-mount.test.mjs
            tests/battle-critical-resource-hud-live-adapter.test.mjs
            tests/battle-goal-arrival-live-integration.test.mjs
            tests/battle-janken-processing-order-authority-adapter.test.mjs
          )
          for test_file in "${tests[@]}"; do test -f "$test_file"; done
          node --test "${tests[@]}"
      - name: Build actual public package and verify outputs
        run: |
          rm -rf deploy/cloudflare/dist
          node deploy/cloudflare/scripts/build.mjs \
            --source-commit "$(git rev-parse HEAD)" \
            --published-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > /tmp/gameroad-package-r4-manifest.json
          outputs=(
            battle-interaction-feedback-runtime.mjs
            battle-screen-presentation-core.mjs
            battle-critical-resource-hud-runtime.mjs
            battle-resolution-action-order-adapter.mjs
            battle-resolution-board-return-presentation-core.mjs
            battle-screen-runtime-mount.mjs
            battle-critical-resource-hud-live-adapter.mjs
            new-base-goal-result-core.mjs
            new-base-goal-arrival-presentation-core.mjs
            new-base-goal-arrival-runtime-mount.mjs
            new-base-goal-arrival-consumer.mjs
            battle-goal-arrival-live-adapter.mjs
            battle-goal-arrival-live-integration.mjs
            triad-resolver-core.mjs
            battle-janken-processing-order-authority-adapter.mjs
          )
          for output in "${outputs[@]}"; do test -s "deploy/cloudflare/dist/$output"; done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('deploy/cloudflare/dist/manifest.json').read_text())
          keys=[
            'battle_interaction_feedback_runtime','battle_screen_presentation_core','battle_critical_resource_hud_runtime',
            'battle_resolution_action_order_adapter','battle_resolution_board_return_presentation_core','battle_screen_runtime_mount',
            'battle_critical_resource_hud_live_adapter','new_base_goal_result_core','new_base_goal_arrival_presentation_core',
            'new_base_goal_arrival_runtime_mount','new_base_goal_arrival_consumer','battle_goal_arrival_live_adapter',
            'battle_goal_arrival_live_integration','triad_resolver_core','battle_janken_processing_order_authority_adapter'
          ]
          for key in keys: assert key in m['artifacts'], key
          print('ACTUAL_PUBLIC_PACKAGE_R4_PASS',len(keys),m['source_commit'])
          PY
      - name: Diff guard and commit product patch
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No product delta on verification-only rerun'
            exit 0
          fi
          test "$changed" = "deploy/cloudflare/scripts/build.mjs"
          git config user.name "gameroad-bounded-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/cloudflare/scripts/build.mjs
          git commit -m "Battle: merge済み公開runtimeを共有packageへ統合 R4"
          git push origin HEAD:"$GITHUB_REF_NAME"
